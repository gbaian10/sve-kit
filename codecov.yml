# Codecov is informational: the 90% gate lives in pytest and ci-ok is the only required check.
comment:
  layout: "header, diff, files, footer"
  require_changes: false # comment on every PR, not only when coverage drops

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# Bundle size of sim/web: warn on a change above the threshold, never fail.
bundle_analysis:
  warning_threshold: "5%"
  status: informational

github_checks:
  annotations: false
