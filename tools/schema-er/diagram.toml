# Snapshot fields carry no FK markers, so `*_id` names are matched to collections:
# `*_unit_id` is text_unit, otherwise the longest trailing word run that names a collection.
# List here the names that rule gets wrong or cannot resolve. A `table.field` key applies to that
# field only and may name a non-`*_id` field that the document says references a collection.
# An empty string means the field is an identifier but not a reference to a snapshot collection.
[snapshot.references]
"qa.current_version_id" = "qa_version"
"stamp.series_code" = "vocabulary"          # export/snapshot-format.md §8
family_id = "product_family"
home_set_id = "product_family"
image_id = "image_asset"
interaction_target_id = "digital_card"
profile_id = "rules_profile"
replacement_revision_id = "ruling_revision"
revision_id = "face_revision"
dsl_id = ""
entry_id = ""
int_id = ""
official_id = ""
ruling_id = ""

# Regression guard: each entry must come out as one complete constraint relation,
# written `table: FK(cols)→target(cols)` exactly as the page labels it.
[checks]
constraint_fks = [
    "art: FK(face_id,card_id)→face(id,card_id)",
    "printing_face: FK(printing_id,card_id)→printing(id,card_id)",
    "printing_face: FK(face_id,card_id)→face(id,card_id)",
    "printing_face: FK(art_id,face_id)→art(id,face_id)",
]
# Constraints with fixed constants: the line must pair the real column with the target column
# at the same position, written `table.column → target.column`.
constraint_anchors = [
    "stamp.series_code → vocabulary.code",
    "route_override.route_key → card_route.route_key",
    "art.face_id → face.id",
]
