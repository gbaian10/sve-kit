schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: flow-box-new-ability-r3-01
kind: flow
must_pass: true
mechanisms:
  - A 箱詰め
  - 能力取得順序
cards:
  - BP01-149
  - BP01-173
  - BP21-PR04
why: 封箱失去既有能力，但之後新取得的守護有效；以守護限定目標及阻擋攻擊觀察。
discriminates: 持續刪除所有新能力會導致陽光起動失敗；完全不刪舊能力則第二分支不能攻擊主戰者。
refs:
  rules:
    - 5.31.2
    - 5.31.2.1
  qa:
    - Q1499
    - Q1717
evidence:
  - ref: Q1499
    quote: "Q: 【箱詰め】状態のフォロワーに『守護の陽光』の《ファンファーレ》能力で【守護】を付与することはできますか？\nA: はい。【箱詰め】状態のフォロワーに対して【守護】などの能力を付与することができます。"
    derivation:
      - 封箱失去既有能力，但之後新取得的守護有效；以守護限定目標及阻擋攻擊觀察。
  - ref: Q1717
    quote: "Q: 『死の祝福』によって、【守護】を持った相手の場のフォロワーを【箱詰め】状態にしました。その後、相手のターンが終了し【箱詰め】状態が解除された場合、『死の祝福』によって持った【守護】はどうなりますか？\nA: 【箱詰め】状態の間は【守護】を失いますが、【箱詰め】状態が解除された場合、持っていた【守護】などの能力は元に戻り有効となります。"
    derivation:
      - 封箱失去既有能力，但之後新取得的守護有效；以守護限定目標及阻擋攻擊觀察。
  - ref: cr 5.31.2
    quote: 【箱詰め】状態になったカードは、【箱詰め】状態で ある間、そのカードが持つ能力、および【箱詰め】状 態になった時点でそのカードが得ていたすべての能 力を失います。
    derivation:
      - 封箱失去既有能力，但之後新取得的守護有效；以守護限定目標及阻擋攻擊觀察。
  - ref: cr 5.31.2.1
    quote: 【箱詰め】状態になったカードが後に能力を 得る場合、その能力は得ます。
    derivation:
      - 封箱失去既有能力，但之後新取得的守護有效；以守護限定目標及阻擋攻擊觀察。
status: verified
author: astra
