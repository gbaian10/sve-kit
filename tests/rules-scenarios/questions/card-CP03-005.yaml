schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-CP03-005
kind: card
must_pass: true
mechanisms: [本回合事件歷史, 第 N 次攻擊被 Quick 破壞也算, 8.4.5, 8.4.7, 8.4.9, 攻撃したとき與 Quick 的先後, Vanguard：憑依、驅動]
cards: [CP03-005, CP03-009, BP09-113, BP01-173]
why: >-
  潮騒の水将 アルゴス「自分の場のアクアフォース・フォロワーが攻撃したとき、このターン、3回目の…攻撃なら、自分のリーダーは体力+2する。1枚引く」。
  「攻撃した」事象在 8.4.5 發生；攻擊者之後在 8.4.7 的クイック 被神罰破壞、8.4.9 沒造成傷害，這次攻擊仍算一次（Q1375）。
  誘發的能力在 8.4.6 的檢查時點、也就是クイック 之前結算（Q1387）。第 1、2 次只誘發不生效；第 3 次（a4）才 +2 並抽 1。
discriminates: >-
  只把「造成傷害的攻擊」或「攻擊者仍在場的攻擊」算進次數的引擎：after-decision-9 不會回復、不抽牌（要到第 4 次才生效）。
  把アルゴス 的誘發排在クイック 之後的引擎：after-decision-2 不會停在 choose-pending（會先要求 P2 的クイック）。
refs:
  rules: [8.4.5, 8.4.6, 8.4.7, 8.4.9, 10.7.1, 10.7.2, 12.3.2]
  qa: [Q1375, Q1387, Q1385, Q1386]
evidence:
  - ref: Q1375
    quote: はい。攻撃フォロワーがクイックタイミングで破壊されていても攻撃した事象は発生しているため、「そのターン中に自分の場のアクアフォース・フォロワーが攻撃した回数」に数えることができます。
  - ref: Q1387
    quote: このフォロワーの能力が誘発し解決するタイミングが先です。【攻撃時】能力などフォロワーが攻撃したときに誘発する能力をすべて解決した後、非ターンプレイヤーのクイックタイミングが訪れます。
  - ref: Q1385
    quote: はい。3回目の場合のみ有効です。攻撃したフォロワーを含めて、このターン中の自分の場のアクアフォース・フォロワーの攻撃が2回目の場合や、4回目以降の場合は有効ではありません。
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: A：xverify-2/result.md:269〈全部實質核驗局面的索引〉（8.4.5、8.4.6、Q1375、Q1387）

scenarios:
  - name: A 第 1 次攻擊的攻擊者被神罰破壞仍算一次 → 第 3 次攻擊時アルゴス 生效
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 6, P2: 5}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: エルフ, life: 20}
          pp: {current: 6, max: 6}
          zones:
            field:
              - {id: a1, card: CP03-005}          # 潮騒の水将 アルゴス 1/3
              - {id: a2, card: CP03-009}          # ティアーナイト ヴァレリア 1/1
              - {id: a3, card: CP03-009}
              - {id: a4, card: CP03-009}
            deck:
              - {id: d1, card: BP01-173}
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 4, max: 5}
          zones:
            hand:
              - {id: q1, card: BP09-113}          # 神罰（クイック、コスト4：破壊）
              - {filler: 2}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: attack, attacker: a2, target: P2.leader}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}, event: {attacked: a2}}}
      - {n: 3, by: P2, at: quick, do: play, card: q1, targets: {1: [a2]}}
      - {n: 4, by: P2, at: quick, do: pass}
      - {n: 5, by: P1, at: main, do: attack, attacker: a3, target: P2.leader}
      - {n: 6, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}, event: {attacked: a3}}}
      - {n: 7, by: P2, at: quick, do: pass}
      - {n: 8, by: P1, at: main, do: attack, attacker: a4, target: P2.leader}
      - {n: 9, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}, event: {attacked: a4}}}
      - {n: 10, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a2: {acted: true}
        events:
          - {kind: 攻撃, attacker: a2, target: P2.leader}
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, line: 2}, event: {attacked: a2}}}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P1.field: [a1, a3, a4]
          P1.cemetery: [a2]
          P2.leader.life: 20
          P2.pp.current: 0
          P2.cemetery: [q1]
        events:
          - {kind: 破壊, object: a2}
        forbidden_events:
          - {kind: ダメージ}
          - {kind: 体力増加}
      - at: after-decision-7
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 19
          P1.leader.life: 20
          P1.hand: []
        forbidden_events:
          - {kind: 体力増加}
          - {kind: 引く}
      - at: after-decision-9
        view: omniscient
        outcome: resolved
        assert:
          P1.leader.life: 22
          P1.hand: [d1]
          semantic_state.counters_this_turn: {P1.attacks: 3}
        events:
          - {kind: 体力増加, target: P1.leader, amount: 2}
          - {kind: 引く, player: P1, object: d1}
      - at: after-decision-10
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 18
