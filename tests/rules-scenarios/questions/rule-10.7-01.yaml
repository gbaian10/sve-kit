schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: rule-10.7-01
kind: rule
must_pass: true
mechanisms: [10.7.2.2, 10.7.4.1.2, 10.7.5, 9.1.4.4, 每回合 N 次, 時限誘發, 最後資訊, 重複, Quick 時點]
cards: [BP11-074, BP16-T18, BP01-180, BP01-056, BP01-173, BP16-049, BP06-072, SD02-002]
why: >-
  （A）大ツルハシの骸「ターンごとに1回、元のコスト1の自分のトークン・カードが場を離れたとき、それと同名のトークン・カード1枚を場に出す」：
  兩隻ゴースト同時離場只待機 1 次（10.7.2.2，由主人選哪個誘發事件；Q1550）；ゴースト是 token，進墓場後立即消去（9.1.4.4），
  但能力仍用它在場上時的資訊（10.7.4.1.2）知道「同名」是ゴースト；同回合第二次離場不再誘發。
  （B）神秘の獲得「次に自分のエンドフェイズが来たとき」是時限誘發（10.7.5）：在對手回合以クイック打出，對手的結束階段不誘發（Q191），
  自己下一個結束階段才誘發並消滅整個 EX 區（含非本效果放入的卡，Q189）；「くり返す」到 EX 上限為止。
discriminates: >-
  A：把每回合 1 次實作成「每次離場各待機、結算時才檢查次數」或不限次數的引擎，會出現 2 個 場に出す；忘記 token 消去後仍要用最後資訊的引擎會找不到同名而什麼都不出；
  第二張エンジェルバレッジ後不能再有 待機。B：把「自分のエンドフェイズ」誤判成任何結束階段的引擎會在 after-decision-5 消滅 EX；
  把時限誘發綁在來源卡（已在墓場）而失效的引擎在 after-decision-7 不會消滅。
refs:
  rules: [10.7.2.2, 10.7.4.1.2, 10.7.5, 10.7.5.1, 9.1.4.4, 9.1.3.1, 5.5.2, 12.3.4, 8.4.7, 8.4.8, 7.4.1, 7.4.5, 4.8.3.1, 3.1.2.3]
  qa: [Q1550, Q1552, Q191, Q189, Q190]
evidence:
  - ref: Q1550
    quote: >-
      Q: 『フォレストバット』と『ゴースト』などカード名の異なる元のコスト1のトークン・カードが同時に場を離れた場合、その中からどのトークンを場に出すか選択できますか？ A: はい。選択できます。
    derivation:
      - 同時離場時只待機一次，主人選哪一個誘發事件（10.7.2.2）；本題兩隻同名，選哪個都出ゴースト
  - ref: Q1552
    quote: はい。相手のターン中であっても誘発します。
  - ref: cr 10.7.2.2
    quote: ‘ターンごとに（数値）回’という表記を持つ自動能力が誘発条件を満たした場合、この自動能力は最大で、（数値）からこのターン中にこの自動能力が待機状態になった回数を引いた回数まで待機状態になります。
  - ref: cr 10.7.4.1.2
    quote: カードが場からそれ以外の領域に移動することによって誘発する自動能力がカードの情報を求める場合、そのカードが場にある時点での情報を用います。
    derivation:
      - ゴースト移到墓場後被消去（9.1.4.4），「それと同名」仍依它在場上時的卡名判定
  - ref: Q191
    quote: いいえ。自分のエンドフェイズが来たときのみのため、消滅させません。
  - ref: Q189
    quote: はい。消滅させます。
  - ref: cr 10.7.5
    quote: なんらかの効果により、以降の特定の時点で誘発条件が発生する自動能力が作成されることがあります。これを時限誘発と呼びます。
    derivation:
      - 時限誘發的主人是產生它的效果的主人（3.1.2.3）＝P1；來源卡已在墓場不影響
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: A／B：xverify-2/recheck.md:99〈全部改動局面的核對索引〉

scenarios:
  - name: A 兩隻ゴースト同時離場 → 只待機 1 次 → 出 1 隻ゴースト；同回合再離場不誘發
    setup:
      turn: {active: P2, first_player: P1, elapsed_turns: {P1: 4, P2: 4}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ナイトメア, life: 20}
          pp: {current: 0, max: 4}
          zones:
            field:
              - {id: a1, card: BP11-074}          # 大ツルハシの骸 3/3
              - {id: a2, card: BP16-T18}          # ゴースト 1/1 token
              - {id: a3, card: BP16-T18}          # ゴースト 1/1 token
            hand:
              - {filler: 2}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ビショップ, life: 20}
          pp: {current: 4, max: 4}
          zones:
            hand:
              - {id: b2, card: BP01-180}          # エンジェルバレッジ
              - {id: b3, card: BP01-180}          # エンジェルバレッジ
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P2, at: main, do: play, card: b2}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 1}, event: {left_field: a2}}}
      - {n: 3, by: P2, at: main, do: play, card: b3}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, line: 1}, event: {left_field: a2}}}
            - {do: choose-pending, pending: {ability: {source: a1, line: 1}, event: {left_field: a3}}}
        assert:
          P1.field: [a1]
          P1.field.a1: {hp: 2}
          P1.cemetery: []
        events:
          - {kind: 破壊, object: a2, by: rule-11.3.1, group: 1}
          - {kind: 破壊, object: a3, by: rule-11.3.1, group: 1}
          - {kind: 消去, object: a2, group: 2}
          - {kind: 消去, object: a3, group: 2}
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          semantic_state.pending_triggers: []
          P1.field: [a1, new-1]
          P1.field.new-1: {name: ゴースト, entered_from: other, entered_by: effect}
        events:
          - {kind: プレイ, ability: {source: a1, line: 1}}
          - {kind: 場に出す, object: new-1, to: P1.field}
        events_exact: [場に出す]
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.field: [a1]
          P1.field.a1: {hp: 1}
          semantic_state.pending_triggers: []
        events:
          - {kind: 破壊, object: new-1, by: rule-11.3.1}
          - {kind: 消去, object: new-1}
        forbidden_events:
          - {kind: 待機}
          - {kind: 場に出す}

  - name: B 神秘の獲得 在對手回合以クイック打出：對手的結束階段不誘發，自己的下一個結束階段誘發並消滅整個 EX 區
    setup:
      turn: {active: P2, first_player: P2, elapsed_turns: {P1: 4, P2: 5}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ウィッチ, life: 20}
          pp: {current: 4, max: 5}
          zones:
            hand:
              - {id: a1, card: BP01-056}          # 神秘の獲得（クイック）
            deck:
              - {id: a2, card: BP01-173}
              - {id: a3, card: BP01-173}
              - {id: a4, card: BP01-173}
              - {id: a5, card: BP16-049}
              - {id: a6, card: BP16-049}
              - {id: a7, card: BP06-072}          # 下回合開始階段抽到
              - {filler: 14}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 5}
          zones:
            field:
              - {id: b1, card: SD02-002}          # ヴァンガード・レイサム 3/3
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P2, at: main, do: attack, attacker: b1, target: P1.leader}
      - {n: 2, by: P1, at: quick, do: play, card: a1}
      - {n: 3, by: P1, at: quick, do: pass}
      - {n: 4, by: P2, at: main, do: end-phase}
      - {n: 5, by: P1, at: quick, do: pass}
      - {n: 6, by: P1, at: main, do: end-phase}
      # 9.12 延遲誘發的指稱：{source: 建立它的物件, line, delayed: true}，來源已在墓場仍用它
      - {n: 7, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 3, delayed: true}}}
      # 題目到此為止（下一個輸入點是 P2 的 7.4.5 クイック時點）：不再 pass 推進到 P2 的回合，避免 P2 抽到 filler（契約 10.10；互驗第二輪修正，astra）
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P1.ex: [a2, a3, a4, a5, a6]
          P1.deck: [a7, filler: 14]
          P1.cemetery: [a1]
          P1.leader.life: 17
        events:
          - {kind: プレイ, object: a1}
          - {kind: 移動, object: a2, from: P1.deck, to: P1.ex}
          - {kind: 移動, object: a6, from: P1.deck, to: P1.ex}
          - {kind: ダメージ, source: b1, target: P1.leader, amount: 3}
      - at: after-decision-5
        view: omniscient
        outcome: resolved
        assert:
          turn: {active: P1, phase: main}
          P1.ex: [a2, a3, a4, a5, a6]
          P1.banish: []
          P1.hand: [a7]
          P1.pp: {current: 6, max: 6}
        forbidden_events:
          - {kind: 消滅}
          - {kind: 待機}
      - at: after-decision-7
        view: omniscient
        outcome: resolved
        assert:
          P1.ex: []
          P1.banish: [a2, a3, a4, a5, a6]
        events:
          - {kind: 待機, ability: {source: a1, line: 3, delayed: true}}
          - {kind: プレイ, ability: {source: a1, line: 3, delayed: true}}
          - {kind: 消滅, object: a2, group: 1}
          - {kind: 消滅, object: a3, group: 1}
          - {kind: 消滅, object: a4, group: 1}
          - {kind: 消滅, object: a5, group: 1}
          - {kind: 消滅, object: a6, group: 1}
