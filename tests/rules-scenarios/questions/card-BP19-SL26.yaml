schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: card-BP19-SL26
kind: card
must_pass: true
mechanisms:
  - 查看牌庫上方多步驟
  - 隨機與擲骰
cards:
  - BP01-173
  - BP19-SL26
why: 看牌後才選入手的一張；不足八張看全部，其餘受控洗牌置底。
discriminates: 先選再看、把其餘留頂或少看一張會得到不同手牌或牌庫。
refs:
  rules:
    - 5.11.1
    - 1.3.2
    - 5.9.1
    - 10.6.2.8.2
  qa: []
evidence:
  - ref: cr 5.11.1
    quote: "‘デッキを上から N 枚見る’指示がある場合、指定\nプレイヤーはそのデッキ置き場の一番上から N 枚\nの情報を知ることができます。"
    derivation:
      - 看牌後才選入手的一張；不足八張看全部，其餘受控洗牌置底。
  - ref: cr 1.3.2
    quote: "なんらかの理由によりプレイヤーが実行不可能なこ\nとを行うように求められた場合、それは単に行われ\nません。同様に、効果により一定の量の行動を行う\nよう求められた場合、その一部のみ実行不可能な\n場合、可能な限りその行動を行います。"
    derivation:
      - 看牌後才選入手的一張；不足八張看全部，其餘受控洗牌置底。
  - ref: cr 5.9.1
    quote: "デッキを‘シャッフルする’指示がある場合、その\nデッキ置き場が属するプレイヤーは、そのデッキ置\nき場にあるカードの順番を無作為に変更します。"
    derivation:
      - 看牌後才選入手的一張；不足八張看全部，其餘受控洗牌置底。
  - ref: cr 10.6.2.8.2
    quote: "プレイしたのがスペルや起動能力や\n自動能力である場合、そのテキストや能力\nに示された効果を、表記の順に従って実行\nします。"
    derivation:
      - 看牌後才選入手的一張；不足八張看全部，其餘受控洗牌置底。
status: draft
author: astra
verified_by: []
scenarios:
  - name: 可看 1 張
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - id: d0
                card: BP01-173
            hand:
              - id: a
                card: BP19-SL26
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: a
      - n: 2
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 2
      - n: 3
        by: P1
        at: resolve
        do: resolve-choice
        of:
          decision: 2
          occurrence: 1
        select:
          - d0
    random:
      shuffles:
        - player: P1
          zone: deck
          result: []
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: paused
        assert:
          P1.hand: []
        awaiting:
          by: P1
          choices:
            - do: resolve-choice
              select:
                - d0
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.hand:
            - d0
          P1.deck: []
