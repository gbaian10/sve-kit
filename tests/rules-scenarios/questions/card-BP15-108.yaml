schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP15-108
kind: card
must_pass: true
mechanisms: [攻擊力可以是負數, 1.3.2.4, 負值當作行動基準時視為 0, 1.3.2.2.1, 0 傷害不發生, 1.3.2.2, 「相手のメインフェイズが来たとき」, 7.3.1, 非回合玩家的待機能力, 10.5.2.3, 回合交替]
cards: [BP15-108, BP19-081, BP01-173, BP01-176]
why: >-
  安息の隠者（1/5）「相手のメインフェイズが来たとき、相手の場のフォロワーすべてに「これの攻撃力」と同じダメージ」。被ゲノムエル 的 −3/−3 影響後攻擊力是 −2（1.3.2.4 可以是負數，Q2586）；
  以負值為基準做加減算以外的行動 → 視為 0（1.3.2.2.1）→ 0 傷害不發生（1.3.2.2），沒有 ダメージ 事件。
  誘發時點是對手的メインフェイズ 開始（7.3.1）→ 檢查時點由非回合玩家 P1 打出（10.5.2.3）。B：沒有減值時攻擊力 1 → 各 1 傷害。
discriminates: >-
  把攻擊力截在 0、或把負值直接當傷害（「−2 ダメージ」變成回復或負體力）的引擎，A 的 b1／b2 體力不同；
  0 傷害仍產生 ダメージ 事件的引擎違反 forbidden_events；把「相手のメインフェイズ」誤為自己的引擎不會在 P2 的回合誘發。
refs:
  rules: [1.3.2.4, 1.3.2.2, 1.3.2.2.1, 5.14.1, 7.3.1, 7.4.9, 7.2.4, 10.5.2.3, 10.9.1.4]
  qa: [Q2586]
evidence:
  - ref: Q2586
    quote: はい。何らかの効果によって攻撃力はマイナスの値になることがあります。攻撃力がマイナスの値になったフォロワーによる攻撃や交戦のダメージは、ダメージ自体を与えません。
  - ref: cr 1.3.2.2.1
    quote: 値がマイナスである情報を基準として加減算以外のなんらかの行動を行う必要がある場合、その値が 0 であるものとしてその行動を実行します。
    derivation:
      - 「これの攻撃力と同じダメージ」以攻擊力 −2 為基準 → 視為 0 → 依 1.3.2.2「0 点のダメージを与える処理」不發生
  - ref: cr 7.3.1
    quote: ‘メインフェイズが来たとき’の誘発条件が発生します。
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: 第三輪交叉驗證 astra-r3/xverify-1、xverify-2（審 fable-r3），fable-r3/fix-1～fix-3 處理後同意
  - by: sol
    method: independent-derivation
    note: 第三輪最後核對（139 局面逐一推導）；F1、F2 與禁止 vs 置換仲裁已依核對結果修正

scenarios:
  - name: A 隠者 攻擊力 −2 → 對手メインフェイズ 開始 → 0 傷害，什麼都沒發生
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 6, P2: 5}, phase: main}
      history: explicit
      semantic_state:
        continuous_effects:
          - {id: e1, source: b1, text: '相手の場のフォロワーすべては{攻撃力}-3/{体力}-3する', applies_to: [a1], until: permanent, order: 1}
      players:
        P1:
          construction: class
          leader: {class: ドラゴン, life: 17}
          pp: {current: 0, max: 6}
          zones:
            field:
              - {id: a1, card: BP15-108, state: {power: -2, hp: 2}}   # 安息の隠者 1/5 受 −3/−3
            hand:
              - {filler: 2}
            deck:
              - {id: c1, card: BP01-173}
              - {filler: 19}
        P2:
          construction: class
          leader: {class: ナイトメア, life: 20}
          pp: {current: 0, max: 5}
          zones:
            field:
              - {id: b1, card: BP19-081}                    # 蛇殿の執行者・ゲノムエル 5/5
              - {id: b2, card: BP01-173}                    # ファイター 2/3
            hand:
              - {filler: 3}
            deck:
              - {id: c2, card: BP01-176}
              - {filler: 19}
    decisions:
      - {n: 1, by: P1, at: main, do: end-phase}
      - {n: 2, by: P2, at: quick, do: pass}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 1}}}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, line: 1}}}
        assert:
          turn: {active: P2, phase: main}
          turn.elapsed_turns: {P1: 6, P2: 6}
          P2.pp: {current: 6, max: 6}
          P2.hand: [c2, filler: 3]
          P1.field.a1: {power: -2, hp: 2}
        events:
          - {kind: 引く, player: P2, object: c2}
          - {kind: 待機, ability: {source: a1, line: 1}}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b1: {hp: 5}
          P2.field.b2: {hp: 3}
          P2.field: [b1, b2]
          semantic_state.pending_triggers: []
        forbidden_events:
          - {kind: ダメージ}
          - {kind: 破壊}

  - name: B 沒有減值（攻擊力 1）→ 對手全體各 1 傷害
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 6, P2: 5}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 0, max: 6}
          zones:
            field:
              - {id: a1, card: BP15-108}
            hand:
              - {filler: 2}
            deck:
              - {id: c1, card: BP01-173}
              - {filler: 19}
        P2:
          construction: class
          leader: {class: ナイトメア, life: 20}
          pp: {current: 0, max: 5}
          zones:
            field:
              - {id: b1, card: BP19-081}
              - {id: b2, card: BP01-173}
            hand:
              - {filler: 3}
            deck:
              - {id: c2, card: BP01-176}
              - {filler: 19}
    decisions:
      - {n: 1, by: P1, at: main, do: end-phase}
      - {n: 2, by: P2, at: quick, do: pass}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 1}}}
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b1: {hp: 4}
          P2.field.b2: {hp: 2}
        events:
          - {kind: ダメージ, source: a1, target: b1, amount: 1, group: 1}
          - {kind: ダメージ, source: a1, target: b2, amount: 1, group: 1}
