schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-CP04-P54
kind: card
must_pass: true
mechanisms: [公主連結：UB、裝備, 14.5.1.2, 10.3.2, '12.7', 攻撃時把目標移到 EX 後不交戰]
cards: [CP04-P54, BP01-173]
why: >-
  アヤネ「{UB}【攻撃時】フォロワーへの攻撃なら、それをEXエリアに置く」：UB 能力在職業基準牌組中**所有領域都無效**（14.5.1.2）→ 連誘發都沒有；
  作品名基準（プリコネ）時正常誘發，目標被移到 EX 後 8.4.9 沒有目標 → 不交戰。攻擊リーダー時仍打出（Q2531）但條件不成立。
discriminates: >-
  在職業基準牌組仍讓 UB 誘發的引擎，B 會出現待機並把 b1 移到 EX；把「無效」做成「打出但無事」的引擎會多出プレイ事件。
refs:
  rules: [14.5.1.2, 10.3.2, 12.7.2, 8.4.9, 4.8.3.2, 6.1.1.5.1]
  qa: [Q2531, Q2447]
evidence:
  - ref: cr 14.5.1.2
    quote: ユニオンバースト能力は、デッキがクラス基準（6.1.1.5.1）で構築されているか、タイトル基準（6.1.1.5.2）で構築されていてそのタイトルが‘プリンセスコネクト！Re:Dive’でない場合、すべての領域で常に無効（10.3.2）です。
  - ref: cr 10.3.2
    quote: その条件下で、その部分は能力としては存在しますが、効果を発生することはありません。
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: A：xverify-1/result.md:109〈其他驗過的題目〉（14.5.1.2、8.4.9、Q2447）；B：xverify-2/result.md:229〈全部實質核驗局面的索引〉（14.5.1.2、10.3.2、Q2531、Q2447）

scenarios:
  - name: A 作品名基準：攻擊從者 → UB 攻撃時把目標移到 EX → 不交戰
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 4, P2: 3}, phase: main}
      history: none
      players:
        P1:
          construction: title
          title: プリンセスコネクト！Re:Dive
          leader: {class: ドラゴン, life: 20}
          pp: {current: 4, max: 4}
          zones:
            field:
              - {id: a1, card: CP04-P54}          # アヤネ 3/2，非本回合進場
            hand:
              - {filler: 2}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 4}
          zones:
            field:
              - {id: b1, card: BP01-173, state: {acted: true}}
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: attack, attacker: a1, target: b1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 1}}}
      - {n: 3, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, line: 1}}}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P2.field: []
          P2.ex: [b1]
          P1.field.a1: {hp: 2, acted: true}
        events:
          - {kind: 移動, object: b1, from: P2.field, to: P2.ex}
        forbidden_events:
          - {kind: ダメージ}

  - name: B 職業基準牌組：UB 無效 → 完全不誘發 → 正常交戰
    inherit: A 作品名基準：攻擊從者 → UB 攻撃時把目標移到 EX → 不交戰
    setup:
      players:
        P1:
          construction: class
    decisions:
      - {n: 1, by: P1, at: main, do: attack, attacker: a1, target: b1}
      - {n: 2, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          semantic_state.pending_triggers: []
        forbidden_events:
          - {kind: 待機}
          - {kind: 抑制}
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.field: []
          P2.ex: []
          P1.field: []
        events:
          - {kind: ダメージ, source: a1, target: b1, amount: 3, group: 1}
          - {kind: ダメージ, source: b1, target: a1, amount: 2, group: 1}
