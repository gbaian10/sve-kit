schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: flow-visibility-01
kind: flow
must_pass: true
mechanisms: [5.8.1.2, 4.1.5.1, 4.7.2, 4.9.2, '5.21', 公開：搜尋加入手牌要公開；墓場回手牌不需公開但對手仍知道, 隱藏資訊的投影, 搜尋有條件]
cards: [CP04-103, CP04-072, BP01-173, BP01-176, BP06-080, BP15-079, BP15-T06]
why: >-
  觀察者（對手視角）拿得到什麼：A：ミミ的ファンファーレ「探し、手札に加える」——有條件的搜尋要向對手出示（5.8.1.2）→ 對手能識別加入手牌的那張，
  但不能識別手牌裡原本的卡；搜尋後洗牌（5.8.2）→ 對手不知道牌庫順序。B：火車【2】把墓場的妖怪從者加回手牌——墓場是公開領域（4.9.2），
  對手看得到哪張離開墓場進了手牌，即使規則沒有「公開」這個動作。
discriminates: >-
  把 P1 的整個手牌投影給 P2 的引擎在 knowledge.does_not_know 上失敗；把搜尋到的卡當非公開的引擎在 knows 上失敗；
  B 中把「沒有公開步驟」當成「對手不知道」的引擎在 knows 上失敗。
refs:
  rules: [5.8.1.2, 5.8.2, 4.1.2, 4.1.2.1, 4.7.2, 4.9.2, 5.21.1, 5.21.1.1, 4.1.5.1]
  qa: []
evidence:
  - ref: cr 5.8.1.2
    quote: 特定条件に枚数以外の条件がある場合、それを見つけた後に、そのカードが条件を満たすことを相手に示します。
  - ref: cr 4.7.2
    quote: 手札は非公開領域ですが、自分の手札のカードは自分のみが自由に確認することができます。他のプレイヤーの手札のカードの内容を確認することはできません。
  - ref: cr 4.9.2
    quote: 墓場は公開領域です。この領域のカードは表向きで置き、いずれのプレイヤーも自由に内容を見ることができます。
    derivation:
      - 由公開領域移到手牌的卡，對手在移動當下已識別它；沒有規則讓它重新變成未知
  - ref: cr 4.1.2.1
    quote: 領域が公開であるか非公開であるかにかかわらず、それぞれの領域にあるカードの枚数は、すべてのプレイヤーがいつでも確認することができます。
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: 見 reverify/result.md〈F1〉；CP04-103 text line 2、全部 sections，CR 5.8.1.2、5.8.2、4.5.2、4.7.2；依契約第 10 節第 5、12 條確認公開 a4 to:P2，再移入手牌、洗牌及 knowledge；無直接 Q&A。

scenarios:
  - name: A 搜尋加入手牌：對手識別那張，不識別其餘手牌
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 3, P2: 2}, phase: main}
      history: none
      players:
        P1:
          construction: title
          title: プリンセスコネクト！Re:Dive
          leader: {class: ビショップ, life: 20}
          pp: {current: 2, max: 3}
          zones:
            hand:
              - {id: a1, card: CP04-103}          # ミミ
              - {id: a2, card: BP01-173}          # 原本的手牌
            deck:
              - {id: a3, card: BP01-176}
              - {id: a4, card: CP04-072}          # イタズラ宣言（搜尋目標）
              - {id: a5, card: BP01-173}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 3}
          zones:
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}}
      - {n: 3, by: P1, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, select: [a4]}
    random:
      shuffles:
        - {player: P1, zone: deck, result: [a5, a3]}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.hand: [a2, a4]
          P1.deck: [a5, a3]
        events:
          - {kind: 公開, object: a4, to: P2, source: a1}    # 5.8.1.2 向對手出示（9.11）
          - {kind: 移動, object: a4, from: P1.deck, to: P1.hand}
      - at: after-decision-3
        view: P2
        outcome: resolved
        assert:
          P1.hand_count: 2
          P1.deck_count: 2
          knowledge: {knows: [a4], does_not_know: [a2, a3, a5]}

  - name: B 墓場的卡回手牌：對手識別它（墓場公開），其餘手牌仍不識別
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 3, P2: 2}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ナイトメア, life: 20}
          pp: {current: 2, max: 3}
          zones:
            hand:
              - {id: a1, card: BP06-080}          # 火車
              - {id: a2, card: BP01-173}
            cemetery:
              - {id: a3, card: BP15-079}          # テラーバンケット・ギンセツ（妖怪）
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 3}
          zones:
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 1}}, options: [2], targets: {1: [a3]}}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.hand: [a2, a3]
          P1.cemetery: []
        events:
          - {kind: 移動, object: a3, from: P1.cemetery, to: P1.hand}
        forbidden_events:
          # 只禁止 a3 的公開；a1 從手牌打出時依 10.6.2.1 會公開（互驗第二輪修正，astra）
          - {kind: 公開, object: a3}
      - at: after-decision-2
        view: P2
        outcome: resolved
        assert:
          P1.hand_count: 2
          knowledge: {knows: [a3], does_not_know: [a2]}
