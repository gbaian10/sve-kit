schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP05-SL12
kind: card
must_pass: true
mechanisms: [前一步的結果, 重複, 1.3.2, 10.6.2.8.2, 5.10.1.1]
cards: [BP05-SL12, BP01-173, BP01-176, BP01-180]
why: >-
  魔導電磁サイ「これは{攻撃力}+3する。自分のデッキの上4枚を墓場に置く。これによって『魔導電磁サイ』を墓場に置いたなら、これの{ファンファーレ}能力をくり返す」：
  「くり返す」是在同一次結算裡重做這段效果（Q708），不是新的待機；每一輪看的是那一輪放進墓場的 4 張（前一步的結果）。牌庫 0 張時 +3 照做、放牌庫單純不做、也不敗北（Q712）。
discriminates: >-
  把「くり返す」做成重新誘發（多一個待機／多一個プレイ事件）的引擎，events_exact [プレイ] 會多；每輪沒有重新檢查「這一輪放的 4 張」而是累計檢查的引擎會多做一輪（攻撃力 12）；
  把牌庫不足當成失敗而不 +3、或把「放牌庫」失敗當成抽牌失敗判負的引擎在 B 會錯。
refs:
  rules: [10.6.2.8.2, 1.3.2, 5.10.1.1, 11.2.2, 12.4.3]
  qa: [Q708, Q710, Q711, Q712]
evidence:
  - ref: Q708
    quote: >-
      ①『魔導電磁サイ』をプレイし、ファンファーレ能力を解決します。攻撃力を+3して、自分のデッキの上4枚を墓場に置きます。これによって『魔導電磁サイ』を墓場に置いたので、このファンファーレ能力をくり返します。
      ②攻撃力を+3して、自分のデッキの上4枚を墓場に置きます。これによってもう一度『魔導電磁サイ』を墓場に置いたので、再度このファンファーレ能力をくり返します。③攻撃力を+3して、自分のデッキの上4枚を墓場に置きます。（これによって『魔導電磁サイ』を墓場に置くことができなかったので処理を終了します） A: はい。正しいです。
  - ref: Q712
    quote: はい。攻撃力を+3します。その後、自分のデッキが0枚なので「自分のデッキの上4枚を墓場に置く。」は単に行われません。（また、敗北することもありません。）
  - ref: cr 5.10.1.1
    quote: この指示の実行の際に、そのプレイヤーのデッキ置き場にカードがない場合、そのプレイヤーは次のルール処理でゲームに敗北します（11.2.2）。
    derivation:
      - 敗北只綁在「引く」；「デッキの上4枚を墓場に置く」不是引く → 1.3.2 單純不做
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 三輪：第 1、2 輪各放到 1 張サイ → 第 3 輪沒有 → 停；攻撃力 +9、墓場 12 張
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 5, P2: 4}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 5, max: 5}
          zones:
            hand:
              - {id: a1, card: BP05-SL12}         # 魔導電磁サイ 0/7
            deck:
              - {id: d1, card: BP01-173}
              - {id: d2, card: BP05-SL12}         # 第 1 輪含サイ
              - {id: d3, card: BP01-176}
              - {id: d4, card: BP01-180}
              - {id: d5, card: BP05-SL12}         # 第 2 輪含サイ
              - {id: d6, card: BP01-173}
              - {id: d7, card: BP01-176}
              - {id: d8, card: BP01-180}
              - {id: d9, card: BP01-173}          # 第 3 輪：沒有サイ
              - {id: d10, card: BP01-176}
              - {id: d11, card: BP01-180}
              - {id: d12, card: BP01-173}
              - {filler: 8}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 5}
          zones:
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a1: {power: 9, hp: 7}
          P1.deck: [filler: 8]
          P1.cemetery: [d1, d2, d3, d4, d5, d6, d7, d8, d9, d10, d11, d12]
          semantic_state.pending_triggers: []
          game: {ended: false}
        events:
          - {kind: プレイ, object: a1}
          - {kind: プレイ, ability: {source: a1, line: 2}}
          - {kind: 移動, object: d1, from: P1.deck, to: P1.cemetery}
          - {kind: 移動, object: d12, from: P1.deck, to: P1.cemetery}
        events_exact: [プレイ]

  - name: B 牌庫 0 張：+3 照做，放牌庫不做，不敗北
    inherit: A 三輪：第 1、2 輪各放到 1 張サイ → 第 3 輪沒有 → 停；攻撃力 +9、墓場 12 張
    setup:
      players:
        P1:
          zones:
            deck: []
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a1: {power: 3, hp: 7}
          P1.deck: []
          P1.cemetery: []
          game: {ended: false}
        forbidden_events:
          - {kind: 敗北}
          - {kind: 移動, to: P1.cemetery}
