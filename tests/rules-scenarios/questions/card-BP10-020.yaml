schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP10-020
kind: card
must_pass: true
mechanisms: [重複, 隨機與擲骰, '5.20', 11.2.1, 1.2.1, 回合特定時點, 持續效果與禁止, '9.2', アドバンスカード]
cards: [BP10-020, BP01-173, SD02-002]
why: >-
  《暴走》する戦車・オルオーン（アドバンス）「自分のエンドフェイズが来たとき、下記を2回くり返す。サイコロをふる。1か2なら…3か4なら相手のリーダーすべてに7ダメージ。5か6なら自分のリーダーに7ダメージ」：
  重複 2 次、每次擲骰結果由受控亂數給；第一次讓對手體力歸 0 也不立即結束，第二次照擲（Q1278），敗北在能力結算後的檢查時點判定。「これは相手を攻撃できない」→ 不能宣告攻擊。
discriminates: >-
  第一次擲到 3 就立刻結束遊戲的引擎，A 不會出現第二次的全體破壞（P2.field 仍有 b1）；沒有重複的引擎只擲一次；C 中允許攻擊的引擎會 resolved。
refs:
  rules: [5.20.1, 7.4.1, 11.2.1, 1.2.1, 10.5.2.1, 8.4.3.2.1, 9.2.1]
  qa: [Q1278, Q1277]
evidence:
  - ref: Q1278
    quote: いいえ。1回目のサイコロで相手のリーダーの体力が0になった場合でも、その時点でバトルに勝利することはなく、もう1回サイコロをふります。『《暴走》する戦車・オルオーン』の能力の解決が終わった後のチェックタイミングの際に、自身のリーダーの体力が0以下のプレイヤーはバトルに敗北します。
  - ref: Q1277
    quote: いいえ。相手のリーダーや相手のフォロワーを攻撃することはできません。
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 骰 3 → 7 傷害使對手歸 0；再骰 1 → 全體破壞；之後檢查時點才敗北
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 8, P2: 7}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 8}
          zones:
            field:
              - {id: a1, card: BP10-020}          # 《暴走》する戦車・オルオーン 7/7（アドバンス）
            hand:
              - {filler: 2}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ドラゴン, life: 7}
          pp: {current: 0, max: 8}
          zones:
            field:
              - {id: b1, card: BP01-173}
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: end-phase}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}}
    random:
      dice: [3, 1]
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: game-end
        assert:
          P2.leader.life: 0
          P2.field: []
          P2.cemetery: [b1]
          game: {ended: true, winner: P1, by: 11.2.1}
        events:
          - {kind: ダメージ, source: a1, target: P2.leader, amount: 7}
          - {kind: 破壊, object: b1}
          - {kind: 敗北, player: P2, by: rule-11.2.1}

  - name: B 骰 5、6 → 自己受 14
    inherit: A 骰 3 → 7 傷害使對手歸 0；再骰 1 → 全體破壞；之後檢查時點才敗北
    setup:
      players:
        P2:
          leader: {class: ドラゴン, life: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: end-phase}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}}
    random:
      dice: [5, 6]
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.leader.life: 6
          P2.leader.life: 20
          P2.field: [b1]
          game: {ended: false}
        events:
          - {kind: ダメージ, source: a1, target: P1.leader, amount: 7}
          - {kind: ダメージ, source: a1, target: P1.leader, amount: 7}

  - name: C 「相手を攻撃できない」→ 不能宣告攻擊
    inherit: A 骰 3 → 7 傷害使對手歸 0；再骰 1 → 全體破壞；之後檢查時點才敗北
    setup:
      players:
        P2:
          leader: {class: ドラゴン, life: 20}
          zones:
            field:
              - {id: b1, card: BP01-173, state: {acted: true}}
    decisions:
      - {n: 1, by: P1, at: main, do: attack, attacker: a1, target: P2.leader}
      - {n: 2, by: P1, at: main, do: attack, attacker: a1, target: b1}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-attack
      - at: after-decision-2
        view: omniscient
        outcome: cannot-attack
        assert:
          P1.field.a1: {acted: false}
