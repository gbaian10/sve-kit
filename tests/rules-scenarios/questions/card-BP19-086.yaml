      - {n: 2, by: P1, at: quick, do: pass}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a4, line: 2}}, targets: {1: [c1]}}
      - {n: 4, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: c1, line: 2}}}
      - {n: 5, by: P1, at: resolve, of: {decision: 4, occurrence: 1}, do: resolve-choice, select: [e1]}
      - {n: 6, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: c1, card: BP19-087, line: 1}}}
      - {n: 7, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a2, line: 2}, event: {evolved: c1}}}
      - {n: 8, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 1}, event: {evolved: c1}}, targets: {1: [b1]}}
    random: {}
