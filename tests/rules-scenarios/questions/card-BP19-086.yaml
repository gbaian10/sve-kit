            - {do: choose-pending, pending: {ability: {source: a2, line: 2}, event: {evolved: c1}}}
            - {do: choose-pending, pending: {ability: {source: a1, line: 1}, event: {evolved: c1}}}
      - at: after-decision-8
        view: omniscient
        outcome: resolved
