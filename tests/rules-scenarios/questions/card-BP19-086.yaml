schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP19-086
kind: card
must_pass: true
mechanisms: [對手回合的進化觸發己方效果, 對手回合的誘發, 12.4.3, 12.6.1, 10.5.2.3, 效果造成的進化, 連擊、覺醒、真紅]
cards: [BP19-086, BP19-087, BP19-011, BP15-004, SCS01-007, BP08-080, BP01-176, BP01-173]
why: >-
  對手回合：アリオーシュ 被交戰破壞 → ラストワード 把猛襲の特攻隊長從墓場放上場 → ファンファーレ 誘發（12.4.3 不限打出）→
  自傷 1、場上有ガロダート → 由效果進化（對手回合也能）→ 「進化した」事象在對手回合發生 →
  凍土の女王・ピアシィ「自分の場のフォロワーが進化したとき」（Q1971）與根際の刺客「自分の場の八獄・フォロワーが進化したとき」（Q2560）都誘發。
  根際 的傷害要【コンボ_3】，對手回合自己沒打出卡 → 只選目標、不造成傷害；ピアシィ 的效果無條件 → 可觀察。
  特攻隊長的【進化時】「リーダーすべてに1ダメージ」也結算。ガロダート「自分のターン中、…体力が減少したとき」在對手回合不誘發（Q2617）。
discriminates: >-
  只在自己回合檢查「進化したとき」的引擎：P2 リーダー 19 而非 18、P2 從者不受 2 傷害。
  把從墓場放上場的ファンファーレ 當成不誘發的引擎：特攻隊長不進化、什麼都不發生。
  讓ガロダート 在對手回合誘發的引擎：after-decision-6 之後會多出 P1 的待機。
refs:
  rules: [12.4.3, 12.5.3, 12.6.1, 5.16.1.1, 5.16.1.3, 10.5.2.2, 10.5.2.3, 8.4.9, 8.4.10, 13.2.1.2]
  qa: [Q2560, Q1971, Q2617, Q2558]
evidence:
  - ref: Q2560
    quote: はい。相手のターン中であっても誘発します。
  - ref: Q1971
    quote: はい。相手のターン中であっても誘発します。
  - ref: Q2617
    quote: いいえ。「自分のターン中、自分のリーダーの体力が減少したとき、～」という能力は自分のターン中にのみ誘発します。そのため、相手のターン中に条件を満たしても『羅刹の咎人・ガロダート』は進化しません。
  - ref: cr 12.4.3
    quote: ‘ファンファーレ （テキスト）’は、‘このカードを場以外から場に置いたとき、（テキスト）’を意味します。
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: A：xverify-2/result.md:263〈全部實質核驗局面的索引〉（12.4.3、12.5.3、Q2560、Q1971）

scenarios:
  - name: A 對手回合：LW 復活特攻隊長 → ファンファーレ 自傷並進化 → ピアシィ 與根際 在對手回合誘發
    setup:
      turn: {active: P2, first_player: P1, elapsed_turns: {P1: 7, P2: 7}, phase: main}
      history: none
      players:
        P1:
          construction: crossover
          classes: [エルフ, ナイトメア]
          leader: {class: エルフ, life: 20}
          pp: {current: 0, max: 7}
          zones:
            field:
              - {id: a1, card: BP19-011}          # 根際の刺客 2/3（エルフ・八獄）
              - {id: a2, card: BP15-004}          # 凍土の女王・ピアシィ 3/3
              - {id: a3, card: SCS01-007}         # 羅刹の咎人・ガロダート 3/3
              - {id: a4, card: BP08-080, state: {acted: true}}   # アリオーシュ 3/3
            cemetery:
              - {id: c1, card: BP19-086}          # 猛襲の特攻隊長 1/1
            evolve_deck:
