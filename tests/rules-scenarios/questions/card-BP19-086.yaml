          turn: {active: P2, phase: main}
          P1.leader.life: 19
          P2.leader.life: 18
          P2.field.b1: {hp: 1}
          P2.field.b2: {hp: 1}
          P1.field.a3: {evolved: false}
          semantic_state.pending_triggers: []
        events:
          - {kind: ダメージ, source: c1, target: P1.leader, amount: 1, group: g1}
          - {kind: ダメージ, source: c1, target: P2.leader, amount: 1, group: g1}
          - {kind: ダメージ, source: a2, target: P2.leader, amount: 1}
          - {kind: ダメージ, source: a2, target: b1, amount: 2, group: g2}
