schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: rule-8.4.7-02
kind: rule
must_pass: true
mechanisms:
  - 8.4／7.4.5
  - 區域移動
  - 前一步的結果
cards:
  - BP01-173
  - BP05-007
  - BP21-T11
why: 防守妖精在 Quick 回 EX 就結束該次攻擊，攻击者維持橫置且不交戰；回 EX 清除先前攻擊力修正。選零則原目標仍在場，等待 Quick 決定。
discriminates: 目標離場仍造成交戰傷害、還原攻擊者橫置或保留 EX 修正都會失敗。
refs:
  rules:
    - 4.1.4
    - 8.4.5.1
    - 8.4.9.2
  qa:
    - Q675
    - Q677
evidence:
  - ref: Q675
    quote: 攻撃目標のフォロワーが場から離れたため、攻撃がその時点で終了し、交戦は行われません。また、その攻撃したフォロワーはアクト状態のままになります。
  - ref: Q677
    quote: はい。そのフォロワーに付与されていた効果や増減されていた攻撃力や体力、置かれていたカウンターはすべて失われ、リセットされます。
  - ref: cr 4.1.4
    quote: "カードが領域間の移動を行う場合、特に指示がな\nいかぎり、それは新しい領域における新しいカードで\nあるとみなされます。特に指定がないかぎり、前の\n領域で適用されていた効果がそのまま適用されるこ\nとはありません。"
    derivation:
      - 防守妖精在 Quick 回 EX 就結束該次攻擊，攻击者維持橫置且不交戰；回 EX 清除先前攻擊力修正。選零則原目標仍在場，等待 Quick 決定。
  - ref: cr 8.4.5.1
    quote: "攻撃目標がフォロワーである場合、これ以\n降、攻撃フォロワーと攻撃目標の両方が場に\nある限り、‘交戦’状態であるとみなします。"
    derivation:
      - 防守妖精在 Quick 回 EX 就結束該次攻擊，攻击者維持橫置且不交戰；回 EX 清除先前攻擊力修正。選零則原目標仍在場，等待 Quick 決定。
  - ref: cr 8.4.9.2
    quote: "この時点で攻撃フォロワーと攻撃目標が交\n戦状態である場合、攻撃フォロワーと攻撃目\n標が互いに‘交戦した’事象が発生します。"
    derivation:
      - 防守妖精在 Quick 回 EX 就結束該次攻擊，攻击者維持橫置且不交戰；回 EX 清除先前攻擊力修正。選零則原目標仍在場，等待 Quick 決定。
