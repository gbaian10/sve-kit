must_pass: true
mechanisms:
  - 融合
  - 前一步的結果
cards:
  - BP01-173
  - BP19-078
  - BP19-P25
  - BP19-SL10
why: 只在實際融合八獄從者時抽一；手牌捨棄帶謝幕曲的卡不會誘發場到墓場能力。
discriminates: 只查來源本身八獄或把捨棄當死亡會多抽或多待機。
refs:
  rules:
    - 12.18.4.1
    - 12.5.3
  qa:
    - Q2571
evidence:
  - ref: Q2571
    quote: はい。『耽溺の咎人・セフィー』が手札にある場合に有効となる能力です。
  - ref: cr 12.18.4.1
    quote: "あるカードが‘融合した’条件を満たした\n際、その融合を行うために手札から捨てたり\nEX エリアから墓場に置いたりしたカードがな\nんらかの情報を持つ場合、‘（その情報の）\nカードを融合した’条件を満たします。\n13. クラス別の情報やキーワード"
    derivation:
      - 只在實際融合八獄從者時抽一；手牌捨棄帶謝幕曲的卡不會誘發場到墓場能力。
  - ref: cr 12.5.3
    quote: "‘ラストワード （テキスト）’は、‘このカードを場か\nら墓場に置いたとき、（テキスト）’を意味します。"
    derivation:
      - 只在實際融合八獄從者時抽一；手牌捨棄帶謝幕曲的卡不會誘發場到墓場能力。
