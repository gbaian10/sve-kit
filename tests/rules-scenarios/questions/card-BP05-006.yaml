schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP05-006
kind: card
must_pass: true
mechanisms: [額外回合、跳過、勝利, 5.18.3, 對手做的チョイス, 7.2.1, 7.2.4, '8.2', 回合特定時點, 持續效果與禁止]
cards: [BP05-006, BP01-173, BP01-180]
why: >-
  マインドルーラー・モートン「自分のエンドフェイズが来たとき、相手プレイヤー1人は下記から1つチョイスする」：チョイス在打出時決定（5.18.3），但做決定的是對手 →
  P1 選擇打出待機能力後停下來等 P2 選模式（契約 9.12：resolve-choice.options、of 指向 choose-pending）。效果作用在チョイス的那位玩家身上（Q672）：
  【1】下一個開始階段不抽牌；【2】下一個開始階段 PP 最大值不 +1；【3】下一個主要階段不能打出從者（法術仍可，Q674）。
discriminates: >-
  讓 P1 替對手選、或不停下來就直接套用某一項的引擎 awaiting.by 錯；【1】沒擋住 7.2.4 的引擎 P2 手牌多 1；【2】沒擋住 7.2.1 的引擎 PP 最大值 6；
  【3】把法術也擋掉的引擎 after-decision-6 會 cannot-play。
refs:
  rules: [5.18.3, 5.18.2, 7.4.1, 7.2.1, 7.2.2, 7.2.4, 8.2.1, 1.3.3, 10.5.2.2]
  qa: [Q672, Q674]
evidence:
  - ref: Q672
    quote: はい。チョイスした相手プレイヤーに対して効果が働きます。
  - ref: Q674
    quote: はい。スペルのプレイやアミュレットの能力はフォロワーのプレイではないため、場に出すことができます。
  - ref: cr 5.18.3
    quote: チョイスする行動でどの選択肢を採用するかを決定する処理は、プレイのための前提となる選択肢（10.6.2.2）です。そのため、チョイスする行動による選択はプレイの段階で行う義務があります。
    derivation:
      - 打出的是 P1 的待機能力，但チョイス的主體是「相手プレイヤー1人」→ 打出程序中由 P2 輸入（契約 9.12）
status: draft
author: fable
verified_by: []

scenarios:
  - name: A P2 選【1】→ P2 的下一個開始階段不抽牌（PP 最大值照常 +1）
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 6, P2: 5}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: エルフ, life: 20}
          pp: {current: 0, max: 6}
          zones:
            field:
              - {id: a1, card: BP05-006}          # マインドルーラー・モートン 3/3
            hand:
              - {filler: 2}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 5}
          zones:
            hand:
              - {id: h1, card: BP01-173}          # ファイター（從者）
              - {id: h2, card: BP01-180}          # エンジェルバレッジ（法術）
            deck:
              - {id: b9, card: BP01-173}          # 開始階段本來會抽到的卡
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: end-phase}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 1}}}
      # 9.12：打出程序中由另一位玩家輸入的チョイス，算一個 occurrence
      - {n: 3, by: P2, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, options: [1]}
      - {n: 4, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: paused
        awaiting:
          by: P2
          choices:
            - {do: resolve-choice, options: [1]}
            - {do: resolve-choice, options: [2]}
            - {do: resolve-choice, options: [3]}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          turn: {active: P2, phase: main}
          P2.pp: {current: 6, max: 6}
          P2.hand: [h1, h2]
          P2.deck: [b9, filler: 20]
        forbidden_events:
          - {kind: 引く, player: P2}

  - name: B P2 選【2】→ 下一個開始階段 PP 最大值不 +1（照常抽牌）
    inherit: A P2 選【1】→ P2 的下一個開始階段不抽牌（PP 最大值照常 +1）
    decisions:
      - {n: 1, by: P1, at: main, do: end-phase}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 1}}}
      - {n: 3, by: P2, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, options: [2]}
      - {n: 4, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          turn: {active: P2, phase: main}
          P2.pp: {current: 5, max: 5}
          P2.hand: [h1, h2, b9]
        events:
          - {kind: 引く, player: P2, object: b9}

  - name: C P2 選【3】→ 下一個主要階段不能打出從者，法術可以
    inherit: A P2 選【1】→ P2 的下一個開始階段不抽牌（PP 最大值照常 +1）
    decisions:
      - {n: 1, by: P1, at: main, do: end-phase}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 1}}}
      - {n: 3, by: P2, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, options: [3]}
      - {n: 4, by: P2, at: quick, do: pass}
      - {n: 5, by: P2, at: main, do: play, card: h1}
      - {n: 6, by: P2, at: main, do: play, card: h2}
    random: {}
    expected:
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          turn: {active: P2, phase: main}
          P2.pp: {current: 6, max: 6}
          P2.hand: [h1, h2, b9]
      - at: after-decision-5
        view: omniscient
        outcome: cannot-play
        assert:
          P2.hand: [h1, h2, b9]
          P2.pp.current: 6
          P2.field: []
      - at: after-decision-6
        view: omniscient
        outcome: resolved
        assert:
          P2.pp.current: 5
          P2.cemetery: [h2]
          P1.field.a1: {hp: 2}
        events:
          - {kind: プレイ, object: h2}
          - {kind: ダメージ, source: h2, target: a1, amount: 1}
