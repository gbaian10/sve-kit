why: 操縦把護符變成卡面 3/3 從者，保留向き；已橫置的車仍不能攻擊，直立車能靠疾走攻擊。
discriminates: 若操縦自動站起會接受反例攻擊；若把護符既有疾走刪掉或不變成從者則正例失敗。
refs:
  rules:
    - 5.32.1
    - 5.25.2
    - 8.4.2
  qa:
    - Q1581
evidence:
  - ref: Q1581
    quote: "Q: 「これを操縦する。」とは何ですか？\nA: 「これを操縦する。」とは、そのターン、それをカードに記載されている攻撃力と体力を持つフォロワーにすることを意味します。\n「これは操縦する。」を持つカードが場に出たターンに操縦してフォロワーになった場合、通常のフォロワーと同様に、そのターンは相手を攻撃することができません。（【疾走】を持っている場合、相手のリーダーと相手のアクト状態のフォロワーに、【突進】を持っている場合、相手のアクト状態のフォロワーに攻撃できます。）\n場に出たターンの次のターン以降に操縦してフォロワーになった場合は、相手を攻撃することができます。"
    derivation:
      - 操縦把護符變成卡面 3/3 從者，保留向き；已橫置的車仍不能攻擊，直立車能靠疾走攻擊。
  - ref: cr 5.32.1
    quote: あるアミュレットを‘操縦する’指示がある場合、そ のアミュレットがカードに表記の攻撃力と体力を持つ なら、そのターンの間、そのアミュレットはフォロワー になり、攻撃力と体力はその値になります。
    derivation:
      - 操縦把護符變成卡面 3/3 從者，保留向き；已橫置的車仍不能攻擊，直立車能靠疾走攻擊。
  - ref: cr 5.25.2
    quote: カードの種類が変更された場合でも、そのカードが 持っていた種類以外の情報はそのまま保持されま すが、その種類が本来持たない情報を参照しようと した場合、それは参照されません。
    derivation:
      - 操縦把護符變成卡面 3/3 從者，保留向き；已橫置的車仍不能攻擊，直立車能靠疾走攻擊。
  - ref: cr 8.4.2
    quote: 攻撃フォロワーとして、自分がマスターであるスタン ド状態のフォロワーを 1 体選択します。
    derivation:
      - 操縦把護符變成卡面 3/3 從者，保留向き；已橫置的車仍不能攻擊，直立車能靠疾走攻擊。
