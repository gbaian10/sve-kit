    quote: プレイしたのがスペルや起動能力や自動能力である場合、そのテキストや能力に示された効果を、表記の順に従って実行します。
  - ref: BP09-007
    quote: 相手の場のフォロワーすべてに3ダメージ。自分の墓場にある{エルフ}スペルのカード名の種類数が5種類以上なら、代わりに5ダメージ。相手のリーダーすべてに2ダメージ。
