schema: sve-exam/2.1
sources:
  rules: cr-1.28.0
  cards_jsonl_sha256: 541781306484527c858c6587a2c838764b0513595b00711751370534050c3fa1
id: rule-10.9.1.6-02
kind: rule
must_pass: false
mechanisms:
  - 持續效果
  - 同時發生
  - 回合玩家優先
cards:
  - BP01-173
  - BP06-072
  - BP16-049
why: >-
  R-0014（inferred）在依存與時間戳相同時優先套用回合玩家的效果。局面給定兩個同時生效且互不依存的數值修正，P1 的 +2 先算，P2 的設為 1 後算。
  同一發生時點是依契約第 0 節給定的局面：實戰中這兩張法術分次打出，依 10.9.1.6.2 會有先後，這裡只借用它們的效果文字。
discriminates: >-
  先套用對手的設值會讓ファイター攻擊領袖造成 3 傷害。
refs:
  rules:
    - 10.9.1.4
    - 10.9.1.6
    - 1.3.4.1
  qa: []
  rulings:
    - R-0014
evidence:
  - ref: R-0014
    derivation:
      - 同層且沒有依存，發生時點相同時以回合玩家優先
status: verified
author: sol
verified_by:
  - by: opus
    method: independent-derivation
    note: >-
      兩個數值效果同層、無 10.9.1.5 依存、同時戳；依 R-0014 先套回合玩家的 +2 再套 P2 的設為 1，ファイター 1/1，領袖 19。同時戳是契約第 0
      節給定局面，已在 why 註明
scenarios:
  - name: 同時留下雙方的數值效果，回合玩家的 +2 先於對手設為 1
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: explicit
      players:
        P1:
          construction: class
          leader:
            class: ドラゴン
            life: 20
          pp:
            current: 8
            max: 8
          zones:
            deck:
              - filler: 20
            field:
              - id: fighter
                card: BP01-173
            cemetery:
              - id: buff
                card: BP06-072
        P2:
          construction: class
          leader:
            class: ウィッチ
            life: 20
          pp:
            current: 0
            max: 7
          zones:
            deck:
              - filler: 20
            cemetery:
              - id: set
                card: BP16-049
      semantic_state:
        continuous_effects:
          - id: set-effect
            source: set
            text: それの攻撃力と体力を1にする。
            applies_to:
              - fighter
            until: permanent
            order: 1
          - id: buff-effect
            source: buff
            text: それは攻撃力+2する。
            applies_to:
              - fighter
            until: permanent
            order: 1
    decisions:
      - n: 1
        by: P1
        at: main
        do: attack
        attacker: fighter
        target: P2.leader
      - n: 2
        by: P2
        at: quick
        do: pass
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.field.fighter:
            power: 1
            hp: 1
          P2.leader.life: 19
