schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: rule-10.10-01
kind: rule
must_pass: true
mechanisms: [10.10.2, 10.10.2.2, 10.10.2.4, 10.10.2.5.1, 5.14.2, 1.3.2.2, 取代效果, 額外回合、跳過、勝利, 抉擇＋條件改變選擇數, 持續效果與禁止]
cards: [BP15-118, BP02-090, BP14-090, BP06-080, BP06-073, BP06-074, BP01-173, EBD02-007, BP03-SL07, BP01-170, BP01-180, BP01-099, BP01-131]
why: >-
  取代效果的三條規則。（A／A2／A3）自我取代先套（10.10.2.5.1）：堕落の決意「2ダメージ…代わりに4ダメージ」先變 4，再套シオン的「受けるダメージを-1」→ 3。
  互驗修正（astra）：「5枚以上なら、1枚引く。自分のPPを1回復する。」的「なら」管到段落結尾（同 Q1611、Q1373 的句式）→ 表向き 3 枚時不抽也不回復 PP，PP 1 → 0；A3 是 5 枚的對照。
  （B1／B2）同一事象有多個非自我取代時，受影響者決定順序（10.10.2.2；Q1944、Q2498 的邏輯）：火車的 1 傷害在大妖狐的「+1」與シオン的「-1」之間，
  受傷的是 P1 的シオン → P1 選：先 −1 → 0 → 依 1.3.2.2 傷害這個行動不存在，+1 沒東西可套 → 不受傷；先 +1 → 2 → −1 → 1。
  （C／D）費用：固定值先於增減（10.10.2.4；Q470）：次元の超越「コストを7にする」後套オズ的「-4」→ 3；沒有オズ時 PP 3 付不出 7 → 不能打出、回溯。
  C 順便驗證追加回合（5.28）與經過回合數（3.3.2.2）。
discriminates: >-
  A：先套 −1（2→1）再自我取代的實作會得 4 或其他值（シオン體力 3 或 6 而非 4）；把「なら」只管到「1枚引く」的實作在 A 會回復 PP（PP 1 而非 0）。B：不讓受影響者選順序、固定先 +1 的實作在 B2 仍造成 1 傷害；固定先 −1 的實作在 B1 不造成傷害。
  C：先 −4 再「7にする」的實作得費用 7 → PP 3 不能打出；D：把 10.6.2.5.4 的回溯做成半套（消滅了墓場法術）會看到 banish 非空。
refs:
  rules: [10.10.1, 10.10.2, 10.10.2.2, 10.10.2.3, 10.10.2.4, 10.10.2.5, 10.10.2.5.1, 5.14.2, 10.2.1.3.2, 10.2.1.3.3, 1.3.2.2, 10.4.7.2, 10.6.2.5.1.3, 10.6.2.5.4, 5.28.1, 3.3.2.2, 4.6.3, 12.4.1]
  qa: [Q1944, Q2498, Q470, Q329, Q192, Q193, Q1611]
evidence:
  - ref: cr 10.10.2.5.1
    quote: 置換効果を適用する際、その中に自己置換効果が存在する場合、自己置換であるものを先に適用します。
    derivation:
      - 「それに2ダメージ。…3枚以上なら、代わりに4ダメージ」是解決中自身處理的取代（10.10.2.5）→ 先套；剩下シオン的 −1 只有一個，沒有順序可選
  - ref: Q1944
    quote: >-
      自分の選択により、「ダメージを受けない」もしくは「1ダメージ」のどちらかになります。…①「受けるダメージを-1」→「与えるダメージを+1」…0ダメージを与える行動は全く行われなくなるため、ダメージを与えるという行動自体が存在しなくなります。
      その後、「与えるダメージを+1」を適用しますが、ダメージを与える行動自体がすでに存在しないため、何も適用されません。②「与えるダメージを+1」→「受けるダメージを-1」…最終的に1ダメージ。
    derivation:
      - Q1944 是攻擊傷害，本題改用火車的能力傷害（Q837：能力傷害也 +1），受影響者仍是 P1 → P1 選順序
  - ref: cr 10.10.2.2
    quote: 影響を受ける事象がゲーム中の行動である場合、その行動を実行するプレイヤー、またはその行動が適用されるカードのマスターが決定します。
  - ref: Q1611
    quote: いいえ。「このターン中に自分のリーダーの体力が合計4以上回復していたなら、」は「それを破壊する。」と「1枚引く。」の両方にかかっています。
    derivation:
      - 同句式：「〜なら、A。B。」的條件管到段落結尾 → 堕落の決意「5枚以上なら、1枚引く。自分のPPを1回復する。」兩句都受條件限制
  - ref: cr 10.10.2.4
    quote: カードや能力をプレイする際のコストを変更する置換効果（10.2.1.3.3）では、コストを特定の値に変更する効果は、コストを増減する効果よりも先に適用します。
  - ref: Q470
    quote: はい。『次元の超越』はコスト3でプレイします。
  - ref: Q192
    quote: いいえ。プレイするこのカードは墓場にないため、数えることはできません。
  - ref: cr 5.28.1
    quote: あるプレイヤーが特定の時点での‘追加ターンを行う’指示がある場合、その時点で本来実行するターンの直前に、そのプレイヤーのターンを 1 回実行します。
  - ref: cr 3.3.2.2
    quote: あるプレイヤーが追加ターンを行った（5.28）場合、そのターンは経過ターンに数えます。
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: A／A2／A3／B1／B2／C：xverify-2/result.md:237〈全部實質核驗局面的索引〉（10.10.1、10.10.2、Q1944、Q2498）；D：xverify-1/result.md:123〈其他驗過的題目〉（Q1611、Q1373）

scenarios:
  - name: A 自我取代先套：2→4，再 −1 → シオン受 3
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 5, P2: 4}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ビショップ, life: 20}
          pp: {current: 1, max: 5}
          zones:
            evolve_deck:
              - {id: a2, card: BP02-090, face_up: true}
              - {id: a3, card: BP02-090, face_up: true}
              - {id: a4, card: BP02-090, face_up: true}     # 表向きのエボルヴフォロワー 3 枚
            hand:
              - {id: a1, card: BP15-118}          # 堕落の決意
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ビショップ, life: 20}
          pp: {current: 0, max: 5}
          zones:
            field:
              - {id: b1, card: BP14-090}          # 永久の盾・シオン 3/7（受けるダメージ-1）
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, targets: {1: [b1]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b1: {hp: 4}
          P1.pp.current: 0
          P1.hand: []
        events:
          - {kind: ダメージ, source: a1, target: b1, amount: 3}
        forbidden_events:
          - {kind: ダメージ, amount: 4}
          - {kind: ダメージ, amount: 2}
          - {kind: ダメージ, amount: 1}
          - {kind: 引く}
          - {kind: 回復}

  - name: A2 對照：表向き只有 2 枚 → 沒有自我取代 → 2−1 → 受 1
    inherit: A 自我取代先套：2→4，再 −1 → シオン受 3
    setup:
      players:
        P1:
          zones:
            evolve_deck:
              - {id: a2, card: BP02-090, face_up: true}
              - {id: a3, card: BP02-090, face_up: true}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, targets: {1: [b1]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b1: {hp: 6}
          P1.pp.current: 0
        events:
          - {kind: ダメージ, source: a1, target: b1, amount: 1}
        forbidden_events:
          - {kind: 引く}
          - {kind: 回復}

  - name: A3 對照：表向き 5 枚 → 4−1 → 受 3，且抽 1、回復 PP 1
    inherit: A 自我取代先套：2→4，再 −1 → シオン受 3
    setup:
      players:
        P1:
          zones:
            evolve_deck:
              - {id: a2, card: BP02-090, face_up: true}
              - {id: a3, card: BP02-090, face_up: true}
              - {id: a4, card: BP02-090, face_up: true}
              - {id: a5, card: BP02-090, face_up: true}
              - {id: a6, card: BP02-090, face_up: true}
            deck:
              - {id: d1, card: BP01-173}
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, targets: {1: [b1]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b1: {hp: 4}
          P1.pp.current: 1
          P1.hand: [d1]
        events:
          - {kind: ダメージ, source: a1, target: b1, amount: 3}
          - {kind: 引く, player: P1, object: d1}
          - {kind: 回復, player: P1, amount: 1}

  - name: B1 受影響者 P1 選「+1 → −1」→ シオン受 1
    setup:
      turn: {active: P2, first_player: P1, elapsed_turns: {P1: 6, P2: 6}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ビショップ, life: 20}
          pp: {current: 0, max: 6}
          zones:
            field:
              - {id: a1, card: BP14-090}          # 永久の盾・シオン
            hand:
              - {filler: 2}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ナイトメア, life: 20}
          pp: {current: 2, max: 6}
          zones:
            field:
              - {id: b1, card: BP06-073, state: {evolved: true, evolved_with: b9}}   # 大妖狐・ギンセツ（進化後 1/9：妖怪の与えるダメージ+1）
            evolution:
              - {id: b9, card: BP06-074}
            hand:
              - {id: b2, card: BP06-080}          # 火車（妖怪；大妖狐使其費用 −2 → 0）
            deck:
              - {id: b3, card: BP01-173}          # 【1】會把牌庫頂放墓場
              - {filler: 20}
    decisions:
      - {n: 1, by: P2, at: main, do: play, card: b2}
      - {n: 2, by: P2, at: check-timing, do: choose-pending, pending: {ability: {source: b2, line: 1}}, options: [1], targets: {1: [a1]}}
      - {n: 3, by: P1, at: resolve, of: {decision: 2, occurrence: 1}, do: order-replacements, order: [{source: b1, card: BP06-074, line: 2}, {source: a1, line: 3}]}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P2.pp.current: 2
          P2.field: [b1, b2]
      - at: after-decision-2
        view: omniscient
        outcome: paused
        awaiting:
          by: P1
          choices:
            - {do: order-replacements, order: [{source: b1, card: BP06-074, line: 2}, {source: a1, line: 3}]}
            - {do: order-replacements, order: [{source: a1, line: 3}, {source: b1, card: BP06-074, line: 2}]}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a1: {hp: 6}
          P2.cemetery: [b3]
          P2.deck: [filler: 20]
        events:
          - {kind: ダメージ, source: b2, target: a1, amount: 1}
          - {kind: 移動, object: b3, from: P2.deck, to: P2.cemetery}

  - name: B2 受影響者 P1 選「−1 → +1」→ 0 → 傷害不存在，+1 無從套用 → 不受傷
    inherit: B1 受影響者 P1 選「+1 → −1」→ シオン受 1
    decisions:
      - {n: 1, by: P2, at: main, do: play, card: b2}
      - {n: 2, by: P2, at: check-timing, do: choose-pending, pending: {ability: {source: b2, line: 1}}, options: [1], targets: {1: [a1]}}
      - {n: 3, by: P1, at: resolve, of: {decision: 2, occurrence: 1}, do: order-replacements, order: [{source: a1, line: 3}, {source: b1, card: BP06-074, line: 2}]}
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a1: {hp: 7}
          P2.cemetery: [b3]
        events:
          - {kind: 移動, object: b3, from: P2.deck, to: P2.cemetery}
        forbidden_events:
          - {kind: ダメージ}

  - name: C 費用固定值先於增減：「7にする」→ −4 → 3；並取得追加回合
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 6, P2: 5}, phase: main}
      history: explicit
      semantic_state:
        continuous_effects:
          - {id: e1, source: a1, text: このターン、次に自分がスペルをプレイする際、コストを-4する, applies_to: [P1], until: end-of-turn, order: 1}
        used_this_turn:
          - {ability: {source: a1, line: 2}, count: 1}
      players:
        P1:
          construction: class
          leader: {class: ウィッチ, life: 20}
          pp: {current: 3, max: 6}
          zones:
            field:
              - {id: a1, card: BP03-SL07, state: {acted: false}}   # オズの大魔女（起動能力已用，effect e1 待套）
            hand:
              - {id: a2, card: EBD02-007}         # 次元の超越（コスト12）
            deck:
              - {id: a3, card: BP01-173}          # 追加回合的開始階段抽到
              - {filler: 20}
            cemetery:
              - {id: c1, card: BP01-170}
              - {id: c2, card: BP01-170}
              - {id: c3, card: BP01-170}
              - {id: c4, card: BP01-180}
              - {id: c5, card: BP01-180}
              - {id: c6, card: BP01-180}
              - {id: c7, card: BP01-099}
              - {id: c8, card: BP01-099}
              - {id: c9, card: BP01-099}
              - {id: c10, card: BP01-131}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 5}
          zones:
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a2, optional_costs: {additional: {banish: [c1, c2, c3, c4, c5, c6, c7, c8, c9, c10]}}}
      - {n: 2, by: P1, at: main, do: end-phase}
      - {n: 3, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P1.banish: [c1, c2, c3, c4, c5, c6, c7, c8, c9, c10]
          P1.cemetery: [a2]
          P1.hand: []
        events:
          - {kind: 消滅, object: c1}
          - {kind: プレイ, object: a2}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          turn: {active: P1, phase: main}
          turn.elapsed_turns.P1: 7
          P1.pp: {current: 7, max: 7}
          P1.hand: [a3]
          P1.field.a1: {acted: false}

  - name: D 沒有 −4：費用 7 但 PP 3 → 不能打出、回溯，墓場法術未被消滅
    inherit: C 費用固定值先於增減：「7にする」→ −4 → 3；並取得追加回合
    setup:
      history: none
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a2, optional_costs: {additional: {banish: [c1, c2, c3, c4, c5, c6, c7, c8, c9, c10]}}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-play
        assert:
          P1.pp.current: 3
          P1.hand: [a2]
          P1.banish: []
          P1.cemetery: [c1, c2, c3, c4, c5, c6, c7, c8, c9, c10]
        forbidden_events:
          - {kind: 消滅}
          - {kind: プレイ}
