schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP01-099
kind: card
must_pass: true
mechanisms: [連擊、覺醒、真紅, 13.4.1.2, 取代效果, 10.10.2.5]
cards: [BP01-099, BP01-173, BP01-176]
why: >-
  竜の翼「フォロワーすべてに2ダメージ。【覚醒】状態なら、代わりに3ダメージ」：覚醒＝自己的 PP 最大值 7 以上（13.4.1.2），與目前 PP 無關；「代わりに」是自我取代，不是 2＋3（Q107）。
  雙方的從者都受傷（Q109）。
discriminates: >-
  用目前 PP 而不是 PP 最大值判斷覚醒的引擎 A（PP 3、最大 7）只造成 2；把「代わりに」做成加算的引擎造成 5。
refs:
  rules: [13.4.1.2, 10.10.2.5, 10.10.2.5.1, 4.4.3]
  qa: [Q107, Q109]
evidence:
  - ref: cr 13.4.1.2
    quote: ‘【覚醒】状態’とは‘あなたの現在の PP 最大値が 7 以上’を意味します。
  - ref: Q107
    quote: いいえ。【覚醒】の条件を満たしているとき、このスペルはフォロワーすべてに3ダメージ与えます。
status: verified
author: fable
verified_by:
  - by: astra
    method: qa
    note: A／B：xverify-1/result.md:88〈其他驗過的題目〉（13.4.1.2、Q107、Q109）

scenarios:
  - name: A PP 最大值 7（目前 PP 3）→ 覚醒 → 全場 3 傷害
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 7, P2: 6}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 3, max: 7}
          zones:
            field:
              - {id: a2, card: BP01-176}          # 天剣の乙女 4/6（自己的從者也受傷）
            hand:
              - {id: a1, card: BP01-099}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 6}
          zones:
            field:
              - {id: b1, card: BP01-173}          # ファイター 2/3
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P2.field: []
          P1.field.a2: {hp: 3}
          P1.pp.current: 0
        events:
          - {kind: ダメージ, source: a1, target: a2, amount: 3, group: 1}
          - {kind: ダメージ, source: a1, target: b1, amount: 3, group: 1}
        forbidden_events:
          - {kind: ダメージ, amount: 2}

  - name: B PP 最大值 6 → 非覚醒 → 2 傷害
    inherit: A PP 最大值 7（目前 PP 3）→ 覚醒 → 全場 3 傷害
    setup:
      turn: {elapsed_turns: {P1: 6, P2: 5}}
      players:
        P1:
          pp: {current: 6, max: 6}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b1: {hp: 1}
          P1.field.a2: {hp: 4}
        events:
          - {kind: ダメージ, source: a1, target: b1, amount: 2}
