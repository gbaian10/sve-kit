id: flow-main-stand-r3-01
kind: flow
must_pass: true
mechanisms:
  - D 開始階段不站起
  - 主要階段付費站起
cards:
  - BP01-173
  - ECP01-053
why: 開始階段回復出一 PP，但兩個主要階段待機分別在結算時付款；先付完，第二個輸入點只能拒付。
discriminates: 若先預扣兩份、開始階段誤站起或允許不足費用付款，PP、向き與第二份合法選項會不同。
refs:
  rules:
    - 10.4.7.3
    - 7.2.3
  qa:
    - Q1854
    - Q1855
evidence:
  - ref: Q1854
    quote: "Q: 自分のメインフェイズは自分のスタートフェイズの後に訪れますか？\nA: はい。自分のスタートフェイズの後に訪れます。\nスタートフェイズにおける、PP最大値の増加とPPの回復、フォロワーをスタンドすること（『〔月下の悪魔ちゃん♪〕メジロパーマー』は能力によってスタートフェイズにスタンドしない）、カードを1枚引くことをすべて行った後に、自分のメインフェイズが訪れます。"
    derivation:
      - 開始階段回復出一 PP，但兩個主要階段待機分別在結算時付款；先付完，第二個輸入點只能拒付。
  - ref: Q1855
    quote: "Q: 「自分のメインフェイズが来たとき、《コスト1》：これをスタンドする。」という能力のコストについて、自分のメインフェイズが来たとき、必ずコスト1を支払わなければならないですか？\nA: いいえ。コスト1を支払わず、スタンドしない選択を行うことができます。"
    derivation:
      - 開始階段回復出一 PP，但兩個主要階段待機分別在結算時付款；先付完，第二個輸入點只能拒付。
  - ref: cr 10.4.7.3
    quote: なんらかの自動能力において‘～とき、（処 理）：（効果）’と書かれている場合、これはそ の自動能力を解決する際にその処理を実行 することで、その効果を適用することを選択す ることができます。
    derivation:
      - 開始階段回復出一 PP，但兩個主要階段待機分別在結算時付款；先付完，第二個輸入點只能拒付。
  - ref: cr 7.2.3
    quote: ターンプレイヤーは、自身の場にあるカードをすべ てスタンドします。
    derivation:
      - 開始階段回復出一 PP，但兩個主要階段待機分別在結算時付款；先付完，第二個輸入點只能拒付。
