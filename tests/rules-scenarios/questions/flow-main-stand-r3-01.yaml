    method: independent-derivation
    note: 第三輪交叉驗證 fable-r3/xverify-1、xverify-2（審 astra-r3），astra-r3/fix-1 處理後同意
  - by: sol
    method: independent-derivation
    note: 第三輪最後核對（139 局面逐一推導）；部分洗牌的寫法依 CONTRACT 10.18
scenarios:
  - name: 先處理第一隻並選 execute
    setup:
      turn:
        active: P2
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 0
            max: 0
          ep: 0
          sep: 0
          zones:
            deck:
              - id: d
                card: BP01-173
              - filler: 20
            field:
              - id: a
                card: ECP01-053
                state:
                  acted: true
              - id: b
                card: ECP01-053
                state:
                  acted: true
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P2
        at: main
        do: end-phase
      - n: 2
        by: P1
        at: quick
        do: pass
      - n: 3
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 4
      - n: 4
        by: P1
        at: resolve
        do: resolve-choice
        of:
          decision: 3
          occurrence: 1
        choice: execute
      - n: 5
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: b
            line: 4
      - n: 6
        by: P1
        at: resolve
        do: resolve-choice
        of:
          decision: 5
          occurrence: 1
        choice: decline
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.pp:
            current: 1
            max: 1
          P1.hand:
            - d
          P1.field.a:
            acted: true
          P1.field.b:
            acted: true
      - at: after-decision-5
        view: omniscient
        outcome: paused
        assert: {}
        awaiting:
          by: P1
          choices:
            - do: resolve-choice
              choice: decline
      - at: after-decision-6
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P1.field.a:
            acted: false
          P1.field.b:
            acted: true
