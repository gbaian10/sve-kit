why: >-
  R-0011（inferred）區分明示的數值增加與派生數值。第四個祈りカウンター使命中ラピス常在條件而成為 5／5 從者，沒有執行體力增加。
discriminates: >-
  把種類切換後重新可讀取的體力當成增加會多發體力增加事件。
refs:
  rules:
    - "10.9"
    - 7.3.1
  qa:
    - Q2758
    - Q2130
  rulings:
    - R-0011
evidence:
  - ref: R-0011
    derivation:
      - 種類切換後顯示的數值是派生資訊，並非數值處理的結果
status: draft
author: sol
verified_by: []
