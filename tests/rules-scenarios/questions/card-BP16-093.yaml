          P2: 8
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ビショップ
            life: 20
          pp:
            current: 8
            max: 8
          zones:
            deck:
              - id: draw
                card: BP01-173
              - filler: 19
            field:
              - id: lapis
                card: BP16-093
