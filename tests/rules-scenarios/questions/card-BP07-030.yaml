schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP07-030
kind: card
must_pass: true
mechanisms: [以實際支付的數量當 X, 必須追加代價 vs 可選減費代價, 10.6.2.5.1.4, 10.6.2.5.3, 10.6.2.5.4, 10.4.7.2, 護符アクト當費用, 1.3.2.2]
cards: [BP07-030, BP17-T19, BP12-SL08, BP07-P06, BP01-176]
why: >-
  三種「用ナテラの大樹アクト當代價」的寫法。
  A／A2 ハルバードウルフ 起動「場の『ナテラの大樹』を好きな枚数アクト：…「アクトした『ナテラの大樹』の枚数」と同じダメージ」：傷害＝實際アクト的張數；
  選 0 張也是合法支付（10.6.2.5.3），只是 0 傷害不做（1.3.2.2），ウルフ 自己仍アクト。
  B／B2 信念の剣閃「追加コストとして場の『ナテラの大樹』2つをアクトする（追加コストを支払わなければプレイできない）」：必須的追加費用（10.6.2.5.1.4），
  站著的大樹不足 2 棵就不能打出（10.6.2.5.4）。
  C／C2 王の一閃「プレイする際、場の『ナテラの大樹』2つをアクト：コストを-2する」：可選的減費代價（10.4.7.2），不付就付 3 PP。
discriminates: >-
  A2：把 0 張當成付不出費用的引擎會 cannot-activate（ウルフ 沒アクト）；發出 amount 0 傷害事件的引擎違反 forbidden_events。
  B2：把必須的追加費用做成可選的引擎會讓 s1 打出（PP 3、b1 受 5）。C2：把減費代價做成必須的引擎會 cannot-play；把它當成不付也減費的引擎 PP 會是 4 而非 2。
refs:
  rules: [10.4.2, 10.4.3, 10.4.7.2, 10.6.2.2.2, 10.6.2.5.1.4, 10.6.2.5.3, 10.6.2.5.4, 1.3.2.2, 5.4.1]
  qa: [Q1641, Q996]
evidence:
  - ref: cr 10.6.2.5.3
    quote: コストとして実行する内容のうち、その内容を 0 単位実行するものは、何も実行せずにその内容を実行したものとみなされます（1.3.2.2）。
    derivation: [「好きな枚数アクト」選 0 張 → 費用視為已支付 → 能力結算，「0 と同じダメージ」依 1.3.2.2 不做]
  - ref: cr 10.6.2.5.4
    quote: なんらかの理由でこの時点でこのコストを支払うことができない場合、このカードや能力のプレイは取り消され、ゲームはこのカードや能力をプレイすることを選択する前まで戻されます。
    derivation: [信念の剣閃 的追加費用要 2 棵站著的大樹；只有 1 棵 → 付不出 → 不能打出]
  - ref: Q996
    quote: はい。「これをプレイする際、場の『ナテラの大樹』2つを《アクト》：コストを-2する。」と「これをプレイする際、自分の場に『王たる光・ベイリオン』がいるなら、コストを-1する。」をどちらも満たした場合、コストは-3されます。
  - ref: Q1641
    quote: はい。自分の場の自然・フォロワー1体まで選ぶ場合、0体を選ぶことができるため、このスペルをプレイすることができます。
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: A／B／B2：xverify-2/recheck.md:107〈全部改動局面的核對索引〉；A2／C／C2：xverify-2/result.md:253〈全部實質核驗局面的索引〉（10.4.2、10.4.3、Q1641、Q996）

scenarios:
  - name: A ハルバードウルフ 起動：アクト 2 棵大樹 → 2 傷害
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 6, P2: 5}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 5, max: 5}
          zones:
            field:
              - {id: a1, card: BP07-030}          # ハルバードウルフ 2/3
              - {id: t1, card: BP17-T19}          # ナテラの大樹（アミュレット・トークン）
              - {id: t2, card: BP17-T19}
              - {id: t3, card: BP17-T19}
            hand:
              - {id: s1, card: BP12-SL08}         # 信念の剣閃（コスト2、追加コスト：大樹2つアクト）
              - {id: s2, card: BP07-P06}          # 王の一閃（コスト3、大樹2つアクト：-2）
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 0, max: 5}
          zones:
            field:
              - {id: b1, card: BP01-176}          # 天剣の乙女 4/6
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: activate, ability: {source: a1, line: 2}, costs: {1: [t1, t2]}, targets: {1: [b1]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 5
          P1.field.a1: {acted: true}
          P1.field.t1: {acted: true}
          P1.field.t2: {acted: true}
          P1.field.t3: {acted: false}
          P2.field.b1: {hp: 4}
        events:
          # 費用一次全部支付（10.6.2.5）：三個アクト 同時
          - {kind: アクト, object: a1, group: 1}
          - {kind: アクト, object: t1, group: 1}
          - {kind: アクト, object: t2, group: 1}
          - {kind: ダメージ, source: a1, target: b1, amount: 2}

  - name: A2 アクト 0 棵大樹 → 費用視為已付、0 傷害不做；ウルフ 仍アクト
    inherit: A ハルバードウルフ 起動：アクト 2 棵大樹 → 2 傷害
    decisions:
      - {n: 1, by: P1, at: main, do: activate, ability: {source: a1, line: 2}, costs: {1: []}, targets: {1: [b1]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a1: {acted: true}
          P1.field.t1: {acted: false}
          P2.field.b1: {hp: 6}
        events:
          - {kind: アクト, object: a1}
          - {kind: プレイ, ability: {source: a1, line: 2}}
          - {kind: 解決, ability: {source: a1, line: 2}}
        forbidden_events:
          - {kind: ダメージ}

  - name: B 信念の剣閃：必須追加費用アクト 2 棵大樹 → 打出、5 傷害＋リーダー 2
    inherit: A ハルバードウルフ 起動：アクト 2 棵大樹 → 2 傷害
    decisions:
      # 契約 10.6：「相手のフォロワー1体と自分の自然・フォロワー1体まで選ぶ」是同一個「選ぶ」→ 同一個鍵、平坦列表（己方選 0 體就只列 b1）
      - {n: 1, by: P1, at: main, do: play, card: s1, costs: {1: [t1, t2]}, targets: {1: [b1]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 3
          P1.field.t1: {acted: true}
          P1.field.t2: {acted: true}
          P1.field.t3: {acted: false}
          P1.cemetery: [s1]
          P2.field.b1: {hp: 1}
          P2.leader.life: 18
        events:
          - {kind: アクト, object: t1, group: 1}
          - {kind: アクト, object: t2, group: 1}
          - {kind: ダメージ, source: s1, target: b1, amount: 5}
          - {kind: ダメージ, source: s1, target: P2.leader, amount: 2}

  - name: B2 只有 1 棵站著的大樹 → 信念の剣閃 付不出追加費用 → 不能打出
    inherit: A ハルバードウルフ 起動：アクト 2 棵大樹 → 2 傷害
    setup:
      players:
        P1:
          zones:
            field:
              - {id: a1, card: BP07-030}
              - {id: t1, card: BP17-T19}
              - {id: t2, card: BP17-T19, state: {acted: true}}
              - {id: t3, card: BP17-T19, state: {acted: true}}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: s1, costs: {1: [t1]}, targets: {1: [b1]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-play
        assert:
          P1.pp.current: 5
          P1.hand: [s1, s2]
          P1.field.t1: {acted: false}
          P2.field.b1: {hp: 6}
        forbidden_events:
          - {kind: アクト}
          - {kind: ダメージ}
          - {kind: プレイ}

  - name: C 王の一閃：付可選代價アクト 2 棵大樹 → 費用 1
    inherit: A ハルバードウルフ 起動：アクト 2 棵大樹 → 2 傷害
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: s2, optional_costs: {additional: {act: [t1, t2]}}, targets: {1: [b1]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 4
          P1.field.t1: {acted: true}
          P1.field.t2: {acted: true}
          P2.field.b1: {hp: 2}
        events:
          - {kind: ダメージ, source: s2, target: b1, amount: 4}

  - name: C2 王の一閃：不付可選代價 → 費用 3
    inherit: A ハルバードウルフ 起動：アクト 2 棵大樹 → 2 傷害
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: s2, optional_costs: {additional: decline}, targets: {1: [b1]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 2
          P1.field.t1: {acted: false}
          P1.field.t2: {acted: false}
          P2.field.b1: {hp: 2}
        forbidden_events:
          - {kind: アクト}
