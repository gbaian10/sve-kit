schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: card-CP04-103
kind: card
must_pass: true
mechanisms:
  - 搜尋有條件
  - 名稱包含比對
cards:
  - BP01-173
  - CP04-103
  - CP04-P56
why: 'ミミ搜尋是完全卡名比對，找到則入手；可不找到但仍洗牌。找到時依 5.8.1.2 先向對手出示，以公開 to: P2 事件比對，再移入手牌；未找到則禁止搜尋卡 d 的公開事件。'
discriminates: 搜尋後沒洗牌或強制加入會改變牌庫／手牌。
refs:
  rules:
    - 5.8.1.2
    - 4.1.2.2
    - 5.8.2
  qa: []
evidence:
  - ref: cr 5.8.1.2
    quote: "特定条件に枚数以外の条件がある場合、そ\nれを見つけた後に、そのカードが条件を満た\nすことを相手に示します。"
    derivation:
      - 'ミミ搜尋是完全卡名比對，找到則入手；可不找到但仍洗牌。找到時依 5.8.1.2 先向對手出示，以公開 to: P2 事件比對，再移入手牌；未找到則禁止搜尋卡 d 的公開事件。'
  - ref: cr 4.1.2.2
    quote: "非公開領域においては、その領域のカード\nがなんらかの効果によりすべてのプレイヤー\nに対して公開されているのでないかぎり、その\n領域に特定の条件を満たすカードが存在する\nことは保証されません。その領域が公開され\nているプレイヤーは、その条件を満たすカード\nがあっても、そのようなカードが存在しないも\nのとして扱うことができます。"
    derivation:
      - 'ミミ搜尋是完全卡名比對，找到則入手；可不找到但仍洗牌。找到時依 5.8.1.2 先向對手出示，以公開 to: P2 事件比對，再移入手牌；未找到則禁止搜尋卡 d 的公開事件。'
  - ref: cr 5.8.2
    quote: "デッキからカードを探し、その見つけたカードを指定\nの領域に移動したか、見つけたカードを移動しない\nことを選んだか、カードを見つけなかった後、その\nデッキをシャッフルします。"
    derivation:
      - 'ミミ搜尋是完全卡名比對，找到則入手；可不找到但仍洗牌。找到時依 5.8.1.2 先向對手出示，以公開 to: P2 事件比對，再移入手牌；未找到則禁止搜尋卡 d 的公開事件。'
status: verified
author: astra
verified_by:
  - by: fable
    method: qa
    note: '4.1.2.2、5.8.1.2、5.8.2、Q2242；xverify-1/result.md；遷移後 xverify-2/result.md 2/2；「找到=True」fix-2 公開 to: P2 後 xverify-2/recheck.md 同意；followup 只改 why（xverify-2/final.md）'
scenarios:
  - name: 找到=True
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - id: d
                card: CP04-P56
              - id: x
                card: BP01-173
            hand:
              - id: a
                card: CP04-103
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: a
      - n: 2
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 2
      - n: 3
        by: P1
        at: resolve
        do: resolve-choice
        of:
          decision: 2
          occurrence: 1
        select:
          - d
    random:
      shuffles:
        - player: P1
          zone: deck
          result:
            - x
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.hand:
            - d
          P1.deck:
            - x
      - at: after-decision-3
        view: P2
        outcome: resolved
        assert:
          P1.hand_count: 1
          P1.deck_count: 1
        events:
          - kind: 公開
            object: d
            to: P2
            source: a
  - name: 找到=False
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - id: d
                card: CP04-P56
              - id: x
                card: BP01-173
            hand:
              - id: a
                card: CP04-103
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: a
      - n: 2
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 2
      - n: 3
        by: P1
        at: resolve
        do: resolve-choice
        of:
          decision: 2
          occurrence: 1
        select: []
    random:
      shuffles:
        - player: P1
          zone: deck
          result:
            - x
            - d
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.hand: []
          P1.deck:
            - x
            - d
      - at: after-decision-3
        view: P2
        outcome: resolved
        assert:
          P1.hand_count: 0
          P1.deck_count: 2
        forbidden_events:
          - kind: 公開
            object: d
