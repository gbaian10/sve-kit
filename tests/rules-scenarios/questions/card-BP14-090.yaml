schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP14-090
kind: card
must_pass: true
mechanisms: [持續效果與禁止, 11.3.2.1, '12.14', 必殺對「能力によって破壊されない」無效, 取代效果, 5.14.2, 破壞時點在結算之後]
cards: [BP14-090, BP12-072, BP02-120, BP01-173]
why: >-
  永久の盾・シオン「これは能力によって破壊されない」「これと自分のリーダーが受けるダメージを-1する」。A：0 攻擊力的必殺從者攻擊它：必殺的破壞依 11.3.2.1 視為
  「能力による破壊」→ 不破壞；シオン的 3 交戰傷害破壞攻擊者。B（Q1942）：死の舞踏 5 傷害 −1＝4 → 體力 3；「それのリーダーに2ダメージ」時シオン仍在場
  （破壞處理在結算之後）→ −1 → 1。
discriminates: >-
  把必殺做成規則破壞而不套「能力によって破壊されない」的引擎，A 會破壞シオン；B 中在結算中途就把體力 ≤0 的從者移走、或先算リーダー傷害再套 −1 的引擎，P2 體力會是 18。
refs:
  rules: [11.3.2, 11.3.2.1, 12.14.2, 12.14.2.1, 5.14.2, 11.1.2, 10.6.2.8.2, 8.4.9.1]
  qa: [Q1942, Q1939]
evidence:
  - ref: cr 11.3.2.1
    quote: なんらかの効果が‘能力による破壊’を参照する場合、11.3.2 による破壊は必殺能力による破壊とみなします。
  - ref: Q1942
    quote: いいえ。相手のリーダーに与えるダメージは1になります。『死の舞踏』の能力によるダメージで『永久の盾・シオン』の体力は0以下になりますが、『永久の盾・シオン』の破壊処理は『死の舞踏』の能力の解決後であるため、『永久の盾・シオン』の能力が有効です。
    derivation:
      - 本題シオン體力 7 → 4 傷害後 3，不會歸 0；重點是リーダー傷害 2−1＝1
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 必殺（攻擊力 0）攻擊シオン → シオン不被破壞，攻擊者被交戰傷害破壞
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 6, P2: 5}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ナイトメア, life: 20}
          pp: {current: 6, max: 6}
          zones:
            field:
              - {id: a1, card: BP12-072}          # モーターグレイブディガー 0/1【必殺】
            hand:
              - {filler: 2}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ビショップ, life: 20}
          pp: {current: 0, max: 6}
          zones:
            field:
              - {id: b1, card: BP14-090, state: {acted: true}}   # 永久の盾・シオン 3/7 アクト
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: attack, attacker: a1, target: b1}
      - {n: 2, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.field: [b1]
          P2.field.b1: {hp: 7}
          P1.field: []
          P1.cemetery: [a1]
        events:
          - {kind: ダメージ, source: b1, target: a1, amount: 3}
          - {kind: 破壊, object: a1, by: rule-11.3.1}
        forbidden_events:
          - {kind: 破壊, object: b1}
          - {kind: ダメージ, target: b1}

  - name: B 死の舞踏：5−1＝4 傷害；リーダー傷害時シオン仍在場 → 2−1＝1
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 6, P2: 5}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ナイトメア, life: 20}
          pp: {current: 4, max: 6}
          zones:
            hand:
              - {id: a1, card: BP02-120}          # 死の舞踏
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ビショップ, life: 20}
          pp: {current: 0, max: 6}
          zones:
            field:
              - {id: b1, card: BP14-090}
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, targets: {1: [b1]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b1: {hp: 3}
          P2.leader.life: 19
        events:
          - {kind: ダメージ, source: a1, target: b1, amount: 4}
          - {kind: ダメージ, source: a1, target: P2.leader, amount: 1}
