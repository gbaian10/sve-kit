schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP20-R13
kind: card
must_pass: true
mechanisms: [跳過回合當費用, 5.26.2, 3.3.2.1, 額外回合、跳過、勝利, 進化卡自身的能力, 12.2.2, 回合特定時點]
cards: [BP20-R13, BP20-R14, BP01-173]
why: >-
  安息の絶傑・マーウィン「{進化}次の自分のターンをスキップする：これは進化する」：以跳過自己下一回合當進化費用，不花 PP／EP（Q747）。
  被跳過的回合不開始（5.26.2）：沒有開始階段（PP 不回復、不抽牌），也不計入經過回合數（3.3.2.1）→ 對手連續兩個回合。
  進化後的【進化時】：PP 最大值 +1、リーダー +3、抽 1；進化後有【守護】，結束階段要問守護アクト（7.4.3）。
discriminates: >-
  把跳過做成「開始階段後立刻結束」的引擎：after-decision-7 時 P1 的 PP 會回滿、手牌多 1 張、經過回合數 6。
  把跳過的回合計入經過回合數的引擎：turn.elapsed_turns.P1 會是 6。要求付 PP 的引擎：after-decision-1 會 cannot-evolve 或 PP 少於 5。
refs:
  rules: [5.26.1, 5.26.2, 3.3.2.1, 12.2.2, 12.6.1, 7.2.1, 7.2.2, 7.2.4, 7.4.3, 7.4.9]
  qa: [Q747]
evidence:
  - ref: Q747
    quote: 《進化》能力のコストとして次の自分のターンをスキップすることで進化することができる能力です。次の自分のターンをスキップした場合、次に来る自分のターンを行いません。すなわち、次の相手のターンのエンドフェイズが終わった後、もう一度相手のターンを行います。
  - ref: cr 3.3.2.1
    quote: あるプレイヤーがターンをスキップした（5.26）場合、そのターンは経過ターン数に数えません。
  - ref: cr 5.26.1
    quote: あるターンを‘スキップする’指示がある場合、そのターンを開始する時点で、そのターンを開始するのではなく、そのターンの次に来るターンを開始します。
    derivation: [被跳過的回合連開始階段都沒有 → 不回復 PP、不抽牌、場上的卡不站起]
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: A：xverify-2/result.md:267〈全部實質核驗局面的索引〉（5.26.1、5.26.2、Q747）

scenarios:
  - name: A 以跳過下一回合為費用進化 → 進化時 PP 最大值 +1、+3、抽 1 → 對手回合 → 自己回合被跳過 → 對手再一個回合
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 5, P2: 4}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ビショップ, life: 20}
          pp: {current: 5, max: 5}
          ep: 2
          zones:
            field:
              - {id: a1, card: BP20-R13}          # 安息の絶傑・マーウィン 4/4
            evolve_deck:
              - {id: e1, card: BP20-R14}          # マーウィン（エボルヴ）8/8 守護 オーラ
            deck:
              - {id: d1, card: BP01-173}
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 4}
          zones:
            hand:
              - {filler: 3}
            deck:
              - {id: p1, card: BP01-173}
              - {id: p2, card: BP01-173}
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: evolve, source: a1, ability: {source: a1, line: 2}, evolve_card: e1, pay: {pp: 0, ep: 0}}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, card: BP20-R14, line: 2}}}
      - {n: 3, by: P1, at: main, do: end-phase}
      - {n: 4, by: P1, at: end, do: guard-act, select: []}
      - {n: 5, by: P2, at: quick, do: pass}
      - {n: 6, by: P2, at: main, do: end-phase}
      - {n: 7, by: P1, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp: {current: 5, max: 5}
          P1.ep: 2
          P1.field.a1: {evolved: true, evolved_with: e1, power: 8, hp: 8}
        events:
          - {kind: 進化, object: a1, with: e1}
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, card: BP20-R14, line: 2}}}
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.pp: {current: 5, max: 6}
          P1.leader.life: 23
          P1.hand: [d1]
        events:
          - {kind: 体力増加, target: P1.leader, amount: 3}
          - {kind: 引く, player: P1, object: d1}
      - at: after-decision-5
        view: omniscient
        outcome: resolved
        assert:
          turn: {active: P2, phase: main}
          turn.elapsed_turns.P1: 5
          turn.elapsed_turns.P2: 5
          P2.pp: {current: 5, max: 5}
          P2.hand_count: 4
      - at: after-decision-7
        view: omniscient
        outcome: resolved
        assert:
          turn: {active: P2, phase: main}
          turn.elapsed_turns.P1: 5
          turn.elapsed_turns.P2: 6
          P2.pp: {current: 6, max: 6}
          P2.hand_count: 5
          P1.pp: {current: 5, max: 6}
          P1.hand: [d1]
        events:
          - {kind: 引く, player: P2, object: p2}
        forbidden_events:
          - {kind: 引く, player: P1}
          - {kind: 回復, player: P1}
