schema: sve-exam/2.1
sources:
  rules: cr-1.28.0
  cards_jsonl_sha256: 541781306484527c858c6587a2c838764b0513595b00711751370534050c3fa1
id: card-CP04-114
kind: card
must_pass: false
mechanisms:
  - UB
  - 每回合限次
  - 效果授權發動
cards:
  - BP01-173
  - CP04-003
  - CP04-088
  - CP04-113
  - CP04-114
why: >-
  R-0016（inferred）採每次發動都記入同一能力的使用歷史。アメス可越過通常起動限制，但其效果發動已使用イオ的當回合通常起動額度。待官方回覆（svestats）。
discriminates: >-
  效果發動未記限次時，仍有 PP 與場上對手從者的 P1 可第二次起動イオ。
refs:
  rules:
    - 14.5.1.4
    - 10.6.2
  qa:
    - Q2488
    - Q2550
  rulings:
    - R-0016
evidence:
  - ref: R-0016
    derivation:
      - Q2488 回答通常起動在前的順序，反向順序依目前採用的限次記錄
status: disputed
author: sol
verified_by: []
scenarios:
  - name: アメス先免原費用發動イオ的 UB，當回合不能再通常起動
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: title
          leader:
            class: ナイトメア
            life: 20
          pp:
            current: 8
            max: 8
          zones:
            deck:
              - filler: 20
            field:
              - id: ameth
                card: CP04-113
              - id: io
                card: CP04-088
              - id: eris1
                card: CP04-003
              - id: eris2
                card: CP04-003
            evolve_deck:
              - id: ameth-evo
                card: CP04-114
          title: プリンセスコネクト！Re:Dive
        P2:
          construction: class
          leader:
            class: ロイヤル
            life: 20
          pp:
            current: 8
            max: 8
          zones:
            deck:
              - filler: 20
            field:
              - id: b1
                card: BP01-173
              - id: b2
                card: BP01-173
    decisions:
      - n: 1
        by: P1
        at: main
        do: activate
        ability:
          source: eris1
          line: 1
        targets:
          "1":
            - io
      - n: 2
        by: P1
        at: main
        do: activate
        ability:
          source: eris2
          line: 1
        targets:
          "1":
            - io
      - n: 3
        by: P1
        at: main
        do: evolve
        source: ameth
        evolve_card: ameth-evo
        pay:
          pp: 1
          ep: 0
          sep: 0
      - n: 4
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: ameth
            line: 1
            card: CP04-114
        options:
          - 2
        targets:
          "2":
            - io
      - n: 5
        by: P2
        at: resolve
        do: resolve-choice
        of:
          decision: 4
          occurrence: 1
        select:
          - b1
      - n: 6
        by: P1
        at: main
        do: activate
        ability:
          source: io
          line: 1
    random: {}
    expected:
      - at: after-decision-4
        view: omniscient
        outcome: paused
        assert:
          P1.pp.current: 7
        awaiting:
          by: P2
          choices:
            - do: resolve-choice
              select:
                - b1
            - do: resolve-choice
              select:
                - b2
      - at: after-decision-5
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 7
          P2.cemetery:
            - b1
          P2.field:
            - b2
          semantic_state.counters_this_turn:
            P1.ub_activated: 4
      - at: after-decision-6
        view: omniscient
        outcome: cannot-activate
        assert:
          P1.pp.current: 7
          P2.field:
            - b2
