    setup:
      players:
        P1:
          pp: {current: 10, max: 10}
          zones:
            cemetery:
              - {id: c1, card: CP02-003}
              - {id: c2, card: CP02-003}
              - {id: c3, card: CP02-003}
              - {id: c4, card: CP02-003}
              - {id: c5, card: CP02-001}
              - {id: c6, card: CP02-001}
              - {id: c7, card: CP02-001}
              - {id: c8, card: CP02-007}
              - {id: c9, card: CP02-007}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: h1}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-play
        assert:
          P1.pp.current: 10
          P1.hand: [h1, filler: 1]
