  - name: 放入 EX 1 張
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - id: d0
                card: BP01-173
              - id: tail
                card: BP01-173
            field:
              - id: a
                card: BP21-P38
            hand:
              - id: s
                card: BP01-056
            ex:
              - id: x0
                card: BP01-173
              - id: x1
                card: BP01-173
              - id: x2
                card: BP01-173
              - id: x3
                card: BP01-173
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: b
                card: BP01-176
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: s
      - n: 2
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 1
        targets:
          1:
            - b
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.deck:
            - tail
          P2.field.b:
            hp: 6
        awaiting:
          by: P1
          choices:
            - do: choose-pending
              pending:
                ability:
                  source: a
                  line: 1
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b:
            hp: 1
          P1.leader.life: 22
          semantic_state.pending_triggers: []
