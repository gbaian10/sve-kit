id: card-BP21-P38
kind: card
must_pass: true
mechanisms:
  - 10.7 其他
  - 重複
  - 卡片出處
cards:
  - BP01-056
  - BP01-173
  - BP01-176
  - BP21-P38
why: 神秘の獲得逐次放 EX，但ターンごとに1回只待機一次；整個補 EX 效果完成後才處理傷害。
discriminates: 每張各觸發或結算插入原效果會多傷害，或太早停在待機。
refs:
  rules:
    - 10.7.2.2
    - 10.7.1
  qa: []
evidence:
  - ref: cr 10.7.2.2
    quote: "‘ターンごとに（数値）回’という表記を持つ\n自動能力が誘発条件を満たした場合、この自\n動能力は最大で、（数値）からこのターン中に\nこの自動能力が待機状態になった回数を引い\nた回数まで待機状態になります。その際、同\n時に満たした条件のうちどの誘発条件による\nものを実際に待機状態にするかは、その自動\n能力のマスターが選びます。"
    derivation:
      - 神秘の獲得逐次放 EX，但ターンごとに1回只待機一次；整個補 EX 效果完成後才處理傷害。
  - ref: cr 10.7.1
    quote: "自動能力とは、特定の誘発条件が発生したとき\nに、その後に発生したチェックタイミングでプレイされ\nる能力を指します。"
    derivation:
      - 神秘の獲得逐次放 EX，但ターンごとに1回只待機一次；整個補 EX 效果完成後才處理傷害。
status: draft
author: astra
verified_by: []
