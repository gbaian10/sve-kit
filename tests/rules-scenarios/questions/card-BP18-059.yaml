schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP18-059
kind: card
must_pass: true
mechanisms: [從 EX 打出的加成與 EX 減費, Q2386, 10.4.4.1, 10.4.7.2, 可選追加費用 pp, 費用為負視為 0, 1.3.2.2.1, 5.8.1.2, 探す 後洗牌, 10.6.2.1.3]
cards: [BP18-058, BP18-059, BP13-060, BP21-PR11, BP01-173, BP01-176]
why: >-
  壊竜の六銘伝・エル（進化後）【進化時】看 3 張，武闘竜人卡 1 張放 EX，「このターン、それをプレイする際、コストを-3する」。放進 EX 的爆炎の咆哮（コスト2）有「これをプレイする際、コストを+3してよい」（10.4.7.2 的可選追加費用）：
  A：付 +3 → 減少的 PP 是 2＋3−3＝2（Q2386），效果附帶從牌庫找『焦熱の竜翼・ドラーク』上場並給【指定攻撃】；找到後要向對手公開（5.8.1.2）並洗牌（5.8.2）。
  B：不付 +3 → 2−3＝−1 → 視為 0（1.3.2.2.1）→ PP 不減，只有 3 傷害。
discriminates: >-
  A：只套用 +3 或只套用 −3 的引擎 PP 分別是 2 或 7；沒把 EX 上的減費帶進解決領域（10.6.2.1.3）的引擎會扣 5。
  B：把負費用當成不能打出、或反過來「回復」1 PP 的引擎 outcome／PP 不同。
refs:
  rules: [10.4.4.1, 10.4.7.2, 10.6.2.2.2, 10.6.2.1.3, 1.3.2.2.1, 5.8.1.2, 5.8.2, 5.11.1, 12.11.2, 12.2.3]
  qa: [Q2386, Q1770]
evidence:
  - ref: Q2386
    quote: はい。コスト2でプレイできます。
  - ref: cr 1.3.2.2.1
    quote: 値がマイナスである情報を基準として加減算以外のなんらかの行動を行う必要がある場合、その値が 0 であるものとしてその行動を実行します。例：なんらかの効果でコストがマイナスの値になっているカードをプレイする場合、コストが 0 であるものとしてプレイを行います。
  - ref: cr 10.4.4.1
    quote: カードをプレイする際のコストの数値を変更する効果は、このカードのコストの情報の値を変更するのではなく、そのコストのために減少する PP の点数を変更します。
  - ref: cr 5.8.1.2
    quote: 特定条件に枚数以外の条件がある場合、それを見つけた後に、そのカードが条件を満たすことを相手に示します。
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: 第三輪交叉驗證 astra-r3/xverify-1、xverify-2（審 fable-r3），fable-r3/fix-1～fix-3 處理後同意
  - by: sol
    method: independent-derivation
    note: 第三輪最後核對（139 局面逐一推導）；F1、F2 與禁止 vs 置換仲裁已依核對結果修正

scenarios:
  - name: A 進化時把爆炎の咆哮 放 EX → 付 +3 打出 → 只扣 2 PP，找ドラーク 上場
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 7, P2: 6}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 7, max: 7}
          ep: 2
          zones:
            field:
              - {id: a1, card: BP18-058}                     # 壊竜の六銘伝・エル 3/3
            evolve_deck:
              - {id: e1, card: BP18-059}
            hand:
              - {filler: 1}
            deck:
              - {id: d1, card: BP01-173}
              - {id: d2, card: BP13-060}                     # 爆炎の咆哮（武闘竜人・スペル コスト2）
              - {id: d3, card: BP01-176}
              - {id: s1, card: BP21-PR11}                    # 焦熱の竜翼・ドラーク
              - {id: f1, card: BP01-173}
              - {id: f2, card: BP01-173}
              - {id: f3, card: BP01-173}
              - {id: f4, card: BP01-173}
              - {id: f5, card: BP01-173}
              - {id: f6, card: BP01-173}
              - {id: f7, card: BP01-173}
              - {id: f8, card: BP01-173}
              - {id: f9, card: BP01-173}
              - {id: f10, card: BP01-173}
              - {id: f11, card: BP01-173}
              - {id: f12, card: BP01-173}
              - {id: f13, card: BP01-173}
              - {id: f14, card: BP01-173}
              - {id: f15, card: BP01-173}
              - {id: f16, card: BP01-173}                          # 牌庫其餘用真實卡（搜尋會觀察整副牌）
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 7}
          zones:
            field:
              - {id: b1, card: BP01-176}                     # 天剣の乙女 4/6
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: evolve, source: a1, ability: {source: a1, line: 1}, evolve_card: e1, pay: {pp: 0, ep: 1, sep: 0}}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, card: BP18-059, line: 1}}}
      - {n: 3, by: P1, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, select: [d2]}
      - {n: 4, by: P1, at: resolve, of: {decision: 2, occurrence: 2}, do: resolve-choice, order: [d1, d3]}
      - {n: 5, by: P1, at: main, do: play, card: d2, targets: {1: [b1]}, optional_costs: {additional: {pp: 3}}}
      - {n: 6, by: P1, at: resolve, of: {decision: 5, occurrence: 1}, do: resolve-choice, select: [s1]}
      - {n: 7, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: s1, line: 3}}}
    random:
      shuffles:
        - {player: P1, zone: deck, result: [f1, f2, f3, f4, f5, f6, f7, f8, f9, f10, f11, f12, f13, f14, f15, f16, d1, d3]}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: paused
        awaiting:
          by: P1
          choices:
            - {do: resolve-choice, select: [d2]}
            - {do: resolve-choice, select: []}
        assert:
          P1.ep: 1
          P1.pp.current: 7
          P1.field.a1: {evolved: true, evolved_with: e1, power: 4, hp: 4}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P1.ex: [d2]
          P1.deck: [s1, f1, f2, f3, f4, f5, f6, f7, f8, f9, f10, f11, f12, f13, f14, f15, f16, d1, d3]
      - at: after-decision-5
        view: omniscient
        outcome: paused
        awaiting:
          by: P1
          choices:
            - {do: resolve-choice, select: [s1]}
            - {do: resolve-choice, select: []}
        assert:
          P1.pp.current: 5
          P1.ex: []
          P2.field.b1: {hp: 3}
        events:
          - {kind: プレイ, object: d2}
          - {kind: ダメージ, source: d2, target: b1, amount: 3}
      - at: after-decision-6
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: s1, line: 3}}}
        assert:
          P1.field: [a1, s1]
          P1.field.s1: {entered_from: deck, entered_by: effect}
          P1.deck: [f1, f2, f3, f4, f5, f6, f7, f8, f9, f10, f11, f12, f13, f14, f15, f16, d1, d3]
          P1.cemetery: [d2]
        events:
          - {kind: 公開, object: s1, to: P2}
          - {kind: 場に出す, object: s1, from: P1.deck}
      - at: after-decision-7
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 5
          P1.field: [a1, s1]

