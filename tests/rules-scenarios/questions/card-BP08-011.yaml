schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP08-011
kind: card
must_pass: true
mechanisms: [奪取、交換、變身, '5.17', 9.1.2, 9.1.4.4, 10.6.2.3.3, 名稱包含比對]
cards: [BP08-011, BP08-T09, BP08-T01, BP08-T02]
why: >-
  心無き決闘「自分のEXエリアの『操り人形』2枚を選ぶ。それはそれぞれ『ロイド』と『ヴィクトリア』に変身する」：変身＝消滅該卡並在同區域建立同數量的指定 token（5.17.1）；
  被消滅的 token 立即消去（Q1058）；「それぞれ」→ 一張變ロイド、一張變ヴィクトリア，不能兩張都變ロイド（Q1061）；只有 1 張『操り人形』時不能打出（Q1060）。
discriminates: >-
  把変身做成「改名／改面」而不是消滅＋新建的引擎不會有 消滅／消去 事件；允許兩張都變ロイド的引擎會有兩個相同的 場に出す；
  B 中允許 1 張時打出的引擎會 resolved。
refs:
  rules: [5.17.1, 5.7.1, 9.1.2, 9.1.4.4, 10.6.2.3.1, 10.6.2.3.3, 4.8.2]
  qa: [Q1058, Q1061, Q1060]
evidence:
  - ref: cr 5.17.1
    quote: あるカードを‘『（トークン名）』に変身する’指示がある場合、そのカードを消滅し、新たにその領域に（ト―クン名）のトークンを、消滅したカードの枚数と同じ数作成します。
  - ref: Q1061
    quote: いいえ。『ロイド』2枚に変身させることはできません。選んだ『操り人形』のうち1枚が『ロイド』に変身し、もう1枚が『ヴィクトリア』に変身します。
  - ref: Q1060
    quote: いいえ。自分のEXエリアの『操り人形』2枚を選ぶことができない場合、このスペルをプレイすることができません。
status: draft
author: fable
verified_by: []

scenarios:
  - name: A EX 的 2 張操り人形 → 消滅（消去）→ EX 出現ロイド與ヴィクトリア各 1
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 4, P2: 3}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: エルフ, life: 20}
          pp: {current: 3, max: 4}
          zones:
            ex:
              - {id: p1, card: BP08-T09}          # 操り人形
              - {id: p2, card: BP08-T09}          # 操り人形
            hand:
              - {id: a1, card: BP08-011}          # 心無き決闘
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 4}
          zones:
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, targets: {1: [p1, p2]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P1.banish: []
          P1.cemetery: [a1]
          P1.ex: [new-1, new-2]
          P1.ex_count: 2
        events:
          - {kind: 消滅, object: p1, group: 1}
          - {kind: 消滅, object: p2, group: 1}
          - {kind: 消去, object: p1, group: 2}
          - {kind: 消去, object: p2, group: 2}
          # new-n 依效果文字順序：ロイド → ヴィクトリア；在 EX 建立，不是場に出る → 兩者的ファンファーレ都不誘發。
          # 契約 10.8：新建物件放到場以外的區域用 移動（不是 場に出す）；同一個指示建立 → 同時
          - {kind: 移動, object: new-1, card: BP08-T01, to: P1.ex, group: 3}
          - {kind: 移動, object: new-2, card: BP08-T02, to: P1.ex, group: 3}
        forbidden_events:
          - {kind: 待機}
          - {kind: 場に出す}
          - {kind: 移動, object: new-2, card: BP08-T01}   # 不能兩張都變ロイド（Q1061）
          - {kind: 移動, object: new-3}

  - name: B 只有 1 張操り人形 → 不能打出
    inherit: A EX 的 2 張操り人形 → 消滅（消去）→ EX 出現ロイド與ヴィクトリア各 1
    setup:
      players:
        P1:
          zones:
            ex:
              - {id: p1, card: BP08-T09}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, targets: {1: [p1]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-play
        assert:
          P1.pp.current: 3
          P1.hand: [a1]
          P1.ex: [p1]
