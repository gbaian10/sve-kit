id: card-EBD04-012
kind: card
must_pass: true
mechanisms:
  - S5
  - 墓場で誘発
  - 可選執行
  - 多來源
cards:
  - EBD04-004
  - EBD04-012
why: 悠久の絶望的第一能力只在墓場有效。マーウィン入場後，每份墓場來源各自待機；自願把該來源移到 EX 才增加一點主戰者體力。
discriminates: 只掃場上來源會漏掉墓場正例並在場上反例多待機；拒絕仍補血會多一點；把同名來源合併只觸發一次會少一張 EX 與一點體力。
refs:
  rules:
    - 10.3.4
    - 10.7.2
    - 12.8.2
  qa:
    - Q2040
evidence:
  - ref: Q2040
    quote: "Q: 『悠久の絶望』の「自分の場に「カード名に『マーウィン』を含むフォロワー」が出たとき、～」という能力は、『悠久の絶望』が墓場にある場合に有効となる能力ですか？\nA: はい。『悠久の絶望』が墓場にある場合に有効となる能力です。『悠久の絶望』が墓場にある状況で、自分の場に「カード名に『マーウィン』を含むフォロワー」が出たときに、墓場の『悠久の絶望』をEXエリアに置くことで自分のリーダーの体力を+1することができます。"
    derivation:
      - 悠久の絶望的第一能力只在墓場有效。マーウィン入場後，每份墓場來源各自待機；自願把該來源移到 EX 才增加一點主戰者體力。
  - ref: cr 10.3.4
    quote: 特定の領域で処理することが明確である効果は、 その領域でのみ有効です。
    derivation:
      - 悠久の絶望的第一能力只在墓場有效。マーウィン入場後，每份墓場來源各自待機；自願把該來源移到 EX 才增加一點主戰者體力。
  - ref: cr 10.7.2
    quote: なんらかの自動能力の誘発条件が満たされた場 合、その自動能力は待機状態になります。
    derivation:
      - 悠久の絶望的第一能力只在墓場有效。マーウィン入場後，每份墓場來源各自待機；自願把該來源移到 EX 才增加一點主戰者體力。
  - ref: cr 12.8.2
    quote: ‘【守護】’は‘このフォロワーをスタンド状態で場に 置く際、代わりにスタンド状態で場に置きアクトして よい’と‘このフォロワーはあなたのエンドフェイズに アクトすることができる’（7.4.3）と‘これがフォロワー である場合、相手が攻撃目標を選択する際、可能な ら【守護】を持つアクト状態のあなたのフォロワーを 攻撃目標として選択する’を意味します（8.4.3）。
    derivation:
      - 悠久の絶望的第一能力只在墓場有效。マーウィン入場後，每份墓場來源各自待機；自願把該來源移到 EX 才增加一點主戰者體力。
