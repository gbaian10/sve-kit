scenarios:
  - name: 墓場來源自願移入 EX 並增加體力
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 4
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            hand:
              - id: m
                card: EBD04-004
            cemetery:
              - id: a
                card: EBD04-012
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 4
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: m
      - n: 2
        by: P1
        at: resolve
        do: place-acted
        of:
          decision: 1
          occurrence: 1
        object: m
        acted: false
      - n: 3
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: m
            line: 4
      - n: 4
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 1
      - n: 5
        by: P1
        at: resolve
        do: resolve-choice
        of:
          decision: 4
          occurrence: 1
        choice: execute
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P1.field:
            - m
      - at: after-decision-4
        view: omniscient
        outcome: paused
        assert: {}
        awaiting:
          by: P1
          choices:
            - do: resolve-choice
              choice: execute
            - do: resolve-choice
              choice: decline
      - at: after-decision-5
        view: omniscient
        outcome: resolved
        assert:
          P1.cemetery: []
          P1.ex:
            - a
          P1.leader.life: 21
