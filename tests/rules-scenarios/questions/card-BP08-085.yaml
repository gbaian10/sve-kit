schema: sve-exam/2.1
sources:
  rules: cr-1.28.0
  cards_jsonl_sha256: 541781306484527c858c6587a2c838764b0513595b00711751370534050c3fa1
id: card-BP08-085
kind: card
must_pass: false
mechanisms:
  - 結算中可選動作
  - 墓場
  - 回手
cards:
  - BP01-173
  - BP01-176
  - BP08-085
why: >-
  R-0018（generalized）從 Q2295 類推，可選的消滅動作需要完整四張，法術仍在結算區。墓場只有三張時，不能選消滅，法術結算後進墓。
discriminates: >-
  允許部分消滅會多出選牌選項，允許法術選自己會錯誤回手。
refs:
  rules:
    - 1.3.2
    - 10.6.2.8.3
  qa:
    - Q1117
    - Q2295
  rulings:
    - R-0018
evidence:
  - ref: R-0018
    derivation:
      - 四張是自願執行的完整數量，結算中的法術還不在墓場
status: verified
author: sol
verified_by:
  - by: opus
    method: independent-derivation
    note: >-
      天剣の乙女 6-3=3；墓場 3 張不能選消滅，「〜てよい」只剩 decline 仍是輸入點（§10.24、§10.33(b)）；法術在解決領域不能自選，結算後進墓、不回手
scenarios:
  - name: 悪意の憑依結算時墓場只有三張，只能不消滅
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ナイトメア
            life: 20
          pp:
            current: 8
            max: 8
          zones:
            deck:
              - filler: 20
            hand:
              - id: spell
                card: BP08-085
            cemetery:
              - id: g1
                card: BP01-173
              - id: g2
                card: BP01-173
              - id: g3
                card: BP01-173
        P2:
          construction: class
          leader:
            class: ロイヤル
            life: 20
          pp:
            current: 8
            max: 8
          zones:
            deck:
              - filler: 20
            field:
              - id: guard
                card: BP01-176
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: spell
        targets:
          "1":
            - guard
      - n: 2
        by: P1
        at: resolve
        do: resolve-choice
        of:
          decision: 1
          occurrence: 1
        choice: decline
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: paused
        assert:
          P1.resolution:
            - spell
          P1.cemetery:
            - g1
            - g2
            - g3
          P2.field.guard:
            hp: 3
        awaiting:
          by: P1
          choices:
            - do: resolve-choice
              choice: decline
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.hand: []
          P1.cemetery:
            - g1
            - g2
            - g3
            - spell
          P1.banish: []
