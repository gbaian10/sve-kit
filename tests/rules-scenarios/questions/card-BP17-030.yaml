schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: card-BP17-030
kind: card
must_pass: true
mechanisms:
  - 打出時的選擇
  - 名稱包含比對
  - 區域移動
  - 10.4.4.1
  - 4.1.4
  - 區域移動清除修正
  - 4.8.3.2
cards:
  - BP01-173
  - BP04-P07
  - BP17-030
  - BP21-PR05
  - BP17-022
  - BP17-019
why: "[astra] 含リオード的目標才減 2；換區清除場上修正，EX 已滿則沒有移動也不重設。\n[fable] 隠伏の記憶「これをプレイする際、自分の場の「カード名に『リオード』を含むフォロワー」を選んでいたなら、コストを-2する／自分の場の暗殺者・フォロワー1体を選ぶ。それをEXエリアに置く」： 費用取決於打出時選的目標（10.6.2.3 在 10.6.2.5 之前）；選『月光の執行者・リオード』→ 費用 0；選其他暗殺者 → 2。移到 EX 的從者是新物件，傷害與效果全部清除（Q2236）。"
discriminates: "[astra] 完全同名比對會多扣 2 PP；無視 EX 上限或未清除修正會使場或 EX 的斷言失敗。\n[fable] 先算費用再選目標的引擎（或用卡面費用檢查可否打出的引擎）在 A（PP 0）會 cannot-play；沒清除傷害的引擎在 A 之後從 EX 打出時體力不對（本題以 EX 內容為觀察點）； B 中 PP 0 選エリカ應該 cannot-play。"
refs:
  rules:
    - 4.1.4
    - 10.6.2.3
    - 10.6.2.5
    - 10.4.4.1
    - 10.10.2.4
    - 2.1.2
    - 4.8.3.2
  qa:
    - Q2235
    - Q2236
evidence:
  - ref: Q2235
    quote: いいえ。EXエリアが上限枚数に達しているため、カードの移動は行われず、場に残ります。
  - ref: Q2236
    quote: はい。失われます。
  - ref: cr 4.1.4
    quote: "カードが領域間の移動を行う場合、特に指示がな\nいかぎり、それは新しい領域における新しいカードで\nあるとみなされます。特に指定がないかぎり、前の\n領域で適用されていた効果がそのまま適用されるこ\nとはありません。"
    derivation:
      - 含リオード的目標才減 2；換區清除場上修正，EX 已滿則沒有移動也不重設。
  - ref: cr 10.6.2.3
    quote: "そのカードや能力が非公開領域のカード\n以外のなんらかの事物を‘選ぶ’場合、それ\n（以下‘目標’）を選びます。"
    derivation:
      - 含リオード的目標才減 2；換區清除場上修正，EX 已滿則沒有移動也不重設。
  - ref: cr 10.6.2.5
    quote: プレイするためのコストがある場合、そのコストを決定し、その後すべてのコストを支払います。
    derivation:
      - 10.6.2.3 選目標在 10.6.2.5 決定費用之前 → 「選んでいたなら」在決定費用時已知
status: draft
author:
