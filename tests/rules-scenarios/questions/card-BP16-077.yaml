schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP16-077
kind: card
must_pass: true
mechanisms: [體力門檻的一次判定, 打出時決定割り振り, 10.6.2.4, 10.6.2.4.2, 10.6.2.4.3, 割り振る値的置換在打出時套用, 「代わりに」, 3体まで, 12.2.3]
cards: [BP16-076, BP16-077, BP01-176, BP01-173, BP01-042]
why: >-
  エンドレスハンター・アラガヴィ（進化後）【進化時】「相手の場のフォロワー3体まで選ぶ。それに5ダメージを割りふる。自分のリーダーの体力が10以下なら、代わりに10ダメージ」。
  割り振り 在**打出時**決定（10.6.2.4），「体力が10以下なら、代わりに10ダメージ」是置換割り振る値的效果 → 在割り振り 時套用（10.6.2.4.3）→ 體力門檻在打出當下判定一次。
  每個選到的目標至少分到 1（10.6.2.4.2）。A：體力 11 → 總和 5。B：體力 10 → 總和 10。C：選 0 個 → 不割り振り（10.6.2.4.1）。
discriminates: >-
  不套用「代わりに10ダメージ」置換、或門檻方向弄反的引擎：B 不接受總和 10 的分配（或 A 接受）。本題 A、B 在打出與結算之間體力沒有變化，
  **不能**分辨「打出時判定」與「結算時判定」，只測 5／10 的分配與門檻本身。C：選 0 個仍造成傷害的引擎違反 forbidden_events。
refs:
  rules: [10.6.2.4, 10.6.2.4.1, 10.6.2.4.2, 10.6.2.4.3, 10.6.2.3.2, 12.2.3, 11.3.1]
  qa: []
evidence:
  - ref: cr 10.6.2.4.3
    quote: 割り振る値やその割り振り先を置換する効果がある場合、この時点で適用した上で割り振りを実行します。
    derivation:
      - 「代わりに10ダメージ」置換了要割り振る 的值 → 在 10.6.2.4（打出時、費用之前）就依當時的リーダー 體力決定是 5 還是 10
  - ref: cr 10.6.2.4.2
    quote: 値の割り振りを決定する際、そのために 10.6.2.3.1 で割り振る先として目標を選んでいる場合、その各目標に対して 1 単位以上の割り振りを行う義務があります。
  - ref: cr 10.6.2.4.1
    quote: 目標として選んだ数が 0 である等、割り振る先が存在しない場合、割り振りは行わず、割り振って行われるべき処理は実行されません。
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: 第三輪交叉驗證 astra-r3/xverify-1、xverify-2（審 fable-r3），fable-r3/fix-1～fix-3 處理後同意
  - by: sol
    method: independent-derivation
    note: 第三輪最後核對（139 局面逐一推導）；F1、F2 與禁止 vs 置換仲裁已依核對結果修正

scenarios:
  - name: A 體力 11 → 割り振り 總和 5：b1 3、b2 2
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 6, P2: 5}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ナイトメア, life: 11}
          pp: {current: 6, max: 6}
          ep: 2
          zones:
            field:
              - {id: a1, card: BP16-076}                    # アラガヴィ 4/4
            evolve_deck:
              - {id: e1, card: BP16-077}
            hand:
              - {filler: 2}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 6}
          zones:
            field:
              - {id: b1, card: BP01-176}                    # 天剣の乙女 4/6
              - {id: b2, card: BP01-173}                    # ファイター 2/3
              - {id: b3, card: BP01-042}                    # ニンジャエッグ 2/2
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: evolve, source: a1, ability: {source: a1, line: 1}, evolve_card: e1, pay: {pp: 0, ep: 1, sep: 0}}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, card: BP16-077, line: 1}}, targets: {1: [b1, b2]}, distribute: {1: {b1: 3, b2: 2}}}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.ep: 1
          P1.field.a1: {evolved: true, evolved_with: e1, power: 5, hp: 5}
          P2.field: [b1, b2, b3]
          P2.field.b1: {hp: 3}
          P2.field.b2: {hp: 1}
          P2.field.b3: {hp: 2}
        events:
          - {kind: ダメージ, source: a1, target: b1, amount: 3, group: 1}
          - {kind: ダメージ, source: a1, target: b2, amount: 2, group: 1}

  - name: B 體力 10 → 割り振り 總和 10：b1 6、b2 3、b3 1
    inherit: A 體力 11 → 割り振り 總和 5：b1 3、b2 2
    setup:
      players:
        P1:
          leader: {class: ナイトメア, life: 10}
    decisions:
      - {n: 1, by: P1, at: main, do: evolve, source: a1, ability: {source: a1, line: 1}, evolve_card: e1, pay: {pp: 0, ep: 1, sep: 0}}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, card: BP16-077, line: 1}}, targets: {1: [b1, b2, b3]}, distribute: {1: {b1: 6, b2: 3, b3: 1}}}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.field: [b3]
          P2.field.b3: {hp: 1}
          P2.cemetery: [b1, b2]
        events:
          - {kind: ダメージ, source: a1, target: b1, amount: 6, group: 1}
          - {kind: ダメージ, source: a1, target: b2, amount: 3, group: 1}
          - {kind: ダメージ, source: a1, target: b3, amount: 1, group: 1}
          - {kind: 破壊, object: b1, by: rule-11.3.1, group: 2}
          - {kind: 破壊, object: b2, by: rule-11.3.1, group: 2}

  - name: C 體力 10 但選 0 個 → 不割り振り、沒有傷害
    inherit: A 體力 11 → 割り振り 總和 5：b1 3、b2 2
    setup:
      players:
        P1:
          leader: {class: ナイトメア, life: 10}
    decisions:
      - {n: 1, by: P1, at: main, do: evolve, source: a1, ability: {source: a1, line: 1}, evolve_card: e1, pay: {pp: 0, ep: 1, sep: 0}}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, card: BP16-077, line: 1}}, targets: {1: []}, distribute: {1: {}}}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.field: [b1, b2, b3]
          P2.field.b1: {hp: 6}
          P1.field.a1: {evolved: true, evolved_with: e1}
        forbidden_events:
          - {kind: ダメージ}
