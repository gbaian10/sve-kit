evidence:
  - ref: cr 14.2.1.1
    quote: "あるカードが‘（指定回数）食事する’指示\nがある場合、そのカードに関連付けられたカー\nドが出走領域にないなら、そのカードのマス\nターは自身のエボルヴデッキの『にんじん』を\n指定回数に等しい枚数自身の出走領域に置\nき、その『にんじん』をそのカードに関連付けま\nす。"
    derivation:
      - 食事支付胡蘿蔔與 PP，出走獲得突進可在進場回合攻擊橫置從者；缺任一費用則回溯。
  - ref: cr 14.2.2.3
    quote: "‘（ある個数の アイコン） （コスト）：（効\n果）’は‘\nこれは（その個数に等しい回数）\n食事する （コスト）：（効果）’を意味します"
    derivation:
      - 食事支付胡蘿蔔與 PP，出走獲得突進可在進場回合攻擊橫置從者；缺任一費用則回溯。
  - ref: cr 14.2.3.1
    quote: "あるカードを‘（指定回数）出走する’指示\nがある場合、これ以降そのカードは、自身に関\n連付けられたカードが出走領域にあるかぎり、\n【突進】を持ち、このカードが‘出走した’事象\nが指定回数発生します。"
    derivation:
      - 食事支付胡蘿蔔與 PP，出走獲得突進可在進場回合攻擊橫置從者；缺任一費用則回溯。
  - ref: cr 10.4.2.2
    quote: "コストのうち一部または全部を支払うことが\n不可能である場合、このコストはまったく支払\nうことはできません。"
    derivation:
      - 食事支付胡蘿蔔與 PP，出走獲得突進可在進場回合攻擊橫置從者；缺任一費用則回溯。
  - ref: Q1824
    quote: いいえ。『ジェンティルドンナ』が場にいる場合、相手の《ファンファーレ》能力や【進化時】能力は、誘発条件を満たしたとしても誘発しないため、プレイすることができません。
  - ref: Q1826
    quote: いいえ。【進化時】能力は誘発条件を満たしたとしても誘発しないため、プレイすることができません。
