why: "[astra] 食事支付胡蘿蔔與 PP，出走獲得突進可在進場回合攻擊橫置從者；缺任一費用則回溯。\n[fable] ジェンティルドンナ「これが場にいる限り、相手プレイヤーすべての{ファンファーレ}能力と【進化時】能力は誘発しない」：對手的ファンファーレ／進化時**連待機都不會產生**（Q1824、Q1826）， 不是「待機後不能打出」。A：對手打出デモンビーター → 沒有待機、直接回到主要階段。B：對手進化ライトニングキャット → 進化本身照常，進化時不誘發。 依契約 10 第 1 點：デモンビーター 有【守護】，打出放上場時仍要問 place-acted（12.8.2、9.2）；之後才是「沒有待機」。"
discriminates: "[astra] 只扣 PP 或忘記出走給突進，race 與攻擊狀態會不符。\n[fable] 把它做成「待機後取消」的引擎會出現 待機／待機取消 事件並在 after-decision-2 停下等 choose-pending；沒實作的引擎會讓 P2 搜牌／造成 2 傷害。"
