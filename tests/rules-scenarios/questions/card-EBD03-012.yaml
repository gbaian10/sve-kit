schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: card-EBD03-012
kind: card
must_pass: true
mechanisms:
  - 5.5.3
  - 12.2.2
  - 10.6.2.3.3
cards:
  - BP01-176
  - EBD03-012
  - EBD03-013
why: 異形的進化能力只檢查這次上場的來源是墓場，不等於「由效果上場」或「非手牌」。
discriminates: 忽略來源限制會讓 hand/ex/deck 分支進化；把效果上場等同墓場上場會錯放行 deck。
refs:
  rules:
    - 5.5.3
    - 12.2.2
    - 10.6.2.3.3
  qa: []
evidence:
  - ref: cr 5.5.3
    quote: カードが‘（領域）から場に出る’ことを参照する場合、それはそのカードがその領域から直接場に出ること、およびそのカードがその領域からプレイされた後解決領域で解決されて場に出ることの両方を参照します。同様に、カードが‘（領域）以外から場に出る’ことを参照する場合、それはそのカードがその領域でも解決領域でもない領域から直接場に出ること、およびそのカードがその領域以外の領域からプレイされた後解決領域で解決されて場に出ることの両方を参照します。
  - ref: cr 12.2.2
    quote: 進化能力をプレイする際、コストとして、その能力を持つカードのマスターのエボルヴデッキ置き場の適正なカード（5.16.1.1.1）1 枚を公開します
  - ref: cr 10.6.2.3.3
    quote: 選ぶ数として指定された数が 1 以上で、かつその数の目標を選ぶことが不可能である場合、このカードや能力のプレイは不正で、このカードや能力はプレイできません。このカードや能力のプレイは取り消され、ゲームはこのカードや能力をプレイすることを選択する前まで戻されます。
  - ref: EBD03-012
    quote: "{進化}{コスト1}：これは進化する。この能力はこれが墓場から場に出ていたなら使える。\n【突進】（【突進】を持つフォロワーは、場に出たターンから相手のフォロワーを攻撃できる）\n{ラストワード}『機動二輪車』1つを場に出す。自分のデッキの上2枚を墓場に置く。"
status: draft
author: astra
verified_by: []
scenarios:
  - name: 異形來源 cemetery
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: エルフ
            life: 20
          pp:
            current: 1
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: a
                card: EBD03-012
                state:
                  entered_from: cemetery
                  entered_by: effect
            evolve_deck:
              - id: e
                card: EBD03-013
        P2:
          construction: class
          leader:
            class: ロイヤル
            life: 20
          pp:
            current: 0
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: b
                card: BP01-176
    decisions:
      - n: 1
        by: P1
        at: main
        do: evolve
        source: a
        evolve_card: e
        pay:
          pp: 1
          ep: 0
      - n: 2
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 2
            card: EBD03-013
        targets:
          1:
            - b
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P1.field.a:
            evolved: true
          P2.field.b:
            hp: 1
