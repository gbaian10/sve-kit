why: 陰陽師・カードやスペル採聯集；同張式神の使役同時符合兩類，仍只算一張。
discriminates: 把兩種數量相加會把 6 算成 12 而錯放行起動、生成形代。
refs:
  rules:
    - 10.6.2.3.3
  qa:
    - Q2654
    - Q2655
evidence:
  - ref: cr 10.6.2.3.3
    quote: 選ぶ数として指定された数が 1 以上で、かつその数の目標を選ぶことが不可能である場合、このカードや能力のプレイは不正で、このカードや能力はプレイできません。このカードや能力のプレイは取り消され、ゲームはこのカードや能力をプレイすることを選択する前まで戻されます。
  - ref: Q2654
    quote: "いいえ。『式神の使役』は1枚分として数えます。\n「自分の墓場の陰陽師・カードやスペルが7枚以上なら」とは、自分の墓場の、タイプに陰陽師を持つカードやスペルの片方もしくは両方に該当するカードの合計枚数を参照します。"
  - ref: Q2655
    quote: 自分の墓場の、タイプに陰陽師を持つカードやスペルの片方もしくは両方に該当するカードの枚数を参照します。
  - ref: BP20-P28
    quote: "{ファンファーレ}手札1枚を捨てる：自分のデッキの上3枚を見る。その中から、陰陽師・フォロワー1枚かスペル1枚を公開して手札に加えてよい。残りを好きな順にデッキの下に置く。\n{起動}これを{アクト}：『形代』1体を場に出す。この能力は自分の墓場の陰陽師・カードやスペルが7枚以上なら使える。\n『形代』{ウィッチ}式神・フォロワー{コスト2}{攻撃力}2/{体力}2{ラストワード}1枚引く。自分の手札1枚を捨てる。"
