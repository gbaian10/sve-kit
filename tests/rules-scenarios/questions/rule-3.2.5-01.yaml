schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: rule-3.2.5-01
kind: rule
must_pass: true
mechanisms: [規則卡（EP／SEP）, 3.2.5, 6.2.1.10, EP 是整場共用的資源、不每回合補回, 進化與食事共用同一組 EP, 12.2.3, 14.2.2.4, 7.2 開始階段不補 EP, 回合交替]
cards: [ECP01-001, ECP01-002, CP01-085, CSD01-T01, BP01-173, BP01-176]
why: >-
  規則卡『レジェンドレース VSスペシャルウィーク』（CSD01-T01，種類 EP）寫的是規則：「バトル開始時、後攻プレイヤーはEPを3つ持つ」「自分が{進化}か{食事}のコストを払うとき、表向きのEPを1つ裏向きにすることで、1PPを払える」。
  對應 CR：EP 是後攻開局拿到的 3 點（6.2.1.10），進化（12.2.3）與食事（14.2.2.4）都可以用其中 1 點代付 1 PP；開始階段（7.2）沒有補回 EP 的步驟 → 用掉的 EP 跨回合不會回來，
  且進化與食事扣的是**同一組** EP。A：後攻 P2 這回合用 1 EP 食事 → 下回合 EP 仍是 2，再用 1 EP 進化 → 1。B：PP 0 時只靠 EP 也能付進化的 1 PP 費用。
discriminates: >-
  A：每回合把 EP 補回 3、或把食事與進化的 EP 分開計算的引擎，after-decision-5／7 的 P2.ep 不同。B：要求 PP ≥ 1 才能進化、或 EP 只能在有 PP 時代付的引擎會 cannot-evolve。
refs:
  rules: [3.2.5, 3.2.5.1, 6.2.1.10, 12.2.3, 14.2.2.4, 14.2.2.5, 7.2.1, 7.2.2, 7.2.4, 8.3.2.1]
  qa: []
evidence:
  - ref: cr 3.2.5
    quote: EP は、プレイヤーが進化能力（12.1.2.1）をプレイする際に、PP の代わりに消費することができる数値です（12.2.2）。
  - ref: cr 6.2.1.10
    quote: 先攻プレイヤーの EP を 0 に、後攻プレイヤーの EP を 3 にします。
    derivation:
      - 這是 EP 唯一的規則來源；7.2.1～7.2.5 的開始階段只補 PP、不補 EP → 用掉的 EP 跨回合保持
  - ref: cr 14.2.2.4
    quote: 食事能力をプレイする際、そのコストに含まれる PP のうち 1 点を、PP ではなく 1 点の EP で支払うことができます。
    derivation:
      - 與 12.2.3 用的是同一個 EP（3.2.5），沒有分開的計數
  - ref: card CSD01-T01
    quote: バトル開始時、後攻プレイヤーはEPを3つ持つ。自分が{進化}か{食事}のコストを払うとき、表向きのEPを1つ裏向きにすることで、1PPを払える。（1ターンに進化か食事はどちらか1回できる。1回につき使えるEPは1つ）
    derivation:
      - 官方規則卡文字，與 CR 一致；「表向き→裏向き」＝ EP −1，不會翻回
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: 第三輪交叉驗證 astra-r3/xverify-1、xverify-2（審 fable-r3），fable-r3/fix-1～fix-3 處理後同意
  - by: sol
    method: independent-derivation
    note: 第三輪最後核對（139 局面逐一推導）；F1、F2 與禁止 vs 置換仲裁已依核對結果修正

scenarios:
  - name: A 後攻 P2 用 1 EP 食事 → 跨回合 EP 不補回 → 下回合再用 1 EP 進化另一隻
    setup:
      turn: {active: P2, first_player: P1, elapsed_turns: {P1: 2, P2: 2}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 2}
          zones:
            field:
              - {id: b1, card: BP01-173}
            hand:
              - {filler: 3}
            deck:
              - {id: x1, card: BP01-176}
              - {filler: 19}
        P2:
          construction: title
          title: ウマ娘 プリティーダービー
          leader: {class: エルフ, life: 20}
          pp: {current: 0, max: 2}
          ep: 3
          sep: 1
          zones:
            field:
              - {id: a1, card: ECP01-001}         # ホッコータルマエ（進化 コスト1、食事 コスト1）
              - {id: a2, card: ECP01-001}
            evolve_deck:
              - {id: e1, card: ECP01-002}
              - {id: n1, card: CP01-085}
            hand:
              - {filler: 3}
            deck:
              - {id: d1, card: BP01-173}
              - {id: d2, card: BP01-176}
              - {filler: 18}
    decisions:
      - {n: 1, by: P2, at: main, do: activate, ability: {source: a1, line: 3}, costs: {1: [n1]}, pay: {pp: 0, ep: 1}}
      - {n: 2, by: P2, at: main, do: end-phase}
      - {n: 3, by: P1, at: quick, do: pass}
      - {n: 4, by: P1, at: main, do: end-phase}
      - {n: 5, by: P2, at: quick, do: pass}
      - {n: 6, by: P2, at: main, do: evolve, source: a2, ability: {source: a2, line: 2}, evolve_card: e1, pay: {pp: 0, ep: 1, sep: 0}}
      - {n: 7, by: P2, at: check-timing, do: choose-pending, pending: {ability: {source: a2, card: ECP01-002, line: 1}}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P2.pp.current: 0
          P2.ep: 2
          P2.race: [n1]
          P2.field.a1: {links: {出走: [n1]}}
          semantic_state.counters_this_turn: {P2.evolve_played: 1}
      - at: after-decision-5
        view: omniscient
        outcome: resolved
        assert:
          turn: {active: P2, phase: main}
          turn.elapsed_turns: {P1: 3, P2: 3}
          P2.pp: {current: 3, max: 3}
          P2.ep: 2
          P2.sep: 1
          P2.hand: [d1, filler: 3]
          P1.ep: 0
          semantic_state.counters_this_turn: {P2.evolve_played: 0}
        events:
          - {kind: 引く, player: P1, object: x1}
          - {kind: 引く, player: P2, object: d1}
      - at: after-decision-7
        view: omniscient
        outcome: resolved
        assert:
          P2.pp.current: 3
          P2.ep: 1
          P2.field.a2: {evolved: true, evolved_with: e1}
          P2.hand: [d1, d2, filler: 3]

  - name: B PP 0、EP 1 → 進化的 1 PP 費用全部由 EP 代付
    setup:
      turn: {active: P2, first_player: P1, elapsed_turns: {P1: 3, P2: 3}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 3}
          zones:
            field:
              - {id: b1, card: BP01-173}
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
        P2:
          construction: title
          title: ウマ娘 プリティーダービー
          leader: {class: エルフ, life: 20}
          pp: {current: 0, max: 3}
          ep: 1
          zones:
            field:
              - {id: a2, card: ECP01-001}
            evolve_deck:
              - {id: e1, card: ECP01-002}
            hand:
              - {filler: 3}
            deck:
              - {id: d2, card: BP01-176}
              - {filler: 19}
    decisions:
      - {n: 1, by: P2, at: main, do: evolve, source: a2, ability: {source: a2, line: 2}, evolve_card: e1, pay: {pp: 0, ep: 1, sep: 0}}
      - {n: 2, by: P2, at: check-timing, do: choose-pending, pending: {ability: {source: a2, card: ECP01-002, line: 1}}}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.pp.current: 0
          P2.ep: 0
          P2.field.a2: {evolved: true, evolved_with: e1}
          P2.hand: [d2, filler: 3]

  - name: C PP 0、EP 0 → 進化付不出 → cannot-evolve
    inherit: B PP 0、EP 1 → 進化的 1 PP 費用全部由 EP 代付
    setup:
      players:
        P2:
          ep: 0
    decisions:
      - {n: 1, by: P2, at: main, do: evolve, source: a2, ability: {source: a2, line: 2}, evolve_card: e1, pay: {pp: 0, ep: 0, sep: 0}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-evolve
        assert:
          P2.ep: 0
          P2.field.a2: {evolved: false}
          P2.evolve_deck: [e1]
