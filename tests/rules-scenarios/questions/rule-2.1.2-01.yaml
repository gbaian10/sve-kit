schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: rule-2.1.2-01
kind: rule
must_pass: true
mechanisms:
  - 名稱包含比對
  - 持續效果與禁止
  - token
cards:
  - BP01-096
  - BP16-T17
  - SD08-002
why: 『ドラゴン』在此是完全同名 token，不是所有卡名含ドラゴン的從者；有フォルテ才獲疾走。
discriminates: 用包含比對會讓ミストドラゴン進場當回合也能攻擊主戰者。
refs:
  rules:
    - 2.1.2
    - 12.9.2
    - 10.9.1
  qa:
    - Q1767
evidence:
  - ref: Q1767
    quote: はい。攻撃している途中で【疾走】を失っていても、その攻撃は行われます。
  - ref: cr 2.1.2
    quote: "ルールやテキストで‘『（名称）』’という表記がある\n場合、それは文脈に従い、カード名がその（名称）で"
    derivation:
      - 『ドラゴン』在此是完全同名 token，不是所有卡名含ドラゴン的從者；有フォルテ才獲疾走。
  - ref: cr 12.9.2
    quote: "‘【疾走】’は‘このフォロワーは、このターンの最初\nから連続して自分がマスターであった状態でない場\n合でも、攻撃フォロワーとして選択できる’を意味し\nます。"
    derivation:
      - 『ドラゴン』在此是完全同名 token，不是所有卡名含ドラゴン的從者；有フォルテ才獲疾走。
  - ref: cr 10.9.1
    quote: "なんらかの継続効果が存在する状態でカードの情\n報が求められる場合、以下の順でその情報に対す\nる継続効果を適用します。"
    derivation:
      - 『ドラゴン』在此是完全同名 token，不是所有卡名含ドラゴン的從者；有フォルテ才獲疾走。
status: draft
author: astra
verified_by: []
