schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP19-009
kind: card
must_pass: true
mechanisms: [效果造成的進化不佔每回合 1 次, 8.3.2.1, 5.16.1.1, 12.6.1, 進化每回合一次, 連擊、覺醒、真紅, 13.2.1, 進化卡自身的能力]
cards: [BP19-009, BP19-010, BP19-011, BP19-001, BP19-002, BP01-173, BP01-176]
why: >-
  若芽の組員「{ファンファーレ}【コンボ_3】これは進化する」：本回合第 3 張打出 → 由效果進化（5.16.1.1：從エボルヴデッキ裏向き卡中指定同名卡）。
  這種進化不佔 8.3.2.1「每回合 1 次進化能力」的額度（Q2558）：之後仍能用マガチヨ 的進化能力進化 1 次；第二隻マガチヨ 才被拒。
  每次八獄從者進化，根際の刺客「自分の場の八獄・フォロワーが進化したとき」都誘發（コンボ_3 成立 → 3 傷害）。
discriminates: >-
  把效果造成的進化算進每回合額度的引擎：after-decision-8 會 cannot-evolve。沒有把效果進化當成「進化した」事象的引擎：根際 不誘發、b1 體力 6。
  沒有把打出的這張自己算進コンボ 的引擎：ファンファーレ 不進化。
refs:
  rules: [8.3.2.1, 5.16.1, 5.16.1.1, 5.16.1.1.1, 5.16.1.3, 12.6.1, 13.2.1.2, 12.4.3, 10.7.2]
  qa: [Q2558, Q2560]
evidence:
  - ref: Q2558
    quote: いいえ。1ターンに1回の回数に含まれません。進化前の『ゴブリン』が持っているような《進化》能力（進化することができる起動能力・「丸E」のアイコン）は1ターンに1回のみ使用することができます。それ以外の能力によって進化するものなどに、この制限はありません。
  - ref: cr 8.3.2.1
    quote: 起動能力を指定する際、それが進化能力または進化相当能力である場合、このターンにターンプレイヤーがいずれかの進化能力や進化相当能力をすでにプレイ済みである場合、その起動能力は指定できません。
    derivation: [額度只看「進化能力／進化相当能力」有沒有打出過；ファンファーレ 的「これは進化する」不是進化能力 → 之後第一次進化能力仍合法，第二次才被拒]
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: A：xverify-2/result.md:260〈全部實質核驗局面的索引〉（8.3.2.1、5.16.1、Q2558、Q2560）

scenarios:
  - name: A 第 3 張打出的若芽 由ファンファーレ 進化 → 根際 誘發 3 傷害 → 之後進化能力仍可用 1 次 → 第二次被拒
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 6, P2: 5}, phase: main}
      history: explicit
      semantic_state:
        counters_this_turn: {P1.cards_played: 2}
      players:
        P1:
          construction: class
          leader: {class: エルフ, life: 20}
          pp: {current: 4, max: 6}
          ep: 2
          zones:
            field:
              - {id: a1, card: BP19-011}          # 根際の刺客 2/3
              - {id: a2, card: BP19-001}          # 剪定の咎人・マガチヨ 2/2
              - {id: a3, card: BP19-001}          # 剪定の咎人・マガチヨ 2/2
            hand:
              - {id: h3, card: BP19-009}          # 若芽の組員 1/1
            evolve_deck:
              - {id: e1, card: BP19-010}          # 若芽の組員（エボルヴ）
              - {id: e2, card: BP19-002}          # マガチヨ（エボルヴ）
              - {id: e3, card: BP19-002}
            deck:
              - {id: d1, card: BP01-173}
              - {id: d2, card: BP01-173}
              - {id: d3, card: BP01-173}
              - {id: d4, card: BP01-173}
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 5}
          zones:
            field:
              - {id: b1, card: BP01-176}          # 天剣の乙女 4/6
              - {id: b2, card: BP01-173}          # ファイター 2/3
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: h3}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: h3, line: 2}}}
      - {n: 3, by: P1, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, select: [e1]}
      - {n: 4, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: h3, card: BP19-010, line: 1}}}
      - {n: 5, by: P1, at: resolve, of: {decision: 4, occurrence: 1}, do: resolve-choice, select: []}
      - {n: 6, by: P1, at: resolve, of: {decision: 4, occurrence: 2}, do: resolve-choice, order: [d1, d2, d3, d4]}
      - {n: 7, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 1}, event: {evolved: h3}}, targets: {1: [b1]}}
      - {n: 8, by: P1, at: main, do: evolve, source: a2, ability: {source: a2, line: 1}, evolve_card: e2, pay: {pp: 1, ep: 0}}
      - {n: 9, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a2, card: BP19-002, line: 2}}, targets: {1: [b1]}}
      - {n: 10, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 1}, event: {evolved: a2}}, targets: {1: [b2]}}
      - {n: 11, by: P1, at: main, do: evolve, source: a3, ability: {source: a3, line: 1}, evolve_card: e3, pay: {pp: 1, ep: 0}}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: paused
        assert:
          P1.pp.current: 3
          semantic_state.counters_this_turn: {P1.cards_played: 3}
        awaiting:
          by: P1
          choices:
            - {do: resolve-choice, select: [e1]}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.field.h3: {evolved: true, evolved_with: e1, power: 2, hp: 2}
          semantic_state.counters_this_turn: {P1.evolve_played: 0, P1.evolutions: 1}
        events:
          - {kind: 進化, object: h3, with: e1}
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: h3, card: BP19-010, line: 1}}}
            - {do: choose-pending, pending: {ability: {source: a1, line: 1}, event: {evolved: h3}}}
      - at: after-decision-7
        view: omniscient
        outcome: resolved
        assert:
          P1.deck: [filler: 20, d1, d2, d3, d4]
          P1.hand: []
          P2.field.b1: {hp: 3}
        events:
          - {kind: ダメージ, source: a1, target: b1, amount: 3}
      - at: after-decision-8
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 2
          P1.field.a2: {evolved: true, evolved_with: e2}
          semantic_state.counters_this_turn: {P1.evolve_played: 1, P1.evolutions: 2}
        events:
          - {kind: 進化, object: a2, with: e2}
      - at: after-decision-10
        view: omniscient
        outcome: resolved
        assert:
          P2.field: []
          P2.cemetery: [b1, b2]
        events:
          - {kind: ダメージ, source: a2, target: b1, amount: 4}
          - {kind: 破壊, object: b1}
          - {kind: ダメージ, source: a1, target: b2, amount: 3}
          - {kind: 破壊, object: b2}
      - at: after-decision-11
        view: omniscient
        outcome: cannot-evolve
        assert:
          P1.pp.current: 2
          P1.field.a3: {evolved: false}
        forbidden_events:
          - {kind: 進化}
