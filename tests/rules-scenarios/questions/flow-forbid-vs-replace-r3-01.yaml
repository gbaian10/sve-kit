schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: flow-forbid-vs-replace-r3-01
kind: flow
must_pass: true             # Sol 最後核對仲裁：墓場（把握程度高）
mechanisms: [禁止效果優先於置換, 1.3.3, 10.10.1, 10.10.1.1, 「消滅しない」, 非傷害事件的取代（墓場→消滅）, 11.3.1]
cards: [BP18-SL16, BP06-022, BP01-173]
why: >-
  邪智の竜・ファフニール「相手のフォロワーが場から墓場に置かれる際、代わりにそれを消滅させる」對上『古の英雄』「これは能力によって破壊されず、消滅しない」：
  Q2345 裁定古の英雄「消滅しません」並引用 1.3.3（禁止效果優先）。出題者（fable）的推導：置換效果要求的行動（消滅）被禁止 → 置換**不適用**（1.3.3），
  10.10.1.1「置換された元の事象は…発生しなかった」以置換已適用為前提，這裡沒有適用 → 原事象（8 傷害致死 → 11.3.1 破壞 → 5.6.1 移到墓場）照常發生；
  Q802 另證明「墓場に置く」不受古の英雄 保護。審核者（astra）認為 Q2345 只直接證明「不消滅」，最終區域缺直接裁定 → 曾列為 must_pass: false；Sol 最後核對仲裁為墓場（11.3.1 破壞是規則處理，Q2345 為同一局面、Q802 證明可置於墓場），改為必過。
  另一種讀法（置換已適用、消滅事象執行失敗 → 古の英雄 留在場上）與 11.3.1 破壞為強制規則處理矛盾，出題者不採。
discriminates: >-
  把置換套到古の英雄 的引擎會把它放到消滅領域；認為置換已發生而消滅被擋的引擎會讓它留在場上（體力 −3）；正確引擎把它放到墓場。
refs:
  rules: [1.3.3, 10.10.1, 10.10.1.1, 10.2.1.3.1, 11.3.1, 5.6.1, 5.7.1, 12.4.3]
  qa: [Q2345, Q802]
evidence:
  - ref: Q2345
    quote: いいえ。消滅しません。あるカードの効果によりプレイヤーがなんらかの行動を行うよう指示された場合に、同時にその行動を禁止する効果が発生している場合、常に禁止する効果が優先されます。
    derivation:
      - 官方把這個情況歸到 1.3.3「禁止優先」；禁止的是置換效果要求的「消滅」這個行動 → 置換不適用 → 原本的「場から墓場に置く」照常
  - ref: Q802
    quote: はい。墓場に置きます。「墓場に置く」という処理は能力による破壊ではないので、『古の英雄』の「これは能力によって破壊されず、消滅しない。」という能力は働きません。
  - ref: cr 1.3.3
    quote: あるカードの効果によりプレイヤーがなんらかの行動を行うよう指示された場合に、同時にその行動を禁止する効果が発生している場合、常に禁止する効果が優先されます。
  - ref: cr 10.10.1.1
    quote: これにより、置換された元の事象はまったく発生しなかったことになります。
    derivation:
      - 條文的主詞是「置換された元の事象」，只在置換實際適用時成立；置換被 1.3.3 排除時沒有「置換された」事象
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: 第三輪交叉驗證 astra-r3/xverify-1、xverify-2（審 fable-r3），fable-r3/fix-1～fix-3 處理後同意
  - by: sol
    method: independent-derivation
    note: 第三輪最後核對（139 局面逐一推導）；F1、F2 與禁止 vs 置換仲裁已依核對結果修正

scenarios:
  - name: A ファフニール 的ファンファーレ 8 傷害打死體力 5 的古の英雄 → 不消滅、進墓場
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 9, P2: 8}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 8, max: 9}
          zones:
            field:
              - {id: a2, card: BP01-173}
            hand:
              - {id: h1, card: BP18-SL16}
              - {filler: 1}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ナイトメア, life: 20}
          pp: {current: 0, max: 9}
          zones:
            field:
              - {id: b2, card: BP06-022, state: {hp: 5}}        # 古の英雄 6/10，已受 5 傷
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: h1}
      - {n: 2, by: P1, at: resolve, of: {decision: 1, occurrence: 1}, do: place-acted, object: h1, acted: false}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: h1, line: 3}}}
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.field: [a2, h1]
          P2.field: []
          P2.banish: []
          P2.cemetery: [b2]
          P2.leader.life: 16
        events:
          - {kind: ダメージ, source: h1, target: b2, amount: 8}
          - {kind: 破壊, object: b2, by: rule-11.3.1}
          - {kind: 移動, object: b2, from: P2.field, to: P2.cemetery}
        forbidden_events:
          - {kind: 消滅, object: b2}
