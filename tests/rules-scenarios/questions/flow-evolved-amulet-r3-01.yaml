    - Q1122
    - Q1121
evidence:
  - ref: Q1122
    quote: "Q: 『狂信の偶像（EVOLVE）』について教えてください。\nA: 『狂信の偶像（EVOLVE）』はカードの種類がアミュレットのエボルヴカードです。\n通常のアミュレットと同様に攻撃力や体力の値を持たず、アミュレットを対象とした効果のみを受けます。\n『狂信の偶像（EVOLVE）』が破壊された場合、『狂信の偶像（EVOLVE）』を墓場に移動します。移動した直後、エボルヴカードである『狂信の偶像（EVOLVE）』はエボルヴデッキの上に表向きで置きます。"
    derivation:
      - 偶像進化為護符，不能攻擊；進化本身不離場所以裝備仍關聯，回手牌時才解除並消去裝備，進化卡回エボルヴ牌組表向。
  - ref: Q1121
    quote: "Q: 自分の場に『祈りの燭台』がある状況で、自分の場の『狂信の偶像』を進化しました。このターン、自分の場にアミュレットが出ていない場合、『祈りの燭台』の「ターンごとに1回、自分の場に他のアミュレットが出たとき、」という能力は誘発しますか？\nA: いいえ。誘発しません。"
    derivation:
      - 偶像進化為護符，不能攻擊；進化本身不離場所以裝備仍關聯，回手牌時才解除並消去裝備，進化卡回エボルヴ牌組表向。
  - ref: cr 5.16.1.2.1
    quote: これにより進化前と進化後でカードの 種類が異なる場合、そのカードの種類の記 載されている情報（10.9.1.1）が進化後の種 類になります。他に種類を変更する効果が 適用されていない場合、これによりその カードの種類を進化後の種類にします （5.25）。
    derivation:
      - 偶像進化為護符，不能攻擊；進化本身不離場所以裝備仍關聯，回手牌時才解除並消去裝備，進化卡回エボルヴ牌組表向。
  - ref: cr 14.5.2.4
    quote: トークンを装備しているフォロワーが場から 場以外の領域に移動した場合、そのフォロ ワーとそのフォロワーが装備しているトークン との関連付けは失われます。 === p24 15. その他
    derivation:
      - 偶像進化為護符，不能攻擊；進化本身不離場所以裝備仍關聯，回手牌時才解除並消去裝備，進化卡回エボルヴ牌組表向。
  - ref: cr 11.11.1
    quote: イクイップメント領域のトークンが場のいずれの カードとも関連付けされていない場合、そのトークン を消去（9.1.3）します。
    derivation:
      - 偶像進化為護符，不能攻擊；進化本身不離場所以裝備仍關聯，回手牌時才解除並消去裝備，進化卡回エボルヴ牌組表向。
