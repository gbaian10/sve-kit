scenarios:
  - name: 沒有敵方從者也能進化成護符，裝備延後到回手才消去
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 3
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - id: d
                card: BP01-173
            field:
              - id: a
                card: BP08-089
            evolve_deck:
              - id: e
                card: BP08-090
            equipment:
              - id: w
                card: CP04-PR16
                state:
                  equipped_to: a
            hand:
              - id: s
                card: ETD03-008
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 3
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: evolve
        source: a
        evolve_card: e
        pay:
          pp: 2
          ep: 0
      - n: 2
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 1
            card: BP08-090
        targets:
          1: []
      - n: 3
        by: P1
        at: main
        do: attack
        attacker: a
        target: P2.leader
      - n: 4
        by: P1
        at: main
        do: play
        card: s
        targets:
          1:
            - a
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: pending-cancelled
        assert:
          P1.field.a:
            evolved: true
            evolved_with: e
          P1.equipment:
            - w
          P1.equipment.w:
            equipped_to: a
          P1.evolve_deck: []
        forbidden_events:
          - kind: 消去
      - at: after-decision-3
        view: omniscient
        outcome: cannot-attack
        assert:
          P1.field:
            - a
          P2.leader.life: 20
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P1.field: []
          P1.hand:
            - a
            - d
          P1.equipment: []
          P1.evolve_deck:
            - e
          P1.evolve_deck.e:
            face_up: true
          P1.cemetery:
            - s
          P2.leader.life: 20
        events:
          - kind: 消去
            object: w
        forbidden_events:
          - kind: 待機
