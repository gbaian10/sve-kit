why: 偶像進化為護符，不能攻擊；進化本身不離場所以裝備仍關聯，回手牌時才解除並消去裝備，進化卡回エボルヴ牌組表向。
discriminates: 把進化當離場會過早消去裝備；仍當從者會接受攻擊；回手牌誤當破壞則會多出謝幕曲傷害。
