schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: card-BP01-001
kind: card
must_pass: false
mechanisms:
  - 奪取、交換、變身
  - token
cards:
  - BP01-001
  - BP01-173
  - BP01-T03
  - BP08-T04
  - BP21-T11
why: 變身消滅原 token 並立即消去，再同區新建相同數量薔薇；只能斷言消去與區域計數，生成 id 契約尚缺。
discriminates: 把變身原物件改名、把原 token 留消滅區都違反消去事件。
refs:
  rules:
    - 5.17.1
    - 9.1.4.4
  qa:
    - Q146
evidence:
  - ref: Q146
    quote: 「変身する」とは、その能力で選んだカードを消滅させ、消滅した枚数と同数、指定のトークンを同じ領域に作成することを指します。（消滅したトークンはゲームから取り除かれます。）
  - ref: cr 5.17.1
    quote: "あるカードを‘『（トークン名）』に変身する’指示が\nある場合、そのカードを消滅し、新たにその領域に\n（ト―クン名）のトークンを、消滅したカードの枚数と\n同じ数作成します。"
    derivation:
      - 變身消滅原 token 並立即消去，再同區新建相同數量薔薇；只能斷言消去與區域計數，生成 id 契約尚缺。
  - ref: cr 9.1.4.4
    quote: "あるトークンが存在できる領域以外の領域\nに移動した場合、その移動を行った直後に、そ\nの領域で消去されます。この処理はチェックタ\nイミングを待たず、なんらかの効果の途中で移\n動を行った場合は、その移動の続きを行うより\nも前に実行されます。"
    derivation:
      - 變身消滅原 token 並立即消去，再同區新建相同數量薔薇；只能斷言消去與區域計數，生成 id 契約尚缺。
