kind: card
must_pass: true
mechanisms:
  - 手牌、墓場中有效的能力
  - 額外回合、跳過、勝利
  - 10.3.4
  - 7.4.7
  - '12.4'
  - 回合特定時點
cards:
  - BP01-170
  - BP01-173
