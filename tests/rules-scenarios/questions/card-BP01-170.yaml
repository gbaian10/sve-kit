  - BP01-180
why: "[astra] 打出光の道筋只抽本體的一張，不觸發捨棄能力；最後一張可正常抽，空庫抽牌才敗北。\n[fable] 光の道筋「これを自分の手札から捨てたとき、1枚引く」在手牌有效（10.3.4）。結束階段手牌超過上限捨它 → 誘發 → 抽 1 → 手牌又超過 → 7.4.7 要再捨一次（Q270）。 打出後進墓場不是「手札から捨てた」→ 不誘發（Q242），只抽法術本體的 1 張。"
discriminates: "[astra] 把送墓當捨棄會多出待機；把牌庫零張直接當敗北會錯判恰好抽完。\n[fable] 把手牌能力當成只在場上有效、或把 7.4.7 做成一次性的引擎，A 最後手牌會是 8 張或沒有第二次捨牌； 把「打出後進墓場」誤判成捨棄的引擎，B 會抽 2 張。"
refs:
  rules:
    - 5.10.1.1
    - 11.2.2
    - 10.6.2.8.3
    - 10.3.4
    - 7.4.7
    - 5.12.1
    - 4.7.3.1
  qa:
    - Q242
    - Q270
evidence:
  - ref: Q242
    quote: いいえ。このスペルを手札から捨てていないため、デッキから1枚引くことはできません。
  - ref: cr 5.10.1.1
    quote: "この指示の実行の際に、そのプレイヤーの\nデッキ置き場にカードがない場合、そのプレイ\nヤーは次のルール処理でゲームに敗北します\n（11.2.2）。"
    derivation:
      - 打出光の道筋只抽本體的一張，不觸發捨棄能力；最後一張可正常抽，空庫抽牌才敗北。
  - ref: cr 11.2.2
    quote: "直前のルール処理より後にいずれかのプレイヤー\nがカードを引くことを求められ、その際にデッキ置き\n場にカードがなかった場合、そのプレイヤーはこの\nゲームに敗北します。"
    derivation:
      - 打出光の道筋只抽本體的一張，不觸發捨棄能力；最後一張可正常抽，空庫抽牌才敗北。
  - ref: cr 10.6.2.8.3
    quote: "この時点で解決領域にカードや能力\nが残っている場合、それがカードならオー\nナーの墓場に移動し、それが能力なら解決\n領域から取り除きます。"
    derivation:
      - 打出光の道筋只抽本體的一張，不觸發捨棄能力；最後一張可正常抽，空庫抽牌才敗北。
  - ref: Q270
    quote: はい。1枚引きます。その場合、手札の枚数が再び上限を超過するため、改めて手札が7枚になるように捨てる必要があります。
  - ref: cr 7.4.7
    quote: ターンプレイヤーは、自身の手札のカードの枚数が手札の上限を超えている場合、超過分の枚数に等しい枚数のカードを捨てます。これによりカードを捨てた場合、その後にチェックタイミングが発生し、再び 7.4.7 に戻ります。
