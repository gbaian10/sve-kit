why: 貪りの蛇以公開兩張二費手牌為必要費用；同名兩張實體卡可付，公開不移區。
discriminates: 把公開當棄牌會清空手牌；把兩張當兩種名稱會拒絕合法費用；不足仍先橫置會破壞回溯。
refs:
  rules:
    - 5.21.1
    - 10.4.2.2
    - 10.6.2.5.4
  qa: []
evidence:
  - ref: cr 5.21.1
    quote: カードを‘公開する’指示がある場合、そのカードを現在の領域にある状態で、その情報をすべてのプレイヤーに見えるようにします。
  - ref: cr 10.4.2.2
    quote: コストのうち一部または全部を支払うことが不可能である場合、このコストはまったく支払うことはできません。
  - ref: cr 10.6.2.5.4
    quote: なんらかの理由でこの時点でこのコストを支払うことができない場合、このカードや能力のプレイは取り消され、ゲームはこのカードや能力をプレイすることを選択する前まで戻されます。
  - ref: BP18-P32
    quote: "{進化}{コスト5}：これは進化する。\n{起動}これを{アクト}手札の元のコスト2のカード2枚を公開：相手の場のフォロワー1体を選ぶ。それに4ダメージ。"
status: verified
