schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: rule-12.2.4-02
kind: rule
must_pass: true
mechanisms:
  - 進化卡自身的能力
cards:
  - BP01-171
  - BP01-172
why: SEP 門檻依先後攻及自己的經過回合數，不能用全局回合總數。
discriminates: 把雙方回合相加或忽略先後攻，先攻第六回合會錯誤成功。
refs:
  rules:
    - 12.2.4
    - 3.3.1
  qa: []
evidence:
  - ref: cr 12.2.4
    quote: "進化能力をプレイする際、現在の経過ターン数\n（3.3）が、先攻プレイヤーであるなら 7 以上、後攻プ\nレイヤーであるなら 6 以上の場合、そのプレイヤー\nは追加で SEP（3.2.6）を 1 点支払うことができます。\nそうした場合、通常の進化の処理（5.16）に加えて以\n下を追加で実行します。"
    derivation:
      - SEP 門檻依先後攻及自己的經過回合數，不能用全局回合總數。
  - ref: cr 3.3.1
    quote: "経過ターン数は、それぞれのプレイヤーが持つ数\n値情報です。"
    derivation:
      - SEP 門檻依先後攻及自己的經過回合數，不能用全局回合總數。
status: verified
author: astra
verified_by:
  - by: fable
    method: independent-derivation
    note: 12.2.4、3.3.1；xverify-1/result.md〈其他驗過的題目〉
