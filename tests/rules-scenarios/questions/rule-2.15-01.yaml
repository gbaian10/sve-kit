id: rule-2.15-01
kind: rule
must_pass: true
mechanisms:
  - 進化卡自身的能力
  - 持續效果與禁止
cards:
  - BP01-173
  - BP01-176
  - BP09-055
  - BP09-P17
why: 同一雙面進化卡，場上資訊從進化領域實際朝上的面取得；邪竜可無視守護，聖竜不行。
discriminates: 永遠讀 faces[0] 的實作會拒絕邪竜攻擊；把兩面合併則錯允許聖竜。
refs:
  rules:
    - 2.15.3.1
    - 5.16.1.2
  qa:
    - Q1188
    - Q1188
evidence:
  - ref: Q1188
    quote: はい。『聖竜・リントヴルム』か『邪竜・リントヴルム』のどちらかの面を選択し、そのエボルヴフォロワーに進化することができます。
  - ref: cr 2.15.3.1
    quote: "場や進化領域にある両面カードの情報を\n参照する場合、実際にプレイヤーに見えてい\nる面の情報を参照します。\n3. プレイヤーに関する情報"
    derivation:
      - 同一雙面進化卡，場上資訊從進化領域實際朝上的面取得；邪竜可無視守護，聖竜不行。
  - ref: cr 5.16.1.2
    quote: "これ以降、場のカードに進化領域のカード\nが関連付けられている間、そのカードの情報\nは、コストを除きその進化領域のカードの情報\nを持つものとして扱います（10.9.1.1.1）。"
    derivation:
      - 同一雙面進化卡，場上資訊從進化領域實際朝上的面取得；邪竜可無視守護，聖竜不行。
  - ref: Q1188
    quote: はい。『聖竜・リントヴルム』か『邪竜・リントヴルム』のどちらかの面を選択し、そのエボルヴフォロワーに進化することができます。
