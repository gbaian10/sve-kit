  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: card-SCS01-006
kind: card
must_pass: true
mechanisms:
  - S7
  - 不定張數公開
  - 場容量
  - 公開資訊
  - 部分洗牌
cards:
  - BP01-037
  - BP01-169
  - BP01-171
  - BP01-173
  - BP01-179
  - SCS01-006
why: ミルティオ付棄牌費用後，逐張公開至兩張元費用三以下從者；場容量不改停止條件，牌庫不足則做得到多少做多少。只有未上場的公開牌洗到底，未公開尾牌保留相對位置。random.shuffles[].result 僅記錄此次受洗牌指示影響的子集合之排列；未公開的 tail 不參與洗牌，結算後的完整牌庫順序另由 expected 的 P1.deck 比對。
discriminates: 固定翻兩張、依空位提早停、必須湊齊兩張才上場、無合格牌就敗北、全牌庫一起洗或只讓主人看牌，都會違反指定牌序、場、公開事件或 P2 knowledge。
refs:
  rules:
    - 1.3.2
    - 4.4.4.2
    - 5.21.1
    - 5.21.1.1
    - 4.5.2
    - 11.2.2
  qa:
    - Q1324
    - Q1323
    - Q1322
evidence:
  - ref: Q1324
    quote: "Q: 自分の場のフォロワーが4体の状況で、『《恋人》・ミルティオ』の《ファンファーレ》能力をプレイした場合、どのように処理を行いますか？\nA: 場のカードの数に関わらず、自分のデッキの上を元のコスト3以下のフォロワーが2枚公開されるまで、公開します。元のコスト3以下のフォロワーが2枚公開された場合、その中から1枚を選択して場に出します。その後、場に出さなかった元のコスト3以下のフォロワーを含めた公開したカードすべてをシャッフルし、デッキの下に置きます。"
    derivation:
      - ミルティオ付棄牌費用後，逐張公開至兩張元費用三以下從者；場容量不改停止條件，牌庫不足則做得到多少做多少。只有未上場的公開牌洗到底，未公開尾牌保留相對位置。
  - ref: Q1323
    quote: "Q: このフォロワーの《ファンファーレ》能力を処理する際、デッキの上からすべての枚数のカードを公開しても元のコスト3以下のフォロワーを1枚しか公開できなかった場合、その1枚を場に出すことはできますか？\nA: はい。公開した元のコスト3以下のフォロワー1枚を場に出すことができます。"
    derivation:
      - ミルティオ付棄牌費用後，逐張公開至兩張元費用三以下從者；場容量不改停止條件，牌庫不足則做得到多少做多少。只有未上場的公開牌洗到底，未公開尾牌保留相對位置。
  - ref: Q1322
    quote: "Q: このフォロワーの《ファンファーレ》能力を処理する際、デッキの上からすべての枚数のカードを公開しても元のコスト3以下のフォロワーを公開することが出来なかった場合、その後はどのように処理を行いますか？\nA: 元のコスト3以下のフォロワーは無かったため、何も場に出さずに、公開したカードすべてをシャッフルし、デッキ置き場に置きます。"
    derivation:
      - ミルティオ付棄牌費用後，逐張公開至兩張元費用三以下從者；場容量不改停止條件，牌庫不足則做得到多少做多少。只有未上場的公開牌洗到底，未公開尾牌保留相對位置。
  - ref: cr 1.3.2
    quote: なんらかの理由によりプレイヤーが実行不可能なこ とを行うように求められた場合、それは単に行われ ません。同様に、効果により一定の量の行動を行う よう求められた場合、その一部のみ実行不可能な 場合、可能な限りその行動を行います。
    derivation:
      - ミルティオ付棄牌費用後，逐張公開至兩張元費用三以下從者；場容量不改停止條件，牌庫不足則做得到多少做多少。只有未上場的公開牌洗到底，未公開尾牌保留相對位置。
  - ref: cr 4.4.4.2
    quote: 場にカードを移動または作成する処理にお いて、その結果場のカードの枚数が上限を超 える場合、その移動または作成するカードの 中から、その場の上限からその場にあるカー ドの枚数を引いた数のカードを選択し、それら のカードのみを移動または作成します。それ 以外のカードは移動せず作成されません。
    derivation:
      - ミルティオ付棄牌費用後，逐張公開至兩張元費用三以下從者；場容量不改停止條件，牌庫不足則做得到多少做多少。只有未上場的公開牌洗到底，未公開尾牌保留相對位置。
  - ref: cr 5.21.1
    quote: カードを‘公開する’指示がある場合、そのカードを 現在の領域にある状態で、その情報をすべてのプレ イヤーに見えるようにします。
    derivation:
      - ミルティオ付棄牌費用後，逐張公開至兩張元費用三以下從者；場容量不改停止條件，牌庫不足則做得到多少做多少。只有未上場的公開牌洗到底，未公開尾牌保留相對位置。
  - ref: cr 5.21.1.1
    quote: これにより公開されたカードが非公開領域 にある場合、そのカードが他の非公開領域ま たは同じ非公開領域の他の位置に移動する か、そのカードを公開させた処理を含む効果 の解決が終了した時点で、そのカードは非公 開に戻ります。
    derivation:
      - ミルティオ付棄牌費用後，逐張公開至兩張元費用三以下從者；場容量不改停止條件，牌庫不足則做得到多少做多少。只有未上場的公開牌洗到底，未公開尾牌保留相對位置。
  - ref: cr 4.5.2
    quote: デッキ置き場は非公開領域で、カードの順番が管 理されます。プレイヤーは効果やルールによる指示 がある場合にのみ、デッキ置き場のカードの順番を 変更したり、そのカードの情報を知ったりすることが できます。
    derivation:
      - ミルティオ付棄牌費用後，逐張公開至兩張元費用三以下從者；場容量不改停止條件，牌庫不足則做得到多少做多少。只有未上場的公開牌洗到底，未公開尾牌保留相對位置。
  - ref: cr 11.2.2
    quote: 直前のルール処理より後にいずれかのプレイヤー がカードを引くことを求められ、その際にデッキ置き 場にカードがなかった場合、そのプレイヤーはこの ゲームに敗北します。
    derivation:
      - ミルティオ付棄牌費用後，逐張公開至兩張元費用三以下從者；場容量不改停止條件，牌庫不足則做得到多少做多少。只有未上場的公開牌洗到底，未公開尾牌保留相對位置。
