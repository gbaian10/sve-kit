        by: P1
        at: main
        do: play
        card: m
      - n: 2
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: m
            line: 2
        costs:
          1:
            - cost
    random:
      shuffles:
        - player: P1
          zone: deck
          result:
            - n2
            - large
            - n1
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
