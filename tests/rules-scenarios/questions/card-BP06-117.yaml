why: 翻回背面只接受表向的エボルヴフォロワー；可再進化，アドバンス與エボルヴ護符皆不合格。
discriminates: 把所有 evolve_deck 卡都視為進化從者會錯誤接受兩個反例；翻面未生效則後續進化失敗。
refs:
  rules:
    - 10.6.2.3.3
  qa:
    - Q875
    - Q1123
    - Q1267
evidence:
  - ref: Q875
    quote: "Q: 自分のエボルヴデッキの表向きのエボルヴフォロワー1枚を選ぶことができない場合、『生命の量産』をプレイして、1枚引くことができますか？\nA: いいえ。選ぶことができないので、『生命の量産』をプレイすることができず、1枚引くことができません。"
    derivation:
      - 翻回背面只接受表向的エボルヴフォロワー；可再進化，アドバンス與エボルヴ護符皆不合格。
  - ref: Q1123
    quote: "Q: 『生命の量産』によって、自分のエボルヴデッキの表向きの『狂信の偶像（EVOLVE）』を選ぶことができますか？\nA: いいえ。『狂信の偶像（EVOLVE）』はエボルヴフォロワーではないので、選ぶことができません。"
    derivation:
      - 翻回背面只接受表向的エボルヴフォロワー；可再進化，アドバンス與エボルヴ護符皆不合格。
  - ref: Q1267
    quote: "Q: 『生命の量産』によって、自分のエボルヴデッキの表向きのアドバンスフォロワーを選ぶことができますか？\nA: いいえ。アドバンスフォロワーはエボルヴフォロワーではないので、選ぶことができません。"
    derivation:
      - 翻回背面只接受表向的エボルヴフォロワー；可再進化，アドバンス與エボルヴ護符皆不合格。
  - ref: cr 10.6.2.3.3
    quote: 選ぶ数として指定された数が 1 以上 で、かつその数の目標を選ぶことが不可能 である場合、このカードや能力のプレイは 不正で、このカードや能力はプレイできませ ん。このカードや能力のプレイは取り消さ れ、ゲームはこのカードや能力をプレイする ことを選択する前まで戻されます。
    derivation:
      - 翻回背面只接受表向的エボルヴフォロワー；可再進化，アドバンス與エボルヴ護符皆不合格。
