schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP09-020
kind: card
must_pass: true
mechanisms: [替代勝利條件的判定時點, 1.2.4, 5.10.1.1, 11.2.2, 10.5.2, 禁止優先於勝利, 1.3.3, 額外回合、跳過、勝利, 牌庫抽空]
cards: [BP09-020, BP01-170, BP01-173, BP05-092]
why: >-
  スパルタクス「自分のエンドフェイズが来たとき、自分の手札を好きな枚数捨てる。X枚引く。Xは「これによって捨てた手札の枚数+1」である。その後、自分のデッキが1枚以下なら、自分はこのバトルに勝利する」：
  勝利判定只在**這個能力結算中**「その後」的那一刻做一次。
  A（Q1480）：捨 2 張（含光の道筋）→ 抽 3 → 牌庫 2 → 不勝利；光の道筋 的誘發要等這個能力結算完的檢查時點才結算，它抽的第 4 張讓牌庫剩 1 也不算。
  B：牌庫 4 → 抽 3 後剩 1 → 依 1.2.4 在效果處理中立即勝利，不等檢查時點（光の道筋 的待機不再結算）。
  C（Q1162）：牌庫 0、捨 0 張 → 抽 1 張抽不到（5.10.1.1：下次規則處理才敗北）→ 「その後」牌庫 0 ≤ 1 → 先勝利。
  D（Q1163）：對手場上有古き護り手「相手はバトルに勝利できない」→ 牌庫剩 1 也不勝利，遊戲繼續（禁止優先，1.3.3）。
  E（依 Q1162＋Q1163 推導，無直接 Q&A）：護り手在對手場上且自己牌庫 0 → 抽不到、勝利被禁止 → 檢查時點依 11.2.2 自己敗北。
discriminates: >-
  在檢查時點（光の道筋 抽完之後）才判定的引擎：A 會判 P1 勝利。把勝利延到檢查時點的引擎：C 會先處理 11.2.2 而判 P1 敗北。
  B 中讓光の道筋 繼續結算的引擎會多一次 choose-pending。D 中忽略禁止效果的引擎會 game-end。E 中把護り手當成也保護對手的引擎不會結束遊戲。
refs:
  rules: [1.2.4, 1.3.3, 5.10.1.1, 5.10.2, 5.12.1, 11.2.2, 10.5.2.1, 10.5.2.2, 10.6.2.8.2, 10.7.1, 7.4.1, 7.4.2, 7.4.3, 10.3.4]
  qa: [Q1480, Q1162, Q1163, Q1161, Q749]
evidence:
  - ref: Q1480
    quote: いいえ。『スパルタクス』の能力がすべて処理された後のチェックタイミングで『光の道筋』の能力を解決するため、バトルに勝利しません。
  - ref: Q1162
    quote: いいえ。自分はバトルに勝利します。自分のデッキが0枚の状況で『スパルタクス』の能力をプレイした場合、「X枚引く。」によってカードを引くため、次のチェックタイミングで自分はバトルに敗北しますが、「自分のデッキが1枚以下なら、自分はこのバトルに勝利する。」の条件を満たすため、この効果の処理中に自分はバトルに勝利します。（チェックタイミングにおける敗北処理の前に勝利します。）
  - ref: Q1163
    quote: いいえ。バトルに勝利せず、ゲームが続きます。自分の場の『スパルタクス』の「自分のデッキが1枚以下なら、自分はこのバトルに勝利する。」という効果と相手の場の『古き護り手』の「自分はバトルに敗北せず、相手はバトルに勝利できない。」という効果が同時に適用される場合、禁止する効果である「自分はバトルに敗北せず、相手はバトルに勝利できない。」が優先されます。
  - ref: cr 11.2.2
    quote: 直前のルール処理より後にいずれかのプレイヤーがカードを引くことを求められ、その際にデッキ置き場にカードがなかった場合、そのプレイヤーはこのゲームに敗北します。
    derivation: [E：護り手只禁止「自分（P2）敗北」與「相手（P1）勝利」，P1 抽不到牌的敗北不在禁止範圍 → 勝利被禁止後，檢查時點的規則處理讓 P1 敗北]
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: A：xverify-2/recheck.md:109〈全部改動局面的核對索引〉；B／C／D／E：xverify-2/result.md:255〈全部實質核驗局面的索引〉（1.2.4、1.3.3、Q1480、Q1162）

scenarios:
  - name: A 牌庫 5：捨 2 抽 3 → 剩 2 不勝利；光の道筋 之後才抽第 4 張 → 剩 1 也不勝利
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 8, P2: 7}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 8}
          zones:
            field:
              - {id: a1, card: BP09-020}          # スパルタクス 4/6 守護
            hand:
              - {id: h1, card: BP01-170}          # 光の道筋（手札から捨てたとき、1枚引く）
              - {id: h2, card: BP01-173}
              - {id: h3, card: BP01-173}
            deck:
              - {id: d1, card: BP01-173}
              - {id: d2, card: BP01-173}
              - {id: d3, card: BP01-173}
              - {id: d4, card: BP01-173}
              - {id: d5, card: BP01-173}
        P2:
          construction: class
          leader: {class: ビショップ, life: 20}
          pp: {current: 0, max: 7}
          zones:
            hand:
              - {filler: 3}
            deck:
              - {id: p1, card: BP01-173}
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: end-phase}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}}
      - {n: 3, by: P1, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, select: [h1, h2]}
      - {n: 4, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: h1, line: 1}}}
      - {n: 5, by: P1, at: end, do: guard-act, select: []}
      - {n: 6, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: paused
        awaiting:
          by: P1
          choices:
            - {do: resolve-choice, select: []}
            - {do: resolve-choice, select: [h1]}
            - {do: resolve-choice, select: [h2]}
            - {do: resolve-choice, select: [h3]}
            - {do: resolve-choice, select: [h1, h2]}
            - {do: resolve-choice, select: [h1, h3]}
            - {do: resolve-choice, select: [h2, h3]}
            - {do: resolve-choice, select: [h1, h2, h3]}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          game: {ended: false}
          P1.hand: [h3, d1, d2, d3]
          P1.cemetery: [h1, h2]
          P1.deck: [d4, d5]
        events:
          - {kind: 捨てる, player: P1, object: h1, group: 1}
          - {kind: 捨てる, player: P1, object: h2, group: 1}
          - {kind: 引く, player: P1, object: d1}
          - {kind: 引く, player: P1, object: d2}
          - {kind: 引く, player: P1, object: d3}
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: h1, line: 1}}}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          game: {ended: false}
          P1.hand: [h3, d1, d2, d3, d4]
          P1.deck: [d5]
        events:
          - {kind: 引く, player: P1, object: d4}
      - at: after-decision-6
        view: omniscient
        outcome: resolved
        assert:
          game: {ended: false}
          turn: {active: P2, phase: main}
          P1.deck: [d5]

  - name: B 牌庫 4：捨 2 抽 3 → 剩 1 → 效果處理中立即勝利，光の道筋 的待機不再結算
    inherit: A 牌庫 5：捨 2 抽 3 → 剩 2 不勝利；光の道筋 之後才抽第 4 張 → 剩 1 也不勝利
    setup:
      players:
        P1:
          zones:
            deck:
              - {id: d1, card: BP01-173}
              - {id: d2, card: BP01-173}
              - {id: d3, card: BP01-173}
              - {id: d4, card: BP01-173}
    decisions:
      - {n: 1, by: P1, at: main, do: end-phase}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}}
      - {n: 3, by: P1, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, select: [h1, h2]}
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: game-end
        assert:
          game: {ended: true, winner: P1, by: 1.2.4}
          P1.deck: [d4]
          P1.hand: [h3, d1, d2, d3]
        forbidden_events:
          - {kind: プレイ, ability: {source: h1, line: 1}}
          - {kind: 敗北}

  - name: C 牌庫 0：捨 0 張、抽 1 張抽不到 → 「その後」牌庫 0 ≤ 1 → 在敗北處理之前勝利
    inherit: A 牌庫 5：捨 2 抽 3 → 剩 2 不勝利；光の道筋 之後才抽第 4 張 → 剩 1 也不勝利
    setup:
      players:
        P1:
          zones:
            hand:
              - {id: h2, card: BP01-173}
            deck: []
    decisions:
      - {n: 1, by: P1, at: main, do: end-phase}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}}
      - {n: 3, by: P1, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, select: []}
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: game-end
        assert:
          game: {ended: true, winner: P1, by: 1.2.4}
          P1.hand: [h2]
          P1.deck: []
        forbidden_events:
          - {kind: 捨てる}
          - {kind: 敗北}

  - name: D 對手場上有古き護り手：牌庫剩 1 也不勝利（禁止優先），遊戲繼續
    inherit: B 牌庫 4：捨 2 抽 3 → 剩 1 → 效果處理中立即勝利，光の道筋 的待機不再結算
    setup:
      players:
        P2:
          zones:
            field:
              - {id: g1, card: BP05-092}          # 古き護り手
    decisions:
      - {n: 1, by: P1, at: main, do: end-phase}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}}
      - {n: 3, by: P1, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, select: [h1, h2]}
      - {n: 4, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: h1, line: 1}}}
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          game: {ended: false}
          P1.deck: [d4]
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: h1, line: 1}}}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          game: {ended: false}
          P1.deck: []
          P1.hand: [h3, d1, d2, d3, d4]

  - name: E（推導）護り手在對手場上、自己牌庫 0：抽不到、勝利被禁止 → 檢查時點依 11.2.2 敗北
    inherit: C 牌庫 0：捨 0 張、抽 1 張抽不到 → 「その後」牌庫 0 ≤ 1 → 在敗北處理之前勝利
    setup:
      players:
        P2:
          zones:
            field:
              - {id: g1, card: BP05-092}          # 古き護り手
    decisions:
      - {n: 1, by: P1, at: main, do: end-phase}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}}
      - {n: 3, by: P1, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, select: []}
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: game-end
        assert:
          game: {ended: true, winner: P2, by: 11.2.2}
        events:
          - {kind: 敗北, player: P1, by: rule-11.2.2}
