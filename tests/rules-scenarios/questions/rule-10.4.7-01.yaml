schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: rule-10.4.7-01
kind: rule
must_pass: true
mechanisms: [10.4.7, 10.4.7.2, 10.4.7.3, 10.10.2.5, '12.15', 可選費用與範圍, 效果中的「費用：效果」, 持續效果與禁止]
cards: [BP04-066, BP02-089, BP01-173, BP01-176, BP03-SL14, BP01-180, BP01-131]
why: >-
  （A～C）ライトニングブラスト「プレイする際、コストを+5してよい」是打出時的可選追加費用（10.4.7.2）；付了之後「それを消滅させる代わりに相手のフォロワーすべてを消滅させる」是自我取代。
  即使付了 +5 仍必須選 1 個目標（Q602）；【オーラ】的ヘヴンリーイージス不能被選，但只要選得到別的從者，全體消滅會連它一起消滅（Q604）；
  對手只有ヘヴンリーイージス時不能打出（Q603）。（D）ダークアリス的ラストワード「デッキの上10枚を消滅：これを場に出す。自分の手札1枚を捨てる」是自動能力結算時的可選費用（10.4.7.3）：
  不付 → 整段不做（Q492）；付了但手牌 0 → 出場、捨牌單純不做（Q493）。
discriminates: >-
  A：把「+5 → 全體消滅」實作成不需要目標的引擎，在 B 也會打出（Q603 說不能）；把【オーラ】實作成不受全體效果影響的引擎，A 會留下 b2。
  C：沒付 +5 卻消滅全體、或付了 +5 又對目標另外消滅一次（事件重複）都可觀察。D：把結算時的可選費用當成打出費用的引擎，D2 會變成 pending-cancelled 而不是 resolved 且無事；
  把「捨てる」當成費用的引擎在 D3（手牌 0）會拒絕出場。
refs:
  rules: [10.4.7, 10.4.7.1, 10.4.7.2, 10.4.7.3, 10.6.2.2.2, 10.6.2.3.1, 10.6.2.3.3, 10.10.2.5, 10.10.2.5.1, 12.15.2, 12.15.2.1, 5.7.1, 1.3.2, 12.5.3, 4.10.2]
  qa: [Q602, Q603, Q604, Q492, Q493, Q494]
evidence:
  - ref: Q602
    quote: はい。相手のフォロワー1体を選ぶ必要があります。
  - ref: Q603
    quote: いいえ。このスペルをプレイするためには相手のフォロワーを選ぶ必要があります。相手のフォロワーを選ぶことができないので、このスペルをプレイすることができず、『ヘヴンリーイージス』を消滅させることができません。
  - ref: Q604
    quote: はい。『ゴブリン』を選ぶことによって問題なくこのスペルをプレイすることができ、相手のフォロワーすべてを消滅させることができます。
  - ref: cr 12.15.2.1
    quote: オーラはカードや能力をプレイする際に選ぶことのみを禁止します。
    derivation:
      - 「すべてを消滅」不是「選ぶ」→ オーラ不擋
  - ref: Q492
    quote: いいえ。「自分の手札1枚を捨てる。」は行いません。このフォロワーの《ラストワード》能力は、任意で支払うことのできるコストである「デッキの上10枚を消滅」を支払った場合、効果である「これを場に出す。自分の手札1枚を捨てる。」を適用するという能力です。
  - ref: Q493
    quote: はい。コストである「デッキの上10枚を消滅」を支払うことで場に出すことができます。また、その後の効果である「自分の手札を1枚捨てる」は自分の手札が0枚なので単に行われません。
  - ref: cr 10.4.7.3
    quote: なんらかの自動能力において‘～とき、（処理）：（効果）’と書かれている場合、これはその自動能力を解決する際にその処理を実行することで、その効果を適用することを選択することができます。
    derivation:
      - ラストワード＝「場から墓場に置いたとき」（12.5.3）→ 「〜とき、（処理）：（効果）」形式 → 結算時決定是否支付；不付也算已打出並結算
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: A／B／C／D2／D3：xverify-1/result.md:117〈其他驗過的題目〉（10.4.7.3、Q602–Q604、Q492–Q494）；D1：xverify-2/recheck.md:97〈全部改動局面的核對索引〉

scenarios:
  - name: A 付 +5、選ファイター當目標 → 全體消滅（含オーラ的ヘヴンリーイージス）
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 10, P2: 9}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 10, max: 10}
          zones:
            hand:
              - {id: a1, card: BP04-066}          # ライトニングブラスト（コスト5、+5 してよい）
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ビショップ, life: 20}
          pp: {current: 0, max: 10}
          zones:
            field:
              - {id: b1, card: BP01-173}          # ファイター
              - {id: b2, card: BP02-089}          # ヘヴンリーイージス 8/8【オーラ】
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, optional_costs: {additional: {pp: 5}}, targets: {1: [b1]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P2.field: []
          P2.banish: [b1, b2]
          P1.cemetery: [a1]
        events:
          - {kind: 消滅, object: b1, group: 1}
          - {kind: 消滅, object: b2, group: 1}

  - name: B 對手只有ヘヴンリーイージス → 選不到目標 → 不能打出（付 +5 也不行）
    inherit: A 付 +5、選ファイター當目標 → 全體消滅（含オーラ的ヘヴンリーイージス）
    setup:
      players:
        P2:
          zones:
            field:
              - {id: b2, card: BP02-089}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, optional_costs: {additional: {pp: 5}}, targets: {1: []}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-play
        awaiting:
          by: P1
          choices:
            - {do: end-phase}
        assert:
          P1.pp.current: 10
          P1.hand: [a1]
          P2.field: [b2]
        forbidden_events:
          - {kind: 消滅}
          - {kind: プレイ}

  - name: C 不付 +5 → 只消滅目標
    inherit: A 付 +5、選ファイター當目標 → 全體消滅（含オーラ的ヘヴンリーイージス）
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, optional_costs: {additional: decline}, targets: {1: [b1]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 5
          P2.field: [b2]
          P2.banish: [b1]
        events:
          - {kind: 消滅, object: b1}
        forbidden_events:
          - {kind: 消滅, object: b2}

  - name: D1 ダークアリス的ラストワード：付「デッキの上10枚を消滅」→ 出場、捨 1 張
    setup:
      turn: {active: P2, first_player: P1, elapsed_turns: {P1: 6, P2: 6}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ナイトメア, life: 20}
          pp: {current: 0, max: 6}
          zones:
            field:
              - {id: a1, card: BP03-SL14, state: {hp: 1}}   # ダークアリス 6/6，再 1 點就死
            hand:
              - {id: a2, card: BP01-173}
              - {id: a3, card: BP01-176}
            deck:
              - {id: d1, card: BP01-173}
              - {id: d2, card: BP01-173}
              - {id: d3, card: BP01-173}
              - {id: d4, card: BP01-176}
              - {id: d5, card: BP01-176}
              - {id: d6, card: BP01-176}
              - {id: d7, card: BP01-180}
              - {id: d8, card: BP01-180}
              - {id: d9, card: BP01-180}
              - {id: d10, card: BP01-131}
              - {filler: 10}
        P2:
          construction: class
          leader: {class: ビショップ, life: 20}
          pp: {current: 6, max: 6}
          zones:
            hand:
              - {id: b1, card: BP01-180}          # エンジェルバレッジ
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P2, at: main, do: play, card: b1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 3}}}
      - {n: 3, by: P1, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, choice: execute}
      - {n: 4, by: P1, at: resolve, of: {decision: 2, occurrence: 2}, do: resolve-choice, select: [a3]}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: paused
        awaiting:
          by: P1
          choices:
            - {do: resolve-choice, choice: execute}
            - {do: resolve-choice, choice: decline}
        assert:
          P1.cemetery: [a1]
          P1.field: []
        events:
          - {kind: 破壊, object: a1}
          - {kind: プレイ, ability: {source: a1, line: 3}}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P1.field: [a1]
          P1.field.a1: {entered_from: cemetery, entered_by: effect}
          P1.banish: [d1, d2, d3, d4, d5, d6, d7, d8, d9, d10]
          P1.deck: [filler: 10]
          P1.hand: [a2]
          P1.cemetery: [a3]
        events:
          # 「デッキの上10枚を消滅」是一批 → 同時（互驗第二輪修正，astra）
          - {kind: 消滅, object: d1, group: 1}
          - {kind: 消滅, object: d10, group: 1}
          - {kind: 場に出す, object: a1, from: P1.cemetery}
          - {kind: 捨てる, player: P1, object: a3}

  - name: D2 不付 → 整段不做：留在墓場、不捨牌、牌庫不動
    inherit: D1 ダークアリス的ラストワード：付「デッキの上10枚を消滅」→ 出場、捨 1 張
    decisions:
      - {n: 1, by: P2, at: main, do: play, card: b1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 3}}}
      - {n: 3, by: P1, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, choice: decline}
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.field: []
          P1.cemetery: [a1]
          P1.hand: [a2, a3]
          P1.banish: []
          P1.deck: [d1, d2, d3, d4, d5, d6, d7, d8, d9, d10, filler: 10]
          semantic_state.pending_triggers: []
        events:
          - {kind: プレイ, ability: {source: a1, line: 3}}
          - {kind: 解決, ability: {source: a1, line: 3}}
        forbidden_events:
          - {kind: 消滅}
          - {kind: 捨てる}
          - {kind: 場に出す}
          - {kind: 待機取消}

  - name: D3 手牌 0 張仍可付費出場，捨牌單純不做
    inherit: D1 ダークアリス的ラストワード：付「デッキの上10枚を消滅」→ 出場、捨 1 張
    setup:
      players:
        P1:
          zones:
            hand: []
    decisions:
      - {n: 1, by: P2, at: main, do: play, card: b1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 3}}}
      - {n: 3, by: P1, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, choice: execute}
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.field: [a1]
          P1.banish: [d1, d2, d3, d4, d5, d6, d7, d8, d9, d10]
          P1.hand: []
          P1.cemetery: []
        events:
          - {kind: 場に出す, object: a1, from: P1.cemetery}
        forbidden_events:
          - {kind: 捨てる}
