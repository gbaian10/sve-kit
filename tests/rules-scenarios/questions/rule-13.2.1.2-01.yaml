schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: rule-13.2.1.2-01
kind: rule
must_pass: true
mechanisms:
  - 13.2.1.2
  - 13.2.1.3
cards:
  - BP04-010
  - BP04-011
  - EBD01-T01
why: 用實際打出序列區分零費 token 算卡片、進化不算卡片。
discriminates: 把進化算一張會令兩卡分支錯成 3/3；忽略零費 token 會令三卡分支錯成 2/2。
refs:
  rules:
    - 13.2.1.2
    - 13.2.1.3
  qa:
    - Q563
evidence:
  - ref: cr 13.2.1.2
    quote: ‘【コンボ （数値）】（テキスト）’は‘このターン、あなたがこのカードを含めて（数値）枚以上のカードをプレイしていた場合、（テキスト）’を意味します。
  - ref: cr 13.2.1.3
    quote: このプレイしていた枚数ではあらゆる領域からプレイされていたカードを、カードがトークンであるか否かに関係なく数えます。
  - ref: Q563
    quote: いいえ。フォロワーの進化はカードのプレイには含まず、このターンにプレイしたカードは『小さな勇士・スクナ』と『フェアリー』の2枚のみのため、【コンボ_3】の条件を満たしていません。
status: verified
author: astra
verified_by:
  - by: fable
    method: qa
    note: 13.2.1.3、Q563；xverify-2/result.md〈補題〉2/2
scenarios:
  - name: 打出スクナ及 1 張零費 token 再進化
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: エルフ
            life: 20
          pp:
            current: 2
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            hand:
              - id: a
                card: BP04-010
            evolve_deck:
              - id: e
                card: BP04-011
            ex:
              - id: w0
                card: EBD01-T01
        P2:
          construction: class
          leader:
            class: ロイヤル
            life: 20
          pp:
            current: 0
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: a
      - n: 2
        by: P1
        at: main
        do: play
        card: w0
      - n: 3
        by: P1
        at: main
        do: evolve
        source: a
        evolve_card: e
        pay:
          pp: 1
          ep: 0
      - n: 4
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 2
            card: BP04-011
    random: {}
    expected:
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P1.field.a:
            power: 2
            hp: 2
          semantic_state.counters_this_turn.P1.cards_played: 2
          semantic_state.counters_this_turn.P1.evolve_played: 1
          semantic_state.counters_this_turn.P1.evolutions: 1
