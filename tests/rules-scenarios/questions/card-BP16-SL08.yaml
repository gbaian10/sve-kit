            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            hand:
              - id: g
                card: BP16-SL08
            field:
              - id: a
                card: BP14-027
            ex: []
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: b
                card: BP01-176
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: g
      - n: 2
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: g
            line: 1
        options:
          - 3
      - n: 3
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 1
          event:
            entered_ex: new-1
        targets:
          1:
            - b
      - n: 4
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 1
          event:
            entered_ex: new-2
        targets:
          1:
            - b
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 8
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b:
            hp: 6
          P2.leader.life: 20
          P1.ex:
            - new-1
            - new-2
          P1.ex.new-1:
            card: BP16-T15
          P1.ex.new-2:
            card: BP16-T15
        events:
          - kind: 移動
            object: new-1
            card: BP16-T15
            to: P1.ex
            source: g
            group: create-coins
          - kind: 移動
            object: new-2
            card: BP16-T15
            to: P1.ex
            source: g
            group: create-coins
          - kind: 待機
            ability:
              source: a
              line: 1
            event:
              entered_ex: new-1
            group: coin-triggers
          - kind: 待機
            ability:
              source: a
              line: 1
            event:
              entered_ex: new-2
            group: coin-triggers
        events_exact:
          - 待機
        forbidden_events:
          - kind: 場に出す
            object: new-1
          - kind: 場に出す
            object: new-2
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P2.field: []
          P2.cemetery:
            - b
          P2.leader.life: 18
          semantic_state.pending_triggers: []
