schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: card-BP16-SL08
kind: card
must_pass: true
mechanisms:
  - 抉擇＋條件改變選擇數
  - 10.7 其他
  - token
  - 放牌庫頂或底
  - '5.9'
  - 10.6.2.8.2
  - 結算時的選擇（可選剛抽的卡）
cards:
  - BP01-173
  - BP01-176
  - BP14-027
  - BP16-SL08
  - BP16-T15
why: "[astra] 選項 3 同時生成兩枚金幣，芸者依兩張各待機一次；EX 已滿則零生成零待機。用精確待機事件數避免為新 token 擅造 id。\n[fable] 艶やかなる太夫・ギンネ【2】「1枚引く。自分の手札1枚をデッキの上か下に置く」：抽完才選要放哪張（結算時的選擇，可以是剛抽的那張）與放頂或放底 （契約 9.12 的 resolve-choice.position；同一句 → 同一個輸入點，9.8）。A 把剛抽的卡放回牌庫頂；B 把原本的手牌放到牌庫底。"
discriminates: "[astra] 把同時進 EX 合成一事件會只待機一次；滿 EX 仍觸發也會違反禁止事件。\n[fable] 在抽牌前就要求選卡的引擎 awaiting 只會列 h1；沒有「頂／底」選項或固定放底的引擎 A 的牌庫順序不同；把「放頂」做成放底的引擎 A 的牌庫尾端多一張。"
refs:
  rules:
    - 10.7.2.1
    - 4.8.3.2
    - 10.6.2.8.2
    - 5.9.1
    - 5.10.2
    - 4.5.1
    - 5.18.2.1
  qa:
    - Q1886
    - Q2087
evidence:
  - ref: Q1886
    quote: はい。2回誘発します。
  - ref: cr 10.7.2.1
    quote: "自動能力の誘発条件が複数回満たされた\n場合、その自動能力はその回数分待機状態\nになります。"
    derivation:
      - 選項 3 同時生成兩枚金幣，芸者依兩張各待機一次；EX 已滿則零生成零待機。用精確待機事件數避免為新 token 擅造 id。
  - ref: cr 4.8.3.2
    quote: "EX エリアにカードを移動または作成する処\n理において、その結果 EX エリアのカードの枚\n数が上限を超える場合、その移動または作成\nするカードの中から、その EX エリアの上限か\nらその EX エリアにあるカードの枚数を引いた\n数のカードを選択し、それらのカードのみを移\n動または作成します。それ以外のカードは移\n動または作成しません。"
    derivation:
      - 選項 3 同時生成兩枚金幣，芸者依兩張各待機一次；EX 已滿則零生成零待機。用精確待機事件數避免為新 token 擅造 id。
  - ref: Q2087
    quote: いいえ。できません。カードや能力によって目標を選ぶ場合、そのカードや能力をプレイする際に目標を選びます。…その後、能力に示された効果を、表記の順にしたがって実行します。
    derivation:
      - 「自分の手札1枚をデッキの上か下に置く」不是「選ぶ」目標 → 結算時依表記順序：先抽、再從當時手牌選 → 可以放剛抽的卡
status: verified
author:
  - astra
  - fable
verified_by:
  - by: astra
    method: qa
    note: A／B：xverify-2/result.md:222〈全部實質核驗局面的索引〉（10.6.2.8.2、5.9.1、Q2087）
  - by: fable
    method: qa
    note: 10.7.2.1、Q1886、4.8.3.1／4.8.3.2；xverify-1/result.md；遷移後 xverify-2/result.md 3/3；「原 EX 0」「原 EX 3」fix-2 加 移動 與 group 後 xverify-2/recheck.md 同意；「原 EX 5」followup 補零張 select 後 xverify-2/final.md 同意
scenarios:
  - name: '[astra] 原 EX 0'
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
