  qa:
    - Q2636
    - Q2635
evidence:
  - ref: Q2636
    quote: "Q: 《起動》【融合】能力で複数枚のカードを融合するとき、手札のカードとEXエリアのカードを合わせて融合することができますか？\nA: はい。手札のカードとEXエリアのカードを合わせて融合することができます。たとえば、手札の財宝・カード1枚を捨ててEXエリアの財宝・カード1枚を墓場に置くことで、2枚融合することができます。"
    derivation:
      - X 於打出時指定並須支付相同張數，不能事後把不足的支付改成較小 X；EX 財寶 token 送墓即消去，仍是已支付的一張並貢獻融合計數器。
  - ref: Q2635
    quote: "Q: 《起動》【融合】能力は、その能力を持つカードが手札にある場合に有効となる能力ですか？\nA: はい。その能力を持つカードが手札にある場合に有効となる能力です。"
    derivation:
      - X 於打出時指定並須支付相同張數，不能事後把不足的支付改成較小 X；EX 財寶 token 送墓即消去，仍是已支付的一張並貢獻融合計數器。
  - ref: cr 5.2.1.2
    quote: X の値がプレイヤーの意図を問わずに特定 の値として決定されるものでない場合、X の値 はそのカードや能力のプレイ時に決定します （10.6.2.2.3）。
    derivation:
      - X 於打出時指定並須支付相同張數，不能事後把不足的支付改成較小 X；EX 財寶 token 送墓即消去，仍是已支付的一張並貢獻融合計數器。
  - ref: cr 12.18.2.1
    quote: （条件）で指定されたカードが複数ある場 合、手札から捨てるカードと EX エリアから墓 場に置くカードを合わせて（条件）を満たすこと ができます。
    derivation:
      - X 於打出時指定並須支付相同張數，不能事後把不足的支付改成較小 X；EX 財寶 token 送墓即消去，仍是已支付的一張並貢獻融合計數器。
  - ref: cr 9.1.4.4
    quote: あるトークンが存在できる領域以外の領域 に移動した場合、その移動を行った直後に、そ の領域で消去されます。この処理はチェックタ イミングを待たず、なんらかの効果の途中で移 動を行った場合は、その移動の続きを行うより も前に実行されます。
    derivation:
      - X 於打出時指定並須支付相同張數，不能事後把不足的支付改成較小 X；EX 財寶 token 送墓即消去，仍是已支付的一張並貢獻融合計數器。
  - ref: cr 10.4.2.2
    quote: コストのうち一部または全部を支払うことが 不可能である場合、このコストはまったく支払 うことはできません。
    derivation:
      - X 於打出時指定並須支付相同張數，不能事後把不足的支付改成較小 X；EX 財寶 token 送墓即消去，仍是已支付的一張並貢獻融合計數器。
