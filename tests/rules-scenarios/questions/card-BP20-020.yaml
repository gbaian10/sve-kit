  - BP20-020
why: X 於打出時指定並須支付相同張數，不能事後把不足的支付改成較小 X；EX 財寶 token 送墓即消去，仍是已支付的一張並貢獻融合計數器。
discriminates: 只數留在墓場的素材則 X=1 變零、X=2 變一；允許不足支付則 X=2 只選一張仍錯誤成功。
