schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP08-028
kind: card
must_pass: true
mechanisms: [分配傷害, 10.6.2.4.2, 10.6.2.4.2.1, 取代效果, 10.6.2.3.2, 好きな枚数]
cards: [BP08-028, BP01-173, SD02-002, BP01-176, BP01-180, BP01-099]
why: >-
  簒奪の舞「相手の場のフォロワーを好きな枚数選ぶ。それに4ダメージを割りふる。相手の墓場が10枚以上なら、代わりに8ダメージ」：
  選 5 體時 4 傷害無法讓每體 ≥1 → 目標選法不合法 → 整張不能打出（Q1070、10.6.2.4.2.1）；墓場 10 張以上時分配的是 8（自我取代先套，10.10.2.5.1）。
discriminates: >-
  允許某目標分配 0 的引擎 B 會 resolved；在分配前不先套「代わりに8」的引擎 C 只能分配 4（4+4 不合法）。
refs:
  rules: [10.6.2.3.2, 10.6.2.4, 10.6.2.4.2, 10.6.2.4.2.1, 10.6.2.4.3, 10.10.2.5.1]
  qa: [Q1070, Q1069]
evidence:
  - ref: Q1070
    quote: いいえ。相手の墓場が9枚の状況で、相手の場のフォロワー5体を目標に選んだ場合、4ダメージを割りふることができないため、『簒奪の舞』をプレイすることができません。（選んだフォロワーには1ダメージ以上を割りふる必要があります。）
  - ref: cr 10.6.2.4.3
    quote: 割り振る値やその割り振り先を置換する効果がある場合、この時点で適用した上で割り振りを実行します。
    derivation:
      - 「代わりに8ダメージ」在分配時就已套用 → 10 張以上時分配 8
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 墓場 9 張：選 2 體分配 3＋1
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 5, P2: 4}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 4, max: 5}
          zones:
            hand:
              - {id: a1, card: BP08-028}          # 簒奪の舞
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 0, max: 5}
          zones:
            field:
              - {id: b1, card: BP01-173}          # ファイター 2/3
              - {id: b2, card: SD02-002}          # レイサム 3/3
              - {id: b3, card: BP01-176}          # 天剣の乙女 4/6
              - {id: b4, card: BP01-173}
              - {id: b5, card: SD02-002}
            cemetery:
              - {id: c1, card: BP01-173}
              - {id: c2, card: BP01-173}
              - {id: c3, card: BP01-173}
              - {id: c4, card: BP01-176}
              - {id: c5, card: BP01-176}
              - {id: c6, card: BP01-176}
              - {id: c7, card: BP01-180}
              - {id: c8, card: BP01-180}
              - {id: c9, card: BP01-180}
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      # 9.3：分配在打出時決定（10.6.2.4）
      - {n: 1, by: P1, at: main, do: play, card: a1, targets: {1: [b1, b2]}, distribute: {1: {b1: 3, b2: 1}}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P2.field: [b2, b3, b4, b5]
          P2.field.b2: {hp: 2}
          P1.pp.current: 0
        events:
          # 同一次「割りふる」造成的傷害同時發生（互驗第二輪修正，astra）
          - {kind: ダメージ, source: a1, target: b1, amount: 3, group: 1}
          - {kind: ダメージ, source: a1, target: b2, amount: 1, group: 1}

  - name: B 選 5 體：4 傷害無法每體 ≥1 → 不能打出
    inherit: A 墓場 9 張：選 2 體分配 3＋1
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, targets: {1: [b1, b2, b3, b4, b5]}, distribute: {1: {b1: 1, b2: 1, b3: 1, b4: 1, b5: 0}}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-play
        assert:
          P1.pp.current: 4
          P1.hand: [a1]
        forbidden_events:
          - {kind: ダメージ}

  - name: C 墓場 10 張：分配的是 8 → 4＋4 打死兩隻
    inherit: A 墓場 9 張：選 2 體分配 3＋1
    setup:
      players:
        P2:
          zones:
            cemetery:
              - {id: c1, card: BP01-173}
              - {id: c2, card: BP01-173}
              - {id: c3, card: BP01-173}
              - {id: c4, card: BP01-176}
              - {id: c5, card: BP01-176}
              - {id: c6, card: BP01-176}
              - {id: c7, card: BP01-180}
              - {id: c8, card: BP01-180}
              - {id: c9, card: BP01-180}
              - {id: c10, card: BP01-099}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, targets: {1: [b1, b2]}, distribute: {1: {b1: 4, b2: 4}}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P2.field: [b3, b4, b5]
          P2.leader.life: 20
        events:
          - {kind: ダメージ, source: a1, target: b1, amount: 4, group: 1}
          - {kind: ダメージ, source: a1, target: b2, amount: 4, group: 1}
