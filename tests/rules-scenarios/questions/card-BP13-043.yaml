schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: card-BP13-043
kind: card
must_pass: false
mechanisms:
  - 奪取、交換、變身
  - 區域移動
  - '5.22'
  - 1.3.4
  - 3.1.2.3
  - 10.7.4.3
  - 8.4.2.1
