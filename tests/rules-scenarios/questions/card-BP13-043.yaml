cards:
  - BP01-173
  - BP02-041
  - BP13-043
  - BP20-073
  - BP04-092
  - SD02-002
  - BP01-180
why: "[astra] 渡す只改 master 不改 owner；從对方場離場時仍回原擁有者區域。\n[fable] 混沌の流儀「各プレイヤーは、自身の場のフォロワー1体を指定し、ターンプレイヤーから順にそれを自身以外のプレイヤーに渡す」： 指定依 1.3.4 回合玩家先、對手看到後再指定（Q1766）；渡す不是新物件（5.22.4）、ファンファーレ不誘發（Q1751、10.7.4.3）； 被渡的從者當回合不能攻擊（Q1755，8.4.2.1）；離場時回擁有者的區域（5.22.5），但ラストワード由現在的主人打出（Q1761）→ 「自分のリーダー」是 P2 的リーダー。"
discriminates: "[astra] 把 master 當 owner 會把 a 放到 P2 的墓場或手牌。\n[fable] 讓兩人同時盲選、或 P2 先選的引擎 awaiting 順序不同；把渡す做成「重新出場」的引擎會誘發ファンファーレ（多出待機）； 允許被渡的從者當回合攻擊的引擎 after-decision-4 會 resolved；LW 由擁有者結算的引擎會讓 P1 而不是 P2 回體力；被破壞的 a1 若進 P2 墓場也錯。"
refs:
  rules:
    - 5.22.3
    - 5.22.5
    - 1.3.4
    - 5.22.2
    - 5.22.4
    - 3.1.2
    - 3.1.2.3
    - 10.7.4.3
    - 8.4.2.1
    - 12.5.3
    - 10.7.7
  qa:
    - Q1747
    - Q1766
    - Q1751
    - Q1755
    - Q1761
evidence:
  - ref: Q1747
    quote: "「渡す」とは自分の場のカードを相手の場へ移動し、そのカードやそのカードの持つ能力を相手が使用することができる能力です。\n渡したフォロワーが場から場以外の領域へ移動する場合、持ち主の領域へ移動します。\n例えば、渡したフォロワーが場から墓場へ移動する場合、持ち主の墓場へ移動します。"
  - ref: cr 5.22.3
    quote: "カードのマスターが変更された場合でも、カードの\nオーナーは変更されません。"
    derivation:
      - 渡す只改 master 不改 owner；從对方場離場時仍回原擁有者區域。
  - ref: cr 5.22.5
    quote: "奪ったまたは渡したカードが場以外の領域に移動\nする場合、そのカードのオーナーの領域に移動しま\nす。"
    derivation:
      - 渡す只改 master 不改 owner；從对方場離場時仍回原擁有者區域。
  - ref: Q1766
    quote: "複数のプレイヤーが同時になんらかの選択を伴う処理を行うよう求められた場合、ターンプレイヤーから先に処理を行います。非ターンプレイヤーは、ターンプレイヤーの処理の内容を知ってから自分の選択を行います。\n以下、処理順です。\n\n①ターンプレイヤーは、自身のフォロワー1体を指定します。\n②非ターンプレイヤーは、自身のフォロワー1体を指定します。（ターンプレイヤーの処理の内容を知ってから自身の選択を行うことができます。）\n③ターンプレイヤーは、指定したフォロワーを自身以外のプレイヤーに渡します。\n④非ターンプレイヤーは、指定したフォロワーを自身以外のプレイヤーに渡します。"
    derivation:
      - 同一句要求雙方各指定；按 Q1766 與 1.3.4 以 P1、P2 兩個輸入點表達。契約 10.7 已明定不同玩家各有一個輸入點；此項不再待裁定。
  - ref: Q1766
    quote: ①ターンプレイヤーは、自身のフォロワー1体を指定します。②非ターンプレイヤーは、自身のフォロワー1体を指定します。（ターンプレイヤーの処理の内容を知ってから自身の選択を行うことができます。）③ターンプレイヤーは、指定したフォロワーを自身以外のプレイヤーに渡します。④非ターンプレイヤーは、指定したフォロワーを自身以外のプレイヤーに渡します。
  - ref: Q1751
    quote: いいえ。誘発しません。
  - ref: Q1755
    quote: いいえ。攻撃することはできません。渡されたフォロワーが【疾走】や【突進】を持っている場合、そのフォロワーは渡されたターンに攻撃することができます。
  - ref: Q1761
    quote: 渡されたフォロワーの《ラストワード》能力は、渡されたプレイヤーがプレイします。
  - ref: cr 5.22.5
    quote: 奪ったまたは渡したカードが場以外の領域に移動する場合、そのカードのオーナーの領域に移動します。
