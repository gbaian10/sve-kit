schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP10-053
kind: card
must_pass: true
mechanisms: [堆疊、土之秘術, 13.3.3.2, 土の秘術_2 計數器須來自同一護符, 可選追加費用, 10.6.2.2.2, 10.4.2.2, 10.6.2.3.3, 9.1.4.4, 自己置換「代わりに」]
cards: [BP10-053, EBD02-T01, BP01-173, BP01-176]
why: >-
  エクステンドマジック「相手の場のフォロワー1体を選ぶ。それに2ダメージ。【土の秘術_2】代わりに4ダメージ。1枚引く」。
  13.3.3.2：土の秘術（数値）＝打出時可選的追加費用「【スタック】を持つあなたの**いずれかのアミュレット**に置かれているスタックカウンターを（数値）個取り除いてよい」，
  計數器要從**同一個**護符取；取到 0 個時由土の秘術的文字把該護符放到墓場（token → 消去）。「取り除いていたら、（テキスト）」的（テキスト）依 10.4.7.1 的段落原則管到段落結尾，所以「1枚引く」也只在付了秘術時才發生（與 Q1302 問句的用法、card-SD08-006 的 Q1373 段落原則一致）。A：一個魔片有 2 個 → 付 → 4 傷害、抽 1、魔片消去。
  B：兩個魔片各 1 個 → 湊不出同一護符的 2 個 → 這個追加費用付不出；寫成從兩個護符各取 1 的決定是非法的 → cannot-play；拒付 → 2 傷害、不抽。
  C：不選付 → 2 傷害、不抽、計數器不動（Q1301「必ず追加コストを支払う必要はありません」）。D：沒有目標 → 即使有計數器也不能打出（Q1302）。
discriminates: >-
  B：允許跨護符湊 2 個的引擎會 resolved 並造成 4 傷害。A：取到 0 個後等 11.7 檢查時點才送墓的引擎，事件順序不同（移動在 解決 之後）；不消去 token 的引擎墓場多一張。
  B／C：不付秘術也抽牌的引擎手牌多 1 張。D：認為有追加費用就能打出的引擎會 resolved。
refs:
  rules: [13.3.3.2, 13.3.3.2.1, 13.3.2.2, 10.4.7, 10.6.2.2.2, 10.6.2.3.1, 10.6.2.3.3, 10.4.2.2, 9.1.4.4, 10.10.2.5]
  qa: [Q1301, Q1302]
evidence:
  - ref: cr 13.3.3.2
    quote: ‘【土の秘術 （数値）】（テキスト）’は‘このカードまたは能力をプレイする際に、追加コストとして、【スタック】を持つあなたのいずれかのアミュレットに置かれているスタックカウンターを（数値）個取り除いてよい。これによりそのアミュレットにスタックカウンターが置かれていない状態になった場合、そのアミュレットを墓場に置く。追加コストとしてスタックカウンターを取り除いていたら、（テキスト）’を意味します。
    derivation:
      - 「いずれかのアミュレットに置かれているスタックカウンターを（数値）個」→ 計數器來自單一護符；（数値）＝2 時該護符至少要有 2 個
      - 「そのアミュレットを墓場に置く」是土の秘術文字本身的處理，發生在費用支付當下，不是 11.7 的規則處理
  - ref: Q1301
    quote: 【土の秘術_2】を持つカードや能力をプレイする場合、追加のコストとして、自分の場のスタックカウンターを2個取り除くことによって、追加の効果を発揮します。追加のコストの支払いによりそのアミュレットにスタックカウンターが置かれていない状態になった場合、そのアミュレットを墓場に置きます。また、自分の場にスタックカウンターがある場合でも、必ず追加コストを支払う必要はありません。
  - ref: Q1302
    quote: いいえ。相手の場のフォロワーを選ぶことができない場合、このスペルをプレイすることができず、【土の秘術_2】を行うこともできません。
  - ref: cr 10.4.2.2
    quote: コストのうち一部または全部を支払うことが不可能である場合、このコストはまったく支払うことはできません。
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: 第三輪交叉驗證 astra-r3/xverify-1、xverify-2（審 fable-r3），fable-r3/fix-1～fix-3 處理後同意
  - by: sol
    method: independent-derivation
    note: 第三輪最後核對（139 局面逐一推導）；F1、F2 與禁止 vs 置換仲裁已依核對結果修正

scenarios:
  - name: A 一個魔片有 2 個計數器 → 付土の秘術_2 → 4 傷害，魔片歸 0 放墓場並消去
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 5, P2: 4}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ウィッチ, life: 20}
          pp: {current: 3, max: 5}
          zones:
            field:
              - {id: s1, card: EBD02-T01, state: {counters: {スタックカウンター: 2}}}
            hand:
              - {id: h1, card: BP10-053}
              - {filler: 1}
            deck:
              - {id: d1, card: BP01-173}
              - {filler: 19}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 5}
          zones:
            field:
              - {id: b1, card: BP01-176}       # 天剣の乙女 4/6
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: h1, targets: {1: [b1]}, optional_costs: {additional: {stack_counter_from: s1}}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 2
          P1.field: []
          P1.cemetery: [h1]
          P2.field.b1: {hp: 2}
          P1.hand: [d1, filler: 1]
        events:
          - {kind: カウンター, object: s1, name: スタックカウンター, delta: -2}
          - {kind: 移動, object: s1, from: P1.field, to: P1.cemetery}
          - {kind: 消去, object: s1, by: rule-9.1.4.4}
          - {kind: 解決, object: h1}
          - {kind: ダメージ, source: h1, target: b1, amount: 4}
          - {kind: 引く, player: P1, object: d1}

  - name: B 兩個魔片各 1 個 → 跨護符取 2 個是非法決定 → cannot-play；拒付則 2 傷害
    inherit: A 一個魔片有 2 個計數器 → 付土の秘術_2 → 4 傷害，魔片歸 0 放墓場並消去
    setup:
      players:
        P1:
          zones:
            field:
              - {id: s1, card: EBD02-T01, state: {counters: {スタックカウンター: 1}}}
              - {id: s2, card: EBD02-T01, state: {counters: {スタックカウンター: 1}}}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: h1, targets: {1: [b1]}, optional_costs: {additional: {stack_counter_from: [s1, s2]}}}
      - {n: 2, by: P1, at: main, do: play, card: h1, targets: {1: [b1]}, optional_costs: {additional: decline}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-play
        assert:
          P1.pp.current: 3
          P1.hand: [h1, filler: 1]
          P1.field.s1: {counters: {スタックカウンター: 1}}
          P1.field.s2: {counters: {スタックカウンター: 1}}
          P2.field.b1: {hp: 6}
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 2
          P1.field: [s1, s2]
          P1.field.s1: {counters: {スタックカウンター: 1}}
          P1.field.s2: {counters: {スタックカウンター: 1}}
          P2.field.b1: {hp: 4}
          P1.hand: [filler: 1]
          P1.deck: [d1, filler: 19]
        events:
          - {kind: ダメージ, source: h1, target: b1, amount: 2}
        forbidden_events:
          - {kind: カウンター}
          - {kind: 引く}

  - name: C 有 2 個計數器但選擇不付 → 2 傷害、計數器不動
    inherit: A 一個魔片有 2 個計數器 → 付土の秘術_2 → 4 傷害，魔片歸 0 放墓場並消去
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: h1, targets: {1: [b1]}, optional_costs: {additional: decline}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 2
          P1.field.s1: {counters: {スタックカウンター: 2}}
          P2.field.b1: {hp: 4}
          P1.hand: [filler: 1]
          P1.deck: [d1, filler: 19]
        events:
          - {kind: ダメージ, source: h1, target: b1, amount: 2}
        forbidden_events:
          - {kind: カウンター}
          - {kind: 引く}

  - name: D 對手沒有從者 → 不能打出，也不能只為了抽牌付土の秘術
    inherit: A 一個魔片有 2 個計數器 → 付土の秘術_2 → 4 傷害，魔片歸 0 放墓場並消去
    setup:
      players:
        P2:
          zones:
            field: []
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: h1, targets: {1: []}, optional_costs: {additional: {stack_counter_from: s1}}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-play
        assert:
          P1.pp.current: 3
          P1.hand: [h1, filler: 1]
          P1.field.s1: {counters: {スタックカウンター: 2}}
        forbidden_events:
          - {kind: 引く}
