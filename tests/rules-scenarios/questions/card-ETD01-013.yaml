id: card-ETD01-013
kind: card
must_pass: true
mechanisms:
  - 查看牌庫上方多步驟
  - 手牌、墓場中有效的能力
  - 效果中的「費用：效果」
cards:
  - BP01-170
  - BP01-173
  - ETD01-013
why: 先抽牌，再由目前手牌選捨棄；捨棄觸發等原入場曲結束後才處理。
discriminates: 用抽牌前手牌選棄或原能力中插入光の道筋會在暫停點出错。
refs:
  rules:
    - 10.6.2.8.2
    - 10.7.1
    - 5.12.1
  qa: []
evidence:
  - ref: cr 10.6.2.8.2
    quote: "プレイしたのがスペルや起動能力や\n自動能力である場合、そのテキストや能力\nに示された効果を、表記の順に従って実行\nします。"
    derivation:
      - 先抽牌，再由目前手牌選捨棄；捨棄觸發等原入場曲結束後才處理。
  - ref: cr 10.7.1
    quote: "自動能力とは、特定の誘発条件が発生したとき\nに、その後に発生したチェックタイミングでプレイされ\nる能力を指します。"
    derivation:
      - 先抽牌，再由目前手牌選捨棄；捨棄觸發等原入場曲結束後才處理。
  - ref: cr 5.12.1
    quote: "カードを‘捨てる’指示がある場合、指定のプレイ\nヤーは自分の手札のカードを指定枚数選択し、それ\nを自分の墓場に移動します。"
    derivation:
      - 先抽牌，再由目前手牌選捨棄；捨棄觸發等原入場曲結束後才處理。
status: verified
author: astra
verified_by:
  - by: fable
    method: independent-derivation
    note: 10.6.2.8.2、10.7.1；xverify-1/result.md〈其他驗過的題目〉
scenarios:
  - name: 捨棄 h
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - id: d
                card: BP01-173
              - id: e
                card: BP01-173
            hand:
              - id: a
                card: ETD01-013
              - id: h
                card: BP01-170
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: a
      - n: 2
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 2
      - n: 3
        by: P1
        at: resolve
        do: resolve-choice
        of:
          decision: 2
          occurrence: 1
        select:
          - h
      - n: 4
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: h
            line: 1
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: paused
        assert:
          P1.hand:
            - h
            - d
          P1.deck:
            - e
        awaiting:
          by: P1
          choices:
            - do: resolve-choice
              select:
                - h
            - do: resolve-choice
              select:
                - d
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P1.hand:
            - d
            - e
          P1.cemetery:
            - h
