schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: card-EBD02-015
kind: card
must_pass: true
mechanisms:
  - 分配傷害
  - 1.3.2
  - 10.6.2.4
  - 10.6.2.4.2
  - 10.6.2.3.2
  - Quick 時點
cards:
  - BP01-173
  - BP01-176
  - EBD02-015
  - SD02-002
why: "[astra] 分配在打出時且先於費用決定；每個已選目標至少分配 1。可以選零體，但選兩體分配 3 加 0 非法。\n[fable] ファイアーチェイン「相手の場のフォロワー2体まで選ぶ。それに3ダメージを割りふる」：分配在打出時決定（10.6.2.4）；每個選中的目標至少 1（Q79、10.6.2.4.2）； 「2体まで」可選 0 體 → 對手沒有從者也能打出（Q78、Q279）。B：分配 3+0 是不合法的目標選法 → 回溯（10.6.2.4.2）。"
discriminates: "[astra] 把分配延後、容許已選目標得到 0，或只驗目標數量的實作會接受 3 加 0；合法 2 加 1 應留下不同體力。\n[fable] 允許 0 分配的引擎 B 會 resolved；不允許 0 目標的引擎 C 會 cannot-play；在結算時才分配（先看傷害結果再決定）的引擎會在 after-decision-1 停下（paused）要求分配，而不是 resolved。"
refs:
  rules:
    - 10.6.2.3.2
    - 10.6.2.4.1
    - 10.6.2.4
    - 10.6.2.4.2
    - 12.3.5
    - 5.14.1
  qa:
    - Q78
    - Q279
    - Q79
evidence:
  - ref: Q78
    quote: はい。0体を選ぶことができます。
  - ref: Q279
    quote: はい。2体まで選ぶとき、0体を選ぶことができるため、プレイすることができます。
  - ref: cr 10.6.2.3.2
    quote: "選ぶ数が「～まで」や「好きな枚数」と\n表記されている場合、0 から指定された数\nまでの間の任意の数を実際に選ぶ数として\n指定します。"
    derivation:
      - 選零目標合法，完全不發生分配傷害。非零分配缺打出時欄位，另列報告，不用結算選擇冒充。
  - ref: cr 10.6.2.4.1
    quote: "目標として選んだ数が 0 である等、割\nり振る先が存在しない場合、割り振りは行\nわず、割り振って行われるべき処理は実行\nされません。"
    derivation:
      - 選零目標合法，完全不發生分配傷害。非零分配缺打出時欄位，另列報告，不用結算選擇冒充。
  - ref: Q79
    quote: いいえ。「割りふる」の場合、選んだフォロワーには少なくとも1以上のダメージを割りふらなければならないため、0ダメージを与えることはできません。
  - ref: cr 10.6.2.4
    quote: "このカードや能力がなんらかの値を割り振\nる場合、その割り振りを決定します。"
    derivation:
      - 先指定目標及非零分配，之後才支付 PP；非法 3 加 0 應整個打出回溯。
  - ref: cr 10.6.2.4.2
    quote: "値の割り振りを決定する際、そのため\nに 10.6.2.3.1 で割り振る先として目標を選ん\nでいる場合、その各目標に対して 1 単位以\n上の割り振りを行う義務があります。これが\n行えない場合、その目標の選び方は不正\nで、ゲームはこの目標を選ぶ前の状態まで\n巻き戻されます。"
    derivation:
      - 先指定目標及非零分配，之後才支付 PP；非法 3 加 0 應整個打出回溯。
  - ref: cr 10.6.2.4.2
    quote: 値の割り振りを決定する際、そのために 10.6.2.3.1 で割り振る先として目標を選んでいる場合、その各目標に対して 1 単位以上の割り振りを行う義務があります。これが行えない場合、その目標の選び方は不正で、ゲームはこの目標を選ぶ前の状態まで巻き戻されます。
