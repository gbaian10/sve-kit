schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP20-SL17
kind: card
must_pass: true
mechanisms: [能力傷害誘發的遞迴鏈, 致命傷害也誘發且在破壞後解決, 10.5.2, 10.7.2.2, 10.7.3.1, 10.7.7, 5.14.3.3, ターンごとに1回]
cards: [BP20-SL17, BP15-066, BP20-P32, BP19-078, BP01-176]
why: >-
  侮蔑の継承者・アジュラフリート 的ファンファーレ「場のフォロワーすべてに1ダメージ」同時打到雙方全部從者（含自己），
  引起 3 個己方「これが能力ダメージを受けたとき」誘發：崇拝者（體力 1 → 致命，Q2005：仍誘發、在破壞處理之後解決）、
  団結者（「自分のターンごとに1回」）、アジュラ 自己。檢查時點依 10.5.2：先規則處理（崇拝者破壞），再由回合玩家 P1 逐一選待機能力結算，
  每結算一個就回到規則處理。崇拝者的 3 傷害破壞對手的深淵の大佐 → 它的ラストワード（非回合玩家 P2 的）要等 P1 的待機全部結算完才輪到（10.5.2.3）；
  P2 用它對アジュラ 造成 3 傷害 → アジュラ 在自己回合再次受能力傷害 → 第二次誘發（沒有次數限制）→ 回到 10.5.2.2。
  B：P2 改打団結者 → 団結者本回合已待機過 1 次 → 依 10.7.2.2 不再待機，PP 最大值只 +1 一次。
discriminates: >-
  不讓致命傷害誘發的引擎：b1 不會受 3 傷害、沒有ラストワード 鏈，b2 體力 4 而非 3。
  在破壞處理前就結算崇拝者的引擎：事件順序是「プレイ能力 a1」在「破壊 a1」之前（本題要求破壊在前）。
  讓 P2 的ラストワード 插在 P1 待機能力之間結算的引擎：after-decision-6 之前就會要求 P2 輸入。
  沒有把「結算中造成的新傷害」再次誘發的引擎：A 的 b2 體力 4 而非 3。把「ターンごとに1回」做成每次誘發都待機的引擎：B 的 PP 最大值 10 而非 9。
refs:
  rules: [10.5.2.1, 10.5.2.2, 10.5.2.3, 10.7.2, 10.7.2.2, 10.7.3.1, 10.7.7, 11.3.1, 5.14.3.3, 12.5.3, 12.8.2]
  qa: [Q2005, Q2658, Q2637]
evidence:
  - ref: Q2658
    quote: はい。誘発します。誘発したこの能力は、体力が0以下になったフォロワーの破壊処理が行われた後に、解決します。
  - ref: Q2637
    quote: フォロワーへの交戦によるダメージとリーダーへの攻撃によるダメージを除く、その他のあらゆるダメージが能力ダメージです。スペルの能力によるダメージやフォロワーの能力によるダメージがこれに該当します。
  - ref: cr 10.5.2.2
    quote: ターンプレイヤーがマスターであるいずれかの自動能力が待機状態になっている場合、ターンプレイヤーはそのうち 1 つを選び、プレイと解決を行い、その後 10.5.2.1 に戻ります。
    derivation: [回合玩家 P1 的 3 個待機全部結算完（每次之間回到規則處理）才進 10.5.2.3 由 P2 結算ラストワード, ラストワード 造成的傷害再誘發アジュラ → 回到 10.5.2.1 → 10.5.2.2 又輪到 P1]
  - ref: cr 10.7.2.2
    quote: ‘ターンごとに（数値）回’という表記を持つ自動能力が誘発条件を満たした場合、この自動能力は最大で、（数値）からこのターン中にこの自動能力が待機状態になった回数を引いた回数まで待機状態になります。
    derivation: [団結者本回合已待機 1 次 → 1 − 1 = 0 → 第二次受傷不待機]
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: A／B：xverify-2/result.md:268〈全部實質核驗局面的索引〉（10.5.2.1、10.5.2.2、Q2005、Q2658）

scenarios:
  - name: A ファンファーレ 全體 1 傷害 → 3 個誘發（含致命的崇拝者）→ 大佐被破壞 → ラストワード 打アジュラ → アジュラ 再誘發
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 8, P2: 7}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 8, max: 8}
          zones:
            field:
              - {id: a1, card: BP15-066, state: {hp: 1}}     # 烈絶の崇拝者 3/3，已受 2 傷害
              - {id: a2, card: BP20-P32}                     # 侮蔑の団結者 3/4
            hand:
              - {id: a3, card: BP20-SL17}                    # 侮蔑の継承者・アジュラフリート 3/5 守護
            deck:
              - {id: d1, card: BP01-176}
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ナイトメア, life: 20}
          pp: {current: 0, max: 7}
          zones:
            field:
              - {id: b1, card: BP19-078}                     # 深淵の大佐 3/3（ラストワード 3 傷害）
              - {id: b2, card: BP01-176}                     # 天剣の乙女 4/6
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a3}
      - {n: 2, by: P1, at: resolve, of: {decision: 1, occurrence: 1}, do: place-acted, object: a3, acted: false}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a3, line: 4}}}
      - {n: 4, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}, targets: {1: [b1]}}
      - {n: 5, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a3, line: 3}}}
      - {n: 6, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a2, line: 1}}}
      - {n: 7, by: P2, at: check-timing, do: choose-pending, pending: {ability: {source: b1, line: 3}}, targets: {1: [a3]}}
      - {n: 8, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a3, line: 3}}}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 4
          P1.field: [a1, a2, a3]
          P1.field.a3: {acted: false}
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a3, line: 4}}}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.field: [a2, a3]
          P1.cemetery: [a1]
          P1.field.a2: {hp: 3}
          P1.field.a3: {hp: 4}
          P2.field.b1: {hp: 2}
          P2.field.b2: {hp: 5}
        events:
          - {kind: ダメージ, source: a3, target: a1, amount: 1, group: g1}
          - {kind: ダメージ, source: a3, target: a2, amount: 1, group: g1}
          - {kind: ダメージ, source: a3, target: a3, amount: 1, group: g1}
          - {kind: ダメージ, source: a3, target: b1, amount: 1, group: g1}
          - {kind: ダメージ, source: a3, target: b2, amount: 1, group: g1}
          - {kind: 破壊, object: a1}
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, line: 2}}}
            - {do: choose-pending, pending: {ability: {source: a3, line: 3}}}
            - {do: choose-pending, pending: {ability: {source: a2, line: 1}}}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P2.field: [b2]
          P2.cemetery: [b1]
        events:
          - {kind: プレイ, ability: {source: a1, line: 2}}
          - {kind: ダメージ, source: a1, target: b1, amount: 3}
          - {kind: 破壊, object: b1}
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a3, line: 3}}}
            - {do: choose-pending, pending: {ability: {source: a2, line: 1}}}
      - at: after-decision-6
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b2: {hp: 4}
          P1.pp: {current: 4, max: 9}
        events:
          - {kind: ダメージ, source: a3, target: b2, amount: 1}
        awaiting:
          by: P2
          choices:
            - {do: choose-pending, pending: {ability: {source: b1, line: 3}}}
      - at: after-decision-7
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a3: {hp: 1}
        events:
          - {kind: ダメージ, source: b1, target: a3, amount: 3}
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a3, line: 3}}}
      - at: after-decision-8
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b2: {hp: 3}
          P1.field: [a2, a3]
          P1.field.a2: {hp: 3}
          P1.field.a3: {hp: 1}
          P1.pp: {current: 4, max: 9}
          semantic_state.pending_triggers: []
        events:
          - {kind: ダメージ, source: a3, target: b2, amount: 1}

  - name: B ラストワード 改打団結者 → 它被破壞；本回合已待機過 1 次 → 不再誘發，PP 最大值只 +1 一次
    inherit: A ファンファーレ 全體 1 傷害 → 3 個誘發（含致命的崇拝者）→ 大佐被破壞 → ラストワード 打アジュラ → アジュラ 再誘發
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a3}
      - {n: 2, by: P1, at: resolve, of: {decision: 1, occurrence: 1}, do: place-acted, object: a3, acted: false}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a3, line: 4}}}
      - {n: 4, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}, targets: {1: [b1]}}
      - {n: 5, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a3, line: 3}}}
      - {n: 6, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a2, line: 1}}}
      - {n: 7, by: P2, at: check-timing, do: choose-pending, pending: {ability: {source: b1, line: 3}}, targets: {1: [a2]}}
    random: {}
    expected:
      - at: after-decision-6
        view: omniscient
        outcome: resolved
        assert:
          P1.pp: {current: 4, max: 9}
          P2.field.b2: {hp: 4}
      - at: after-decision-7
        view: omniscient
        outcome: resolved
        assert:
          P1.field: [a3]
          P1.cemetery: [a1, a2]
          P1.field.a3: {hp: 4}
          P1.pp: {current: 4, max: 9}
          P2.field.b2: {hp: 4}
          semantic_state.pending_triggers: []
        events:
          - {kind: ダメージ, source: b1, target: a2, amount: 3}
          - {kind: 破壊, object: a2}
        forbidden_events:
          - {kind: プレイ, ability: {source: a2, line: 1}}
          - {kind: 待機, ability: {source: a2, line: 1}}
