why: "[astra] 沒有守護選擇與結束時待機的場面，結束主階段後到非回合玩家 Quick；它能打出法術。\n[fable] 結束階段的順序是規則寫死的：7.4.1「エンドフェイズが来たとき」誘發（マゼルベイン：手牌 0 枚 → 兩段都做，Q761）→ 7.4.2 檢查時點 → 7.4.3 回合玩家選守護アクト → 7.4.5 非回合玩家クイック時點（リリエル的 {Q}{起動}：アクト → 相手リーダー 2 傷害）→ 7.4.6 檢查時點 → 回到 7.4.5 → 7.4.7 手牌上限。 下一回合開始階段 7.2.3 リリエル站起。互驗修正（astra）：P2 場上的リリエル「自分のリーダーは能力によるダメージを受けない」， マゼルベイン對リーダー的 3 傷害是能力傷害（Q772）→ 被擋、P2 保持 20；對從者的 3 傷害照常，リリエル自己 5 → 2。"
discriminates: "[astra] 跳過整個結束 Quick 會錯過殺掉來源並扣費的狀態。\n[fable] 把クイック時點放在結束時誘發之前的引擎，b1 受傷與 b1 起動的先後（after-decision-2 與 after-decision-4 的事件）相反；沒有 7.4.3 這一步的引擎不會讓 a2 變アクト； 在 7.4.6 之後不回到 7.4.5 的引擎不會再問 P2 一次（after-decision-4 的 awaiting 應該仍是 P2 的 pass）； 把リーダー傷害算成非能力傷害的引擎 P2 體力 17；下回合沒有 7.2.3 的引擎，b1 仍是アクト。"
