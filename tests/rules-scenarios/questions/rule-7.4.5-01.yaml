evidence:
  - ref: cr 7.4.5
    quote: "非ターンプレイヤーは、以下のいずれかを実行しま\nす。\n* 手札か EX エリアの【クイック】を持つカードを 1 枚\nプレイする（10.6）。\n* 【クイック】を持つ起動能力を 1 つプレイする。\n* 何もしない。"
    derivation:
      - 沒有守護選擇與結束時待機的場面，結束主階段後到非回合玩家 Quick；它能打出法術。
  - ref: cr 7.4.6
    quote: "7.4.5 でカードまたは能力をプレイした場合、チェック\nタイミングが発生し、その後再び 7.4.5 に戻ります。"
    derivation:
      - 沒有守護選擇與結束時待機的場面，結束主階段後到非回合玩家 Quick；它能打出法術。
  - ref: contract 10.1
    quote: 沒有候選時不是輸入點
    derivation:
      - P1 場上沒有直立守護；7.4.3 不停住，直接由 P2 在 7.4.5 打出 Quick。
  - ref: cr 7.4.3
    quote: ターンプレイヤーは、自分のフォロワーのうち【守護】を持っているものを望む数選択し、それらをアクトします。
  - ref: cr 7.4.5
    quote: 非ターンプレイヤーは、以下のいずれかを実行します。* 手札か EX エリアの【クイック】を持つカードを 1 枚プレイする（10.6）。* 【クイック】を持つ起動能力を 1 つプレイする。* 何もしない。
  - ref: cr 7.4.6
    quote: 7.4.5 でカードまたは能力をプレイした場合、チェックタイミングが発生し、その後再び 7.4.5 に戻ります。
  - ref: cr 7.2.3
    quote: ターンプレイヤーは、自身の場にあるカードをすべてスタンドします。
  - ref: Q761
    quote: はい。両方とも処理を行います。
    derivation:
      - 本題手牌 0 張 → 「2枚以下」與「0枚」都成立 → リーダー 3 傷害與フォロワーすべて 3 傷害都處理
  - ref: Q772
    quote: 「能力によるダメージ」とは、フォロワー同士の交戦によってお互いに与える交戦ダメージや攻撃ダメージを除くあらゆるダメージです。
    derivation:
      - マゼルベイン的結束時 3 傷害是能力傷害 → リリエル「自分のリーダーは能力によるダメージを受けない」→ 不發生（1.3.3 禁止優先）
      - 「相手の場のフォロワーすべてに3ダメージ」不是對リーダー → 照常，リリエル 5 → 2，仍在場、起動能力仍可用
