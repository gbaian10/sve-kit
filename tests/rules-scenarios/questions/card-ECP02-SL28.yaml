schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-ECP02-SL28
kind: card
must_pass: true
mechanisms: [封箱、操縱、變成種類, '5.25', 12.2.4, '12.17', 進化卡自身的能力, 超進化時與進化時同時誘發, 10.1.1.2.2, 5.14.1.2]
cards: [ECP02-SL28, ECP02-SL29, CP02-068, BP04-092, BP01-180, BP01-173]
why: >-
  超進化（12.2.4）：先攻第 7 回合起可額外付 SEP 1 → 進化後 +1/+1，「進化した」與「超進化した」都發生 → 【進化時】與【超進化時】同時待機、自選順序（Q2153、Q2152）。
  【超進化時】把對手從者「アミュレットにする」（5.25）：種類變護符但能力不變（Q2202）；不能攻擊、不能被攻擊、不受傷害（Q2201）；
  攻擊力體力保持但不可參照（Q2200）；守護不再強制目標（Q2193）。【進化時】的「手札のデレマス・カード1枚を捨てる：」是打出費用（10.1.1.2.2）。
discriminates: >-
  沒有超進化的引擎 a1 是 3/3 而非 4/4、只誘發一個能力；把「アミュレットにする」做成失去能力或移出場的引擎，b1 不在場或事件不同；
  把護符仍當守護擋攻擊的引擎 after-decision-4 會 cannot-attack；エンジェルバレッジ對變成護符的 b1 造成傷害的引擎違反 5.14.1.2。
refs:
  rules: [12.2.4, 12.2.4.1, 12.2.4.2, 12.17.2, 12.6.2, 10.7.3.1, 5.25.1, 5.25.2, 5.25.2.1, 5.25.3, 5.14.1.2, 12.8.2, 8.4.2.1, 8.4.3.1, 10.1.1.2.2]
  qa: [Q2153, Q2152, Q2201, Q2202, Q2200, Q2193]
evidence:
  - ref: cr 12.2.4
    quote: 進化能力をプレイする際、現在の経過ターン数（3.3）が、先攻プレイヤーであるなら 7 以上、後攻プレイヤーであるなら 6 以上の場合、そのプレイヤーは追加で SEP（3.2.6）を 1 点支払うことができます。
  - ref: Q2153
    quote: はい。【超進化時】能力だけではなく、【進化時】能力も誘発します。また誘発した2つの能力は任意の順番で解決することができます。
  - ref: Q2201
    quote: いいえ。アミュレットなので攻撃することができません。また、攻撃されることもなく、ダメージを受けることもありません。
  - ref: Q2193
    quote: いいえ。アミュレットになったフォロワーに攻撃することはできないため、攻撃目標にする必要はありません。
  - ref: cr 5.14.1.2
    quote: フォロワーでもリーダーでもないカードに対してダメージを与える指示がある場合、それは与えられません。
status: verified
