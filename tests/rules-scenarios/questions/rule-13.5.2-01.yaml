id: rule-13.5.2-01
kind: rule
must_pass: true
mechanisms:
  - 連擊、覺醒、真紅
  - 本回合歷史
  - 持續效果與禁止
cards:
  - BP01-125
  - BP01-176
  - BP04-SL16
  - BP05-108
why: 真紅要求實際體力下降；被防護阻止的自傷不算，後續ハウリング只有 4 傷害。
discriminates: 只要見到自傷指令就標真紅，保護分支會誤把 b 殺死。
refs:
  rules:
    - 13.5.2.2
    - 1.3.3
  qa:
    - Q780
evidence:
  - ref: Q780
    quote: "いいえ。【真紅】状態も「このターン中に自分のリーダーの体力が減少した」も満たしません。\n【真紅】状態とは、現在が自分のターンで、その自分のターン中に自分のリーダーの体力が減少したことがあったことを満たす状態です。"
  - ref: cr 13.5.2.2
    quote: "‘【真紅】状態’とは‘現在があなたのターン\n中で、このターン中にあなたのリーダーの体力\nが減少したことがあった’を意味します。\n14. タイトル別の情報やキーワード"
    derivation:
      - 真紅要求實際體力下降；被防護阻止的自傷不算，後續ハウリング只有 4 傷害。
  - ref: cr 1.3.3
    quote: "あるカードの効果によりプレイヤーがなんらかの行\n動を行うよう指示された場合に、同時にその行動を\n禁止する効果が発生している場合、常に禁止する\n効果が優先されます。"
    derivation:
      - 真紅要求實際體力下降；被防護阻止的自傷不算，後續ハウリング只有 4 傷害。
status: verified
author: astra
verified_by:
