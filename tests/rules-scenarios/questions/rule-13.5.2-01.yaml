            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: b
                card: BP01-176
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: s
        targets:
          1:
            - P2.leader
      - n: 2
        by: P1
        at: main
        do: play
        card: a
      - n: 3
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 2
        targets:
          1:
            - b
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.leader.life: 18
          P2.leader.life: 17
          P2.field: []
          P2.cemetery:
            - b
