schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: card-BP20-P61
kind: card
must_pass: true
mechanisms:
  - 9.1.4.2
  - 9.1.4.4
  - 10.6.2.8.2
cards:
  - BP01-173
  - BP20-P61
why: 返戻加到8時，紋章消滅並立即在消滅區消去，後續搜尋仍要完成；7時不搜尋。
discriminates: 把消滅當終止整段會漏搜尋；把token留在消滅區會有殘留；條件只管自毀而未管搜尋會在7時多搜尋。
refs:
  rules:
    - 9.1.4.2
    - 9.1.4.4
    - 10.6.2.8.2
  qa: []
evidence:
  - ref: cr 9.1.4.2
    quote: 種類がクレストであるトークンは、EX エリアでのみ存在できます。
  - ref: cr 9.1.4.4
    quote: あるトークンが存在できる領域以外の領域に移動した場合、その移動を行った直後に、その領域で消去されます。この処理はチェックタイミングを待たず、なんらかの効果の途中で移動を行った場合は、その移動の続きを行うよりも前に実行されます。
  - ref: cr 10.6.2.8.2
    quote: プレイしたのがスペルや起動能力や自動能力である場合、そのテキストや能力に示された効果を、表記の順に従って実行します。
  - ref: BP20-P61
    quote: 自分のメインフェイズが来たときか自分の財宝・カードを融合したときか自分が財宝・カードをプレイしたとき、これに返戻カウンター1個を置く。これの返戻カウンターが8個以上なら、これは消滅する。自分のデッキから盗賊・カード1枚を探し、手札に加える。
status: verified
author: astra
verified_by:
  - by: fable
    method: independent-derivation
    note: 9.1.4.2／9.1.4.4、5.8.2、「なら」管到段尾（Q1373 慣例）；xverify-2/result.md〈補題〉2/2
