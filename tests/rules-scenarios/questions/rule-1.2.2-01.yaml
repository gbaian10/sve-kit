schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: rule-1.2.2-01
kind: rule
must_pass: true
mechanisms: [1.2.2, 11.2.1, 11.2.2, 10.5.2.1, 5.10.1.1, 和局, 牌庫抽空, 額外回合、跳過、勝利]
cards: [BP12-079, BP15-064, BP01-173]
why: >-
  規則處理在檢查時點同時執行（10.5.2.1）：A 紅のワルツ【1】讓雙方リーダー在同一次結算中都歸 0 → 11.2.1 對兩人同時成立 → 1.2.2 和局。
  B 對照：只有 P2 歸 0 → P1 勝。C：灯火の烈絶 讓 P2 歸 0（11.2.1）並讓 P1 在牌庫 0 張時抽牌（5.10.1.1 → 11.2.2），兩種敗北條件在同一次規則處理 → 和局。
discriminates: >-
  逐一判定敗北、先判到誰就結束的引擎會得到 winner P1 或 P2 而不是和局；A 中在 P2 歸 0 的瞬間就結束遊戲（不等自傷）的引擎 P1 體力仍是 1。
refs:
  rules: [1.2.1, 1.2.1.1, 1.2.1.2, 1.2.2, 10.5.2.1, 11.1.3, 11.2.1, 11.2.2, 5.10.1.1]
  qa: []
evidence:
  - ref: cr 1.2.2
    quote: すべてのプレイヤーが同時に敗北する場合、そのゲームは引き分けになります。
  - ref: cr 10.5.2.1
    quote: 現在処理を行うべきルール処理すべてを同時に実行します。
    derivation:
      - 檢查時點：P1 與 P2 的 11.2.1（或 P1 的 11.2.2 與 P2 的 11.2.1）同時成立 → 同時敗北 → 1.2.2
  - ref: cr 5.10.1.1
    quote: この指示の実行の際に、そのプレイヤーのデッキ置き場にカードがない場合、そのプレイヤーは次のルール処理でゲームに敗北します（11.2.2）。
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 雙方リーダー在同一次結算歸 0 → 和局
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 9, P2: 8}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ナイトメア, life: 1}
          pp: {current: 1, max: 9}
          zones:
            hand:
              - {id: w1, card: BP12-079}          # 紅のワルツ（コスト1）
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 2}
          pp: {current: 0, max: 9}
          zones:
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: w1, options: [1]}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: game-end
        assert:
          P1.leader.life: 0
          P2.leader.life: 0
          game: {ended: true, winner: null, by: 1.2.2}
        events:
          - {kind: ダメージ, source: w1, target: P2.leader, amount: 2}
          - {kind: ダメージ, source: w1, target: P1.leader, amount: 1}
          - {kind: 敗北, player: P1, by: rule-11.2.1, group: 1}
          - {kind: 敗北, player: P2, by: rule-11.2.1, group: 1}

  - name: B 對照：只有 P2 歸 0 → P1 勝
    inherit: A 雙方リーダー在同一次結算歸 0 → 和局
    setup:
      players:
        P1:
          leader: {class: ナイトメア, life: 2}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: w1, options: [1]}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: game-end
        assert:
          P1.leader.life: 1
          P2.leader.life: 0
          game: {ended: true, winner: P1, by: 11.2.1}
        events:
          - {kind: 敗北, player: P2, by: rule-11.2.1}
        forbidden_events:
          - {kind: 敗北, player: P1}

  - name: C P2 體力歸 0（11.2.1）與 P1 空牌庫抽牌（11.2.2）在同一次規則處理 → 和局
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 9, P2: 8}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 1, max: 9}
          zones:
            field:
              - {id: a2, card: BP01-173}          # 灯火の烈絶 的己方目標
            hand:
              - {id: s1, card: BP15-064}          # 灯火の烈絶（コスト1）
            deck: []
        P2:
          construction: class
          leader: {class: ロイヤル, life: 1}
          pp: {current: 0, max: 9}
          zones:
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: s1, targets: {1: [a2]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: game-end
        assert:
          P1.field.a2: {hp: 2}
          P2.leader.life: 0
          P1.hand: []
          P1.deck: []
          game: {ended: true, winner: null, by: 1.2.2}
        events:
          - {kind: ダメージ, source: s1, target: a2, amount: 1}
          - {kind: ダメージ, source: s1, target: P2.leader, amount: 1}
          - {kind: 敗北, player: P2, by: rule-11.2.1, group: 1}
          - {kind: 敗北, player: P1, by: rule-11.2.2, group: 1}
