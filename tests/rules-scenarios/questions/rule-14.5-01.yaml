schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: rule-14.5-01
kind: rule
must_pass: true
mechanisms: [14.5.2, 14.5.2.4, 11.11.1, 5.14.2, 1.3.2.2, 公主連結：UB、裝備, 取代效果]
cards: [CP04-019, CP04-T02, BP01-173, BP20-073]
why: >-
  イクイップメント token 只存在於イクイップメント領域並關聯到從者（14.5.2）。プリンセスソード「与えるダメージを+2」「受けるダメージを-2」都是取代效果（5.14.2）。
  A：裝備者攻擊 2/3 的ファイター：造成 3+2=5；受 2−2=0 → 傷害行動不存在（1.3.2.2、Q2496 邏輯）。
  互驗第二輪修正（astra）：C／C2 打出的ペコリーヌ 有【守護】，放上場時要問 place-acted（12.8.2、契約 9.2）；token 放到裝備區依契約 10.8 用 移動 事件。
  B：裝備者離場 → 關聯消失（14.5.2.4）→ 檢查時點 11.11.1 消去 token。C：ペコリーヌ的ファンファーレ（{コスト2}）建立並裝備新的プリンセスソード。
discriminates: >-
  A：發出 amount 0 的ダメージ事件、或沒套 +2 的引擎（b1 體力剩 0 以外的值）。B：把裝備留在領域的引擎 P1.equipment 不為空。
  C：把 {コスト2} 當結算時可選費用的引擎在 PP 不足時仍會裝備。
refs:
  rules: [14.5.2.1.2, 14.5.2.2, 14.5.2.2.2, 14.5.2.4, 11.11.1, 5.14.2, 10.2.1.3.2, 1.3.2.2, 8.4.9.1, 10.1.1.2.2, 9.1.3.1]
  qa: [Q2494, Q2495, Q2496, Q2498]
evidence:
  - ref: Q2495
    quote: そのフォロワーが交戦して与えるダメージや、能力によって与えるダメージが+2されます。
  - ref: Q2498
    quote: >-
      ①「受けるダメージを-1」→「与えるダメージを+2」…0ダメージを与える行動は全く行われなくなるため、ダメージを与えるという行動自体が存在しなくなります。
    derivation:
      - 本題 b1 攻擊力 2、裝備者受 −2 → 0 → 傷害不存在（只有一個取代效果，沒有順序問題）
  - ref: cr 14.5.2.4
    quote: トークンを装備しているフォロワーが場から場以外の領域に移動した場合、そのフォロワーとそのフォロワーが装備しているトークンとの関連付けは失われます。
  - ref: cr 11.11.1
    quote: イクイップメント領域のトークンが場のいずれのカードとも関連付けされていない場合、そのトークンを消去（9.1.3）します。
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: A／B：xverify-1/result.md:126〈其他驗過的題目〉（11.11.1、10.1.1.2.2、Q2494–Q2496）；C／C2：xverify-2/recheck.md:103〈全部改動局面的核對索引〉

scenarios:
  - name: A 裝備プリンセスソード的ペコリーヌ攻擊ファイター：造成 5、受 0
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 5, P2: 4}, phase: main}
      history: none
      players:
        P1:
          construction: title
          title: プリンセスコネクト！Re:Dive
          leader: {class: ロイヤル, life: 20}
          pp: {current: 5, max: 5}
          zones:
            field:
              - {id: a1, card: CP04-019}          # ペコリーヌ 3/3【守護】
            equipment:
              - {id: e1, card: CP04-T02, state: {equipped_to: a1}}   # プリンセスソード
            hand:
              - {filler: 2}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 4, max: 5}
          zones:
            field:
              - {id: b1, card: BP01-173, state: {acted: true}}   # ファイター 2/3
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: attack, attacker: a1, target: b1}
      - {n: 2, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.field: []
          P2.cemetery: [b1]
          P1.field.a1: {hp: 3, acted: true}
          P1.equipment: [e1]
        events:
          - {kind: ダメージ, source: a1, target: b1, amount: 5}
          - {kind: 破壊, object: b1}
        forbidden_events:
          - {kind: ダメージ, target: a1}

  - name: B 裝備者被破壞 → 關聯消失 → 檢查時點消去 token
    inherit: A 裝備プリンセスソード的ペコリーヌ攻擊ファイター：造成 5、受 0
    setup:
      turn: {active: P2, first_player: P1, elapsed_turns: {P1: 5, P2: 5}, phase: main}
      players:
        P2:
          zones:
            hand:
              - {id: b2, card: BP20-073}          # サンダーレイジ 6 ダメージ → −2 → 4 ≥ 3
    decisions:
      - {n: 1, by: P2, at: main, do: play, card: b2, targets: {1: [a1]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.field: []
          P1.cemetery: [a1]
          P1.equipment: []
          P2.leader.life: 20
        events:
          - {kind: ダメージ, source: b2, target: a1, amount: 4}
          - {kind: 破壊, object: a1, by: rule-11.3.1}
          - {kind: 消去, object: e1}

  - name: C ペコリーヌ的ファンファーレ {コスト2}：付費裝備新的プリンセスソード；PP 不足則取消
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 5, P2: 4}, phase: main}
      history: none
      players:
        P1:
          construction: title
          title: プリンセスコネクト！Re:Dive
          leader: {class: ロイヤル, life: 20}
          pp: {current: 5, max: 5}
          zones:
            hand:
              - {id: a1, card: CP04-019}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 0, max: 5}
          zones:
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
      # 12.8.2：ペコリーヌ 有【守護】→ 放上場時選直立／アクト（9.2 place-acted，屬決定 1 的結算）
      - {n: 2, by: P1, at: resolve, of: {decision: 1, occurrence: 1}, do: place-acted, object: a1, acted: false}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 3}}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: paused
        awaiting:
          by: P1
          choices:
            - {do: place-acted, object: a1, acted: false}
            - {do: place-acted, object: a1, acted: true}
        assert:
          P1.pp.current: 2
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, line: 3}}, costs: decline}
            - {do: choose-pending, pending: {ability: {source: a1, line: 3}}}
        assert:
          P1.field: [a1]
          P1.field.a1: {acted: false}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P1.field: [a1]
          P1.equipment: [new-1]
          P1.equipment.new-1: {name: プリンセスソード, equipped_to: a1}
        events:
          - {kind: 費用成立, ability: {source: a1, line: 3}}
          - {kind: プレイ, ability: {source: a1, line: 3}}
          # 契約 10.8：新建物件放到場以外的區域用 移動
          - {kind: 移動, object: new-1, to: P1.equipment}

  - name: C2 PP 只有 3 → 打出後 PP 0 → ファンファーレ費用付不出 → 待機取消
    inherit: C ペコリーヌ的ファンファーレ {コスト2}：付費裝備新的プリンセスソード；PP 不足則取消
    setup:
      players:
        P1:
          pp: {current: 3, max: 5}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
      - {n: 2, by: P1, at: resolve, of: {decision: 1, occurrence: 1}, do: place-acted, object: a1, acted: false}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 3}}}
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: pending-cancelled
        assert:
          P1.pp.current: 0
          P1.equipment: []
        forbidden_events:
          - {kind: 移動, to: P1.equipment}
