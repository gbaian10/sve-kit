schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-SP01-U23
kind: card
must_pass: true
mechanisms: [本回合歷史, 10.4.7.1, '5.27', 搜尋有條件, 5.8.1.2]
cards: [SP01-U23, BP19-095, BP01-173, BP01-176]
why: >-
  砂浜の調べ・リテュエル「このターン、自分のリーダーの{体力}を+4以上していたなら、それを破壊する。1枚引く」：條件是**本回合的歷史**（累計 +4 以上，Q1614），
  不成立時「以降の効果は働かず」連抽牌也沒有（Q1611，與 BP20-P12 同一種管轄範圍）。本題先用希望の女王・リテュエル的ファンファーレ +4（搜尋可以選擇不找到），再打出砂浜。
  依契約 10 第 1 點：希望の女王・リテュエル 有【守護】，打出放上場時要問 place-acted（12.8.2、9.2）。
discriminates: >-
  沒有記錄本回合體力增加量的引擎在 A 不會破壞 b1；把「していたなら」只管到「破壊する」的引擎在 B 會多抽 1 張；
  搜尋時把「找不到」當成不合法的引擎在 A 會卡住。
refs:
  rules: [10.4.7.1, 5.27.1, 5.8.1.2, 5.8.2, 10.6.2.3.1, 12.4.3]
  qa: [Q1611, Q1612, Q1614]
evidence:
  - ref: Q1614
    quote: はい。満たします。
    derivation:
      - 「+1」與「+3」累計 +4 也算；本題用單次 +4
  - ref: Q1611
    quote: いいえ。自分のリーダーの体力を+4以上していない場合、それ以降の効果は働かず、1枚引くことができません。
  - ref: cr 5.8.1.2
    quote: 特定条件に枚数以外の条件がある場合、それを見つけた後に、そのカードが条件を満たすことを相手に示します。
    derivation:
      - 條件含「元のコスト1の信仰・フォロワー」→ 可以找不到（4.1.2.2）
status: verified
author: fable
verified_by:
  - by: astra
    method: qa
    note: A：xverify-2/final.md:10〈追加修正最後確認〉；B：xverify-1/result.md:113〈其他驗過的題目〉（5.8、10.4.7.1、Q1611、Q1614）

scenarios:
  - name: A 先 +4 再打出 → 破壞目標並抽 1 張
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 5, P2: 4}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ビショップ, life: 15}
          pp: {current: 5, max: 5}
          zones:
            hand:
              - {id: a1, card: BP19-095}          # 希望の女王・リテュエル（コスト4：探す＋体力+4）
              - {id: a2, card: SP01-U23}          # 砂浜の調べ・リテュエル（コスト1）
            deck:
              - {id: d1, card: BP01-173}
              - {id: d2, card: BP01-176}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 5}
          zones:
            field:
              - {id: b1, card: BP01-173}
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
      # 12.8.2：リテュエル 有【守護】→ 放上場時選直立／アクト（9.2 place-acted，屬決定 1 的結算）
      - {n: 2, by: P1, at: resolve, of: {decision: 1, occurrence: 1}, do: place-acted, object: a1, acted: false}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}}
      - {n: 4, by: P1, at: resolve, of: {decision: 3, occurrence: 1}, do: resolve-choice, select: []}
      - {n: 5, by: P1, at: main, do: play, card: a2}
      - {n: 6, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a2, line: 1}}, targets: {1: [b1]}}
    random:
      shuffles:
        - {player: P1, zone: deck, result: [d2, d1]}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: paused
        awaiting:
          by: P1
          choices:
            - {do: place-acted, object: a1, acted: false}
            - {do: place-acted, object: a1, acted: true}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P1.leader.life: 19
          P1.pp.current: 1
          P1.deck: [d2, d1]
          P1.field: [a1]
        events:
          - {kind: 体力増加, target: P1.leader, amount: 4}
        forbidden_events:
          - {kind: 公開, to: P2}    # 只禁止搜尋結果的出示；與 card-BP17-044 A 寫法一致
      - at: after-decision-6
        view: omniscient
        outcome: resolved
        assert:
          P2.field: []
          P2.cemetery: [b1]
          P1.hand: [d2]
          P1.pp.current: 0
        events:
          - {kind: 破壊, object: b1}
          - {kind: 引く, player: P1, object: d2}

  - name: B 本回合沒有 +4 → 不破壞、也不抽（以降の効果は働かず）
    inherit: A 先 +4 再打出 → 破壞目標並抽 1 張
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a2}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a2, line: 1}}, targets: {1: [b1]}}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.field: [b1]
          P1.hand: [a1]
          P1.deck: [d1, d2]
          P1.pp.current: 4
        events:
          - {kind: プレイ, ability: {source: a2, line: 1}}
        forbidden_events:
          - {kind: 破壊}
          - {kind: 引く}
