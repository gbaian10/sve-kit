why: "[astra] 雙方各兩個謝幕曲已同時待機，先處理 P1 的兩個；P2 第一個謝幕曲破壞 P1 第三隻兔子，使 P1 新待機優先於 P2 第二個。以 explicit 固定檢查時點入口，不要求適配器猜出上一個清場效果；離場來源仍以實體卡代號參照。\n[fable] 回合玩家 P1 用エンジェルバレッジ同時破壞非回合玩家 P2 的サロメ與デモンビーター（兩個ラストワード待機，P2）。 P2 先結算サロメ（2 傷害給アウトローガンナー）→ 回到 10.5.2.1 → 規則處理破壞アウトローガンナー → 回合玩家 P1 產生新的待機 → 依 10.5.2.2 下一個先處理 P1 的，不是 P2 剩下的デモンビーター。用 P2 リーダー體力 1 讓順序變成勝負：正確順序下 P1 的 2 傷害先落地 → 11.2.1 敗北， デモンビーター的 +1 永遠來不及。局面 B 是 P2 選另一個合法順序（先デモンビーター）→ 存活。"
discriminates: "[astra] FIFO 或雙方輪流的實作會在 after-decision-1 或 3 提供錯誤的待機玩家／來源。\n[fable] 「雙方輪流」或「非回合玩家把自己的待機全部處理完才換人」的實作，局面 A 會讓 P2 以體力 1 存活（+1 先於 −2）、遊戲不結束； 只比最終體力的話加減法可交換，所以用敗北處理當觀察點。局面 B 驗證 P2 的順序選擇是合法且結果不同。"
refs:
  rules:
    - 10.5.2.1
    - 10.5.2.2
    - 10.5.2.3
    - 10.7.2
    - 10.7.3.1
    - 12.5.3
