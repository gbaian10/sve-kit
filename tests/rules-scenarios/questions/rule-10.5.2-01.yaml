evidence:
  - ref: cr 10.5.2.2
    quote: ターンプレイヤーはそのうち 1 つを選び、プレイと解決を行い、その後 10.5.2.1 に戻ります。
    derivation:
      - 最初 P1 的 a1、a2 與 P2 的 b1、b2 同時待機；由 P1 選 a1，再選 a2，不能交替處理 P2。
  - ref: cr 10.5.2.3
    quote: 非ターンプレイヤーはそのうち 1 つを選び、プレイと解決を行い、その後 10.5.2.1 に戻ります。
    derivation:
      - P1 無待機後，P2 選 b1，打出時選 a3，結算造成 3 傷害。
      - 回 .1，a3 體力歸零，依 11.3.1 破壞；12.5.3 與 10.7.2 使 a3 謝幕曲待機。
      - 再檢查 .2，此時 P1 有 a3；必須先結算 a3，之後才能處理 b2。
      - 三次兔子謝幕曲共使雙方各失去 6 體力；b2 最後選 a4，a4 受 3 傷害仍存活。
  - ref: cr 12.5.3
    quote: このカードを場から墓場に置いたとき、（テキスト）
    derivation:
      - a1、a2、b1、b2 初始已離場；a3 在 b1 結算後才因規則處理離場，屬不同事件。
  - ref: cr 10.5.2.2
    quote: ターンプレイヤーがマスターであるいずれかの自動能力が待機状態になっている場合、ターンプレイヤーはそのうち 1 つを選び、プレイと解決を行い、その後 10.5.2.1 に戻ります。
  - ref: cr 10.5.2.3
    quote: 非ターンプレイヤーがマスターであるいずれかの自動能力が待機状態になっている場合、非ターンプレイヤーはそのうち 1 つを選び、プレイと解決を行い、その後 10.5.2.1 に戻ります。
    derivation:
      - 每結算一個都「10.5.2.1 に戻ります」，回到 10.5.2.1 後下一步一定是 10.5.2.2（先查回合玩家），不是接著 10.5.2.3
      - P2 結算サロメ後：10.5.2.1 破壞 a2 → a2 的ラストワード待機（P1 是 master）→ 10.5.2.2 命中 → P1 先打出
      - P1 結算後回到 10.5.2.1：P2 リーダー體力 0 → 11.2.1 P2 敗北 → 1.2.1 遊戲立即結束；デモンビーター的待機不再被處理
  - ref: cr 10.7.3.1
    quote: 待機状態の自動能力のプレイは強制で、プレイしないことを選択することはできません。ただし、自身がマスターである自動能力が複数待機している場合、そのうちのどれを先にプレイするかを選ぶことは可能です。
  - ref: cr 11.2.1
    quote: 自身のリーダーの体力が 0 以下であるプレイヤーがいる場合、そのプレイヤーはこのゲームに敗北します。
  - ref: cr 1.2.1
    quote: いずれかのプレイヤーが敗北した場合、ゲームはその時点で終了します。
  - ref: Q1110
    quote: 相手の場のフォロワーを選ぶことができないので、このフォロワーの《ファンファーレ》能力や《ラストワード》能力をプレイすることができず、自分のリーダーの体力を+1することができません。
    derivation:
      - 佐證サロメ的ラストワード在打出時必須選到目標；本題 P1 場上有 a1、a2 可選
  - ref: cr 10.6.2.8.3
    quote: この時点で解決領域にカードや能力が残っている場合、それがカードならオーナーの墓場に移動し
    derivation:
      - エンジェルバレッジ結算完就進墓場，after-decision-1 起 P1.cemetery 含 a3
