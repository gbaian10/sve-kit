                card: CP03-127
          title: カードファイト!! ヴァンガード
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 0
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - id: bd
                card: BP01-173
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: activate
        ability:
          source: a
          line: 1
        costs:
          1:
            - dp
        pay:
          pp: 0
          ep: 1
      - n: 2
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 3
      - n: 3
        by: P1
        at: main
        do: end-phase
      - n: 4
        by: P2
        at: quick
        do: pass
      - n: 5
        by: P2
        at: main
        do: end-phase
      - n: 6
        by: P1
        at: quick
        do: pass
      - n: 7
        by: P1
        at: main
        do: activate
        ability:
          source: a
          line: 1
        costs:
          1:
            - dp2
        pay:
          pp: 1
          ep: 0
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.ep: 0
          P1.drive:
            - dp
          P1.pp.current: 0
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a:
            power: 5
            hp: 5
            links:
              憑依:
                - dp
      - at: after-decision-7
        view: omniscient
        outcome: cannot-activate
        assert:
          P1.pp.current: 10
          P1.drive:
            - dp
          P1.evolve_deck:
            - dp2
          P1.field.a:
            power: 5
            hp: 5
          semantic_state.counters_this_turn.P1.evolve_played: 0
