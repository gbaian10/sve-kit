schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: flow-ride-lifetime-r3-01
kind: flow
must_pass: true
mechanisms:
  - A 憑依
  - 遊戲中一次
  - EP 代付
cards:
  - BP01-173
  - CP03-127
  - CSD03a-006
why: 憑依需要ドライブポイント與一 PP 或 EP；隔回合後進化額度重設，仍不能再次使用同一張從者已用過的憑依。
discriminates: 只做每回合限次會讓下一回合再次付費並消耗 dp2；漏費用則反例也會建立關聯。
refs:
  rules:
    - 14.4.9.2
    - 14.4.7.3.2
    - 14.4.9.5
  qa: []
evidence:
  - ref: cr 14.4.9.2
    quote: ‘【憑依】（コスト）：（テキスト）’は‘ （コス ト） あなたのエボルヴデッキの『ドライブポイン ト』1 枚をあなたのドライブ領域に置く：この能 力をプレイするためのコストの PP のうち 1 点 を、PP ではなく 1 点の EP で支払ってよい。こ の能力のコストとしてドライブ領域に置いた『ド ライブポイント』をこのカードに関連付ける。こ の能力は、このゲーム中にこのカードの【憑 依】能力をプレイしていない場合のみプレイで きる。（テキスト）’を意味します。
    derivation:
      - 憑依需要ドライブポイント與一 PP 或 EP；隔回合後進化額度重設，仍不能再次使用同一張從者已用過的憑依。
  - ref: cr 14.4.7.3.2
    quote: そのフォロワーはドライブ能力と【シン グルドライブ】（14.4.6.2）と【突進】（12.10）を 得ます。
    derivation:
      - 憑依需要ドライブポイント與一 PP 或 EP；隔回合後進化額度重設，仍不能再次使用同一張從者已用過的憑依。
  - ref: cr 14.4.9.5
    quote: 憑依能力は進化相当能力（8.3.2）です。
    derivation:
      - 憑依需要ドライブポイント與一 PP 或 EP；隔回合後進化額度重設，仍不能再次使用同一張從者已用過的憑依。
status: verified
author: astra
verified_by:
  - by: fable
    method: independent-derivation
    note: 第三輪交叉驗證 fable-r3/xverify-1、xverify-2（審 astra-r3），astra-r3/fix-1 處理後同意
  - by: sol
    method: independent-derivation
    note: 第三輪最後核對（139 局面逐一推導）；部分洗牌的寫法依 CONTRACT 10.18
