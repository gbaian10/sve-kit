why: 陰陽師且是スペル的卡只能算一張；合法打出アドバンス後即使拒絕放上貴人，也花費 EP/PP 並使用共用額度。
discriminates: 雙計數會接受四張反例；只在成功放上場才記額度則正例能再進化。
refs:
  rules:
    - 12.16.3
    - 8.3.2.1
  qa:
    - Q2001
    - Q2000
evidence:
  - ref: Q2001
    quote: "Q: タイプに陰陽師を持ち、スペルでもある『式神の使役』は、「自分の墓場の陰陽師・カードやスペルが7枚以上なら、」によって参照する際に、2枚分数えますか？\nA: いいえ。『式神の使役』は1枚分として数えます。\n「自分の墓場の陰陽師・カードやスペルが7枚以上なら」とは、自分の墓場の、タイプに陰陽師を持つカードやスペルの片方もしくは両方に該当するカードの合計枚数を参照します。"
    derivation:
      - 陰陽師且是スペル的卡只能算一張；合法打出アドバンス後即使拒絕放上貴人，也花費 EP/PP 並使用共用額度。
  - ref: Q2000
    quote: "Q: このフォロワーの《アドバンス起動》能力をプレイした場合、そのターン中に自分の場の『ゴブリン』を進化させることができますか。\nA: いいえ。《アドバンス起動》能力や《進化》能力（進化することができる起動能力・「丸E」のアイコン）は1ターンに1回のみ使用することができます。"
    derivation:
      - 陰陽師且是スペル的卡只能算一張；合法打出アドバンス後即使拒絕放上貴人，也花費 EP/PP 並使用共用額度。
  - ref: cr 12.16.3
    quote: ‘ （効果）’は、‘ （効果） これをプレイする 際、そのコストに含まれる PP のうち 1 点を、PP で はなく 1 点の EP で支払うことができる。これは進化 相当能力である。’（8.3.2）を意味します。
    derivation:
      - 陰陽師且是スペル的卡只能算一張；合法打出アドバンス後即使拒絕放上貴人，也花費 EP/PP 並使用共用額度。
  - ref: cr 8.3.2.1
    quote: 起動能力を指定する際、それが進化能力ま たは進化相当能力である場合、このターンに ターンプレイヤーがいずれかの進化能力や進 化相当能力をすでにプレイ済みである場合、 その起動能力は指定できません。
    derivation:
      - 陰陽師且是スペル的卡只能算一張；合法打出アドバンス後即使拒絕放上貴人，也花費 EP/PP 並使用共用額度。
