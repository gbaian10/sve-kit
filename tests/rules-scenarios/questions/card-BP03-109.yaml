schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP03-109
kind: card
must_pass: true
mechanisms: [控制權轉移：奪う, 5.22.1, 5.22.4, 5.22.5, 賽馬娘：出走, 14.2.3.1, 14.2.1.3, 11.8.1, 8.4.2.1, 8.4.3.1, 12.10.2, 突進, 3.1.2]
cards: [BP03-109, BP03-119, CP01-013, CP01-085, BP01-173, BP01-176]
why: >-
  カオティックエンジェル{起動}「墓場の堕天使・カード3枚を消滅：相手のフォロワー1体を選ぶ。それを奪い、スタンドする」。奪った從者不是新上場的卡（5.22.4），
  引き継ぐ出走狀態（Q544）：關聯的にんじん 仍在原主人 P2 的出走領域，所以它仍有【突進】（14.2.3.1、Q533）→ 奪った當回合可以攻擊アクト狀態的從者（12.10.2），
  但不能攻擊リーダー（8.4.3.1 第二項、Q537）。它離場時回擁有者 P2 的墓場（5.22.5、Q532），關聯解除（14.2.1.3）→ にんじん 由 11.8.1 表向き回 P2 的エボルヴデッキ（Q528）。
discriminates: >-
  把奪う做成「重新上場」的引擎：after-decision-1 會誘發ファンファーレ 之類的待機、或讓 b1 失去出走狀態而不能攻擊（cannot-attack）。
  不區分擁有者與マスター的引擎：b1 被破壞後會進 P1 的墓場、にんじん 回 P1 的エボルヴデッキ。允許攻擊リーダー的引擎在 B 會 resolved（A／B 的守護從者故意保持スタンド，12.8.2 不會強制目標，所以 B 只測 5.22 的限制）。
refs:
  rules: [5.22.1, 5.22.3, 5.22.4, 5.22.5, 14.2.3.1, 14.2.1.3, 11.8.1, 8.4.2.1, 8.4.3.1, 12.10.2, 8.4.9.1, 11.3.1, 10.4.2]
  qa: [Q544, Q533, Q537, Q532, Q528, Q542]
evidence:
  - ref: Q533
    quote: はい。出走したフォロワーは【突進】を持ち、相手の場から自分の場に移動した後も引き続き【突進】を持つため、相手のフォロワーに攻撃することができます。
  - ref: Q537
    quote: いいえ。攻撃することはできません。
    derivation:
      - Q537 問「奪ったフォロワーは、奪ったターンに攻撃することはできますか」；Q536 補充有【疾走】【突進】時依各自能力可以攻擊。【突進】只允許以アクト狀態的從者為目標（12.10.2），攻擊リーダー仍不行（8.4.3.1 第二項）
  - ref: Q528
    quote: 持ち主のエボルヴデッキに表向きで置かれます。
  - ref: Q532
    quote: 持ち主の墓場に置かれます。
  - ref: cr 5.22.4
    quote: 奪ったまたは渡したカードは新たに場に出たカードでは無く、それまでそのカードが持っていた情報や状態をすべて引き続き持ちます。
  - ref: cr 14.2.1.3
    quote: 場のカードが場以外に移動する場合、その移動直後にそのカードに関連付けられている出走領域とのカードとの関連付けを失います。
    derivation:
      - b1 從 P1 的場移到 P2 的墓場（5.22.5）→ 關聯解除 → n1 由 11.8.1 表向き移到**它的擁有者** P2 的エボルヴデッキ置き場
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: 第三輪交叉驗證 astra-r3/xverify-1、xverify-2（審 fable-r3），fable-r3/fix-1～fix-3 處理後同意
  - by: sol
    method: independent-derivation
    note: 第三輪最後核對（139 局面逐一推導）；F1、F2 與禁止 vs 置換仲裁已依核對結果修正

scenarios:
  - name: A 奪走出走中的ハルウララ → 仍有突進 → 攻擊アクト狀態的ファイター → 互相受傷
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 8, P2: 7}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ニュートラル, life: 20}
          pp: {current: 3, max: 8}
          zones:
            field:
              - {id: a1, card: BP03-109}                     # カオティックエンジェル 5/5
            cemetery:
              - {id: c1, card: BP03-119}
              - {id: c2, card: BP03-119}
              - {id: c3, card: BP03-119}
            hand:
              - {filler: 2}
            deck:
              - {filler: 20}
        P2:
          construction: title
          title: ウマ娘 プリティーダービー
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 7}
          zones:
            field:
              - {id: b1, card: CP01-013, state: {power: 3, hp: 3, links: {出走: [n1]}}}   # ハルウララ 出走過（+1/+1）
              - {id: b2, card: BP01-173, state: {acted: true}}                          # ファイター 2/3，上回合攻擊過仍アクト
              - {id: b3, card: BP01-176}                                                # 天剣の乙女 4/6（スタンド；守護不阻擋）
            race:
              - {id: n1, card: CP01-085}
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: activate, ability: {source: a1, line: 2}, costs: {1: [c1, c2, c3]}, targets: {1: [b1]}}
      - {n: 2, by: P1, at: main, do: attack, attacker: b1, target: b2}
      - {n: 3, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.field: [a1, b1]
          P1.banish: [c1, c2, c3]
          P1.cemetery: []
          P1.field.b1: {power: 3, hp: 3, acted: false, links: {出走: [n1]}}
          P2.field: [b2, b3]
          P2.race: [n1]
          semantic_state.pending_triggers: []
        events:
          - {kind: 消滅, object: c1, group: 1}
          - {kind: 消滅, object: c2, group: 1}
          - {kind: 消滅, object: c3, group: 1}
          - {kind: 移動, object: b1, from: P2.field, to: P1.field}
        forbidden_events:
          - {kind: 待機}
          - {kind: 場に出す}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.field.b1: {hp: 1, acted: true}
          P2.field: [b3]
          P2.cemetery: [b2]
          P2.leader.life: 20
        events:
          - {kind: 攻撃, attacker: b1, target: b2}
          - {kind: ダメージ, source: b1, target: b2, amount: 3, group: 2}
          - {kind: ダメージ, source: b2, target: b1, amount: 2, group: 2}
          - {kind: 破壊, object: b2, by: rule-11.3.1}

  - name: B 奪った當回合不能攻擊リーダー（突進只對アクト從者）
    inherit: A 奪走出走中的ハルウララ → 仍有突進 → 攻擊アクト狀態的ファイター → 互相受傷
    decisions:
      - {n: 1, by: P1, at: main, do: activate, ability: {source: a1, line: 2}, costs: {1: [c1, c2, c3]}, targets: {1: [b1]}}
      - {n: 2, by: P1, at: main, do: attack, attacker: b1, target: P2.leader}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: cannot-attack
        assert:
          P1.field.b1: {acted: false}
          P2.leader.life: 20
        forbidden_events:
          - {kind: 攻撃}

  - name: C 奪ったハルウララ 攻擊天剣の乙女而死 → 回 P2 墓場，にんじん 表向き回 P2 エボルヴデッキ
    inherit: A 奪走出走中的ハルウララ → 仍有突進 → 攻擊アクト狀態的ファイター → 互相受傷
    setup:
      players:
        P2:
          zones:
            field:
              - {id: b1, card: CP01-013, state: {power: 3, hp: 3, links: {出走: [n1]}}}
              - {id: b2, card: BP01-173, state: {acted: true}}
              - {id: b3, card: BP01-176, state: {acted: true}}                        # C：天剣の乙女 アクト狀態才能被突進攻擊
    decisions:
      - {n: 1, by: P1, at: main, do: activate, ability: {source: a1, line: 2}, costs: {1: [c1, c2, c3]}, targets: {1: [b1]}}
      - {n: 2, by: P1, at: main, do: attack, attacker: b1, target: b3}
      - {n: 3, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.field: [a1]
          P1.cemetery: []
          P1.evolve_deck: []
          P2.field: [b2, b3]
          P2.field.b3: {hp: 3}
          P2.cemetery: [b1]
          P2.race: []
          P2.evolve_deck: [n1]
          P2.evolve_deck.n1: {face_up: true}
        events:
          - {kind: ダメージ, source: b3, target: b1, amount: 4}
          - {kind: 破壊, object: b1, by: rule-11.3.1}
          - {kind: 移動, object: b1, from: P1.field, to: P2.cemetery}
          - {kind: 移動, object: n1, from: P2.race, to: P2.evolve_deck, by: rule-11.8.1}
