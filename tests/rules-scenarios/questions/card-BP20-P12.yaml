why: "[astra] 追加費用支配 5 傷害及抽 1 張；不支付只有 3 傷害。沒有目標時即使宣告要支付，也不能打出或扣除費用。使用體力 7 的ルシフェル避免破壞與其他待機干擾。\n[fable] 追加費用「手札の獣・カード1枚を捨ててよい」在打出時決定（10.6.2.2.2）；「払っていたなら」管轄到段落結尾（10.4.7.1）， 所以沒付時連「1枚引く」也不做。必選 1 個目標，選不到就不能打出、回溯（10.6.2.3.3），追加費用也不會被扣。"
discriminates: "[astra] 不付追加費用仍抽牌或先支付再檢查目標，會得到不同手牌、墓場與 PP。\n[fable] 把「払っていたなら」只管到「代わりに5ダメージ」的實作，會在局面 B 多抽 1 張；先付費再選目標的實作，會在局面 C 把獣・カード留在墓場。 目標是體力 6 的天剣の乙女，3 與 5 傷害都不會破壞它，傷害值可以直接看到。"
refs:
  rules:
    - 10.4.7.1
    - 10.6.2.2.2
    - 10.6.2.3.3
    - 10.6.2.5
    - 10.6.2.8.3
    - 10.4.7.2
  qa:
    - Q2633
    - Q2634
evidence:
  - ref: Q2633
    quote: いいえ。追加コストを支払っていない場合、「これの追加コストを払っていたなら、」以降の効果は働かず、1枚引くことができません。
  - ref: Q2634
    quote: いいえ。相手の場のフォロワーを選ぶことができない場合、このスペルをプレイすることができないため、コストの支払いもできず、1枚引くことができません。
  - ref: cr 10.6.2.3.3
    quote: このカードや能力のプレイは取り消され、ゲームはこのカードや能力をプレイすることを選択する前まで戻されます。
    derivation:
      - 目標選擇 .3 在費用支付 .5 之前；無目標局面不能先棄 a2 再失敗，也不能抽 a3。
  - ref: cards BP20-P12 faces[0].text
    quote: "これをプレイする際、追加コストとして手札の獣・カード1枚を捨ててよい。\n相手の場のフォロワー1体を選ぶ。それに3ダメージ。これの追加コストを払っていたなら、代わりに5ダメージ。1枚引く。"
    derivation:
      - Q2633 直接限定後段效果；有支付時依卡面改為 5 傷害再抽 1，沒有支付則僅 3 傷害。
  - ref: Q2633
    quote: 追加コストを支払っていない場合、「これの追加コストを払っていたなら、」以降の効果は働かず、1枚引くことができません。
  - ref: Q2634
    quote: 相手の場のフォロワーを選ぶことができない場合、このスペルをプレイすることができないため、コストの支払いもできず、1枚引くことができません。
