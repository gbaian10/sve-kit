evidence:
  - ref: cr 13.2.1.2
    quote: "‘【コンボ （数値）】（テキスト）’は‘このター\nン、あなたがこのカードを含めて（数値）枚以上\nのカードをプレイしていた場合、（テキスト）’を\n意味します。"
    derivation:
      - Combo 看本回合卡片打出數，不把起動能力當卡片；未達三時不執行條件內抉擇，但仍付橫置。
  - ref: cr 5.18.2.2
    quote: "チョイスの個数が 0 である場合、その一連\nの指示はまったく実行しません。"
    derivation:
      - Combo 看本回合卡片打出數，不把起動能力當卡片；未達三時不執行條件內抉擇，但仍付橫置。
  - ref: cr 10.6.2.7
    quote: "この時点で、そのカードや能力が‘プレイさ\nれた’事象が発生します。"
    derivation:
      - Combo 看本回合卡片打出數，不把起動能力當卡片；未達三時不執行條件內抉擇，但仍付橫置。
