schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: card-BP16-T15
kind: card
must_pass: true
mechanisms:
  - 手牌、墓場中有效的能力
  - token
  - EX 區打出
  - 10.3.4
  - 9.1.4.3
  - 9.1.4.4
  - 0 費 token 法術
  - 費用中的選擇
cards:
  - BP16-T15
  - BP01-173
why: "[astra] 輝く金貨是 0 費 token 法術，可由 EX 打出；沒有法術本體效果，結算送墓後立即消去。\n[fable] 輝く金貨（EX 區的 0 費法術 token）「{起動}{コスト1}EXエリアのこれと『輝く金貨』2枚を消滅：自分のリーダーは{体力}+1する。1枚引く」：起動能力在 EX 區有效（10.3.4）； 費用要消滅自己加另外 2 張，token 進消滅領域立即消去（9.1.4.3／9.1.4.4）。它也可以當 0 費法術打出，沒有本體效果、結算後進墓場並消去（Q1968）。只有 2 張時付不出費用。"
discriminates: "[astra] 錯禁 EX 的 0 費法術或把 token 留墓場都會失敗。\n[fable] 把 EX 區的起動能力當無效的引擎 A 會 cannot-activate；把 token 留在消滅領域或墓場的引擎會在 P1.banish／P1.cemetery 出現 token； C 中允許用不足的張數起動的引擎會 resolved。"
refs:
  rules:
    - 8.2.1
    - 9.1.4.3
    - 9.1.4.4
    - 10.6.2.8.3
    - 10.3.4
    - 8.3.1
    - 10.4.2.2
  qa:
    - Q1968
evidence:
  - ref: cr 8.2.1
    quote: "ターンプレイヤーは自分の手札か EX エリアにある\nカードを 1 枚指定し、そのカードのコストの値と同じ\n値の PP をコストとして支払うことでプレイすることが\nできます（10.6）。"
    derivation:
      - 輝く金貨是 0 費 token 法術，可由 EX 打出；結算送墓後立即消去。手牌 token 不可存在，故只測 EX。
  - ref: cr 9.1.4.3
    quote: "種類がスペルであるトークンは、EX エリア\nか解決領域でのみ存在できます。"
    derivation:
      - 輝く金貨是 0 費 token 法術，可由 EX 打出；結算送墓後立即消去。手牌 token 不可存在，故只測 EX。
  - ref: cr 9.1.4.4
    quote: "あるトークンが存在できる領域以外の領域\nに移動した場合、その移動を行った直後に、そ\nの領域で消去されます。この処理はチェックタ\nイミングを待たず、なんらかの効果の途中で移\n動を行った場合は、その移動の続きを行うより\nも前に実行されます。"
    derivation:
      - 輝く金貨是 0 費 token 法術，可由 EX 打出；結算送墓後立即消去。手牌 token 不可存在，故只測 EX。
  - ref: cr 10.6.2.8.3
    quote: "この時点で解決領域にカードや能力\nが残っている場合、それがカードならオー\nナーの墓場に移動し、それが能力なら解決\n領域から取り除きます。"
    derivation:
      - 輝く金貨是 0 費 token 法術，可由 EX 打出；結算送墓後立即消去。手牌 token 不可存在，故只測 EX。
  - ref: Q1968
    quote: はい。プレイすることができます。その場合、スペルとしての能力は持っていないので、特に何も起こらず、『輝く金貨』は墓場に置かれます。（『輝く金貨』はトークンなので、墓場に置かれた直後に消去されます。）
status: verified
author:
  - astra
  - fable
verified_by:
  - by: astra
    method: independent-derivation
    note: A／B／C：xverify-1/result.md:44〈22 個重疊題〉（10.4.2、Q1968）
  - by: fable
    method: qa
    note: Q1968、9.1.4.3／9.1.4.4；xverify-1/result.md〈22 個重疊題〉。之後未再改
scenarios:
  - name: '[astra] 從 ex 打出'
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 0
            max: 1
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            ex:
              - id: a
                card: BP16-T15
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 0
            max: 1
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: a
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P1.hand: []
          P1.ex: []
          P1.cemetery: []
        events:
          - kind: 消去
            object: a
            by: rule-9.1.4.4
  - name: '[fable] A 用 EX 的 3 張輝く金貨起動：消滅 3 張（消去）、+1、抽 1'
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 4
          P2: 3
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ロイヤル
            life: 20
          pp:
            current: 1
            max: 4
          zones:
            ex:
              - id: k1
                card: BP16-T15
              - id: k2
                card: BP16-T15
              - id: k3
                card: BP16-T15
            hand:
              - filler: 2
            deck:
              - id: d1
                card: BP01-173
              - filler: 20
        P2:
          construction: class
          leader:
            class: ドラゴン
            life: 20
          pp:
            current: 0
            max: 4
          zones:
            hand:
              - filler: 3
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: activate
        ability:
          source: k1
          line: 1
        costs:
          1:
            - k2
            - k3
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P1.ex: []
          P1.banish: []   # 3 張金貨都已消去（9.1.4.4）；消去的相對順序不比對
          P1.leader.life: 21
          P1.hand:
            - filler: 2
            - d1
        events:
          # 契約 10.13：3 張金貨是同一筆費用 → 同一個 group
          - kind: 消滅
            object: k1
            group: 1
          - kind: 消滅
            object: k2
            group: 1
          - kind: 消滅
            object: k3
            group: 1
          - kind: 体力増加
            target: P1.leader
            amount: 1
          - kind: 引く
            player: P1
            object: d1
  - name: '[fable] B 當 0 費法術打出：沒有效果，進墓場後消去'
    inherit: '[fable] A 用 EX 的 3 張輝く金貨起動：消滅 3 張（消去）、+1、抽 1'
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: k1
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 1
          P1.ex:
            - k2
            - k3
          P1.cemetery: []
          P1.leader.life: 20
        events:
          - kind: プレイ
            object: k1
          - kind: 消去
            object: k1
        forbidden_events:
          - kind: 引く
          - kind: 体力増加
  - name: '[fable] C 只有 2 張 → 費用付不出 → 不能起動'
    inherit: '[fable] A 用 EX 的 3 張輝く金貨起動：消滅 3 張（消去）、+1、抽 1'
    setup:
      players:
        P1:
          zones:
            ex:
              - id: k1
                card: BP16-T15
              - id: k2
                card: BP16-T15
    decisions:
      - n: 1
        by: P1
        at: main
        do: activate
        ability:
          source: k1
          line: 1
        costs:
          1:
            - k2
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-activate
        assert:
          P1.ex:
            - k1
            - k2
          P1.pp.current: 1
