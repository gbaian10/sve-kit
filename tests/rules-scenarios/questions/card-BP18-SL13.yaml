why: El 給特定 EX 卡的本回合 -3 與爆炎の咆哮的可選 +3 合算後才截至零；不減費是期限已結束的對照，另實際跨過兩方回合檢查7.4.8。
discriminates: 先把 2-3 截零再加 3 會錯付 3；遺漏減費會付 5；未付追加費仍搜尋會多出輸入點；減費未到期移除會令下回合少付2。
refs:
  rules:
    - 10.4.4.1
    - 10.4.7.2
    - 10.6.2.5
    - 7.4.8
  qa:
    - Q2386
evidence:
  - ref: cr 10.4.4.1
    quote: カードをプレイする際のコストの数値を変更する効果は、このカードのコストの情報の値を変更するのではなく、そのコストのために減少する PP の点数を変更します。
  - ref: cr 10.4.7.2
    quote: 何らかのカードや能力を‘プレイする際、（処理）：（効果）’と書かれている場合、これはそのカードや能力をプレイする際にコストとしてその処理を実行することでその効果を適用することを選択できる選択肢（10.6.2.2）を意味します。
  - ref: cr 10.6.2.5
    quote: プレイするためのコストがある場合、そのコストを決定し、その後すべてのコストを支払います。
  - ref: cr 7.4.8
    quote: すべての‘ターンの終わりまで’を期限とする効果や‘そのターン中’期限とする効果が取り除かれます。
  - ref: Q2386
    quote: はい。コスト2でプレイできます。
  - ref: BP18-SL14
    quote: "【進化時】自分のデッキの上3枚を見る。その中から、武闘竜人・カード1枚をEXエリアに置いてよい。残りを好きな順にデッキの下に置く。このターン、それをプレイする際、コストを-3する。\n【超進化時】『青春の一撃』1枚をEXエリアに置く。"
  - ref: BP13-060
    quote: "これをプレイする際、コストを+3してよい。\n相手の場のフォロワー1体を選ぶ。それに3ダメージ。コストを+3したなら、自分のデッキから『焦熱の竜翼・ドラーク』1枚を探し、場に出す。それは【指定攻撃】を持つ。"
