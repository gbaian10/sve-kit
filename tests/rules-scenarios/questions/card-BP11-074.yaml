why: 兩隻骸各自記住離場 token 的名稱；非 token 即使也叫ゴースト仍不誘發。
discriminates: 全場共用一次上限只生一隻；錯用來源名稱會生錯 token；把追加卡名視作 token 會多待機。
refs:
  rules:
    - 9.1.4.4
    - 10.7.4
  qa:
    - Q1553
    - Q1552
    - Q1551
evidence:
  - ref: Q1553
    quote: "Q: このフォロワーが自分の場に2体いる状況で、自分の元のコスト1のトークン・カードが場を離れた場合、このフォロワーの「ターンごとに1回、元のコスト1の自分のトークン・カードが場を離れたとき、～」という能力はそれぞれ誘発しますか？\nA: はい。それぞれターンごとに1回誘発します。"
    derivation:
      - 兩隻骸各自記住離場 token 的名稱；非 token 即使也叫ゴースト仍不誘發。
  - ref: Q1552
    quote: "Q: 相手のターン中に自分の元のコスト1のトークン・カードが場を離れた場合、このフォロワーの「ターンごとに1回、元のコスト1の自分のトークン・カードが場を離れたとき、～」という能力は誘発しますか？\nA: はい。相手のターン中であっても誘発します。"
    derivation:
      - 兩隻骸各自記住離場 token 的名稱；非 token 即使也叫ゴースト仍不誘發。
  - ref: Q1551
    quote: "Q: 自分の場の『プチゴースト・バケルス』が場を離れた場合、『大ツルハシの骸』の「ターンごとに1回、元のコスト1の自分のトークン・カードが場を離れたとき、それと同名のトークン・カード1枚を場に出す。」という能力によって、『ゴースト』を場に出すことができますか？\nA: いいえ。『ゴースト』を出すことができません。\n『プチゴースト・バケルス』は追加のカード名として『ゴースト』を持ちますが、トークン・カードではないので場を離れたときに『大ツルハシの骸』の能力が誘発しません。"
    derivation:
      - 兩隻骸各自記住離場 token 的名稱；非 token 即使也叫ゴースト仍不誘發。
  - ref: cr 9.1.4.4
    quote: あるトークンが存在できる領域以外の領域 に移動した場合、その移動を行った直後に、そ の領域で消去されます。この処理はチェックタ イミングを待たず、なんらかの効果の途中で移 動を行った場合は、その移動の続きを行うより も前に実行されます。
    derivation:
      - 兩隻骸各自記住離場 token 的名稱；非 token 即使也叫ゴースト仍不誘發。
  - ref: cr 10.7.4
    quote: あるカードが領域を移動することを誘発条件とす る自動能力が存在します。これを領域移動誘発と呼 びます。
    derivation:
      - 兩隻骸各自記住離場 token 的名稱；非 token 即使也叫ゴースト仍不誘發。
