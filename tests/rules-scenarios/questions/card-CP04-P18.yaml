schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-CP04-P18
kind: card
must_pass: true
mechanisms: [名稱包含比對, 2.1.2, 公主連結：UB、裝備, 10.4.6.1, 取代效果, 搜尋有條件, 10.10.2.4, EX 區打出]
cards: [CP04-P18, CP04-019, BP01-173, BP01-176, BP01-180]
why: >-
  クレジッタ的ファンファーレ（分隔線後的段落）「自分のデッキから「カード名に『ペコリーヌ』を含むフォロワー」1枚を探し、EXエリアに置く。このターン、それをプレイする際、コストを-3する」：
  包含比對（2.1.2）找到『ペコリーヌ』；本回合從 EX 打出費用 3−3＝0，PP 不減；ペコリーヌ自己的ファンファーレ {コスト2} 因 PP 不足取消。
  UB 起動「これを{アクト}」在進場的回合也能付（10.4.6.1）：對目標「このターン、それが受けるダメージを+2する」是取代效果（Q2419、Q2420），
  之後エンジェルバレッジ的 1 傷害變 3。
  互驗第二輪修正（astra）：ペコリーヌ 有【守護】，打出放上場時要問 place-acted（12.8.2、契約 9.2）；搜尋結果依 5.8.1.2 向對手出示（契約 10.5）。
discriminates: >-
  用完全同名比對的引擎在搜尋時找不到（或必須「找不到」）；沒套 −3 的引擎打出ペコリーヌ會 cannot-play（PP 1 < 3）；
  把「進場回合不能アクト付費」的引擎 UB 會 cannot-activate；沒把「受けるダメージ+2」當取代效果套用的引擎 b1 體力 5 而非 3。
refs:
  rules: [2.1.2, 5.8.1.2, 5.8.2, 10.4.4.1, 10.4.6.1, 5.14.2, 10.2.1.3.2, 14.5.1.2, 8.2.1, 10.1.1.2.2]
  qa: [Q2419, Q2420, Q2782]
evidence:
  - ref: cr 2.1.2
    quote: ルールやテキストで‘『（名称）』’という表記がある場合、それは文脈に従い、カード名がその（名称）であるカード、またはその（名称）をカード名の一部に含むカードを意味します。
    derivation:
      - 「カード名に『ペコリーヌ』を含む」明寫包含 → 『ペコリーヌ』（完全同名）當然符合
  - ref: Q2420
    quote: そのフォロワーが交戦して受けるダメージや、能力によって受けるダメージが+2されます。
  - ref: cr 10.4.6.1
    quote: このコストは、このコストをもつカードが場に出たターンであっても実行する事が可能です。
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: A：xverify-2/recheck.md:88〈全部改動局面的核對索引〉

scenarios:
  - name: A 搜到ペコリーヌ放 EX → 本回合 0 費打出（ファンファーレ付不出取消）→ UB +2 → エンジェルバレッジ 1 → 3
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 5, P2: 4}, phase: main}
      history: none
      players:
        P1:
          construction: title
          title: プリンセスコネクト！Re:Dive
          leader: {class: ロイヤル, life: 20}
          pp: {current: 5, max: 5}
          zones:
            hand:
              - {id: a1, card: CP04-P18}          # クレジッタ 3/4
              - {id: a2, card: BP01-180}          # エンジェルバレッジ
            deck:
              - {id: d1, card: BP01-173}
              - {id: d2, card: CP04-019}          # ペコリーヌ 3/3
              - {id: d3, card: BP01-173}
        P2:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 0, max: 5}
          zones:
            field:
              - {id: b1, card: BP01-176}          # 天剣の乙女 4/6
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, section: 0, line: 1}}}
      - {n: 3, by: P1, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, select: [d2]}
      - {n: 4, by: P1, at: main, do: play, card: d2}
      # 12.8.2：ペコリーヌ 有【守護】→ 打出放上場時選直立／アクト（9.2 place-acted，屬決定 4 的結算）
      - {n: 5, by: P1, at: resolve, of: {decision: 4, occurrence: 1}, do: place-acted, object: d2, acted: false}
      - {n: 6, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: d2, line: 3}}}
      - {n: 7, by: P1, at: main, do: activate, ability: {source: a1, line: 1}, targets: {1: [b1]}}
      - {n: 8, by: P1, at: main, do: play, card: a2}
    random:
      shuffles:
        - {player: P1, zone: deck, result: [d3, d1]}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 1
          P1.ex: [d2]
          P1.deck: [d3, d1]
        events:
          - {kind: 公開, object: d2, to: P2, source: a1}     # 5.8.1.2 向對手出示（契約 10.5）
          - {kind: 移動, object: d2, from: P1.deck, to: P1.ex}
      - at: after-decision-4
        view: omniscient
        outcome: paused
        awaiting:
          by: P1
          choices:
            - {do: place-acted, object: d2, acted: false}
            - {do: place-acted, object: d2, acted: true}
        assert:
          P1.pp.current: 1
          P1.ex: []
        events:
          - {kind: プレイ, object: d2}
      - at: after-decision-5
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: d2, line: 3}}}
        assert:
          P1.pp.current: 1
          P1.field: [a1, d2]
          P1.field.d2: {entered_from: ex, entered_by: play, acted: false}
        events:
          - {kind: 場に出す, object: d2}
          - {kind: 待機, ability: {source: d2, line: 3}, event: {entered_field: d2}}
      - at: after-decision-6
        view: omniscient
        outcome: pending-cancelled
        assert:
          P1.pp.current: 1
          P1.equipment: []
      - at: after-decision-7
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a1: {acted: true}
          P1.pp.current: 1
        events:
          - {kind: アクト, object: a1}
      - at: after-decision-8
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P2.field.b1: {hp: 3}
        events:
          - {kind: ダメージ, source: a2, target: b1, amount: 3}
        forbidden_events:
          - {kind: ダメージ, amount: 1}
