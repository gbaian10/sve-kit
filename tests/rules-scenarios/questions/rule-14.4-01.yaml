schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: rule-14.4-01
kind: rule
must_pass: true             # 觸發圖示已用官方卡圖確認（card-facts-verified.md，2026-09-25）
mechanisms: [14.4.9, 14.4.7.3, 14.4.8, 14.4.6.2, 14.4.5, 8.3.2.1, Vanguard：憑依、驅動, 進化每回合一次]
cards: [CP03-009, CP03-127, CP03-010, CP03-005, CP03-006, BP01-173]
why: >-
  憑依（14.4.9.2）：費用＝PP 1 ＋ 把エボルヴデッキ的『ドライブポイント』放到ドライブ領域並關聯；之後從者得到ドライブ →
  依 14.4.7.3.2 同時得到【シングルドライブ】與【突進】，並誘發【ドライブ獲得時】（ヴァレリア：+1/+1、【疾走】、一個【攻撃時】能力）。
  憑依是進化相当能力（14.4.9.5）→ 同回合不能再進化（8.3.2.1）。攻擊時【シングルドライブ】與獲得的【攻撃時】同時待機（Q1392 任意順序）；
  驅動檢查翻到沒有圖示的卡 → 放底。
  互驗修正（astra）：場上的アルゴス a2「自分の場のアクアフォース・フォロワーが攻撃したとき」也因 a1（アクアフォース）攻擊而誘發（Q1386 同旨）；
  「3回目なら」在效果內，第 1 次攻擊只是沒有效果，待機仍要打出，P2 的クイック時點要等它結算完（Q1387）。
  局面 B：憑依的 PP 1 改用 EP 支付（14.4.9.2）。
discriminates: >-
  沒把『ドライブポイント』從エボルヴデッキ移到ドライブ領域的引擎，P1.drive 為空；沒有依 14.4.7.3.2 給【シングルドライブ】的引擎攻擊時只有一個待機；
  憑依後仍允許進化的引擎 after-decision-3 會是 resolved。把「條件不成立」當成「不誘發」的引擎 after-decision-4 只有兩個待機、after-decision-6 就直接進 Quick。
  B：不允許 EP 代付的引擎 cannot-activate；代付後 PP 應仍是 3、EP 1。
refs:
  rules: [14.4.9.2, 14.4.9.5, 14.4.7.3, 14.4.7.3.2, 14.4.8.2, 14.4.6.2, 14.4.5.1.1, 14.4.5.1.5, 8.3.2.1, 12.9.2, 10.7.2, 4.14.1]
  qa: [Q1392, Q1393, Q1391, Q1385, Q1386, Q1387]
evidence:
  - ref: cr 14.4.9.2
    quote: >-
      ‘【憑依】（コスト）：（テキスト）’は‘（コスト）あなたのエボルヴデッキの『ドライブポイント』1 枚をあなたのドライブ領域に置く：…この能力のコストとしてドライブ領域に置いた『ドライブポイント』をこのカードに関連付ける。…’を意味します。
  - ref: cr 14.4.7.3.2
    quote: そのフォロワーはドライブ能力と【シングルドライブ】（14.4.6.2）と【突進】（12.10）を得ます。
  - ref: Q1392
    quote: はい。任意の順番で解決できます。
  - ref: Q1391
    quote: はい。3回目の場合のみ有効です。
  - ref: cr 14.4.9.5
    quote: 憑依能力は進化相当能力（8.3.2）です。
  - ref: Q1385
    quote: はい。3回目の場合のみ有効です。攻撃したフォロワーを含めて、このターン中の自分の場のアクアフォース・フォロワーの攻撃が2回目の場合や、4回目以降の場合は有効ではありません。
    derivation:
      - 「有効ではありません」＝打出後條件不成立、什麼都不做；誘發條件「攻撃したとき」本身已滿足 → 仍待機（10.7.2）
  - ref: Q1387
    quote: このフォロワーの能力が誘発し解決するタイミングが先です。【攻撃時】能力などフォロワーが攻撃したときに誘発する能力をすべて解決した後、非ターンプレイヤーのクイックタイミングが訪れます。
  - ref: cr 14.4.9.2
    quote: この能力をプレイするためのコストの PP のうち 1 点を、PP ではなく 1 点の EP で支払ってよい。
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: 見 reverify/result.md〈R1〉；CR 14.4.9、14.4.7.3.2、8.3.2.1、10.1.1.2.1、10.7.2；Q1391～Q1393、Q1385～Q1387 交叉核對。採 CP03-010＝none，確認三個待機、無效果結算及全部事件區間。

scenarios:
  - name: A 憑依 → ドライブ獲得時 → 進化不可 → 疾走攻擊：シングルドライブ與攻撃時同時待機
    card_facts:
      CP03-010: {trigger_icon: none, source: 官方卡圖右上角圖示（Opus 確認，card-facts-verified.md）, verified: true}
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 3, P2: 2}, phase: main}
      history: none
      players:
        P1:
          construction: title
          title: カードファイト!! ヴァンガード
          leader: {class: エルフ, life: 20}
          pp: {current: 3, max: 3}
          ep: 2
          zones:
            field:
              - {id: a1, card: CP03-009}          # ティアーナイト ヴァレリア 1/1
              - {id: a2, card: CP03-005}          # 潮騒の水将 アルゴス 1/3
            evolve_deck:
              - {id: dp1, card: CP03-127}         # ドライブポイント
              - {id: ev1, card: CP03-006}         # ネイブルゲイザー・ドラゴン（アルゴス的進化卡）
            hand:
              - {filler: 2}
            deck:
              - {id: t1, card: CP03-010}          # 無圖示
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 3}
          zones:
            field:
              - {id: b1, card: BP01-173}
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: activate, ability: {source: a1, line: 1}, pay: {pp: 1, ep: 0}}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}}
      - {n: 3, by: P1, at: main, do: evolve, source: a2, ability: {source: a2, line: 1}, evolve_card: ev1, pay: {pp: 0, ep: 1, sep: 0}}
      - {n: 4, by: P1, at: main, do: attack, attacker: a1, target: P2.leader}
      - {n: 5, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, rule: 14.4.7.3.2, keyword: シングルドライブ}}}
      - {n: 6, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2, keyword: 攻撃時}}, targets: {1: [b1]}}
      - {n: 7, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a2, line: 2}}}
      - {n: 8, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, line: 2}}}
        assert:
          P1.pp.current: 2
          P1.ep: 2
          P1.drive: [dp1]
          P1.evolve_deck: [ev1]
          P1.field.a1: {links: {憑依: [dp1]}}
          semantic_state.counters_this_turn: {P1.evolve_played: 1}
        events:
          - {kind: 移動, object: dp1, from: P1.evolve_deck, to: P1.drive}
          - {kind: 待機, ability: {source: a1, line: 2}}
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a1: {power: 2, hp: 2}
      - at: after-decision-3
        view: omniscient
        outcome: cannot-evolve
        assert:
          P1.field.a2: {evolved: false}
          P1.ep: 2
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, keyword: シングルドライブ, rule: 14.4.7.3.2}}}
            - {do: choose-pending, pending: {ability: {source: a1, keyword: 攻撃時, line: 2}}, targets: {1: [b1]}}
            - {do: choose-pending, pending: {ability: {source: a2, line: 2}}}
        assert:
          P1.field.a1: {acted: true}
          semantic_state.counters_this_turn: {P1.attacks: 1}
      - at: after-decision-5
        view: omniscient
        outcome: resolved
        assert:
          P1.deck: [filler: 20, t1]
          P1.trigger: []
        events:
          - {kind: 移動, object: t1, from: P1.deck, to: P1.trigger}
          - {kind: 移動, object: t1, from: P1.trigger, to: P1.deck, position: bottom}
      - at: after-decision-6
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a2, line: 2}}}
        assert:
          P2.field.b1: {hp: 3}
          P2.leader.life: 20
        forbidden_events:
          - {kind: ダメージ}
      - at: after-decision-7
        view: omniscient
        outcome: resolved
        assert:
          P1.leader.life: 20
          P1.hand_count: 2
          semantic_state.pending_triggers: []
        events:
          - {kind: プレイ, ability: {source: a2, line: 2}}
        forbidden_events:
          - {kind: 体力増加}
          - {kind: 引く}
      - at: after-decision-8
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 18
          P2.field.b1: {hp: 3}
        events:
          - {kind: ダメージ, source: a1, target: P2.leader, amount: 2}
        forbidden_events:
          - {kind: ダメージ, target: b1}

  - name: B 憑依的 PP 1 用 EP 代付 → PP 不減、EP −1
    inherit: A 憑依 → ドライブ獲得時 → 進化不可 → 疾走攻擊：シングルドライブ與攻撃時同時待機
    decisions:
      - {n: 1, by: P1, at: main, do: activate, ability: {source: a1, line: 1}, pay: {pp: 0, ep: 1}}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 3
          P1.ep: 1
          P1.drive: [dp1]
          P1.field.a1: {power: 2, hp: 2, links: {憑依: [dp1]}}
          semantic_state.counters_this_turn: {P1.evolve_played: 1}
