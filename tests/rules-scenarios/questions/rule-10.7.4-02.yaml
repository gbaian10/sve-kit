schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: rule-10.7.4-02
kind: rule
must_pass: true
mechanisms: [10.7.4, '10.11', 10.5.2.1, 11.3.1, 7.4.7, 手牌、墓場中有效的能力, 誘發時與結算時的狀態不同]
cards: [BP20-P59, BP20-111, BP03-115, BP03-116, BP01-176, BP01-173]
why: >-
  至高の凌駕「これを自分の手札から捨てたとき、自分の場に「カード名に『マゼルベイン』を含むフォロワー」がいるなら、これをEXエリアに置いてよい」：
  條件在**結算時**看（不是誘發時）。Q2702：ハンプティダンプティ【進化時】對全場 5 傷害並捨光手牌 → 誘發時マゼルベイン體力 ≤0 但還在場上；
  檢查時點先做規則處理（10.5.2.1）把它送墓，之後才結算待機 → 條件不成立 → 不能放 EX。
  局面 B（Q2685）：結束階段手牌上限捨棄，マゼルベイン在場 → 可以放 EX。
discriminates: >-
  在誘發時就評估條件（或把條件當誘發條件的一部分固定住）的實作，局面 A 會把 a4 放進 EX；
  在待機能力結算前不先做規則處理的實作也一樣。局面 B 檢查結束階段捨棄流程與手牌中有效的能力（10.3.4）。
refs:
  rules: [10.5.2.1, 10.5.2.2, 11.3.1, 11.1.3, 10.7.4.1.1, 10.3.4, 10.4.7.3, 5.12.1, 7.4.7, 12.6.2, 5.16.3, 11.6.1]
  qa: [Q2702, Q2685, Q550]
evidence:
  - ref: Q2702
    quote: >-
      いいえ。『至高の凌駕』をEXエリアに置くことはできません。…『絶大の顕現・マゼルベイン』に5ダメージ与えられ体力が0以下になります。自分の手札をすべて捨て、『至高の凌駕』の能力が誘発し待機状態になります。
      その後チェックタイミングにおいて体力が0以下になった『絶大の顕現・マゼルベイン』が墓場に置かれます。次に待機状態となっている『至高の凌駕』の能力を解決します。
      この時点で自分の場に『絶大の顕現・マゼルベイン』がいないので『至高の凌駕』をEXエリアに置くことができません。
  - ref: Q2685
    quote: はい。『至高の凌駕』をEXエリアに置くことができます。
  - ref: Q550
    quote: はい。このフォロワーを含めた場のすべてのフォロワーに5ダメージ与えます。
    derivation:
      - ハンプティダンプティ（進化後 4/4）自己也受 5 傷害而被破壞；進化領域的卡失去關聯（5.16.3）→ 11.6.1 表向き回エボルヴデッキ
  - ref: cr 10.5.2.1
    quote: 現在処理を行うべきルール処理すべてを同時に実行します。
    derivation:
      - 檢查時點：先 11.3.1 破壞 a1、a2，再 10.5.2.2 由 P1 打出待機的至高の凌駕能力；「いるなら」在結算時判定 → 不成立
status: draft
author: fable
verified_by: []

scenarios:
  - name: A Q2702：誘發時マゼルベイン體力 ≤0 仍在場，結算時已被規則處理送墓 → 不能放 EX
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 5, P2: 4}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ビショップ, life: 20}
          pp: {current: 3, max: 5}
          ep: 2
          zones:
            field:
              - {id: a1, card: BP20-111}          # 絶大の顕現・マゼルベイン 3/3
              - {id: a2, card: BP03-115}          # ハンプティダンプティ 3/3（{進化}{コスト0}）
            evolve_deck:
              - {id: a3, card: BP03-116}          # ハンプティダンプティ（エボルヴ）4/4
            hand:
              - {id: a4, card: BP20-P59}          # 至高の凌駕（手牌唯一一張）
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 5}
          zones:
            field:
              - {id: b1, card: BP01-176}          # 天剣の乙女 4/6：5 傷害後體力 1
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: evolve, source: a2, ability: {source: a2, line: 1}, evolve_card: a3, pay: {pp: 0, ep: 0, sep: 0}}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a2, card: BP03-116, line: 1}}}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a4, line: 1}}}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a4, line: 1}}}
        assert:
          P1.field: []
          P1.cemetery: [a1, a2, a4]
          P1.hand: []
          P1.ex: []
          P1.evolution: []
          P1.evolve_deck: [a3]                # 5.16.3 失去關聯 → 11.6.1 表向き回エボルヴデッキ
          P2.leader.life: 17
          P2.field.b1: {hp: 1}
        events:
          - {kind: ダメージ, source: a2, target: a1, amount: 5, group: 1}
          - {kind: ダメージ, source: a2, target: a2, amount: 5, group: 1}
          - {kind: ダメージ, source: a2, target: b1, amount: 5, group: 1}
          - {kind: ダメージ, source: a2, target: P2.leader, amount: 3}
          - {kind: 捨てる, player: P1, object: a4}
          - {kind: 待機, ability: {source: a4, line: 1}}
          - {kind: 破壊, object: a1, by: rule-11.3.1, group: 2}
          - {kind: 破壊, object: a2, by: rule-11.3.1, group: 2}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.ex: []
          P1.cemetery: [a1, a2, a4]
          semantic_state.pending_triggers: []
        events:
          - {kind: プレイ, ability: {source: a4, line: 1}}
        forbidden_events:
          - {kind: 移動, object: a4}

  - name: B Q2685：結束階段手牌上限捨棄，マゼルベイン在場 → 可以放 EX
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 5, P2: 4}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ビショップ, life: 20}
          pp: {current: 0, max: 5}
          zones:
            field:
              - {id: a1, card: BP20-111}          # 絶大の顕現・マゼルベイン 3/3
            hand:
              - {id: a4, card: BP20-P59}          # 至高の凌駕
              - {filler: 7}                       # 合計 8 張，超過上限 1 張
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 5}
          zones:
            field:
              - {id: b1, card: BP01-173}
            hand:
              - {filler: 3}
            deck:
              - {id: b2, card: BP01-173}          # P2 下回合開始階段抽到（契約 10.10：跨回合的牌庫頂要是真實卡；互驗第二輪修正，astra）
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: end-phase}
      - {n: 2, by: P2, at: quick, do: pass}
      # 7.4.7 手牌上限捨牌（9.2）；P1 沒有【守護】從者 → 7.4.3 沒有輸入點
      - {n: 3, by: P1, at: end, do: end-discard, select: [a4]}
      - {n: 4, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a4, line: 1}}}
      - {n: 5, by: P1, at: resolve, of: {decision: 4, occurrence: 1}, do: resolve-choice, choice: execute}
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a4, line: 1}}}
        assert:
          P1.hand: [filler: 7]
          P1.cemetery: [a4]
        events:
          - {kind: 捨てる, player: P1, object: a4}
          - {kind: 待機, ability: {source: a4, line: 1}}
      - at: after-decision-5
        view: omniscient
        outcome: resolved
        assert:
          P1.ex: [a4]
          P1.cemetery: []
          P1.field: [a1]
        events:
          - {kind: プレイ, ability: {source: a4, line: 1}}
          - {kind: 移動, object: a4, from: P1.cemetery, to: P1.ex}
