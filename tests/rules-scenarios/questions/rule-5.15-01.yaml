id: rule-5.15-01
kind: rule
must_pass: true
mechanisms:
  - 動態數值
  - 名稱包含比對
cards:
  - BP01-001
  - BP08-T04
why: 只數 EX 完全同名薔薇の一撃；PP 回復不能超過最大值。
discriminates: 不限制 PP 上限會使三張分支達 5。
refs:
  rules:
    - 5.15.1.1
    - 11.9.1
  qa:
    - Q147
evidence:
  - ref: Q147
    quote: いいえ。PP最大値より多く回復することはできません。
  - ref: cr 5.15.1.1
    quote: "これによりそのプレイヤーの PP がそのプ\nレイヤーの PP 最大値を超える場合、その PP\nは PP にその値を加算するのではなくその PP\nをその PP 最大値にします。"
    derivation:
      - 只數 EX 完全同名薔薇の一撃；PP 回復不能超過最大值。
  - ref: cr 11.9.1
    quote: "あるプレイヤーの現在の PP の値がそのプレイ\nヤーの PP 最大値を超えている場合、そのプレイ\nヤーの PP はその PP 最大値になります。"
    derivation:
      - 只數 EX 完全同名薔薇の一撃；PP 回復不能超過最大值。
status: draft
author: astra
