schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP20-036
kind: card
must_pass: true
mechanisms: [指定攻撃與守護的互動, 12.11.2, 12.8.2, 8.4.3.1, 給予能力, 這是ダメージを受けない]
cards: [BP20-036, SD02-002, BP01-176, BP01-173]
why: >-
  【指定攻撃】（12.11.2）只是把對手「スタンド状態のフォロワー」當成可選的攻擊目標；【守護】（12.8.2）「可能なら【守護】を持つアクト状態のあなたのフォロワーを攻撃目標として選択する」的限制沒有被解除。
  A：對手有アクト狀態的守護 b1 與直立的 b2 → 有指定攻撃 也只能打 b1（打 b2、打リーダー 都不合法）。
  A2：沒有アクト狀態的守護 → 指定攻撃 可以打直立的 b2。A3：沒有指定攻撃 → 直立的 b2 不能被攻擊（8.4.3.1）。A4：有指定攻撃 也可以打リーダー（Q47）。
  シールドバッシュ 同時給「このターン、これはダメージを受けない」→ 交戰時攻擊者不受傷。
  B1～B3（使用者裁定 2026-09-25，依社群回覆，非官方 Q&A）：**直立的守護不作用**——12.11.2 的「アクト状態であるかのように」只放寬「可以選它當目標」的許可，不改變從者狀態，
  所以 12.8.2「【守護】を持つアクト状態の…」的強制條款對直立的守護不成立。B1：對手只有直立的守護 → 指定攻撃 從者可以攻擊リーダー。
  B2：也可以選擇攻擊那隻直立的守護（12.11.2）。B3：對手有直立守護＋直立非守護 → 可以攻擊非守護那隻。
discriminates: >-
  把指定攻撃 做成「無視守護」的引擎：A 的 after-decision-2 會 resolved 而不是 cannot-attack。把指定攻撃 做成也能無視「只能打アクト狀態」以外限制的引擎，A 打リーダー 也會被允許。
  A2 中沒有指定攻撃 效果的引擎會 cannot-attack。忘記「ダメージを受けない」的引擎 a1 會受 4 或 2 傷害。
  把指定攻撃 的「視為アクト」也套到 12.8.2、讓直立的守護變成強制目標的引擎：B1 打リーダー、B3 打非守護的 b2 都會 cannot-attack。
refs:
  rules: [12.11.1, 12.11.2, 12.8.1, 12.8.2, 8.4.3.1, 8.4.3.2, 8.4.9.1, 1.3.2.2]
  qa: [Q47, Q2461, Q2647]
evidence:
  - ref: cr 12.11.2
    quote: ‘【指定攻撃】’は‘このフォロワーは、相手のスタンド状態のフォロワーを、それがアクト状態であるかのように攻撃目標として選択できる’を意味します。
    derivation: [12.11 只擴大「可選目標」的集合，沒有改寫 12.8.2 的強制條款 → 對手有アクト狀態的守護時仍必須選它]
  - ref: cr 12.8.2
    quote: ‘これがフォロワーである場合、相手が攻撃目標を選択する際、可能なら【守護】を持つアクト状態のあなたのフォロワーを攻撃目標として選択する’を意味します（8.4.3）。
  - ref: Q47
    quote: はい。攻撃することができます。
  - ref: Q2461
    quote: いいえ。ありません。
  - ref: 社群回覆（Discord）＋使用者裁定，非官方 Q&A
    quote: Yes, you can still attack leader. Ward is not active while follower is reserved, even if your follower has Assail.
    derivation:
      - 12.8.2 的強制條款只對「アクト状態」的守護成立；12.11.2「それがアクト状態であるかのように攻撃目標として選択できる」只放寬選目標的許可，不改變從者狀態
      - 直立的守護仍是スタンド状態 → 不作用；指定攻撃 從者可以打リーダー、可以打任何直立從者（含那隻守護）
      - 使用者採用此結論並裁定為必過（2026-09-25）；若日後官方 Q&A 相反，B1～B3 要改
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: A／A2／A3／A4：xverify-2/result.md:265〈全部實質核驗局面的索引〉（12.11.1、12.11.2、Q47、Q2461）；B1：xverify-2/last.md:34〈card-BP20-036：同意新增 B1～B3〉；B2：xverify-2/last.md:35〈card-BP20-036：同意新增 B1～B3〉；B3：xverify-2/last.md:36〈card-BP20-036：同意新增 B1～B3〉（11.3.1）；B1～B3 依社群回覆＋使用者裁定與 12.8.2／12.11.2 推導，非官方 Q&A。

scenarios:
  - name: A 對手有アクト狀態的守護：指定攻撃 也不能打直立從者或リーダー，只能打守護；攻擊者不受傷
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 5, P2: 4}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 5, max: 5}
          zones:
            field:
              - {id: a1, card: SD02-002}          # ヴァンガード・レイサム 3/3
            hand:
              - {id: s1, card: BP20-036}          # シールドバッシュ（コスト1）
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ビショップ, life: 20}
          pp: {current: 0, max: 4}
          zones:
            field:
              - {id: b1, card: BP01-176, state: {acted: true}}   # 天剣の乙女 4/6 守護（アクト）
              - {id: b2, card: BP01-173}                         # ファイター 2/3（スタンド）
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: s1, targets: {1: [a1]}}
      - {n: 2, by: P1, at: main, do: attack, attacker: a1, target: b2}
      - {n: 3, by: P1, at: main, do: attack, attacker: a1, target: P2.leader}
      - {n: 4, by: P1, at: main, do: attack, attacker: a1, target: b1}
      - {n: 5, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 4
      - at: after-decision-2
        view: omniscient
        outcome: cannot-attack
        assert:
          P1.field.a1: {acted: false}
        forbidden_events:
          - {kind: 攻撃}
      - at: after-decision-3
        view: omniscient
        outcome: cannot-attack
        assert:
          P1.field.a1: {acted: false}
          P2.leader.life: 20
        forbidden_events:
          - {kind: 攻撃}
      - at: after-decision-5
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a1: {acted: true, hp: 3}
          P2.field.b1: {hp: 3}
        events:
          - {kind: 攻撃, attacker: a1, target: b1}
          - {kind: ダメージ, source: a1, target: b1, amount: 3}
        forbidden_events:
          - {kind: ダメージ, target: a1}

  - name: A2 對手沒有アクト狀態的守護：指定攻撃 可以打直立的ファイター
    inherit: A 對手有アクト狀態的守護：指定攻撃 也不能打直立從者或リーダー，只能打守護；攻擊者不受傷
    setup:
      players:
        P2:
          zones:
            field:
              - {id: b2, card: BP01-173}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: s1, targets: {1: [a1]}}
      - {n: 2, by: P1, at: main, do: attack, attacker: a1, target: b2}
      - {n: 3, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P2.field: []
          P2.cemetery: [b2]
          P1.field.a1: {acted: true, hp: 3}
        events:
          - {kind: 攻撃, attacker: a1, target: b2}
          - {kind: ダメージ, source: a1, target: b2, amount: 3}
          - {kind: 破壊, object: b2}
        forbidden_events:
          - {kind: ダメージ, target: a1}

  - name: A3 沒有指定攻撃：直立的ファイター 不能被攻擊
    inherit: A2 對手沒有アクト狀態的守護：指定攻撃 可以打直立的ファイター
    decisions:
      - {n: 1, by: P1, at: main, do: attack, attacker: a1, target: b2}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-attack
        assert:
          P1.field.a1: {acted: false}
          P2.field.b2: {hp: 3}

  - name: A4 有指定攻撃、對手沒有アクト狀態的守護：也可以攻擊リーダー
    inherit: A2 對手沒有アクト狀態的守護：指定攻撃 可以打直立的ファイター
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: s1, targets: {1: [a1]}}
      - {n: 2, by: P1, at: main, do: attack, attacker: a1, target: P2.leader}
      - {n: 3, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 17
          P2.field.b2: {hp: 3}
        events:
          - {kind: ダメージ, source: a1, target: P2.leader, amount: 3}

  - name: B1 對手只有直立的守護：指定攻撃 從者可以攻擊リーダー（直立的守護不作用）
    inherit: A 對手有アクト狀態的守護：指定攻撃 也不能打直立從者或リーダー，只能打守護；攻擊者不受傷
    setup:
      players:
        P2:
          zones:
            field:
              - {id: b1, card: BP01-176}          # 天剣の乙女 4/6 守護（スタンド）
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: s1, targets: {1: [a1]}}
      - {n: 2, by: P1, at: main, do: attack, attacker: a1, target: P2.leader}
      - {n: 3, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 17
          P2.field.b1: {hp: 6, acted: false}
          P1.field.a1: {acted: true, hp: 3}
        events:
          - {kind: 攻撃, attacker: a1, target: P2.leader}
          - {kind: ダメージ, source: a1, target: P2.leader, amount: 3}

  - name: B2 對手只有直立的守護：也可以選擇攻擊那隻直立的守護（12.11.2）；攻擊者不受傷
    inherit: B1 對手只有直立的守護：指定攻撃 從者可以攻擊リーダー（直立的守護不作用）
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: s1, targets: {1: [a1]}}
      - {n: 2, by: P1, at: main, do: attack, attacker: a1, target: b1}
      - {n: 3, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 20
          P2.field.b1: {hp: 3}
          P1.field.a1: {acted: true, hp: 3}
        events:
          - {kind: 攻撃, attacker: a1, target: b1}
          - {kind: ダメージ, source: a1, target: b1, amount: 3}
        forbidden_events:
          - {kind: ダメージ, target: a1}

  - name: B3 對手有直立守護＋直立非守護：可以攻擊非守護那隻
    inherit: A 對手有アクト狀態的守護：指定攻撃 也不能打直立從者或リーダー，只能打守護；攻擊者不受傷
    setup:
