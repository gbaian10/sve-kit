schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: rule-10.6.2-01
kind: rule
must_pass: true
mechanisms: [10.6.2.2, 10.6.2.3, 5.18.3, 5.18.4.1, '5.12', 打出時的選擇 vs 結算時的選擇, 抉擇＋條件改變選擇數, 打出時的選擇]
cards: [BP21-SL08, SD07-006, SD07-016, SD07-011, BP16-026, BP01-173, BP01-176, BP20-073]
why: >-
  打出時決定：抉擇（5.18.3）、目標（10.6.2.3）、費用；結算時才決定：捨哪張（5.12）。ユリウス的ファンファーレ選【1】【3】時，
  破壞目標在打出時就選好，之後才抽 2 張再捨 1 張（Q2716），捨的可以是剛抽到的。對手場上沒有從者時，【1】不能被選（5.18.3.1.2、Q2715），
  awaiting 只剩不含【1】的組合，且【1】未被選時不需要目標（5.18.4.1）。サンダーレイジ「体力3以下のフォロワーを選んでいたなら」看的是選目標時的體力（Q2665），
  不是造成 6 傷害之後的體力。
discriminates: >-
  A：在結算【3】之後才要求選【1】目標的引擎，after-decision-2 會 paused 等目標而不是等捨牌；捨牌選項若不含剛抽的 a5、a6 也錯。
  B：允許選 [1] 或 [1,3] 的引擎，awaiting 會多出含 1 的組合。C2：在 6 傷害之後才評估「体力3以下」的引擎會對 P2 リーダー多造成 3 傷害（體力變 0 也算 3 以下）。
refs:
  rules: [10.6.2.2, 10.6.2.2.3, 10.6.2.3, 10.6.2.3.1, 10.6.2.3.3, 10.6.2.8.2, 10.6.2.8.2.2, 5.18.2.1, 5.18.3, 5.18.3.1.2, 5.18.4, 5.18.4.1, 5.12.1, 5.10.2, 5.6.1, 5.21.1]
  qa: [Q2716, Q2715, Q2717, Q2665]
evidence:
  - ref: Q2716
    quote: いいえ。できません。カードや能力によって目標を選ぶ場合、そのカードや能力をプレイする際に目標を選びます。今回の場合はチョイスによる選択肢を決定した後、目標を選びます。その後、能力に示された効果を、表記の順にしたがって実行します。
  - ref: Q2715
    quote: いいえ。適切な目標を選ぶことができない場合、このフォロワーの《ファンファーレ》能力で【1】をチョイスすることができず、【2】や【3】をチョイスする必要があります。
  - ref: cr 5.18.4.1
    quote: 存在しないものとして扱われた選択肢内では、‘選ぶ’処理による目標を選択することはなく、そのカードや能力のプレイに際してその適正な目標が存在していなくてもプレイが可能です。
  - ref: cr 5.12.1
    quote: カードを‘捨てる’指示がある場合、指定のプレイヤーは自分の手札のカードを指定枚数選択し、それを自分の墓場に移動します。
    derivation:
      - 「捨てる」是結算時的選擇（不是 10.6.2.3 的「選ぶ」），所以能選剛抽到的卡
  - ref: Q2665
    quote: いいえ。体力3以下のフォロワーを選んでいた場合にのみ、それのリーダーに3ダメージ与えることができます。
    derivation:
      - 「選んでいたなら」參照打出時選目標當下的體力；6 傷害後體力 ≤0 不會回頭滿足「3以下」
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: A／B／C1／C2：xverify-1/result.md:118〈其他驗過的題目〉（Q2716、Q2715）

scenarios:
  - name: A ユリウス【1】【3】：目標在打出時選，抽 2 張後才捨 1 張（可捨剛抽的）
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 4, P2: 3}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 3, max: 4}
          zones:
            hand:
              - {id: a1, card: BP21-SL08}         # レヴィオンの超越者・ユリウス
              - {id: a2, card: SD07-006}          # レヴィオンセイバー・アルベール（レヴィオン）
              - {id: a3, card: SD07-016}          # レヴィオンデューク・ユリウス（レヴィオン）
              - {id: a4, card: BP01-173}          # ファイター（非レヴィオン）
            deck:
              - {id: a5, card: BP01-173}
              - {id: a6, card: BP01-173}
              - {filler: 18}
            cemetery:
              - {id: c1, card: SD07-011}
              - {id: c2, card: SD07-011}
              - {id: c3, card: SD07-011}
              - {id: c4, card: BP16-026}
              - {id: c5, card: BP16-026}          # 墓場のレヴィオン・カード 5 枚 → 3つまで
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 3}
          zones:
            field:
              - {id: b1, card: BP01-173}
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 1}}, costs: {1: [a2, a3]}, options: [1, 3], targets: {1: [b1]}}
      - {n: 3, by: P1, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, select: [a6]}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: paused
        awaiting:
          by: P1
          choices:
            - {do: resolve-choice, select: [a2]}
            - {do: resolve-choice, select: [a3]}
            - {do: resolve-choice, select: [a4]}
            - {do: resolve-choice, select: [a5]}
            - {do: resolve-choice, select: [a6]}
        assert:
          P2.field: []
          P2.cemetery: [b1]
          P1.hand: [a2, a3, a4, a5, a6]
          P1.deck: [filler: 18]
        events:
          - {kind: プレイ, ability: {source: a1, line: 1}}
          - {kind: 破壊, object: b1}
          - {kind: 引く, player: P1, object: a5}
          - {kind: 引く, player: P1, object: a6}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.hand: [a2, a3, a4, a5]
          P1.cemetery: [c1, c2, c3, c4, c5, a6]
          P1.pp.current: 0
          P1.field: [a1]
        events:
          - {kind: 捨てる, player: P1, object: a6}

  - name: B 對手場上沒有從者 → 不能選【1】；awaiting 只剩不含 1 的組合；選【2】【3】照常
    inherit: A ユリウス【1】【3】：目標在打出時選，抽 2 張後才捨 1 張（可捨剛抽的）
    setup:
      players:
        P2:
          zones:
            field: []
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 1}}, costs: {1: [a2, a3]}, options: [2, 3]}
      - {n: 3, by: P1, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, select: [a4]}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, line: 1}}, costs: {1: [a2, a3]}, options: [2]}
            - {do: choose-pending, pending: {ability: {source: a1, line: 1}}, costs: {1: [a2, a3]}, options: [3]}
            - {do: choose-pending, pending: {ability: {source: a1, line: 1}}, costs: {1: [a2, a3]}, options: [2, 3]}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 17
          P1.hand: [a2, a3, a5, a6]
          P1.cemetery: [c1, c2, c3, c4, c5, a4]
        events:
          - {kind: ダメージ, source: a1, target: P2.leader, amount: 3}
          - {kind: 引く, player: P1, object: a5}
          - {kind: 引く, player: P1, object: a6}
          - {kind: 捨てる, player: P1, object: a4}

  - name: C1 サンダーレイジ：選體力 3 的從者 → 6 傷害並對其リーダー 3 傷害
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 5, P2: 4}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 4, max: 5}
          zones:
            hand:
              - {id: a1, card: BP20-073}          # サンダーレイジ
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 5}
          zones:
            field:
              - {id: b1, card: BP01-173}          # ファイター 2/3
              - {id: b2, card: BP01-176}          # 天剣の乙女 4/6
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, targets: {1: [b1]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P2.field: [b2]
          P2.leader.life: 17
        events:
          - {kind: ダメージ, source: a1, target: b1, amount: 6}
          - {kind: ダメージ, source: a1, target: P2.leader, amount: 3}

  - name: C2 選體力 6 的從者 → 6 傷害打死它，但選目標時體力不是 3 以下 → リーダー不受傷
    inherit: C1 サンダーレイジ：選體力 3 的從者 → 6 傷害並對其リーダー 3 傷害
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, targets: {1: [b2]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P2.field: [b1]
          P2.leader.life: 20
        events:
          - {kind: ダメージ, source: a1, target: b2, amount: 6}
          - {kind: 破壊, object: b2}
        forbidden_events:
          - {kind: ダメージ, target: P2.leader}
