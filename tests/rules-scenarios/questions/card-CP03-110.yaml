          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: attack
        attacker: a
        target: P2.leader
      - n: 2
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 1
            keyword: ツインドライブ
            rule: 14.4.6.3
      - n: 3
        by: P1
        at: resolve
        do: resolve-choice
        of:
          decision: 2
          occurrence: 1
        choice: execute
      - n: 4
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 2
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: paused
        assert:
          P1.trigger:
            - t
        awaiting:
          by: P1
          choices:
            - do: resolve-choice
              choice: execute
            - do: resolve-choice
              choice: decline
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.leader.life: 13
          P1.deck:
            - d
            - filler: 20
            - u
          P1.cemetery:
            - t
          P1.hand: []
        awaiting:
          by: P1
          choices:
            - do: choose-pending
