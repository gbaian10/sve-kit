why: 觸發監聽的是實際執行圖示處理，不是單純揭露；ツインドライブ兩次檢查完成後才抽監聽能力的一張。
discriminates: 若見圖示即誘發，拒絕分支會抽牌；若中途結算監聽能力會抽到 u 而非 d。
refs:
  rules:
    - 14.4.5.1.4
    - 14.4.6.3
  qa:
    - Q1418
    - Q1481
evidence:
  - ref: Q1418
    quote: "Q: 「自分のドライブチェックによってトリガーしたとき、～」という能力は、どのようなタイミングで誘発する能力ですか？\nA: 自分のドライブチェックによって、トリガーの処理を実行したときに誘発する能力です。トリガーを持つカードをトリガー領域に置いたとしても、そのトリガーの処理を実行しなかった場合、誘発しません。\n【ツインドライブ】によってドライブチェックを2回行い、2回トリガーの処理を実行した場合、「自分のドライブチェックによってトリガーしたとき、～」という能力が2回誘発して待機状態になります。その後【ツインドライブ】の処理がすべて終了した後のチェックタイミングで待機状態になっている能力を解決します。"
    derivation:
      - 觸發監聽的是實際執行圖示處理，不是單純揭露；ツインドライブ兩次檢查完成後才抽監聽能力的一張。
  - ref: Q1481
    quote: "Q: 【ツインドライブ】を持つフォロワーが攻撃し、1回目のドライブチェックでトリガーを持つカードをトリガー領域に置いた場合、このトリガーの処理と2回目のドライブチェックはどちらを先に行いますか？\nA: トリガーの処理を先に行います。\n1回目のドライブチェックでトリガーを持つカードをトリガー領域に置いた場合、そのトリガーの処理を含むドライブチェックの処理がすべて終了した後に2回目のドライブチェックを行います。\n\n例えば、【ツインドライブ】による1回目のドライブチェックでドロートリガーをトリガー領域に置き、そのトリガーの処理を実行した場合、1枚引き、トリガー領域のカードを墓場に置いた後に2回目のドライブチェックを行います。\nトリガーの処理を実行しなかった場合やトリガーを持たないカードをトリガー領域に置いた場合は、そのカードをデッキの下に置いた後に2回目のドライブチェックを行います。"
    derivation:
      - 觸發監聽的是實際執行圖示處理，不是單純揭露；ツインドライブ兩次檢查完成後才抽監聽能力的一張。
  - ref: cr 14.4.5.1.4
    quote: 14.4.5.1.3 により指定された処理を実 行した場合、この時点でそのプレイヤーの ‘トリガーしたとき’の誘発条件が満たされ ます。
    derivation:
      - 觸發監聽的是實際執行圖示處理，不是單純揭露；ツインドライブ兩次檢查完成後才抽監聽能力的一張。
  - ref: cr 14.4.6.3
    quote: ‘【ツインドライブ】’は‘【攻撃時】 ドライブ チェックを 1 回行い、その後ドライブチェックを 1 回行う’を意味します。
    derivation:
      - 觸發監聽的是實際執行圖示處理，不是單純揭露；ツインドライブ兩次檢查完成後才抽監聽能力的一張。
