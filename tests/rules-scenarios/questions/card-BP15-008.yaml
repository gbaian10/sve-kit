          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - id: d1
                card: BP01-171
              - id: d2
                card: BP01-173
            hand:
              - id: s1
                card: BP15-008
              - id: s2
                card: BP15-008
              - id: kill
                card: BP01-179
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: b
                card: BP01-173
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: s1
        targets:
          1:
            - b
      - n: 2
        by: P1
        at: main
        do: play
        card: s2
        targets:
          1:
            - b
      - n: 3
        by: P1
        at: main
        do: play
        card: kill
        targets:
          1:
            - b
      - n: 4
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: s1
            line: 3
            delayed: true
      - n: 5
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: s2
            line: 3
            delayed: true
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.cemetery:
