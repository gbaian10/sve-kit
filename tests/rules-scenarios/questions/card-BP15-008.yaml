why: 延遲抽牌由每次法術解決各自建立，來源進墓場仍有效；只觀察被選從者本回合的場到墓場，包含同次解決傷害後的規則破壞。同一實體卡換區再上場已是新物件，不延續舊綁定。
discriminates: 把延遲能力放在已離場來源上、同目標只留一份、依卡名或實體 id 綁定、到下回合未到期、把消滅也當死亡，分別造成零抽、一抽、錯誤抽牌或隔回合多抽。
