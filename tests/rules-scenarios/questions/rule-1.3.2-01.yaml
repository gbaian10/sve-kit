schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: rule-1.3.2-01
kind: rule
must_pass: true
mechanisms: [1.3.2, 1.3.2.1, 1.3.2.2, 5.10.1.1, 11.2.2, 12.14.2.1, 11.3.2, 做不到的部分不做；0 單位不發事件, 必殺, 牌庫抽空, 回合特定時點]
cards: [CP02-068, BP01-173, BP12-072, BP16-SL08]
why: >-
  （A）「3枚引く」但牌庫只剩 2 張：能抽的抽（1.3.2），第 3 次抽不到；敗北不是立即而是下一次規則處理（5.10.1.1、11.2.2）→ 檢查時點 game-end。A2 對照：剛好 3 張不敗北。
  （B）攻擊力 0 的モーターグレイブディガー攻擊：0 傷害的行動完全不做、不發事件（1.3.2.2、Q2496 邏輯）；但【必殺】只看「交戦した」（12.14.2.1）→ 對方仍在下次規則處理被破壞（11.3.2），
  攻擊者自己也被交戰傷害破壞。（C）ギンネ【1】對已アクト的從者：「アクトする」因已是該狀態而不做（1.3.2.1）、不發事件，但接續的「次のスタートフェイズにスタンドしない」照樣適用（Q2086），
  對手下個開始階段那隻不會站起。
discriminates: >-
  A：在抽第 3 張時立即判負（不走檢查時點）的引擎，事件順序不同且 A2 沒有差異；把「抽不到」當成整個「3枚引く」失敗的引擎 P1 手牌會是 0。
  B：發出 amount 0 的ダメージ事件、或把必殺實作成「造成傷害才破壞」的引擎，b1 會活著。C：發出アクト事件、或因為アクト沒做就跳過後續效果的引擎，b1 在 P2 開始階段會站起。
refs:
  rules: [1.3.2, 1.3.2.1, 1.3.2.2, 5.10.1.1, 5.10.2, 11.2.2, 11.1.2, 1.2.1, 8.4.3.1, 8.4.9, 8.4.9.1, 8.4.9.2, 12.14.2, 12.14.2.1, 11.3.1, 11.3.2, 5.4.1, 7.2.3]
  qa: [Q2496, Q2086, Q1683]
evidence:
  - ref: cr 5.10.1.1
    quote: この指示の実行の際に、そのプレイヤーのデッキ置き場にカードがない場合、そのプレイヤーは次のルール処理でゲームに敗北します（11.2.2）。
  - ref: cr 1.3.2
    quote: 効果により一定の量の行動を行うよう求められた場合、その一部のみ実行不可能な場合、可能な限りその行動を行います。
  - ref: Q2496
    quote: 自分の場の攻撃力が0のフォロワーが相手の場のフォロワーに攻撃した場合、自分の場の攻撃力が0のフォロワーの攻撃力が0であるため、ダメージを与えるという行動が起こりません。
  - ref: cr 12.14.2.1
    quote: 交戦することのみを条件としているため、実際に（攻撃力が 0 等で）ダメージを与えていない場合でもフォロワーは破壊されます。
  - ref: Q2086
    quote: はい。アクト状態の相手の場のフォロワーを選んだ場合でも、それは次の相手のスタートフェイズにスタンドしません。アクト状態の相手の場のフォロワーを選んだ場合、「それをアクトする。」は既にアクト状態なため単に行われず、続く効果である「それは次の相手のスタートフェイズにスタンドしない。」が適用されます。
  - ref: cr 1.3.2.1
    quote: すでにある状態にあるものを改めてその状態にするよう求められた場合、それは改めてその状態になるわけではなく、その行為自体が行われません。
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: A：xverify-2/recheck.md:95〈全部改動局面的核對索引〉（11.2.2）；A2／B：xverify-1/result.md:116〈其他驗過的題目〉（11.2.2、12.14.2.1、Q2086）；C：xverify-2/result.md:235〈全部實質核驗局面的索引〉（1.3.2、1.3.2.1、Q2496、Q2086）

scenarios:
  - name: A 「3枚引く」牌庫剩 2 張：抽 2 張，第 3 次抽不到 → 檢查時點依 11.2.2 敗北
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 8, P2: 7}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 4, max: 8}
          zones:
            hand:
              - {id: a1, card: CP02-068}          # モードエスティバル：3枚引く
            deck:
              - {id: a2, card: BP01-173}
              - {id: a3, card: BP01-173}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 8}
          zones:
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: game-end
        assert:
          P1.hand: [a2, a3]
          P1.deck: []
          P1.cemetery: [a1]
          game: {ended: true, winner: P2, by: 11.2.2}
        events:
          - {kind: 引く, player: P1, object: a2}
          - {kind: 引く, player: P1, object: a3}
          - {kind: 解決, object: a1}
          - {kind: 敗北, player: P1, by: rule-11.2.2}

  - name: A2 對照：牌庫剛好 3 張 → 抽 3 張，不敗北
    inherit: A 「3枚引く」牌庫剩 2 張：抽 2 張，第 3 次抽不到 → 檢查時點依 11.2.2 敗北
    setup:
      players:
        P1:
          zones:
            deck:
              - {id: a2, card: BP01-173}
              - {id: a3, card: BP01-173}
              - {id: a4, card: BP01-173}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.hand: [a2, a3, a4]
          P1.deck: []
          game: {ended: false}
        forbidden_events:
          - {kind: 敗北}

  - name: B 攻擊力 0 的必殺從者攻擊：不發 0 傷害事件，但交戰對象仍被必殺破壞；攻擊者被交戰傷害破壞
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 4, P2: 3}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ナイトメア, life: 20}
          pp: {current: 4, max: 4}
          zones:
            field:
              - {id: a1, card: BP12-072}          # モーターグレイブディガー 0/1【必殺】，非本回合進場
            hand:
              - {filler: 2}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 4}
          zones:
            field:
              - {id: b1, card: BP01-173, state: {acted: true}}   # ファイター 2/3（アクト狀態才能當攻擊目標）
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: attack, attacker: a1, target: b1}
      - {n: 2, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.field: []
          P2.field: []
          P1.cemetery: [a1]
          P2.cemetery: [b1]
        events:
          - {kind: 攻撃, attacker: a1, target: b1}
          - {kind: ダメージ, source: b1, target: a1, amount: 2}
          - {kind: 破壊, object: a1, by: rule-11.3.1, group: 1}
          - {kind: 破壊, object: b1, by: rule-11.3.2, group: 1}
        forbidden_events:
          - {kind: ダメージ, target: b1}

  - name: C ギンネ【1】對已アクト的從者：アクト不做、不發事件；「次のスタートフェイズにスタンドしない」仍適用
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 4, P2: 3}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 2, max: 4}
          zones:
            hand:
              - {id: a1, card: BP16-SL08}         # 艶やかなる太夫・ギンネ
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 4}
          zones:
            field:
              - {id: b1, card: BP01-173, state: {acted: true}}
            hand:
              - {filler: 3}
            deck:
              - {id: b2, card: BP01-173}          # P2 開始階段抽到
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 1}}, options: [1], targets: {1: [b1]}}
      - {n: 3, by: P1, at: main, do: end-phase}
      - {n: 4, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b1: {acted: true}
        events:
          - {kind: プレイ, ability: {source: a1, line: 1}}
          - {kind: 解決, ability: {source: a1, line: 1}}
        forbidden_events:
          - {kind: アクト}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          turn: {active: P2, phase: main}
          P2.field.b1: {acted: true}
          P2.hand: [filler: 3, b2]
        forbidden_events:
          - {kind: スタンド, object: b1}
