schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: rule-5.22-01
kind: rule
must_pass: false
mechanisms:
  - 奪取、交換、變身
  - 持續效果與禁止
cards:
  - BP01-144
  - BP01-173
  - BP13-043
  - PR-005
why: 本回合取得控制權的白板不能攻擊主戰者，疾走例外；aura 不阻止自己的渡す指定。
discriminates: 轉移控制仍沿用舊玩家的回合資格會讓白板或 aura 卡非法攻擊。
refs:
  rules:
    - 5.22.4
    - 8.4.3.1
    - 12.9.2
  qa:
    - Q1755
    - Q1749
evidence:
  - ref: Q1755
    quote: "いいえ。攻撃することはできません。\n渡されたフォロワーが【疾走】や【突進】を持っている場合、そのフォロワーは渡されたターンに攻撃することができます。"
  - ref: Q1749
    quote: はい。渡すことができます。【オーラ】は相手の能力によって選ぶことのみを禁止する能力です。
  - ref: cr 5.22.4
    quote: "奪ったまたは渡したカードは新たに場に出たカード\nでは無く、それまでそのカードが持っていた情報や\n状態をすべて引き続き持ちます。"
    derivation:
      - 本回合取得控制權的白板不能攻擊主戰者，疾走例外；aura 不阻止自己的渡す指定。
  - ref: cr 8.4.3.1
    quote: "攻撃目標として選択できるのは、以下のい\nずれかです。\n* 非ターンプレイヤーがマスターであるアクト\n状態のフォロワー1 体\n* 攻撃フォロワーがこのターンの最初から連\n続して自分がマスターである場合、非ターンプ\nレイヤーのリーダー"
    derivation:
      - 本回合取得控制權的白板不能攻擊主戰者，疾走例外；aura 不阻止自己的渡す指定。
  - ref: cr 12.9.2
    quote: "‘【疾走】’は‘このフォロワーは、このターンの最初\nから連続して自分がマスターであった状態でない場\n合でも、攻撃フォロワーとして選択できる’を意味し\nます。"
    derivation:
      - 本回合取得控制權的白板不能攻擊主戰者，疾走例外；aura 不阻止自己的渡す指定。
  - ref: Q1766
    quote: "複数のプレイヤーが同時になんらかの選択を伴う処理を行うよう求められた場合、ターンプレイヤーから先に処理を行います。非ターンプレイヤーは、ターンプレイヤーの処理の内容を知ってから自分の選択を行います。\n以下、処理順です。\n\n①ターンプレイヤーは、自身のフォロワー1体を指定します。\n②非ターンプレイヤーは、自身のフォロワー1体を指定します。（ターンプレイヤーの処理の内容を知ってから自身の選択を行うことができます。）\n③ターンプレイヤーは、指定したフォロワーを自身以外のプレイヤーに渡します。\n④非ターンプレイヤーは、指定したフォロワーを自身以外のプレイヤーに渡します。"
    derivation:
      - 同一句要求雙方各指定；按 Q1766 與 1.3.4 以 P1、P2 兩個輸入點表達。契約 10.7 已明定不同玩家各有一個輸入點；此項不再待裁定。
status: draft
author: astra
verified_by: []
scenarios:
  - name: BP01-173
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            hand:
              - id: s
                card: BP13-043
            field:
              - id: a
                card: BP01-173
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: b
                card: BP01-173
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: s
      - n: 2
        by: P1
        at: resolve
        do: resolve-choice
        of:
          decision: 1
          occurrence: 1
        select:
          - a
      - n: 3
        by: P2
        at: resolve
        do: resolve-choice
        of:
          decision: 1
          occurrence: 2
        select:
          - b
      - n: 4
        by: P1
        at: main
        do: attack
        attacker: b
        target: P2.leader
    random: {}
    expected:
      - at: after-decision-4
        view: omniscient
        outcome: cannot-attack
        assert:
          P1.field.b:
            acted: false
