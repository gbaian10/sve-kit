evidence:
  - ref: Q2575
    quote: はい。『忘我の才媛』が手札にある場合に有効となる能力です。
  - ref: cr 12.18.2
    quote: "‘《起動》 【融合】 （条件）：（効果）’は‘《起動》\n（条件）を満たす他のカードを、手札から捨てるか\nEX エリアから墓場に置く。手札にあるこのカードを\nEX エリアに置く。：（効果）’を意味します。"
    derivation:
      - 融合從手牌起動，材料可來自手牌或 EX；EX 送墓不是捨棄；token 不合格或來源無法進 EX 則回溯。
  - ref: cr 10.4.2.2
    quote: "コストのうち一部または全部を支払うことが\n不可能である場合、このコストはまったく支払\nうことはできません。"
    derivation:
      - 融合從手牌起動，材料可來自手牌或 EX；EX 送墓不是捨棄；token 不合格或來源無法進 EX 則回溯。
  - ref: cr 10.6.2.5.4
    quote: "なんらかの理由でこの時点でこのコス\nトを支払うことができない場合、このカード\nや能力のプレイは取り消され、ゲームはこ\nのカードや能力をプレイすることを選択する\n前まで戻されます。"
    derivation:
      - 融合從手牌起動，材料可來自手牌或 EX；EX 送墓不是捨棄；token 不合格或來源無法進 EX 則回溯。
  - ref: cr 12.18.2
    quote: "‘《起動》 【融合】 （条件）：（効果）’は‘《起動》\n（条件）を満たす他のカードを、手札から捨てるか\nEX エリアから墓場に置く。手札にあるこのカードを\nEX エリアに置く。：（効果）’を意味します。"
    derivation:
      - EX 材料 b 送墓；來源 a 由手牌移到 EX。a 不可能同時留在手牌，故手牌為空。
  - ref: cr 12.18.2
    quote: ‘《起動》 【融合】 （条件）：（効果）’は‘《起動》 （条件）を満たす他のカードを、手札から捨てるか EX エリアから墓場に置く。手札にあるこのカードを EX エリアに置く。：（効果）’を意味します。
  - ref: cr 12.18.3
    quote: なんらかの理由でコストとして手札から捨てられるカードも EX エリアから墓場に移動するカードも存在しない場合、（効果）は実行されません。
  - ref: cr 10.6.2.8.1.1
    quote: 解決領域のカードになんらかの効果が適用されている、またはそのカードになんらかのカウンターが置かれている場合、場に置かれたカードにも同じ効果やカウンターが適用されます。
