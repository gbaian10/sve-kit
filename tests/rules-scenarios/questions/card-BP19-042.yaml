why: "[astra] 融合從手牌起動，材料可來自手牌或 EX；EX 送墓不是捨棄；token 不合格或來源無法進 EX 則回溯。\n[fable] 忘我の才媛「{起動}【融合】トークンでないフォロワー1枚：これに融合カウンター1個を置く」在手牌有效（Q2575）；12.18.2 展開為「從手牌捨（或從 EX 放墓場）1 張符合條件的卡， 再把手牌的這張放到 EX：放融合カウンター」。EX 區的計數器隨打出帶到解決領域與場上（10.6.2.1.3、10.6.2.8.1.1）；ファンファーレ「融合カウンター1個を取る：」付得出才出多頭の実験体。 手牌與 EX 都沒有可融合的卡 → 不能打出（12.18.3）。"
discriminates: "[astra] 場上起動、忽略材料條件、部分付費或 EX 送墓當捨棄都可區分。\n[fable] 沒把融合當成手牌中的起動能力的引擎 A 會 cannot-activate；計數器沒從 EX 帶到場上的引擎，ファンファーレ付不出 → 取消、沒有 token； 允許融合 0 張的引擎 B 會 resolved。"
