why: 兩個進化能力分別收 PP 或三张手牌，不需同時支付；三張不足不能部分支付。
discriminates: 混合兩能力費用或容許只棄兩張會改變進化狀態、手牌或 PP。
refs:
  rules:
    - 12.2.2
    - 10.4.2.2
  qa:
    - Q314
evidence:
  - ref: Q314
    quote: いいえ。このフォロワーが進化するとき、「《コスト2》」と「手札3枚を捨てる」はどちらかを支払えば進化することができます。
  - ref: cr 12.2.2
    quote: "進化能力をプレイする際、コストとして、その能力\nを持つカードのマスターのエボルヴデッキ置き場の\n適正なカード（5.16.1.1.1）1 枚を公開します"
    derivation:
      - 兩個進化能力分別收 PP 或三张手牌，不需同時支付；三張不足不能部分支付。
  - ref: cr 10.4.2.2
    quote: "コストのうち一部または全部を支払うことが\n不可能である場合、このコストはまったく支払\nうことはできません。"
    derivation:
      - 兩個進化能力分別收 PP 或三张手牌，不需同時支付；三張不足不能部分支付。
