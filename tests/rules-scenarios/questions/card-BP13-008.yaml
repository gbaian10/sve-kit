schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP13-008
kind: card
must_pass: true
mechanisms: [名稱包含比對, 2.1.2, 動態數值, 5.18.3.1.2, 抉擇＋條件改變選擇數, 前者／後者]
cards: [BP13-008, BP13-001, BP01-176]
why: >-
  九尾の決意【2】「自分の場の「カード名に『セッカ』を含むフォロワー」1体と相手の場のフォロワー1体を選ぶ。前者は+2/+2する。後者に「前者の攻撃力」と同じダメージ」：
  『宿命の狐火・セッカ』符合包含比對；【1】需要『九火石炎・セッカ』（完全同名）在場，沒有就不能選【1】（5.18.3.1.2、Q1727）→ 合法組合只有 [2]。
  「前者の攻撃力」在造成傷害那一刻讀取 → 已 +2 後的 3（Q1728）。
discriminates: >-
  把『セッカ』當完全同名的引擎選不到前者；先讀攻擊力再 +2 的引擎造成 1 傷害而非 3；允許選 [1] 或 [1,2] 的引擎 awaiting 會多出組合。
refs:
  rules: [2.1.2, 5.18.2.1, 5.18.3.1.2, 5.18.4.1, 10.6.2.3, 10.6.2.8.2, 10.9.1.4]
  qa: [Q1727, Q1728, Q1729]
evidence:
  - ref: Q1729
    quote: はい。その場合にのみ、【2】をチョイスしてプレイすることができます。
  - ref: Q1728
    quote: 前者は「選んだ自分の場の「カード名に『セッカ』を含むフォロワー」」で後者は「選んだ相手の場のフォロワー」です。
  - ref: Q1727
    quote: いいえ。自分の場に選ぶことのできる目標が存在しない場合、『九尾の決意』をプレイすることはできません。
    derivation:
      - 本題【2】有目標 → 可以打出，但【1】不能被選（5.18.3.1.2）
status: verified
author: fable
verified_by:
