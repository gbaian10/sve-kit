evidence:
  - ref: cr 10.10.2
    quote: "同一の事象に対し複数の置換効果が発生してい\nる場合、どの置換効果を先に適用するかは、それに\nより影響を受けるプレイヤーが決定します。"
    derivation:
      - 受影響的 P2 決定 1 點攻擊傷害的加減順序；先減至零則傷害行為消失，先加 2 再減 1 得 2。每個效果最多適用一次。
  - ref: cr 10.10.2.2
    quote: "影響を受ける事象がゲーム中の行動で\nある場合、その行動を実行するプレイヤー、ま\nたはその行動が適用されるカードのマスター\nが決定します。"
    derivation:
      - 受影響的 P2 決定 1 點攻擊傷害的加減順序；先減至零則傷害行為消失，先加 2 再減 1 得 2。每個效果最多適用一次。
  - ref: cr 10.10.2.3
    quote: "同一の事象に対しては、各置換効果は最\n大 1 回しか適用しません。"
    derivation:
      - 受影響的 P2 決定 1 點攻擊傷害的加減順序；先減至零則傷害行為消失，先加 2 再減 1 得 2。每個效果最多適用一次。
  - ref: cr 1.3.2.2
    quote: "なんらかの理由で、ある行動を実行する際\nの単位数や回数が 0 以下である場合、あるい\nは 0 以下の値を基準として数値の加減算や比\n較を除くなんらかの行動を実行する場合、そ\nの行動はまったく行われません。マイナスで\nあっても逆の行動を求められることもありませ\nん。\n例：0 点のダメージを与える処理を実行する指示がある\n場合、そのダメージは与えられません。"
    derivation:
      - 受影響的 P2 決定 1 點攻擊傷害的加減順序；先減至零則傷害行為消失，先加 2 再減 1 得 2。每個效果最多適用一次。
  - ref: Q1944
    quote: "自分の選択により、「ダメージを受けない」もしくは「1ダメージ」のどちらかになります。\n\n与えるダメージや受けるダメージを増減する効果が複数適用される場合、その影響を受けるプレイヤーがその適用順を選択し、効果を適用します。\n今回の場合、ダメージを受けるのは自分のリーダーなので、自分が適用順を選択します。\n『一ツ尾狐』に適用されている「与えるダメージを+1」と『永久の盾・シオン』の「これが場にいる限り、これと自分のリーダーが受けるダメージを-1する。」を任意の順で適用することができます。\n\n①「受けるダメージを-1」→「与えるダメージを+1」の順で適用する場合\n「受けるダメージを-1」を適用し、『一ツ尾狐』が与えるダメージが0ダメージになります。この時点で、0ダメージを与える行動は全く行われなくなるため、ダメージを与えるという行動自体が存在しなくなります。その後、「与えるダメージを+1」を適用しますが、ダメージを与える行動自体がすでに存在しないため、何も適用されません。よって、最終的に「ダメージを与えない」となります。\n\n②「与えるダメージを+1」→「受けるダメージを-1」の順で適用する場合\n「与えるダメージを+1」を適用し、『一ツ尾狐』が与えるダメージが2ダメージになります。その後、「受けるダメージを-1」を適用し、『一ツ尾狐』が与えるダメージが1ダメージになります。"
  - ref: Q2498
    quote: "自分の選択により、「ダメージを受けない」もしくは「2ダメージ」のどちらかになります。\n\n与えるダメージや受けるダメージを増減する効果が複数適用される場合、その影響を受けるプレイヤーがその適用順を選択し、効果を適用します。\n今回の場合、ダメージを受けるのは自分の場の『永久の盾・シオン』なので、自分が適用順を選択します。\n相手の場のフォロワーに適用されている「与えるダメージを+2」と『永久の盾・シオン』の「これが場にいる限り、これと自分のリーダーが受けるダメージを-1する。」を任意の順で適用することができます。\n\n①「受けるダメージを-1」→「与えるダメージを+2」の順で適用する場合\n「受けるダメージを-1」を適用し、相手の場の攻撃力が1のフォロワーが与えるダメージが0ダメージになります。この時点で、0ダメージを与える行動は全く行われなくなるため、ダメージを与えるという行動自体が存在しなくなります。その後、「与えるダメージを+2」を適用しますが、ダメージを与える行動自体がすでに存在しないため、何も適用されません。よって、最終的に「ダメージを受けない」となります。\n\n②「与えるダメージを+2」→「受けるダメージを-1」の順で適用する場合\n「与えるダメージを+2」を適用し、相手の場の攻撃力が1のフォロワーが与えるダメージが3ダメージになります。その後、「受けるダメージを-1」を適用し、相手の場の攻撃力が1のフォロワーが与えるダメージが2ダメージになります。"
