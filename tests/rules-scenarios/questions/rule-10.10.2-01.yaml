why: 受影響的 P2 決定 1 點攻擊傷害的加減順序；先減至零則傷害行為消失，先加 2 再減 1 得 2。每個效果最多適用一次。
discriminates: 固定以加傷優先會錯判第一局；減到零仍繼續加傷會造成 2 傷害。
