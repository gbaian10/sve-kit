why: 神秘の獲得創建的下次自己結束時待機，在來源法術已墓場也生效；消滅當時全部 EX，原有金幣也包括且消去。
discriminates: 只消滅當初新放的卡或要求來源留場，EX 不會清空。
refs:
  rules:
    - 10.7.5
    - 10.7.5.1
    - 9.1.4.4
  qa:
    - Q189
    - Q190
evidence:
  - ref: Q189
    quote: はい。消滅させます。
  - ref: Q190
    quote: はい。消滅させます。
  - ref: cr 10.7.5
    quote: "なんらかの効果により、以降の特定の時点で誘発\n条件が発生する自動能力が作成されることがありま\nす。これを時限誘発と呼びます。"
    derivation:
      - 神秘の獲得創建的下次自己結束時待機，在來源法術已墓場也生效；消滅當時全部 EX，原有金幣也包括且消去。
  - ref: cr 10.7.5.1
    quote: "時限誘発は、特に期限が示されていない\n限り、一度だけ誘発条件を満たします。"
    derivation:
      - 神秘の獲得創建的下次自己結束時待機，在來源法術已墓場也生效；消滅當時全部 EX，原有金幣也包括且消去。
  - ref: cr 9.1.4.4
    quote: "あるトークンが存在できる領域以外の領域\nに移動した場合、その移動を行った直後に、そ\nの領域で消去されます。この処理はチェックタ\nイミングを待たず、なんらかの効果の途中で移\n動を行った場合は、その移動の続きを行うより\nも前に実行されます。"
    derivation:
      - 神秘の獲得創建的下次自己結束時待機，在來源法術已墓場也生效；消滅當時全部 EX，原有金幣也包括且消去。
