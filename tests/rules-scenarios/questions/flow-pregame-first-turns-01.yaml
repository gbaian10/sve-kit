schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: flow-pregame-first-turns-01
kind: flow
must_pass: true
mechanisms: [開局程序, 6.2.1.8, 6.2.1.10, 7.2.1, 7.2.2, 7.2.4, 7.2.4.1, 7.4.5, 7.4.9, 3.3.2, 後攻第 1 回合抽牌, 回合交替]
cards: [BP01-173, BP01-176]
why: >-
  從開局一路推進到後攻的第 1 回合與先攻的第 2 回合：先攻第 1 回合不抽牌（7.2.4.1），後攻第 1 回合照常抽（7.2.4）、PP 最大值 0→1 並補滿（7.2.1、7.2.2）、EP 維持開局的 3（6.2.1.10）；
  換牌放到牌庫底的牌在牌庫最底（6.2.1.8），先攻第 2 回合抽的是換牌後牌庫頂的下一張；經過回合數各自計算（3.3.2）。
  結束階段沒有守護從者、手牌未超過上限 → 沒有 guard-act／end-discard 的輸入點（契約 10.1），只有對手的 Quick 時點。
discriminates: >-
  後攻第 1 回合也不抽的引擎 P2.hand 是 4 張；先攻第 1 回合抽牌的引擎在 after-decision-5 之前會出現 P1 的 引く；
  把換牌放到牌庫頂的引擎 P1 第 2 回合會抽到 a2 而不是 a9；PP 沒在開始階段補滿或最大值沒 +1 的引擎 pp 不同；經過回合數共用計數的引擎 elapsed_turns 不同。
refs:
  rules: [6.2.1.7, 6.2.1.8, 6.2.1.9, 6.2.1.10, 6.2.1.14, 7.2.1, 7.2.2, 7.2.4, 7.2.4.1, 7.3.3, 7.4.3, 7.4.5, 7.4.7, 7.4.9, 3.3.2]
  qa: []
evidence:
  - ref: cr 7.2.4.1
    quote: 先攻プレイヤーは、自身の最初のターンではカードを引きません。
    derivation:
      - 只有先攻的**第一回合**不抽；後攻第 1 回合（7.2.4）與先攻第 2 回合都抽
  - ref: cr 7.2.1
    quote: ターンプレイヤーは、自身の PP 最大値が 10 未満である場合は PP 最大値を＋1 します。
    derivation:
      - 開局 PP 最大值 0（6.2.1.9）→ 各自第 1 回合變 1；先攻第 2 回合變 2
  - ref: cr 7.2.2
    quote: ターンプレイヤーは、自身の PP を自身の PP 最大値に等しい値にします。
  - ref: cr 6.2.1.8
    quote: 先攻プレイヤーから順に各プレイヤーは、望むのであれば自分の手札のカードを任意の順で自分のメインデッキの一番下に移動し、自分のデッキの一番上から 4 枚のカードを自分の手札に移動することができます。これは各プレイヤーが 1 回ずつのみ実行できます。
    derivation:
      - 契約 9.8：order 由前到後＝放完後由上到下 → 牌庫底依序 a2, a1, a4, a3
  - ref: cr 3.3.2
    quote: あるプレイヤーの経過ターン数を参照する場合、そのプレイヤーがターンプレイヤーとして、そのターンに初めてスタートフェイズ（7.2）を開始した回数を参照します。
  - ref: cr 7.4.9
    quote: このターンを終えます。その後、このターンの非ターンプレイヤーをターンプレイヤーとして新たなターンを開始します。
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: 第三輪交叉驗證 astra-r3/xverify-1、xverify-2（審 fable-r3），fable-r3/fix-1～fix-3 處理後同意
  - by: sol
    method: independent-derivation
    note: 第三輪最後核對（139 局面逐一推導）；F1、F2 與禁止 vs 置換仲裁已依核對結果修正

scenarios:
  - name: A P2 選後攻 → P1 換牌 → P1 第 1 回合結束 → P2 第 1 回合抽 1、PP 1 → P2 結束 → P1 第 2 回合抽 1、PP 2
    setup:
      pregame: true
      players:
        P1:
          construction: class
          leader: {class: ロイヤル}
          deck_list:
            - {id: a1, card: BP01-173}
            - {id: a2, card: BP01-176}
            - {id: a3, card: BP01-173}
            - {id: a4, card: BP01-176}
            - {id: a5, card: BP01-173}
            - {id: a6, card: BP01-176}
            - {id: a7, card: BP01-173}
            - {id: a8, card: BP01-176}
            - {id: a9, card: BP01-173}
            - {filler: 31}
          evolve_deck_list: []
        P2:
          construction: class
          leader: {class: ロイヤル}
          deck_list:
            - {id: b1, card: BP01-173}
            - {id: b2, card: BP01-176}
            - {id: b3, card: BP01-173}
            - {id: b4, card: BP01-176}
            - {id: b5, card: BP01-173}
            - {filler: 35}
          evolve_deck_list: []
    decisions:
      - {n: 1, by: P2, at: pregame, do: choose-first, first: P1}
      - {n: 2, by: P1, at: pregame, do: mulligan, redo: true, order: [a2, a1, a4, a3]}
      - {n: 3, by: P2, at: pregame, do: mulligan, redo: false}
      - {n: 4, by: P1, at: main, do: end-phase}
      - {n: 5, by: P2, at: quick, do: pass}
      - {n: 6, by: P2, at: main, do: end-phase}
      - {n: 7, by: P1, at: quick, do: pass}
    random:
      first_chooser: P2
      shuffles:
        - {player: P1, zone: deck, result: [a1, a2, a3, a4, a5, a6, a7, a8, a9, filler: 31]}
        - {player: P2, zone: deck, result: [b1, b2, b3, b4, b5, filler: 35]}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          turn: {active: P1, first_player: P1, phase: main}
          turn.elapsed_turns: {P1: 1, P2: 0}
          P1.pp: {current: 1, max: 1}
          P2.pp: {current: 0, max: 0}
          P1.ep: 0
          P2.ep: 3
          P1.hand: [a5, a6, a7, a8]
          P1.deck: [a9, filler: 31, a2, a1, a4, a3]
          P2.hand: [b1, b2, b3, b4]
          P2.deck: [b5, filler: 35]
        forbidden_events:
          - {kind: 引く}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        awaiting:
          by: P2
        assert:
          turn: {active: P1, phase: end}
      - at: after-decision-5
        view: omniscient
        outcome: resolved
        awaiting:
          by: P2
        assert:
          turn: {active: P2, first_player: P1, phase: main}
          turn.elapsed_turns: {P1: 1, P2: 1}
          P2.pp: {current: 1, max: 1}
          P2.ep: 3
          P2.sep: 1
          P2.hand: [b1, b2, b3, b4, b5]
          P2.deck: [filler: 35]
          P1.pp: {current: 1, max: 1}
          P1.hand: [a5, a6, a7, a8]
        events:
          - {kind: 引く, player: P2, object: b5, by: rule-7.2.4}
        forbidden_events:
          - {kind: 引く, player: P1}
      - at: after-decision-7
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
        assert:
          turn: {active: P1, first_player: P1, phase: main}
          turn.elapsed_turns: {P1: 2, P2: 1}
          P1.pp: {current: 2, max: 2}
          P2.pp: {current: 1, max: 1}
          P1.hand: [a5, a6, a7, a8, a9]
          P1.deck: [filler: 31, a2, a1, a4, a3]
          P2.hand: [b1, b2, b3, b4, b5]
        events:
          - {kind: 引く, player: P1, object: a9, by: rule-7.2.4}
        forbidden_events:
          - {kind: 引く, player: P2}
