schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: rule-5.5.3-01
kind: rule
must_pass: true
mechanisms:
  - 卡片出處
  - 持續效果與禁止
cards:
  - BP01-173
  - BP17-077
  - BP17-P18
why: 有其他機械使ニコラ持突進；從 EX 打出還得到指定攻擊，所以進場當回合可以攻擊直立目標，手牌來源不行。
discriminates: 若忽略出處或誤把突進當指定攻擊，兩分支的攻擊合法性不同。
refs:
  rules:
    - 5.5.3
    - 12.11.2
    - 12.10.2
  qa:
    - Q2232
    - Q2252
evidence:
  - ref: Q2232
    quote: はい。EXエリアやデッキや墓場などから出た場合、条件を満たします。
  - ref: Q2252
    quote: "はい。永続能力です。自分の場に他の機械・フォロワーがいる限り、『永続の機構・ニコラ』は【突進】と【必殺】を持ちます。\n『永続の機構・ニコラ』を場に出した後に自分の場に他の機械・フォロワーを出した場合、【突進】と【必殺】を持ちます。\n『永続の機構・ニコラ』を場に出した後に自分の場の他の機械・フォロワーが0体になった場合、【突進】と【必殺】を失います。"
  - ref: cr 5.5.3
    quote: "カードが‘（領域）から場に出る’ことを参照する場\n合、それはそのカードがその領域から直接場に出る\nこと、およびそのカードがその領域からプレイされた\n後解決領域で解決されて場に出ることの両方を参\n照します。同様に、カードが‘（領域）以外から場に出\nる’ことを参照する場合、それはそのカードがその領\n域でも解決領域でもない領域から直接場に出るこ\nと、およびそのカードがその領域以外の領域からプ\nレイされた後解決領域で解決されて場に出ることの\n両方を参照します。"
    derivation:
      - 有其他機械使ニコラ持突進；從 EX 打出還得到指定攻擊，所以進場當回合可以攻擊直立目標，手牌來源不行。
  - ref: cr 12.11.2
    quote: "‘【指定攻撃】’は‘このフォロワーは、相手のスタ\nンド状態のフォロワーを、それがアクト状態であるか\nのように攻撃目標として選択できる’を意味します。"
    derivation:
      - 有其他機械使ニコラ持突進；從 EX 打出還得到指定攻擊，所以進場當回合可以攻擊直立目標，手牌來源不行。
  - ref: cr 12.10.2
    quote: "‘【突進】’は‘このフォロワーは、このターンの最\n初から連続して自分がマスターであった状態でない\n場合でも、攻撃目標としてアクト状態のフォロワーを\n選ぶ場合にのみ攻撃フォロワーとして選択できる’を\n意味します。"
    derivation:
      - 有其他機械使ニコラ持突進；從 EX 打出還得到指定攻擊，所以進場當回合可以攻擊直立目標，手牌來源不行。
status: verified
author: astra
verified_by:
  - by: fable
    method: qa
    note: Q2232、5.5.3、12.11.2、Q2252；xverify-1/result.md〈其他驗過的題目〉；遷移 entered_from 純格式 xverify-2/result.md 3/3
scenarios:
  - name: hand
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            hand:
              - id: a
                card: BP17-P18
            field:
              - id: m
                card: BP17-077
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: b
                card: BP01-173
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: a
      - n: 2
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 2
      - n: 3
        by: P1
        at: main
        do: attack
        attacker: a
        target: b
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: cannot-attack
        assert:
          P1.field.a:
            acted: false
            entered_from: hand
            entered_by: play
