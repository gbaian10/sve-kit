schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-EBD02-005
kind: card
must_pass: true
mechanisms: [效果中打出卡片, 「コストを0にしてプレイする」, 10.4.4.1, 13.3.1.3, 13.3.1.4, スペルチェイン 不算解決中的自己, 10.6.2.8.3, 13.2.1.3, 12.2.3]
cards: [EBD02-004, EBD02-005, BP01-065, BP10-053, BP14-050, BP16-055, BP01-173, BP01-176]
why: >-
  マーリン（進化後）【進化時】「自分の墓場の元のコスト3以下のスペル1枚を選ぶ。それのコストを0にしてプレイする」。被打出的法術經 10.6 的完整程序：離開墓場進入解決領域（10.6.2.1），
  所以自己的【スペルチェイン】不把它算進墓場（13.3.1.3；Q246：10 張時打出運命の導き → 只剩 9 → SC10 不成立）；解決後回墓場（Q186、10.6.2.8.3）；
  這次打出算本回合打出的張數（13.2.1.3）。費用 0 → PP 不變。C：墓場沒有符合的法術 → 必選的目標選不到 → 待機取消。
discriminates: >-
  A／B：把解決中的法術仍算在墓場的引擎，A 會回復 1 PP；反之算對的引擎只有 B（11 張）回復。
  把「コストを0にしてプレイ」做成直接執行效果而不經打出程序的引擎：不會有 プレイ 事件、cards_played 不會加 1、SC 的張數也會算錯。
refs:
  rules: [10.6.2.1, 10.6.2.8.2, 10.6.2.8.3, 10.4.4.1, 13.3.1.2, 13.3.1.3, 13.3.1.4, 13.2.1.3, 12.2.3, 10.6.2.3.3, 10.7.3.2, 5.15.1.1]
  qa: [Q246, Q186, Q199]
evidence:
  - ref: Q246
    quote: いいえ。『運命の導き』はプレイしたとき墓場ではなく解決領域にあるため、墓場のスペルは9枚となり、【スペルチェイン_10】の条件は満たしません。
  - ref: Q186
    quote: はい。効果の解決後、墓場に置かれます。
  - ref: cr 13.3.1.3
    quote: このカード自身の解決中はこのカードはまだ解決領域にあるため、このカードは自身の墓場のスペルの枚数に数えません。
  - ref: cr 13.2.1.3
    quote: このプレイしていた枚数ではあらゆる領域からプレイされていたカードを、カードがトークンであるか否かに関係なく数えます。
    derivation:
      - 從墓場被效果打出的法術也是「プレイしていたカード」→ cards_played +1
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: 第三輪交叉驗證 astra-r3/xverify-1、xverify-2（審 fable-r3），fable-r3/fix-1～fix-3 處理後同意
  - by: sol
    method: independent-derivation
    note: 第三輪最後核對（139 局面逐一推導）；F1、F2 與禁止 vs 置換仲裁已依核對結果修正

scenarios:
  - name: A 墓場 10 張法術 → 打出運命の導き（費用 0）→ 墓場只剩 9 → 不回復 PP → 解決後回墓場
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 4, P2: 3}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ウィッチ, life: 20}
          pp: {current: 4, max: 4}
          ep: 2
          zones:
            field:
              - {id: a1, card: EBD02-004}          # マーリン 3/2
            evolve_deck:
              - {id: e1, card: EBD02-005}
            hand:
              - {filler: 1}
            deck:
              - {id: d1, card: BP01-173}
              - {id: d2, card: BP01-176}
              - {filler: 18}
            cemetery:
              - {id: s1, card: BP01-065}           # 運命の導き（コスト3、SC10 回復 1 PP）
              - {id: s2, card: BP01-065}
              - {id: s3, card: BP10-053}
              - {id: s4, card: BP10-053}
              - {id: s5, card: BP14-050}
              - {id: s6, card: BP14-050}
              - {id: s7, card: BP16-055}
              - {id: s8, card: BP16-055}
              - {id: s9, card: BP10-053}
              - {id: s10, card: BP14-050}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 4}
          zones:
            field:
              - {id: b1, card: BP01-173}
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: evolve, source: a1, ability: {source: a1, line: 1}, evolve_card: e1, pay: {pp: 1, ep: 1, sep: 0}}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, card: EBD02-005, line: 1}}, targets: {1: [s1]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, card: EBD02-005, line: 1}}, targets: {1: [s1]}}
            - {do: choose-pending, pending: {ability: {source: a1, card: EBD02-005, line: 1}}, targets: {1: [s2]}}
            - {do: choose-pending, pending: {ability: {source: a1, card: EBD02-005, line: 1}}, targets: {1: [s3]}}
            - {do: choose-pending, pending: {ability: {source: a1, card: EBD02-005, line: 1}}, targets: {1: [s4]}}
            - {do: choose-pending, pending: {ability: {source: a1, card: EBD02-005, line: 1}}, targets: {1: [s5]}}
            - {do: choose-pending, pending: {ability: {source: a1, card: EBD02-005, line: 1}}, targets: {1: [s6]}}
            - {do: choose-pending, pending: {ability: {source: a1, card: EBD02-005, line: 1}}, targets: {1: [s7]}}
            - {do: choose-pending, pending: {ability: {source: a1, card: EBD02-005, line: 1}}, targets: {1: [s8]}}
            - {do: choose-pending, pending: {ability: {source: a1, card: EBD02-005, line: 1}}, targets: {1: [s9]}}
            - {do: choose-pending, pending: {ability: {source: a1, card: EBD02-005, line: 1}}, targets: {1: [s10]}}
        assert:
          P1.pp.current: 3
          P1.ep: 1
          P1.field.a1: {evolved: true, evolved_with: e1, power: 4, hp: 3}
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 3
          P1.hand: [d1, d2, filler: 1]
          P1.deck: [filler: 18]
          P1.cemetery: [s1, s2, s3, s4, s5, s6, s7, s8, s9, s10]
          P1.resolution: []
          semantic_state.counters_this_turn: {P1.cards_played: 1}
        events:
          - {kind: プレイ, object: s1}
          - {kind: 引く, player: P1, object: d1}
          - {kind: 引く, player: P1, object: d2}
          - {kind: 移動, object: s1, from: P1.resolution, to: P1.cemetery}
        forbidden_events:
          - {kind: 回復}

