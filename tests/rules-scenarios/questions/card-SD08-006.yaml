schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-SD08-006
kind: card
must_pass: true
mechanisms: [條件管到段落結尾, 〜なら、A。B。, 10.4.7.1, 10.6.2.8.2, 體力門檻一次判定, 10.5.2.2, 10.5.2.3, 兩個ファンファーレ 自選順序, 10.7.3.2]
cards: [SD08-006, BP01-173, BP01-P25]
why: >-
  《世界》・ゼルガネイア 的第一個ファンファーレ「相手の場のフォロワー1体を選ぶ。自分の場に他のフォロワーがいないなら、それを破壊する。1枚引く。」：
  「なら」的條件管到**段落結尾**——不成立時連「1枚引く」也不做（Q1373）；但目標仍必須選（Q1350：選不到就整個不能打出）。
  第二個ファンファーレ 是另一段落，不受第一段的條件影響（B：體力 10 → +5）。
  C（Q1353）：體力 11，先結算第一段破壞ラビットネクロマンサー → 它的ラストワード 待機（P2 的），但依 10.5.2.2 回合玩家 P1 的第二段先結算 → 11 > 10 不回復 → 之後ラストワード 才讓體力變 9。
  D（Q1350）：對手沒有從者 → 第一段不能打出（待機取消一次）、不抽牌；第二段照常。
discriminates: >-
  把「なら」只管到「それを破壊する」的引擎：B 會多抽 1 張。把第一段條件延伸到第二段的引擎：B 不會回復。
  用誘發時間戳排序（讓 P2 的ラストワード 先於 P1 第二段結算）的引擎：C 會先變 9 再 +5 → 14。D 中沒有目標仍讓第一段結算的引擎會抽 1 張。
refs:
  rules: [10.6.2.8.2, 10.6.2.3.1, 10.6.2.3.3, 10.7.3.2, 10.5.2.2, 10.5.2.3, 10.7.3.1, 12.5.3]
  qa: [Q1373, Q1350, Q1351, Q1353]
evidence:
  - ref: Q1373
    quote: いいえ。自分の場に他のフォロワーがいる場合、相手の場のフォロワーを選ぶことができたとしても、「自分の場に他のフォロワーがいないなら、」以降の効果は働かず、1枚引くことができません。
  - ref: Q1353
    quote: いいえ。できません。『《世界》・ゼルガネイア』の《ファンファーレ》能力によって、『ラビットネクロマンサー』を破壊した際、『ラビットネクロマンサー』の《ラストワード》能力が誘発し待機状態になりますが、待機状態の自動能力はターンプレイヤーから解決するため、先に「《ファンファーレ》自分のリーダーの体力が10以下なら、自分のリーダーは《体力》+5する。」を解決します。この時点で自分のリーダーの体力は11なので、体力を+5することはできず、この能力の解決後に『ラビットネクロマンサー』の《ラストワード》能力によって自分のリーダーの体力が9になります。
  - ref: Q1350
    quote: いいえ。相手の場のフォロワーを選ぶことができない場合、この《ファンファーレ》能力をプレイすることができず、1枚引くことができません。
  - ref: Q1351
    quote: 任意の順番で解決することができます。
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: A／B／C／D：xverify-2/result.md:272〈全部實質核驗局面的索引〉（10.6.2.8.2、10.6.2.3.1、Q1373、Q1350）

scenarios:
  - name: A 沒有其他從者、體力 12：第一段破壞並抽 1；第二段不回復
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 6, P2: 5}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ビショップ, life: 12}
          pp: {current: 6, max: 6}
          zones:
            hand:
              - {id: a1, card: SD08-006}          # 《世界》・ゼルガネイア 5/5
            deck:
              - {id: d1, card: BP01-173}
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 5}
          zones:
            field:
              - {id: b1, card: BP01-173}          # ファイター 2/3
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 1}}, targets: {1: [b1]}}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 1
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, line: 1}}}
            - {do: choose-pending, pending: {ability: {source: a1, line: 2}}}
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.field: []
          P1.hand: [d1]
        events:
          - {kind: 破壊, object: b1}
          - {kind: 引く, player: P1, object: d1}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.leader.life: 12
        forbidden_events:
          - {kind: 体力増加}

  - name: B 有其他從者、體力 10：第一段選了目標但不破壞也不抽；第二段（另一段落）照常 +5
    inherit: A 沒有其他從者、體力 12：第一段破壞並抽 1；第二段不回復
    setup:
      players:
        P1:
          leader: {class: ビショップ, life: 10}
          zones:
            field:
              - {id: a2, card: BP01-173}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 1}}, targets: {1: [b1]}}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.field: [b1]
          P1.hand: []
        events:
          - {kind: プレイ, ability: {source: a1, line: 1}}
          - {kind: 解決, ability: {source: a1, line: 1}}
        forbidden_events:
          - {kind: 破壊}
          - {kind: 引く}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.leader.life: 15
        events:
          - {kind: 体力増加, target: P1.leader, amount: 5}

  - name: C 體力 11、破壞ラビットネクロマンサー：P1 的第二段先於 P2 的ラストワード 結算 → 不回復 → 之後才變 9
    inherit: A 沒有其他從者、體力 12：第一段破壞並抽 1；第二段不回復
    setup:
      players:
        P1:
          leader: {class: ビショップ, life: 11}
        P2:
          zones:
            field:
              - {id: b1, card: BP01-P25}          # ラビットネクロマンサー 3/3（ラストワード リーダーすべてに2ダメージ）
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 1}}, targets: {1: [b1]}}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}}
      - {n: 4, by: P2, at: check-timing, do: choose-pending, pending: {ability: {source: b1, line: 1}}}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.field: []
          P2.cemetery: [b1]
          P1.hand: [d1]
          P1.leader.life: 11
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, line: 2}}}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.leader.life: 11
        forbidden_events:
          - {kind: 体力増加}
        awaiting:
          by: P2
          choices:
            - {do: choose-pending, pending: {ability: {source: b1, line: 1}}}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P1.leader.life: 9
          P2.leader.life: 18
        events:
          - {kind: ダメージ, source: b1, target: P1.leader, amount: 2, group: g1}
          - {kind: ダメージ, source: b1, target: P2.leader, amount: 2, group: g1}

  - name: D 對手沒有從者、體力 10：第一段選不到目標 → 待機取消、不抽；第二段照常 +5
    inherit: A 沒有其他從者、體力 12：第一段破壞並抽 1；第二段不回復
    setup:
      players:
        P1:
          leader: {class: ビショップ, life: 10}
        P2:
          zones:
            field: []
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 1}}, targets: {1: []}}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: pending-cancelled
        assert:
          P1.hand: []
        events:
          - {kind: 待機取消, ability: {source: a1, line: 1}}
        forbidden_events:
          - {kind: 引く}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.leader.life: 15
          P1.hand: []
