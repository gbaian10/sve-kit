# 試作 p2 遷移到 v2。修正：token 一ツ尾狐不能斷言在墓場（9.1.4.4 立即消去，改用事件 消去）；局面 C 墓場不用 filler（留空即可讓 NC_20 不成立）。
schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP15-079
kind: card
must_pass: true
mechanisms: [10.7.4.2, 10.7.3.2, 11.1.3, 9.1.4.4, 同時離場的互相誘發, 持續效果與禁止]
cards: [BP15-079, BP15-T06, BP01-180, BP01-131, EBD03-014, SD02-002]
why: >-
  テラーバンケット・ギンセツ「自分の他の妖怪・フォロワーが場を離れたとき」與一ツ尾狐（妖怪 token）同時被破壞時，依 10.7.4.2 仍誘發（Q2021 直接）。
  局面 A 用エンジェルバレッジ＋既有傷害讓兩隻由規則處理（11.3.1、11.1.3 同時）破壞，對手場上留有目標，效果可觀察；
  局面 B 是 Q2021 原題：誘發但打出時選不到目標 → 待機取消一次（10.7.3.2）；局面 C 對照：先後離場 → 不誘發。
  一ツ尾狐是 token，進墓場後立即消去（9.1.4.4）。
discriminates: >-
  逐張處理離場、且在ギンセツ已離場後才檢查一ツ尾狐離場的實作，局面 A 不會待機（b1 體力 3、P2 體力 20）；
  局面 B 若把「選不到目標」實作成回溯整個檢查時點或當成起動失敗，outcome 不是 pending-cancelled；
  局面 C 若把「他の」忽略或讓墓場裡的能力仍有效，會多出一次待機。把 token 留在墓場的實作會在 P1.cemetery 多一張。
refs:
  rules: [10.7.4, 10.7.4.2, 10.7.3.2, 10.5.2.1, 10.5.2.3, 11.1.3, 11.3.1, 5.6.1, 5.14.1, 9.1.4.1, 9.1.4.4, 10.3.5, 12.3.5, 13.5.1.3.1]
  qa: [Q2021, Q2020, Q2022]
evidence:
  - ref: Q2021
    quote: >-
      Q: 自分の場に『テラーバンケット・ギンセツ』と『一ツ尾狐』がいる状況で、『テミスの審判』がプレイされた場合、
      『テラーバンケット・ギンセツ』の能力は誘発しますか？ A: はい。誘発します。
  - ref: Q2020
    quote: 能力によって場のフォロワーが破壊されたり、体力が0以下になった場のフォロワーが破壊された場合、そのフォロワーを場から墓場に置きます。すなわち、『テラーバンケット・ギンセツ』の能力の誘発条件を満たします。
  - ref: cr 10.7.4.2
    quote: >-
      あるカードが領域移動誘発能力を持ち、そのカードがその能力が有効になる領域に入るまたはその領域から出る時に
      いずれかのカードがその領域移動誘発能力の誘発条件を満たす領域移動を行った場合、その誘発条件は満たされたものとします。
    derivation:
      - 局面 A：11.3.1 的破壞是規則處理，多個同時要求時 11.1.3「すべて同時に実行」→ ギンセツ與一ツ尾狐同時離場 → 10.7.4.2 成立
      - 局面 C：決定 1 的檢查時點只有ギンセツ體力 ≤0，先單獨離場；決定 2 時ギンセツ已在墓場、能力只在場上有效（10.3.5），也不是「出る時」→ 不誘發
  - ref: cr 10.7.3.2
    quote: なんらかの理由で、選んだ待機状態の自動能力がプレイできない場合、その待機状態は 1 回取り消されます。
    derivation:
      - 局面 B：テミス把 b1 也破壞了，P1 打出待機能力時「相手の場のフォロワー1体を選ぶ」選不到（10.6.2.3.3）→ 不能打出 → 取消一次
  - ref: cr 9.1.4.4
    quote: あるトークンが存在できる領域以外の領域に移動した場合、その移動を行った直後に、その領域で消去されます。
    derivation:
      - 一ツ尾狐被破壞移到墓場後立即消去；它確實離開了場，所以「場を離れたとき」成立
  - ref: cr 12.3.5
    quote: クイックを持つカードや起動能力は、自分のターンのメインフェイズ中にプレイすることも可能です。
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: A：xverify-2/recheck.md:86〈全部改動局面的核對索引〉（10.7.4、10.7.7）；B／C：xverify-1/result.md:102〈其他驗過的題目〉（10.7.4.2、Q2020、Q2022）

scenarios:
  - name: A 正例：エンジェルバレッジ 讓ギンセツ與一ツ尾狐同時被規則處理破壞 → 誘發，對 b1 與 P2 リーダー各 1 傷害
    setup:
      turn: {active: P2, first_player: P1, elapsed_turns: {P1: 6, P2: 6}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ナイトメア, life: 20}
          pp: {current: 0, max: 6}
          zones:
            field:
              - {id: a1, card: BP15-079, state: {hp: 1}}     # 3/5，再 1 點就死
              - {id: a2, card: BP15-T06, state: {hp: 1}}     # 一ツ尾狐 1/3（妖怪 token），再 1 點就死
            hand:
              - {filler: 2}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 6, max: 6}
          zones:
            field:
              - {id: b1, card: SD02-002}                    # ヴァンガード・レイサム 3/3，能力的目標
            hand:
              - {id: b2, card: BP01-180}                    # エンジェルバレッジ
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P2, at: main, do: play, card: b2}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 1}}, targets: {1: [b1]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, line: 1}}, targets: {1: [b1]}}
        assert:
          P1.field: []
          P1.cemetery: [a1]
          P2.cemetery: [b2]
          P2.pp.current: 5
        events:
          - {kind: ダメージ, source: b2, target: a1, amount: 1, group: 1}
          - {kind: ダメージ, source: b2, target: a2, amount: 1, group: 1}
          - {kind: 破壊, object: a1, by: rule-11.3.1, group: 2}
          - {kind: 破壊, object: a2, by: rule-11.3.1, group: 2}
          - {kind: 消去, object: a2}
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b1: {hp: 2}
          P2.leader.life: 19
          P1.cemetery: [a1]
        events:
          - {kind: プレイ, ability: {source: a1, line: 1}}
          # 「それとそれのリーダーに1ダメージ」是同一個指示 → 同時
          - {kind: ダメージ, source: a1, target: b1, amount: 1, group: 1}
          - {kind: ダメージ, source: a1, target: P2.leader, amount: 1, group: 1}

  - name: B Q2021 原題：テミスの審判 全滅 → 誘發，但打出時選不到目標 → 取消一次
    inherit: A 正例：エンジェルバレッジ 讓ギンセツ與一ツ尾狐同時被規則處理破壞 → 誘發，對 b1 與 P2 リーダー各 1 傷害
    setup:
      players:
        P1:
          zones:
            field:
              - {id: a1, card: BP15-079}
              - {id: a2, card: BP15-T06}
        P2:
          leader: {class: ビショップ, life: 20}
          zones:
            hand:
              - {id: b2, card: BP01-131}                    # テミスの審判
    decisions:
      - {n: 1, by: P2, at: main, do: play, card: b2}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 1}}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, line: 1}}}
        assert:
          P1.field: []
          P2.field: []
          P1.cemetery: [a1]
          P2.cemetery: [b1, b2]
          P2.pp.current: 1
        events:
          - {kind: 破壊, object: a1, group: 1}
          - {kind: 破壊, object: a2, group: 1}
          - {kind: 破壊, object: b1, group: 1}
          - {kind: 消去, object: a2}
      - at: after-decision-2
        view: omniscient
        outcome: pending-cancelled
        assert:
          P2.leader.life: 20
          semantic_state.pending_triggers: []
        events:
          - {kind: 待機取消, ability: {source: a1, line: 1}, event: {left_field: a2}}
        forbidden_events:
          - {kind: プレイ, ability: {source: a1, line: 1}}
          - {kind: ダメージ}

  - name: C 對照：ギンセツ先單獨離場，一ツ尾狐之後才離場 → 都不誘發
    inherit: A 正例：エンジェルバレッジ 讓ギンセツ與一ツ尾狐同時被規則處理破壞 → 誘發，對 b1 與 P2 リーダー各 1 傷害
    setup:
      players:
        P1:
          zones:
            field:
              - {id: a1, card: BP15-079, state: {hp: 4}}     # 4 傷害後死
              - {id: a2, card: BP15-T06, state: {hp: 1}}
        P2:
          leader: {class: ナイトメア, life: 20}
          zones:
            hand:
              - {id: b2, card: EBD03-014}                    # 魂の一刀：4 傷害；墓場為空 → NC_20 不成立
              - {id: b3, card: BP01-180}
    decisions:
      - {n: 1, by: P2, at: main, do: play, card: b2, targets: {1: [a1]}}
      - {n: 2, by: P2, at: main, do: play, card: b3}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.field: [a2]
          P1.cemetery: [a1]
          P1.leader.life: 20
          P2.pp.current: 4
          semantic_state.pending_triggers: []
        events:
          - {kind: ダメージ, source: b2, target: a1, amount: 4}
          - {kind: 破壊, object: a1}
        forbidden_events:
          - {kind: 待機}
          - {kind: ダメージ, target: P1.leader}
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.field: []
          P1.cemetery: [a1]
          P2.field.b1: {hp: 3}
          P2.leader.life: 20
          P2.pp.current: 3
          semantic_state.pending_triggers: []
        events:
          - {kind: 破壊, object: a2}
          - {kind: 消去, object: a2}
        forbidden_events:
          - {kind: 待機}
          - {kind: ダメージ, source: a1}
