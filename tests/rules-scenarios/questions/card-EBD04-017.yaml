why: 自身卡可選帶 aura 的イージス；破壞受禁止或被 stack 取代都不阻止後面加 3 體力與抽牌。
discriminates: 把後句誤當破壞成功條件會少抽牌及加血；stack 當一般破壞會少場上護符。
refs:
  rules:
    - 1.3.2
    - 1.3.3
    - 13.3.2.2
  qa:
    - Q342
evidence:
  - ref: Q342
    quote: はい。『ヘヴンリーイージス』は破壊されず、自分のリーダーは《体力》を+3して、1枚引きます。
  - ref: cr 1.3.2
    quote: "なんらかの理由によりプレイヤーが実行不可能なこ\nとを行うように求められた場合、それは単に行われ\nません。同様に、効果により一定の量の行動を行う\nよう求められた場合、その一部のみ実行不可能な\n場合、可能な限りその行動を行います。"
    derivation:
      - 自身卡可選帶 aura 的イージス；破壞受禁止或被 stack 取代都不阻止後面加 3 體力與抽牌。
  - ref: cr 1.3.3
    quote: "あるカードの効果によりプレイヤーがなんらかの行\n動を行うよう指示された場合に、同時にその行動を\n禁止する効果が発生している場合、常に禁止する\n効果が優先されます。"
    derivation:
      - 自身卡可選帶 aura 的イージス；破壞受禁止或被 stack 取代都不阻止後面加 3 體力與抽牌。
  - ref: cr 13.3.2.2
    quote: "‘【スタック】’は以下の 3 つの能力を意味し\nます。\n* このカードを場に置く場合、その上にスタッ\nクカウンターが 1 個置かれた状態で場に出\nる。\n* このカードにスタックカウンターが置かれて\nいる状態でこのカードが場を離れる場合、代\nわりにこのカードのスタックカウンターを 1 個\n取り除き、このカードは場に残る。\n*\n：自分の他の【スタック】を持つアミュ\nレット 1 つを選ぶ。それにこれのスタックカウン\nターをすべて移す。"
    derivation:
      - 自身卡可選帶 aura 的イージス；破壞受禁止或被 stack 取代都不阻止後面加 3 體力與抽牌。
