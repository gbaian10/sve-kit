id: card-BP20-073
kind: card
must_pass: true
mechanisms:
  - 打出時的選擇
cards:
  - BP01-176
  - BP20-073
why: 先固定被選時體力，再造成 6 傷害；選擇時大於 3 不追加主戰者傷害。
discriminates: 若改查傷害後體力，4 與 9 的局面會錯扣主戰者 3。
refs:
  rules:
    - 10.6.2.3
    - 10.6.2.8.2
  qa:
    - Q2665
evidence:
  - ref: Q2665
    quote: いいえ。体力3以下のフォロワーを選んでいた場合にのみ、それのリーダーに3ダメージ与えることができます。
  - ref: cr 10.6.2.3
    quote: "そのカードや能力が非公開領域のカード\n以外のなんらかの事物を‘選ぶ’場合、それ\n（以下‘目標’）を選びます。"
    derivation:
      - 先固定被選時體力，再造成 6 傷害；選擇時大於 3 不追加主戰者傷害。
  - ref: cr 10.6.2.8.2
    quote: "プレイしたのがスペルや起動能力や\n自動能力である場合、そのテキストや能力\nに示された効果を、表記の順に従って実行\nします。"
    derivation:
      - 先固定被選時體力，再造成 6 傷害；選擇時大於 3 不追加主戰者傷害。
