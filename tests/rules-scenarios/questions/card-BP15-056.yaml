why: 双刃の魔剣士減費看原費用種類，不看墓場張數；0、14、15 都是獨立種類。
discriminates: 把張數當種類會讓五種分支也花2成功；截掉超過10的費用會讓六種分支失敗。
refs:
  rules:
    - 2.5.1
    - 5.24.1
    - 10.4.4.1
  qa: []
evidence:
  - ref: cr 2.5.1
    quote: このカードをプレイする際に支払う必要のある PPの数です（10.4.3）。
  - ref: cr 5.24.1
    quote: あるカードの‘元の’情報を参照する場合、それはそのカード自身に表記されている情報を参照します。
  - ref: cr 10.4.4.1
    quote: カードをプレイする際のコストの数値を変更する効果は、このカードのコストの情報の値を変更するのではなく、そのコストのために減少する PP の点数を変更します。
  - ref: BP15-056
    quote: "これをプレイする際、自分の墓場にあるカードの元のコストの種類数が6種類以上なら、コストを-6する。\n【疾走】\n{ファンファーレ}相手の場のフォロワー2体まで選ぶ。それに3ダメージ。"
status: verified
author: astra
verified_by:
  - by: fable
    method: independent-derivation
    note: 元のコスト種類數、「2体まで」空目標；xverify-2/result.md〈補題〉2/2
