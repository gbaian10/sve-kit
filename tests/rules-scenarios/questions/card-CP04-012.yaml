id: card-CP04-012
kind: card
must_pass: true
mechanisms:
  - 公主連結：UB、裝備
  - 本回合歷史
cards:
  - CP04-012
why: UB 在 class 構築無效；title 仍須能支付橫置費用。
discriminates: 把卡片作品當構築或忽略已橫置都會錯增加 UB 次數。
refs:
  rules:
    - 14.5.1.2
    - 14.5.1.3
    - 10.4.6
  qa: []
evidence:
  - ref: cr 14.5.1.2
    quote: "ユニオンバースト能力は、デッキがクラス\n基準（6.1.1.5.1）で構築されているか、タイトル\n基準（6.1.1.5.2）で構築されていてそのタイトル\nが‘プリンセスコネクト！Re:Dive’でない場合、\nすべての領域で常に無効（10.3.2）です。"
    derivation:
      - UB 在 class 構築無效；title 仍須能支付橫置費用。
  - ref: cr 14.5.1.3
    quote: "ユニオンバースト能力が‘発動した’ことを\n参照する場合、それはその能力が適正にプレ\nイされて（10.6.2.7）解決された（10.6.2.8）ことを\n参照します。"
    derivation:
      - UB 在 class 構築無效；title 仍須能支付橫置費用。
  - ref: cr 10.4.6
    quote: "コストのうち、 は‘場のスタンド状態のこのカード\nをアクトする’を意味します。"
    derivation:
      - UB 在 class 構築無效；title 仍須能支付橫置費用。
status: draft
author: astra
