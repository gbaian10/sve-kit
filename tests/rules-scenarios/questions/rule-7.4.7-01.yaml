scenarios:
  - name: 結束守護橫置；捨牌誘發後再次檢查上限
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - id: draw1
                card: BP01-173
            field:
              - id: g
                card: BP01-176
            hand:
              - id: h0
                card: BP01-173
              - id: h1
                card: BP01-173
              - id: h2
                card: BP01-173
              - id: h3
                card: BP01-173
              - id: h4
                card: BP01-173
              - id: h5
                card: BP01-173
              - id: h6
                card: BP01-173
              - id: h7
                card: BP01-173
              - id: path
                card: BP01-170
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - id: P2-draw
                card: BP01-173
    decisions:
      - n: 1
        by: P1
        at: main
        do: end-phase
      - n: 2
        by: P1
        at: end
        do: guard-act
        select:
          - g
      - n: 3
        by: P2
        at: quick
        do: pass
      - n: 4
        by: P1
        at: end
        do: end-discard
        select:
          - path
          - h7
      - n: 5
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: path
            line: 1
      - n: 6
        by: P1
        at: end
        do: end-discard
        select:
          - draw1
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          turn.phase: end
        awaiting:
          by: P1
          choices:
            - do: guard-act
              select: []
            - do: guard-act
              select:
                - g
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.field.g:
            acted: true
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P1.hand:
            - h0
            - h1
            - h2
            - h3
            - h4
            - h5
            - h6
          P1.cemetery:
            - path
            - h7
      - at: after-decision-5
        view: omniscient
        outcome: resolved
        assert:
          P1.hand:
            - h0
            - h1
            - h2
            - h3
            - h4
            - h5
            - h6
            - draw1
          P1.deck: []
      - at: after-decision-6
        view: omniscient
        outcome: resolved
        assert:
          P1.hand:
            - h0
            - h1
            - h2
            - h3
            - h4
            - h5
            - h6
          P1.cemetery:
            - path
            - h7
            - draw1
          turn.active: P2
          turn.phase: main
          P2.hand:
            - P2-draw
          P1.field.g:
            acted: true
