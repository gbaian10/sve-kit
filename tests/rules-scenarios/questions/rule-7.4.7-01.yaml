schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: rule-7.4.7-01
kind: rule
must_pass: true
mechanisms:
  - 7.4.3
  - 7.4.5
  - 7.4.7
  - 7.4.9
  - 7.2.4
cards:
  - BP01-170
  - BP01-173
  - BP01-176
why: 結束階段先選守護橫置，再經非回合玩家 Quick；9 張手牌捨 2 張，光の道筋誘發抽到 8 張後再次捨到 7，之後才換回合。
discriminates: 把捨牌放在 Quick 前、漏掉捨牌誘發或只檢查一次手牌上限，會留下錯誤手牌或過早換回合。
refs:
  rules:
    - 7.4.3
    - 7.4.5
    - 7.4.7
    - 7.4.9
    - 7.2.4
  qa: []
evidence:
  - ref: cr 7.4.3
    quote: "ターンプレイヤーは、自分のフォロワーのうち【守\n護】を持っているものを望む数選択し、それらをアク\nトします。"
    derivation:
      - 結束階段先選守護橫置，再經非回合玩家 Quick；9 張手牌捨 2 張，光の道筋誘發抽到 8 張後再次捨到 7，之後才換回合。
  - ref: cr 7.4.5
    quote: "非ターンプレイヤーは、以下のいずれかを実行しま\nす。\n* 手札か EX エリアの【クイック】を持つカードを 1 枚\nプレイする（10.6）。\n* 【クイック】を持つ起動能力を 1 つプレイする。\n* 何もしない。"
    derivation:
      - 結束階段先選守護橫置，再經非回合玩家 Quick；9 張手牌捨 2 張，光の道筋誘發抽到 8 張後再次捨到 7，之後才換回合。
  - ref: cr 7.4.7
    quote: "ターンプレイヤーは、自身の手札のカードの枚数が\n手札の上限を超えている場合、超過分の枚数に等\nしい枚数のカードを捨てます。これによりカードを捨\nてた場合、その後にチェックタイミングが発生し、再\nび 7.4.7 に戻ります。"
    derivation:
      - 結束階段先選守護橫置，再經非回合玩家 Quick；9 張手牌捨 2 張，光の道筋誘發抽到 8 張後再次捨到 7，之後才換回合。
  - ref: cr 7.4.9
    quote: "このターンを終えます。その後、このターンの非ター\nンプレイヤーをターンプレイヤーとして新たなターン\nを開始します。\n8. メインフェイズに実行できる処理"
    derivation:
      - 結束階段先選守護橫置，再經非回合玩家 Quick；9 張手牌捨 2 張，光の道筋誘發抽到 8 張後再次捨到 7，之後才換回合。
  - ref: cr 7.2.4
    quote: ターンプレイヤーは、カードを 1 枚引きます。
    derivation:
      - 結束階段先選守護橫置，再經非回合玩家 Quick；9 張手牌捨 2 張，光の道筋誘發抽到 8 張後再次捨到 7，之後才換回合。
status: draft
author: astra
