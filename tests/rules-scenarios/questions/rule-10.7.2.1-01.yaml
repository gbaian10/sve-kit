    method: qa
    note: 10.7.2.1、Q1886；xverify-1/result.md〈對方沒把握的題目〉。之後未再改（非必過）
scenarios:
  - name: 同能力待機 1 次
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: explicit
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: a
                card: BP14-027
            ex:
              - id: f0
                card: BP16-T15
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: b
                card: BP01-176
      semantic_state:
        pending_triggers:
          - id: t0
            controller: P1
            ability:
              source: a
              line: 1
            event:
              entered_ex: f0
        check_timing:
          in_progress: true
          rules_processed: true
    decisions:
      - n: 1
        by: P1
        at: check-timing
        do: choose-pending
        pending: t0
        targets:
          1:
            - b
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 19
          semantic_state.pending_triggers: []
          P2.field.b:
            hp: 3
