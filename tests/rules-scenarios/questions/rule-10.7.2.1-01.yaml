        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: a
                card: BP14-027
            ex:
              - id: f0
                card: BP16-T15
              - id: f1
                card: BP16-T15
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
