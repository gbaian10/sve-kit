why: explicit 列出不同金幣進 EX 的兩個事件，各自對應一次待機，不可按能力指稱去重。此題測既有待機處理，不宣稱測生成金幣事件。
discriminates: 能力去重會在雙待機分支留下 b 或少 1 主戰者傷害。
refs:
  rules:
    - 10.7.2.1
    - 10.7.3
  qa:
    - Q1886
evidence:
  - ref: cr 10.7.2.1
    quote: "自動能力の誘発条件が複数回満たされた\n場合、その自動能力はその回数分待機状態\nになります。"
    derivation:
      - explicit 列出不同金幣進 EX 的兩個事件，各自對應一次待機，不可按能力指稱去重。此題測既有待機處理，不宣稱測生成金幣事件。
  - ref: cr 10.7.3
    quote: "チェックタイミングが発生した段階で、自動能力の\nプレイを求められているプレイヤーは、自身がマス\nターである自動能力のうち待機状態のものを 1 つ選\nび、それをプレイします。プレイされた能力の解決\n後、その自動能力の待機状態が 1 回取り消されま\nす。"
    derivation:
      - explicit 列出不同金幣進 EX 的兩個事件，各自對應一次待機，不可按能力指稱去重。此題測既有待機處理，不宣稱測生成金幣事件。
  - ref: Q1886
    quote: はい。2回誘発します。
status: verified
author: astra
verified_by:
