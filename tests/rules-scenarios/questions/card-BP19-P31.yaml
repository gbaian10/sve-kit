why: ゼラエル必須真的公開九張且九個不同名；八張全異仍失敗。整批洗後放底的亂數明列。
discriminates: 只檢查已公開卡互異會讓八張成功；只數九張會讓重名成功；失敗仍拉advance會把場上換錯。
refs:
  rules:
    - 5.21.1
    - 1.3.2
    - 10.6.2.8.2
    - 4.5.1
  qa:
    - Q2614
evidence:
  - ref: cr 5.21.1
    quote: カードを‘公開する’指示がある場合、そのカードを現在の領域にある状態で、その情報をすべてのプレイヤーに見えるようにします。
  - ref: cr 1.3.2
    quote: なんらかの理由によりプレイヤーが実行不可能なことを行うように求められた場合、それは単に行われません。同様に、効果により一定の量の行動を行うよう求められた場合、その一部のみ実行不可能な場合、可能な限りその行動を行います。
  - ref: cr 10.6.2.8.2
    quote: プレイしたのがスペルや起動能力や自動能力である場合、そのテキストや能力に示された効果を、表記の順に従って実行します。
  - ref: cr 4.5.1
    quote: 各プレイヤーがゲーム開始時に自分のメインデッキ（6.1.1.2）を置く領域です。
  - ref: Q2614
    quote: いいえ。満たしません。
  - ref: BP19-P31
    quote: '{ファンファーレ}自分のデッキの上9枚を公開する。その後、それをシャッフルし、デッキの下に置く。これによってカード名がそれぞれ異なる9枚のカードを公開したなら、これを墓場に置く。自分のエボルヴデッキの『流転の統治者・ゼラエル』1枚を場に出してよい。'
status: draft
author: astra
verified_by: []
