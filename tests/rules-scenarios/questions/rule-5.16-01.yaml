id: rule-5.16-01
kind: rule
must_pass: true
mechanisms:
  - 進化卡自身的能力
cards:
  - BP01-171
  - BP01-172
why: 進化保持同一物件及橫置狀態，將原本攻防與印刷數值差額加到進化卡。
discriminates: 重新生成或回滿體力會使 1 體力局面不是 3；強制直立也會失敗。
refs:
  rules:
    - 5.16.2
    - 5.16.2.1
    - 5.16.1.2
  qa: []
evidence:
  - ref: cr 5.16.2
    quote: "カードが進化した場合においても、そのカードは引\nき続きそれ以前と同一のカードであるとみなされま\nす。それのカードのスタンド/アクト状態は変わらず、\nそれに適用されていた効果も引き続き適用され続け\nます。"
    derivation:
      - 進化保持同一物件及橫置狀態，將原本攻防與印刷數值差額加到進化卡。
  - ref: cr 5.16.2.1
    quote: "進化前のカードの攻撃力や体力が、進化\n前のカードの元の攻撃力や体力と異なってい\nる場合、その差分に等しい値を、進化後の\nカードの表記の攻撃力や体力から加減しま\nす。"
    derivation:
      - 進化保持同一物件及橫置狀態，將原本攻防與印刷數值差額加到進化卡。
  - ref: cr 5.16.1.2
    quote: "これ以降、場のカードに進化領域のカード\nが関連付けられている間、そのカードの情報\nは、コストを除きその進化領域のカードの情報\nを持つものとして扱います（10.9.1.1.1）。"
    derivation:
      - 進化保持同一物件及橫置狀態，將原本攻防與印刷數值差額加到進化卡。
