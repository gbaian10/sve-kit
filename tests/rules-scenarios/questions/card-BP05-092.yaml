why: "[astra] 禁止敗北使零生命可先處理護り手；兩張都已待機，第一張設成 1 也不取消第二張。\n[fable] 古き護り手「これがある限り、自分はバトルに敗北せず、相手はバトルに勝利できない」＋「自分のリーダーの{体力}0以下になったとき、これを墓場に置く。自分のリーダーの{体力}を1にする」。 A（Q775）：深き森の異形「相手のリーダーへの攻撃ダメージを与えたとき、自分はこのバトルに勝利する」與護り手同時誘發；回合玩家 P2 的先結算 → 勝利被禁止效果優先（1.3.3）→ 什麼都沒發生； 再結算護り手 → 體力 1、護り手進墓場。期間 11.2.1 的敗北也被禁止。B（Q749）：牌庫 0 抽牌 → 不敗北。"
discriminates: "[astra] 直接敗北或狀態恢復就清空剩餘待機會產生不同勝負或場上護符。\n[fable] 把 11.2.1 的敗北或「バトルに勝利する」當作不可禁止的引擎會 game-end；讓 P1 的護り手先於回合玩家的異形結算的引擎事件順序不同； B 中把 11.2.2 判負的引擎會 game-end。"
