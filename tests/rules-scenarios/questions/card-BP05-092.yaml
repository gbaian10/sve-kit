evidence:
  - ref: Q750
    quote: いいえ。その場合、このアミュレットを2枚とも墓場に置き、自分のリーダーの体力は1になります。（それぞれ1枚ずつ、誘発した能力を解決します。）
  - ref: cr 1.3.3
    quote: "あるカードの効果によりプレイヤーがなんらかの行\n動を行うよう指示された場合に、同時にその行動を\n禁止する効果が発生している場合、常に禁止する\n効果が優先されます。"
    derivation:
      - 禁止敗北使零生命可先處理護り手；兩張都已待機，第一張設成 1 也不取消第二張。
  - ref: cr 10.7.6.1
    quote: "状態誘発は、その状態が発生したときに\n1 度だけ待機状態になります。この自動能力\nが解決された後、再びその自動能力の誘発条\n件が満たされている場合、その能力は再度待\n機状態になります。"
    derivation:
      - 禁止敗北使零生命可先處理護り手；兩張都已待機，第一張設成 1 也不取消第二張。
  - ref: cr 10.7.7
    quote: "待機状態の自動能力のプレイ時に、その自動能\n力を有していたカードの領域が変わっていた場合で\nも、その自動能力はプレイする義務があります。"
    derivation:
      - 禁止敗北使零生命可先處理護り手；兩張都已待機，第一張設成 1 也不取消第二張。
  - ref: Q775
    quote: …ターンプレイヤーの待機状態になっている能力から優先的に解決します。すなわち、『古き護り手』が自分の場にある状態で『深き森の異形』の能力を先に解決します。 解決する際、…禁止する効果である「自分はバトルに敗北せず、相手はバトルに勝利できない。」が優先されます。…その後、非ターンプレイヤーの待機状態になっている『古き護り手』の能力を解決します。自分のリーダーの体力は1となり、『古き護り手』は墓場に置かれます。
  - ref: Q749
    quote: いいえ。自分の場にこのアミュレットがある限り、自分のデッキが0枚のときにカードを引いても、自分はバトルに敗北しません。そのままバトルが続きます。
  - ref: cr 1.3.3
    quote: あるカードの効果によりプレイヤーがなんらかの行動を行うよう指示された場合に、同時にその行動を禁止する効果が発生している場合、常に禁止する効果が優先されます。
