schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: rule-10.9-01
kind: rule
must_pass: true
mechanisms: [10.9.1.4, 10.9.1.6, 5.16.2.1, 10.9.1.1.1, 持續效果套用順序、時間戳, 進化卡自身的能力]
cards: [BP16-049, BP06-072, BP01-173, BP19-050, BP19-051]
why: >-
  同一層（數值變更，10.9.1.4）的兩個持續效果依發生順序套用（10.9.1.6）：「攻撃力+2」後「攻撃力と体力を1にする」→ 1/1；反過來 → 3/1。
  局面 C 是進化：被設成 1/1 的 2/2 從者進化成 3/3 → Q1923 官方用 5.16.2.1 的「差額」算：差額 −1/−1 帶到進化後 → 2/2，
  不是把「1にする」重新套在 3/3 上得到 1/1。
discriminates: >-
  A／B：不看時間戳、固定「設值後套加減」或「加減後套設值」的實作會在其中一個局面得到不同數值（A 得 3/1 或 B 得 1/1）。
  C：以 10.9.1.1.1 把進化後表記當基準再重套所有持續效果的實作會得 1/1；Q1923 的答案是差額法的 2/2。
refs:
  rules: [10.9.1, 10.9.1.1.1, 10.9.1.4, 10.9.1.6, 10.9.1.6.2, 5.16.2, 5.16.2.1, 12.2.3, 12.6.2, 13.3.1.3]
  qa: [Q1923, Q2104]
evidence:
  - ref: cr 10.9.1.6
    quote: 以上の 10.9.1.2 -10.9.1.5 で適用順の前後が決定されない複数の継続効果が存在する場合、それらの継続効果は、効果が発生した順に従って順番に適用します。
    derivation:
      - 「+2」與「1にする」都是數值變更（10.9.1.4），依 10.9.1.6.2 以打出時點排序；後發生的後套用
  - ref: cr 5.16.2.1
    quote: 進化前のカードの攻撃力や体力が、進化前のカードの元の攻撃力や体力と異なっている場合、その差分に等しい値を、進化後のカードの表記の攻撃力や体力から加減します。
  - ref: Q1923
    quote: 場に出した『モーターグレイブディガー』の攻撃力と体力は1になります。この『モーターグレイブディガー』が進化した場合、攻撃力と体力は2になります。
    derivation:
      - モーターグレイブディガー 0/1 被設成 1/1 → 差額 +1/0 → 進化後表記 1/2 → 2/2。官方用差額，不是重套「1にする」
      - 本題 ライトニングキャット 2/2 被設成 1/1 → 差額 −1/−1 → 進化後 3/3 → 2/2
  - ref: Q2104
    quote: はい。『スノーアウェイク』をプレイして攻撃力と体力が1のフォロワーを選んだ場合でも、自分の墓場のスペルが10枚以上なら、それは能力すべてを失います。
    derivation:
      - 本題 P1 墓場沒有法術（13.3.1.3 自身不算）→ SC_10 不成立，不失去能力
status: verified
author: fable
verified_by:
  - by: astra
    method: qa
    note: A／B／C：xverify-1/result.md:122〈其他驗過的題目〉（10.9.1、5.16.2.1、Q1923）

scenarios:
  - name: A 先「+2」後「1にする」→ 1/1
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 4, P2: 3}, phase: main}
      history: explicit
      semantic_state:
        continuous_effects:
          - {id: e1, source: b2, text: 'それは{攻撃力}+2する', applies_to: [b1], until: game, order: 1}
      players:
        P1:
          construction: class
          leader: {class: ウィッチ, life: 20}
          pp: {current: 2, max: 4}
          zones:
            hand:
              - {id: a1, card: BP16-049}          # スノーアウェイク
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 0, max: 3}
          zones:
            field:
              - {id: b1, card: BP01-173, state: {power: 4, hp: 3}}   # ファイター 2/3 已受 +2
            cemetery:
              - {id: b2, card: BP06-072}          # 武力炎翔（e1 的來源）
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, targets: {1: [b1]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b1: {power: 1, hp: 1}
          P1.pp.current: 0

  - name: B 先「1にする」後「+2」→ 3/1
    setup:
      turn: {active: P2, first_player: P1, elapsed_turns: {P1: 4, P2: 4}, phase: main}
      history: explicit
      semantic_state:
        continuous_effects:
          - {id: e1, source: a1, text: それの攻撃力と体力を1にする, applies_to: [b1], until: game, order: 1}
      players:
        P1:
          construction: class
          leader: {class: ウィッチ, life: 20}
          pp: {current: 0, max: 4}
          zones:
            cemetery:
              - {id: a1, card: BP16-049}          # スノーアウェイク（e1 的來源）
            hand:
              - {filler: 2}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 4, max: 4}
          zones:
            field:
              - {id: b1, card: BP01-173, state: {power: 1, hp: 1}}
            hand:
              - {id: b2, card: BP06-072}          # 武力炎翔
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P2, at: main, do: play, card: b2, targets: {1: [b1]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b1: {power: 3, hp: 1}
          P2.pp.current: 3

  - name: C 被設成 1/1 的 2/2 進化成 3/3 → 差額法 2/2（Q1923）
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 4, P2: 3}, phase: main}
      history: explicit
      semantic_state:
        continuous_effects:
          - {id: e1, source: b2, text: それの攻撃力と体力を1にする, applies_to: [a1], until: game, order: 1}
      players:
        P1:
          construction: class
          leader: {class: ウィッチ, life: 20}
          pp: {current: 2, max: 4}
          ep: 1
          zones:
            field:
              - {id: a1, card: BP19-050, state: {power: 1, hp: 1}}   # ライトニングキャット 2/2 被設成 1/1
            evolve_deck:
              - {id: a2, card: BP19-051}                              # ライトニングキャット（エボルヴ）3/3
            hand:
              - {filler: 2}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ウィッチ, life: 20}
          pp: {current: 0, max: 3}
          zones:
            cemetery:
              - {id: b2, card: BP16-049}          # スノーアウェイク（e1 的來源）
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: evolve, source: a1, ability: {source: a1, line: 1}, evolve_card: a2, pay: {pp: 0, ep: 1, sep: 0}}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, card: BP19-051, line: 1}}, targets: {1: [P2.leader]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, card: BP19-051, line: 1}}, targets: {1: [P2.leader]}}
        assert:
          P1.field.a1: {evolved: true, evolved_with: a2, power: 2, hp: 2}
          P1.pp.current: 2
          P1.ep: 0
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 18
          P1.field.a1: {power: 2, hp: 2}
