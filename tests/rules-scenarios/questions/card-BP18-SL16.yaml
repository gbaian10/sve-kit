schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP18-SL16
kind: card
must_pass: true
mechanisms: [非傷害事件的取代（墓場→消滅）, 10.10.1, 10.2.1.3.1, 12.5.1, ラストワード 不誘發, 費用被取代仍視為已支付, 10.6.2.5.2, 5.6.1, 5.7.1, 12.8.2 place-acted]
cards: [BP18-SL16, BP12-083, BP01-173]
why: >-
  邪智の竜・ファフニール「これが場にいる限り、相手のフォロワーが場から墓場に置かれる際、代わりにそれを消滅させる」是置換效果（10.2.1.3.1）：
  A：對手從者被交戰破壞 → 「場から墓場に置く」被換成消滅（10.10.1.1 原事象完全沒發生）→ ラストワード（12.5.1 以「場から墓場に置いた」為誘發條件）不誘發（Q2346）。
  B：對手用「これを墓場に置く」當費用 → 費用的處理被置換成消滅，但依 10.6.2.5.2 仍視為已支付 → 效果照常（Q2387）。
  C：ファフニール 上場（守護 → place-acted）後ファンファーレ 打死機械鋸 → 消滅、ラストワード 不誘發。『古の英雄』（「消滅しない」）與此置換的交互依協調者裁示 1 拆到 flow-forbid-vs-replace-r3-01（must_pass: false）。
discriminates: >-
  A：先送墓場再移到消滅領域的引擎會誘發ラストワード（多出 待機 與對 P1 從者的破壞）；B：把被置換的費用當成付不出的引擎 cannot-activate、或付了但不算已支付的引擎不會放 2 張到墓場。
  C：把ファンファーレ 的破壞誤當成先進墓場再移動的引擎會多出ラストワード 待機。
refs:
  rules: [10.2.1.3.1, 10.10.1, 10.10.1.1, 12.5.1, 12.5.3, 10.6.2.5.2, 5.6.1, 5.7.1, 8.4.9.1, 11.3.1, 12.4.3, 12.8.2]
  qa: [Q2346, Q2387]
evidence:
  - ref: Q2346
    quote: いいえ。誘発しません。
  - ref: Q2387
    quote: はい。プレイできます。その場合、コストとしてこの『機械鋸の死運び』を墓場に置く代わりに消滅させます。
  - ref: cr 10.6.2.5.2
    quote: コストとして行われる処理の一部が置換効果により他の処理になった場合でも、その元となった処理は実行されたものとみなされます。
  - ref: cr 12.5.3
    quote: ‘ラストワード （テキスト）’は、‘このカードを場から墓場に置いたとき、（テキスト）’を意味します。
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: 第三輪交叉驗證 astra-r3/xverify-1、xverify-2（審 fable-r3），fable-r3/fix-1～fix-3 處理後同意
  - by: sol
    method: independent-derivation
    note: 第三輪最後核對（139 局面逐一推導）；F1、F2 與禁止 vs 置換仲裁已依核對結果修正

scenarios:
  - name: A ファフニール 交戰破壞機械鋸の死運び → 消滅、ラストワード 不誘發
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 9, P2: 8}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 2, max: 9}
          zones:
            field:
              - {id: a1, card: BP18-SL16}                        # ファフニール 7/8
              - {id: a2, card: BP01-173}                         # ファイター（LW 的潛在目標）
            hand:
              - {filler: 2}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ナイトメア, life: 20}
          pp: {current: 3, max: 9}
          zones:
            field:
              - {id: b1, card: BP12-083, state: {acted: true}}   # 機械鋸の死運び 1/1
            hand:
              - {filler: 3}
            deck:
              - {id: m1, card: BP01-173}
              - {id: m2, card: BP01-173}
              - {filler: 18}
    decisions:
      - {n: 1, by: P1, at: main, do: attack, attacker: a1, target: b1}
      - {n: 2, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.field: []
          P2.cemetery: []
          P2.banish: [b1]
          P1.field: [a1, a2]
          P1.field.a1: {hp: 7}
          semantic_state.pending_triggers: []
        events:
          - {kind: ダメージ, source: a1, target: b1, amount: 7}
          - {kind: 取代, object: b1, original: 場から墓場に置く, replacement: 消滅させる}
          - {kind: 消滅, object: b1}
        forbidden_events:
          - {kind: 待機}
          - {kind: 移動, object: b1, to: P2.cemetery}

  - name: B P2 用「これを墓場に置く」當費用 → 被換成消滅，費用仍算已支付 → 照樣放 2 張到墓場
    inherit: A ファフニール 交戰破壞機械鋸の死運び → 消滅、ラストワード 不誘發
    setup:
      turn: {active: P2, first_player: P1, elapsed_turns: {P1: 9, P2: 9}, phase: main}
      players:
        P2:
          zones:
            field:
              - {id: b1, card: BP12-083}
    decisions:
      - {n: 1, by: P2, at: main, do: activate, ability: {source: b1, line: 2}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P2.pp.current: 2
          P2.field: []
          P2.banish: [b1]
          P2.cemetery: [m1, m2]
          P2.deck: [filler: 18]
          semantic_state.pending_triggers: []
        events:
          - {kind: 取代, object: b1, original: これを墓場に置く, replacement: 消滅させる}
          - {kind: 消滅, object: b1}
          - {kind: 費用成立, ability: {source: b1, line: 2}, replaced: true}
          - {kind: 移動, object: m1, from: P2.deck, to: P2.cemetery, group: 1}
          - {kind: 移動, object: m2, from: P2.deck, to: P2.cemetery, group: 1}
        forbidden_events:
          - {kind: 待機}

  - name: C ファンファーレ 8 傷害打死機械鋸 → 消滅、ラストワード 不誘發（古の英雄 部分拆到 flow-forbid-vs-replace-r3-01）
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 9, P2: 8}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 8, max: 9}
          zones:
            field:
              - {id: a2, card: BP01-173}
            hand:
              - {id: h1, card: BP18-SL16}
              - {filler: 1}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ナイトメア, life: 20}
          pp: {current: 0, max: 9}
          zones:
            field:
              - {id: b1, card: BP12-083}
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: h1}
      # ファフニール 有【守護】→ 12.8.2 上場時可選アクト（契約 10.1：一定要寫 place-acted）
      - {n: 2, by: P1, at: resolve, of: {decision: 1, occurrence: 1}, do: place-acted, object: h1, acted: false}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: h1, line: 3}}}
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P1.field: [a2, h1]
          P1.field.h1: {acted: false}
          P2.field: []
          P2.banish: [b1]
          P2.cemetery: []
          P2.leader.life: 16
          semantic_state.pending_triggers: []
        events:
          - {kind: ダメージ, source: h1, target: b1, amount: 8}
          - {kind: ダメージ, source: h1, target: P2.leader, amount: 4}
          - {kind: 消滅, object: b1}
        forbidden_events:
          - {kind: 待機, ability: {source: b1, line: 1}}
