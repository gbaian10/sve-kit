id: card-BP05-007
kind: card
must_pass: true
mechanisms:
  - 前一步的結果
  - 1.3.2
  - token
cards:
  - BP01-173
  - BP05-007
  - BP21-T11
why: 只有真的移入 EX 才加 2 體力；移入兩張也只加一次，token 在 EX 可存在。
discriminates: 按選取數加血、滿 EX 仍算移入或消去 EX token 都會得到不同區域與生命。
refs:
  rules:
    - 1.3.2
    - 9.1.4.1
    - 10.6.2.3.2
  qa:
    - Q676
    - Q678
evidence:
  - ref: Q676
    quote: "いいえ。ゲームからは取り除かれず、EXエリアに置かれます。\nトークンであるフォロワーやアミュレットは場とEXエリアと解決領域でのみ存在できます。それ以外の領域に移動した場合、移動を行った直後に取り除きます。"
  - ref: Q678
    quote: いいえ。2体のフォロワーをEXエリアに置いた場合でも体力は+2します。
  - ref: cr 1.3.2
    quote: "なんらかの理由によりプレイヤーが実行不可能なこ\nとを行うように求められた場合、それは単に行われ\nません。同様に、効果により一定の量の行動を行う\nよう求められた場合、その一部のみ実行不可能な\n場合、可能な限りその行動を行います。"
    derivation:
      - 只有真的移入 EX 才加 2 體力；移入兩張也只加一次，token 在 EX 可存在。
  - ref: cr 9.1.4.1
    quote: "種類がフォロワーやアミュレットであるトーク\nンは、EX エリアか場か解決領域でのみ存在で\nきます。"
    derivation:
      - 只有真的移入 EX 才加 2 體力；移入兩張也只加一次，token 在 EX 可存在。
  - ref: cr 10.6.2.3.2
    quote: "選ぶ数が「～まで」や「好きな枚数」と\n表記されている場合、0 から指定された数\nまでの間の任意の数を実際に選ぶ数として\n指定します。"
    derivation:
      - 只有真的移入 EX 才加 2 體力；移入兩張也只加一次，token 在 EX 可存在。
