schema: sve-exam/2.1
sources:
  rules: cr-1.28.0
  cards_jsonl_sha256: 541781306484527c858c6587a2c838764b0513595b00711751370534050c3fa1
id: card-ECP01-037
kind: card
must_pass: false
mechanisms:
  - 不足數量
  - 印刷費用
  - 抽牌敗北
cards:
  - BP01-173
  - ECP01-037
why: >-
  R-0017（inferred）以實際送墓的卡判斷其印刷費用，至少一張才判定相同。只送墓一張成立，接著須抽牌，牌庫已空而敗北。待官方回覆（svestats）。
discriminates: >-
  若要求成功送墓恰好兩張，玩家會留在對局中。
refs:
  rules:
    - 1.3.2
    - 11.2.2
  qa:
    - Q1130
    - Q1906
  rulings:
    - R-0017
evidence:
  - ref: R-0017
    derivation:
      - 送墓至多現有的一張，該張的原始費用就是全體唯一費用，於空牌庫執行抽牌
status: disputed
author: sol
verified_by:
  - by: opus
    method: independent-derivation
    note: >-
      牌庫 1 張只送墓 1 張（1.3.2）；R-0017 一張即「すべて同じ」成立 → 從空牌庫抽牌，依 11.2.2 敗北；refs Q1130、Q1906 與
      svestats 提問原文一致
scenarios:
  - name: ヒシミラクル送墓最後一張牌後，空牌庫抽牌敗北
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: title
          leader:
            class: ナイトメア
            life: 20
          pp:
            current: 8
            max: 8
          zones:
            deck:
              - id: last
                card: BP01-173
            hand:
              - id: hishi
                card: ECP01-037
          title: ウマ娘 プリティーダービー
        P2:
          construction: class
          leader:
            class: ロイヤル
            life: 20
          pp:
            current: 0
            max: 7
          zones:
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
