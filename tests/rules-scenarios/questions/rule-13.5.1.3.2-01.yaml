  qa: []
evidence:
  - ref: cr 13.5.1.2
    quote: ‘【ネクロチャージ （数値）】（テキスト）’または‘【NC （数値）】（テキスト）’は‘あなたの墓場のカードが（数値）枚以上である場合、（テキスト）’を意味します。
  - ref: cr 13.5.1.3.1
    quote: そのカードの解決中はカード自身はまだ解決領域にあるため、そのカードは自身の墓場のカードの枚数に数えません。
  - ref: cr 13.5.1.3.2
    quote: そのカードや能力のネクロチャージが参照する墓場のカードの枚数は、原則としてそのネクロチャージを含む効果の解決の開始時点で固定され、その解決中にカードの枚数が変わっても変更されません。
  - ref: cr 13.5.1.3.2.1
    quote: チョイス（5.18.3.1）で選択する選択肢の数を決定するために墓場のカードの枚数を参照する場合、それはその能力のプレイの開始時点での枚数を参照します。
  - ref: BP16-082
    quote: "【必殺】\n【ネクロチャージ_5】これは【疾走】を持つ。\n自分のターン中、これが相手のリーダーにダメージを与えたとき、相手のプレイヤーすべては、自身の手札1枚を捨てる。"
  - ref: BP15-U05
    quote: "これをプレイする際、【ネクロチャージ_10】コストを-1する。\n自分の墓場の元のコスト2以下の{ラストワード}を持つ{ナイトメア}フォロワー1枚を選ぶ。それを場に出す。"
  - ref: ETD02-015
    quote: "下記から1つチョイスする。【ネクロチャージ_10】代わりに2つまで。\n【1】自分の墓場のコスト2以下のフォロワー1枚を選ぶ。それを場に出す。【2】『ゴースト』2体を出す。\n『ゴースト』{ナイトメア}死者・フォロワー{コスト1}{攻撃力}1/{体力}1【疾走】自分のエンドフェイズが来たとき、これは消滅する。"
  - ref: EBD03-008
    quote: "【ネクロチャージ_10】これは【突進】【必殺】を持つ。（【必殺】を持つフォロワーと交戦した相手のフォロワーは、ダメージを与え合ったあと破壊される）\n{ファンファーレ}下記から1つチョイスする。【1】自分の墓場の『魂の一刀』1枚を選ぶ。それをEXエリアに置く。【NC_20】このターン、それをプレイする際、コストを-2する。【2】自分のデッキの上2枚を墓場に置く。"
  - ref: EBD03-014
    quote: 相手の場のフォロワー1体を選ぶ。それに4ダメージ。【ネクロチャージ_20】それのリーダーに4ダメージ。
