why: NC 分別出現在常駐疾走、打出減費、打出時模式數及解決中條件。NC20 起始 20 即固定，移走目標至 19 仍給 -2；下一個法術另算 19，不含解決中的自己。
discriminates: 把 NC 一律延到結算會錯放行兩模式或拒絕減費；常駐只判一次會讓降至4後仍可攻擊；解決中重算會漏掉 -2；算入法術本體會多打主戰者4點。
