why: 裝備者離場後失去關聯，規則消去無關聯裝備；裝備不隨從者移往手牌／墓場／消滅區。
discriminates: 把裝備一起搬走或讓裝備永久留區都會使 equipment 或目的區不同。
refs:
  rules:
    - 14.5.2.4
    - 11.11.1
  qa: []
evidence:
  - ref: cr 14.5.2.4
    quote: "トークンを装備しているフォロワーが場から\n場以外の領域に移動した場合、そのフォロ\nワーとそのフォロワーが装備しているトークン\nとの関連付けは失われます。\n15. その他"
    derivation:
      - 裝備者離場後失去關聯，規則消去無關聯裝備；裝備不隨從者移往手牌／墓場／消滅區。
  - ref: cr 11.11.1
    quote: "イクイップメント領域のトークンが場のいずれの\nカードとも関連付けされていない場合、そのトークン\nを消去（9.1.3）します。"
    derivation:
      - 裝備者離場後失去關聯，規則消去無關聯裝備；裝備不隨從者移往手牌／墓場／消滅區。
