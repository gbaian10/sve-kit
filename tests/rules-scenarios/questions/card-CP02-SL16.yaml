id: card-CP02-SL16
kind: card
must_pass: true
mechanisms:
  - 回合特定時點
  - 10.7 其他
cards:
  - BP01-173
  - CP02-SL16
why: 結束時兩張各待機，但第二張結算時生命已 10，不能再加血抽牌。
discriminates: 把條件凍結於誘發時会抽兩張並到 15 生命。
refs:
  rules:
    - 7.4.1
    - 10.6.2.8.2
  qa:
    - Q964
evidence:
  - ref: Q964
    quote: "最終的に、自分のリーダーは体力+5し、1枚引きます。\n処理順は以下になります。\n\n①エンドフェイズが来たとき、それぞれの『高垣楓』の能力が誘発し、待機状態になります。\n②待機状態になったそれぞれの能力を順に解決します。\n③1つ目の『高垣楓』の能力を解決します。自分のリーダーの体力が5なので、自分のリーダーは体力+5し、1枚引きます。\n④2つ目の『高垣楓』の能力を解決します。自分のリーダーの体力が10なので、何も行いません。"
  - ref: cr 7.4.1
    quote: "‘エンドフェイズが来たとき’で示されている誘発条\n件が発生します。"
    derivation:
      - 結束時兩張各待機，但第二張結算時生命已 10，不能再加血抽牌。
  - ref: cr 10.6.2.8.2
    quote: "プレイしたのがスペルや起動能力や\n自動能力である場合、そのテキストや能力\nに示された効果を、表記の順に従って実行\nします。"
    derivation:
      - 結束時兩張各待機，但第二張結算時生命已 10，不能再加血抽牌。
