schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP08-SL19
kind: card
must_pass: true
mechanisms: [結算中宣告任意數字, 契約 10.15 declare, 1.3.5, 「元のコストが指定した数と同じ」, 5.24.1, X 由結果決定, 1.3.2.2, 0 傷害不發生]
cards: [BP08-SL19, BP01-173, BP01-176, BP01-042]
why: >-
  異界を統べる者{ファンファーレ}「好きな数1つを指定する。自分のデッキの上5枚を墓場に置く。相手の場のフォロワーすべてにXダメージ。Xは「これによって墓場に置いた元のコストが指定した数と同じカードの枚数」である」。
  宣告的數是 0 以上的整數（1.3.5），可以宣告牌庫裡沒有的數；X 在放完 5 張後才確定。A：宣告 2 → 5 張中 3 張元のコスト 2 → 3 傷害。
  B：宣告 7 → X＝0 → 0 傷害不發生（1.3.2.2，沒有 ダメージ 事件）。C：宣告 5 → 1 張 → 1 傷害。
  宣告依契約 10.15 寫成結算中第一個輸入點的 resolve-choice `declare`；任意非負整數無法列盡，awaiting 只寫 by（10.15）。
discriminates: >-
  把 X 誤為「放到墓場的張數」的引擎三個局面都是 5 傷害；用現在費用而非元のコスト、或宣告值受牌庫內容限制的引擎在 B 會拒絕決定；
  0 傷害仍產生 ダメージ 事件的引擎在 B 會違反 forbidden_events。
refs:
  rules: [1.3.5, 5.24.1, 1.3.2.2, 5.14.1, 10.6.2.8.2, 11.3.1]
  qa: []
evidence:
  - ref: cr 1.3.5
    quote: プレイヤーがカードやルールによりなんらかの数を選ぶ場合、特に指定がない限り、0 以上の整数を選ぶ必要があります。1 未満の端数を含む数や負の数は選べません。
    derivation:
      - 「好きな数1つを指定する」沒有上限或牌庫內容的限制 → 宣告 7 合法
  - ref: cr 1.3.2.2
    quote: なんらかの理由で、ある行動を実行する際の単位数や回数が 0 以下である場合、あるいは 0 以下の値を基準として数値の加減算や比較を除くなんらかの行動を実行する場合、その行動はまったく行われません。
    derivation:
      - X＝0 → 「0 ダメージ」不發生（條文例示）
  - ref: cr 5.24.1
    quote: あるカードの‘元の’情報を参照する場合、それはそのカードに表記されている情報を参照します。
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: 第三輪交叉驗證 astra-r3/xverify-1、xverify-2（審 fable-r3），fable-r3/fix-1～fix-3 處理後同意
  - by: sol
    method: independent-derivation
    note: 第三輪最後核對（139 局面逐一推導）；F1、F2 與禁止 vs 置換仲裁已依核對結果修正

scenarios:
  - name: A 宣告 2 → 5 張中 3 張元のコスト 2 → 對手全體 3 傷害
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 5, P2: 4}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ニュートラル, life: 20}
          pp: {current: 5, max: 5}
          zones:
            hand:
              - {id: h1, card: BP08-SL19}
              - {filler: 1}
            deck:
              - {id: d1, card: BP01-173}        # コスト2
              - {id: d2, card: BP01-176}        # コスト5
              - {id: d3, card: BP01-173}        # コスト2
              - {id: d4, card: BP01-042}        # コスト1
              - {id: d5, card: BP01-173}        # コスト2
              - {filler: 15}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 5}
          zones:
            field:
              - {id: b1, card: BP01-176}        # 天剣の乙女 4/6
              - {id: b2, card: BP01-173}        # ファイター 2/3
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: h1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: h1, line: 2}}}
      - {n: 3, by: P1, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, declare: 2}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: paused
        awaiting:
          by: P1
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P1.cemetery: [d1, d2, d3, d4, d5]
          P1.deck: [filler: 15]
          P2.field: [b1]
          P2.field.b1: {hp: 3}
          P2.cemetery: [b2]
        events:
          - {kind: ダメージ, source: h1, target: b1, amount: 3, group: 1}
          - {kind: ダメージ, source: h1, target: b2, amount: 3, group: 1}
          - {kind: 破壊, object: b2, by: rule-11.3.1}

  - name: B 宣告 7 → 沒有符合的卡 → X＝0 → 沒有傷害
    inherit: A 宣告 2 → 5 張中 3 張元のコスト 2 → 對手全體 3 傷害
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: h1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: h1, line: 2}}}
      - {n: 3, by: P1, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, declare: 7}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: paused
        awaiting:
          by: P1
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.cemetery: [d1, d2, d3, d4, d5]
          P2.field: [b1, b2]
          P2.field.b1: {hp: 6}
          P2.field.b2: {hp: 3}
        forbidden_events:
          - {kind: ダメージ}
          - {kind: 破壊}

  - name: C 宣告 5 → 1 張 → 1 傷害
    inherit: A 宣告 2 → 5 張中 3 張元のコスト 2 → 對手全體 3 傷害
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: h1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: h1, line: 2}}}
      - {n: 3, by: P1, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, declare: 5}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: paused
        awaiting:
          by: P1
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P2.field: [b1, b2]
          P2.field.b1: {hp: 5}
          P2.field.b2: {hp: 2}
        events:
          - {kind: ダメージ, source: h1, target: b1, amount: 1, group: 1}
          - {kind: ダメージ, source: h1, target: b2, amount: 1, group: 1}
