schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP19-090
kind: card
must_pass: true
mechanisms:
  - 抉擇的最小數量
  - 5.18.2.1
  - 5.18.3.1.2
  - 打出時的可選追加費用
  - 10.6.2.2.2
  - 打出 0 費法術什麼都不做
  - 連擊、覺醒、真紅
  - 抉擇＋條件改變選擇數
cards: [BP19-090, BP01-173]
why: >-
  バイオレントスクリーム「下記から2つまでチョイスする。【1】{コスト1}：…【2】{コスト1}：…」。 Q2622：「2つまで」至少要選 1 個（5.18.2.1：1 以上），不能選 0 個。Q2623：選了之後可以不付{コスト1}，什麼都不發生 → 實際上可以 0 PP 打出這張牌（C 筆記「能否不選模式
  0 PP 打出」的答案：不能不選，但能不付）。 Q2601：對手沒有從者時【1】不能選（5.18.3.1.2）。Q2573：同一選項不能選兩次。 依 R-0006 官方確認（2026-10-09），各選項的可選追加費用在打出時決定並支付（10.6.2.2.2、10.6.2.5），效果按卡面順序結算。
discriminates: >-
  允許 options: [] 的引擎在 B 會 resolved。把{コスト1}當成打出費用（必付）的引擎在 A 會扣 1 PP 或 cannot-play。 沒把打出的這張算進本回合打出張數的引擎，A 的 cards_played 會是 0。C 中允許選【1】的引擎會 resolved。 將付款延到結算的引擎會在
  A／E 額外暫停；把各選項費用分別檢查而未合計，會在 F 錯誤打出。
refs:
  rules:
    - 5.18.2.1
    - 5.18.2.2
    - 5.18.3
    - 5.18.3.1.2
    - 5.18.4.1
    - 10.6.2.8.2.2
    - 13.2.1.3
    - 10.6.2.8.3
    - 10.6.2.2.2
    - 10.6.2.5
    - 10.6.2.5.4
  qa: [Q2622, Q2623, Q2601, Q2573]
evidence:
  - ref: Q2622
    quote: いいえ。必ず1つ以上チョイスする必要があります。
  - ref: Q2623
    quote: はい。コストを支払わないことで、何も起こらないことを選択できます。
  - ref: Q2601
    quote: いいえ。適切な目標を選ぶことができない場合、【1】をチョイスすることができず、【2】をチョイスする必要があります。
  - ref: Q2573
    quote: いいえ。1つの選択肢を2回以上チョイスすることはできません。
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: A：xverify-2/recheck.md:112〈全部改動局面的核對索引〉；B／C／D／E：xverify-2/result.md:264〈全部實質核驗局面的索引〉（5.18.2.1、5.18.2.2、Q2622、Q2623）

scenarios:
  - name: A 選【2】、不付費 → 0 PP 打出、什麼都不發生，但算打出了 1 張
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 4, P2: 3}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ナイトメア, life: 20}
          pp: {current: 3, max: 3}
          zones:
            hand:
              - {id: a1, card: BP19-090}          # バイオレントスクリーム
            deck:
              - {id: d1, card: BP01-173}
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 3}
          zones:
            field:
              - {id: b1, card: BP01-173}          # ファイター 2/3
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, options: [2], optional_costs: {mode_2: decline}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 3
          P1.hand: []
          P1.cemetery: [a1]
          P1.leader.life: 20
          P1.deck: [d1, filler: 20]
          semantic_state.counters_this_turn: {P1.cards_played: 1}
        events:
          - kind: プレイ
            object: a1
          - kind: 解決
            object: a1
        forbidden_events:
          - {kind: ダメージ}
          - {kind: 引く}

  - name: B 一個都不選 → 不能打出
    inherit: A 選【2】、不付費 → 0 PP 打出、什麼都不發生，但算打出了 1 張
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, options: []}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-play
        assert:
          P1.hand: [a1]
          P1.cemetery: []
        forbidden_events:
          - {kind: プレイ}

  - name: C 對手沒有從者 → 不能選【1】；只能選【2】
    inherit: A 選【2】、不付費 → 0 PP 打出、什麼都不發生，但算打出了 1 張
    setup:
      players:
        P2:
          zones:
            field: []
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, options: [1], targets: {1: []}}
      - {n: 2, by: P1, at: main, do: play, card: a1, options: [1, 2], targets: {1: []}}
      - {n: 3, by: P1, at: main, do: play, card: a1, options: [2], optional_costs: {mode_2: {pp: 1}}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-play
        assert:
          P1.hand: [a1]
      - at: after-decision-2
        view: omniscient
        outcome: cannot-play
        assert:
          P1.hand: [a1]
          P1.pp.current: 3
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 2
          P1.leader.life: 19
          P1.hand: [d1]
          P1.cemetery: [a1]
        events:
          - {kind: ダメージ, source: a1, target: P1.leader, amount: 1}
          - {kind: 引く, player: P1, object: d1}

  - name: D 同一選項選兩次 → 不能打出
    inherit: A 選【2】、不付費 → 0 PP 打出、什麼都不發生，但算打出了 1 張
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, options: [2, 2]}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-play
        assert:
          P1.hand: [a1]
  - name: E 選【1】【2】：付【1】、不付【2】 → 2 傷害、自傷 1、不抽牌
    inherit: A 選【2】、不付費 → 0 PP 打出、什麼都不發生，但算打出了 1 張
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, options: [1, 2], targets: {1: [b1]}, optional_costs: {mode_1: {pp: 1}, mode_2: decline}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 2
          P1.leader.life: 19
          P1.hand: []
          P1.cemetery: [a1]
          P2.field.b1:
            hp: 1
        forbidden_events:
          - {kind: 引く}
        events:
          - kind: ダメージ
            source: a1
            target: b1
            amount: 2
          - kind: ダメージ
            source: a1
            target: P1.leader
            amount: 1
  - name: F 合計費用不足 → 取消打出、不扣 PP
    inherit: A 選【2】、不付費 → 0 PP 打出、什麼都不發生，但算打出了 1 張
    setup:
      players:
        P1:
          pp:
            current: 1
            max: 3
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: a1
        options:
          - 1
          - 2
        targets:
          1:
            - b1
        optional_costs:
          mode_1:
            pp: 1
          mode_2:
            pp: 1
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-play
        assert:
          P1.pp.current: 1
          P1.hand:
            - a1
          P1.cemetery: []
          P1.leader.life: 20
        forbidden_events:
          - kind: プレイ
          - kind: ダメージ
          - kind: 引く
  - name: G 0 PP 拒付【2】仍可打出
    inherit: A 選【2】、不付費 → 0 PP 打出、什麼都不發生，但算打出了 1 張
    setup:
      players:
        P1:
          pp:
            current: 0
            max: 3
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: a1
        options:
          - 2
        optional_costs:
          mode_2: decline
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P1.cemetery:
            - a1
          P1.leader.life: 20
          semantic_state.counters_this_turn:
            P1.cards_played: 1
        forbidden_events:
          - kind: ダメージ
          - kind: 引く
