id: rule-8.4.6-01
kind: rule
must_pass: true
mechanisms:
  - 8.4／7.4.5
  - 10.5.2
cards:
  - BP21-P37
  - ETD03-019
why: 攻擊時先完整結算，Quick 才到；Quick 殺掉來源無法倒掉已造成的攻擊時 2 傷害。
discriminates: 先開 Quick 視窗會使攻擊時傷害漏掉或時間順序錯。
refs:
  rules:
    - 8.4.6
    - 8.4.7
    - 10.7.7
  qa:
    - Q1378
evidence:
  - ref: Q1378
    quote: 【ツインドライブ】や【攻撃時】能力が誘発し解決するタイミングが先です。【攻撃時】能力などフォロワーが攻撃したときに誘発する能力をすべて解決した後、非ターンプレイヤーのクイックタイミングが訪れます。
  - ref: cr 8.4.6
    quote: チェックタイミングが発生します。
    derivation:
      - 攻擊時先完整結算，Quick 才到；Quick 殺掉來源無法倒掉已造成的攻擊時 2 傷害。
  - ref: cr 8.4.7
    quote: "非ターンプレイヤーは、以下のいずれかを実行しま\nす。\n* 手札か EX エリアの【クイック】を持つカードを 1 枚\nプレイする（10.6）。\n* 【クイック】を持つ起動能力を 1 つプレイする。\n* 何もしない。"
    derivation:
      - 攻擊時先完整結算，Quick 才到；Quick 殺掉來源無法倒掉已造成的攻擊時 2 傷害。
  - ref: cr 10.7.7
    quote: "待機状態の自動能力のプレイ時に、その自動能\n力を有していたカードの領域が変わっていた場合で\nも、その自動能力はプレイする義務があります。"
    derivation:
      - 攻擊時先完整結算，Quick 才到；Quick 殺掉來源無法倒掉已造成的攻擊時 2 傷害。
