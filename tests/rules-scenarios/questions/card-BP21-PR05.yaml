why: リオード的直立條件持續檢查；宣告攻擊橫置後即可被對手 Quick 選取破壞。
discriminates: 把直立條件在入場時快照會令 Quick 不能選取；不檢查條件則直立反例可被破壞。
refs:
  rules:
    - 8.4.5
  qa:
    - Q995
evidence:
  - ref: Q995
    quote: "Q: 相手の『月の刃・リオード』が攻撃したとき、クイックタイミングで『エクスキューション』をプレイして相手の『月の刃・リオード』を選び、破壊することはできますか？\nA: はい。自分のクイックタイミングのとき、相手の『月の刃・リオード』はアクト状態なので、【威圧】と【オーラ】を失います。そのため、『エクスキューション』で『月の刃・リオード』を選び、破壊することができます。"
    derivation:
      - リオード的直立條件持續檢查；宣告攻擊橫置後即可被對手 Quick 選取破壞。
  - ref: cr 8.4.5
    quote: 攻撃フォロワーが‘攻撃した’事象が発生します。
    derivation:
      - リオード的直立條件持續檢查；宣告攻擊橫置後即可被對手 Quick 選取破壞。
