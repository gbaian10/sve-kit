schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: flow-private-look-01
kind: flow
must_pass: true
mechanisms:
  - 查看牌庫上方多步驟
  - 流程
cards:
  - BP01-042
  - BP01-173
  - BP01-176
  - BP19-SL26
why: 卡片解析使用全知資料，但 P2 投影不能因 P1 看頂牌而得到那兩張的身份；三局面公開資訊相同。此題只測投影，不宣稱測了舊版回放分支。
discriminates: 把全知狀態透傳 P2 會違反 knowledge.does_not_know。
refs:
  rules:
    - 4.1.2
    - 5.11.1
  qa: []
evidence:
  - ref: cr 4.1.2
    quote: "領域によっては、そこに置かれているカードの内容\nや情報をすべてのプレイヤーが見ることができる領\n域とそうでない領域が存在します。すべてのプレイ\nヤーがカードの内容を見ることができる領域を‘公開\n領域’、そうでない領域を‘非公開領域’と呼びます。"
    derivation:
      - 卡片解析使用全知資料，但 P2 投影不能因 P1 看頂牌而得到那兩張的身份；三局面公開資訊相同。此題只測投影，不宣稱測了舊版回放分支。
  - ref: cr 5.11.1
    quote: "‘デッキを上から N 枚見る’指示がある場合、指定\nプレイヤーはそのデッキ置き場の一番上から N 枚\nの情報を知ることができます。"
    derivation:
      - 卡片解析使用全知資料，但 P2 投影不能因 P1 看頂牌而得到那兩張的身份；三局面公開資訊相同。此題只測投影，不宣稱測了舊版回放分支。
status: draft
author: astra
verified_by: []
scenarios:
  - name: BP01-042
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - id: d
                card: BP01-042
              - id: x
                card: BP01-173
            hand:
              - id: a
                card: BP19-SL26
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: a
      - n: 2
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 2
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: paused
        assert:
          P1.deck:
            - d
            - x
          P1.hand: []
        awaiting:
          by: P1
          choices:
            - do: resolve-choice
              select:
                - d
            - do: resolve-choice
              select:
                - x
      - at: after-decision-2
        view: P2
        outcome: paused
        assert:
          P1.hand_count: 0
          P1.deck_count: 2
          knowledge:
            does_not_know:
              - d
              - x
        awaiting:
          by: P1
          choices:
            - do: resolve-choice
              select:
                - d
            - do: resolve-choice
              select:
                - x
