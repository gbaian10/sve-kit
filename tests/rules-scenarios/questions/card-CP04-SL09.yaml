            current: 0
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
      semantic_state:
        pending_triggers:
          - id: t
            controller: P1
            ability:
              source: a
              line: 2
              card: CP04-SL10
            event:
              evolved: a
    decisions:
      - n: 1
        by: P1
        at: check-timing
        do: choose-pending
        pending: t
        targets:
          1:
            - x
            - y
      - n: 2
        by: P1
        at: resolve
        do: resolve-choice
        of:
          decision: 1
          occurrence: 1
        select:
          - x
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: paused
