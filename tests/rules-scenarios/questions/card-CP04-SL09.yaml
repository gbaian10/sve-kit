why: キャル超進化時已選兩個不同名法術，但 EX 僅餘一格，玩家在移動時任選其中一張，另一張留墓場。
discriminates: 依目標列表固定取第一張的實作會在選 y 分支移錯；把原 EX 卡擠掉或先移出兩張再丟棄也會區域不符。
refs:
  rules:
    - 4.8.3.2
    - 10.6.2.8.2
  qa: []
evidence:
  - ref: cr 4.8.3.2
    quote: EX エリアにカードを移動または作成する処理において、その結果 EX エリアのカードの枚数が上限を超える場合、その移動または作成するカードの中から、その EX エリアの上限からその EX エリアにあるカードの枚数を引いた数のカードを選択し、それらのカードのみを移動または作成します。それ以外のカードは移動または作成しません。
  - ref: cr 10.6.2.8.2
    quote: プレイしたのがスペルや起動能力や自動能力である場合、そのテキストや能力に示された効果を、表記の順に従って実行します。
  - ref: CP04-SL10
    quote: "【進化時】相手の場のフォロワー1体を選ぶ。それに5ダメージ。\n【超進化時】自分の墓場のスペルをカード名が異なるように2枚まで選ぶ。それをEXエリアに置く。このターン、それをプレイする際、コストを-2する。"
