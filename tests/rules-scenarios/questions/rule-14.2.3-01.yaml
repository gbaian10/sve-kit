schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: rule-14.2.3-01
kind: rule
must_pass: true
mechanisms:
  - 14.2.1.1
  - 14.2.2.5
  - 14.2.3.1
  - 10.7.2.1
cards:
  - BP01-173
  - CSD01-032
  - ECP01-012
why: 食事 2 產生同一物件的兩次出走事件，以 event.n 區分；每次自動能力獨立加值、看牌、拒绝出場及排底。
discriminates: 合併兩次待機、以來源 id 去重，或把出走誤計成進化事件，會留下 4/4、錯誤牌序或計數。
refs:
  rules:
    - 14.2.1.1
    - 14.2.2.5
    - 14.2.3.1
    - 10.7.2.1
  qa:
    - Q1820
    - Q1821
evidence:
  - ref: cr 14.2.1.1
    quote: "あるカードが‘（指定回数）食事する’指示\nがある場合、そのカードに関連付けられたカー\nドが出走領域にないなら、そのカードのマス\nターは自身のエボルヴデッキの『にんじん』を\n指定回数に等しい枚数自身の出走領域に置\nき、その『にんじん』をそのカードに関連付けま\nす。"
    derivation:
      - 食事 2 產生同一物件的兩次出走事件，以 event.n 區分；每次自動能力獨立加值、看牌、拒绝出場及排底。
  - ref: cr 14.2.2.5
    quote: 食事能力は進化相当能力（8.3.2）です。
    derivation:
      - 食事 2 產生同一物件的兩次出走事件，以 event.n 區分；每次自動能力獨立加值、看牌、拒绝出場及排底。
  - ref: cr 14.2.3.1
    quote: "あるカードを‘（指定回数）出走する’指示\nがある場合、これ以降そのカードは、自身に関\n連付けられたカードが出走領域にあるかぎり、\n【突進】を持ち、このカードが‘出走した’事象\nが指定回数発生します。"
    derivation:
      - 食事 2 產生同一物件的兩次出走事件，以 event.n 區分；每次自動能力獨立加值、看牌、拒绝出場及排底。
  - ref: cr 10.7.2.1
    quote: "自動能力の誘発条件が複数回満たされた\n場合、その自動能力はその回数分待機状態\nになります。"
    derivation:
      - 食事 2 產生同一物件的兩次出走事件，以 event.n 區分；每次自動能力獨立加值、看牌、拒绝出場及排底。
  - ref: Q1820
    quote: はい。エボルヴデッキに『にんじん』が3枚ない場合「《食事》《食事》《食事》《コスト3》：これは3回出走する。」のコストを支払うことができず、能力をプレイすることができません。
  - ref: Q1821
    quote: はい。【出走時】能力が2回誘発します。
status: verified
author: astra
verified_by:
  - by: fable
    method: qa
    note: '14.2.2.3、14.2.3.1、10.7.2.1、Q1821；xverify-2/result.md〈遷移新增 6 題〉1/1；xverify-2/recheck.md 維持 choice: decline'
scenarios:
  - name: 同一從者出走兩次；先解第 2 次，再解第 1 次
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: title
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - id: d0
                card: BP01-173
              - id: d1
                card: BP01-173
              - id: d2
                card: BP01-173
            field:
              - id: a
                card: ECP01-012
            evolve_deck:
              - id: r1
                card: CSD01-032
              - id: r2
                card: CSD01-032
          title: ウマ娘 プリティーダービー
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - id: P2-draw
                card: BP01-173
    decisions:
      - n: 1
        by: P1
        at: main
        do: activate
        ability:
          source: a
          line: 2
        costs:
          1:
            - r1
            - r2
        pay:
          pp: 2
          ep: 0
      - n: 2
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 4
          event:
            raced: a
            n: 2
      - n: 3
        by: P1
        at: resolve
        do: resolve-choice
        of:
          decision: 2
          occurrence: 1
        choice: decline
      - n: 4
        by: P1
        at: resolve
        do: resolve-choice
        of:
          decision: 2
          occurrence: 2
        order:
          - d2
          - d1
          - d0
      - n: 5
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 4
          event:
            raced: a
            n: 1
      - n: 6
        by: P1
        at: resolve
        do: resolve-choice
        of:
          decision: 5
          occurrence: 1
        choice: decline
      - n: 7
        by: P1
        at: resolve
        do: resolve-choice
        of:
          decision: 5
          occurrence: 2
        order:
          - d1
          - d0
          - d2
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 8
          P1.race:
            - r1
            - r2
          P1.field.a:
            links:
              出走:
                - r1
                - r2
          semantic_state.pending_triggers:
            - controller: P1
              ability:
                source: a
                line: 4
              event:
                raced: a
                n: 1
            - controller: P1
              ability:
                source: a
                line: 4
              event:
                raced: a
                n: 2
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a:
            power: 4
            hp: 4
          P1.deck:
            - d2
            - d1
            - d0
          semantic_state.pending_triggers:
            - controller: P1
              ability:
                source: a
                line: 4
              event:
                raced: a
                n: 1
      - at: after-decision-7
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a:
            power: 5
            hp: 5
          P1.deck:
            - d1
            - d0
            - d2
          semantic_state.pending_triggers: []
          semantic_state.counters_this_turn:
            P1.evolve_played: 1
            P1.evolutions: 0
