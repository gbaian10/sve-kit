evidence:
  - ref: cr 14.5.2.2.1
    quote: その（名称）をカード名に持つトークン をイクイップメント領域に作成します。
    derivation:
      - 既有裝備不妨礙再裝同名裝備，場與 EX 滿也不佔イクイップメント領域空間；付款不足則只取消待機。
  - ref: cr 14.5.2.3
    quote: フォロワーは同時に複数のトークンを装備 することができます。
    derivation:
      - 既有裝備不妨礙再裝同名裝備，場與 EX 滿也不佔イクイップメント領域空間；付款不足則只取消待機。
  - ref: cr 4.16.1
    quote: 作成したイクイップメント・トークンを置く領域です。
    derivation:
      - 既有裝備不妨礙再裝同名裝備，場與 EX 滿也不佔イクイップメント領域空間；付款不足則只取消待機。
