  - BP21-057
why: >-
  R-0019（inferred）把 10 個情熱カウンター門檻套用到整個起動能力本文，九個時既不造成傷害，也不增加自身體力。
discriminates: >-
  把體力 +6 當獨立句會讓ジョー成為 11 體力。
refs:
  rules:
    - 10.6.2.5
    - 10.6.2.8.2
  qa:
    - Q1373
    - Q1506
    - Q1611
  rulings:
    - R-0019
evidence:
  - ref: R-0019
    derivation:
      - 傷害與體力增益是同一段落，門檻不成立則兩者都略過
status: verified
author: sol
verified_by:
  - by: opus
    method: independent-derivation
    note: >-
      9 個情熱カウンター可由 EX 打出帶到場上（10.6.2.1.3、10.6.2.8.1.1）；アクト付費後條件不成立，依 R-0019 傷害與体力+6 都不做：ジョー 5
      體力、ファイター 3、領袖 20
