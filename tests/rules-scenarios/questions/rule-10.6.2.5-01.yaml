# 試作 p3 遷移到 v2。修正：token 大地の魔片不能斷言在墓場（改事件 消去）；Q292 只當「土の秘術自帶送墓」的旁證，一般【スタック】歸 0 走 13.3.2.3／11.7.1；
# 費用選卡用 costs；進化用 pay 與 card: CP04-104；拒付用 costs: decline。
schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: rule-10.6.2.5-01
kind: rule
must_pass: true
mechanisms: [10.6.2.5.2, 10.6.2.5.3, 取代效果, 堆疊、土之秘術, 公主連結：UB、裝備, 13.3.2.2, 11.7.1, 14.5.1.3]
cards: [BP19-P30, EBD02-T01, CP04-103, CP04-104, BP01-173]
why: >-
  兩個機制各兩個局面。（A／A2）費用被取代：不可侵の教会的起動費用含「場のアミュレット1つを墓場に置く」，用帶【スタック】的大地の魔片支付時，
  「場を離れる場合、代わりに…場に残る」（13.3.2.2）是取代效果（10.2.1.3.1）；依 10.6.2.5.2 原處理仍視為已執行 → 費用成立 → 1 傷害照常；魔片留在場上。
  A2 是計數器剩 1 的邊界：取代後 0 個 → 檢查時點由規則處理 11.7.1 送墓（在能力結算之後）→ token 立即消去。
  （B／B2）0 單位費用：ミミ（CP04-104）的 UB【進化時】費用「場のアミュレットX枚をアクト」X=0 → 10.6.2.5.3 視為已執行 → 能力適正打出並結算 → 「UB能力が発動した」成立（Q2520）；
  B2 拒付 → 不能打出、待機取消、不算發動（Q2471）。
discriminates: >-
  A：把「費用是否成立」實作成「原事件是否真的發生」的引擎會判定付不出費用（cannot-activate，b1 體力 3）；
  A2：在費用支付後立刻插入規則處理的引擎會先把魔片送墓再造成傷害，事件順序相反；
  B：把 X=0 當成付不出費用的引擎會 pending-cancelled、UB 次數 0；B2：把拒付當成 X=0 的引擎會多一次プレイ、UB 次數 1。
refs:
  rules: [10.6.2.5, 10.6.2.5.2, 10.6.2.5.3, 10.4.2, 10.2.1.3.1, 10.10.1, 10.10.1.1, 13.3.2.2, 13.3.2.3, 11.7.1, 11.1.2, 1.3.2.2, 10.6.2.2.1, 10.6.2.3.2, 10.1.1.2.2, 14.5.1.2, 14.5.1.3, 12.2.2, 12.2.3, 10.7.3.2, 9.1.4.4]
  qa: [Q2520, Q2471, Q2608, Q292]
evidence:
  - ref: cr 10.6.2.5.2
    quote: コストとして行われる処理の一部が置換効果により他の処理になった場合でも、その元となった処理は実行されたものとみなされます。
    derivation:
      - 13.3.2.2「このカードにスタックカウンターが置かれている状態でこのカードが場を離れる場合、代わりにこのカードのスタックカウンターを 1 個取り除き、このカードは場に残る」是「（行動A）する代わりに（行動B）する」→ 10.2.1.3.1 取代效果
      - 費用「場のアミュレット1つを墓場に置く」＝魔片要離場 → 被取代成「取 1 個計數器、留在場上」；10.10.1.1 原事象完全沒發生
      - 但 10.6.2.5.2：原本的「墓場に置く」視為已執行 → 費用成立 → 10.6.2.7／10.6.2.8 結算，b1 受 1 傷害
  - ref: cr 11.1.2
    quote: ルール処理は、チェックタイミングにおいてのみ条件を満たしているかを確認し、満たされている場合に実行されます。
    derivation:
      - A2：費用支付與結算之間沒有檢查時點；計數器 0 的魔片在 7.3.4 的檢查時點才由 11.7.1 送墓 → 傷害事件在移動事件之前
  - ref: Q2608
    quote: >-
      Q: 『不可侵の教会』の《起動》能力のコストにある「場のアミュレット1つを墓場に置く」について、自分の場にあるこの『不可侵の教会』自身を
      墓場に置くことでコストの支払いを満たすことができますか？ A: はい。コストの支払いを満たすことができます。
    derivation:
      - 佐證費用「場のアミュレット1つ」可以指定任一自己場上的アミュレット（本題指定魔片）
  - ref: Q292
    quote: 能力をプレイするより先にコストが支払われ、かつスタックカウンターが0となったアミュレットが墓場に置かれるため、自分の場は上限ではなくなり『攻撃型ゴーレム』は場に出ます。
    derivation:
      - 只是旁證：土の秘術（13.3.3.2）自帶「置かれていない状態になった場合、そのアミュレットを墓場に置く」的效果內指示；一般【スタック】歸 0 走 13.3.2.3／11.7.1，在檢查時點才送墓
  - ref: cr 10.6.2.5.3
    quote: コストとして実行する内容のうち、その内容を 0 単位実行するものは、何も実行せずにその内容を実行したものとみなされます（1.3.2.2）。
  - ref: cr 10.1.1.2.2
    quote: 自動能力の一部は、「（条件）とき、（コスト）：（効果）」と表記されています。この場合、この自動能力をプレイするためには（コスト）で示されたコストの支払いが必要です。
    derivation:
      - ミミ的「【進化時】場のアミュレットX枚をアクト：」是打出費用，不是 10.4.7.3 的結算時可選費用（Q2471 拒付＝不算發動，與 10.1.1.2.2 一致）
  - ref: Q2520
    quote: >-
      Q: Xの値として0を指定して、このフォロワーの《UB》【進化時】能力をプレイした場合、《UB》能力が発動したことを満たしますか？
      A: はい。《UB》能力が発動したことを満たします。
  - ref: Q2471
    quote: >-
      Q: このフォロワーの《UB》【進化時】能力のコストを支払わない選択をした場合、《UB》能力が発動したことを満たしますか？
      A: いいえ。《UB》能力が発動したことを満たしません。
  - ref: cr 14.5.1.3
    quote: ユニオンバースト能力が‘発動した’ことを参照する場合、それはその能力が適正にプレイされて（10.6.2.7）解決された（10.6.2.8）ことを参照します。
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: A／A2／B／B2：xverify-1/result.md:119〈其他驗過的題目〉（10.6.2.5.2、11.7.1、Q2520、Q2471）

scenarios:
  - name: A 費用被【スタック】取代（計數器 2 → 1），費用視為成立，效果照常
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 5, P2: 4}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ビショップ, life: 20}
          pp: {current: 3, max: 5}
          ep: 2
          zones:
            field:
              - {id: a1, card: BP19-P30}                                       # 不可侵の教会
              - {id: a2, card: EBD02-T01, state: {counters: {スタックカウンター: 2}}}   # 大地の魔片（ウィッチ token，給定局面）
            hand:
              - {filler: 2}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 5}
          zones:
            field:
              - {id: b1, card: BP01-173}                                       # ファイター 2/3
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: activate, ability: {source: a1, line: 1}, targets: {1: [b1]}, costs: {1: [a2]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 2
          P1.field.a1: {acted: true}
          P1.field.a2: {counters: {スタックカウンター: 1}}
          P1.field: [a1, a2]
          P2.field.b1: {hp: 2}
        events:
          - {kind: アクト, object: a1}
          - {kind: 取代, object: a2, original: 場を離れる（墓場に置く）, replacement: スタックカウンターを1個取り除き、場に残る}
          - {kind: カウンター, object: a2, name: スタックカウンター, delta: -1}
          - {kind: 費用成立, ability: {source: a1, line: 1}, replaced: true}
          - {kind: プレイ, ability: {source: a1, line: 1}}
          - {kind: ダメージ, source: a1, target: b1, amount: 1}
        forbidden_events:
          - {kind: 移動, object: a2}
          - {kind: 消去, object: a2}

  - name: A2 邊界：計數器只剩 1 → 取代後 0 → 檢查時點由 11.7.1 送墓（在傷害之後）→ token 消去；費用仍成立
    inherit: A 費用被【スタック】取代（計數器 2 → 1），費用視為成立，效果照常
    setup:
      players:
        P1:
          zones:
            field:
              - {id: a1, card: BP19-P30}
              - {id: a2, card: EBD02-T01, state: {counters: {スタックカウンター: 1}}}
    decisions:
      - {n: 1, by: P1, at: main, do: activate, ability: {source: a1, line: 1}, targets: {1: [b1]}, costs: {1: [a2]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 2
          P1.field: [a1]
          P1.field.a1: {acted: true}
          P2.field.b1: {hp: 2}
        events:
          - {kind: カウンター, object: a2, name: スタックカウンター, delta: -1}
          - {kind: 費用成立, ability: {source: a1, line: 1}, replaced: true}
          - {kind: ダメージ, source: a1, target: b1, amount: 1}
          - {kind: 移動, object: a2, from: P1.field, to: P1.cemetery, by: rule-11.7.1}
          - {kind: 消去, object: a2}

  - name: B 0 單位費用：X=0 → 費用視為已執行 → UB 能力被打出並結算（發動成立），沒有目標、沒有傷害
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 5, P2: 4}, phase: main}
      history: none
      players:
        P1:
          construction: title
          title: プリンセスコネクト！Re:Dive                                   # 14.5.1.2：UB 只在這種牌組有效
          leader: {class: ビショップ, life: 20}
          pp: {current: 4, max: 5}
          ep: 2
          zones:
            field:
              - {id: a1, card: CP04-103}                                       # ミミ 2/2，不是本回合進場
            evolve_deck:
              - {id: a2, card: CP04-104}                                       # ミミ（エボルヴ）3/3
            hand:
              - {filler: 2}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 5}
          zones:
            field:
              - {id: b1, card: BP01-173}                                       # ファイター 2/3：若實作誤給傷害，這裡看得出來
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: evolve, source: a1, ability: {source: a1, line: 1}, evolve_card: a2, pay: {pp: 1, ep: 1, sep: 0}}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, card: CP04-104, line: 1}}, x: 0, costs: {1: []}, targets: {1: []}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, card: CP04-104, line: 1}}}
        assert:
          P1.pp.current: 3
          P1.ep: 1
          P1.field.a1: {evolved: true, evolved_with: a2, power: 3, hp: 3}
          P1.evolution: [a2]
        events:
          - {kind: 進化, object: a1, with: a2}
          - {kind: 待機, ability: {source: a1, card: CP04-104, line: 1}}
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b1: {hp: 3}
          P2.leader.life: 20
          semantic_state.pending_triggers: []
          semantic_state.counters_this_turn: {P1.ub_activated: 1}
        events:
          - {kind: 費用成立, ability: {source: a1, card: CP04-104, line: 1}, zero: true}
          - {kind: プレイ, ability: {source: a1, card: CP04-104, line: 1}}
          - {kind: 解決, ability: {source: a1, card: CP04-104, line: 1}}
        forbidden_events:
          - {kind: ダメージ}
          - {kind: アクト}

  - name: B2 對照：拒付費用 → 不能打出、待機取消 → UB 不算發動；進化不回溯
    inherit: B 0 單位費用：X=0 → 費用視為已執行 → UB 能力被打出並結算（發動成立），沒有目標、沒有傷害
    decisions:
      - {n: 1, by: P1, at: main, do: evolve, source: a1, ability: {source: a1, line: 1}, evolve_card: a2, pay: {pp: 1, ep: 1, sep: 0}}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, card: CP04-104, line: 1}}, costs: decline}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: pending-cancelled
        assert:
          P1.field.a1: {evolved: true, power: 3, hp: 3}
          P1.pp.current: 3
          P2.field.b1: {hp: 3}
          semantic_state.pending_triggers: []
          semantic_state.counters_this_turn: {P1.ub_activated: 0}
        events:
          - {kind: 待機取消, ability: {source: a1, card: CP04-104, line: 1}}
        forbidden_events:
          - {kind: 費用成立}
          - {kind: プレイ, ability: {source: a1, card: CP04-104, line: 1}}
          - {kind: ダメージ}
