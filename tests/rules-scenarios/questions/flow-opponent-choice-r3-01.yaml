  - name: 兩個來源都由對手選模式 1
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: a
                card: BP05-006
              - id: b
                card: BP05-006
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 0
            max: 3
          ep: 0
          sep: 0
          zones:
            deck:
              - id: d
                card: BP01-173
              - &id001
                filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: end-phase
      - n: 2
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 1
      - n: 3
        by: P2
        at: resolve
        do: resolve-choice
        of:
          decision: 2
          occurrence: 1
        options:
          - 1
      - n: 4
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: b
            line: 1
      - n: 5
        by: P2
        at: resolve
        do: resolve-choice
        of:
          decision: 4
          occurrence: 1
        options:
          - 1
      - n: 6
        by: P2
        at: quick
        do: pass
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: paused
        assert: {}
        awaiting:
          by: P2
          choices:
            - do: resolve-choice
              options:
                - 1
            - do: resolve-choice
              options:
                - 2
            - do: resolve-choice
              options:
                - 3
      - at: after-decision-4
        view: omniscient
        outcome: paused
        assert: {}
        awaiting:
          by: P2
          choices:
            - do: resolve-choice
              options:
                - 1
            - do: resolve-choice
              options:
                - 2
            - do: resolve-choice
              options:
                - 3
      - at: after-decision-6
        view: omniscient
        outcome: resolved
        assert:
          turn.active: P2
          turn.phase: main
          P2.pp:
            current: 4
            max: 4
          P2.hand: []
          P2.deck:
            - d
            - *id001
