id: flow-opponent-choice-r3-01
kind: flow
must_pass: true
mechanisms:
  - C16
  - 重複抉擇
cards:
  - BP01-173
  - BP05-006
why: 兩個モートン可由同一對手各自選相同模式；禁止下一開始階段抽牌／增加 PP 不會把兩回合都跳過或倒扣 PP。
discriminates: 強迫第二次選不同模式會在第二個 paused 選項集失配；把禁止累加成減二則 PP 或手牌錯誤。
refs:
  rules:
    - 5.18.3
  qa:
    - Q673
    - Q672
evidence:
  - ref: Q673
    quote: "Q: このフォロワーが自分の場に2体いる状態でエンドフェイズが来た場合、相手プレイヤーはそれぞれ別の選択肢をチョイスする必要がありますか？\nA: いいえ。同じ選択肢をチョイスすることができます。その場合、チョイスした選択肢の効果は同一なものになるため、実態として単に1つ効果を受けます。"
    derivation:
      - 兩個モートン可由同一對手各自選相同模式；禁止下一開始階段抽牌／增加 PP 不會把兩回合都跳過或倒扣 PP。
  - ref: Q672
    quote: "Q: このフォロワーの能力でチョイスされた効果は、チョイスした相手プレイヤーを対象にその効果が働きますか？\nA: はい。チョイスした相手プレイヤーに対して効果が働きます。"
    derivation:
      - 兩個モートン可由同一對手各自選相同模式；禁止下一開始階段抽牌／增加 PP 不會把兩回合都跳過或倒扣 PP。
  - ref: cr 5.18.3
    quote: チョイスする行動でどの選択肢を採用するかを決 定する処理は、プレイのための前提となる選択肢 （10.6.2.2）です。そのため、チョイスする行動による 選択はプレイの段階で行う義務があります。 === p9
    derivation:
      - 兩個モートン可由同一對手各自選相同模式；禁止下一開始階段抽牌／增加 PP 不會把兩回合都跳過或倒扣 PP。
