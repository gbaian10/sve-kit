schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-CP01-019
kind: card
must_pass: true
mechanisms: [賽馬娘：食事、出走, 14.2.4.2, 「相手を攻撃できない」, 8.4.3.2.1, 10.4.6, 起動費用的アクト不是攻擊, まで選 0 個]
cards: [CP01-019, ECP01-049, CP01-013, CP01-085, BP01-173]
why: >-
  エアグルーヴ【出走時】「これは{攻撃力}+1/{体力}+1する。自分の他のフォロワー1体まで選ぶ。それをスタンドする。このターン、それは相手を攻撃できない」。
  被スタンド的從者本回合不能攻擊（8.4.3.2.1：攻擊目標不可選 → 攻擊不成立，Q364），但「これを{アクト}」的起動費用不是攻擊，仍可支付（Q365、10.4.6）。
  B：「1体まで」可以選 0 個（10.6.2.3.2），只有 +1/+1。
discriminates: >-
  A：把「攻撃できない」做成「不能アクト」的引擎，決定 4 會 cannot-activate；反之沒套用「攻撃できない」的引擎，決定 3 會 resolved 並對リーダー造成傷害。
  B：把「まで」當成必選的引擎，awaiting 不會列出 targets {1: []}。
refs:
  rules: [14.2.1.1, 14.2.3.1, 14.2.4.2, 8.4.3.2.1, 8.4.3.2, 10.4.6, 10.6.2.3.2, 5.4]
  qa: [Q364, Q365]
evidence:
  - ref: Q364
    quote: いいえ。相手のリーダーや相手のフォロワーを攻撃することはできません。
  - ref: Q365
    quote: はい。能力のコストの「これを《アクト》」は攻撃ではないため、使うことができます。
  - ref: cr 8.4.3.2.1
    quote: なんらかの効果により、その攻撃フォロワーが‘相手を攻撃できない’状態である場合、攻撃目標は選択できません。
    derivation:
      - 8.4.3.2：攻擊目標不能選 → 攻擊不正 → 回到選擇攻擊之前（cannot-attack）
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: 第三輪交叉驗證 astra-r3/xverify-1、xverify-2（審 fable-r3），fable-r3/fix-1～fix-3 處理後同意
  - by: sol
    method: independent-derivation
    note: 第三輪最後核對（139 局面逐一推導）；F1、F2 與禁止 vs 置換仲裁已依核對結果修正

scenarios:
  - name: A 食事 → 出走時讓アクト狀態的ジャングルポケット站起 → 它不能攻擊，但可用アクト費用起動
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 6, P2: 5}, phase: main}
      history: none
      players:
        P1:
          construction: title
          title: ウマ娘 プリティーダービー
          leader: {class: ビショップ, life: 20}
          pp: {current: 3, max: 6}
          zones:
            field:
              - {id: a1, card: CP01-019}                              # エアグルーヴ 2/2
              - {id: a2, card: ECP01-049, state: {acted: true}}       # ジャングルポケット 3/2，アクト狀態
              - {id: a3, card: CP01-013}                              # ハルウララ（湊滿 3 張ウマ娘・カード）
            evolve_deck:
              - {id: n1, card: CP01-085}
            hand:
              - {filler: 2}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 6}
          zones:
            field:
              - {id: b1, card: BP01-173}                              # ファイター 2/3
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: activate, ability: {source: a1, line: 1}, costs: {1: [n1]}, pay: {pp: 1, ep: 0}}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}, targets: {1: [a2]}}
      - {n: 3, by: P1, at: main, do: attack, attacker: a2, target: P2.leader}
      - {n: 4, by: P1, at: main, do: activate, ability: {source: a2, line: 3}, targets: {1: [b1]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, line: 2}}, targets: {1: [a2]}}
            - {do: choose-pending, pending: {ability: {source: a1, line: 2}}, targets: {1: [a3]}}
            - {do: choose-pending, pending: {ability: {source: a1, line: 2}}, targets: {1: []}}
        assert:
          P1.pp.current: 2
          P1.race: [n1]
          P1.field.a1: {links: {出走: [n1]}}
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a1: {power: 3, hp: 3}
          P1.field.a2: {acted: false}
        events:
          - {kind: スタンド, object: a2}
      - at: after-decision-3
        view: omniscient
        outcome: cannot-attack
        assert:
          P1.field.a2: {acted: false}
          P2.leader.life: 20
        forbidden_events:
          - {kind: 攻撃}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a2: {acted: true}
          P2.field.b1: {hp: 1}
          P2.leader.life: 20
        events:
          - {kind: アクト, object: a2}
          - {kind: ダメージ, source: a2, target: b1, amount: 2}

  - name: B 出走時選 0 個 → 只有 +1/+1
    inherit: A 食事 → 出走時讓アクト狀態的ジャングルポケット站起 → 它不能攻擊，但可用アクト費用起動
    decisions:
      - {n: 1, by: P1, at: main, do: activate, ability: {source: a1, line: 1}, costs: {1: [n1]}, pay: {pp: 1, ep: 0}}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}, targets: {1: []}}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a1: {power: 3, hp: 3}
          P1.field.a2: {acted: true}
        forbidden_events:
          - {kind: スタンド}
