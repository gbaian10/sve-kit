          P1.field.a1:
            acted: false
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - do: choose-pending
              pending:
                ability:
                  source: a1
                  line: 3
        assert:
          P1.field.a1:
            acted: true
