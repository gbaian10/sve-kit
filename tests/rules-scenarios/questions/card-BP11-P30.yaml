schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: card-BP11-P30
kind: card
must_pass: true
mechanisms:
  - 封箱、操縱、變成種類
  - '5.32'
  - '12.10'
  - 8.4.2.1
  - 費用中的選擇
  - 攻撃時目標被破壞後不交戰
cards:
  - BP01-173
  - BP01-176
  - BP11-P30
  - SD02-002
why: "[astra] 操縱要橫置原費用合計至少 5 的從者；成功成為有突進的從者，本回合可攻擊。\n[fable] 魔導列車「{起動}{コスト1}場のフォロワーを元のコストの合計が5以上になるように好きな枚数{アクト}：これを操縦する」：操縦＝本回合變成卡面 4/5 的從者（5.32.1）； 【突進】；【攻撃時】破壞アクト狀態的對手從者並 +2。Q1581：從回合開始就在場的護符操縦後可攻擊リーダー；本回合才進場的只能靠突進攻擊アクト狀態的從者。 攻撃時把目標破壞後，8.4.9 沒有目標 → 不交戰，列車保持アクト。"
discriminates: "[astra] 不檢查總原費用或把已橫置也算費用會改變 PP 與攻擊合法性。\n[fable] 操縦後仍當護符（不能攻擊）的引擎 A 會 cannot-attack；沒實作「本回合進場不能攻擊リーダー」的引擎 B 的 after-decision-2 會 resolved； 攻撃時破壞目標後仍讓目標對列車造成交戰傷害的引擎，列車體力不是 5。"
refs:
  rules:
    - 5.32.1
    - 10.4.2.2
    - 12.10.2
    - 10.4.2.1
    - 8.4.2.1
    - 8.4.3.1
    - 8.4.9
    - 12.7.2
    - 5.6.1
  qa:
    - Q1581
    - Q1584
evidence:
  - ref: Q1581
    quote: "「これを操縦する。」とは、そのターン、それをカードに記載されている攻撃力と体力を持つフォロワーにすることを意味します。\n「これは操縦する。」を持つカードが場に出たターンに操縦してフォロワーになった場合、通常のフォロワーと同様に、そのターンは相手を攻撃することができません。（【疾走】を持っている場合、相手のリーダーと相手のアクト状態のフォロワーに、【突進】を持っている場合、相手のアクト状態のフォロワーに攻撃できます。）\n場に出たターンの次のターン以降に操縦してフォロワーになった場合は、相手を攻撃することができます。"
  - ref: cr 5.32.1
    quote: "あるアミュレットを‘操縦する’指示がある場合、そ\nのアミュレットがカードに表記の攻撃力と体力を持つ\nなら、そのターンの間、そのアミュレットはフォロワー\nになり、攻撃力と体力はその値になります。"
    derivation:
      - 操縱要橫置原費用合計至少 5 的從者；成功成為有突進的從者，本回合可攻擊。
  - ref: cr 10.4.2.2
    quote: "コストのうち一部または全部を支払うことが\n不可能である場合、このコストはまったく支払\nうことはできません。"
    derivation:
      - 操縱要橫置原費用合計至少 5 的從者；成功成為有突進的從者，本回合可攻擊。
  - ref: cr 12.10.2
    quote: "‘【突進】’は‘このフォロワーは、このターンの最\n初から連続して自分がマスターであった状態でない\n場合でも、攻撃目標としてアクト状態のフォロワーを\n選ぶ場合にのみ攻撃フォロワーとして選択できる’を\n意味します。"
    derivation:
      - 操縱要橫置原費用合計至少 5 的從者；成功成為有突進的從者，本回合可攻擊。
  - ref: Q1581
    quote: 「これを操縦する。」とは、そのターン、それをカードに記載されている攻撃力と体力を持つフォロワーにすることを意味します。「これは操縦する。」を持つカードが場に出たターンに操縦してフォロワーになった場合、通常のフォロワーと同様に、そのターンは相手を攻撃することができません。 （…【突進】を持っている場合、相手のアクト状態のフォロワーに攻撃できます。）場に出たターンの次のターン以降に操縦してフォロワーになった場合は、相手を攻撃することができます。
  - ref: cr 8.4.9
    quote: この時点で攻撃フォロワーが場に存在する場合、攻撃フォロワーはその攻撃力に等しいダメージを攻撃目標に与えます。
    derivation:
      - 攻擊目標在 8.4.6 的檢查時點已被破壞 → 8.4.9 沒有目標可給傷害、也沒有 8.4.9.1 的反擊
status: draft
