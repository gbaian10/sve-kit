  - name: '[fable] A 回合開始就在場的列車：操縦 → 攻擊アクト從者 → 攻撃時破壞它並 +2 → 不交戰'
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 6
          P2: 5
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ナイトメア
            life: 18
          pp:
            current: 2
            max: 6
          zones:
            field:
              - id: a1
                card: BP11-P30
              - id: a2
                card: BP01-176
              - id: a3
                card: SD02-002
            hand:
              - filler: 2
            deck:
              - filler: 20
        P2:
          construction: class
          leader:
            class: ロイヤル
            life: 20
          pp:
            current: 0
            max: 6
          zones:
            field:
              - id: b1
                card: BP01-173
                state:
                  acted: true
            hand:
              - filler: 3
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: activate
        ability:
          source: a1
          line: 1
        costs:
          1:
            - a2
      - n: 2
        by: P1
        at: main
        do: attack
        attacker: a1
        target: b1
      - n: 3
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a1
            line: 3
        targets:
          1:
            - b1
      - n: 4
        by: P2
        at: quick
        do: pass
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 1
          P1.field.a2:
            acted: true
          P1.field.a3:
            acted: false
          P1.field.a1:
            power: 4
            hp: 5
        events:
          - kind: アクト
            object: a2
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P2.field: []
          P1.leader.life: 20
          P1.field.a1:
            acted: true
            hp: 5
        events:
          - kind: 攻撃
            attacker: a1
            target: b1
          - kind: 破壊
            object: b1
          - kind: 体力増加
            target: P1.leader
            amount: 2
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a1:
            acted: true
            hp: 5
        forbidden_events:
          - kind: ダメージ
