why: >-
  R-0020（inferred）依 Q660 與不能執行的指示略過原則，護符沒有可被增減的攻擊力或體力，サムライ的起動仍可打出，後續賦予突進照常。
discriminates: >-
  把強化當成在護符期間仍成功的數值處理，會產生體力增加事件。
