why: "[astra] 同時待機依當前 active，與先攻玩家無關；交換 active 後先處理的能力也交換。\n[fable] 竜の翼「フォロワーすべてに2ダメージ」同時破壞雙方各兩隻有ラストワード的從者。10.5.2.2：回合玩家 P1 先處理自己的兩個（每結算一個都回到 10.5.2.1 再查回合玩家）， P2 完全不能插入；P1 都處理完才輪到 P2（10.5.2.3）。P2 的サロメ需要目標，此時 P1 場上已空 → 取消一次（10.7.3.2）， デモンビーター照常結算。局面 B 給 P1 留一隻存活的從者，サロメ有目標可選。"
discriminates: "[astra] 永遠 P1 優先或先攻優先會在 P2 回合提供錯選項。\n[fable] after-decision-1 的 awaiting 只能列 P1 的兩個待機；「雙方輪流」或「單一 FIFO」的實作會列出 P2 的或讓 P2 先動。 局面 A 各比對點的 events_exact [プレイ] 合起來必須是 a1、a2、b2（b1 取消、沒有プレイ）；把「選不到目標」實作成跳過其他待機或卡住的引擎，b2 的 +1 不會發生（P2 體力 18 而非 19）。"
refs:
  rules:
    - 10.5.2.2
    - 10.5.2.3
    - 10.5.2.1
    - 10.5.2.4
    - 10.7.2.1
    - 10.7.3
    - 10.7.3.1
    - 10.7.3.2
