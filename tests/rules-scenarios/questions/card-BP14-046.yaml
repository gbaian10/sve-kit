    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ウィッチ
            life: 20
          pp:
            current: 8
            max: 8
          zones:
            deck:
              - id: g1
                card: BP01-171
              - id: g2
                card: BP01-171
              - filler: 18
            hand:
              - id: wish
                card: BP14-046
            ex:
              - id: old1
                card: BP01-173
              - id: old2
                card: BP01-173
              - id: old3
                card: BP01-173
        P2:
          construction: class
          leader:
            class: ロイヤル
            life: 20
          pp:
            current: 0
            max: 7
          zones:
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: wish
      - n: 2
        by: P1
        at: main
        do: play
        card: g1
      - n: 3
        by: P1
        at: main
        do: play
        card: g2
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 1
          P1.ex:
            - old1
            - old2
            - old3
            - g1
            - g2
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 1
          P1.ex:
            - old1
            - old2
            - old3
            - g2
          P1.field:
            - g1
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P1.ex:
            - old1
            - old2
            - old3
          P1.field:
            - g1
            - g2
