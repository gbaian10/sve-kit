why: "[astra] SC 在第一張解決時固定；10 張時失去謝幕曲，9 張時保留，之後被第二張法術殺死再檢查。\n[fable] スノーアウェイク「それの攻撃力と体力を1にする。【スペルチェイン_10】それは能力すべてを失う」：スペルチェイン數的是墓場**法術張數**（13.3.1.2），同名重複也算 （sve-client 曾誤用「不同名」計數）；結算中自身還在解決領域不算（13.3.1.3）。失去能力後被破壞，ラストワード不誘發（Q2107）。"
discriminates: "[astra] 若法術算入自身或場外原卡重建謝幕曲，待機集合會不同。\n[fable] 用「不同卡名數」計算的引擎在 A 只算到 4 種 → 不失去能力 → デモンビーター的 LW 會待機、P2 回體力； 把解決中的自身算進去的引擎在 B（9 張＋自身）會誤判成立。"
refs:
  rules:
    - 13.3.1.3
    - 13.3.1.4
    - 10.7.4.1.2
    - 13.3.1.2
    - 10.9.1.2
    - 5.31.2
    - 12.5.1
    - '12.8'
  qa:
    - Q2107
    - Q2104
evidence:
  - ref: Q2107
    quote: いいえ。能力を失っているので《ラストワード》能力は誘発しません。
  - ref: cr 13.3.1.3
    quote: "このカード自身の解決中はこのカードはま\nだ解決領域にあるため、このカードは自身の\n墓場のスペルの枚数に数えません。"
    derivation:
      - SC 在第一張解決時固定；10 張時失去謝幕曲，9 張時保留，之後被第二張法術殺死再檢查。
  - ref: cr 13.3.1.4
    quote: "スペルチェインが参照する墓場のスペルの\n枚数は、原則としてそのスペルチェインを含む\n効果の解決の開始時点で固定され、その解決\n中にカードの枚数が変わっても変更されませ\nん。"
    derivation:
      - SC 在第一張解決時固定；10 張時失去謝幕曲，9 張時保留，之後被第二張法術殺死再檢查。
  - ref: cr 10.7.4.1.2
    quote: "カードが場からそれ以外の領域に移\n動することによって誘発する自動能力が\nカードの情報を求める場合、そのカードが\n場にある時点での情報を用います。"
    derivation:
      - SC 在第一張解決時固定；10 張時失去謝幕曲，9 張時保留，之後被第二張法術殺死再檢查。
  - ref: cr 13.3.1.2
    quote: ‘【スペルチェイン （数値）】（テキスト）’または‘【SC （数値）】（テキスト）’は‘あなたの墓場のスペルが（数値）枚以上である場合、（テキスト）’を意味します。
  - ref: cr 13.3.1.3
    quote: このカード自身の解決中はこのカードはまだ解決領域にあるため、このカードは自身の墓場のスペルの枚数に数えません。
