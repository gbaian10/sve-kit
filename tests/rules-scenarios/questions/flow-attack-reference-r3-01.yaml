why: 茨の森賦予的能力參照既有攻擊對象，不重新選擇，因此オーラ不阻止；攻擊主戰者不造成能力傷害。
discriminates: 錯把參照當選擇目標會取消待機；漏判フォロワー條件會提前傷害主戰者。
refs:
  rules:
    - 10.6.2.3
  qa:
    - Q450
evidence:
  - ref: Q450
    quote: "Q: 「【攻撃時】フォロワーへ攻撃したなら、それに2ダメージ」を持った自分のフォロワーは【オーラ】を持つ相手のフォロワーに2ダメージ与えますか？\nA: はい。2ダメージ与えます。"
    derivation:
      - 茨の森賦予的能力參照既有攻擊對象，不重新選擇，因此オーラ不阻止；攻擊主戰者不造成能力傷害。
  - ref: cr 10.6.2.3
    quote: そのカードや能力が非公開領域のカード 以外のなんらかの事物を‘選ぶ’場合、それ （以下‘目標’）を選びます。
    derivation:
      - 茨の森賦予的能力參照既有攻擊對象，不重新選擇，因此オーラ不阻止；攻擊主戰者不造成能力傷害。
