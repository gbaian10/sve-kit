schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: rule-8.3.2-01
kind: rule
must_pass: true
mechanisms:
  - 進化卡自身的能力
  - 本回合歷史
  - 8.3.2.1
  - 12.2.5
  - 10.4.6
  - 8.1.2
  - 進化每回合一次
  - 橫置狀態也能進化
  - 需要橫置的起動能力在已橫置時不能用
cards:
  - BP01-171
  - BP01-172
  - BP19-050
  - BP19-051
  - BP05-108
  - BP01-173
why: "[astra] 第一次進化用掉本回合進化相當能力額度；第二張的進化也不能使用。\n[fable] 進化能力（起動能力）每回合只能打出一次（8.3.2.1）；進化不要求スタンド狀態，アクト狀態的從者也能進化（12.2 沒有此限制）； 已進化的從者沒有進化能力可用（12.2.5、5.16.4）。「これを{アクト}」費用是「場のスタンド状態のこのカードをアクトする」（10.4.6）→ 已アクト時付不出 → 不能起動（8.1.2）。"
discriminates: "[astra] 按物件各一次而非玩家每回合一次會讓 b 進化並再扣 4。\n[fable] 不允許アクト狀態進化的引擎 after-decision-1 會 cannot-evolve；允許同回合第二次進化的引擎 after-decision-3 會 resolved； 允許已アクト的リリエル再付アクト費用的引擎 after-decision-5 會 resolved 並造成 2 傷害。"
refs:
  rules:
    - 8.3.2.1
    - 8.3.2
    - 12.2.1
    - 12.2.3
    - 12.2.5
    - 5.16.4
    - 10.4.6
    - 10.4.2.2
    - 8.1.2
    - 10.6.2.1.2
  qa:
    - Q1376
evidence:
  - ref: cr 8.3.2.1
    quote: "起動能力を指定する際、それが進化能力ま\nたは進化相当能力である場合、このターンに\nターンプレイヤーがいずれかの進化能力や進\n化相当能力をすでにプレイ済みである場合、\nその起動能力は指定できません。"
    derivation:
      - 第一次進化用掉本回合進化相當能力額度；第二張的進化也不能使用。
  - ref: cr 8.3.2.1
    quote: 起動能力を指定する際、それが進化能力または進化相当能力である場合、このターンにターンプレイヤーがいずれかの進化能力や進化相当能力をすでにプレイ済みである場合、その起動能力は指定できません。
  - ref: cr 10.4.6
    quote: コストのうち、 は‘場のスタンド状態のこのカードをアクトする’を意味します。
  - ref: cr 12.2.5
    quote: 特殊な種類‘エボルヴ’を持つカードが進化能力を持っている場合、その進化能力はプレイできません。
status: verified
author:
  - astra
  - fable
verified_by:
  - by: astra
    method: independent-derivation
    note: A：xverify-1/result.md:58〈22 個重疊題〉（5.16.2、8.3.2.1）
  - by: fable
    method: independent-derivation
    note: 8.3.2.1；xverify-1/result.md〈22 個重疊題〉。之後未再改
scenarios:
  - name: '[astra] 第一次進化'
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: a
                card: BP01-171
              - id: b
                card: BP01-171
            evolve_deck:
              - id: e
                card: BP01-172
              - id: f
                card: BP01-172
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: evolve
        source: a
        evolve_card: e
        pay:
          pp: 4
          ep: 0
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 6
          P1.field.a:
            evolved: true
          P1.field.b:
            evolved: false
          P1.evolve_deck:
            - f
  - name: '[astra] 第二次進化被拒'
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: a
                card: BP01-171
              - id: b
                card: BP01-171
            evolve_deck:
              - id: e
                card: BP01-172
              - id: f
                card: BP01-172
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: evolve
        source: a
        evolve_card: e
        pay:
          pp: 4
          ep: 0
      - n: 2
        by: P1
        at: main
        do: evolve
        source: b
        evolve_card: f
        pay:
          pp: 4
          ep: 0
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: cannot-evolve
        assert:
          P1.pp.current: 6
          P1.field.a:
            evolved: true
          P1.field.b:
            evolved: false
          P1.evolve_deck:
            - f
  - name: '[fable] A アクト狀態的從者可以進化；同回合第二隻不能；已アクト的リリエル不能起動'
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 5
          P2: 4
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ウィッチ
            life: 20
          pp:
            current: 4
            max: 5
          ep: 2
          zones:
            field:
              - id: a1
                card: BP19-050
                state:
                  acted: true
              - id: a2
                card: BP19-050
              - id: a3
                card: BP05-108
                state:
                  acted: true
            evolve_deck:
              - id: e1
                card: BP19-051
              - id: e2
                card: BP19-051
            hand:
              - filler: 2
            deck:
              - filler: 20
        P2:
          construction: class
          leader:
            class: ロイヤル
            life: 20
          pp:
            current: 0
            max: 5
          zones:
            hand:
              - filler: 3
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: evolve
        source: a1
        ability:
          source: a1
          line: 1
        evolve_card: e1
        pay:
          pp: 1
          ep: 0
          sep: 0
      - n: 2
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a1
            card: BP19-051
            line: 1
        targets:
          1:
            - P2.leader
      - n: 3
        by: P1
        at: main
        do: evolve
        source: a2
        ability:
          source: a2
          line: 1
        evolve_card: e2
        pay:
          pp: 0
          ep: 1
          sep: 0
      - n: 4
        by: P1
        at: main
        do: evolve
        source: a1
        ability:
          source: a1
          line: 1
        evolve_card: e2
        pay:
          pp: 0
          ep: 1
          sep: 0
      - n: 5
        by: P1
        at: main
        do: activate
        ability:
          source: a3
          line: 2
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a1:
            evolved: true
            evolved_with: e1
            acted: true
            power: 3
            hp: 3
          P1.pp.current: 3
          P1.ep: 2
          P2.leader.life: 18
        events:
          - kind: 進化
            object: a1
            with: e1
      - at: after-decision-3
        view: omniscient
        outcome: cannot-evolve
        assert:
          P1.field.a2:
            evolved: false
          P1.ep: 2
          P1.evolve_deck:
            - e2
      - at: after-decision-4
        view: omniscient
        outcome: cannot-evolve
        assert:
          P1.field.a1:
            evolved: true
            evolved_with: e1
          P1.evolve_deck:
            - e2
      - at: after-decision-5
        view: omniscient
        outcome: cannot-activate
        assert:
          P2.leader.life: 18
          P1.field.a3:
            acted: true
        forbidden_events:
          - kind: ダメージ
