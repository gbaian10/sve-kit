schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP14-081
kind: card
must_pass: true
mechanisms: [進化後保留加值與被給予的能力, 5.16.2, 5.16.2.1, 疾走, 12.9.2, 8.4.3.1, entered_from, 條件管到段落結尾, sections 裡的主效果]
cards: [BP14-081, BP14-074, BP14-075, BP14-P20, BP01-173]
why: >-
  惑わぬ意志 的主效果在 sections（「自分の墓場の元のコスト2以下の宴楽・フォロワー1枚を選ぶ。それを場に出す。それが『因果の迷い子・アンサージュ』なら、それは攻撃力+1して、【疾走】を持つ」）。
  C 筆記待查證：「+1 進化後是否保留」→ 依 5.16.2「それに適用されていた効果も引き続き適用され続けます」與 5.16.2.1（進化前攻擊力與原始值的差額加到進化後）：
  アンサージュ 2/2 → 3/2 → 進化（3/3）→ 4/3，【疾走】也保留 → 同回合可以攻擊リーダー（12.9.2）造成 4。
  B：復活的不是アンサージュ（ドアマンバット，手牌 3 張時ファンファーレ 什麼都不做）→ 沒有疾走 → 本回合不能攻擊（8.4.3.1）。
discriminates: >-
  進化時重設數值的引擎：A 攻擊造成 3 而非 4。進化時丟掉被給予的【疾走】的引擎：A 的 after-decision-6 會 cannot-attack。
  把 sections 的文字當成非能力的引擎：整張牌沒有效果。
refs:
  rules: [5.16.2, 5.16.2.1, 5.16.2.2, 12.9.2, 8.4.2.1, 8.4.3.1, 5.5.3, 12.4.3]
  qa: [Q1923, Q1934]
evidence:
  - ref: cr 5.16.2
    quote: カードが進化した場合においても、そのカードは引き続きそれ以前と同一のカードであるとみなされます。それのカードのスタンド/アクト状態は変わらず、それに適用されていた効果も引き続き適用され続けます。
    derivation: [「+1」與「【疾走】を持つ」都是套用在這張卡上的效果 → 進化後繼續適用]
  - ref: cr 5.16.2.1
    quote: 進化前のカードの攻撃力や体力が、進化前のカードの元の攻撃力や体力と異なっている場合、その差分に等しい値を、進化後のカードの表記の攻撃力や体力から加減します。
    derivation: [進化前 3（原始 2）→ 差額 +1 → 進化後 3 + 1 = 4]
  - ref: Q1923
    quote: 場に出した『モーターグレイブディガー』の攻撃力と体力は1になります。この『モーターグレイブディガー』が進化した場合、攻撃力と体力は2になります。
    derivation: [同一條 5.16.2.1 的官方實例：設值造成的差額在進化後保留]
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: A／B：xverify-2/result.md:257〈全部實質核驗局面的索引〉（5.16.2、5.16.2.1、Q1923、Q1934）

scenarios:
  - name: A 復活アンサージュ +1／疾走 → 進化後 4/3 且仍有疾走 → 攻擊リーダー 4
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 4, P2: 3}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ナイトメア, life: 20}
          pp: {current: 4, max: 4}
          ep: 2
          zones:
            hand:
              - {id: a1, card: BP14-081}          # 惑わぬ意志（コスト2）
              - {id: h1, card: BP01-173}
              - {id: h2, card: BP01-173}
              - {id: h3, card: BP01-173}
            cemetery:
              - {id: c1, card: BP14-074}          # 因果の迷い子・アンサージュ 2/2
              - {id: c2, card: BP14-P20}          # ドアマンバット 2/2（宴楽、コスト1）
            evolve_deck:
              - {id: e1, card: BP14-075}          # アンサージュ（エボルヴ）3/3
            deck:
              - {id: d1, card: BP01-173}
              - {id: d2, card: BP01-173}
              - {id: d3, card: BP01-173}
              - {id: d4, card: BP01-173}
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 3}
          zones:
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, targets: {1: [c1]}}
      - {n: 2, by: P1, at: main, do: evolve, source: c1, ability: {source: c1, line: 2}, evolve_card: e1, pay: {pp: 1, ep: 0}}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: c1, card: BP14-075, line: 1}}}
      - {n: 4, by: P1, at: resolve, of: {decision: 3, occurrence: 1}, do: resolve-choice, select: []}
      - {n: 5, by: P1, at: resolve, of: {decision: 3, occurrence: 2}, do: resolve-choice, order: [d1, d2, d3, d4]}
      - {n: 6, by: P1, at: main, do: attack, attacker: c1, target: P2.leader}
      - {n: 7, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 2
          P1.field: [c1]
          P1.field.c1: {power: 3, hp: 2, entered_from: cemetery, entered_by: effect}
          P1.cemetery: [c2, a1]
        events:
          - {kind: 場に出す, object: c1, from: P1.cemetery}
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 1
          P1.field.c1: {evolved: true, evolved_with: e1, power: 4, hp: 3}
        events:
          - {kind: 進化, object: c1, with: e1}
      - at: after-decision-5
        view: omniscient
        outcome: resolved
        assert:
          P1.deck: [filler: 20, d1, d2, d3, d4]
          P1.ex: []
      - at: after-decision-7
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 16
          P1.field.c1: {acted: true}
        events:
          - {kind: 攻撃, attacker: c1, target: P2.leader}
          - {kind: ダメージ, source: c1, target: P2.leader, amount: 4}

  - name: B 復活的不是アンサージュ → 沒有 +1 也沒有疾走 → 本回合不能攻擊
    inherit: A 復活アンサージュ +1／疾走 → 進化後 4/3 且仍有疾走 → 攻擊リーダー 4
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, targets: {1: [c2]}}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: c2, line: 1}}}
      - {n: 3, by: P1, at: main, do: attack, attacker: c2, target: P2.leader}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.field: [c2]
          P1.field.c2: {power: 2, hp: 2, entered_from: cemetery}
          P1.hand: [h1, h2, h3]
      - at: after-decision-3
        view: omniscient
        outcome: cannot-attack
        assert:
          P1.field.c2: {acted: false}
          P2.leader.life: 20
        forbidden_events:
          - {kind: 攻撃}
