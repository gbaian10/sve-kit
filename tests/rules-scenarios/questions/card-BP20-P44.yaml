schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP20-P44
kind: card
must_pass: true
mechanisms: [牌庫送墓不等於敗北, 牌庫抽空, 5.10.1.1, 11.2.2, 1.2.1.2, 1.3.2, LO 勝利路線, 回合特定時點]
cards: [BP20-P44, BP01-173]
why: >-
  敗北條件是「デッキが 0 枚のときにカードを引いた」（1.2.1.2、5.10.1.1、11.2.2），不是「牌庫變成 0 張」。
  A：泡沫の鬼姫「自分のデッキの上3枚を墓場に置く」在牌庫只剩 2 張時能放多少放多少（1.3.2）→ 牌庫 0，遊戲繼續；
  到自己下一個開始階段 7.2.4 抽牌抽不到 → 7.2.5 檢查時點依 11.2.2 敗北。
  B：對手牌庫 0 → 對手開始階段抽不到 → 對手敗北（LO 勝利）。C：剛好 3 張 → 送墓 3 張、牌庫 0、不敗北。
discriminates: >-
  把「牌庫 0 張」當敗北的引擎：A 在 after-decision-2 就 game-end、C 也 game-end。把送墓不足 3 張當成整個指示失敗的引擎：A 的墓場會是空的。
  在抽牌當下（不等檢查時點）判負的引擎，A 的事件順序不同（敗北在檢查時點）。
refs:
  rules: [1.2.1.2, 5.10.1.1, 11.2.2, 1.3.2, 7.2.4, 7.2.5, 11.1.2]
  qa: []
evidence:
  - ref: cr 1.2.1.2
    quote: いずれかのプレイヤーのデッキが 0 枚のときにそのプレイヤーがカードを引いた場合、そのプレイヤーは敗北条件を満たします。
    derivation: [送墓 3 張把牌庫清空不是「引いた」→ 不滿足敗北條件, 下一個自己開始階段 7.2.4 抽牌時牌庫 0 → 5.10.1.1 → 7.2.5 檢查時點 11.2.2 敗北]
  - ref: cr 1.3.2
    quote: なんらかの理由によりプレイヤーが実行不可能なことを実行するよう指示された場合、その指示のうち実行可能な部分のみを実行します。
    derivation: [牌庫 2 張時「上3枚を墓場に置く」→ 放 2 張]
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: A：xverify-2/recheck.md:113〈全部改動局面的核對索引〉；B／C：xverify-2/result.md:266〈全部實質核驗局面的索引〉（1.2.1.2、5.10.1.1）

scenarios:
  - name: A 牌庫 2 張：送墓 3 張只放 2 張、牌庫 0 不敗北 → 下個自己開始階段抽不到 → 敗北
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 6, P2: 5}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ナイトメア, life: 20}
          pp: {current: 6, max: 6}
          zones:
            hand:
              - {id: a1, card: BP20-P44}          # 泡沫の鬼姫（ファンファーレ デッキの上3枚を墓場に置く）
            deck:
              - {id: d1, card: BP01-173}
              - {id: d2, card: BP01-173}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 5}
          zones:
            hand:
              - {filler: 3}
            deck:
              - {id: p1, card: BP01-173}
              - {filler: 10}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}}
      - {n: 3, by: P1, at: main, do: end-phase}
      - {n: 4, by: P2, at: quick, do: pass}
      - {n: 5, by: P2, at: main, do: end-phase}
      - {n: 6, by: P1, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          game: {ended: false}
          P1.deck: []
          P1.cemetery: [d1, d2]
          P1.field: [a1]
        events:
          - {kind: 移動, object: d1, from: P1.deck, to: P1.cemetery, group: 1}
          - {kind: 移動, object: d2, from: P1.deck, to: P1.cemetery, group: 1}
        forbidden_events:
          - {kind: 敗北}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          game: {ended: false}
          turn: {active: P2, phase: main}
          P2.hand_count: 4
      - at: after-decision-6
        view: omniscient
        outcome: game-end
        assert:
          game: {ended: true, winner: P2, by: 11.2.2}
          P1.deck: []
        events:
          - {kind: 敗北, player: P1, by: rule-11.2.2}

  - name: B 對手牌庫 0：自己結束回合 → 對手開始階段抽不到 → 對手敗北
    inherit: A 牌庫 2 張：送墓 3 張只放 2 張、牌庫 0 不敗北 → 下個自己開始階段抽不到 → 敗北
    setup:
      players:
        P2:
          zones:
            deck: []
    decisions:
      - {n: 1, by: P1, at: main, do: end-phase}
      - {n: 2, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: game-end
        assert:
          game: {ended: true, winner: P1, by: 11.2.2}
          P1.deck: [d1, d2]
        events:
          - {kind: 敗北, player: P2, by: rule-11.2.2}

  - name: C 牌庫剛好 3 張：送墓 3 張 → 牌庫 0、不敗北
    inherit: A 牌庫 2 張：送墓 3 張只放 2 張、牌庫 0 不敗北 → 下個自己開始階段抽不到 → 敗北
    setup:
      players:
        P1:
          zones:
            deck:
              - {id: d1, card: BP01-173}
              - {id: d2, card: BP01-173}
              - {id: d3, card: BP01-173}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          game: {ended: false}
          P1.deck: []
          P1.cemetery: [d1, d2, d3]
        forbidden_events:
          - {kind: 敗北}
