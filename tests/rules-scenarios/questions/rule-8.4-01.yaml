schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: rule-8.4-01
kind: rule
must_pass: true
mechanisms: [8.4.7, 8.4.8, 8.4.9, 8.4.3.1, '12.8', '12.3', Quick 時點：攻擊後、傷害前, 守護, EX 區打出 Quick, 持續效果與禁止]
cards: [SD02-002, BP20-073, BP01-176, BP14-T07, BP01-173, BP05-108]
why: >-
  攻擊流程：8.4.5 攻撃した → 8.4.6 檢查時點 → 8.4.7 非回合玩家的クイック時點（可反覆）→ 8.4.9 才造成傷害，且「この時点で攻撃フォロワーが場に存在する場合」。
  A：P2 在クイック時點用サンダーレイジ打死攻擊者 → 8.4.9 不造成傷害，但「攻撃した」已發生（Q1375）。A2：P2 沒有クイック可用 → 唯一選項是 pass。
  B：守護只在アクト狀態時強制被選為目標（12.8.2、8.4.3.1）；直立的守護不擋。C：EX 區的クイック token（水銀の断絶）可在 8.4.7 打出，P2 リーダー受的傷害 −1，
  且クイック時點會回到 8.4.7 再問一次。
discriminates: >-
  A：在攻擊宣告時就結算傷害、或攻擊者離場後仍造成傷害的引擎，P2 體力會變 17；不在 8.4.7 停下來問 P2 的引擎 after-decision-1 不會等待 P2。
  A2：明明沒有クイック還列出其他選項、或直接跳過的引擎 awaiting 不同。B：不強制守護目標的引擎會接受對リーダー的攻擊；把直立守護也當強制的引擎 B2 會拒絕。
  C：不允許從 EX 打出クイック的引擎 P2 體力 17、手牌不變。
refs:
  rules: [8.4.2, 8.4.3.1, 8.4.3.2, 8.4.4, 8.4.5, 8.4.6, 8.4.7, 8.4.8, 8.4.9, 8.4.10, 12.3.2, 12.3.4, 12.8.2, 10.3.6, 9.1.4.3, 5.14.2]
  qa: [Q1375, Q2665]
evidence:
  - ref: cr 8.4.9
    quote: この時点で攻撃フォロワーが場に存在する場合、攻撃フォロワーはその攻撃力に等しいダメージを攻撃目標に与えます。
  - ref: Q1375
    quote: はい。攻撃フォロワーがクイックタイミングで破壊されていても攻撃した事象は発生しているため、「そのターン中に自分の場のアクアフォース・フォロワーが攻撃した回数」に数えることができます。
  - ref: cr 8.4.8
    quote: 8.4.7 でカードまたは能力をプレイした場合、チェックタイミングが発生し、その後再び 8.4.7 に戻ります。
  - ref: cr 12.8.2
    quote: ‘これがフォロワーである場合、相手が攻撃目標を選択する際、可能なら【守護】を持つアクト状態のあなたのフォロワーを攻撃目標として選択する’を意味します（8.4.3）。
  - ref: cr 12.3.4
    quote: クイックを持つカードや起動能力は、相手のフォロワーによる攻撃後（8.4.7）や相手ターンの終了時（7.4.5）にプレイすることができます。
  - ref: cr 7.3.3
    quote: 手札か EX エリアのカードを 1 枚プレイする（8.2）。
    derivation:
      - 8.4.7 同樣寫「手札か EX エリアの【クイック】を持つカードを 1 枚プレイする」→ EX 區的クイック token 可在此打出
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: A／A2／B／B2：xverify-1/result.md:128〈其他驗過的題目〉（12.8.2、8.4.3.2、Q1375）；C：xverify-2/result.md:251〈全部實質核驗局面的索引〉（8.4.2、8.4.3.1、Q1375、Q2665）

scenarios:
  - name: A クイック時點打死攻擊者 → 8.4.9 不造成傷害；awaiting 列出 pass 與可打的クイック
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 5, P2: 4}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 5, max: 5}
          zones:
            field:
              - {id: a1, card: SD02-002}          # ヴァンガード・レイサム 3/3
            hand:
              - {filler: 2}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 4, max: 4}
          zones:
            hand:
              - {id: b2, card: BP20-073}          # サンダーレイジ（クイック、6 ダメージ）
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: attack, attacker: a1, target: P2.leader}
      - {n: 2, by: P2, at: quick, do: play, card: b2, targets: {1: [a1]}}
      - {n: 3, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        awaiting:
          by: P2
          choices:
            - {do: pass}
            - {do: play, card: b2, targets: {1: [a1]}}
        assert:
          P1.field.a1: {acted: true}
          P2.leader.life: 20
        events:
          - {kind: アクト, object: a1}
          - {kind: 攻撃, attacker: a1, target: P2.leader}
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        awaiting:
          by: P2
          choices:
            - {do: pass}
        assert:
          P1.field: []
          P1.cemetery: [a1]
          P2.pp.current: 0
          P2.leader.life: 20
        events:
          - {kind: ダメージ, source: b2, target: a1, amount: 6}
          - {kind: 破壊, object: a1, by: rule-11.3.1}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 20
        forbidden_events:
          - {kind: ダメージ, target: P2.leader}

  - name: A2 P2 沒有クイック可用 → 8.4.7 只有 pass；傷害照常
    inherit: A クイック時點打死攻擊者 → 8.4.9 不造成傷害；awaiting 列出 pass 與可打的クイック
    setup:
      players:
        P2:
          zones:
            hand:
              - {id: b2, card: BP01-173}          # 非クイック
    decisions:
      - {n: 1, by: P1, at: main, do: attack, attacker: a1, target: P2.leader}
      - {n: 2, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        awaiting:
          by: P2
          choices:
            - {do: pass}
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 17
        events:
          - {kind: ダメージ, source: a1, target: P2.leader, amount: 3}

  - name: B アクト狀態的守護在場 → 攻擊リーダー不合法；攻擊該守護合法
    inherit: A クイック時點打死攻擊者 → 8.4.9 不造成傷害；awaiting 列出 pass 與可打的クイック
    setup:
      players:
        P2:
          zones:
            field:
              - {id: b1, card: BP01-176, state: {acted: true}}   # 天剣の乙女 4/6【守護】
            hand:
              - {filler: 3}
    decisions:
      - {n: 1, by: P1, at: main, do: attack, attacker: a1, target: P2.leader}
      - {n: 2, by: P1, at: main, do: attack, attacker: a1, target: b1}
      - {n: 3, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-attack
        assert:
          P1.field.a1: {acted: false}
          P2.leader.life: 20
        forbidden_events:
          - {kind: 攻撃}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b1: {hp: 3}
          P1.field: []
          P2.leader.life: 20
        events:
          - {kind: 攻撃, attacker: a1, target: b1}
          - {kind: ダメージ, source: a1, target: b1, amount: 3, group: 1}
          - {kind: ダメージ, source: b1, target: a1, amount: 4, group: 1}
          - {kind: 破壊, object: a1}

  - name: B2 直立的守護不強制 → 攻擊リーダー合法
    inherit: B アクト狀態的守護在場 → 攻擊リーダー不合法；攻擊該守護合法
    setup:
      players:
        P2:
          zones:
            field:
              - {id: b1, card: BP01-176}
    decisions:
      - {n: 1, by: P1, at: main, do: attack, attacker: a1, target: P2.leader}
      - {n: 2, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 17
          P2.field.b1: {hp: 6}

  - name: C EX 區的クイック token 在 8.4.7 打出：受的傷害 −1、抽 1 張；打完回到 8.4.7 再問
    inherit: A クイック時點打死攻擊者 → 8.4.9 不造成傷害；awaiting 列出 pass 與可打的クイック
    setup:
      players:
        P2:
          leader: {class: ビショップ, life: 20}
          pp: {current: 1, max: 4}
          zones:
            hand:
              - {id: b5, card: BP01-173}          # 非クイック：讓 8.4.7 的合法選項可完整列出
            ex:
              - {id: b3, card: BP14-T07}          # 水銀の断絶（クイック、コスト1）
            deck:
              - {id: b4, card: BP01-173}
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: attack, attacker: a1, target: P2.leader}
      - {n: 2, by: P2, at: quick, do: play, card: b3}
      - {n: 3, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        awaiting:
          by: P2
          choices:
            - {do: pass}
            - {do: play, card: b3}
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        awaiting:
          by: P2
          choices:
            - {do: pass}
        assert:
          P2.pp.current: 0
          P2.hand: [b5, b4]
          P2.ex: []
        events:
          - {kind: プレイ, object: b3}
          - {kind: 引く, player: P2, object: b4}
          - {kind: 消去, object: b3}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 18
        events:
          - {kind: ダメージ, source: a1, target: P2.leader, amount: 2}
