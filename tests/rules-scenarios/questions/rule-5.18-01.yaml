why: "[astra] 2 つまで下限一；同時選 3 與 1 時，打出時先支付翻面費用，效果仍依卡面先破壞再抽牌。\n[fable] ダークエンジェル・オリヴィエ「2つまでチョイス」：下限 1（5.18.2.1、Q293）、不可重複（Q294）、在打出時決定（5.18.3）， 合法的選項集合是 4 個單選＋6 個雙選共 10 種；選中的依卡面順序結算（10.6.2.8.2.2）。【4】讓對手捨牌，捨哪張由對手在結算中途決定。"
discriminates: "[astra] 依 options 列表順序處理會先抽牌再破壞；結算時才支付翻面費用會額外暫停；允許空選項會錯扣費。\n[fable] awaiting 若包含 []（0 個）或 [1,1] 之類重複，或缺少任一合法組合，就是抉擇規則實作錯； B 中若引擎替 P2 隨機捨牌、或不停下來讓 P2 選，事件與手牌會不同；若 EP+1 因「EP 有上限」而沒有發生也可觀察（Q337）。"
refs:
