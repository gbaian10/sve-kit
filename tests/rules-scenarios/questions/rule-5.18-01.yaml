evidence:
  - ref: Q2275
    quote: いいえ。1枚引き、自分のPPを2回復する前に相手の場のフォロワーを選ぶ必要があります。
  - ref: cr 5.18.2.1
    quote: "‘（数値）までチョイスする’指示がある場\n合、1 以上（数値）までの値を選択し、その個\n数の選択肢を選択して実行します。"
    derivation:
      - 2 つまで下限一；同時選 3 與 1 時，打出時先支付翻面費用，效果仍依卡面先破壞再抽牌。
  - ref: cr 10.6.2.8.2.2
    quote: "チョイスする（5.18）処理により\n複数の選択肢を選んだ場合、各選択\n肢はテキストに表記の順で実行しま\nす。"
    derivation:
      - 2 つまで下限一；同時選 3 與 1 時，打出時先支付翻面費用，效果仍依卡面先破壞再抽牌。
  - ref: Q293
    quote: いいえ。必ず1つ以上チョイスする必要があります。
  - ref: Q294
    quote: いいえ。1つの選択肢を2回以上チョイスすることはできません。
  - ref: cr 5.18.2.1
    quote: ‘（数値）までチョイスする’指示がある場合、1 以上（数値）までの値を選択し、その個数の選択肢を選択して実行します。
  - ref: Q337
    quote: はい。EPは上限がないため、EPが3ある場合も新たにEPを得ます。
  - ref: cr 10.6.2.8.2.2
    quote: チョイスする（5.18）処理により複数の選択肢を選んだ場合、各選択肢はテキストに表記の順で実行します。
