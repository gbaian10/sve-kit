      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 5
          P2: 4
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ロイヤル
            life: 20
          pp:
            current: 1
            max: 5
          zones:
            field:
              - id: a1
                card: BP18-SP01
            hand:
              - id: a2
                card: BP01-180
            deck:
              - filler: 20
        P2:
          construction: class
          leader:
            class: ナイトメア
            life: 20
          pp:
            current: 0
            max: 5
          zones:
            field:
              - id: b1
                card: BP04-092
            hand:
              - filler: 3
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: activate
        ability:
          source: a1
          line: 2
        targets:
          1:
            - b1
      - n: 2
        by: P1
        at: main
        do: play
        card: a2
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b1:
            acted: true
          P1.pp.current: 1
        events:
          - kind: アクト
            object: b1
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.field: []
          P2.cemetery:
            - b1
          P2.leader.life: 20
          semantic_state.pending_triggers: []
        events:
          - kind: 破壊
            object: b1
            by: rule-11.3.1
        forbidden_events:
          - kind: 待機
          - kind: 体力増加
  - name: '[fable] B 箱詰め的從者在自己開始階段不站起；對手回合結束後能力回來（守護重新擋攻擊）'
    inherit: '[fable] A 箱詰め後被破壞 → ラストワード不誘發'
    setup:
      players:
        P1:
          zones:
            field:
              - id: a1
                card: BP18-SP01
              - id: a3
                card: SD02-002
            hand:
              - filler: 2
            deck:
              - id: a9
                card: BP01-173
              - filler: 20
        P2:
          zones:
            field:
              - id: b1
                card: BP04-092
            hand:
              - filler: 3
            deck:
              - id: b9
                card: BP01-173
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: activate
        ability:
          source: a1
          line: 2
        targets:
          1:
            - b1
      - n: 2
        by: P1
        at: main
        do: end-phase
      - n: 3
        by: P2
        at: quick
        do: pass
      - n: 4
        by: P2
        at: main
        do: end-phase
      - n: 5
        by: P1
        at: quick
        do: pass
      - n: 6
        by: P1
        at: main
        do: attack
        attacker: a3
        target: P2.leader
      - n: 7
        by: P1
        at: main
        do: attack
        attacker: a3
        target: b1
      - n: 8
        by: P2
        at: quick
        do: pass
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          turn:
            active: P2
            phase: main
          P2.field.b1:
            acted: true
          P2.hand:
            - b9
            - filler: 3
        forbidden_events:
          - kind: スタンド
            object: b1
      - at: after-decision-5
        view: omniscient
        outcome: resolved
        assert:
          turn:
            active: P1
            phase: main
          P2.field.b1:
            acted: true
          P1.hand:
            - a9
            - filler: 2
      - at: after-decision-6
        view: omniscient
        outcome: cannot-attack
        assert:
          P1.field.a3:
            acted: false
      - at: after-decision-8
        view: omniscient
        outcome: resolved
        assert:
          P2.field: []
          P1.field.a3:
            hp: 2
        events:
