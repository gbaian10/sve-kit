why: "[astra] 已橫置仍可封箱；封箱失去能力，之後離場不觸發謝幕曲。對照不封箱有一次待機。\n[fable] ナハト・ナハト「{起動}{コスト0}：相手の場のフォロワー1体を選ぶ。それをアクトする。次のそれのプレイヤーのターン終了時まで、それを【箱詰め】状態にする」： 箱詰め期間失去所有能力（5.31.2）→ 被破壞時ラストワード不誘發（Q1497）；開始階段不站起（5.31.3）；期限到了能力回來（Q1718）→ 守護重新生效。"
discriminates: "[astra] 把 act 沒發生當整段失敗或離場後重建印刷謝幕曲會多待機。\n[fable] 箱詰め後仍讓ラストワード待機的引擎 A 會多出待機／P2 體力 21；箱詰め的從者在 P2 開始階段站起的引擎 B 的 after-decision-3 會 acted false； 期限結束後不還原能力的引擎在 B 的 after-decision-6 會允許攻擊リーダー（守護沒回來）。"
refs:
  rules:
    - 1.3.2.1
    - 5.31.2
    - 10.7.4.1.2
    - 5.31.1
    - 5.31.3
    - 5.4.1
    - 12.5.1
    - 12.8.2
    - 7.2.3
    - 7.4.8
  qa:
    - Q1501
    - Q1497
    - Q1718
    - Q1717
evidence:
  - ref: Q1501
    quote: "はい。アクト状態の相手の場のフォロワーを選んだ場合でも、次のそれのプレイヤーのターン終了時まで、それを【箱詰め】状態にすることができます。\nアクト状態の相手の場のフォロワーを選んだ場合、「それをアクトする。」は既にアクト状態なため単に行われず、続く効果である「次のそれのプレイヤーのターン終了時まで、それを【箱詰め】状態にする。」が適用されます。"
  - ref: Q1497
    quote: いいえ。能力を失っているので《ラストワード》能力は誘発しません。
  - ref: cr 1.3.2.1
    quote: "すでにある状態にあるものを改めてその状\n態にするよう求められた場合、それは改めて\nその状態になるわけではなく、その行為自体\nが行われません。"
    derivation:
      - 已橫置仍可封箱；封箱失去能力，之後離場不觸發謝幕曲。對照不封箱有一次待機。
  - ref: cr 5.31.2
    quote: "【箱詰め】状態になったカードは、【箱詰め】状態で\nある間、そのカードが持つ能力、および【箱詰め】状\n態になった時点でそのカードが得ていたすべての能\n力を失います。"
    derivation:
      - 已橫置仍可封箱；封箱失去能力，之後離場不觸發謝幕曲。對照不封箱有一次待機。
  - ref: cr 10.7.4.1.2
    quote: "カードが場からそれ以外の領域に移\n動することによって誘発する自動能力が\nカードの情報を求める場合、そのカードが\n場にある時点での情報を用います。"
    derivation:
      - 已橫置仍可封箱；封箱失去能力，之後離場不觸發謝幕曲。對照不封箱有一次待機。
  - ref: cr 5.31.3
    quote: 【箱詰め】状態のカードは、そのプレイヤーのスタートフェイズ中、ルールによるスタンド（7.2.3）を実行しません。
  - ref: Q1717
    quote: 【箱詰め】状態の間は【守護】を失いますが、【箱詰め】状態が解除された場合、持っていた【守護】などの能力は元に戻り有効となります。
