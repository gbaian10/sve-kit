  - 抉擇＋條件改變選擇數
  - 前一步的結果
  - 效果中的「費用：效果」
cards:
  - BP01-173
  - BP07-SL05
  - BP17-SL28
why: 選項 3 不需要場上目標；不足兩張不能部分翻面；成功翻兩張才抽一及回 2 PP。
discriminates: 要求全部選項有目標或容許翻一張也得效果，PP／手牌不同。
refs:
  rules:
    - 5.18.4.1
    - 10.4.7.4
    - 10.4.2.2
  qa:
    - Q2294
    - Q2295
evidence:
  - ref: Q2294
    quote: はい。【3】をチョイスし、何も起こらないことを選択することができます。
  - ref: Q2295
    quote: いいえ。【3】をチョイスした場合、自分のエボルヴデッキの表向きの自然・エボルヴフォロワー1枚のみを裏向きにすることができません。
  - ref: cr 5.18.4.1
    quote: "存在しないものとして扱われた選択肢内で\nは、‘選ぶ’処理による目標を選択することは\nなく、そのカードや能力のプレイに際してその\n適正な目標が存在していなくてもプレイが可能\nです。"
    derivation:
      - 選項 3 不需要場上目標；不足兩張不能部分翻面；成功翻兩張才抽一及回 2 PP。
  - ref: cr 10.4.7.4
    quote: "上記以外でカードや能力に‘（処理）：（効\n果）’と書かれている場合、そのカードや能力\nの解決する際にその処理を実行することで、\nその効果を適用することを選択することができ\nます。"
    derivation:
      - 選項 3 不需要場上目標；不足兩張不能部分翻面；成功翻兩張才抽一及回 2 PP。
  - ref: cr 10.4.2.2
    quote: "コストのうち一部または全部を支払うことが\n不可能である場合、このコストはまったく支払\nうことはできません。"
    derivation:
      - 選項 3 不需要場上目標；不足兩張不能部分翻面；成功翻兩張才抽一及回 2 PP。
