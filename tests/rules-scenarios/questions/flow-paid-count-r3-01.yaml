id: flow-paid-count-r3-01
kind: flow
must_pass: true
mechanisms:
  - D 實際支付數量
  - C15 裝備者造成能力傷害
cards:
  - BP01-174
  - BP07-030
  - BP07-T03
  - CP04-PR16
why: 傷害只數本次付費橫置的一棵樹，不數原本已橫置的另一棵；劍把一傷變三傷；不能把已橫置樹列入費用後部分支付。
discriminates: 數當下全部橫置樹會多一傷；不對能力傷害套用劍會少二傷；部分付費會使反例錯誤橫置來源。
refs:
  rules:
    - 10.4.2.2
    - 10.4.5
  qa:
    - Q989
    - Q2494
evidence:
  - ref: Q989
    quote: "Q: 『ハルバードウルフ』の《起動》能力によって与えるダメージは、《起動》能力のコストとしてアクトした『ナテラの大樹』の枚数と同じダメージですか？\nA: はい。《起動》能力のコストとしてアクトした『ナテラの大樹』の枚数と同じダメージです。"
    derivation:
      - 傷害只數本次付費橫置的一棵樹，不數原本已橫置的另一棵；劍把一傷變三傷；不能把已橫置樹列入費用後部分支付。
  - ref: Q2494
    quote: "Q: 「これを装備しているフォロワーが与えるダメージを+2する。」とは、能力によるダメージも+2しますか？\nA: はい。能力によって与えるダメージも+2します。"
    derivation:
      - 傷害只數本次付費橫置的一棵樹，不數原本已橫置的另一棵；劍把一傷變三傷；不能把已橫置樹列入費用後部分支付。
  - ref: cr 10.4.2.2
    quote: コストのうち一部または全部を支払うことが 不可能である場合、このコストはまったく支払 うことはできません。
    derivation:
      - 傷害只數本次付費橫置的一棵樹，不數原本已橫置的另一棵；劍把一傷變三傷；不能把已橫置樹列入費用後部分支付。
  - ref: cr 10.4.5
    quote: コストのうち、カードのコスト以外のある数値を指 定の値増加または減少させるものは、その指定の 値以上あるその数値を指定の値増加または減少さ せることを意味します。
    derivation:
      - 傷害只數本次付費橫置的一棵樹，不數原本已橫置的另一棵；劍把一傷變三傷；不能把已橫置樹列入費用後部分支付。
