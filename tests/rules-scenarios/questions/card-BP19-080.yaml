schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP19-080
kind: card
must_pass: true
mechanisms: [讀取其他從者的上場來源, 5.5.3, 10.7.2.1, 10.7.4.2, 對手回合的誘發, entered_from, 12.4.3]
cards: [BP19-080, BP19-082, BP19-086, BP08-080, BP14-076, BP01-176, BP01-173]
why: >-
  滅屍の執行者・ミロエル「自分の場にフォロワーが出たとき、それが墓場から場に出ていたなら、相手の場のフォロワーすべてに1ダメージ」：
  誘發條件是「自分の場にフォロワーが出た」（任何來源），「墓場から」是結算時看該從者的上場來源（5.5.3）。
  A：ミロエル 的起動把 2 隻八獄從者同時從墓場放上場 → 場上 2 隻ミロエル 各誘發 2 次（每隻上場的從者各 1 次，10.7.2.1；Q2595）→ 合計 4 次、各 1 傷害。
  B：從手牌打出 → 誘發成立但「墓場から」不成立 → 不造成傷害。
  C（Q2596）：對手回合アリオーシュ 被交戰破壞 → ラストワード 把中尉從墓場放上場 → ミロエル 在對手回合誘發。
  D（Q2621）：ミロエル 自己被寒冷の死霊術師從墓場放上場 → 自己的能力也誘發（10.7.4.2），且攻擊力體力被設為 1。
discriminates: >-
  A：只在「打出」時誘發、或把同時上場的 2 隻合併成 1 次誘發的引擎，b1 體力會是 6 或 4 而不是 2；每隻ミロエル 只誘發 1 次的引擎會是 4。
  B：沒記錄 entered_from（或把「墓場から」當成永遠成立）的引擎會對 b1 造成 2 傷害。
  C：只在自己回合檢查誘發的引擎，after-decision-3 之後不會有 P1 的 choose-pending，b1 體力停在 3。
  D：把「自分の場にフォロワーが出たとき」排除自身的引擎不會誘發，b1 體力 6 而非 5；沒套用「攻撃力と体力を1にする」的引擎 m1 會是 5/5。
refs:
  rules: [5.5.3, 10.7.2, 10.7.2.1, 10.7.4.2, 10.5.2.3, 12.4.3, 12.5.3, 8.4.9, 8.4.10, 11.3.1, 4.1.5]
  qa: [Q2595, Q2596, Q2621]
evidence:
  - ref: Q2595
    quote: それぞれ「自分の場にフォロワーが出たとき、～」という能力が1回ずつ誘発し、合計で2回誘発します。
  - ref: Q2596
    quote: はい。相手のターン中であっても誘発します。
  - ref: Q2621
    quote: はい。誘発します。
  - ref: cr 10.7.2.1
    quote: 自動能力の誘発条件が複数回満たされた場合、その自動能力はその回数分待機状態になります。
    derivation: [起動一次放上 2 隻從者，每隻各滿足一次「フォロワーが出た」→ 每隻ミロエル 待機 2 次]
  - ref: cr 5.5.3
    quote: カードが‘（領域）から場に出る’ことを参照する場合、それはそのカードがその領域から直接場に出ること、およびそのカードがその領域からプレイされた後解決領域で解決されて場に出ることの両方を参照します。
    derivation: [從手牌打出的從者是「手札から場に出た」，不是「墓場から」→ B 不造成傷害]
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: A／B／C／D：xverify-2/result.md:261〈全部實質核驗局面的索引〉（5.5.3、10.7.2、Q2595、Q2596）；B 是日文原文獨立推導，Q2595／Q2596／Q2621 並非手牌反例的直接 Q&A；last.md 明載不把 Q302 泛化到其他卡。

scenarios:
  - name: A 起動把 2 隻八獄從者從墓場放上場 → 2 隻ミロエル 各誘發 2 次 → b1 受 4 傷害
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 9, P2: 8}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ナイトメア, life: 20}
          pp: {current: 9, max: 9}
          zones:
            field:
              - {id: a1, card: BP19-080}          # 滅屍の執行者・ミロエル 5/5
              - {id: a2, card: BP19-080}          # 滅屍の執行者・ミロエル 5/5
            cemetery:
              - {id: c1, card: BP19-082}          # 冥府の中尉（コスト2、八獄）
              - {id: c2, card: BP19-086}          # 猛襲の特攻隊長（コスト1、八獄）
            hand:
              - {id: h1, card: BP19-082}          # 冥府の中尉
            deck:
              - {id: d1, card: BP01-173}
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 8}
          zones:
            field:
              - {id: b1, card: BP01-176}          # 天剣の乙女 4/6
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: activate, ability: {source: a1, line: 3}, targets: {1: [c1, c2]}}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: c2, line: 2}}}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 1}, event: {entered_field: c1}}}
      - {n: 4, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 1}, event: {entered_field: c2}}}
      - {n: 5, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a2, line: 1}, event: {entered_field: c1}}}
      - {n: 6, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a2, line: 1}, event: {entered_field: c2}}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.field: [a1, a2, c1, c2]
          P1.field.a1: {acted: true}
          P1.field.c1: {entered_from: cemetery, entered_by: effect}
          P1.field.c2: {entered_from: cemetery, entered_by: effect}
          P1.cemetery: []
          P2.field.b1: {hp: 6}
        events:
          - {kind: アクト, object: a1}
          - {kind: 場に出す, object: c1, from: P1.cemetery, group: g1}
          - {kind: 場に出す, object: c2, from: P1.cemetery, group: g1}
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: c2, line: 2}}}
            - {do: choose-pending, pending: {ability: {source: a1, line: 1}, event: {entered_field: c1}}}
            - {do: choose-pending, pending: {ability: {source: a1, line: 1}, event: {entered_field: c2}}}
            - {do: choose-pending, pending: {ability: {source: a2, line: 1}, event: {entered_field: c1}}}
            - {do: choose-pending, pending: {ability: {source: a2, line: 1}, event: {entered_field: c2}}}
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.leader.life: 19
          P1.field.c2: {evolved: false}
        forbidden_events:
          - {kind: 進化}
      - at: after-decision-6
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b1: {hp: 2}
          P1.field: [a1, a2, c1, c2]
          semantic_state.pending_triggers: []
        events:
          - {kind: ダメージ, source: a1, target: b1, amount: 1}
          - {kind: ダメージ, source: a1, target: b1, amount: 1}
          - {kind: ダメージ, source: a2, target: b1, amount: 1}
          - {kind: ダメージ, source: a2, target: b1, amount: 1}

  - name: B 從手牌打出中尉 → 2 隻ミロエル 都誘發，但「墓場から」不成立 → 沒有傷害
    inherit: A 起動把 2 隻八獄從者從墓場放上場 → 2 隻ミロエル 各誘發 2 次 → b1 受 4 傷害
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: h1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 1}}}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a2, line: 1}}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 7
          P1.field: [a1, a2, h1]
          P1.field.h1: {entered_from: hand, entered_by: play}
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, line: 1}}}
            - {do: choose-pending, pending: {ability: {source: a2, line: 1}}}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b1: {hp: 6}
          semantic_state.pending_triggers: []
        events:
          - {kind: プレイ, ability: {source: a1, line: 1}}
          - {kind: プレイ, ability: {source: a2, line: 1}}
        forbidden_events:
          - {kind: ダメージ}

  - name: C 對手回合：アリオーシュ 被交戰破壞 → ラストワード 把中尉從墓場放上場 → ミロエル 在對手回合誘發
    inherit: A 起動把 2 隻八獄從者從墓場放上場 → 2 隻ミロエル 各誘發 2 次 → b1 受 4 傷害
    setup:
      turn: {active: P2, first_player: P1, elapsed_turns: {P1: 9, P2: 9}, phase: main}
      players:
        P1:
          pp: {current: 0, max: 9}
          zones:
            field:
              - {id: a1, card: BP19-080}          # 滅屍の執行者・ミロエル
              - {id: a3, card: BP08-080, state: {acted: true}}   # アリオーシュ 3/3（アクト狀態才能被攻擊）
            cemetery:
              - {id: c1, card: BP19-082}
              - {id: c2, card: BP19-086}
            hand:
              - {id: h1, card: BP19-082}
            deck:
              - {id: d1, card: BP01-173}
              - {filler: 20}
        P2:
          pp: {current: 9, max: 9}
    decisions:
      - {n: 1, by: P2, at: main, do: attack, attacker: b1, target: a3}
      - {n: 2, by: P1, at: quick, do: pass}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a3, line: 2}}, targets: {1: [c1]}}
      - {n: 4, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 1}}}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          turn: {active: P2, phase: main}
          P1.field: [a1]
          P1.cemetery: [c1, c2, a3]
          P2.field.b1: {hp: 3, acted: true}
        events:
          - {kind: ダメージ, source: b1, target: a3, amount: 4, group: g1}
          - {kind: ダメージ, source: a3, target: b1, amount: 3, group: g1}
          - {kind: 破壊, object: a3}
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a3, line: 2}}, targets: {1: [c1]}}
            - {do: choose-pending, pending: {ability: {source: a3, line: 2}}, targets: {1: [c2]}}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.field: [a1, c1]
          P1.field.c1: {entered_from: cemetery, entered_by: effect}
        events:
          - {kind: 場に出す, object: c1, from: P1.cemetery}
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, line: 1}}}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          turn: {active: P2, phase: main}
          P2.field.b1: {hp: 2}
        events:
          - {kind: ダメージ, source: a1, target: b1, amount: 1}

  - name: D ミロエル 自己被寒冷の死霊術師從墓場放上場（1/1）→ 自己的能力也誘發
    inherit: A 起動把 2 隻八獄從者從墓場放上場 → 2 隻ミロエル 各誘發 2 次 → b1 受 4 傷害
    setup:
      players:
        P1:
          zones:
            field:
              - {id: a4, card: BP14-076}          # 寒冷の死霊術師 5/5
            cemetery:
              - {id: m1, card: BP19-080}          # 滅屍の執行者・ミロエル（コスト7 ≤ 8）
            hand:
              - {id: h1, card: BP19-082}
            deck:
              - {id: d1, card: BP01-173}
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: activate, ability: {source: a4, line: 2}, targets: {1: [m1]}}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: m1, line: 1}}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.field: [a4, m1]
          P1.field.a4: {acted: true}
          P1.field.m1: {power: 1, hp: 1, entered_from: cemetery, entered_by: effect}
          P1.cemetery: []
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: m1, line: 1}}}
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b1: {hp: 5}
        events:
          - {kind: ダメージ, source: m1, target: b1, amount: 1}
