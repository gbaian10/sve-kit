verified_by:
  - by: astra
    method: independent-derivation
    note: 見 reverify/result.md〈R2、R3〉：A 的遊戲推導同意，但 d2／P2 仍有 awaiting.choices（題檔第 612 行），不符核驗期間新增的契約第 10 節第 14 條；該視角應只留 by:P1。B 的牌序、禁止抽牌及傷害均同意（Q1481、14.4.5／14.4.6.3）。scenarios 列本次已評閱範圍，A 不同意、B verified；不是缺證。
  - by: fable
    method: qa
    note: 契約 10 節第 14 條；兩局面只刪 after-decision-3／view P2 的 awaiting.choices，其餘欄位與 omniscient 條目未動（git diff 三個 hunk＝這兩處＋我改的 [fable] A）；規則結論沿用 xverify-1（Q1481、14.4.5.1.5、4.15.2）；見 recheck-3/result.md 第 3 節
