id: rule-14.4.5-01
kind: rule
must_pass: true
mechanisms:
  - 14.4.5
  - 14.4.6.3
  - Vanguard：憑依、驅動
  - 揭露 → 決定 → 繼續同一效果
  - 10.7.2
cards:
  - CP03-001
  - CP03-016
  - CP03-018
  - CP03-021
  - CP03-010
why: "[astra] 第一次翻開ドロートリガー後才選擇是否執行；執行會抽走原本第二張，第二次檢查因此翻到不同卡。兩個局面只改第一次決定。CP03-016 的 draw 與 CP03-018 的 heal 已由 Opus 依官方卡圖右上角圖示確認，card_facts 已標記 verified: true。filler 僅是永遠不會被翻到的牌庫尾部。\n[fable] 驅動檢查（14.4.5）是卡表裡唯一「揭露 → 玩家決定 → 繼續同一效果」的流程（5.10.3／5.11.2 沒有實卡）。 【ツインドライブ】＝「ドライブチェックを1回行い、その後ドライブチェックを1回行う」（14.4.6.3）：第 1 次揭露有圖示的卡時， 玩家「任意で」決定是否執行（14.4.5.1.3），執行會抽牌、改變牌庫，第 2 次檢查才開始（Q1481）。 非作品名基準牌組不看圖示、沒有決定、直接放底（14.4.5.1.2）。cards.jsonl 沒有觸發圖示欄位，用 card_facts 由注釈文推認。"
discriminates: "[astra] 若先翻完兩張再處理觸發，執行第一次 draw 後的第二張 trigger 不會是 d3；兩分支的手牌與墓場不同。\n[fable] 局面 A：把兩次檢查先各翻一張再處理觸發的實作，會讓第 2 次翻到 a4 而不是 a5，最終手牌與牌庫底順序不同； 不在第 1 次揭露後停下來問的實作，after-decision-2 不會是 paused。 局面 B：不執行時放底的順序（a3 先、a4 後）可從牌庫最後兩張看出。 局面 C：職業基準牌組若仍停下來問玩家，after-decision-2 的 awaiting 會多出 resolve-choice，而不是直接推進到【攻撃時】的 choose-pending。"
