evidence:
  - ref: Q1481
    quote: "トリガーの処理を先に行います。\n1回目のドライブチェックでトリガーを持つカードをトリガー領域に置いた場合、そのトリガーの処理を含むドライブチェックの処理がすべて終了した後に2回目のドライブチェックを行います。\n\n例えば、【ツインドライブ】による1回目のドライブチェックでドロートリガーをトリガー領域に置き、そのトリガーの処理を実行した場合、1枚引き、トリガー領域のカードを墓場に置いた後に2回目のドライブチェックを行います。\nトリガーの処理を実行しなかった場合やトリガーを持たないカードをトリガー領域に置いた場合は、そのカードをデッキの下に置いた後に2回目のドライブチェックを行います。"
  - ref: Q1377
    quote: はい。任意の順番で解決できます。
  - ref: Q1378
    quote: 【ツインドライブ】や【攻撃時】能力が誘発し解決するタイミングが先です。【攻撃時】能力などフォロワーが攻撃したときに誘発する能力をすべて解決した後、非ターンプレイヤーのクイックタイミングが訪れます。
  - ref: cr 14.4.5.1.3
    quote: そのカードがトリガーを持つ場合、そのプレイヤーはそのカードのトリガーアイコンに応じて以下の処理を任意で実行することができます。
    derivation:
      - 先依 .1.1 將頂牌移至公開的觸發區（4.15.2），再依圖示決定執行與否。
      - 執行抽牌則抽走 d2，第一次檢查把 d1 送墓後才翻 d3；不執行則 d1 放底，再翻 d2。
  - ref: cards CP03-016 / CP03-018 faces[0].sections
    quote: （ドライブチェックによってこれが捲れたなら、1枚引く） / （ドライブチェックによってこれが捲れたなら、自分のリーダーは{体力}+3する）
    derivation:
      - 注釋與 14.4.5 的 draw／heal 效果一致；2.6.2 明定注釋本身不產生效果。圖示真值另由 Opus 依官方卡圖確認，見 card-facts-verified.md，不再只依注釋推認。
  - ref: Q1481
    quote: トリガーの処理を先に行います。1回目のドライブチェックでトリガーを持つカードをトリガー領域に置いた場合、 そのトリガーの処理を含むドライブチェックの処理がすべて終了した後に2回目のドライブチェックを行います。 トリガーの処理を実行しなかった場合やトリガーを持たないカードをトリガー領域に置いた場合は、そのカードをデッキの下に置いた後に2回目のドライブチェックを行います。
  - ref: cr 14.4.5.1.3
    quote: そのカードがトリガーを持つ場合、そのプレイヤーはそのカードのトリガーアイコンに応じて以下の処理を任意で実行することができます。
    derivation:
      - 「任意で」＝揭露後才由該玩家決定，是結算中途的決定（at: resolve），不是打出時的選擇
      - 14.4.5.1.5：執行了 → 該卡進墓場；沒有圖示或選擇不執行 → 放牌庫底
      - 14.4.6.3：第 2 次檢查在第 1 次的整個處理（含抽牌）結束後才開始
  - ref: cr 14.4.5.1.2
    quote: そのプレイヤーのデッキがタイトル基準でない場合、そのプレイヤーはこれによりトリガー領域に移動したカードを自身のデッキの一番下に置き、ドライブチェックを行う処理を終了します。
    derivation:
      - 職業基準牌組：不看圖示、沒有任何玩家決定
  - ref: Q1377
    quote: はい。任意の順番で解決できます。
    derivation:
      - 【攻撃時】（4回目なら進化）與【ツインドライブ】同時待機（10.7.2），P1 自選順序；本題固定先處理ツインドライブ
  - ref: Q1378
    quote: 【攻撃時】能力などフォロワーが攻撃したときに誘発する能力をすべて解決した後、非ターンプレイヤーのクイックタイミングが訪れます。
  - ref: cr 2.6.2
    quote: 注釈文はテキストの一部ですが、あくまで能力の解説を目的とした意味を持つだけで、ゲームには影響しません。
    derivation:
      - 圖示是 14.4.1 的卡圖資訊，注釈文只能推認；2026-09-25 已用官方卡圖確認 CP03-016＝draw、CP03-010＝none（card-facts-verified.md）→ card_facts 改 verified: true
