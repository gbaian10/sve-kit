schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP03-SL07
kind: card
must_pass: true
mechanisms: [堆疊、土之秘術, 13.3.2.4, 13.3.3.2, 9.1.4.4, 10.10.2.4, Quick 起動能力, 持續效果與禁止]
cards: [BP03-SL07, EBD02-T01, BP16-049, BP01-180, BP01-173]
why: >-
  オズの大魔女{ファンファーレ}「『大地の魔片』1つを出す。自分の場の【スタック】を+1する。1枚引く」：出的魔片以【スタック】帶 1 個計數器進場；
  「【スタック】を+1する」＝場上有【スタック】卡時放 1 個計數器（13.3.2.4、Q2773）。{Q}{起動}【土の秘術】：追加費用取 1 個スタックカウンター（13.3.3.2），
  效果「このターン、次に自分がスペルをプレイする際、コストを-4する」只套下一張（Q469）；計數器被取到 0 時由土の秘術的文字本身把魔片放墓場（不等規則處理）→ token 消去。
discriminates: >-
  A：把「+1」做成再出一個魔片、或沒把 a2 加到 2 的引擎；B：把 −4 套到第二張法術（PP 少扣）的引擎，以及沒在檢查時點把體力 0 的 b1 破壞的引擎（互驗修正）；
  C：計數器 0 時等檢查時點才送墓（事件順序：移動在プレイ能力之後）的引擎。
refs:
  rules: [13.3.2.2, 13.3.2.4, 13.3.3.2, 9.1.4.4, 12.3.5, 10.10.2.4, 10.4.4.1, 10.6.2.5]
  qa: [Q2773, Q469, Q470]
evidence:
  - ref: Q2773
    quote: 自分の場にある【スタック】を持つアミュレット1枚の上にスタックカウンターを1つ置くことを指します。自分の場に【スタック】を持つカードが無い場合、スタックカウンターが1個置かれた『大地の魔片』1つを場に出します。
  - ref: Q469
    quote: いいえ。『マーリン（EVOLVE）』の【進化時】能力でスペルをプレイした時点でこのフォロワーの起動能力の効果は適用されるため、その後にプレイするスペルはコスト-4されません。
  - ref: cr 13.3.3.2
    quote: >-
      ‘【土の秘術 （数値）】（テキスト）’は‘このカードまたは能力をプレイする際に、追加コストとして、【スタック】を持つあなたのいずれかのアミュレットに置かれているスタックカウンターを（数値）個取り除いてよい。
      これによりそのアミュレットにスタックカウンターが置かれていない状態になった場合、そのアミュレットを墓場に置く。追加コストとしてスタックカウンターを取り除いていたら、（テキスト）’を意味します。
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: A：xverify-2/recheck.md:80〈全部改動局面的核對索引〉（6.4）；B：xverify-2/result.md:213〈全部實質核驗局面的索引〉（13.3.2.2、13.3.2.4、Q2773、Q469）；C：xverify-1/result.md:90〈其他驗過的題目〉（13.3.3.2、Q292：土の秘術歸零立即送墓）

scenarios:
  - name: A ファンファーレ：出一個魔片，既有的魔片 +1 計數器，抽 1
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 6, P2: 5}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ウィッチ, life: 20}
          pp: {current: 6, max: 6}
          zones:
            field:
              - {id: a2, card: EBD02-T01, state: {counters: {スタックカウンター: 1}}}   # 大地の魔片
            hand:
              - {id: a1, card: BP03-SL07}         # オズの大魔女 4/6
            deck:
              - {id: d1, card: BP01-173}
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 6}
          zones:
            field:
              - {id: b1, card: BP01-173}
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 1}}}
      # 「+1」放在哪一個【スタック】卡上是玩家選擇（場上有既有的 a2 與新出的 new-1）：選既有的 a2
      - {n: 3, by: P1, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, select: [a2]}
    random: {}
    expected:
      # 互驗第二輪修正（astra）：切開區間，讓 after-decision-2 的 events_exact 只涵蓋ファンファーレ 的結算（a1 自己的 場に出す 在這裡）
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, line: 1}}}
        assert:
          P1.field: [a2, a1]
          P1.pp.current: 0
        events:
          - {kind: 場に出す, object: a1}
        events_exact: [場に出す]
      - at: after-decision-2
        view: omniscient
        outcome: paused
        awaiting:
          by: P1
          choices:
            - {do: resolve-choice, select: [a2]}
            - {do: resolve-choice, select: [new-1]}
        assert:
          P1.field: [a2, a1, new-1]
          P1.field.new-1: {name: 大地の魔片, counters: {スタックカウンター: 1}}
        events:
          - {kind: 場に出す, object: new-1, to: P1.field}
        events_exact: [場に出す]
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a2: {counters: {スタックカウンター: 2}}
          P1.field.new-1: {counters: {スタックカウンター: 1}}
          P1.field_count: 3
          P1.hand: [d1]
          P1.pp.current: 0
        events:
          - {kind: カウンター, object: a2, name: スタックカウンター, delta: 1}
          - {kind: 引く, player: P1, object: d1}
        forbidden_events:
          - {kind: 場に出す}

  - name: B 土の秘術起動：取 1 個計數器 → 下一張法術 −4，再下一張不減
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 6, P2: 5}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ウィッチ, life: 20}
          pp: {current: 1, max: 6}
          zones:
            field:
              - {id: a1, card: BP03-SL07}
              - {id: a2, card: EBD02-T01, state: {counters: {スタックカウンター: 2}}}
            hand:
              - {id: a3, card: BP16-049}          # スノーアウェイク（コスト2）
              - {id: a4, card: BP01-180}          # エンジェルバレッジ（コスト1）
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 6}
          zones:
            field:
              - {id: b1, card: BP01-173}
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: activate, ability: {source: a1, line: 2}, optional_costs: {additional: {stack_counter_from: a2}}}
      - {n: 2, by: P1, at: main, do: play, card: a3, targets: {1: [b1]}}
      - {n: 3, by: P1, at: main, do: play, card: a4}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a2: {counters: {スタックカウンター: 1}}
          P1.pp.current: 1
        events:
          - {kind: カウンター, object: a2, name: スタックカウンター, delta: -1}
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 1
          P2.field.b1: {power: 1, hp: 1}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P2.field: []
          P2.cemetery: [b1]
          P1.field.a1: {hp: 6}          # エンジェルバレッジ只打相手のフォロワー
        events:
          - {kind: ダメージ, source: a4, target: b1, amount: 1}
          - {kind: 破壊, object: b1, by: rule-11.3.1}

  - name: C 計數器只剩 1 → 取完變 0 → 依土の秘術文字放墓場 → token 消去；效果仍成立
    inherit: B 土の秘術起動：取 1 個計數器 → 下一張法術 −4，再下一張不減
    setup:
      players:
        P1:
          zones:
            field:
              - {id: a1, card: BP03-SL07}
              - {id: a2, card: EBD02-T01, state: {counters: {スタックカウンター: 1}}}
    decisions:
      - {n: 1, by: P1, at: main, do: activate, ability: {source: a1, line: 2}, optional_costs: {additional: {stack_counter_from: a2}}}
      - {n: 2, by: P1, at: main, do: play, card: a3, targets: {1: [b1]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.field: [a1]
        events:
          - {kind: カウンター, object: a2, name: スタックカウンター, delta: -1}
          - {kind: 移動, object: a2, from: P1.field, to: P1.cemetery}
          - {kind: 消去, object: a2}
          - {kind: プレイ, ability: {source: a1, line: 2}}
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 1
          P2.field.b1: {power: 1, hp: 1}
