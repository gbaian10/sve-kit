schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: rule-12.2.4-01
kind: rule
must_pass: true
mechanisms:
  - 進化卡自身的能力
  - 10.7 其他
  - 賽馬娘：食事、出走
cards:
  - BP19-SL10
  - BP19-SL11
  - ECP01-010
why: 超進化同時產生進化時與超進化時待機；ジェンティルドンナ只禁止前者，不禁止 +1/1 或超進化時。
discriminates: 把兩種觸發互斥或全部抑制，待機集合不同。
refs:
  rules:
    - 12.2.4.1
    - 12.2.4.2
    - 12.17.2
  qa:
    - Q2553
    - Q2554
    - Q2076
    - Q2077
evidence:
  - ref: Q2553
    quote: 任意の順番で解決することができます。
  - ref: Q2554
    quote: はい。【超進化時】能力だけではなく、【進化時】能力も誘発します。また誘発した2つの能力は任意の順番で解決することができます。
  - ref: Q2076
    quote: はい。【超進化時】能力は誘発します。また【進化時】能力は誘発しません。
  - ref: Q2077
    quote: はい。攻撃力と体力を+1/+1します。
  - ref: cr 12.2.4.1
    quote: "進化後のカードを進化領域において関連\n付けた後（5.16.1.2 を適用した後）、このフォロ\nワーの攻撃力と体力をそれぞれ＋1 します。"
    derivation:
      - 超進化同時產生進化時與超進化時待機；ジェンティルドンナ只禁止前者，不禁止 +1/1 或超進化時。
  - ref: cr 12.2.4.2
    quote: "5.16.1.3 において‘進化した’事象が発生す\nるのに加えて‘超進化した’事象が発生しま\nす。"
    derivation:
      - 超進化同時產生進化時與超進化時待機；ジェンティルドンナ只禁止前者，不禁止 +1/1 或超進化時。
  - ref: cr 12.17.2
    quote: "‘【超進化時】（テキスト）’は、‘このカードが超進\n化したとき、（テキスト）’を意味します。"
    derivation:
      - 超進化同時產生進化時與超進化時待機；ジェンティルドンナ只禁止前者，不禁止 +1/1 或超進化時。
