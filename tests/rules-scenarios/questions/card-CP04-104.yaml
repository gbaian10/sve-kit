why: X=0 的費用成立且算 UB；拒付則取消待機但不回溯進化；X=1 橫置護符並造成 2 傷害。
discriminates: 把零單位等同拒付會得到錯的 UB 次數；把取消回溯進化也不同。
refs:
  rules:
    - 10.6.2.5.3
    - 10.7.3.2
    - 14.5.1.3
  qa:
    - Q2520
    - Q2471
evidence:
  - ref: Q2520
    quote: はい。《UB》能力が発動したことを満たします。
  - ref: Q2471
    quote: いいえ。《UB》能力が発動したことを満たしません。
  - ref: cr 10.6.2.5.3
    quote: "コストとして実行する内容のうち、その\n内容を 0 単位実行するものは、何も実行せ\nずにその内容を実行したものとみなされま\nす（1.3.2.2）。"
    derivation:
      - X=0 的費用成立且算 UB；拒付則取消待機但不回溯進化；X=1 橫置護符並造成 2 傷害。
  - ref: cr 10.7.3.2
    quote: "なんらかの理由で、選んだ待機状態の自\n動能力がプレイできない場合、その待機状態\nは 1 回取り消されます。"
    derivation:
      - X=0 的費用成立且算 UB；拒付則取消待機但不回溯進化；X=1 橫置護符並造成 2 傷害。
  - ref: cr 14.5.1.3
    quote: "ユニオンバースト能力が‘発動した’ことを\n参照する場合、それはその能力が適正にプレ\nイされて（10.6.2.7）解決された（10.6.2.8）ことを\n参照します。"
    derivation:
      - X=0 的費用成立且算 UB；拒付則取消待機但不回溯進化；X=1 橫置護符並造成 2 傷害。
