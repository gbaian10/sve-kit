schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP02-062
kind: card
must_pass: true
mechanisms: [本回合事件歷史, 本回合棄過牌, 7.4.1, 7.4.7, 10.1.1.2.2, 費用中的捨棄也算捨棄, 回合特定時點, 長寫條件一律誘發結算時才查（R-0009）]
cards: [BP02-062, BP02-063, BP01-173, BP01-176]
why: >-
  竜巫女の儀式「自分のエンドフェイズが来たとき、このターン中に自分の手札を捨てていたなら、…選ぶ。それに2ダメージ」與荒牙の竜少女「プレイする際、このターン中に自分の手札を捨てていたなら、コストを-2する」都讀本回合「捨過牌」的歷史。
  A：第二張儀式的ファンファーレ 費用「手札1枚を捨てる：」（10.1.1.2.2）算捨棄 → 竜少女 −2 費、結束階段兩張儀式各 2 傷害。
  B：沒捨過 → 竜少女 3 費；結束階段儀式照常誘發（打出時選目標），結算時「なら」不成立 → 不造成傷害。
  C（Q302）：結束階段手牌超過上限的捨牌（7.4.7）在儀式結算之後才發生 → 結算時沒捨過牌 → 不造成傷害。
  依裁定 R-0009（使用者 2026-09-27）：長寫「〜とき、…なら」事件發生即誘發，條件只在結算時查；Q940「2回誘発します」、Q852、Q2418 是直接證據。
  Q302 日文「プレイしません」與英文「does not trigger」說法不同，兩種讀法在本題的結果相同（不造成傷害）。
  歷史：2026-09-25 曾依英文 Q302 定為「不誘發」並斷言沒有待機；2026-09-27 改題（做法 A），紀錄見 sve-kit-m0 docs/m0/exam-changes.md。
discriminates: >-
  沒記錄「本回合捨過牌」的引擎：A 的竜少女 會扣 3 PP、儀式不造成傷害。把費用的捨棄排除在歷史外的引擎同上。
  忽略「なら」照做的引擎：B、C 會造成 2 傷害（b1 體力 4）。
  把 7.4.7 的捨牌算進去（或把儀式的結算延到捨牌之後）的引擎：C 會造成 2 傷害。
  在誘發時判定條件、不形成待機的引擎：B 的第 3 個決定、C 的第 2 個決定（打出儀式的待機）不合法。
refs:
  rules: [7.4.1, 7.4.2, 7.4.5, 7.4.7, 10.1.1.2.1, 10.1.1.2.2, 5.12.1, 10.4.4.1, 10.6.2.5.1.3, 10.7.1, 10.7.2]
  qa: [Q302, Q940, Q852, Q2418]
evidence:
  - ref: Q302
    quote: いいえ。手札の上限枚数となるようにカードを捨てる行為は、「自分のエンドフェイズが来たとき～」の誘発のタイミングよりも後に行うため、条件を満たすことはできず、プレイしません。
  - ref: Q302 (EN, BP02-062EN)
    quote: No. The discarding of cards over your hand's limit happens after 'the start of your end phase,' so the ability does not trigger.
    url: https://en.shadowverse-evolve.com/cards/?cardno=BP02-062EN
    derivation:
      - 日文「プレイしません」與英文「does not trigger」說法不同；兩種讀法下本題都不造成傷害
  - ref: Q940
    quote: 『簒奪の蛇剣』によって3ダメージと2ダメージを受けており『辻野あかり』の能力は2回誘発しますが、どちらも5以上のダメージを受けていないので、「そのダメージが5以上なら、」以降の効果を適用することができません。
    derivation: [「〜とき、…なら」的條件不成立仍誘發，只是不做效果 → 裁定 R-0009]
  - ref: cr 5.12.1
    quote: カードを‘捨てる’指示がある場合、指定のプレイヤーは指定された枚数の手札を選び、それらを墓場に置きます。
    derivation: [ファンファーレ 費用「手札1枚を捨てる」也是「捨てる」指示 → 本回合捨過牌成立]
# B、C 在 2026-09-27 改題；astra 的覆核是改題前的（B／C 部分已不適用），opus 的覆核涵蓋改題後的 B、C。
status: verified
author: fable
verified_by:
  - by: astra
    method: qa
    note: A：xverify-2/recheck.md:106〈全部改動局面的核對索引〉確認真實牌庫頂，再由 last.md:20 確認僅替換 P2 手牌；B／C：xverify-2/last.md:15、16〈同意 B、C 改為不誘發〉，依已提供並定案的官方英文 Q&A 與 7.4.1／7.4.5／7.4.7，不再沿用 split.md 的待定模型。（B／C 已於 2026-09-27 改題，此覆核不再涵蓋 B／C）
  - by: opus
    method: qa
    note: 2026-09-27 覆核 440df8a 版本的 B、C（依裁定 R-0009）：局面名稱、決定序列、斷言與其他欄位一致；另以變異確認抓得到「忽略なら」「7.4.7 捨牌算進去」「誘發時判定」的錯誤實作

scenarios:
  - name: A 用第二張儀式的費用捨 1 張 → 竜少女 −2 費 → 結束階段兩張儀式各造成 2 傷害
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 6, P2: 5}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 6, max: 6}
          zones:
            field:
              - {id: m1, card: BP02-062}          # 竜巫女の儀式（場上）
            hand:
              - {id: m2, card: BP02-062}          # 竜巫女の儀式（コスト3）
              - {id: h1, card: BP02-063}          # 荒牙の竜少女（コスト3、捨てていたなら −2）
              - {id: h2, card: BP01-173}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 5}
          zones:
            field:
              - {id: b1, card: BP01-176}          # 天剣の乙女 4/6
            hand:
              # B、C 要完整列出 P2 在クイック時點的合法選項（只有 pass）→ 用真實的非クイック卡，不能用 filler（契約 2.3）
              - {id: q1, card: BP01-173}
              - {id: q2, card: BP01-173}
              - {id: q3, card: BP01-173}
            deck:
              - {id: p1, card: BP01-173}          # P2 下回合開始階段抽到（契約 10.10：跨回合的牌庫頂要是真實卡）
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: m2}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: m2, line: 2}}, costs: {1: [h2]}}
      - {n: 3, by: P1, at: main, do: play, card: h1}
      - {n: 4, by: P1, at: main, do: end-phase}
      - {n: 5, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: m1, line: 1}}, targets: {1: [b1]}}
      - {n: 6, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: m2, line: 1}}, targets: {1: [P2.leader]}}
      - {n: 7, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 3
          P1.leader.life: 21
          P1.hand: [h1]
          P1.cemetery: [h2]
          semantic_state.counters_this_turn: {P1.discarded: 1}
        events:
          - {kind: 捨てる, player: P1, object: h2}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 2
          P1.field: [m1, m2, h1]
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: m1, line: 1}}, targets: {1: [P2.leader]}}
            - {do: choose-pending, pending: {ability: {source: m1, line: 1}}, targets: {1: [b1]}}
            - {do: choose-pending, pending: {ability: {source: m2, line: 1}}, targets: {1: [P2.leader]}}
            - {do: choose-pending, pending: {ability: {source: m2, line: 1}}, targets: {1: [b1]}}
      - at: after-decision-7
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b1: {hp: 4}
          P2.leader.life: 18
          turn: {active: P2, phase: main}
        events:
          - {kind: ダメージ, source: m1, target: b1, amount: 2}
          - {kind: ダメージ, source: m2, target: P2.leader, amount: 2}


  - name: B 本回合沒捨過牌 → 竜少女 3 費 → 結束階段儀式誘發、結算時條件不成立、不造成傷害
    inherit: A 用第二張儀式的費用捨 1 張 → 竜少女 −2 費 → 結束階段兩張儀式各造成 2 傷害
    # 2026-09-27 改題（使用者決定，做法 A）：不再斷言「不誘發／沒有待機」，改驗結果（沒有傷害）。
    # Q302 日文「プレイしません」與英文「does not trigger」說法不同；Q940「2回誘発します」、Q852、Q2418
    # 是「〜とき、…なら」一律誘發的直接證據（裁定 R-0009）。
    # 決定序列依 R-0009：結束階段照常誘發、打出時選目標（第 3 個決定），結算時條件不成立而不做。
    # 因此本局面實際上要求有誘發；依「誘發時判定」實作的引擎會在第 3 個決定被拒絕。
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: h1}
      - {n: 2, by: P1, at: main, do: end-phase}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: m1, line: 1}}, targets: {1: [b1]}}
      - {n: 4, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 3
          P1.field: [m1, h1]
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b1: {hp: 6}
          P2.leader.life: 20
        forbidden_events:
          - {kind: ダメージ}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b1: {hp: 6}
          P2.leader.life: 20
          turn: {active: P2, phase: main}
          P2.hand: [q1, q2, q3, p1]
        forbidden_events:
          - {kind: ダメージ}

  - name: C 結束階段手牌上限的捨牌在儀式結算之後 → 結算時不算「捨てていた」→ 不造成傷害
    inherit: A 用第二張儀式的費用捨 1 張 → 竜少女 −2 費 → 結束階段兩張儀式各造成 2 傷害
    setup:
      players:
        P1:
          zones:
            hand:
              - {id: h1, card: BP01-173}
              - {id: h2, card: BP01-173}
              - {id: h3, card: BP01-173}
              - {id: h4, card: BP01-173}
              - {id: h5, card: BP01-173}
              - {id: h6, card: BP01-173}
              - {id: h7, card: BP01-173}
              - {id: h8, card: BP01-173}
    # 2026-09-27 改題（使用者決定，做法 A）：理由同局面 B；Q302 本身就是本局面（7.4.7 的捨牌在儀式結算之後）。
    # 第 2 個決定打出儀式的待機，即要求有誘發。
    decisions:
      - {n: 1, by: P1, at: main, do: end-phase}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: m1, line: 1}}, targets: {1: [b1]}}
      - {n: 3, by: P2, at: quick, do: pass}
      - {n: 4, by: P1, at: end, do: end-discard, select: [h8]}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.hand_count: 8
          P1.cemetery: []
          P2.field.b1: {hp: 6}
          P2.leader.life: 20
        forbidden_events:
          - {kind: ダメージ}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P1.hand_count: 7
          P1.cemetery: [h8]
          P2.field.b1: {hp: 6}
          P2.leader.life: 20
          turn: {active: P2, phase: main}
        events:
          - {kind: 捨てる, player: P1, object: h8}
        forbidden_events:
          - {kind: ダメージ}
