schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: flow-stand-trigger-r3-01
kind: flow
must_pass: true
mechanisms:
  - A トリガー
  - 攻擊中站起
cards:
  - BP01-173
  - CP03-017
  - CSD03a-003
why: スタンドトリガー可站起正在攻擊的自身；本次攻擊已宣告，照常造成傷害，但本回合新的主戰者攻擊不合法；仍可再攻擊從者。
discriminates: 錯誤取消目前攻擊會少傷害；只站起而漏禁止會接受第二次主戰者攻擊；全禁攻則從者攻擊失敗。
refs:
  rules:
    - 14.4.5.1.3.3
    - 8.4.2
    - 8.4.9
  qa: []
evidence:
  - ref: cr 14.4.5.1.3.3
    quote: そのアイコンがスタンドトリガー （ ）の場合、自分の場のフォロワーを 1 体指定し、それをスタンドします。この ターン中、そのフォロワーは相手のリー ダーを攻撃できません。
    derivation:
      - スタンドトリガー可站起正在攻擊的自身；本次攻擊已宣告，照常造成傷害，但本回合新的主戰者攻擊不合法；仍可再攻擊從者。
  - ref: cr 8.4.2
    quote: 攻撃フォロワーとして、自分がマスターであるスタン ド状態のフォロワーを 1 体選択します。
    derivation:
      - スタンドトリガー可站起正在攻擊的自身；本次攻擊已宣告，照常造成傷害，但本回合新的主戰者攻擊不合法；仍可再攻擊從者。
  - ref: cr 8.4.9
    quote: この時点で攻撃フォロワーが場に存在する場合、 攻撃フォロワーはその攻撃力に等しいダメージを攻 撃目標に与えます。
    derivation:
      - スタンドトリガー可站起正在攻擊的自身；本次攻擊已宣告，照常造成傷害，但本回合新的主戰者攻擊不合法；仍可再攻擊從者。
status: verified
author: astra
verified_by:
  - by: fable
    method: independent-derivation
    note: 第三輪交叉驗證 fable-r3/xverify-1、xverify-2（審 astra-r3），astra-r3/fix-1 處理後同意
  - by: sol
    method: independent-derivation
    note: 第三輪最後核對（139 局面逐一推導）；部分洗牌的寫法依 CONTRACT 10.18
scenarios:
  - name: 站起後禁止新主戰者攻擊
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: title
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - id: t
                card: CP03-017
              - filler: 20
            field:
              - id: a
                card: CSD03a-003
          title: カードファイト!! ヴァンガード
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: b
                card: BP01-173
                state:
                  acted: true
    decisions:
      - n: 1
        by: P1
        at: main
        do: attack
        attacker: a
        target: P2.leader
      - n: 2
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 2
      - n: 3
        by: P1
        at: resolve
        do: resolve-choice
        of:
          decision: 2
          occurrence: 1
        choice: execute
        select:
          - a
      - n: 4
        by: P2
        at: quick
        do: pass
      - n: 5
        by: P1
        at: main
        do: attack
        attacker: a
        target: P2.leader
      - n: 6
        by: P1
        at: main
        do: attack
        attacker: a
        target: b
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a:
            acted: false
          P1.trigger: []
          P1.cemetery:
            - t
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 17
      - at: after-decision-5
        view: omniscient
        outcome: cannot-attack
        assert:
          P2.leader.life: 17
          P1.field.a:
            acted: false
      - at: after-decision-6
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a:
            acted: true
    card_facts:
      CP03-017:
        trigger_icon: stand
        source: 官方卡圖 /wordpress/wp-content/images/cardlist/CP03/cp03-017.png；astra 2026-09-26 檢視右上藍色醒圖示，並交叉核對注釋與 CR 14.4.5.1.3.3
        verified: true
