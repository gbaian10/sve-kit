schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: rule-10.10-02
kind: rule
must_pass: true
mechanisms: [10.10.2.2, 5.14.2, 1.3.2.2, 8.4.9, 8.4.9.1, 取代效果, 攻擊傷害的取代排序（受影響者決定）, 持續效果與禁止]
cards: [BP06-073, BP06-074, BP15-T06, BP14-090, BP01-173]
why: >-
  Q1944 原題：大妖狐・ギンセツ（進化後）「自分の場の妖怪・フォロワーが与えるダメージを+1する」的一ツ尾狐（攻擊力 1）攻擊永久の盾・シオン「受けるダメージを-1する」。
  兩個取代效果作用於同一個攻擊傷害（8.4.9），受影響的是シオン → 由シオン的主人 P2 決定套用順序（10.10.2.2）：
  先 +1 再 −1 → 1 傷害；先 −1 → 0 → 傷害行動不存在（1.3.2.2）→ +1 沒東西可套 → 不受傷。
  交戰仍發生：シオン的 3 反擊傷害（8.4.9.1）破壞一ツ尾狐；一ツ尾狐離場誘發ギンセツ「妖怪・フォロワーが場を離れたとき、+1」。
  契約 9.4：這個排序決定的 of 指向 attack。
discriminates: >-
  固定先 +1 的引擎在 B 仍造成 1；固定先 −1 的引擎在 A 不造成傷害；讓攻擊方 P1 決定順序的引擎 awaiting.by 錯；
  把 0 傷害仍發出ダメージ事件的引擎在 B 多一筆事件；把「不受傷」做成「不交戰」的引擎不會反擊、一ツ尾狐存活。
refs:
  rules: [10.10.2, 10.10.2.2, 10.10.2.3, 5.14.2, 10.2.1.3.2, 1.3.2.2, 8.4.9, 8.4.9.1, 11.3.1, 9.1.4.4, 10.7.4.1.2]
  qa: [Q1944]
evidence:
  - ref: Q1944
    quote: >-
      与えるダメージや受けるダメージを増減する効果が複数適用される場合、その影響を受けるプレイヤーがその適用順を選択し、効果を適用します。…
      ①「受けるダメージを-1」→「与えるダメージを+1」…0ダメージを与える行動は全く行われなくなるため、ダメージを与えるという行動自体が存在しなくなります。…最終的に「ダメージを与えない」となります。
      ②「与えるダメージを+1」→「受けるダメージを-1」…最終的に1ダメージになります。
  - ref: cr 10.10.2.2
    quote: 影響を受ける事象がゲーム中の行動である場合、その行動を実行するプレイヤー、またはその行動が適用されるカードのマスターが決定します。
  - ref: cr 8.4.9.1
    quote: 攻撃目標がフォロワーである場合、それと同時に、攻撃目標のフォロワーはその攻撃力に等しいダメージを攻撃フォロワーに与えます。
    derivation:
      - 0 傷害只讓「一ツ尾狐給シオン的傷害」不存在；交戰本身與シオン的反擊 3 照常 → 一ツ尾狐 1/3 被破壞
status: verified
author: fable
verified_by:
  - by: astra
    method: qa
    note: 見 reverify/result.md〈R4、R5〉；Q1944／Q834／Q838 與 CR 10.10.2.2、1.3.2.2、8.4.9.1、11.3.1、9.1.4.4 交叉核對；依契約第 10 節第 2 條確認 of:attack occurrence=1，兩種傷害順序與 token／待機結果均吻合。

scenarios:
  - name: A P2 選「+1 → −1」→ シオン受 1；反擊破壞一ツ尾狐 → ギンセツ誘發
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 7, P2: 6}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ナイトメア, life: 20}
          pp: {current: 0, max: 7}
          zones:
            field:
              - {id: a1, card: BP06-073, state: {evolved: true, evolved_with: a9}}   # 大妖狐・ギンセツ（進化後 1/9）
              - {id: a2, card: BP15-T06}                                          # 一ツ尾狐 1/3（妖怪 token），非本回合進場
            evolution:
              - {id: a9, card: BP06-074}
            hand:
              - {filler: 2}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ビショップ, life: 20}
          pp: {current: 0, max: 7}
          zones:
            field:
              - {id: b1, card: BP14-090, state: {acted: true}}   # 永久の盾・シオン 3/7 アクト
            hand:
              - {id: b2, card: BP01-173}                          # 非クイック：讓 8.4.7 的合法選項可完整列出
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: attack, attacker: a2, target: b1}
      - {n: 2, by: P2, at: quick, do: pass}
      # 9.4／9.5：攻擊傷害（8.4.9）的取代排序，of 指向 attack；occurrence 只數以 of 指向這次攻擊的輸入點（クイック時點另有自己的 do）
      - {n: 3, by: P2, at: resolve, of: {decision: 1, occurrence: 1}, do: order-replacements, order: [{source: a1, card: BP06-074, line: 2}, {source: b1, line: 3}]}
      - {n: 4, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, card: BP06-074, line: 3}}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        awaiting:
          by: P2
          choices:
            - {do: pass}
        assert:
          P1.field.a2: {acted: true}
        events:
          - {kind: 攻撃, attacker: a2, target: b1}
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        awaiting:
          by: P2
          choices:
            - {do: order-replacements, order: [{source: a1, card: BP06-074, line: 2}, {source: b1, line: 3}]}
            - {do: order-replacements, order: [{source: b1, line: 3}, {source: a1, card: BP06-074, line: 2}]}
        assert:
          P2.field.b1: {hp: 7}
        forbidden_events:
          - {kind: ダメージ}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, card: BP06-074, line: 3}}}
        assert:
          P2.field.b1: {hp: 6}
          P1.field: [a1]
          P1.cemetery: []
        events:
          - {kind: ダメージ, source: a2, target: b1, amount: 1, group: 1}
          - {kind: ダメージ, source: b1, target: a2, amount: 3, group: 1}
          - {kind: 破壊, object: a2, by: rule-11.3.1}
          - {kind: 消去, object: a2}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a1: {power: 2, hp: 9}

  - name: B P2 選「−1 → +1」→ 0 → 傷害行動不存在 → シオン不受傷；交戰與反擊照常
    inherit: A P2 選「+1 → −1」→ シオン受 1；反擊破壞一ツ尾狐 → ギンセツ誘發
    decisions:
      - {n: 1, by: P1, at: main, do: attack, attacker: a2, target: b1}
      - {n: 2, by: P2, at: quick, do: pass}
      - {n: 3, by: P2, at: resolve, of: {decision: 1, occurrence: 1}, do: order-replacements, order: [{source: b1, line: 3}, {source: a1, card: BP06-074, line: 2}]}
      - {n: 4, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, card: BP06-074, line: 3}}}
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, card: BP06-074, line: 3}}}
        assert:
          P2.field.b1: {hp: 7}
          P1.field: [a1]
        events:
          - {kind: ダメージ, source: b1, target: a2, amount: 3}
          - {kind: 破壊, object: a2, by: rule-11.3.1}
        forbidden_events:
          - {kind: ダメージ, target: b1}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a1: {power: 2, hp: 9}
