id: rule-8.4.7-01
kind: rule
must_pass: true
mechanisms:
  - 8.4／7.4.5
  - 區域移動
cards:
  - BP01-173
  - BP15-118
  - ETD03-019
why: Quick 在傷害前可由手牌或 EX 打出；非 Quick 法術不合法，回溯後攻擊尚未造成傷害。
discriminates: EX 不可 Quick、宣告即扣血或容許普通法術都會失敗。
refs:
  rules:
    - 8.4.7
    - 8.4.8
    - 8.4.9
  qa: []
evidence:
  - ref: cr 8.4.7
    quote: "非ターンプレイヤーは、以下のいずれかを実行しま\nす。\n* 手札か EX エリアの【クイック】を持つカードを 1 枚\nプレイする（10.6）。\n* 【クイック】を持つ起動能力を 1 つプレイする。\n* 何もしない。"
    derivation:
      - Quick 在傷害前可由手牌或 EX 打出；非 Quick 法術不合法，回溯後攻擊尚未造成傷害。
  - ref: cr 8.4.8
    quote: "8.4.7 でカードまたは能力をプレイした場合、チェック\nタイミングが発生し、その後再び 8.4.7 に戻ります。"
    derivation:
      - Quick 在傷害前可由手牌或 EX 打出；非 Quick 法術不合法，回溯後攻擊尚未造成傷害。
  - ref: cr 8.4.9
    quote: "この時点で攻撃フォロワーが場に存在する場合、\n攻撃フォロワーはその攻撃力に等しいダメージを攻\n撃目標に与えます。"
    derivation:
      - Quick 在傷害前可由手牌或 EX 打出；非 Quick 法術不合法，回溯後攻擊尚未造成傷害。
status: verified
author: astra
verified_by:
  - by: fable
    method: independent-derivation
    note: 8.4.7；xverify-1/result.md〈其他驗過的題目〉
