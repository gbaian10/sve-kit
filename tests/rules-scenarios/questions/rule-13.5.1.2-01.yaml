schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: rule-13.5.1.2-01
kind: rule
must_pass: true
mechanisms:
  - 13.3.1.2
  - 13.3.1.3
  - 13.5.1.2
cards:
  - BP01-073
  - BP01-173
  - BP01-176
  - BP17-P21
  - SD03-005
why: 同一墓場 10 張但法術只有 9 時，NC10 成立、SC10 不成立；補成 10 法術才多主戰者傷害。
discriminates: 把總墓場數當 SC 會在9法術時多打3；把法術數當NC會在9法術時省略搜尋輸入點。
refs:
  rules:
    - 13.3.1.2
    - 13.3.1.3
    - 13.5.1.2
  qa: []
evidence:
  - ref: cr 13.3.1.2
    quote: ‘【スペルチェイン （数値）】（テキスト）’または‘【SC （数値）】（テキスト）’は‘あなたの墓場のスペルが（数値）枚以上である場合、（テキスト）’を意味します。
  - ref: cr 13.3.1.3
    quote: このカード自身の解決中はこのカードはまだ解決領域にあるため、このカードは自身の墓場のスペルの枚数に数えません。
  - ref: cr 13.5.1.2
    quote: ‘【ネクロチャージ （数値）】（テキスト）’または‘【NC （数値）】（テキスト）’は‘あなたの墓場のカードが（数値）枚以上である場合、（テキスト）’を意味します。
  - ref: BP01-073
    quote: "{クイック}\n相手のフォロワー1体を選ぶ。それを破壊する。【スペルチェイン_10】それのリーダーに3ダメージ。"
  - ref: BP17-P21
    quote: 相手の場のフォロワー1体を選ぶ。それに4ダメージ。【ネクロチャージ_10】自分のデッキから『友魂の少女・ルナ』1枚を探し、場に出す。
status: draft
author: astra
verified_by: []
