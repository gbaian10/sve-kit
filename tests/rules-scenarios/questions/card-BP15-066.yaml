schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP15-066
kind: card
must_pass: true
mechanisms: [能力傷害的誘發鏈, 致命傷害也誘發, Q2005, 10.5.2.1 規則處理先於待機能力, 10.7.7, 13.4.1.2 覚醒, 5.14.3.3, 兩個待機自選順序]
cards: [BP15-066, BP15-057, BP01-176, BP01-173]
why: >-
  烈絶の崇拝者「自分のターン中、これが能力ダメージを受けたとき、相手の場のフォロワー1体を選ぶ。それに3ダメージ」＋{ファンファーレ}「自分の場のフォロワー2体まで選ぶ。【覚醒】状態なら、それに1ダメージ」。
  用新打出的崇拝者 對體力 1 的另一隻崇拝者 與ガルミーユ 各 1 能力傷害：體力 1 的那隻受到致命傷害仍誘發（Q2005），檢查時點先做規則處理把它破壞（10.5.2.1），
  之後才由 P1 選順序打出兩個待機能力（10.7.7：來源已離場仍要打出）。ガルミーユ 的誘發：看 2 張、放 1 張到 EX（絶傑卡 −3）、其餘放墓場。
  B：PP 最大值 6 不是【覚醒】→ 選了目標但沒有傷害 → 什麼都不誘發。
discriminates: >-
  A：致命傷害不誘發、或在破壞前就結算誘發的引擎（after-decision-2 的墓場／待機清單不同）；把已離場的崇拝者 的待機取消的引擎不會對 b1 造成 3 傷害。
  B：不檢查覚醒就傷害的引擎會誘發。
refs:
  rules: [5.14.3.3, 10.7.2, 10.5.2.1, 10.5.2.2, 10.7.7, 11.3.1, 13.4.1.2, 10.6.2.8.2.1, 5.11.1]
  qa: [Q2005, Q2004]
evidence:
  - ref: Q2005
    quote: はい。誘発します。誘発したこの能力は、体力が0以下になったフォロワーの破壊処理が行われた後に、解決します。
  - ref: Q2004
    quote: フォロワーへの交戦によるダメージとリーダーへの攻撃によるダメージを除く、その他のあらゆるダメージが能力ダメージです。スペルの能力によるダメージやフォロワーの能力によるダメージがこれに該当します。
  - ref: cr 10.7.7
    quote: 待機状態の自動能力のプレイ時に、その自動能力を有していたカードの領域が変わっていた場合でも、その自動能力はプレイする義務があります。
  - ref: cr 13.4.1.2
    quote: ‘【覚醒】状態’とは‘あなたの現在の PP 最大値が 7 以上’を意味します。
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: 第三輪交叉驗證 astra-r3/xverify-1、xverify-2（審 fable-r3），fable-r3/fix-1～fix-3 處理後同意
  - by: sol
    method: independent-derivation
    note: 第三輪最後核對（139 局面逐一推導）；F1、F2 與禁止 vs 置換仲裁已依核對結果修正

scenarios:
  - name: A 覚醒：ファンファーレ 對體力 1 的崇拝者 與ガルミーユ 各 1 傷害 → 崇拝者 先被破壞，兩個誘發再結算
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 7, P2: 6}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 7, max: 7}
          zones:
            field:
              - {id: a2, card: BP15-066, state: {hp: 1}}     # 烈絶の崇拝者 3/3，只剩 1 體力
              - {id: a3, card: BP15-057}                     # 烈絶の侮蔑・ガルミーユ 5/5
            hand:
              - {id: h1, card: BP15-066}
              - {filler: 1}
            deck:
              - {id: d1, card: BP15-066}                     # 絶傑・カード
              - {id: d2, card: BP01-173}
              - {filler: 18}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 7}
          zones:
            field:
              - {id: b1, card: BP01-176}                     # 天剣の乙女 4/6
              - {id: b2, card: BP01-173}
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: h1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: h1, line: 3}}, targets: {1: [a2, a3]}}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a2, line: 2}}, targets: {1: [b1]}}
      - {n: 4, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a3, line: 1}}}
      - {n: 5, by: P1, at: resolve, of: {decision: 4, occurrence: 1}, do: resolve-choice, choice: execute, select: [d1]}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a2, line: 2}}, targets: {1: [b1]}}
            - {do: choose-pending, pending: {ability: {source: a2, line: 2}}, targets: {1: [b2]}}
            - {do: choose-pending, pending: {ability: {source: a3, line: 1}}}
        assert:
          P1.pp.current: 4
          P1.field: [a3, h1]
          P1.cemetery: [a2]
          P1.field.a3: {hp: 4}
        events:
          - {kind: ダメージ, source: h1, target: a2, amount: 1, group: 1}
          - {kind: ダメージ, source: h1, target: a3, amount: 1, group: 1}
          - {kind: 待機, ability: {source: a2, line: 2}, group: 2}
          - {kind: 待機, ability: {source: a3, line: 1}, group: 2}
          - {kind: 破壊, object: a2, by: rule-11.3.1}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a3, line: 1}}}
        assert:
          P2.field.b1: {hp: 3}
        events:
          - {kind: ダメージ, source: a2, target: b1, amount: 3}
      - at: after-decision-4
        view: omniscient
        outcome: paused
        awaiting:
          by: P1
          choices:
            - {do: resolve-choice, choice: execute, select: [d1]}
            - {do: resolve-choice, choice: execute, select: [d2]}
            - {do: resolve-choice, choice: decline}
      - at: after-decision-5
        view: omniscient
        outcome: resolved
        assert:
          P1.ex: [d1]
          P1.cemetery: [a2, d2]
          P1.deck: [filler: 18]
          semantic_state.pending_triggers: []

  - name: B 不是覚醒 → 選了目標但沒有傷害 → 沒有誘發
    inherit: A 覚醒：ファンファーレ 對體力 1 的崇拝者 與ガルミーユ 各 1 傷害 → 崇拝者 先被破壞，兩個誘發再結算
    setup:
      players:
        P1:
          pp: {current: 6, max: 6}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: h1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: h1, line: 3}}, targets: {1: [a2, a3]}}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.field: [a2, a3, h1]
          P1.field.a2: {hp: 1}
          P1.field.a3: {hp: 5}
          semantic_state.pending_triggers: []
        forbidden_events:
          - {kind: ダメージ}
          - {kind: 待機, ability: {source: a2, line: 2}}
          - {kind: 待機, ability: {source: a3, line: 1}}
