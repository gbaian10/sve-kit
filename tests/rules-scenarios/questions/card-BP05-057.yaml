why: "[astra] 使用祭品離場前攻擊力；token 已消去也能用最後資訊；橫置來源無法付橫置費用。\n[fable] ゴッドバレットゴーレム「{起動}これを{アクト}場の他のフォロワー1体を墓場に置く：…それに「墓場に置いたフォロワーの攻撃力」と同じダメージ」： 傷害值是被當費用送進墓場那隻的**攻擊力**，含當時套用中的增減（Q716）；它已離場，所以用最終情報（10.11.1，離場前的攻擊力）。 「これは相手のリーダーを攻撃できない」不影響用能力對リーダー造成傷害。"
discriminates: "[astra] 重讀墓場印刷攻擊或消去後查不到會傷害不符；已橫置仍起動會多犧牲。\n[fable] 用卡面攻擊力（2）而不是含 +2 的 4 的引擎，P2 體力 18 而非 16；離場後查不到攻擊力而算成 0（1.3.2.2 → 不造成傷害）的引擎也可觀察。"
refs:
  rules:
    - 10.11.1
    - 9.1.4.4
    - 10.4.6
    - 10.4.6.1
    - '5.29'
    - 4.1.4
    - 10.9.1.4
  qa:
    - Q716
    - Q714
    - Q713
evidence:
  - ref: Q716
    quote: はい。増減された攻撃力と同じダメージを与えます。
  - ref: Q714
    quote: はい。トークン・フォロワーであっても通常のフォロワーと同じく、墓場に置く直前のトークン・フォロワーの攻撃力と同じダメージを与えます。
  - ref: cr 10.11.1
    quote: "ある効果が特定のカードの情報や配置状態を参\n照している場合、その効果の実行時にそのカードが\nその領域から、場から場への移動以外の移動を\n行っていた場合、その効果は、そのカードが最後に\nその領域にあったときの情報や配置状態を参照しま\nす。"
    derivation:
      - 使用祭品離場前攻擊力；token 已消去也能用最後資訊；橫置來源無法付橫置費用。
  - ref: cr 9.1.4.4
    quote: "あるトークンが存在できる領域以外の領域\nに移動した場合、その移動を行った直後に、そ\nの領域で消去されます。この処理はチェックタ\nイミングを待たず、なんらかの効果の途中で移\n動を行った場合は、その移動の続きを行うより\nも前に実行されます。"
    derivation:
      - 使用祭品離場前攻擊力；token 已消去也能用最後資訊；橫置來源無法付橫置費用。
  - ref: cr 10.4.6
    quote: "コストのうち、 は‘場のスタンド状態のこのカード\nをアクトする’を意味します。"
    derivation:
      - 使用祭品離場前攻擊力；token 已消去也能用最後資訊；橫置來源無法付橫置費用。
  - ref: cr 10.11.1
    quote: ある効果が特定のカードの情報や配置状態を参照している場合、その効果の実行時にそのカードがその領域から、場から場への移動以外の移動を行っていた場合、その効果は、そのカードが最後にその領域にあったときの情報や配置状態を参照します。
