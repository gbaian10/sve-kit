why: 回手後原效果消失；進化卡分離回進化牌庫，token 回手立即消去，後續抽牌照做。
discriminates: 把進化卡一起帶手牌或讓 token 留手牌，会多物件或錯區域。
refs:
  rules:
    - 4.1.4
    - 5.16.3
    - 9.1.4.4
    - 11.6.1
  qa: []
evidence:
  - ref: cr 4.1.4
    quote: "カードが領域間の移動を行う場合、特に指示がな\nいかぎり、それは新しい領域における新しいカードで\nあるとみなされます。特に指定がないかぎり、前の\n領域で適用されていた効果がそのまま適用されるこ\nとはありません。"
    derivation:
      - 回手後原效果消失；進化卡分離回進化牌庫，token 回手立即消去，後續抽牌照做。
  - ref: cr 5.16.3
    quote: "場のカードが場以外に移動する場合、その移動直\n後にそのカードに関連付けられている進化領域の\nカードとの関連付けを失います。"
    derivation:
      - 回手後原效果消失；進化卡分離回進化牌庫，token 回手立即消去，後續抽牌照做。
  - ref: cr 9.1.4.4
    quote: "あるトークンが存在できる領域以外の領域\nに移動した場合、その移動を行った直後に、そ\nの領域で消去されます。この処理はチェックタ\nイミングを待たず、なんらかの効果の途中で移\n動を行った場合は、その移動の続きを行うより\nも前に実行されます。"
    derivation:
      - 回手後原效果消失；進化卡分離回進化牌庫，token 回手立即消去，後續抽牌照做。
  - ref: cr 11.6.1
    quote: "進化領域のカードが場のいずれのカードとも関連\n付けされていない場合、そのカードをエボルヴデッ\nキ置き場に表向きで移動します。"
    derivation:
      - 回手後原效果消失；進化卡分離回進化牌庫，token 回手立即消去，後續抽牌照做。
