schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP09-004
kind: card
must_pass: true
mechanisms: [雙面進化卡選面, '2.15', 12.2.2, 5.16.1.1, 查看牌庫上方多步驟, 進化卡自身的能力]
cards: [BP09-004, BP09-005, BP01-173, BP01-176, SD02-002, BP20-P12]
why: >-
  愛の妖精・ポーラ「これは『深緑の純心・ポーラ』か『真紅の絆・ポーラ』に進化する」：進化卡 BP09-005 是雙面卡，進化時由玩家選哪一面（Q1152；契約 9.6 的 evolve.face）。
  A 選『真紅の絆・ポーラ』（face 1）：【進化時】自分の場の他のカード2枚まで選ぶ → 放到 EX。B 選『深緑の純心・ポーラ』（face 0）：【進化時】看牌庫上 5 張，
  可公開 1 張エルフ・スペル加入手牌，其餘依喜好順序放底（兩句 → 兩個輸入點，9.8）。
discriminates: >-
  沒有選面、固定用 face 0 的引擎在 A 會停下來看牌庫；把兩面的能力都誘發的引擎 awaiting 會多出一個；
  B 中把「残りを好きな順に」的順序反過來的引擎牌庫尾端不同。
refs:
  rules: [2.15.3.1, 12.2.2, 5.16.1.1, 5.16.1.2, 12.6.2, 5.11.1, '5.21', 4.8.3.1]
  qa: [Q1152, Q1361]
evidence:
  - ref: Q1152
    quote: はい。『深緑の純心・ポーラ』か『真紅の絆・ポーラ』のどちらかの面を選択し、そのエボルヴフォロワーに進化することができます。
  - ref: cr 2.15.3.1
    quote: 場のカードは、表向きになっている面の情報を持ちます。
    derivation:
      - 進化領域的進化卡只有選定的那一面有效 → 只誘發那一面的【進化時】
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: A：xverify-2/recheck.md:84〈全部改動局面的核對索引〉；B：xverify-2/result.md:218〈全部實質核驗局面的索引〉（2.15.3.1、12.2.2、Q1152、Q1361）

scenarios:
  - name: A 選『真紅の絆・ポーラ』（face 1）：進化時把場上其他 2 張放到 EX
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 4, P2: 3}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: エルフ, life: 20}
          pp: {current: 3, max: 4}
          ep: 2
          zones:
            field:
              - {id: a1, card: BP09-004}          # 愛の妖精・ポーラ 2/2，非本回合進場
              - {id: a2, card: BP01-173}          # ファイター
              - {id: a3, card: BP01-176}          # 天剣の乙女
            evolve_deck:
              - {id: e1, card: BP09-005}          # 雙面：face 0 深緑の純心、face 1 真紅の絆
            hand:
              - {filler: 2}
            deck:
              - {id: d1, card: BP01-173}
              - {id: d2, card: BP20-P12}          # 野生の猛襲（エルフ・スペル）
              - {id: d3, card: BP01-173}
              - {id: d4, card: BP01-176}
              - {id: d5, card: SD02-002}
              - {filler: 15}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 4}
          zones:
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: evolve, source: a1, ability: {source: a1, line: 1}, evolve_card: e1, face: 1, pay: {pp: 0, ep: 1, sep: 0}}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, card: BP09-005, face: 1, line: 2}}, targets: {1: [a2, a3]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, card: BP09-005, line: 2, face: 1}}, targets: {1: [a2, a3]}}
            - {do: choose-pending, pending: {ability: {source: a1, card: BP09-005, line: 2, face: 1}}, targets: {1: [a2]}}
            - {do: choose-pending, pending: {ability: {source: a1, card: BP09-005, line: 2, face: 1}}, targets: {1: [a3]}}
            - {do: choose-pending, pending: {ability: {source: a1, card: BP09-005, line: 2, face: 1}}, targets: {1: []}}
        assert:
          P1.field.a1: {evolved: true, evolved_with: e1, power: 3, hp: 3}
          P1.evolution: [e1]
          P1.evolution.e1: {face: 1}
          P1.ep: 1
          P1.pp.current: 3
        events:
          - {kind: 進化, object: a1, with: e1}
          - {kind: 待機, ability: {source: a1, card: BP09-005, face: 1, line: 2}}
        forbidden_events:
          - {kind: 待機, ability: {source: a1, card: BP09-005, face: 0, line: 1}}
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.field: [a1]
          P1.ex: [a2, a3]
          P1.deck: [d1, d2, d3, d4, d5, filler: 15]
        events:
          # 「それをEXエリアに置く」一次放兩張 → 同時（互驗第二輪修正，astra）
          - {kind: 移動, object: a2, from: P1.field, to: P1.ex, group: 1}
          - {kind: 移動, object: a3, from: P1.field, to: P1.ex, group: 1}

  - name: B 選『深緑の純心・ポーラ』（face 0）：看 5 張、公開エルフ・スペル加入手牌、其餘放底
    inherit: A 選『真紅の絆・ポーラ』（face 1）：進化時把場上其他 2 張放到 EX
    decisions:
      - {n: 1, by: P1, at: main, do: evolve, source: a1, ability: {source: a1, line: 1}, evolve_card: e1, face: 0, pay: {pp: 0, ep: 1, sep: 0}}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, card: BP09-005, face: 0, line: 1}}}
      - {n: 3, by: P1, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, choice: execute, select: [d2]}
      - {n: 4, by: P1, at: resolve, of: {decision: 2, occurrence: 2}, do: resolve-choice, order: [d5, d4, d3, d1]}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, card: BP09-005, face: 0, line: 1}}}
        assert:
          P1.field.a1: {evolved: true, evolved_with: e1, power: 3, hp: 3}
          P1.evolution.e1: {face: 0}
      - at: after-decision-2
        view: omniscient
        outcome: paused
        awaiting:
          by: P1
          choices:
            - {do: resolve-choice, choice: execute, select: [d2]}
            - {do: resolve-choice, choice: decline}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P1.hand: [filler: 2, d2]
          P1.deck: [filler: 15, d5, d4, d3, d1]
          P1.field: [a1, a2, a3]
          P1.ex: []
        events:
          - {kind: 公開, object: d2, to: all, source: a1}
          - {kind: 移動, object: d2, from: P1.deck, to: P1.hand}
