schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP11-035
kind: card
must_pass: true
mechanisms: [本回合事件歷史, 本回合攻擊力或體力被加過, 進化能力的使用條件, 8.1.2, 5.16.2.1, 進化每回合一次]
cards: [BP11-035, BP11-036, BP06-072, BP01-173]
why: >-
  ピースキーパー・ヴィンセント「{進化}{コスト1}：これは進化する。この能力はこのターン、これの攻撃力や体力を+していたなら使える」：
  進化能力的使用條件是本回合「這張卡的攻擊力或體力被 + 過」的歷史（Q1513：就算被減過再加回來也算）。
  A：先用武力炎翔 +2 攻擊力 → 可以進化，進化後依 5.16.2.1 差額 +2 → 7/5。B：沒加過 → cannot-evolve（Q2074：連超進化也不行）。
  進化後的【進化時】看墓場原始費用種類數，墓場只有 1 種 → 什麼都不做。
discriminates: >-
  沒記錄「本回合這張卡被 + 過」的引擎：A 會 cannot-evolve；只看「目前攻擊力高於卡面」而非歷史的引擎，本題 A 相同但會在減後再加回的情況出錯（Q1513，本題未出）。
  沒套 5.16.2.1 差額的引擎：A 進化後攻擊力 5 而非 7。B 中允許進化的引擎會扣 PP 並產生進化事件。
refs:
  rules: [8.1.2, 8.3.2.1, 12.2.1, 12.2.3, 5.16.2.1, 5.27.1, 10.6.2.1.2]
  qa: [Q1513, Q2074]
evidence:
  - ref: Q1513
    quote: はい。満たします。
  - ref: Q2074
    quote: いいえ。《攻撃力》や《体力》を+していない場合、このフォロワーの《進化》能力をプレイすることができず、超進化することもできません。そのため「このターン、これの《攻撃力》や《体力》を+していたなら、」という条件を満たすことはできません。
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 先 +2 攻擊力 → 進化能力可用 → 進化後 7/5
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 6, P2: 5}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ウィッチ, life: 20}
          pp: {current: 6, max: 6}
          ep: 2
          zones:
            field:
              - {id: a1, card: BP11-035}          # ピースキーパー・ヴィンセント 4/4
            hand:
              - {id: s1, card: BP06-072}          # 武力炎翔（攻撃力+2）
            evolve_deck:
              - {id: e1, card: BP11-036}          # ヴィンセント（エボルヴ）5/5
            cemetery:
              - {id: c1, card: BP01-173}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 5}
          zones:
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: s1, targets: {1: [a1]}}
      - {n: 2, by: P1, at: main, do: evolve, source: a1, ability: {source: a1, line: 1}, evolve_card: e1, pay: {pp: 1, ep: 0}}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, card: BP11-036, line: 1}}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 5
          P1.field.a1: {power: 6, hp: 4}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 4
          P1.field.a1: {evolved: true, evolved_with: e1, power: 7, hp: 5}
          P1.leader.life: 20
        events:
          - {kind: 進化, object: a1, with: e1}
        forbidden_events:
          - {kind: 体力増加}

  - name: B 本回合沒加過 → 進化能力不能用
    inherit: A 先 +2 攻擊力 → 進化能力可用 → 進化後 7/5
    decisions:
      - {n: 1, by: P1, at: main, do: evolve, source: a1, ability: {source: a1, line: 1}, evolve_card: e1, pay: {pp: 1, ep: 0}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-evolve
        assert:
          P1.pp.current: 6
          P1.field.a1: {evolved: false, power: 4, hp: 4}
        forbidden_events:
          - {kind: 進化}
