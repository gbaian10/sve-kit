schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP01-P23
kind: card
must_pass: true
mechanisms: [令對手公開手牌再選一張捨棄, 資訊隔離, 5.21.1, 公開後仍可識別, 手札のオーラ可選, 12.15.2.1, 5.12, 對手捨棄由對手執行, 空手牌仍自傷, Q340]
cards: [BP01-110, BP01-P23, BP01-173, BP06-022, BP01-176, BP01-042]
why: >-
  狂気の処刑人（進化後）【進化時】「自分のリーダーに2ダメージ。相手プレイヤー1人は手札を公開する。自分はその中から1枚を選ぶ。相手はそれを捨てる」。
  公開（5.21.1）讓 P1 在選擇時看到 P2 全部手牌；解決結束後手牌回到非公開（Q876 同構），但 P1 已經識別了留下的卡（契約 knowledge：能識別出該區域裡的這張卡），
  之後 P2 新抽的卡 P1 不知道。手札裡的【オーラ】可以被選（Q221、12.15.2.1）。B：對手手牌 0 張 → 仍對自己 2 傷害（Q340），選擇的輸入點只剩 select []。
discriminates: >-
  A：把公開做成永久公開、或反過來在公開後立刻讓 P1 忘記手牌身份的引擎，after-decision-5 的 P1 view knowledge 不同；把全知資訊透給 P1 的引擎會知道 c4。
  把オーラ 套到手牌的引擎不允許選 c2。B：手牌 0 張就跳過整個能力（不自傷）的引擎 P1 體力不同。
refs:
  rules: [5.21.1, 5.21.1.1, 4.1.2, 12.15.2.1, 5.12, 5.14.1, 1.3.2, 10.6.2.8.2, 7.2.4]
  qa: [Q221, Q340, Q876]
evidence:
  - ref: Q221
    quote: はい。【オーラ】は場にあるときのみ選ばれないため、手札の【オーラ】を持つフォロワーを選ぶことができます。
  - ref: Q340
    quote: はい。相手の手札が0枚でも、このフォロワーの能力で自分のリーダーに2ダメージ与えます。
  - ref: Q876
    quote: いいえ。その《ファンファーレ》能力の解決が終了した時点で、非公開に戻ります。
    derivation:
      - スウィートディテクティブ 的「相手プレイヤー1人は手札を公開する」同構：公開只持續到該能力解決結束；但看過的卡沒有移動，P1 仍能識別它們（契約 9.12 knowledge 的「能識別」包含由公開資訊推得）
  - ref: cr 5.21.1
    quote: カードを‘公開する’指示がある場合、そのカードを他のすべてのプレイヤーが見えるようにします。
status: verified
author: fable
verified_by:
  - by: astra
    method: independent-derivation
    note: 第三輪交叉驗證 astra-r3/xverify-1、xverify-2（審 fable-r3），fable-r3/fix-1～fix-3 處理後同意
  - by: sol
    method: independent-derivation
    note: 第三輪最後核對（139 局面逐一推導）；F1、F2 與禁止 vs 置換仲裁已依核對結果修正

scenarios:
  - name: A 公開 3 張 → 選手牌裡的古の英雄（オーラ）→ 對手捨棄 → 之後對手抽的新卡 P1 不知道
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 4, P2: 3}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ナイトメア, life: 20}
          pp: {current: 1, max: 4}
          ep: 2
          zones:
            field:
              - {id: a1, card: BP01-110}                    # 狂気の処刑人 3/3
            evolve_deck:
              - {id: e1, card: BP01-P23}
            hand:
              - {filler: 2}
            deck:
              - {id: d1, card: BP01-042}
              - {filler: 19}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 3}
          zones:
            field:
              - {id: b1, card: BP01-173}
            hand:
              - {id: c1, card: BP01-173}
              - {id: c2, card: BP06-022}                    # 古の英雄（オーラ）
              - {id: c3, card: BP01-176}
            deck:
              - {id: c4, card: BP01-176}
              - {filler: 19}
    decisions:
      - {n: 1, by: P1, at: main, do: evolve, source: a1, ability: {source: a1, line: 1}, evolve_card: e1, pay: {pp: 0, ep: 1, sep: 0}}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, card: BP01-P23, line: 1}}}
      - {n: 3, by: P1, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, select: [c2]}
      - {n: 4, by: P1, at: main, do: end-phase}
      - {n: 5, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: paused
        awaiting:
          by: P1
          choices:
            - {do: resolve-choice, select: [c1]}
            - {do: resolve-choice, select: [c2]}
            - {do: resolve-choice, select: [c3]}
        assert:
          P1.leader.life: 18
          P2.hand: [c1, c2, c3]
        events:
          - {kind: ダメージ, source: a1, target: P1.leader, amount: 2}
          - {kind: 公開, object: c1, to: all, group: 1}
          - {kind: 公開, object: c2, to: all, group: 1}
          - {kind: 公開, object: c3, to: all, group: 1}
      - at: after-decision-2
        view: P1
        outcome: paused
        awaiting:
          by: P1
          choices:
            - {do: resolve-choice, select: [c1]}
            - {do: resolve-choice, select: [c2]}
            - {do: resolve-choice, select: [c3]}
        assert:
          P2.hand_count: 3
          knowledge: {knows: [c1, c2, c3], does_not_know: [c4]}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P2.hand: [c1, c3]
          P2.cemetery: [c2]
          P1.leader.life: 18
        events:
          - {kind: 捨てる, player: P2, object: c2}
      - at: after-decision-5
        view: P1
        outcome: resolved
        assert:
          turn: {active: P2, phase: main}
          P2.hand_count: 3
          knowledge: {knows: [c1, c3], does_not_know: [c4]}
      - at: after-decision-5
        view: omniscient
        outcome: resolved
        assert:
          P2.hand: [c1, c3, c4]
        events:
          - {kind: 引く, player: P2, object: c4}

  - name: B 對手手牌 0 張 → 仍對自己 2 傷害 → 沒有可選的卡
    inherit: A 公開 3 張 → 選手牌裡的古の英雄（オーラ）→ 對手捨棄 → 之後對手抽的新卡 P1 不知道
    setup:
      players:
        P2:
          zones:
            hand: []
    decisions:
      - {n: 1, by: P1, at: main, do: evolve, source: a1, ability: {source: a1, line: 1}, evolve_card: e1, pay: {pp: 0, ep: 1, sep: 0}}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, card: BP01-P23, line: 1}}}
      - {n: 3, by: P1, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, select: []}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: paused
        awaiting:
          by: P1
          choices:
            - {do: resolve-choice, select: []}
        assert:
          P1.leader.life: 18
        events:
          - {kind: ダメージ, source: a1, target: P1.leader, amount: 2}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.leader.life: 18
          P2.hand: []
          P2.cemetery: []
        forbidden_events:
          - {kind: 捨てる}
          - {kind: 公開}
