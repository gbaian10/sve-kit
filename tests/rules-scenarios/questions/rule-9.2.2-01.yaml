schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: rule-9.2.2-01
kind: rule
must_pass: true
mechanisms:
  - 2.3.3.1
  - 2.3.3.2
  - 9.2.2
cards:
  - BP02-041
  - BP06-117
  - BP10-020
why: 進化牌庫位置不等於エボルヴ種類；advance受未進化目標效果影響，離開允許區域立即表向回進化牌庫。
discriminates: 用所在牌庫推斷エボルヴ會錯放行生命の量産、錯拒絕白霜；只做一般回手會把advance留手牌。
refs:
  rules:
    - 2.3.3.1
    - 2.3.3.2
    - 9.2.2
  qa:
    - Q1267
    - Q1268
evidence:
  - ref: cr 2.3.3.1
    quote: 特殊な種類‘エボルヴ’はカード上では‘EVOLVE’と表記されます。
  - ref: cr 2.3.3.2
    quote: 特殊な種類‘アドバンス’はカード上では‘ADVANCE’と表記されます。
  - ref: cr 9.2.2
    quote: なんらかの処理を行う際に、アドバンスカードが、エボルヴデッキ置き場や場や EX エリアや解決領域以外の領域に移動する場合、その移動直後、その処理の続きを行う前に、そのアドバンスカードをその移動先の領域からエボルヴデッキに表向きに置きます。
  - ref: Q1267
    quote: いいえ。アドバンスフォロワーはエボルヴフォロワーではないので、選ぶことができません。
  - ref: Q1268
    quote: はい。アドバンスフォロワーはエボルヴフォロワーではないので、選ぶことができます。
status: verified
author: astra
verified_by:
  - by: fable
    method: qa
    note: Q1267、Q1268、9.2.2；xverify-2/result.md〈補題〉2/2
scenarios:
  - name: 表向advance不是生命の量産的合法目標
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: エルフ
            life: 20
          pp:
            current: 1
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            hand:
              - id: a
                card: BP06-117
            evolve_deck:
              - id: e
                card: BP10-020
                face_up: true
        P2:
          construction: class
          leader:
            class: ロイヤル
            life: 20
          pp:
            current: 0
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: a
        targets:
          1:
            - e
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-play
        assert:
          P1.hand:
            - a
          P1.pp.current: 1
          P1.evolve_deck.e:
            face_up: true
        forbidden_events:
          - kind: 引く
  - name: 場上advance可被白霜選到，回手後立即表向回進化牌庫
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: エルフ
            life: 20
          pp:
            current: 2
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            hand:
              - id: a
                card: BP02-041
        P2:
          construction: class
          leader:
            class: ロイヤル
            life: 20
          pp:
            current: 0
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: e
                card: BP10-020
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: a
        targets:
          1:
            - e
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P2.field: []
          P2.hand: []
          P2.evolve_deck:
            - e
          P2.evolve_deck.e:
            face_up: true
        events:
          - kind: 移動
            object: e
            from: P2.field
            to: P2.hand
          - kind: 移動
            object: e
            from: P2.hand
            to: P2.evolve_deck
            by: rule-9.2.2
