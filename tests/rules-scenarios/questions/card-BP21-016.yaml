scenarios:
  - name: 其他獸返回手牌並取得疾走
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 2
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - id: d
                card: BP01-173
            hand:
              - id: a
                card: BP21-016
            field:
              - id: b
                card: BP01-013
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 2
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: a
      - n: 2
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 1
        costs:
          1:
            - b
      - n: 3
        by: P1
        at: main
        do: attack
        attacker: a
        target: P2.leader
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.hand:
            - b
            - d
          P1.field:
            - a
          P1.deck: []
          P1.pp.current: 0
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a:
            acted: true
  - name: 同名獸不能付費
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 2
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - id: d
                card: BP01-173
            hand:
              - id: a
                card: BP21-016
            field:
              - id: b
                card: BP21-016
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 2
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: a
      - n: 2
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 1
        costs: decline
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - do: choose-pending
              pending:
                ability:
                  source: a
                  line: 1
              costs: decline
        assert:
          P1.field:
            - b
            - a
          P1.hand: []
          P1.pp.current: 0
      - at: after-decision-2
        view: omniscient
        outcome: pending-cancelled
        assert:
          P1.hand: []
          P1.field:
            - b
            - a
          P1.deck:
            - d
          P1.pp.current: 0
