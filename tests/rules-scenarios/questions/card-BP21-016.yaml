evidence:
  - ref: cr 10.4.2.2
    quote: コストのうち一部または全部を支払うことが 不可能である場合、このコストはまったく支払 うことはできません。
    derivation:
      - 以回手牌作為必要費用，支付成功才抽牌並賦予疾走；同名不能當素材，失敗不回溯從者上場。
  - ref: cr 10.7.3.2
    quote: なんらかの理由で、選んだ待機状態の自 動能力がプレイできない場合、その待機状態 は 1 回取り消されます。
    derivation:
      - 以回手牌作為必要費用，支付成功才抽牌並賦予疾走；同名不能當素材，失敗不回溯從者上場。
  - ref: cr 12.9.2
    quote: ‘【疾走】’は‘このフォロワーは、このターンの最初 から連続して自分がマスターであった状態でない場 合でも、攻撃フォロワーとして選択できる’を意味し ます。
    derivation:
      - 以回手牌作為必要費用，支付成功才抽牌並賦予疾走；同名不能當素材，失敗不回溯從者上場。
