why: 以回手牌作為必要費用，支付成功才抽牌並賦予疾走；同名不能當素材，失敗不回溯從者上場。
discriminates: 把回手牌當效果、允許同名或取消時回溯整張卡，會使手牌、場與疾走攻擊的結果不同。
