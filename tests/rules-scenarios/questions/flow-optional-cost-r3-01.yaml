schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: flow-optional-cost-r3-01
kind: flow
must_pass: true
mechanisms:
  - C14
  - 可選費用改費用
cards:
  - BP01-179
  - EBD02-007
why: 支付完整十張才把費用設為七；九張不能部分支付，拒付則仍為十二，七 PP 不足。
discriminates: 無條件把費用設七、容許部分費用或拒付也改費用，都會在失敗局面花 PP 並移動卡。
refs:
  rules:
    - 10.4.2.2
    - 10.6.2.5
  qa:
    - Q192
evidence:
  - ref: Q192
    quote: "Q: このスペルをプレイする際、墓場のスペルを消滅させるときに、プレイしているこのカードを消滅させるスペルとして数えることはできますか？\nA: いいえ。プレイするこのカードは墓場にないため、数えることはできません。"
    derivation:
      - 支付完整十張才把費用設為七；九張不能部分支付，拒付則仍為十二，七 PP 不足。
  - ref: cr 10.4.2.2
    quote: コストのうち一部または全部を支払うことが 不可能である場合、このコストはまったく支払 うことはできません。
    derivation:
      - 支付完整十張才把費用設為七；九張不能部分支付，拒付則仍為十二，七 PP 不足。
  - ref: cr 10.6.2.5
    quote: プレイするためのコストがある場合、そのコ ストを決定し、その後すべてのコストを支払い ます。
    derivation:
      - 支付完整十張才把費用設為七；九張不能部分支付，拒付則仍為十二，七 PP 不足。
status: verified
author: astra
verified_by:
  - by: fable
    method: independent-derivation
    note: 第三輪交叉驗證 fable-r3/xverify-1、xverify-2（審 astra-r3），astra-r3/fix-1 處理後同意
  - by: sol
    method: independent-derivation
    note: 第三輪最後核對（139 局面逐一推導）；部分洗牌的寫法依 CONTRACT 10.18
