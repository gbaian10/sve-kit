why: 箱詰め只讓裝備者失去能力；劍本身的減傷照常有效，但攻防數值減二並不是傷害。
discriminates: 錯把裝備能力複製到從者而一併刪除會承受二傷；把體力減少也當傷害則第二局面 hp 錯誤。
refs:
  rules:
    - 14.5.2.1.3
    - 5.31.2
  qa:
    - Q2522
    - Q2497
evidence:
  - ref: Q2522
    quote: "Q: 『プリンセスソード』を装備したフォロワーが何らかの能力によって能力を失った場合、「これを装備しているフォロワーが受けるダメージを-2する。」という能力は有効ですか？\nA: はい。有効です。"
    derivation:
      - 箱詰め只讓裝備者失去能力；劍本身的減傷照常有效，但攻防數值減二並不是傷害。
  - ref: Q2497
    quote: "Q: 「これを装備しているフォロワーが受けるダメージを-2する。」が適用されているフォロワーを目標に『デッドペナルティ』をプレイした場合、そのフォロワーの攻撃力と体力は-2されますか？\nA: はい。『デッドペナルティ』の能力はダメージを与える能力ではないため、攻撃力と体力が-2されます。"
    derivation:
      - 箱詰め只讓裝備者失去能力；劍本身的減傷照常有效，但攻防數值減二並不是傷害。
  - ref: cr 14.5.2.1.3
    quote: 種類がイクイップメントであるカードの 能力はイクイップメント領域でのみ有効で す。
    derivation:
      - 箱詰め只讓裝備者失去能力；劍本身的減傷照常有效，但攻防數值減二並不是傷害。
  - ref: cr 5.31.2
    quote: 【箱詰め】状態になったカードは、【箱詰め】状態で ある間、そのカードが持つ能力、および【箱詰め】状 態になった時点でそのカードが得ていたすべての能 力を失います。
    derivation:
      - 箱詰め只讓裝備者失去能力；劍本身的減傷照常有效，但攻防數值減二並不是傷害。
