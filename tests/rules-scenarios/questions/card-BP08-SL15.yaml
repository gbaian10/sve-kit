why: "[astra] 先完成選出多張、剩餘置底、破壞剛出的從者；所有入場曲與謝幕曲都等原能力结束。\n[fable] ネフティス「デッキの上7枚を見る。その中から、元のコスト6以下の{ナイトメア}フォロワーをカード名が異なるように4枚まで場に出してよい。残りを好きな順にデッキの下に置く。 これによって場に出したフォロワーすべてを破壊する」：整段效果先做完（出場 → 放底 → 破壞），期間誘發的ファンファーレ與ラストワード都要等到檢查時點， 由 P1 自選順序（Q1100）；來源已在墓場仍要打出（10.7.7）。デモンビーター的ファンファーレ費用 2 付不出 → 取消一次。 互驗第二輪修正（astra）：デモンビーター d1 有【守護】，放到場上時要問 place-acted（12.8.2、契約 9.2），算一個 occurrence。"
discriminates: "[astra] 每出一張就先結算會讓生命、場、墓場或待機集合不符。\n[fable] 在「場に出す」之後立刻插入結算ファンファーレ的引擎，會在破壞前就搜牌／造成傷害（事件順序）；把 4 個待機硬排順序的引擎 awaiting 只會列 1 個； 把來源在墓場的ファンファーレ當成失效的引擎會少 2 個待機。"
