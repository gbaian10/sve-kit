schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: rule-12.16.3-01
kind: rule
must_pass: true
mechanisms:
  - 12.16.3
  - 8.3.2.1
cards:
  - BP04-010
  - BP04-011
  - BP06-042
  - BP15-SL13
  - BP15-SL14
why: アドバンス起動是進化相當能力，可用1EP代付1PP，且與進化共用一次額度；放上advance不產生進化事件。
discriminates: 只讓evolve計額度會讓第二動作成功；把advance上場當進化會在evolutions多1；不支援EP會付費或拒絕錯誤。
refs:
  rules:
    - 12.16.3
    - 8.3.2.1
  qa: []
evidence:
  - ref: cr 12.16.3
    quote: ‘（効果）’は、‘（効果） これをプレイする際、そのコストに含まれる PP のうち 1 点を、PP ではなく 1 点の EP で支払うことができる。これは進化相当能力である。’（8.3.2）を意味します。
  - ref: cr 8.3.2.1
    quote: 起動能力を指定する際、それが進化能力または進化相当能力である場合、このターンにターンプレイヤーがいずれかの進化能力や進化相当能力をすでにプレイ済みである場合、その起動能力は指定できません。
  - ref: BP15-SL13
    quote: "これをプレイする際、手札の陰陽師・カード2枚を公開：コストを-1する。\n{アドバンス起動}{コスト4}：自分のエボルヴデッキの『貴人』1枚を場に出してよい。この能力は自分の墓場の陰陽師・カードやスペルが7枚以上なら使える。\n{ファンファーレ}1枚引く。自分の手札1枚を捨てる。\n{起動}これを{アクト}：自分の墓場の元のコスト4以下の陰陽師・フォロワー1枚を選ぶ。それを場に出す。"
status: draft
author: astra
verified_by: []
