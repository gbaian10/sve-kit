id: card-BP01-056
kind: card
must_pass: true
mechanisms:
  - 重複
  - 10.7 其他
cards:
  - BP01-056
  - BP01-173
why: 逐次從頂牌補到 EX 上限；原本滿 EX 時不移動也不讀牌庫頂。
discriminates: 固定做五次或先移一張再判滿，EX 與牌庫不同。
refs:
  rules:
    - 1.3.2
    - 4.8.3
  qa:
    - Q188
evidence:
  - ref: Q188
    quote: はい。プレイすることができます。その場合、EXエリアにカードは1枚も置かれません。
  - ref: cr 1.3.2
    quote: "なんらかの理由によりプレイヤーが実行不可能なこ\nとを行うように求められた場合、それは単に行われ\nません。同様に、効果により一定の量の行動を行う\nよう求められた場合、その一部のみ実行不可能な\n場合、可能な限りその行動を行います。"
    derivation:
      - 逐次從頂牌補到 EX 上限；原本滿 EX 時不移動也不讀牌庫頂。
  - ref: cr 4.8.3
    quote: "EX エリアにはプレイヤー毎に上限の数が指定され\nていて、ゲーム中に参照されることがあります。"
    derivation:
      - 逐次從頂牌補到 EX 上限；原本滿 EX 時不移動也不讀牌庫頂。
