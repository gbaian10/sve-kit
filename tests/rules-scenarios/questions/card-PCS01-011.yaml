schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: card-PCS01-011
kind: card
must_pass: true
mechanisms:
  - A UB
  - 必要目標
  - UB 發動監聽
cards:
  - BP01-173
  - CP04-059
  - PCS01-011
why: UB 需合法打出並結算才算發動；シズル沒有目標時不能橫置或補血，也不能觸發カヤ。
discriminates: 若宣告即累加 UB 或即通知カヤ，反例會補血或扣對手體力；合法例則確實發動一次。
refs:
  rules:
    - 14.5.1.3
    - 10.6.2.3.3
  qa:
    - Q2425
evidence:
  - ref: Q2425
    quote: "Q: 相手の場のフォロワーを選ぶことができない場合、このフォロワーの《UB》《起動》能力をプレイして、自分のリーダーは《体力》+1することができますか？また《UB》能力が発動したことを満たしますか？\nA: いいえ。相手の場のフォロワーを選ぶことができない場合、このフォロワーの《UB》《起動》能力をプレイすることができず、自分のリーダーは《体力》+1することができません。また《UB》能力が発動したことを満たしません。"
    derivation:
      - UB 需合法打出並結算才算發動；シズル沒有目標時不能橫置或補血，也不能觸發カヤ。
  - ref: cr 14.5.1.3
    quote: ユニオンバースト能力が‘発動した’ことを 参照する場合、それはその能力が適正にプレ イされて（10.6.2.7）解決された（10.6.2.8）ことを 参照します。
    derivation:
      - UB 需合法打出並結算才算發動；シズル沒有目標時不能橫置或補血，也不能觸發カヤ。
  - ref: cr 10.6.2.3.3
    quote: 選ぶ数として指定された数が 1 以上 で、かつその数の目標を選ぶことが不可能 である場合、このカードや能力のプレイは 不正で、このカードや能力はプレイできませ ん。このカードや能力のプレイは取り消さ れ、ゲームはこのカードや能力をプレイする ことを選択する前まで戻されます。
    derivation:
      - UB 需合法打出並結算才算發動；シズル沒有目標時不能橫置或補血，也不能觸發カヤ。
status: verified
author: astra
verified_by:
  - by: fable
    method: independent-derivation
    note: 第三輪交叉驗證 fable-r3/xverify-1、xverify-2（審 astra-r3），astra-r3/fix-1 處理後同意
  - by: sol
    method: independent-derivation
    note: 第三輪最後核對（139 局面逐一推導）；部分洗牌的寫法依 CONTRACT 10.18
scenarios:
  - name: 有合法目標
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: title
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: a
                card: PCS01-011
              - id: k
                card: CP04-059
          title: プリンセスコネクト！Re:Dive
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: b
                card: BP01-173
    decisions:
      - n: 1
        by: P1
        at: main
        do: activate
        ability:
          source: a
          line: 1
        targets:
          1:
            - b
      - n: 2
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: k
            line: 3
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a:
            acted: true
          P1.leader.life: 21
          semantic_state.counters_this_turn.P1.ub_activated: 1
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 18
          P2.field.b:
            hp: 2
  - name: 缺目標不算 UB 發動
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: title
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: a
                card: PCS01-011
              - id: k
                card: CP04-059
          title: プリンセスコネクト！Re:Dive
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field: []
    decisions:
      - n: 1
        by: P1
        at: main
        do: activate
        ability:
          source: a
          line: 1
        targets:
          1: []
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-activate
        assert:
          P1.field.a:
            acted: false
          P1.leader.life: 20
          semantic_state.counters_this_turn.P1.ub_activated: 0
        forbidden_events:
          - kind: 待機
          - kind: 体力増加
