why: 守護入場可自願橫置，屬於 play 結算中的一個輸入點；两種選擇都保留同一張實體卡。
discriminates: 固定所有守護橫置或直接跳過入場選擇，會在其中一局失敗。
refs:
  rules:
    - 12.8.2
    - 5.5.3
  qa: []
evidence:
  - ref: cr 12.8.2
    quote: "‘【守護】’は‘このフォロワーをスタンド状態で場に\n置く際、代わりにスタンド状態で場に置きアクトして\nよい’と‘このフォロワーはあなたのエンドフェイズに\nアクトすることができる’（7.4.3）と‘これがフォロワー\nである場合、相手が攻撃目標を選択する際、可能な\nら【守護】を持つアクト状態のあなたのフォロワーを\n攻撃目標として選択する’を意味します（8.4.3）。"
    derivation:
      - 守護入場可自願橫置，屬於 play 結算中的一個輸入點；两種選擇都保留同一張實體卡。
  - ref: cr 5.5.3
    quote: "カードが‘（領域）から場に出る’ことを参照する場\n合、それはそのカードがその領域から直接場に出る\nこと、およびそのカードがその領域からプレイされた\n後解決領域で解決されて場に出ることの両方を参\n照します。同様に、カードが‘（領域）以外から場に出\nる’ことを参照する場合、それはそのカードがその領\n域でも解決領域でもない領域から直接場に出るこ\nと、およびそのカードがその領域以外の領域からプ\nレイされた後解決領域で解決されて場に出ることの\n両方を参照します。"
    derivation:
      - 守護入場可自願橫置，屬於 play 結算中的一個輸入點；两種選擇都保留同一張實體卡。
