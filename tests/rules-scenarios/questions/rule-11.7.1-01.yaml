schema: sve-exam/2.1
sources:
  rules: cr-1.28.0
  cards_jsonl_sha256: 541781306484527c858c6587a2c838764b0513595b00711751370534050c3fa1
id: rule-11.7.1-01
kind: rule
must_pass: false
mechanisms:
  - スタック
  - 舊版提示文字
  - 檢查時點
cards:
  - BP01-T10
why: >-
  R-0008（official）把舊版三行視為規則提示。起動搬移最後一個スタックカウンター，檢查時點依現行規則送墓，token 隨即消去。
discriminates: >-
  把「歸零」當印刷的破壊誘發會留下一個待機或產生破壊事件。
refs:
  rules:
    - 13.3.2.2
    - 11.7.1
    - 9.1.4.4
  qa: []
  rulings:
    - R-0008
evidence:
  - ref: R-0008
    derivation:
      - スタック的移轉由 13.3.2.2 給予
      - 剩零個時依 11.7.1 放到墓場
status: draft
author: sol
verified_by: []
scenarios:
  - name: 舊版魔片把最後一個計數器移走後，依規則送墓並消去
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ウィッチ
            life: 20
          pp:
            current: 8
            max: 8
          zones:
            deck:
              - filler: 20
            field:
              - id: earth
                card: BP01-T10
                state:
                  counters:
                    スタックカウンター: 1
              - id: other
                card: BP01-T10
                state:
                  counters:
                    スタックカウンター: 1
        P2:
          construction: class
          leader:
            class: ロイヤル
            life: 20
          pp:
            current: 0
            max: 7
          zones:
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: activate
        ability:
          source: earth
          rule: 13.3.2.2
        targets:
          "1":
            - other
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.field:
            - other
          P1.field.other:
            counters:
              スタックカウンター: 2
          P1.cemetery: []
          semantic_state.pending_triggers: []
        events:
          - kind: 移動
            object: earth
            from: P1.field
            to: P1.cemetery
            by: rule-11.7.1
          - kind: 消去
            object: earth
            by: rule-9.1.4.4
        forbidden_events:
          - kind: 破壊
            object: earth
