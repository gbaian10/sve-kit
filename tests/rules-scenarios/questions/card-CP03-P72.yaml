why: サイレント・トム把墓場所選卡插到牌庫上數第三張，不取代原第三張，不洗牌；可選零張。再次插第三張會把先前插入者推到第四。
discriminates: 只支援頂底、誤以零基底索引插第四、覆蓋原第三、先洗再插或強制選一張，都會得到不同的完整牌序或墓場。
