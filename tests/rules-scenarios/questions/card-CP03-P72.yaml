evidence:
  - ref: Q1438
    quote: "Q: 自分の墓場にカードがある場合、このフォロワーの《ファンファーレ》能力によって自分の墓場のカード0枚を選び、デッキの上から3番目にカードを置かないことができますか？\nA: はい。1枚まで選ぶとき、0枚を選ぶことができるため、自分の墓場にカードがある場合でも、そのカードを選ばないことでデッキの上から3番目に置かないことができます。"
    derivation:
      - サイレント・トム把墓場所選卡插到牌庫上數第三張，不取代原第三張，不洗牌；可選零張。再次插第三張會把先前插入者推到第四。
  - ref: cr 4.5.2
    quote: デッキ置き場は非公開領域で、カードの順番が管 理されます。プレイヤーは効果やルールによる指示 がある場合にのみ、デッキ置き場のカードの順番を 変更したり、そのカードの情報を知ったりすることが できます。
    derivation:
      - サイレント・トム把墓場所選卡插到牌庫上數第三張，不取代原第三張，不洗牌；可選零張。再次插第三張會把先前插入者推到第四。
  - ref: cr 4.5.2.1
    quote: デッキ置き場のカードの順番は、カードを重 ねることで管理します。その際、重なっている 上方を‘上’と表記し、下方を‘下’と表記しま す。
    derivation:
      - サイレント・トム把墓場所選卡插到牌庫上數第三張，不取代原第三張，不洗牌；可選零張。再次插第三張會把先前插入者推到第四。
  - ref: cr 10.6.2.3.2
    quote: 選ぶ数が「～まで」や「好きな枚数」と 表記されている場合、0 から指定された数 までの間の任意の数を実際に選ぶ数として 指定します。
    derivation:
      - サイレント・トム把墓場所選卡插到牌庫上數第三張，不取代原第三張，不洗牌；可選零張。再次插第三張會把先前插入者推到第四。
