evidence:
  - ref: cr 6.2.1.4
    quote: "各プレイヤーはメインデッキを自身のデッキ\n置き場に置き、それをシャッフルします。"
    derivation:
      - 依開局程序先處理作品準備、再選先後及換牌；四張手牌整批放底，保留指定由上到下顺序。第一回合先攻不抽牌，PP 為 1，後攻 EP 為 3，双方 SEP 為 1。
  - ref: cr 6.2.1.6
    quote: "無作為にいずれか 1 人のプレイヤーを決定\nし、そのプレイヤーは自分が先攻か後攻かを\n選択します。"
    derivation:
      - 依開局程序先處理作品準備、再選先後及換牌；四張手牌整批放底，保留指定由上到下顺序。第一回合先攻不抽牌，PP 為 1，後攻 EP 為 3，双方 SEP 為 1。
  - ref: cr 6.2.1.8
    quote: "先攻プレイヤーから順に各プレイヤーは、\n望むのであれば自分の手札のカードを任意の\n順で自分のメインデッキの一番下に移動し、\n自分のデッキの一番上から 4 枚のカードを自\n分の手札に移動することができます。これは\n各プレイヤーが 1 回ずつのみ実行できます。"
    derivation:
      - 依開局程序先處理作品準備、再選先後及換牌；四張手牌整批放底，保留指定由上到下顺序。第一回合先攻不抽牌，PP 為 1，後攻 EP 為 3，双方 SEP 為 1。
  - ref: cr 6.2.1.9
    quote: "各プレイヤーの PP と PP 最大値を 0 にしま\nす。"
    derivation:
      - 依開局程序先處理作品準備、再選先後及換牌；四張手牌整批放底，保留指定由上到下顺序。第一回合先攻不抽牌，PP 為 1，後攻 EP 為 3，双方 SEP 為 1。
  - ref: cr 6.2.1.10
    quote: "先攻プレイヤーの EP を 0 に、後攻プレイ\nヤーの EP を 3 にします。"
    derivation:
      - 依開局程序先處理作品準備、再選先後及換牌；四張手牌整批放底，保留指定由上到下顺序。第一回合先攻不抽牌，PP 為 1，後攻 EP 為 3，双方 SEP 為 1。
  - ref: cr 6.2.1.11
    quote: 各プレイヤーの SEP を 1 にします。
    derivation:
      - 依開局程序先處理作品準備、再選先後及換牌；四張手牌整批放底，保留指定由上到下顺序。第一回合先攻不抽牌，PP 為 1，後攻 EP 為 3，双方 SEP 為 1。
  - ref: cr 6.2.1.12
    quote: 各リーダーの体力を 20 にします。
    derivation:
      - 依開局程序先處理作品準備、再選先後及換牌；四張手牌整批放底，保留指定由上到下顺序。第一回合先攻不抽牌，PP 為 1，後攻 EP 為 3，双方 SEP 為 1。
  - ref: cr 7.2.4.1
    quote: "先攻プレイヤーは、自身の最初のターンで\nはカードを引きません。"
    derivation:
      - 依開局程序先處理作品準備、再選先後及換牌；四張手牌整批放底，保留指定由上到下顺序。第一回合先攻不抽牌，PP 為 1，後攻 EP 為 3，双方 SEP 為 1。
  - ref: cr 14.3.1.2
    quote: "ゲームの準備中、自身のデッキが‘アイド\nルマスター シンデレラガールズ’のタイトルを\n基準としたデッキ（6.1.1.5.2）であるプレイヤー\nは、先攻プレイヤーの決定（6.2.1.6）の直前\nに、自身の EX エリアに『魔法のアイテム』トー\nクンを 5 つ置きます。"
    derivation:
      - 依開局程序先處理作品準備、再選先後及換牌；四張手牌整批放底，保留指定由上到下顺序。第一回合先攻不抽牌，PP 為 1，後攻 EP 為 3，双方 SEP 為 1。
  - ref: cr 14.4.3.1
    quote: "このタイトルを基準としてデッキを構築する\n場合、ゲーム前の手順（6.2）において、自身の\nメインデッキをデッキ置き場に置く（6.2.1.4）直\n前に、各プレイヤーは自身のデッキから【ス\nタートアミュレット】能力を持つカードを 1 枚裏\n向きで場に出す必要があります。"
    derivation:
      - 依開局程序先處理作品準備、再選先後及換牌；四張手牌整批放底，保留指定由上到下顺序。第一回合先攻不抽牌，PP 為 1，後攻 EP 為 3，双方 SEP 為 1。
  - ref: cr 14.4.3.2
    quote: "ゲーム開始時点、引き直しの実行後に、自\n身の場に【スタートアミュレット】能力を持つ裏\n向きのカードがある場合、それを表向きにしま\nす。"
    derivation:
      - 依開局程序先處理作品準備、再選先後及換牌；四張手牌整批放底，保留指定由上到下顺序。第一回合先攻不抽牌，PP 為 1，後攻 EP 為 3，双方 SEP 為 1。
  - ref: cr 6.2.1.7
    quote: 各プレイヤーは自分のデッキの一番上から4枚のカードを自分の手札に移動します。
    derivation:
      - 開局發牌與 6.2.1.8 換牌均為移動；先攻第一回合依 7.2.4.1 不抽牌。
      - 每次整批移動共用 group；事件依前一個不同比對點切分，偶像局面的發牌事件只放在 after-decision-1。
  - ref: cr 6.2.1.8
    quote: 先攻プレイヤーから順に各プレイヤーは、望むのであれば自分の手札のカードを任意の順で自分のメインデッキの一番下に移動し、自分のデッキの一番上から 4 枚のカードを自分の手札に移動することができます。これは各プレイヤーが 1 回ずつのみ実行できます。
    derivation:
      - 契約 9.8：order 列表由前到後＝放完後由上到下 → 牌庫底四張的相對順序＝order
      - 換牌與開局發牌（6.2.1.7）都是「移動」，不是「引く」；先攻第 1 回合不抽牌（7.2.4.1）→ 整段沒有任何 引く 事件
  - ref: cr 6.2.1.10
    quote: 先攻プレイヤーの EP を 0 に、後攻プレイヤーの EP を 3 にします。
  - ref: cr 7.2.4.1
    quote: 先攻プレイヤーは、自身の最初のターンではカードを引きません。
  - ref: cr 14.4.3.1
    quote: このタイトルを基準としてデッキを構築する場合、ゲーム前の手順（6.2）において、自身のメインデッキをデッキ置き場に置く（6.2.1.4）直前に、各プレイヤーは自身のデッキから【スタートアミュレット】能力を持つカードを 1 枚裏向きで場に出す必要があります。
  - ref: cr 14.3.1.2
    quote: ゲームの準備中、自身のデッキが‘アイドルマスター シンデレラガールズ’のタイトルを基準としたデッキ（6.1.1.5.2）であるプレイヤーは、先攻プレイヤーの決定（6.2.1.6）の直前に、自身の EX エリアに『魔法のアイテム』トークンを 5 つ置きます。
  - ref: cr 3.3.2
    quote: あるプレイヤーの経過ターン数を参照する場合、そのプレイヤーがターンプレイヤーとして、そのターンに初めてスタートフェイズ（7.2）を開始した回数を参照します。
    derivation:
      - 先攻第 1 回合的第一個輸入點：先攻經過回合數 1、後攻 0
