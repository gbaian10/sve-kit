why: "[astra] 依開局程序先處理作品準備、再選先後及換牌；四張手牌整批放底，保留指定由上到下顺序。第一回合先攻不抽牌，PP 為 1，後攻 EP 為 3，双方 SEP 為 1。\n[fable] 契約 9.13 的開局程序。Vanguard 作品構築：把デッキ放到デッキ置き場（6.2.1.4）之前先從牌組選 1 張【スタートアミュレット】裏向き放到場上（14.4.3.1）； 隨機決定一人選先後（6.2.1.6）；各抽 4 張（6.2.1.7）；先攻先決定是否換牌：把手牌以任意順序放到牌庫底再抽 4（6.2.1.8，只能一次）； PP 與 PP 最大值 0（6.2.1.9）；先攻 EP 0、後攻 EP 3（6.2.1.10）；SEP 1（6.2.1.11）；體力 20（6.2.1.12）；換牌後起始護符翻成表向き（14.4.3.2）； 先攻的第 1 回合開始階段 PP 最大值 +1、PP 補滿，但不抽牌（7.2.4.1）。偶像大師作品構築在決定先後之前把 5 個『魔法のアイテム』放到 EX（14.3.1.2）。"
discriminates: "[astra] 把換牌重洗、部分換牌、先攻多抽一張、兩人都加 PP 或作品準備放錯時間會改變牌序與區域。\n[fable] A：換牌時把手牌放到牌庫頂、或放底順序與 order 相反的引擎，P1 牌庫尾端順序不同；先攻第 1 回合抽牌的引擎 P2 手牌 5 張；EP 給反的引擎 P1.ep 不是 3。 B：選後攻的一方變成先攻的引擎 turn.active 不對。C：沒放『魔法のアイテム』或放錯數量的引擎 P1.ex_count 不是 5。"
