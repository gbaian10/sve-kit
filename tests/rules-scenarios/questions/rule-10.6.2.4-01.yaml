schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: rule-10.6.2.4-01
kind: rule
must_pass: true
mechanisms:
  - 分配傷害
  - 動態數值
  - 10.6.2.4.2
cards:
  - BP01-173
  - BP01-176
  - BP04-001
why: カシオペア本體先離開手牌再計手牌加 EX；比較零目標與非零分配，並確認零點誤選一體與四點誤分 4＋0 都保留待機，分別可重選零體與 3＋1。
discriminates: 把本體仍計入 X、允許已選目標分配零、取消仍能合法打出的待機，或把已進場的本體一併回溯，都會得到不同結果。
refs:
  rules:
    - 10.6.2.3.2
    - 10.6.2.4.1
    - 10.6.2.4.2.1
    - 10.6.2.4.2
  qa:
    - Q556
evidence:
  - ref: Q556
    quote: はい。好きな枚数なので可能です。（0枚を選ぶ。）
  - ref: cr 10.6.2.4.1
    quote: "目標として選んだ数が 0 である等、割\nり振る先が存在しない場合、割り振りは行\nわず、割り振って行われるべき処理は実行\nされません。"
    derivation:
      - 唯一手牌カシオペア進場後 X=0；依「好きな枚数」與 Q556 可選零體，此時不分配、不造成傷害，待機正常結算。
  - ref: cr 10.6.2.4.2.1
    quote: "なんらかの理由でこれにより適\n正に目標を選ぶことができない場合、\nこのカードや能力のプレイは不正で、\nゲームはこのカードや能力をプレイす\nる前の状態まで巻き戻されます。"
    derivation:
      - X=0 時仍可合法選零體，不是完全無法適正選目標；誤選一體適用 10.6.2.4.2 的重選，不適用本條的整個打出回溯或 10.7.3.2 的待機取消。
  - ref: cr 10.6.2.4.2
    quote: 値の割り振りを決定する際、そのために 10.6.2.3.1 で割り振る先として目標を選んでいる場合、その各目標に対して 1 単位以上の割り振りを行う義務があります。これが行えない場合、その目標の選び方は不正で、ゲームはこの目標を選ぶ前の状態まで巻き戻されます。
    derivation:
      - 零點誤選 b 並分配 0，不能滿足每個目標至少一單位；依使用者裁定以 cannot-play 表達退回重選，保留同一入場待機，再選零體後正常結算且無傷害。
      - 四點分給 b、c 為 4＋0 違反各目標至少一單位；仍可合法分配 3＋1，因此不是 10.6.2.4.2.1 的完全不能合法打出。
      - 依使用者裁定，此非法 choose-pending 以 cannot-play 表達回到嘗試前；待機保留，本體已進場及其五點 PP 費用不回溯。
      - 重新選同一待機並分配 3＋1 後，b／c 的體力由 6／6 變成 3／5，待機清空；兩個傷害同時發生。
status: draft
author: astra
verified_by: []
