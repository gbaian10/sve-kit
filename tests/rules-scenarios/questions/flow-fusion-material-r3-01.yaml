why: 融合讀取實際 EX 素材的八獄資訊，EX 送墓不是捨棄；不能用 token 支付。
discriminates: 若只看融合來源本身八獄，普通素材會錯抽；若只接受手牌則 EX 八獄不會抽；若忽略非 token 限制則反例成功。
refs:
  rules:
    - 12.18.2
    - 12.18.4.1
  qa:
    - Q2571
evidence:
  - ref: Q2571
    quote: "Q: 「《起動》【融合】トークンでないフォロワー1枚：これに融合カウンター1個を置く。八獄・フォロワーを融合したなら、1枚引く。」という能力は、『耽溺の咎人・セフィー』が手札にある場合に有効となる能力ですか？\nA: はい。『耽溺の咎人・セフィー』が手札にある場合に有効となる能力です。"
    derivation:
      - 融合讀取實際 EX 素材的八獄資訊，EX 送墓不是捨棄；不能用 token 支付。
  - ref: cr 12.18.2
    quote: ‘《起動》 【融合】 （条件）：（効果）’は‘《起動》 （条件）を満たす他のカードを、手札から捨てるか EX エリアから墓場に置く。手札にあるこのカードを EX エリアに置く。：（効果）’を意味します。
    derivation:
      - 融合讀取實際 EX 素材的八獄資訊，EX 送墓不是捨棄；不能用 token 支付。
  - ref: cr 12.18.4.1
    quote: あるカードが‘融合した’条件を満たした 際、その融合を行うために手札から捨てたり EX エリアから墓場に置いたりしたカードがな んらかの情報を持つ場合、‘（その情報の） カードを融合した’条件を満たします。 13. クラス別の情報やキーワード
    derivation:
      - 融合讀取實際 EX 素材的八獄資訊，EX 送墓不是捨棄；不能用 token 支付。
