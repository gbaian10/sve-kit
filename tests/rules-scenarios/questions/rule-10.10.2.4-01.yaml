schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: rule-10.10.2.4-01
kind: rule
must_pass: true
mechanisms:
  - 取代效果
  - 額外回合、跳過、勝利
cards:
  - BP01-170
  - BP05-SL14
  - EBD02-007
why: 超越先把費用固定成 7，再加上場上每張ルルナイ的 1；此題比較支付結果。
discriminates: 把固定值最後套用會在一／兩張分支多剩 1／2 PP。
refs:
  rules:
    - 10.10.2.4
    - 10.6.2.5.1.3
  qa:
    - Q734
    - Q735
evidence:
  - ref: Q734
    quote: "はい。その通りです。\nコストを特定の値に置換する効果やコストを増減させる効果がどちらも適用される場合、コストを特定の値に置換する能力を先に適用します。"
  - ref: Q735
    quote: はい。支払うコストは+2されます。
  - ref: cr 10.10.2.4
    quote: "カードや能力をプレイする際のコストを変\n更する置換効果（10.2.1.3.3）では、コストを特\n定の値に変更する効果は、コストを増減する\n効果よりも先に適用します。"
    derivation:
      - 超越先把費用固定成 7，再加上場上每張ルルナイ的 1；此題比較支付結果。
  - ref: cr 10.6.2.5.1.3
    quote: "コストを特定の値にする効果\n（10.4.4.1）を適用します。"
    derivation:
      - 超越先把費用固定成 7，再加上場上每張ルルナイ的 1；此題比較支付結果。
