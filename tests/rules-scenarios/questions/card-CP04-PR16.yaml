why: 裝備傷害加 2，但原本 0 傷害行動根本不發生，不能補成 2。
discriminates: 把傷害增幅直接加到攻擊力會在零攻擊局面錯扣生命。
refs:
  rules:
    - 1.3.2.2
    - 5.14.2
    - 14.5.2.1.3
  qa:
    - Q2496
evidence:
  - ref: Q2496
    quote: "いいえ。相手の場のフォロワーにダメージは与えません。\n自分の場の攻撃力が0のフォロワーが相手の場のフォロワーに攻撃した場合、自分の場の攻撃力が0のフォロワーの攻撃力が0であるため、ダメージを与えるという行動が起こりません。すなわち、「これを装備しているフォロワーが与えるダメージを+2する。」を適用する際に、ダメージを与えるという行動自体が存在しないため、何も適用されず、最終的に「ダメージを与えない」となります。"
  - ref: cr 1.3.2.2
    quote: "なんらかの理由で、ある行動を実行する際\nの単位数や回数が 0 以下である場合、あるい\nは 0 以下の値を基準として数値の加減算や比\n較を除くなんらかの行動を実行する場合、そ\nの行動はまったく行われません。マイナスで\nあっても逆の行動を求められることもありませ\nん。\n例：0 点のダメージを与える処理を実行する指示がある\n場合、そのダメージは与えられません。"
    derivation:
      - 裝備傷害加 2，但原本 0 傷害行動根本不發生，不能補成 2。
  - ref: cr 5.14.2
    quote: "‘ダメージ＋（数値）’等のダメージを修正する効果\nは、そのダメージを与える代わりに、そのダメージの\n値に修正を加えた値のダメージを与える置換効果と\nして適用されます。"
    derivation:
      - 裝備傷害加 2，但原本 0 傷害行動根本不發生，不能補成 2。
  - ref: cr 14.5.2.1.3
    quote: "種類がイクイップメントであるカードの\n能力はイクイップメント領域でのみ有効で\nす。"
    derivation:
      - 裝備傷害加 2，但原本 0 傷害行動根本不發生，不能補成 2。
