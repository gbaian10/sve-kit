rule-10.7.4.2-01:
  - 互相誘發兩次並各結算一次
  - 單獨離場，不誘發自身
card-BP15-079:
  - A 正例：エンジェルバレッジ 讓ギンセツ與一ツ尾狐同時被規則處理破壞 → 誘發，對 b1 與 P2 リーダー各 1 傷害
  - C 對照：ギンセツ先單獨離場，一ツ尾狐之後才離場 → 都不誘發
rule-10.10-02:
  - A P2 選「+1 → −1」→ シオン受 1；反擊破壞一ツ尾狐 → ギンセツ誘發
  - B P2 選「−1 → +1」→ 0 → 傷害行動不存在 → シオン不受傷；交戰與反擊照常
card-BP04-080:
  - A 自傷 1 → 真紅 → 8 傷害
  - B 有リリエル：自傷變 0 → 體力沒減少 → 不是真紅 → 4 傷害
rule-14.4.5-01:
  - '[fable] A 第1次揭露ドロートリガー、執行 → 抽到 a4 → 第2次看到 a5'
  - '[fable] B 第1次揭露ドロートリガー、不執行 → a3 放底 → 第2次看到 a4 → 也放底'
  - '[fable] C 對照：職業基準牌組 → 不看圖示、沒有決定、兩張直接放底（14.4.5.1.2）'
rule-10.9-01:
  - A 先「+2」後「1にする」→ 1/1
  - B 先「1にする」後「+2」→ 3/1
  - C 被設成 1/1 的 2/2 進化成 3/3 → 差額法 2/2（Q1923）
rule-10.9.1.5-01:
  - 未抹除來源，守護擋住主戰者
  - 較晚失去能力使較早守護授予無效
rule-10.9.1-02:
