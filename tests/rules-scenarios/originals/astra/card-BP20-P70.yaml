id: card-BP20-P70
kind: card
must_pass: true
mechanisms:
  - 回合特定時點
  - 手牌、墓場中有效的能力
  - token
cards:
  - BP01-173
  - BP20-P70
why: 紋章存在 EX，其能力在 EX 有效；一張以下才抽，filler 只被計數不被抽選。
discriminates: 只啟用場上能力會少抽；把條件當小於一會在一張分支少抽。
refs:
  rules:
    - 9.1.4.2
    - 7.4.1
    - 10.3.4
    - 10.3.6
  qa: []
evidence:
  - ref: cr 9.1.4.2
    quote: "種類がクレストであるトークンは、EX エリア\nでのみ存在できます。"
    derivation:
      - 紋章存在 EX，其能力在 EX 有效；一張以下才抽，filler 只被計數不被抽選。
  - ref: cr 7.4.1
    quote: "‘エンドフェイズが来たとき’で示されている誘発条\n件が発生します。"
    derivation:
      - 紋章存在 EX，其能力在 EX 有效；一張以下才抽，filler 只被計數不被抽選。
  - ref: cr 10.3.4
    quote: "特定の領域で処理することが明確である効果は、\nその領域でのみ有効です。"
    derivation:
      - 紋章存在 EX，其能力在 EX 有效；一張以下才抽，filler 只被計數不被抽選。
  - ref: cr 10.3.6
    quote: "クレストのトークンが持つ能力は、そのカードが EX\nエリアにある間のみ有効です。"
    derivation:
      - 紋章在 EX 的結束时能力有效；依當時手牌數判定。
