schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: card-PR-155
kind: card
must_pass: true
mechanisms:
  - 偶像大師：課程
  - token
cards:
  - BP01-173
  - PR-155
why: 道具本身也可按 4 費法術使用；加生命後抽空會在檢查時點敗北，並不撤銷加生命。
discriminates: 把課程道具視為不能打出或缺牌跳過抽牌不敗北都不同。
refs:
  rules:
    - 8.2.1
    - 5.10.1.1
    - 9.1.4.4
  qa:
    - Q899
evidence:
  - ref: Q899
    quote: "はい。スペルとしてプレイすることができます。\n4PP支払うことでプレイすることができ、自分のリーダーの《体力》を+1し、1枚引きます。スペルの解決後、このカードを墓場に置きますが、トークンなので墓場に置いた直後に墓場から消去します。"
  - ref: cr 8.2.1
    quote: "ターンプレイヤーは自分の手札か EX エリアにある\nカードを 1 枚指定し、そのカードのコストの値と同じ\n値の PP をコストとして支払うことでプレイすることが\nできます（10.6）。"
    derivation:
      - 道具本身也可按 4 費法術使用；加生命後抽空會在檢查時點敗北，並不撤銷加生命。
  - ref: cr 5.10.1.1
    quote: "この指示の実行の際に、そのプレイヤーの\nデッキ置き場にカードがない場合、そのプレイ\nヤーは次のルール処理でゲームに敗北します\n（11.2.2）。"
    derivation:
      - 道具本身也可按 4 費法術使用；加生命後抽空會在檢查時點敗北，並不撤銷加生命。
  - ref: cr 9.1.4.4
    quote: "あるトークンが存在できる領域以外の領域\nに移動した場合、その移動を行った直後に、そ\nの領域で消去されます。この処理はチェックタ\nイミングを待たず、なんらかの効果の途中で移\n動を行った場合は、その移動の続きを行うより\nも前に実行されます。"
    derivation:
      - 道具本身也可按 4 費法術使用；加生命後抽空會在檢查時點敗北，並不撤銷加生命。
status: draft
