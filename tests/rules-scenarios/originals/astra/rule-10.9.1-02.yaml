schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: rule-10.9.1-02
kind: rule
must_pass: true
mechanisms:
  - 持續效果與禁止
  - 10.5.2
  - 打出時的選擇
cards:
  - BP05-108
  - BP20-073
why: 3 體力目標會要求追加主戰者傷害，但零血リリエル仍留場至檢查時點，禁止能力傷害有效。
discriminates: 每個傷害原子後立即破壞會讓體力 3 分支錯掉 3 生命。
refs:
  rules:
    - 10.9.1
    - 10.5.1.1
    - 11.3.1
  qa:
    - Q777
evidence:
  - ref: Q777
    quote: "いいえ。相手のリーダーに3ダメージ与えることができません。\n『ハンプティダンプティ（EVOLVE）』の【進化時】能力による5ダメージで『神弓の座天使・リリエル』の体力は0以下になりますが、『神弓の座天使・リリエル』の破壊処理は【進化時】能力の解決後であるため、相手のリーダーに3ダメージ与えるタイミングで『神弓の座天使・リリエル』の能力が有効です。"
  - ref: cr 10.9.1
    quote: "なんらかの継続効果が存在する状態でカードの情\n報が求められる場合、以下の順でその情報に対す\nる継続効果を適用します。"
    derivation:
      - 3 體力目標會要求追加主戰者傷害，但零血リリエル仍留場至檢查時點，禁止能力傷害有效。
  - ref: cr 10.5.1.1
    quote: "チェックタイミングにおいては、まずルール\n処理がすべて解決され、解決するべきルール\n処理がなくなってから、誘発条件を満たした自\n動能力のプレイと解決を行います。詳しくは\n10.5.2 を参照してください。"
    derivation:
      - 3 體力目標會要求追加主戰者傷害，但零血リリエル仍留場至檢查時點，禁止能力傷害有效。
  - ref: cr 11.3.1
    quote: "あるフォロワーの体力が 0 以下である場合、その\nフォロワーは破壊されます。"
    derivation:
      - 3 體力目標會要求追加主戰者傷害，但零血リリエル仍留場至檢查時點，禁止能力傷害有效。
