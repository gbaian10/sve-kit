id: rule-5.18-01
kind: rule
must_pass: false
mechanisms:
  - 抉擇＋條件改變選擇數
  - 10.6.2
cards:
  - BP01-173
  - BP07-SL05
  - BP17-SL28
why: 2 つまで下限一；同時選 3 與 1 時仍依卡面先破壞再翻面抽牌。
discriminates: 依 options 列表順序處理會在第一次暫停時留下 b；允許空選項會錯扣費。
refs:
  rules:
    - 5.18.2.1
    - 10.6.2.8.2.2
  qa:
    - Q2275
evidence:
  - ref: Q2275
    quote: いいえ。1枚引き、自分のPPを2回復する前に相手の場のフォロワーを選ぶ必要があります。
  - ref: cr 5.18.2.1
    quote: "‘（数値）までチョイスする’指示がある場\n合、1 以上（数値）までの値を選択し、その個\n数の選択肢を選択して実行します。"
    derivation:
      - 2 つまで下限一；同時選 3 與 1 時仍依卡面先破壞再翻面抽牌。
  - ref: cr 10.6.2.8.2.2
    quote: "チョイスする（5.18）処理により\n複数の選択肢を選んだ場合、各選択\n肢はテキストに表記の順で実行しま\nす。"
    derivation:
      - 2 つまで下限一；同時選 3 與 1 時仍依卡面先破壞再翻面抽牌。
status: draft
author: astra
