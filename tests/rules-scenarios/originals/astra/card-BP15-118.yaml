id: card-BP15-118
kind: card
must_pass: true
mechanisms:
  - 取代效果
  - 前一步的結果
cards:
  - BP01-172
  - BP01-173
  - BP01-176
  - BP15-118
why: 3 張門檻替代傷害，5 張門檻另外才抽牌並回 PP；逐段條件不能混為一個。
discriminates: 把三張門檻涵蓋抽牌、把末句回 PP 視為無條件都會改變 PP 或手牌。
refs:
  rules:
    - 10.6.2.8.2
    - 10.10.2.5.1
  qa:
    - Q1373
    - Q1611
evidence:
  - ref: cr 10.6.2.8.2
    quote: "プレイしたのがスペルや起動能力や\n自動能力である場合、そのテキストや能力\nに示された効果を、表記の順に従って実行\nします。"
    derivation:
      - 3 張門檻替代傷害，5 張門檻另外才抽牌並回 PP；逐段條件不能混為一個。
  - ref: cr 10.10.2.5.1
    quote: "置換効果を適用する際、その中に自\n己置換効果が存在する場合、自己置換で\nあるものを先に適用します。"
    derivation:
      - 3 張門檻替代傷害，5 張門檻另外才抽牌並回 PP；逐段條件不能混為一個。
  - ref: Q1373
    quote: いいえ。自分の場に他のフォロワーがいる場合、相手の場のフォロワーを選ぶことができたとしても、「自分の場に他のフォロワーがいないなら、」以降の効果は働かず、1枚引くことができません。
    derivation:
      - 這是相同條件句式的旁證，不是本卡直接 Q&A。5 枚以上なら限制到段落末，因此 3 張進化牌時抽牌與 PP 回復都不執行。
  - ref: Q1611
    quote: いいえ。自分のリーダーの体力を+4以上していない場合、それ以降の効果は働かず、1枚引くことができません。
    derivation:
      - 這是相同條件句式的旁證，不是本卡直接 Q&A。5 枚以上なら限制到段落末，因此 3 張進化牌時抽牌與 PP 回復都不執行。
