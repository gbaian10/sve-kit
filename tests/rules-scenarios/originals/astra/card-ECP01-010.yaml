schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: card-ECP01-010
kind: card
must_pass: false
mechanisms:
  - 賽馬娘：食事、出走
cards:
  - BP01-173
  - CSD01-032
  - ECP01-010
why: 食事支付胡蘿蔔與 PP，出走獲得突進可在進場回合攻擊橫置從者；缺任一費用則回溯。
discriminates: 只扣 PP 或忘記出走給突進，race 與攻擊狀態會不符。
refs:
  rules:
    - 14.2.1.1
    - 14.2.2.3
    - 14.2.3.1
    - 10.4.2.2
  qa: []
evidence:
  - ref: cr 14.2.1.1
    quote: "あるカードが‘（指定回数）食事する’指示\nがある場合、そのカードに関連付けられたカー\nドが出走領域にないなら、そのカードのマス\nターは自身のエボルヴデッキの『にんじん』を\n指定回数に等しい枚数自身の出走領域に置\nき、その『にんじん』をそのカードに関連付けま\nす。"
    derivation:
      - 食事支付胡蘿蔔與 PP，出走獲得突進可在進場回合攻擊橫置從者；缺任一費用則回溯。
  - ref: cr 14.2.2.3
    quote: "‘（ある個数の アイコン） （コスト）：（効\n果）’は‘\nこれは（その個数に等しい回数）\n食事する （コスト）：（効果）’を意味します"
    derivation:
      - 食事支付胡蘿蔔與 PP，出走獲得突進可在進場回合攻擊橫置從者；缺任一費用則回溯。
  - ref: cr 14.2.3.1
    quote: "あるカードを‘（指定回数）出走する’指示\nがある場合、これ以降そのカードは、自身に関\n連付けられたカードが出走領域にあるかぎり、\n【突進】を持ち、このカードが‘出走した’事象\nが指定回数発生します。"
    derivation:
      - 食事支付胡蘿蔔與 PP，出走獲得突進可在進場回合攻擊橫置從者；缺任一費用則回溯。
  - ref: cr 10.4.2.2
    quote: "コストのうち一部または全部を支払うことが\n不可能である場合、このコストはまったく支払\nうことはできません。"
    derivation:
      - 食事支付胡蘿蔔與 PP，出走獲得突進可在進場回合攻擊橫置從者；缺任一費用則回溯。
status: draft
author: astra
verified_by: []
scenarios:
  - name: 有胡蘿蔔=True PP=1
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: title
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 1
            max: 1
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: a
                card: ECP01-010
                state:
                  entered_this_turn: true
            evolve_deck:
              - id: r
                card: CSD01-032
          title: ウマ娘 プリティーダービー
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 1
            max: 1
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: b
                card: BP01-173
                state:
                  acted: true
    decisions:
      - n: 1
        by: P1
        at: main
        do: activate
        ability:
          source: a
          line: 2
        costs:
          1:
            - r
        pay:
          pp: 1
          ep: 0
      - n: 2
        by: P1
        at: main
        do: attack
        attacker: a
        target: b
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P1.race:
            - r
          P1.field.a:
            acted: true
            links:
              出走:
                - r
          semantic_state.counters_this_turn:
            P1.evolve_played: 1
            P1.evolutions: 0
