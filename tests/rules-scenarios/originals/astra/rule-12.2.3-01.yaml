schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: rule-12.2.3-01
kind: rule
must_pass: true
mechanisms:
  - 進化卡自身的能力
  - 10.6.2.5
cards:
  - BP01-171
  - BP01-172
why: 4 費進化可付 3 PP 加 1 EP；總資源不足須完整回溯。
discriminates: EP 當免費進化或不足仍消耗 EP 會得不同 PP、EP 與進化狀態。
refs:
  rules:
    - 12.2.2
    - 12.2.3
    - 10.6.2.5.4
  qa: []
evidence:
  - ref: cr 12.2.2
    quote: "進化能力をプレイする際、コストとして、その能力\nを持つカードのマスターのエボルヴデッキ置き場の\n適正なカード（5.16.1.1.1）1 枚を公開します"
    derivation:
      - 4 費進化可付 3 PP 加 1 EP；總資源不足須完整回溯。
  - ref: cr 12.2.3
    quote: "進化能力をプレイする際、そのコストに含まれる\nPP のうち 1 点を、PP ではなく 1 点の EP（3.2.5）で支\n払うことができます。"
    derivation:
      - 4 費進化可付 3 PP 加 1 EP；總資源不足須完整回溯。
  - ref: cr 10.6.2.5.4
    quote: "なんらかの理由でこの時点でこのコス\nトを支払うことができない場合、このカード\nや能力のプレイは取り消され、ゲームはこ\nのカードや能力をプレイすることを選択する\n前まで戻されます。"
    derivation:
      - 4 費進化可付 3 PP 加 1 EP；總資源不足須完整回溯。
status: draft
author: astra
verified_by: []
scenarios:
  - name: PP=3 EP=1
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 3
            max: 3
          ep: 1
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: a
                card: BP01-171
            evolve_deck:
              - id: e
                card: BP01-172
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 3
            max: 3
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: evolve
        source: a
        evolve_card: e
        pay:
          pp: 3
          ep: 1
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P1.ep: 0
          P1.field.a:
            evolved: true
