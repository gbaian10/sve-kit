id: card-BP19-P25
kind: card
must_pass: true
mechanisms:
  - 抉擇＋條件改變選擇數
  - 法術鏈、死靈充能
cards:
  - BP01-173
  - BP19-P25
why: NC 不足仍可合法選傷害模式及目標，只是不造成傷害；另一模式只送頂牌。
discriminates: 把 NC 當整個選項合法性的先決條件，或不管選項都送頂牌，結果不同。
refs:
  rules:
    - 5.18.4
    - 13.5.1.3.2
  qa:
    - Q2599
evidence:
  - ref: Q2599
    quote: いいえ。適切な目標を選ぶことができない場合、【1】をチョイスすることができず、【2】をチョイスする必要があります。
  - ref: cr 5.18.4
    quote: "カードや能力のプレイに際し、チョイスする行動で\nの採用する選択肢を選んだ後、その選択肢以外の\n選択肢は存在しないものとして扱います。"
    derivation:
      - NC 不足仍可合法選傷害模式及目標，只是不造成傷害；另一模式只送頂牌。
  - ref: cr 13.5.1.3.2
    quote: "そのカードや能力のネクロチャージが\n参照する墓場のカードの枚数は、原則とし\nてそのネクロチャージを含む効果の解決の\n開始時点で固定され、その解決中にカード\nの枚数が変わっても変更されません。"
    derivation:
      - NC 不足仍可合法選傷害模式及目標，只是不造成傷害；另一模式只送頂牌。
status: draft
author: astra
