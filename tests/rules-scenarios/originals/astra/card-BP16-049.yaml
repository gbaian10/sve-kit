              - filler: 20
            field:
              - id: b
                card: BP01-P25
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: a
        targets:
          1:
            - b
      - n: 2
        by: P1
        at: main
        do: play
        card: burn
        targets:
          1:
            - b
    random: {}
    expected:
