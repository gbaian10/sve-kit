schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: card-BP16-049
kind: card
must_pass: true
mechanisms:
  - 法術鏈、死靈充能
  - 持續效果與禁止
  - 10.7.4
cards:
  - BP01-170
  - BP01-P25
  - BP16-049
  - BP20-073
why: SC 在第一張解決時固定；10 張時失去謝幕曲，9 張時保留，之後被第二張法術殺死再檢查。
discriminates: 若法術算入自身或場外原卡重建謝幕曲，待機集合會不同。
refs:
  rules:
    - 13.3.1.3
    - 13.3.1.4
    - 10.7.4.1.2
  qa:
    - Q2107
evidence:
  - ref: Q2107
    quote: いいえ。能力を失っているので《ラストワード》能力は誘発しません。
  - ref: cr 13.3.1.3
    quote: "このカード自身の解決中はこのカードはま\nだ解決領域にあるため、このカードは自身の\n墓場のスペルの枚数に数えません。"
    derivation:
      - SC 在第一張解決時固定；10 張時失去謝幕曲，9 張時保留，之後被第二張法術殺死再檢查。
  - ref: cr 13.3.1.4
    quote: "スペルチェインが参照する墓場のスペルの\n枚数は、原則としてそのスペルチェインを含む\n効果の解決の開始時点で固定され、その解決\n中にカードの枚数が変わっても変更されませ\nん。"
    derivation:
      - SC 在第一張解決時固定；10 張時失去謝幕曲，9 張時保留，之後被第二張法術殺死再檢查。
  - ref: cr 10.7.4.1.2
    quote: "カードが場からそれ以外の領域に移\n動することによって誘発する自動能力が\nカードの情報を求める場合、そのカードが\n場にある時点での情報を用います。"
    derivation:
      - SC 在第一張解決時固定；10 張時失去謝幕曲，9 張時保留，之後被第二張法術殺死再檢查。
