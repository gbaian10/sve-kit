schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: card-PCS01-048
kind: card
must_pass: true
mechanisms:
  - 4.4.4.2
  - 5.21.1
  - 12.4.3
cards:
  - BP01-173
  - CP04-009
  - PCS01-048
why: プリンセスナイト直接公開牌庫頂並放上場；满場不移動，頂牌留在牌庫，不能送墓或擠掉舊從者。
discriminates: 只在手牌打出才檢查上限會出現第六張；先出再棄的實作會把 d 移出牌庫。
refs:
  rules:
    - 4.4.4.2
    - 5.21.1
    - 12.4.3
  qa: []
evidence:
  - ref: cr 4.4.4.2
    quote: 場にカードを移動または作成する処理において、その結果場のカードの枚数が上限を超える場合、その移動または作成するカードの中から、その場の上限からその場にあるカードの枚数を引いた数のカードを選択し、それらのカードのみを移動または作成します。それ以外のカードは移動せず作成されません。
  - ref: cr 5.21.1
    quote: カードを‘公開する’指示がある場合、そのカードを現在の領域にある状態で、その情報をすべてのプレイヤーに見えるようにします。
  - ref: cr 12.4.3
    quote: ‘ファンファーレ （テキスト）’は、‘このカードを場以外から場に置いたとき、（テキスト）’を意味します。
  - ref: PCS01-048
    quote: "{進化}{コスト1}：これは進化する。\nこれが場にいる限り、自分の場の他のプリコネ・フォロワーすべては【守護】を持つ。\n{ファンファーレ}自分のデッキの上1枚を公開する。それがプリコネ・フォロワーなら、それを場に出す。"
status: draft
author: astra
verified_by: []
