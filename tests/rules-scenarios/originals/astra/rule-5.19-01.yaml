schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: rule-5.19-01
kind: rule
must_pass: true
mechanisms:
  - 隨機與擲骰
  - 手牌、墓場中有效的能力
cards:
  - BP01-170
  - BP01-173
  - BP05-SL14
  - BP05-SL15
why: 隨機捨棄由受控結果決定；捨棄光の道筋會另外待機抽一，白板則不會。
discriminates: 拿第一張代替受控亂數或吞掉捨棄觸發會讓手牌數與內容不同。
refs:
  rules:
    - 5.19.1
    - 10.7.2
  qa: []
evidence:
  - ref: cr 5.19.1
    quote: "テキストに‘（カード群または領域）をランダムに\n（数値）枚’という表記がある場合、そのカード群また\nはその領域内のすべてのカードの中からなんらか\nの手段により無作為に選択した（数値）枚のカードを\n参照します。"
    derivation:
      - 隨機捨棄由受控結果決定；捨棄光の道筋會另外待機抽一，白板則不會。
  - ref: cr 10.7.2
    quote: "なんらかの自動能力の誘発条件が満たされた場\n合、その自動能力は待機状態になります。"
    derivation:
      - 隨機捨棄由受控結果決定；捨棄光の道筋會另外待機抽一，白板則不會。
status: draft
author: astra
verified_by: []
scenarios:
  - name: 隨機捨棄 b
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: a
                card: BP05-SL14
            evolve_deck:
              - id: e
                card: BP05-SL15
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - id: d
                card: BP01-173
            hand:
              - id: b
                card: BP01-170
              - id: c
                card: BP01-173
    decisions:
      - n: 1
        by: P1
        at: main
        do: evolve
        source: a
        evolve_card: e
        pay:
          pp: 1
          ep: 0
      - n: 2
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 2
            card: BP05-SL15
      - n: 3
        by: P2
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: b
            line: 1
    random:
      random_selections:
        - n: 1
          from: P2.hand
          result:
            - b
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P2.hand:
            - c
            - d
          P2.cemetery:
            - b
