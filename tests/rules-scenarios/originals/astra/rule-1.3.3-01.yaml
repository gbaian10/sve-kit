schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: rule-1.3.3-01
kind: rule
must_pass: true
mechanisms:
  - 持續效果與禁止
  - 手牌、墓場中有效的能力
cards:
  - BP01-176
  - BP07-P16
why: 影の侵食本體在 sections；EX 禁止優先於一般 EX 可以打出。
discriminates: 忽略 sections 的禁止會在 EX 分支扣 PP 並造成傷害。
refs:
  rules:
    - 1.3.3
    - 8.2.1
  qa: []
evidence:
  - ref: cr 1.3.3
    quote: "あるカードの効果によりプレイヤーがなんらかの行\n動を行うよう指示された場合に、同時にその行動を\n禁止する効果が発生している場合、常に禁止する\n効果が優先されます。"
    derivation:
      - 影の侵食本體在 sections；EX 禁止優先於一般 EX 可以打出。
  - ref: cr 8.2.1
    quote: "ターンプレイヤーは自分の手札か EX エリアにある\nカードを 1 枚指定し、そのカードのコストの値と同じ\n値の PP をコストとして支払うことでプレイすることが\nできます（10.6）。"
    derivation:
      - 影の侵食本體在 sections；EX 禁止優先於一般 EX 可以打出。
