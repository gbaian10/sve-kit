schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: card-BP04-066
kind: card
must_pass: true
mechanisms:
  - 可選費用與範圍
  - 取代效果
  - 10.6.2
cards:
  - BP01-173
  - BP02-SL16
  - BP04-066
why: 全體消滅仍要先有一個合法目標；選白板後，全體效果可及 aura。
discriminates: 省掉前置選目標會讓只有イージス的局面合法；全體還套 aura 會留下 c。
refs:
  rules:
    - 10.6.2.3.3
    - 10.10.2.5.1
    - 12.15.2
  qa:
    - Q602
    - Q603
    - Q604
evidence:
  - ref: Q602
    quote: はい。相手のフォロワー1体を選ぶ必要があります。
  - ref: Q603
    quote: いいえ。このスペルをプレイするためには相手のフォロワーを選ぶ必要があります。相手のフォロワーを選ぶことができないので、このスペルをプレイすることができず、『ヘヴンリーイージス』を消滅させることができません。
  - ref: Q604
    quote: はい。『ゴブリン』を選ぶことによって問題なくこのスペルをプレイすることができ、相手のフォロワーすべてを消滅させることができます。
  - ref: cr 10.6.2.3.3
    quote: "選ぶ数として指定された数が 1 以上\nで、かつその数の目標を選ぶことが不可能\nである場合、このカードや能力のプレイは\n不正で、このカードや能力はプレイできませ\nん。このカードや能力のプレイは取り消さ\nれ、ゲームはこのカードや能力をプレイする\nことを選択する前まで戻されます。"
    derivation:
      - 全體消滅仍要先有一個合法目標；選白板後，全體效果可及 aura。
  - ref: cr 10.10.2.5.1
    quote: "置換効果を適用する際、その中に自\n己置換効果が存在する場合、自己置換で\nあるものを先に適用します。"
    derivation:
      - 全體消滅仍要先有一個合法目標；選白板後，全體效果可及 aura。
  - ref: cr 12.15.2
    quote: "‘【オーラ】’は‘このカードは相手のカードや能力\nにより選ばれない’を意味します。"
    derivation:
      - 全體消滅仍要先有一個合法目標；選白板後，全體效果可及 aura。
status: draft
