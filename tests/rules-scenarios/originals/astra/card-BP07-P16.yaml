schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: card-BP07-P16
kind: card
must_pass: true
mechanisms:
  - 動態數值
  - 回合特定時點
  - 手牌、墓場中有效的能力
cards:
  - BP07-P16
why: EX 的結束時能力依自然卡每 5 張取整數；0 不發傷害事件。墓場內同卡名的能力不因此有效。
discriminates: 四捨五入、零傷害仍發事件、把墓場副本也觸發均不同。
refs:
  rules:
    - 5.29.1
    - 1.3.2.2
    - 7.4.1
  qa:
    - Q1020
    - Q1019
evidence:
  - ref: Q1020
    quote: はい。自分の墓場の自然・カードが5枚以上、9枚以下なら1ダメージ。10枚以上、14枚以下なら2ダメージ。15枚以上、19枚以下なら3ダメージ与えます。（以降も同様です。）
  - ref: Q1019
    quote: いいえ。『影の侵食』の「自分のエンドフェイズが来たとき、これがEXエリアにあるなら、相手のリーダーすべてに「自分の墓場の自然・カード」5枚につき1ダメージ。」は、『影の侵食』が自分のEXエリアにある状態で、自分のエンドフェイズを迎えたときに誘発する自動能力であり、自動能力のプレイはスペルのプレイとは異なるため、『スターフェニックス』の能力は誘発しません。
  - ref: cr 5.29.1
    quote: "ある処理において、ある行動を‘（単位数）につき\n（数値）’実行する場合、その処理では、その単位数\nと数値により決定された値を基準としたその行動を\n1 回だけ実行します。その数値を基準としたその行\n動を単位数により決定した回数だけ繰り返すわけで\nはありません。\n例：自分の墓場にカードが 12 枚ある状態で、‘自分の\n墓場のカード 5 枚につき相手のリーダーに 1 ダメー\nジ’という処理を実行する場合、2 ダメージを与える処\n理を 1 回実行します。1 ダメージ与える処理を 2 回与\nえるわけではありません。また、墓場のカードの端数\n2 枚は数に数えません。"
    derivation:
      - EX 的結束時能力依自然卡每 5 張取整數；0 不發傷害事件。墓場內同卡名的能力不因此有效。
  - ref: cr 1.3.2.2
    quote: "なんらかの理由で、ある行動を実行する際\nの単位数や回数が 0 以下である場合、あるい\nは 0 以下の値を基準として数値の加減算や比\n較を除くなんらかの行動を実行する場合、そ\nの行動はまったく行われません。マイナスで\nあっても逆の行動を求められることもありませ\nん。\n例：0 点のダメージを与える処理を実行する指示がある\n場合、そのダメージは与えられません。"
    derivation:
      - EX 的結束時能力依自然卡每 5 張取整數；0 不發傷害事件。墓場內同卡名的能力不因此有效。
  - ref: cr 7.4.1
    quote: "‘エンドフェイズが来たとき’で示されている誘発条\n件が発生します。"
    derivation:
      - EX 的結束時能力依自然卡每 5 張取整數；0 不發傷害事件。墓場內同卡名的能力不因此有效。
