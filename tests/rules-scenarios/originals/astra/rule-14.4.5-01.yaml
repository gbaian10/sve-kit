schema: sve-exam/2.1
id: rule-14.4.5-01
kind: rule
must_pass: true
mechanisms:
  - 14.4.5
  - 14.4.6.3
cards:
  - CP03-001
  - CP03-016
  - CP03-018
  - CP03-021
why: '第一次翻開ドロートリガー後才選擇是否執行；執行會抽走原本第二張，第二次檢查因此翻到不同卡。兩個局面只改第一次決定。CP03-016 的 draw 與 CP03-018 的 heal 已由 Opus 依官方卡圖右上角圖示確認，card_facts 已標記 verified: true。filler 僅是永遠不會被翻到的牌庫尾部。'
refs:
  rules:
    - 14.4.5.1.1
    - 14.4.5.1.3.2
    - 14.4.5.1.3.4
    - 14.4.5.1.5
    - 14.4.6.3
    - 4.15.2
    - 8.4.6
    - 8.4.7
    - 2.6.2
  qa:
    - Q1481
    - Q1377
    - Q1378
evidence:
  - ref: Q1481
    quote: "トリガーの処理を先に行います。\n1回目のドライブチェックでトリガーを持つカードをトリガー領域に置いた場合、そのトリガーの処理を含むドライブチェックの処理がすべて終了した後に2回目のドライブチェックを行います。\n\n例えば、【ツインドライブ】による1回目のドライブチェックでドロートリガーをトリガー領域に置き、そのトリガーの処理を実行した場合、1枚引き、トリガー領域のカードを墓場に置いた後に2回目のドライブチェックを行います。\nトリガーの処理を実行しなかった場合やトリガーを持たないカードをトリガー領域に置いた場合は、そのカードをデッキの下に置いた後に2回目のドライブチェックを行います。"
  - ref: Q1377
    quote: はい。任意の順番で解決できます。
  - ref: Q1378
    quote: 【ツインドライブ】や【攻撃時】能力が誘発し解決するタイミングが先です。【攻撃時】能力などフォロワーが攻撃したときに誘発する能力をすべて解決した後、非ターンプレイヤーのクイックタイミングが訪れます。
  - ref: cr 14.4.5.1.3
    quote: そのカードがトリガーを持つ場合、そのプレイヤーはそのカードのトリガーアイコンに応じて以下の処理を任意で実行することができます。
    derivation:
      - 先依 .1.1 將頂牌移至公開的觸發區（4.15.2），再依圖示決定執行與否。
      - 執行抽牌則抽走 d2，第一次檢查把 d1 送墓後才翻 d3；不執行則 d1 放底，再翻 d2。
  - ref: cards CP03-016 / CP03-018 faces[0].sections
    quote: （ドライブチェックによってこれが捲れたなら、1枚引く） / （ドライブチェックによってこれが捲れたなら、自分のリーダーは{体力}+3する）
    derivation:
      - 注釋與 14.4.5 的 draw／heal 效果一致；2.6.2 明定注釋本身不產生效果。圖示真值另由 Opus 依官方卡圖確認，見 card-facts-verified.md，不再只依注釋推認。
status: draft
author: astra
verified_by: []
scenarios:
  - name: 第一次執行抽牌，第二次翻到治療
    setup:
      turn:
        active: P1
        phase: main
        first_player: P1
        elapsed_turns:
          P1: 4
          P2: 3
      history: none
      players:
        P1:
          leader:
            class: エルフ
            life: 10
          pp:
            current: 0
            max: 4
          ep: 0
          sep: 0
          zones:
            deck:
              - id: d1
                card: CP03-016
              - id: d2
                card: CP03-016
              - id: d3
                card: CP03-018
              - filler: 20
            field:
              - id: a1
                card: CP03-001
            cemetery:
              - id: a0
                card: CP03-021
          construction: title
          title: カードファイト!! ヴァンガード
        P2:
          leader:
            class: エルフ
            life: 20
          pp:
            current: 0
            max: 4
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            cemetery:
              - id: b0
                card: CP03-021
          construction: title
          title: カードファイト!! ヴァンガード
    decisions:
      - n: 1
        by: P1
        at: main
        do: attack
        target: P2.leader
        attacker: a1
      - n: 2
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a1
            line: 3
      - n: 3
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a1
            line: 2
            keyword: ツインドライブ
      - n: 4
        by: P1
        at: resolve
        do: resolve-choice
        choice: execute
        of:
          decision: 3
          occurrence: 1
      - n: 5
        by: P1
        at: resolve
        do: resolve-choice
        choice: execute
        of:
          decision: 3
          occurrence: 2
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        assert:
          P1.trigger:
            - d1
          P1.hand: []
          P1.deck:
            - d2
            - d3
            - filler: 20
          P1.leader.life: 10
          P2.leader.life: 20
        awaiting:
          by: P1
          choices:
            - do: resolve-choice
              choice: execute
            - do: resolve-choice
              choice: decline
        outcome: paused
      - at: after-decision-3
        view: P2
        assert:
          P1.trigger:
            - d1
          P1.hand_count: 0
          P1.deck_count: 22
          knowledge.knows:
            - d1
          knowledge.does_not_know:
            - d2
            - d3
        outcome: paused
        awaiting:
          by: P1
          choices:
            - do: resolve-choice
              choice: execute
            - do: resolve-choice
              choice: decline
      - at: after-decision-4
        view: omniscient
        assert:
          P1.hand:
            - d2
          P1.trigger:
            - d3
          P1.cemetery:
            - a0
            - d1
          P1.deck:
            - filler: 20
          P1.leader.life: 10
        awaiting:
          by: P1
          choices:
            - do: resolve-choice
              choice: execute
            - do: resolve-choice
              choice: decline
        outcome: paused
        events:
          - kind: 引く
            player: P1
            object: d2
          - kind: 移動
            object: d1
            from: P1.trigger
            to: P1.cemetery
          - kind: 移動
            object: d3
            from: P1.deck
            to: P1.trigger
      - at: after-decision-5
        view: omniscient
        assert:
          P1.hand:
            - d2
          P1.cemetery:
            - a0
            - d1
            - d3
          P1.deck:
            - filler: 20
          P1.trigger: []
          P1.leader.life: 13
          P2.leader.life: 20
          P1.field.a1:
            acted: true
            evolved: false
          semantic_state.pending_triggers: []
        outcome: resolved
    card_facts:
      CP03-016:
        trigger_icon: draw
        source: 官方卡圖右上角圖示（Opus 確認，card-facts-verified.md）
        verified: true
      CP03-018:
        trigger_icon: heal
        source: 官方卡圖右上角圖示（Opus 確認，card-facts-verified.md）
        verified: true
