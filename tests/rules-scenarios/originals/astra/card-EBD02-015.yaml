schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: card-EBD02-015
kind: card
must_pass: true
mechanisms:
  - 分配傷害
  - 1.3.2
cards:
  - BP01-173
  - BP01-176
  - EBD02-015
why: 分配在打出時且先於費用決定；每個已選目標至少分配 1。可以選零體，但選兩體分配 3 加 0 非法。
discriminates: 把分配延後、容許已選目標得到 0，或只驗目標數量的實作會接受 3 加 0；合法 2 加 1 應留下不同體力。
refs:
  rules:
    - 10.6.2.3.2
    - 10.6.2.4.1
    - 10.6.2.4
    - 10.6.2.4.2
  qa:
    - Q78
    - Q279
    - Q79
evidence:
  - ref: Q78
    quote: はい。0体を選ぶことができます。
  - ref: Q279
    quote: はい。2体まで選ぶとき、0体を選ぶことができるため、プレイすることができます。
  - ref: cr 10.6.2.3.2
    quote: "選ぶ数が「～まで」や「好きな枚数」と\n表記されている場合、0 から指定された数\nまでの間の任意の数を実際に選ぶ数として\n指定します。"
    derivation:
      - 選零目標合法，完全不發生分配傷害。非零分配缺打出時欄位，另列報告，不用結算選擇冒充。
  - ref: cr 10.6.2.4.1
    quote: "目標として選んだ数が 0 である等、割\nり振る先が存在しない場合、割り振りは行\nわず、割り振って行われるべき処理は実行\nされません。"
    derivation:
      - 選零目標合法，完全不發生分配傷害。非零分配缺打出時欄位，另列報告，不用結算選擇冒充。
  - ref: Q79
    quote: いいえ。「割りふる」の場合、選んだフォロワーには少なくとも1以上のダメージを割りふらなければならないため、0ダメージを与えることはできません。
  - ref: cr 10.6.2.4
    quote: "このカードや能力がなんらかの値を割り振\nる場合、その割り振りを決定します。"
    derivation:
      - 先指定目標及非零分配，之後才支付 PP；非法 3 加 0 應整個打出回溯。
  - ref: cr 10.6.2.4.2
    quote: "値の割り振りを決定する際、そのため\nに 10.6.2.3.1 で割り振る先として目標を選ん\nでいる場合、その各目標に対して 1 単位以\n上の割り振りを行う義務があります。これが\n行えない場合、その目標の選び方は不正\nで、ゲームはこの目標を選ぶ前の状態まで\n巻き戻されます。"
    derivation:
      - 先指定目標及非零分配，之後才支付 PP；非法 3 加 0 應整個打出回溯。
status: draft
