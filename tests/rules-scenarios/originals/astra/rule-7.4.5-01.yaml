schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: rule-7.4.5-01
kind: rule
must_pass: true
mechanisms:
  - 8.4／7.4.5
  - 回合特定時點
cards:
  - BP20-073
  - BP21-P37
why: 沒有守護選擇與結束時待機的場面，結束主階段後到非回合玩家 Quick；它能打出法術。
discriminates: 跳過整個結束 Quick 會錯過殺掉來源並扣費的狀態。
refs:
  rules:
    - 7.4.5
    - 7.4.6
  qa: []
evidence:
  - ref: cr 7.4.5
    quote: "非ターンプレイヤーは、以下のいずれかを実行しま\nす。\n* 手札か EX エリアの【クイック】を持つカードを 1 枚\nプレイする（10.6）。\n* 【クイック】を持つ起動能力を 1 つプレイする。\n* 何もしない。"
    derivation:
      - 沒有守護選擇與結束時待機的場面，結束主階段後到非回合玩家 Quick；它能打出法術。
  - ref: cr 7.4.6
    quote: "7.4.5 でカードまたは能力をプレイした場合、チェック\nタイミングが発生し、その後再び 7.4.5 に戻ります。"
    derivation:
      - 沒有守護選擇與結束時待機的場面，結束主階段後到非回合玩家 Quick；它能打出法術。
  - ref: contract 10.1
    quote: 沒有候選時不是輸入點
    derivation:
      - P1 場上沒有直立守護；7.4.3 不停住，直接由 P2 在 7.4.5 打出 Quick。
status: draft
author: astra
verified_by: []
scenarios:
  - name: 結束時 Quick=False
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: a
                card: BP21-P37
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            hand:
              - id: q
                card: BP20-073
    decisions:
      - n: 1
        by: P1
        at: main
        do: end-phase
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.field:
            - a
          P2.pp.current: 10
  - name: 結束時 Quick=True
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: a
                card: BP21-P37
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
