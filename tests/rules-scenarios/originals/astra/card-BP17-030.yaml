schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: card-BP17-030
kind: card
must_pass: true
mechanisms:
  - 打出時的選擇
  - 名稱包含比對
  - 區域移動
cards:
  - BP01-173
  - BP04-P07
  - BP17-030
  - BP21-PR05
why: 含リオード的目標才減 2；換區清除場上修正，EX 已滿則沒有移動也不重設。
discriminates: 完全同名比對會多扣 2 PP；無視 EX 上限或未清除修正會使場或 EX 的斷言失敗。
refs:
  rules:
    - 4.1.4
    - 10.6.2.3
  qa:
    - Q2235
    - Q2236
evidence:
  - ref: Q2235
    quote: いいえ。EXエリアが上限枚数に達しているため、カードの移動は行われず、場に残ります。
  - ref: Q2236
    quote: はい。失われます。
  - ref: cr 4.1.4
    quote: "カードが領域間の移動を行う場合、特に指示がな\nいかぎり、それは新しい領域における新しいカードで\nあるとみなされます。特に指定がないかぎり、前の\n領域で適用されていた効果がそのまま適用されるこ\nとはありません。"
    derivation:
      - 含リオード的目標才減 2；換區清除場上修正，EX 已滿則沒有移動也不重設。
  - ref: cr 10.6.2.3
    quote: "そのカードや能力が非公開領域のカード\n以外のなんらかの事物を‘選ぶ’場合、それ\n（以下‘目標’）を選びます。"
    derivation:
      - 含リオード的目標才減 2；換區清除場上修正，EX 已滿則沒有移動也不重設。
status: draft
author: astra
verified_by: []
