          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field: []
    decisions:
      - n: 1
        by: P1
        at: main
        do: attack
        attacker: a
        target: P2.leader
      - n: 2
        by: P2
        at: quick
        do: pass
      - n: 3
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 2
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: game-end
        assert:
          P2.leader.life: 12
          game:
            ended: true
            winner: P1
