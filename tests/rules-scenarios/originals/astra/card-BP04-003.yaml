id: card-BP04-003
kind: card
must_pass: true
mechanisms:
  - 額外回合、跳過、勝利
  - 持續效果與禁止
  - 1.3.2
cards:
  - BP04-003
  - BP05-092
why: 深き森の異形造成攻擊傷害後，其自動能力讓 P1 勝利，無須把 P2 體力降至零；攻擊力零完全不造成傷害而不誘發。古き護り手的禁止勝利優先於勝利指示。
discriminates: 只支援體力歸零勝利、零傷害仍誘發、忽略禁止勝利的實作分別在三個局面得到不同結果。
refs:
  rules:
    - 1.2.1
    - 1.3.3
    - 1.3.2.2
    - 10.7.1
  qa:
    - Q558
evidence:
  - ref: Q558
    quote: いいえ。攻撃力が0以下のフォロワーによる攻撃は、攻撃ダメージ自体を与えることはないため自分はこのバトルに勝利しません。
  - ref: cr 1.2.1
    quote: "いずれかのプレイヤーが敗北した場合、ゲームは\nその時点で終了します。対戦相手が敗北し、自身は\n敗北していないプレイヤーがゲームに勝利します。"
    derivation:
      - 深き森の異形造成攻擊傷害後，其自動能力讓 P1 勝利，無須把 P2 體力降至零；攻擊力零完全不造成傷害而不誘發。古き護り手的禁止勝利優先於勝利指示。
  - ref: cr 1.3.3
    quote: "あるカードの効果によりプレイヤーがなんらかの行\n動を行うよう指示された場合に、同時にその行動を\n禁止する効果が発生している場合、常に禁止する\n効果が優先されます。"
    derivation:
      - 深き森の異形造成攻擊傷害後，其自動能力讓 P1 勝利，無須把 P2 體力降至零；攻擊力零完全不造成傷害而不誘發。古き護り手的禁止勝利優先於勝利指示。
  - ref: cr 1.3.2.2
    quote: "なんらかの理由で、ある行動を実行する際\nの単位数や回数が 0 以下である場合、あるい\nは 0 以下の値を基準として数値の加減算や比\n較を除くなんらかの行動を実行する場合、そ\nの行動はまったく行われません。マイナスで\nあっても逆の行動を求められることもありませ\nん。\n例：0 点のダメージを与える処理を実行する指示がある\n場合、そのダメージは与えられません。"
    derivation:
      - 深き森の異形造成攻擊傷害後，其自動能力讓 P1 勝利，無須把 P2 體力降至零；攻擊力零完全不造成傷害而不誘發。古き護り手的禁止勝利優先於勝利指示。
  - ref: cr 10.7.1
    quote: "自動能力とは、特定の誘発条件が発生したとき\nに、その後に発生したチェックタイミングでプレイされ\nる能力を指します。"
    derivation:
      - 深き森の異形造成攻擊傷害後，其自動能力讓 P1 勝利，無須把 P2 體力降至零；攻擊力零完全不造成傷害而不誘發。古き護り手的禁止勝利優先於勝利指示。
