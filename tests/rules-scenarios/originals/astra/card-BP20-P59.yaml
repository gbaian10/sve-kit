schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: card-BP20-P59
kind: card
must_pass: true
mechanisms:
  - 手牌、墓場中有效的能力
  - 10.5.2
  - 前一步的結果
cards:
  - BP03-115
  - BP03-116
  - BP20-P59
  - BP20-SL29
why: 先完成全體傷害與捨棄，檢查時點破壞零血來源，才結算捨棄能力；マゼル不在場就不進 EX。
discriminates: 把條件固定在捨棄當下會在體力 5 分支錯移 h 到 EX。
refs:
  rules:
    - 10.5.2.1
    - 10.6.2.8.2
    - 10.7.7
  qa:
    - Q2702
evidence:
  - ref: Q2702
    quote: "いいえ。『至高の凌駕』をEXエリアに置くことはできません。詳細な挙動は以下の通りです。\n『ハンプティダンプティ』の【進化時】能力を解決します。『絶大の顕現・マゼルベイン』に5ダメージ与えられ体力が0以下になります。自分の手札をすべて捨て、『至高の凌駕』の能力が誘発し待機状態になります。その後チェックタイミングにおいて体力が0以下になった『絶大の顕現・マゼルベイン』が墓場に置かれます。次に待機状態となっている『至高の凌駕』の能力を解決します。この時点で自分の場に『絶大の顕現・マゼルベイン』がいないので『至高の凌駕』をEXエリアに置くことができません。"
  - ref: cr 10.5.2.1
    quote: "現在処理を行うべきルール処理すべてを\n同時に実行します。その結果新たに行うべき\nルール処理が発生している場合、この手順を\n行うべきルール処理が残っている間繰り返し\nます。"
    derivation:
      - 先完成全體傷害與捨棄，檢查時點破壞零血來源，才結算捨棄能力；マゼル不在場就不進 EX。
  - ref: cr 10.6.2.8.2
    quote: "プレイしたのがスペルや起動能力や\n自動能力である場合、そのテキストや能力\nに示された効果を、表記の順に従って実行\nします。"
    derivation:
      - 先完成全體傷害與捨棄，檢查時點破壞零血來源，才結算捨棄能力；マゼル不在場就不進 EX。
  - ref: cr 10.7.7
    quote: "待機状態の自動能力のプレイ時に、その自動能\n力を有していたカードの領域が変わっていた場合で\nも、その自動能力はプレイする義務があります。"
    derivation:
      - 先完成全體傷害與捨棄，檢查時點破壞零血來源，才結算捨棄能力；マゼル不在場就不進 EX。
