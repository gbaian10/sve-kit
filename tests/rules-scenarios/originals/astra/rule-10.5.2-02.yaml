schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: rule-10.5.2-02
kind: rule
must_pass: true
mechanisms:
  - 10.5.2
  - 10.7.4
cards:
  - BP01-P25
  - ETD02-019
why: 同時待機依當前 active，與先攻玩家無關；交換 active 後先處理的能力也交換。
discriminates: 永遠 P1 優先或先攻優先會在 P2 回合提供錯選項。
refs:
  rules:
    - 10.5.2.2
    - 10.5.2.3
  qa: []
evidence:
  - ref: cr 10.5.2.2
    quote: "ターンプレイヤーがマスターであるいずれ\nかの自動能力が待機状態になっている場合、\nターンプレイヤーはそのうち 1 つを選び、プレ\nイと解決を行い、その後 10.5.2.1 に戻ります。"
    derivation:
      - 同時待機依當前 active，與先攻玩家無關；交換 active 後先處理的能力也交換。
  - ref: cr 10.5.2.3
    quote: "非ターンプレイヤーがマスターであるいず\nれかの自動能力が待機状態になっている場\n合、非ターンプレイヤーはそのうち 1 つを選\nび、プレイと解決を行い、その後 10.5.2.1 に戻\nります。"
    derivation:
      - 同時待機依當前 active，與先攻玩家無關；交換 active 後先處理的能力也交換。
status: draft
author: astra
verified_by: []
scenarios:
