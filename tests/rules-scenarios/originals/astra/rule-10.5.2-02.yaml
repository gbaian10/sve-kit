            cemetery:
              - id: b
                card: BP01-P25
                state:
                  hp: 1
      semantic_state:
        pending_triggers:
          - id: ta
            controller: P1
            ability:
              source: a
              line: 1
            event:
              left_field: a
          - id: tb
            controller: P2
            ability:
              source: b
              line: 1
            event:
              left_field: b
        check_timing:
          in_progress: true
          rules_processed: true
    decisions:
      - n: 1
        by: P1
        at: check-timing
        do: choose-pending
