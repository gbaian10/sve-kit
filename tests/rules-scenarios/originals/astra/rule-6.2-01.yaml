why: 依開局程序先處理作品準備、再選先後及換牌；四張手牌整批放底，保留指定由上到下顺序。第一回合先攻不抽牌，PP 為 1，後攻 EP 為 3，双方 SEP 為 1。
discriminates: 把換牌重洗、部分換牌、先攻多抽一張、兩人都加 PP 或作品準備放錯時間會改變牌序與區域。
