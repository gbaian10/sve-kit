schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: card-BP18-P54
kind: card
must_pass: true
mechanisms:
  - 10.6.2.3
  - 10.6.2.3.3
cards:
  - BP18-P32
  - BP18-P35
  - BP18-P54
why: 宵待ちの休息的不同名是選目標限制；兩張同名不能當不同實體而一起選。
discriminates: 只按id去重會錯放行兩張貪りの蛇；按費用去重會錯拒絕兩張不同名二費卡。
refs:
  rules:
    - 10.6.2.3
    - 10.6.2.3.3
  qa: []
evidence:
  - ref: cr 10.6.2.3
    quote: そのカードや能力が非公開領域のカード以外のなんらかの事物を‘選ぶ’場合、それ（以下‘目標’）を選びます。
  - ref: cr 10.6.2.3.3
    quote: 選ぶ数として指定された数が 1 以上で、かつその数の目標を選ぶことが不可能である場合、このカードや能力のプレイは不正で、このカードや能力はプレイできません。このカードや能力のプレイは取り消され、ゲームはこのカードや能力をプレイすることを選択する前まで戻されます。
  - ref: BP18-P54
    quote: 自分の墓場の元のコスト2以下の透京・カードをカード名が異なるように3枚まで選ぶ。それを手札に加える。
status: draft
author: astra
verified_by: []
scenarios:
  - name: 同費用不同名可選
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: エルフ
            life: 20
          pp:
            current: 1
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            ex:
              - id: a
                card: BP18-P54
            cemetery:
              - id: g1
                card: BP18-P32
              - id: g2
                card: BP18-P32
              - id: g3
                card: BP18-P35
        P2:
          construction: class
          leader:
            class: ロイヤル
            life: 20
          pp:
            current: 0
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: a
        targets:
          1: &id001
            - g1
            - g3
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P1.ex: []
          P1.hand: *id001
          P1.cemetery:
            - g2
  - name: 選兩張同名不合法
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: エルフ
            life: 20
          pp:
            current: 1
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            ex:
              - id: a
                card: BP18-P54
            cemetery:
              - id: g1
                card: BP18-P32
              - id: g2
                card: BP18-P32
              - id: g3
                card: BP18-P35
        P2:
          construction: class
          leader:
            class: ロイヤル
            life: 20
          pp:
            current: 0
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: a
        targets:
          1:
            - g1
            - g2
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-play
        assert:
          P1.pp.current: 1
          P1.ex:
            - a
          P1.hand: []
          P1.cemetery:
            - g1
            - g2
            - g3
