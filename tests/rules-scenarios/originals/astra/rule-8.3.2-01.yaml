schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: rule-8.3.2-01
kind: rule
must_pass: true
mechanisms:
  - 進化卡自身的能力
  - 本回合歷史
cards:
  - BP01-171
  - BP01-172
why: 第一次進化用掉本回合進化相當能力額度；第二張的進化也不能使用。
discriminates: 按物件各一次而非玩家每回合一次會讓 b 進化並再扣 4。
refs:
  rules:
    - 8.3.2.1
  qa: []
evidence:
  - ref: cr 8.3.2.1
    quote: "起動能力を指定する際、それが進化能力ま\nたは進化相当能力である場合、このターンに\nターンプレイヤーがいずれかの進化能力や進\n化相当能力をすでにプレイ済みである場合、\nその起動能力は指定できません。"
    derivation:
      - 第一次進化用掉本回合進化相當能力額度；第二張的進化也不能使用。
status: draft
author: astra
verified_by: []
scenarios:
  - name: 第一次進化
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: a
                card: BP01-171
              - id: b
                card: BP01-171
            evolve_deck:
              - id: e
                card: BP01-172
              - id: f
                card: BP01-172
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: evolve
        source: a
        evolve_card: e
        pay:
          pp: 4
          ep: 0
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 6
          P1.field.a:
            evolved: true
          P1.field.b:
            evolved: false
          P1.evolve_deck:
            - f
  - name: 第二次進化被拒
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: a
                card: BP01-171
              - id: b
                card: BP01-171
            evolve_deck:
              - id: e
                card: BP01-172
              - id: f
                card: BP01-172
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: evolve
        source: a
        evolve_card: e
        pay:
          pp: 4
          ep: 0
      - n: 2
        by: P1
        at: main
        do: evolve
        source: b
        evolve_card: f
        pay:
          pp: 4
          ep: 0
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: cannot-evolve
        assert:
          P1.pp.current: 6
          P1.field.a:
            evolved: true
          P1.field.b:
            evolved: false
          P1.evolve_deck:
            - f
