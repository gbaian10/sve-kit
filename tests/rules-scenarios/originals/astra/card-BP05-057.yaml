schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: card-BP05-057
kind: card
must_pass: true
mechanisms:
  - 動態數值
  - '10.11'
  - token
cards:
  - BP01-173
  - BP05-057
  - BP21-T11
why: 使用祭品離場前攻擊力；token 已消去也能用最後資訊；橫置來源無法付橫置費用。
discriminates: 重讀墓場印刷攻擊或消去後查不到會傷害不符；已橫置仍起動會多犧牲。
refs:
  rules:
    - 10.11.1
    - 9.1.4.4
    - 10.4.6
  qa:
    - Q716
    - Q714
evidence:
  - ref: Q716
    quote: はい。増減された攻撃力と同じダメージを与えます。
  - ref: Q714
    quote: はい。トークン・フォロワーであっても通常のフォロワーと同じく、墓場に置く直前のトークン・フォロワーの攻撃力と同じダメージを与えます。
  - ref: cr 10.11.1
    quote: "ある効果が特定のカードの情報や配置状態を参\n照している場合、その効果の実行時にそのカードが\nその領域から、場から場への移動以外の移動を\n行っていた場合、その効果は、そのカードが最後に\nその領域にあったときの情報や配置状態を参照しま\nす。"
    derivation:
      - 使用祭品離場前攻擊力；token 已消去也能用最後資訊；橫置來源無法付橫置費用。
  - ref: cr 9.1.4.4
    quote: "あるトークンが存在できる領域以外の領域\nに移動した場合、その移動を行った直後に、そ\nの領域で消去されます。この処理はチェックタ\nイミングを待たず、なんらかの効果の途中で移\n動を行った場合は、その移動の続きを行うより\nも前に実行されます。"
    derivation:
      - 使用祭品離場前攻擊力；token 已消去也能用最後資訊；橫置來源無法付橫置費用。
  - ref: cr 10.4.6
    quote: "コストのうち、 は‘場のスタンド状態のこのカード\nをアクトする’を意味します。"
    derivation:
      - 使用祭品離場前攻擊力；token 已消去也能用最後資訊；橫置來源無法付橫置費用。
status: draft
author: astra
verified_by: []
scenarios:
  - name: 攻擊 2 token=False 橫置=False
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: a
                card: BP05-057
                state:
                  acted: false
              - id: b
                card: BP01-173
                state:
                  power: 2
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: activate
        ability:
          source: a
          line: 2
        costs:
          1:
            - b
        targets:
          1:
            - P2.leader
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 18
          P1.field:
            - a
          P1.field.a:
            acted: true
          P1.cemetery:
            - b
