why: 覺醒看 PP 最大值，不看打出後剩餘 PP；最大 7 剩 3 仍增強。
discriminates: 用目前 PP 判斷會使最大 7、10 分支沒有正確加值。
refs:
  rules:
    - 13.4.1.2
  qa: []
evidence:
  - ref: cr 13.4.1.2
    quote: "‘【覚醒】状態’とは‘あなたの現在の PP 最\n大値が 7 以上’を意味します。"
    derivation:
      - 覺醒看 PP 最大值，不看打出後剩餘 PP；最大 7 剩 3 仍增強。
