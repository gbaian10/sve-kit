          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            ex:
              - id: c0
                card: BP20-P66
              - id: c1
                card: BP20-P60
        P2:
          construction: class
          leader:
            class: ロイヤル
            life: 20
          pp:
            current: 0
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
      semantic_state:
        pending_triggers:
          - id: t
            controller: P1
            ability:
              source: c0
              line: 1
            event: {}
    decisions:
      - n: 1
        by: P1
        at: check-timing
        do: choose-pending
        pending: t
        targets:
          1:
            - P2.leader
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 19
          P1.ex_count: 2
