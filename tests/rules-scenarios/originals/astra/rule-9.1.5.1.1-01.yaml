schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: rule-9.1.5.1.1-01
kind: rule
must_pass: true
mechanisms:
  - 9.1.5.1.1
  - 10.3.6
cards:
  - BP20-P47
  - BP20-P60
  - BP20-P64
  - BP20-P65
  - BP20-P66
  - BP20-P68
  - BP21-P70
why: 紋章的 3／5 門檻是取代傷害數值；EX 同名只能一張，已有同名時不建立第二張。
discriminates: 逐段累加傷害會在五紋章打7而非4；不按同名阻止建立會出現2枚同名。
refs:
  rules:
    - 9.1.5.1.1
    - 10.3.6
  qa: []
evidence:
  - ref: cr 9.1.5.1.1
    quote: ある EX エリアに、そこにすでにあるクレストと同名のクレストを作成する場合、その作成は実行されません。
  - ref: cr 10.3.6
    quote: クレストのトークンが持つ能力は、そのカードが EXエリアにある間のみ有効です。
  - ref: BP20-P66
    quote: 自分のエンドフェイズが来たとき、相手のリーダー1人か相手の場のフォロワー1体を選ぶ。それに1ダメージ。自分のEXエリアのクレストが3枚以上なら、代わりに2ダメージ。5枚なら、代わりに4ダメージ。
  - ref: BP20-P47
    quote: "{進化}{コスト1}：これは進化する。\n{ファンファーレ}『クレスト 安息の団結者』1枚をEXエリアに置く。\n『クレスト 安息の団結者』{ビショップ}絶傑・狂信・クレスト自分のエンドフェイズが来たとき、自分の場の絶傑・フォロワー1体を選ぶ。自分のEXエリアのクレストが3枚以上なら、それは{攻撃力}+1/{体力}+1する。"
status: draft
author: astra
verified_by: []
