schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: rule-12.14-01
kind: rule
must_pass: true
mechanisms:
  - 必殺
  - 取代效果
cards:
  - BP01-105
  - BP01-176
  - CP04-PR16
  - CSD02c-018
why: 必殺是交戰後下一次規則處理破壞，不是傷害觸發。零攻擊、傷害被抵消、攻擊者被打死仍破壞防守者。
discriminates: 要求正傷害或來源存活才必殺會留下 b。
refs:
  rules:
    - 12.14.2
    - 12.14.2.1
    - 8.4.9.2
    - 11.3.2
  qa: []
evidence:
  - ref: cr 12.14.2
    quote: "‘【必殺】’は‘このフォロワーと交戦したフォロ\nワーは、次のルール処理で破壊される’を意味しま\nす。"
    derivation:
      - 必殺是交戰後下一次規則處理破壞，不是傷害觸發。零攻擊、傷害被抵消、攻擊者被打死仍破壞防守者。
  - ref: cr 12.14.2.1
    quote: "交戦することのみを条件としているため、\n実際に（攻撃力が 0 等で）ダメージを与えてい\nない場合でもフォロワーは破壊されます。"
    derivation:
      - 必殺是交戰後下一次規則處理破壞，不是傷害觸發。零攻擊、傷害被抵消、攻擊者被打死仍破壞防守者。
  - ref: cr 8.4.9.2
    quote: "この時点で攻撃フォロワーと攻撃目標が交\n戦状態である場合、攻撃フォロワーと攻撃目\n標が互いに‘交戦した’事象が発生します。"
    derivation:
      - 必殺是交戰後下一次規則處理破壞，不是傷害觸發。零攻擊、傷害被抵消、攻擊者被打死仍破壞防守者。
  - ref: cr 11.3.2
    quote: "直前のルール処理より後に、いずれかのフォロ\nワーが必殺（12.14）を持つフォロワーと交戦していた\n場合、そのフォロワーは破壊されます。"
    derivation:
      - 傷害上限保住體力，仍不阻止下一個規則處理的必殺破壞。
status: draft
author: astra
verified_by: []
