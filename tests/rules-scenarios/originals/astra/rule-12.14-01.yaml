        by: P1
        at: main
        do: attack
        attacker: a
        target: b
      - n: 2
        by: P2
        at: quick
        do: pass
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.field: []
