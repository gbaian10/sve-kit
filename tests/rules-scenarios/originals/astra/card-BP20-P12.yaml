schema: sve-exam/2.1
id: card-BP20-P12
kind: card
must_pass: true
mechanisms:
  - optional-cost-scope
  - 10.6.2.3
cards:
  - BP01-152
  - BP20-P11
  - BP20-P12
why: 追加費用支配 5 傷害及抽 1 張；不支付只有 3 傷害。沒有目標時即使宣告要支付，也不能打出或扣除費用。使用體力 7 的ルシフェル避免破壞與其他待機干擾。
refs:
  rules:
    - 10.4.7.1
    - 10.6.2.2.2
    - 10.6.2.3.3
    - 10.6.2.5
    - 10.6.2.8.3
  qa:
    - Q2633
    - Q2634
evidence:
  - ref: Q2633
    quote: いいえ。追加コストを支払っていない場合、「これの追加コストを払っていたなら、」以降の効果は働かず、1枚引くことができません。
  - ref: Q2634
    quote: いいえ。相手の場のフォロワーを選ぶことができない場合、このスペルをプレイすることができないため、コストの支払いもできず、1枚引くことができません。
  - ref: cr 10.6.2.3.3
    quote: このカードや能力のプレイは取り消され、ゲームはこのカードや能力をプレイすることを選択する前まで戻されます。
    derivation:
      - 目標選擇 .3 在費用支付 .5 之前；無目標局面不能先棄 a2 再失敗，也不能抽 a3。
  - ref: cards BP20-P12 faces[0].text
    quote: "これをプレイする際、追加コストとして手札の獣・カード1枚を捨ててよい。\n相手の場のフォロワー1体を選ぶ。それに3ダメージ。これの追加コストを払っていたなら、代わりに5ダメージ。1枚引く。"
    derivation:
      - Q2633 直接限定後段效果；有支付時依卡面改為 5 傷害再抽 1，沒有支付則僅 3 傷害。
status: draft
author: astra
verified_by: []
