schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: rule-1.3.4-01
kind: rule
must_pass: false
mechanisms:
  - 奪取、交換、變身
  - 1.3.4
cards:
  - BP01-173
  - BP13-043
why: 先由 P1 指定再由看見指定內容的 P2 指定，兩者指定完成後才依序渡す；不是原子交換，滿場可只成功後半。
discriminates: 先渡再讓 P2 指定會在中間點改變場面；當原子交換會使 1/5 分支結果不同。
refs:
  rules:
    - 1.3.4
    - 5.22.2
  qa:
    - Q1766
evidence:
  - ref: Q1766
    quote: "複数のプレイヤーが同時になんらかの選択を伴う処理を行うよう求められた場合、ターンプレイヤーから先に処理を行います。非ターンプレイヤーは、ターンプレイヤーの処理の内容を知ってから自分の選択を行います。\n以下、処理順です。\n\n①ターンプレイヤーは、自身のフォロワー1体を指定します。\n②非ターンプレイヤーは、自身のフォロワー1体を指定します。（ターンプレイヤーの処理の内容を知ってから自身の選択を行うことができます。）\n③ターンプレイヤーは、指定したフォロワーを自身以外のプレイヤーに渡します。\n④非ターンプレイヤーは、指定したフォロワーを自身以外のプレイヤーに渡します。"
  - ref: cr 1.3.4
    quote: "複数のプレイヤーが同時になんらかの選択を伴う\n処理を行うよう求められた場合、それがゲームの開\n始前であれば先攻プレイヤーから、それがゲーム中\nであればターンプレイヤーから先に処理を行いま\nす。非ターンプレイヤーは、ターンプレイヤーの処理\nの内容を知ってから自分の選択を行います。"
    derivation:
      - 先由 P1 指定再由看見指定內容的 P2 指定，兩者指定完成後才依序渡す；不是原子交換，滿場可只成功後半。
  - ref: cr 5.22.2
    quote: "自分の場のカードを‘渡す’指示がある場合、その\nカードを相手の場に移動します。移動した場合、そ\nのカードのマスターは相手になります。"
    derivation:
      - 先由 P1 指定再由看見指定內容的 P2 指定，兩者指定完成後才依序渡す；不是原子交換，滿場可只成功後半。
  - ref: Q1766
    quote: "複数のプレイヤーが同時になんらかの選択を伴う処理を行うよう求められた場合、ターンプレイヤーから先に処理を行います。非ターンプレイヤーは、ターンプレイヤーの処理の内容を知ってから自分の選択を行います。\n以下、処理順です。\n\n①ターンプレイヤーは、自身のフォロワー1体を指定します。\n②非ターンプレイヤーは、自身のフォロワー1体を指定します。（ターンプレイヤーの処理の内容を知ってから自身の選択を行うことができます。）\n③ターンプレイヤーは、指定したフォロワーを自身以外のプレイヤーに渡します。\n④非ターンプレイヤーは、指定したフォロワーを自身以外のプレイヤーに渡します。"
    derivation:
      - 同一句要求雙方各指定；按 Q1766 與 1.3.4 以 P1、P2 兩個輸入點表達。契約 10.7 已明定不同玩家各有一個輸入點；此項不再待裁定。
status: draft
author: astra
verified_by: []
scenarios:
  - name: 場數 1/1
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            hand:
              - id: s
                card: BP13-043
            field:
              - id: a0
                card: BP01-173
                state:
                  hp: 1
                  power: 5
                  acted: true
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: b0
                card: BP01-173
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: s
      - n: 2
        by: P1
        at: resolve
        do: resolve-choice
        of:
          decision: 1
          occurrence: 1
        select:
          - a0
      - n: 3
        by: P2
        at: resolve
        do: resolve-choice
        of:
          decision: 1
          occurrence: 2
        select:
          - b0
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: paused
        assert:
          P1.field:
            - a0
          P2.field:
            - b0
        awaiting:
          by: P2
          choices:
            - do: resolve-choice
              select:
                - b0
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.field:
            - b0
          P2.field:
            - a0
          P2.field.a0:
            acted: true
            hp: 1
            power: 5
