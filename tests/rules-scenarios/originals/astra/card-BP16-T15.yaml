  - name: 從 ex 打出
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 0
            max: 1
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            ex:
              - id: a
                card: BP16-T15
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 0
            max: 1
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: a
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P1.hand: []
          P1.ex: []
