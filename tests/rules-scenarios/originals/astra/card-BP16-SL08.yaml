schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: card-BP16-SL08
kind: card
must_pass: true
mechanisms:
  - 抉擇＋條件改變選擇數
  - 10.7 其他
  - token
cards:
  - BP01-173
  - BP01-176
  - BP14-027
  - BP16-SL08
  - BP16-T15
why: 選項 3 同時生成兩枚金幣，芸者依兩張各待機一次；EX 已滿則零生成零待機。用精確待機事件數避免為新 token 擅造 id。
discriminates: 把同時進 EX 合成一事件會只待機一次；滿 EX 仍觸發也會違反禁止事件。
refs:
  rules:
    - 10.7.2.1
    - 4.8.3.2
  qa:
    - Q1886
evidence:
  - ref: Q1886
    quote: はい。2回誘発します。
  - ref: cr 10.7.2.1
    quote: "自動能力の誘発条件が複数回満たされた\n場合、その自動能力はその回数分待機状態\nになります。"
    derivation:
      - 選項 3 同時生成兩枚金幣，芸者依兩張各待機一次；EX 已滿則零生成零待機。用精確待機事件數避免為新 token 擅造 id。
  - ref: cr 4.8.3.2
    quote: "EX エリアにカードを移動または作成する処\n理において、その結果 EX エリアのカードの枚\n数が上限を超える場合、その移動または作成\nするカードの中から、その EX エリアの上限か\nらその EX エリアにあるカードの枚数を引いた\n数のカードを選択し、それらのカードのみを移\n動または作成します。それ以外のカードは移\n動または作成しません。"
    derivation:
      - 選項 3 同時生成兩枚金幣，芸者依兩張各待機一次；EX 已滿則零生成零待機。用精確待機事件數避免為新 token 擅造 id。
status: draft
author: astra
verified_by: []
scenarios:
  - name: 原 EX 0
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: none
      players:
        P1:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            hand:
              - id: g
                card: BP16-SL08
            field:
              - id: a
                card: BP14-027
            ex: []
        P2:
          construction: class
          leader:
            class: ニュートラル
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
            field:
              - id: b
                card: BP01-176
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: g
      - n: 2
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: g
            line: 1
        options:
          - 3
      - n: 3
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 1
          event:
            entered_ex: new-1
        targets:
          1:
            - b
      - n: 4
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 1
          event:
            entered_ex: new-2
        targets:
          1:
            - b
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 8
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b:
            hp: 6
          P2.leader.life: 20
          P1.ex:
            - new-1
            - new-2
          P1.ex.new-1:
            card: BP16-T15
          P1.ex.new-2:
            card: BP16-T15
        events:
          - kind: 移動
            object: new-1
            card: BP16-T15
            to: P1.ex
            source: g
            group: create-coins
          - kind: 移動
            object: new-2
            card: BP16-T15
            to: P1.ex
            source: g
            group: create-coins
          - kind: 待機
            ability:
              source: a
              line: 1
            event:
              entered_ex: new-1
            group: coin-triggers
          - kind: 待機
            ability:
              source: a
              line: 1
            event:
              entered_ex: new-2
            group: coin-triggers
        events_exact:
          - 待機
        forbidden_events:
          - kind: 場に出す
            object: new-1
          - kind: 場に出す
            object: new-2
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P2.field: []
          P2.cemetery:
            - b
          P2.leader.life: 18
          semantic_state.pending_triggers: []
