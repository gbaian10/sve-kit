schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: card-BP19-042
kind: card
must_pass: true
mechanisms:
  - 融合
  - 手牌、墓場中有效的能力
  - 10.6.2.5
cards:
  - BP01-173
  - BP19-042
  - BP21-T11
why: 融合從手牌起動，材料可來自手牌或 EX；EX 送墓不是捨棄；token 不合格或來源無法進 EX 則回溯。
discriminates: 場上起動、忽略材料條件、部分付費或 EX 送墓當捨棄都可區分。
refs:
  rules:
    - 12.18.2
    - 10.4.2.2
    - 10.6.2.5.4
  qa:
    - Q2575
evidence:
  - ref: Q2575
    quote: はい。『忘我の才媛』が手札にある場合に有効となる能力です。
  - ref: cr 12.18.2
    quote: "‘《起動》 【融合】 （条件）：（効果）’は‘《起動》\n（条件）を満たす他のカードを、手札から捨てるか\nEX エリアから墓場に置く。手札にあるこのカードを\nEX エリアに置く。：（効果）’を意味します。"
    derivation:
      - 融合從手牌起動，材料可來自手牌或 EX；EX 送墓不是捨棄；token 不合格或來源無法進 EX 則回溯。
  - ref: cr 10.4.2.2
    quote: "コストのうち一部または全部を支払うことが\n不可能である場合、このコストはまったく支払\nうことはできません。"
    derivation:
      - 融合從手牌起動，材料可來自手牌或 EX；EX 送墓不是捨棄；token 不合格或來源無法進 EX 則回溯。
  - ref: cr 10.6.2.5.4
    quote: "なんらかの理由でこの時点でこのコス\nトを支払うことができない場合、このカード\nや能力のプレイは取り消され、ゲームはこ\nのカードや能力をプレイすることを選択する\n前まで戻されます。"
    derivation:
      - 融合從手牌起動，材料可來自手牌或 EX；EX 送墓不是捨棄；token 不合格或來源無法進 EX 則回溯。
  - ref: cr 12.18.2
    quote: "‘《起動》 【融合】 （条件）：（効果）’は‘《起動》\n（条件）を満たす他のカードを、手札から捨てるか\nEX エリアから墓場に置く。手札にあるこのカードを\nEX エリアに置く。：（効果）’を意味します。"
    derivation:
      - EX 材料 b 送墓；來源 a 由手牌移到 EX。a 不可能同時留在手牌，故手牌為空。
status: draft
