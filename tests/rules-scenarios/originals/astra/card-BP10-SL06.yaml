why: 兩次擲骰是同一能力，第一次令對手零生命也必須做第二次，結算後才判敗北。
discriminates: 第一次零血就停會把 [3,5] 判 P1 勝而不是同時敗北和局。
refs:
  rules:
    - 11.2.1
    - 1.2.2
    - 10.6.2.8.2
  qa:
    - Q1278
evidence:
  - ref: Q1278
    quote: いいえ。1回目のサイコロで相手のリーダーの体力が0になった場合でも、その時点でバトルに勝利することはなく、もう1回サイコロをふります。『《暴走》する戦車・オルオーン』の能力の解決が終わった後のチェックタイミングの際に、自身のリーダーの体力が0以下のプレイヤーはバトルに敗北します。（自分のリーダーと相手のリーダーの体力がともに0以下の場合、引き分けとなります。）
  - ref: cr 11.2.1
    quote: "自身のリーダーの体力が 0 以下であるプレイヤー\nがいる場合、そのプレイヤーはこのゲームに敗北し\nます。"
    derivation:
      - 兩次擲骰是同一能力，第一次令對手零生命也必須做第二次，結算後才判敗北。
  - ref: cr 1.2.2
    quote: "すべてのプレイヤーが同時に敗北する場合、その\nゲームは引き分けになります。"
    derivation:
      - 兩次擲骰是同一能力，第一次令對手零生命也必須做第二次，結算後才判敗北。
  - ref: cr 10.6.2.8.2
    quote: "プレイしたのがスペルや起動能力や\n自動能力である場合、そのテキストや能力\nに示された効果を、表記の順に従って実行\nします。"
    derivation:
      - 兩次擲骰是同一能力，第一次令對手零生命也必須做第二次，結算後才判敗北。
