id: card-BP17-067
kind: card
must_pass: true
mechanisms:
  - 5.5.3
  - 10.6.2.8.1
cards:
  - BP01-173
  - BP17-067
why: 同一張シャークウォーリアー從 EX 打出才有入場曲 2 傷害；經解決領域不覆蓋規則來源。
discriminates: 若一律記為 resolution，EX 分支不扣血；若一律給加成，手牌分支錯成體力 1。
refs:
  rules:
    - 5.5.3
    - 10.6.2.8.1
  qa: []
evidence:
  - ref: cr 5.5.3
    quote: カードが‘（領域）から場に出る’ことを参照する場合、それはそのカードがその領域から直接場に出ること、およびそのカードがその領域からプレイされた後解決領域で解決されて場に出ることの両方を参照します。同様に、カードが‘（領域）以外から場に出る’ことを参照する場合、それはそのカードがその領域でも解決領域でもない領域から直接場に出ること、およびそのカードがその領域以外の領域からプレイされた後解決領域で解決されて場に出ることの両方を参照します。
  - ref: cr 10.6.2.8.1
    quote: プレイしたカードがフォロワーやアミュレットであり、自分の場のカードの枚数がその上限未満である場合、それを自分の場に移動します。
  - ref: BP17-067
    quote: "{進化}{コスト1}：これは進化する。\n{ファンファーレ}相手の場のフォロワー1体を選ぶ。これがEXエリアからプレイされていたなら、それに2ダメージ。"
status: draft
author: astra
verified_by: []
