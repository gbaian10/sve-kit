schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: rule-13.2.1.3-01
kind: rule
must_pass: true
mechanisms:
  - 13.2.1.1
  - 13.2.1.3
  - 10.3.4
  - 9.1.4.4
cards:
  - BP01-173
  - BP11-P31
  - BP19-007
  - BP19-009
why: 看守從手牌起動、場上乗物起動都不是打出卡；從EX打出乗物才+1，即使起動後token消去仍保留本回合打出數。
discriminates: 把起動能力算卡會使第一分支3、乗物分支3或4；只數目前存在的卡會在乗物消去後減回2。
refs:
  rules:
    - 13.2.1.1
    - 13.2.1.3
    - 10.3.4
    - 9.1.4.4
  qa:
    - Q2556
evidence:
  - ref: cr 13.2.1.1
    quote: コンボは、このターン中にプレイしていたカードの枚数を条件とする特定表記です。
  - ref: cr 13.2.1.3
    quote: このプレイしていた枚数ではあらゆる領域からプレイされていたカードを、カードがトークンであるか否かに関係なく数えます。
  - ref: cr 10.3.4
    quote: 特定の領域で処理することが明確である効果は、その領域でのみ有効です。
  - ref: cr 9.1.4.4
    quote: あるトークンが存在できる領域以外の領域に移動した場合、その移動を行った直後に、その領域で消去されます。この処理はチェックタイミングを待たず、なんらかの効果の途中で移動を行った場合は、その移動の続きを行うよりも前に実行されます。
  - ref: Q2556
    quote: はい。手札にある場合に有効となる能力です。
  - ref: BP19-007
    quote: "【守護】\n{ファンファーレ}/{ラストワード}相手のリーダーすべてに3ダメージ。\n{起動}手札のこれを捨てる：自分の場の八獄・フォロワー1体を選ぶ。それを破壊する。相手のリーダーすべてに1ダメージ。1枚引く。"
  - ref: BP11-P31
    quote: '{起動}これを墓場に置く：自分の場のフォロワー1体を選ぶ。それが荒野・フォロワーなら、それは{攻撃力}+1/{体力}+1する。'
status: draft
author: astra
verified_by: []
scenarios:
  - name: 芳気の看守手牌起動不加コンボ
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: explicit
      players:
        P1:
          construction: class
          leader:
            class: エルフ
            life: 20
          pp:
            current: 10
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - id: d
                card: BP01-173
              - filler: 20
            hand:
              - id: a
                card: BP19-007
            field:
              - id: target
                card: BP19-009
        P2:
          construction: class
          leader:
            class: ロイヤル
            life: 20
          pp:
            current: 0
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
      semantic_state:
        counters_this_turn:
          P1.cards_played: 2
    decisions:
      - n: 1
        by: P1
        at: main
        do: activate
        ability:
          source: a
          line: 3
        targets:
          1:
            - target
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.hand:
            - d
          P1.cemetery:
            - a
            - target
          P2.leader.life: 19
          semantic_state.counters_this_turn.P1.cards_played: 2
        forbidden_events:
          - kind: プレイ
            object: a
