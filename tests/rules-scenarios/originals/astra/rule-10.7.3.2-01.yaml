schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: rule-10.7.3.2-01
kind: rule
must_pass: true
mechanisms:
  - 10.7.3.2
  - 10.5.2
cards:
  - BP01-173
  - BP19-078
why: 選到無目標的待機只取消一次，來源維持墓場；有目標時打出並造成傷害。
discriminates: 將取消當回溯死亡或留下無法結算的待機會使墓場或待機集合不符。
refs:
  rules:
    - 10.7.3.2
    - 10.6.2.3.3
  qa: []
evidence:
  - ref: cr 10.7.3.2
    quote: "なんらかの理由で、選んだ待機状態の自\n動能力がプレイできない場合、その待機状態\nは 1 回取り消されます。"
    derivation:
      - 選到無目標的待機只取消一次，來源維持墓場；有目標時打出並造成傷害。
  - ref: cr 10.6.2.3.3
    quote: "選ぶ数として指定された数が 1 以上\nで、かつその数の目標を選ぶことが不可能\nである場合、このカードや能力のプレイは\n不正で、このカードや能力はプレイできませ\nん。このカードや能力のプレイは取り消さ\nれ、ゲームはこのカードや能力をプレイする\nことを選択する前まで戻されます。"
    derivation:
      - 選到無目標的待機只取消一次，來源維持墓場；有目標時打出並造成傷害。
status: draft
author: astra
verified_by: []
