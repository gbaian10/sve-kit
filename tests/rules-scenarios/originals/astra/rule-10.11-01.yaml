                card: BP01-173
            field:
              - id: b
                card: BP18-073
                state:
                  hp: 1
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: s
        targets:
          1:
            - b
      - n: 2
        by: P2
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: b
            line: 2
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.field: []
          P2.cemetery:
            - b
          P2.deck:
            - d
            - x
