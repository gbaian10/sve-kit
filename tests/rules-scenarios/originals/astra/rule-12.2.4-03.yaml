schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a94d19a47fe673c5b2b03637988cb7acabeda88e09fde0c632
id: rule-12.2.4-03
kind: rule
must_pass: true
mechanisms:
  - 12.2.4
  - 5.16.1.1
  - 8.3.2.1
cards:
  - BP01-173
  - BP19-009
  - BP19-010
why: 同樣先攻第8回合且有SEP，若芽の組員由FF效果進化只成2/2且保留SEP；只有打出進化能力才能付SEP成3/3。
discriminates: 把任何進化都自動升為超進化會在自動分支錯扣SEP、錯加1/1；把自動進化占額度會錯計evolve_played。
refs:
  rules:
    - 12.2.4
    - 5.16.1.1
    - 8.3.2.1
  qa:
    - Q2558
evidence:
  - ref: cr 12.2.4
    quote: 進化能力をプレイする際、現在の経過ターン数（3.3）が、先攻プレイヤーであるなら 7 以上、後攻プレイヤーであるなら 6 以上の場合、そのプレイヤーは追加で SEP（3.2.6）を 1 点支払うことができます。そうした場合、通常の進化の処理（5.16）に加えて以下を追加で実行します。
  - ref: cr 5.16.1.1
    quote: この‘進化する’処理が進化能力（12.1.2.1）によるものである場合、そのコストとして公開したカードを指定するカードとします。そうでない場合、エボルヴデッキ置き場の裏向きのカードの中から適正なカードを 1 枚選択し、それを公開して指定します。
  - ref: cr 8.3.2.1
    quote: 起動能力を指定する際、それが進化能力または進化相当能力である場合、このターンにターンプレイヤーがいずれかの進化能力や進化相当能力をすでにプレイ済みである場合、その起動能力は指定できません。
  - ref: Q2558
    quote: "いいえ。1ターンに1回の回数に含まれません。\n進化前の『ゴブリン』が持っているような《進化》能力（進化することができる起動能力・「丸E」のアイコン）は1ターンに1回のみ使用することができます。それ以外の能力によって進化するものなどに、この制限はありません。"
  - ref: BP19-009
    quote: "{進化}{コスト2}：これは進化する。\n{ファンファーレ}【コンボ_3】これは進化する。"
status: draft
author: astra
verified_by: []
scenarios:
  - name: ファンファーレ自動進化
    setup:
      turn:
        active: P1
        first_player: P1
        elapsed_turns:
          P1: 8
          P2: 7
        phase: main
      history: explicit
      players:
        P1:
          construction: class
          leader:
            class: エルフ
            life: 20
          pp:
            current: 2
            max: 10
          ep: 0
          sep: 1
          zones:
            deck:
              - id: d0
                card: BP01-173
              - id: d1
                card: BP01-173
              - id: d2
                card: BP01-173
              - id: d3
                card: BP01-173
            field:
              - id: a
                card: BP19-009
            evolve_deck:
              - id: e
                card: BP19-010
        P2:
          construction: class
          leader:
            class: ロイヤル
            life: 20
          pp:
            current: 0
            max: 10
          ep: 0
          sep: 0
          zones:
            deck:
              - filler: 20
      semantic_state:
        counters_this_turn:
          P1.cards_played: 3
        pending_triggers:
          - id: t
            controller: P1
            ability:
              source: a
              line: 2
              keyword: ファンファーレ
            event:
              entered_field: a
    decisions:
      - n: 1
        by: P1
        at: check-timing
        do: choose-pending
        pending: t
      - n: 2
        by: P1
        at: resolve
        do: resolve-choice
        of:
          decision: 1
          occurrence: 1
        select:
          - e
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a:
            evolved: true
            evolved_with: e
            power: 2
            hp: 2
          P1.sep: 1
          P1.pp.current: 2
          semantic_state.counters_this_turn.P1.evolve_played: 0
          semantic_state.counters_this_turn.P1.evolutions: 1
          semantic_state.counters_this_turn.P1.cards_played: 3
