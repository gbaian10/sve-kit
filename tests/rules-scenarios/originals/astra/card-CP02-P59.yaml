id: card-CP02-P59
kind: card
must_pass: true
mechanisms:
  - 偶像大師：課程
  - token
  - 10.6.2.5
cards:
  - BP01-173
  - CP02-P59
  - PR-155
why: 課程費用消滅 EX 道具，token 隨即消去；缺 PP 或道具不可部分支付。PR-155 卡片頁的官方 Q&A Q897 已確認其對戰名稱為「魔法のアイテム」，依契約以 rules_name 記錄已驗證事實。
discriminates: 把展示名當規則名、把 token 留消滅區、或缺費用仍扣另一項，都可區分。
refs:
  rules:
    - 14.3.2.1
    - 9.1.4.4
    - 10.4.2.2
  qa:
    - Q897
evidence:
  - ref: Q897
    quote: はい。『キュートイヤリング』や『クールペンダント』など、様々なカードが存在しますが、これらはすべてバトル上『魔法のアイテム』という同一のカード名を持つカードであり、トークンです。（『キュートイヤリング』や『クールペンダント』などのトークンカードを組み合わせて使用しても問題ないです。）
  - ref: cr 14.3.2.1
    quote: "【レッスン （数値）】は、EX エリアの『魔法\nのアイテム』を（数値）枚消滅させることを意味\nする特定表記です。"
    derivation:
      - 課程費用消滅 EX 道具，token 隨即消去；缺 PP 或道具不可部分支付。PR-155 卡片頁的官方 Q&A Q897 已確認其對戰名稱為「魔法のアイテム」，依契約以 rules_name 記錄已驗證事實。
  - ref: cr 9.1.4.4
    quote: "あるトークンが存在できる領域以外の領域\nに移動した場合、その移動を行った直後に、そ\nの領域で消去されます。この処理はチェックタ\nイミングを待たず、なんらかの効果の途中で移\n動を行った場合は、その移動の続きを行うより\nも前に実行されます。"
    derivation:
      - 課程費用消滅 EX 道具，token 隨即消去；缺 PP 或道具不可部分支付。PR-155 卡片頁的官方 Q&A Q897 已確認其對戰名稱為「魔法のアイテム」，依契約以 rules_name 記錄已驗證事實。
  - ref: cr 10.4.2.2
    quote: "コストのうち一部または全部を支払うことが\n不可能である場合、このコストはまったく支払\nうことはできません。"
    derivation:
      - 課程費用消滅 EX 道具，token 隨即消去；缺 PP 或道具不可部分支付。PR-155 卡片頁的官方 Q&A Q897 已確認其對戰名稱為「魔法のアイテム」，依契約以 rules_name 記錄已驗證事實。
