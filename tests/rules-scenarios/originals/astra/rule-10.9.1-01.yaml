id: rule-10.9.1-01
kind: rule
must_pass: true
mechanisms:
  - 持續效果與禁止
  - 必殺
cards:
  - BP01-176
  - BP17-077
  - BP17-P18
why: ニコラ的必殺由其他機械持續給予，交戰時按當下場面判定。來源攻擊者死亡不撤掉已確定的必殺規則破壞。
discriminates: 只解析印刷關鍵字會在有機械分支留下 b。
refs:
  rules:
    - 10.9.1
    - 12.14.2
  qa:
    - Q2252
evidence:
  - ref: Q2252
    quote: "はい。永続能力です。自分の場に他の機械・フォロワーがいる限り、『永続の機構・ニコラ』は【突進】と【必殺】を持ちます。\n『永続の機構・ニコラ』を場に出した後に自分の場に他の機械・フォロワーを出した場合、【突進】と【必殺】を持ちます。\n『永続の機構・ニコラ』を場に出した後に自分の場の他の機械・フォロワーが0体になった場合、【突進】と【必殺】を失います。"
  - ref: cr 10.9.1
    quote: "なんらかの継続効果が存在する状態でカードの情\n報が求められる場合、以下の順でその情報に対す\nる継続効果を適用します。"
    derivation:
      - ニコラ的必殺由其他機械持續給予，交戰時按當下場面判定。來源攻擊者死亡不撤掉已確定的必殺規則破壞。
  - ref: cr 12.14.2
    quote: "‘【必殺】’は‘このフォロワーと交戦したフォロ\nワーは、次のルール処理で破壊される’を意味しま\nす。"
    derivation:
      - ニコラ的必殺由其他機械持續給予，交戰時按當下場面判定。來源攻擊者死亡不撤掉已確定的必殺規則破壞。
