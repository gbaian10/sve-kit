  - 持續效果與禁止
cards:
  - BP01-173
  - BP05-092
  - BP20-073
why: 禁止敗北使零生命可先處理護り手；兩張都已待機，第一張設成 1 也不取消第二張。
discriminates: 直接敗北或狀態恢復就清空剩餘待機會產生不同勝負或場上護符。
refs:
  rules:
    - 1.3.3
    - 10.7.6.1
    - 10.7.7
  qa:
    - Q750
evidence:
  - ref: Q750
    quote: いいえ。その場合、このアミュレットを2枚とも墓場に置き、自分のリーダーの体力は1になります。（それぞれ1枚ずつ、誘発した能力を解決します。）
  - ref: cr 1.3.3
    quote: "あるカードの効果によりプレイヤーがなんらかの行\n動を行うよう指示された場合に、同時にその行動を\n禁止する効果が発生している場合、常に禁止する\n効果が優先されます。"
    derivation:
      - 禁止敗北使零生命可先處理護り手；兩張都已待機，第一張設成 1 也不取消第二張。
  - ref: cr 10.7.6.1
    quote: "状態誘発は、その状態が発生したときに\n1 度だけ待機状態になります。この自動能力\nが解決された後、再びその自動能力の誘発条\n件が満たされている場合、その能力は再度待\n機状態になります。"
    derivation:
      - 禁止敗北使零生命可先處理護り手；兩張都已待機，第一張設成 1 也不取消第二張。
  - ref: cr 10.7.7
    quote: "待機状態の自動能力のプレイ時に、その自動能\n力を有していたカードの領域が変わっていた場合で\nも、その自動能力はプレイする義務があります。"
    derivation:
      - 禁止敗北使零生命可先處理護り手；兩張都已待機，第一張設成 1 也不取消第二張。
