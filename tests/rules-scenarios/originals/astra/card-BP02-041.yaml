id: card-BP02-041
kind: card
must_pass: true
mechanisms:
  - 法術鏈、死靈充能
  - 取代效果
cards:
  - BP01-170
  - BP01-173
  - BP02-041
why: SC 數墓場法術張數，非不同名；自身仍在解決領域，不補成第 10 張。
discriminates: 去重同名會讓 10 張分支回手；把自己算入會讓 9 張分支置頂。
refs:
  rules:
    - 13.3.1.2
    - 13.3.1.3
    - 13.3.1.4
    - 10.10.2.5.1
  qa: []
evidence:
  - ref: cr 13.3.1.2
    quote: "‘【スペルチェイン （数値）】（テキスト）’ま\nたは‘【SC （数値）】（テキスト）’は‘あなたの\n墓場のスペルが（数値）枚以上である場合、\n（テキスト）’を意味します。"
    derivation:
      - SC 數墓場法術張數，非不同名；自身仍在解決領域，不補成第 10 張。
  - ref: cr 13.3.1.3
    quote: "このカード自身の解決中はこのカードはま\nだ解決領域にあるため、このカードは自身の\n墓場のスペルの枚数に数えません。"
    derivation:
      - SC 數墓場法術張數，非不同名；自身仍在解決領域，不補成第 10 張。
  - ref: cr 13.3.1.4
    quote: "スペルチェインが参照する墓場のスペルの\n枚数は、原則としてそのスペルチェインを含む\n効果の解決の開始時点で固定され、その解決\n中にカードの枚数が変わっても変更されませ\nん。"
    derivation:
      - SC 數墓場法術張數，非不同名；自身仍在解決領域，不補成第 10 張。
  - ref: cr 10.10.2.5.1
    quote: "置換効果を適用する際、その中に自\n己置換効果が存在する場合、自己置換で\nあるものを先に適用します。"
    derivation:
      - SC 數墓場法術張數，非不同名；自身仍在解決領域，不補成第 10 張。
