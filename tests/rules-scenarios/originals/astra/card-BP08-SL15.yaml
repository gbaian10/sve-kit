          zones:
            deck:
              - filler: 20
    decisions:
      - n: 1
        by: P1
        at: main
        do: play
        card: a
      - n: 2
        by: P1
        at: check-timing
        do: choose-pending
        pending:
          ability:
            source: a
            line: 1
      - n: 3
        by: P1
        at: resolve
        do: resolve-choice
        of:
          decision: 2
          occurrence: 1
        select: []
      - n: 4
        by: P1
        at: resolve
        do: resolve-choice
        of:
          decision: 2
          occurrence: 2
        order:
          - r
          - c
          - l
          - x0
          - x1
          - x2
          - x3
    random: {}
    expected:
