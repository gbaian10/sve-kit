id: card-BP08-SL15
kind: card
must_pass: false
mechanisms:
  - 查看牌庫上方多步驟
  - 10.7.4
  - 10.5.2
cards:
  - BP01-173
  - BP01-P25
  - BP05-SL14
  - BP08-SL15
  - BP19-078
why: 先完成選出多張、剩餘置底、破壞剛出的從者；所有入場曲與謝幕曲都等原能力结束。
discriminates: 每出一張就先結算會讓生命、場、墓場或待機集合不符。
refs:
  rules:
    - 10.7.1
    - 10.6.2.8.2
  qa:
    - Q1100
evidence:
  - ref: Q1100
    quote: "任意の順番で解決することができます。\nまず『ネフティス』の《ファンファーレ》能力の解決を行います。その後、場に出て破壊されたフォロワーの《ファンファーレ》能力や《ラストワード》能力などの誘発条件を満たし待機状態となった能力の中からどれを先に解決するか選択することができます。"
  - ref: cr 10.7.1
    quote: "自動能力とは、特定の誘発条件が発生したとき\nに、その後に発生したチェックタイミングでプレイされ\nる能力を指します。"
    derivation:
      - 先完成選出多張、剩餘置底、破壞剛出的從者；所有入場曲與謝幕曲都等原能力结束。
  - ref: cr 10.6.2.8.2
    quote: "プレイしたのがスペルや起動能力や\n自動能力である場合、そのテキストや能力\nに示された効果を、表記の順に従って実行\nします。"
    derivation:
      - 先完成選出多張、剩餘置底、破壞剛出的從者；所有入場曲與謝幕曲都等原能力结束。
