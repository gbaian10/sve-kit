schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP05-057
kind: card
must_pass: true
mechanisms: [動態數值, '10.11', 10.4.6, 持續效果與禁止, 費用中的選擇]
cards: [BP05-057, BP01-173, BP06-072, BP01-176]
why: >-
  ゴッドバレットゴーレム「{起動}これを{アクト}場の他のフォロワー1体を墓場に置く：…それに「墓場に置いたフォロワーの攻撃力」と同じダメージ」：
  傷害值是被當費用送進墓場那隻的**攻擊力**，含當時套用中的增減（Q716）；它已離場，所以用最終情報（10.11.1，離場前的攻擊力）。
  「これは相手のリーダーを攻撃できない」不影響用能力對リーダー造成傷害。
discriminates: >-
  用卡面攻擊力（2）而不是含 +2 的 4 的引擎，P2 體力 18 而非 16；離場後查不到攻擊力而算成 0（1.3.2.2 → 不造成傷害）的引擎也可觀察。
refs:
  rules: [10.11.1, 10.4.6, 10.4.6.1, '5.29', 4.1.4, 10.9.1.4]
  qa: [Q716, Q713]
evidence:
  - ref: Q716
    quote: はい。増減された攻撃力と同じダメージを与えます。
  - ref: cr 10.11.1
    quote: ある効果が特定のカードの情報や配置状態を参照している場合、その効果の実行時にそのカードがその領域から、場から場への移動以外の移動を行っていた場合、その効果は、そのカードが最後にその領域にあったときの情報や配置状態を参照します。
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 用 +2 後攻擊力 4 的ファイター付費 → 對リーダー 4 傷害
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 7, P2: 6}, phase: main}
      history: explicit
      semantic_state:
        continuous_effects:
          - {id: e1, source: a9, text: 'それは{攻撃力}+2する', applies_to: [a2], until: game, order: 1}
      players:
        P1:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 1, max: 7}
          zones:
            field:
              - {id: a1, card: BP05-057}                             # ゴッドバレットゴーレム 7/7
              - {id: a2, card: BP01-173, state: {power: 4, hp: 3}}   # ファイター 2/3 +2
            cemetery:
              - {id: a9, card: BP06-072}                             # 武力炎翔（e1 的來源）
            hand:
              - {filler: 2}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 6}
          zones:
            field:
              - {id: b1, card: BP01-176}                             # 天剣の乙女 4/6
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: activate, ability: {source: a1, line: 2}, costs: {1: [a2]}, targets: {1: [P2.leader]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.field: [a1]
          P1.field.a1: {acted: true}
          P1.cemetery: [a9, a2]
          P2.leader.life: 16
        events:
          - {kind: アクト, object: a1}
          - {kind: 移動, object: a2, from: P1.field, to: P1.cemetery}
          - {kind: ダメージ, source: a1, target: P2.leader, amount: 4}

  - name: B 目標改為從者：天剣の乙女受 4
    inherit: A 用 +2 後攻擊力 4 的ファイター付費 → 對リーダー 4 傷害
    decisions:
      - {n: 1, by: P1, at: main, do: activate, ability: {source: a1, line: 2}, costs: {1: [a2]}, targets: {1: [b1]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b1: {hp: 2}
          P2.leader.life: 20
        events:
          - {kind: ダメージ, source: a1, target: b1, amount: 4}
