schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP11-P30
kind: card
must_pass: true
mechanisms: [封箱、操縱、變成種類, '5.32', '12.10', 8.4.2.1, 費用中的選擇, 攻撃時目標被破壞後不交戰]
cards: [BP11-P30, BP01-176, SD02-002, BP01-173]
why: >-
  魔導列車「{起動}{コスト1}場のフォロワーを元のコストの合計が5以上になるように好きな枚数{アクト}：これを操縦する」：操縦＝本回合變成卡面 4/5 的從者（5.32.1）；
  【突進】；【攻撃時】破壞アクト狀態的對手從者並 +2。Q1581：從回合開始就在場的護符操縦後可攻擊リーダー；本回合才進場的只能靠突進攻擊アクト狀態的從者。
  攻撃時把目標破壞後，8.4.9 沒有目標 → 不交戰，列車保持アクト。
discriminates: >-
  操縦後仍當護符（不能攻擊）的引擎 A 會 cannot-attack；沒實作「本回合進場不能攻擊リーダー」的引擎 B 的 after-decision-2 會 resolved；
  攻撃時破壞目標後仍讓目標對列車造成交戰傷害的引擎，列車體力不是 5。
refs:
  rules: [5.32.1, 10.4.2.1, 12.10.2, 8.4.2.1, 8.4.3.1, 8.4.9, 12.7.2, 5.6.1]
  qa: [Q1581, Q1584]
evidence:
  - ref: Q1581
    quote: >-
      「これを操縦する。」とは、そのターン、それをカードに記載されている攻撃力と体力を持つフォロワーにすることを意味します。「これは操縦する。」を持つカードが場に出たターンに操縦してフォロワーになった場合、通常のフォロワーと同様に、そのターンは相手を攻撃することができません。
      （…【突進】を持っている場合、相手のアクト状態のフォロワーに攻撃できます。）場に出たターンの次のターン以降に操縦してフォロワーになった場合は、相手を攻撃することができます。
  - ref: cr 8.4.9
    quote: この時点で攻撃フォロワーが場に存在する場合、攻撃フォロワーはその攻撃力に等しいダメージを攻撃目標に与えます。
    derivation:
      - 攻擊目標在 8.4.6 的檢查時點已被破壞 → 8.4.9 沒有目標可給傷害、也沒有 8.4.9.1 的反擊
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 回合開始就在場的列車：操縦 → 攻擊アクト從者 → 攻撃時破壞它並 +2 → 不交戰
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 6, P2: 5}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ナイトメア, life: 18}
          pp: {current: 2, max: 6}
          zones:
            field:
              - {id: a1, card: BP11-P30}          # 魔導列車（アミュレット・トークン）
              - {id: a2, card: BP01-176}          # 天剣の乙女（元のコスト5）
              - {id: a3, card: SD02-002}          # ヴァンガード・レイサム（元のコスト2）
            hand:
              - {filler: 2}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 6}
          zones:
            field:
              - {id: b1, card: BP01-173, state: {acted: true}}   # ファイター アクト
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: activate, ability: {source: a1, line: 1}, costs: {1: [a2]}}
      - {n: 2, by: P1, at: main, do: attack, attacker: a1, target: b1}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 3}}, targets: {1: [b1]}}
      - {n: 4, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 1
          P1.field.a2: {acted: true}
          P1.field.a3: {acted: false}
          P1.field.a1: {power: 4, hp: 5}
        events:
          - {kind: アクト, object: a2}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P2.field: []
          P1.leader.life: 20
          P1.field.a1: {acted: true, hp: 5}
        events:
          - {kind: 攻撃, attacker: a1, target: b1}
          - {kind: 破壊, object: b1}
          - {kind: 体力増加, target: P1.leader, amount: 2}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a1: {acted: true, hp: 5}
        forbidden_events:
          - {kind: ダメージ}

  - name: B 本回合進場的列車：操縦後不能攻擊リーダー，突進可攻擊アクト從者
    inherit: A 回合開始就在場的列車：操縦 → 攻擊アクト從者 → 攻撃時破壞它並 +2 → 不交戰
    setup:
      players:
        P1:
          zones:
            field:
              - {id: a1, card: BP11-P30, state: {entered_this_turn: true}}
              - {id: a2, card: BP01-176}
              - {id: a3, card: SD02-002}
    decisions:
      - {n: 1, by: P1, at: main, do: activate, ability: {source: a1, line: 1}, costs: {1: [a2]}}
      - {n: 2, by: P1, at: main, do: attack, attacker: a1, target: P2.leader}
      - {n: 3, by: P1, at: main, do: attack, attacker: a1, target: b1}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: cannot-attack
        assert:
          P1.field.a1: {acted: false}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, line: 3}}}
        assert:
          P1.field.a1: {acted: true}
