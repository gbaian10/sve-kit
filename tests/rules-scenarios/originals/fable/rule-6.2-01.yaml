schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: rule-6.2-01
kind: rule
must_pass: true
mechanisms: [6.2.1, 6.2.1.6, 6.2.1.8, 6.2.1.10, 7.2.4.1, 14.4.3, 14.3.1.2, 開局程序, Vanguard：起始護符, 偶像大師：魔法のアイテム]
cards: [CP03-010, CP03-021, CP03-127, BP01-173, BP01-176, ECP02-013, ECP02-008]
why: >-
  契約 9.13 的開局程序。Vanguard 作品構築：把デッキ放到デッキ置き場（6.2.1.4）之前先從牌組選 1 張【スタートアミュレット】裏向き放到場上（14.4.3.1）；
  隨機決定一人選先後（6.2.1.6）；各抽 4 張（6.2.1.7）；先攻先決定是否換牌：把手牌以任意順序放到牌庫底再抽 4（6.2.1.8，只能一次）；
  PP 與 PP 最大值 0（6.2.1.9）；先攻 EP 0、後攻 EP 3（6.2.1.10）；SEP 1（6.2.1.11）；體力 20（6.2.1.12）；換牌後起始護符翻成表向き（14.4.3.2）；
  先攻的第 1 回合開始階段 PP 最大值 +1、PP 補滿，但不抽牌（7.2.4.1）。偶像大師作品構築在決定先後之前把 5 個『魔法のアイテム』放到 EX（14.3.1.2）。
discriminates: >-
  A：換牌時把手牌放到牌庫頂、或放底順序與 order 相反的引擎，P1 牌庫尾端順序不同；先攻第 1 回合抽牌的引擎 P2 手牌 5 張；EP 給反的引擎 P1.ep 不是 3。
  B：選後攻的一方變成先攻的引擎 turn.active 不對。C：沒放『魔法のアイテム』或放錯數量的引擎 P1.ex_count 不是 5。
refs:
  rules: [6.2.1.4, 6.2.1.6, 6.2.1.7, 6.2.1.8, 6.2.1.9, 6.2.1.10, 6.2.1.11, 6.2.1.12, 6.2.1.13, 6.2.1.14, 7.2.1, 7.2.2, 7.2.4.1, 3.3.2, 14.4.3.1, 14.4.3.2, 14.3.1.2]
  qa: []
evidence:
  - ref: cr 6.2.1.8
    quote: 先攻プレイヤーから順に各プレイヤーは、望むのであれば自分の手札のカードを任意の順で自分のメインデッキの一番下に移動し、自分のデッキの一番上から 4 枚のカードを自分の手札に移動することができます。これは各プレイヤーが 1 回ずつのみ実行できます。
    derivation:
      - 契約 9.8：order 列表由前到後＝放完後由上到下 → 牌庫底四張的相對順序＝order
      - 換牌與開局發牌（6.2.1.7）都是「移動」，不是「引く」；先攻第 1 回合不抽牌（7.2.4.1）→ 整段沒有任何 引く 事件
  - ref: cr 6.2.1.10
    quote: 先攻プレイヤーの EP を 0 に、後攻プレイヤーの EP を 3 にします。
  - ref: cr 7.2.4.1
    quote: 先攻プレイヤーは、自身の最初のターンではカードを引きません。
  - ref: cr 14.4.3.1
    quote: このタイトルを基準としてデッキを構築する場合、ゲーム前の手順（6.2）において、自身のメインデッキをデッキ置き場に置く（6.2.1.4）直前に、各プレイヤーは自身のデッキから【スタートアミュレット】能力を持つカードを 1 枚裏向きで場に出す必要があります。
  - ref: cr 14.3.1.2
    quote: ゲームの準備中、自身のデッキが‘アイドルマスター シンデレラガールズ’のタイトルを基準としたデッキ（6.1.1.5.2）であるプレイヤーは、先攻プレイヤーの決定（6.2.1.6）の直前に、自身の EX エリアに『魔法のアイテム』トークンを 5 つ置きます。
  - ref: cr 3.3.2
    quote: あるプレイヤーの経過ターン数を参照する場合、そのプレイヤーがターンプレイヤーとして、そのターンに初めてスタートフェイズ（7.2）を開始した回数を参照します。
    derivation:
      - 先攻第 1 回合的第一個輸入點：先攻經過回合數 1、後攻 0
status: draft
author: fable
verified_by: []

scenarios:
  - name: A Vanguard 起始護符；P2 被隨機選中並選先攻；P2 不換牌、P1 換牌 → 先攻第 1 回合不抽牌
    setup:
      pregame: true
      players:
        P1:
          construction: title
          title: カードファイト!! ヴァンガード
          leader: {class: エルフ}
          deck_list:
            - {id: a1, card: CP03-010}
            - {id: a2, card: CP03-010}
            - {id: a3, card: CP03-010}
            - {id: a4, card: CP03-010}
            - {id: a5, card: CP03-010}
            - {id: a6, card: CP03-010}
            - {id: a7, card: CP03-021}          # 士官候補生 エリック【スタートアミュレット】
            - {id: a8, card: CP03-010}
            - {id: a9, card: CP03-010}
            - {id: a10, card: CP03-010}
            - {id: a11, card: CP03-010}
            - {id: a12, card: CP03-010}
            - {filler: 28}
          evolve_deck_list:
            - {id: ev1, card: CP03-127}
        P2:
          construction: class
          leader: {class: ロイヤル}
          deck_list:
            - {id: b1, card: BP01-173}
            - {id: b2, card: BP01-176}
            - {id: b3, card: BP01-173}
            - {id: b4, card: BP01-176}
            - {id: b5, card: BP01-173}
            - {id: b6, card: BP01-176}
            - {id: b7, card: BP01-173}
            - {id: b8, card: BP01-176}
            - {filler: 32}
    decisions:
      - {n: 1, by: P1, at: pregame, do: choose-start-amulet, object: a7}
      - {n: 2, by: P2, at: pregame, do: choose-first, first: P2}
      - {n: 3, by: P2, at: pregame, do: mulligan, redo: false}
      - {n: 4, by: P1, at: pregame, do: mulligan, redo: true, order: [a3, a1, a4, a2]}
    random:
      first_chooser: P2
      shuffles:
        # 14.4.3.1：a7 在洗牌前已離開牌組
        - {player: P1, zone: deck, result: [a1, a2, a3, a4, a5, a6, a8, a9, a10, a11, a12, filler: 28]}
        - {player: P2, zone: deck, result: [b1, b2, b3, b4, b5, b6, b7, b8, filler: 32]}
    expected:
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          turn: {active: P2, first_player: P2, phase: main}
          turn.elapsed_turns.P2: 1
          turn.elapsed_turns.P1: 0
          P2.pp: {current: 1, max: 1}
          P1.pp: {current: 0, max: 0}
          P2.ep: 0
          P1.ep: 3
          P1.sep: 1
          P2.sep: 1
          P1.leader.life: 20
          P2.leader.life: 20
          P1.field: [a7]
          P1.evolve_deck: [ev1]
          P1.hand: [a5, a6, a8, a9]
          P1.deck: [a10, a11, a12, filler: 28, a3, a1, a4, a2]
          P2.hand: [b1, b2, b3, b4]
          P2.deck: [b5, b6, b7, b8, filler: 32]
          P1.ex: []
          P2.ex: []
        events:
          - {kind: 場に出す, object: a7, from: P1.deck}
          - {kind: 移動, object: a3, from: P1.hand, to: P1.deck, position: bottom}
          # 6.2.1.8 換牌是「手札に移動」不是 5.10 的「引く」（契約 10.9；互驗第二輪修正，astra）
          - {kind: 移動, object: a5, from: P1.deck, to: P1.hand}
        forbidden_events:
          - {kind: 引く}

  - name: B P2 選後攻 → P1 先攻：P1 不換牌、P2 換牌；P1 EP 0、P2 EP 3
    inherit: A Vanguard 起始護符；P2 被隨機選中並選先攻；P2 不換牌、P1 換牌 → 先攻第 1 回合不抽牌
    decisions:
      - {n: 1, by: P1, at: pregame, do: choose-start-amulet, object: a7}
      - {n: 2, by: P2, at: pregame, do: choose-first, first: P1}
      - {n: 3, by: P1, at: pregame, do: mulligan, redo: false}
      - {n: 4, by: P2, at: pregame, do: mulligan, redo: true, order: [b2, b1, b4, b3]}
    random:
      first_chooser: P2
      shuffles:
        - {player: P1, zone: deck, result: [a1, a2, a3, a4, a5, a6, a8, a9, a10, a11, a12, filler: 28]}
        - {player: P2, zone: deck, result: [b1, b2, b3, b4, b5, b6, b7, b8, filler: 32]}
    expected:
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          turn: {active: P1, first_player: P1, phase: main}
          turn.elapsed_turns.P1: 1
          turn.elapsed_turns.P2: 0
          P1.pp: {current: 1, max: 1}
          P2.pp: {current: 0, max: 0}
          P1.ep: 0
          P2.ep: 3
          P1.field: [a7]
          P1.hand: [a1, a2, a3, a4]
          P1.deck: [a5, a6, a8, a9, a10, a11, a12, filler: 28]
          P2.hand: [b5, b6, b7, b8]
          P2.deck: [filler: 32, b2, b1, b4, b3]
        forbidden_events:
          - {kind: 引く}

  - name: C 偶像大師作品構築：決定先後之前 EX 放 5 個『魔法のアイテム』
    setup:
      pregame: true
      players:
        P1:
          construction: title
          title: アイドルマスター シンデレラガールズ
          leader: {class: ロイヤル}
          deck_list:
            - {id: c1, card: ECP02-013}
            - {id: c2, card: ECP02-013}
            - {id: c3, card: ECP02-013}
            - {id: c4, card: ECP02-013}
            - {id: c5, card: ECP02-008}
            - {id: c6, card: ECP02-008}
            - {id: c7, card: ECP02-008}
            - {id: c8, card: ECP02-008}
            - {filler: 32}
        P2:
          construction: class
          leader: {class: ロイヤル}
          deck_list:
            - {id: b1, card: BP01-173}
            - {id: b2, card: BP01-176}
            - {id: b3, card: BP01-173}
            - {id: b4, card: BP01-176}
            - {id: b5, card: BP01-173}
            - {id: b6, card: BP01-176}
            - {id: b7, card: BP01-173}
            - {id: b8, card: BP01-176}
            - {filler: 32}
    decisions:
      - {n: 1, by: P1, at: pregame, do: choose-first, first: P1}
      - {n: 2, by: P1, at: pregame, do: mulligan, redo: false}
      - {n: 3, by: P2, at: pregame, do: mulligan, redo: false}
    random:
      first_chooser: P1
      shuffles:
        - {player: P1, zone: deck, result: [c1, c2, c3, c4, c5, c6, c7, c8, filler: 32]}
        - {player: P2, zone: deck, result: [b1, b2, b3, b4, b5, b6, b7, b8, filler: 32]}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          turn: {active: P1, first_player: P1, phase: main}
          # 『魔法のアイテム』沒有卡號，依契約 9.13 用 new-n 引用；14.3.1.2 在 6.2.1.6 之前放置
          P1.ex: [new-1, new-2, new-3, new-4, new-5]
          P1.ex_count: 5
          P2.ex: []
          P2.ex_count: 0
          P1.hand: [c1, c2, c3, c4]
          P1.deck: [c5, c6, c7, c8, filler: 32]
          P1.field: []
          P1.ep: 0
          P2.ep: 3
