schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-ECP01-053
kind: card
must_pass: true
mechanisms: [開始階段不站起, 主要階段來臨時付費站起, 7.2.3, 7.3.1, 10.4.7.3, 回合特定時點, 結算時的可選費用]
cards: [ECP01-053, BP01-173]
why: >-
  〔月下の悪魔ちゃん♪〕メジロパーマー「これは自分のスタートフェイズにスタンドしない」與「自分のメインフェイズが来たとき、{コスト1}：これをスタンドする」。
  Q1854：開始階段的 PP 增加、回復、站起（パーマー 例外）、抽牌全部做完之後才是主要階段來臨（7.3.1 誘發）。
  「～とき、（コスト）：（効果）」是 10.4.7.3：結算時可以選擇付 1 PP 讓它站起，也可以不付（Q1855）。
  A：付費 → 站起、PP −1。B：不付 → 維持アクト、PP 不變。其他從者在開始階段照常站起。
discriminates: >-
  在開始階段把パーマー 一起站起的引擎：after-decision-2 的 a1 會是 acted false。把費用當成強制的引擎：B 不會提供 decline、或 PP 少 1。
  把費用當成打出費用（10.1.1.2.2，PP 不足就取消待機）而不是結算時可選的引擎：本題 PP 充足時結果相同，但 B 的事件會缺プレイ／解決。
refs:
  rules: [7.2.1, 7.2.2, 7.2.3, 7.2.4, 7.2.5, 7.3.1, 7.3.2, 10.4.7, 10.4.7.3, 10.7.1]
  qa: [Q1854, Q1855]
evidence:
  - ref: Q1854
    quote: はい。自分のスタートフェイズの後に訪れます。スタートフェイズにおける、PP最大値の増加とPPの回復、フォロワーをスタンドすること（『〔月下の悪魔ちゃん♪〕メジロパーマー』は能力によってスタートフェイズにスタンドしない）、カードを1枚引くことをすべて行った後に、自分のメインフェイズが訪れます。
  - ref: Q1855
    quote: いいえ。コスト1を支払わず、スタンドしない選択を行うことができます。
  - ref: cr 10.4.7.3
    quote: なんらかの自動能力において‘～とき、（処理）：（効果）’と書かれている場合、これはその自動能力を解決する際にその処理を実行することで、その効果を適用することを選択することができます。
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 對手結束回合 → 開始階段パーマー 不站起、其他從者站起 → 主要階段來臨 → 付 1 PP 站起
    setup:
      turn: {active: P2, first_player: P1, elapsed_turns: {P1: 3, P2: 3}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ビショップ, life: 20}
          pp: {current: 0, max: 3}
          zones:
            field:
              - {id: a1, card: ECP01-053, state: {acted: true}}   # メジロパーマー 2/1
              - {id: a2, card: BP01-173, state: {acted: true}}    # ファイター 2/3
            deck:
              - {id: d1, card: BP01-173}
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 3}
          zones:
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P2, at: main, do: end-phase}
      - {n: 2, by: P1, at: quick, do: pass}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 4}}}
      - {n: 4, by: P1, at: resolve, of: {decision: 3, occurrence: 1}, do: resolve-choice, choice: execute}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          turn: {active: P1, phase: main}
          turn.elapsed_turns.P1: 4
          P1.pp: {current: 4, max: 4}
          P1.field.a1: {acted: true}
          P1.field.a2: {acted: false}
          P1.hand: [d1]
        events:
          - {kind: スタンド, object: a2}
          - {kind: 引く, player: P1, object: d1}
        forbidden_events:
          - {kind: スタンド, object: a1}
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, line: 4}}}
      - at: after-decision-3
        view: omniscient
        outcome: paused
        assert:
          P1.pp.current: 4
          P1.field.a1: {acted: true}
        awaiting:
          by: P1
          choices:
            - {do: resolve-choice, choice: execute}
            - {do: resolve-choice, choice: decline}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 3
          P1.field.a1: {acted: false}
        events:
          - {kind: スタンド, object: a1}

  - name: B 主要階段來臨 → 不付費 → 維持アクト、PP 不變
    inherit: A 對手結束回合 → 開始階段パーマー 不站起、其他從者站起 → 主要階段來臨 → 付 1 PP 站起
    decisions:
      - {n: 1, by: P2, at: main, do: end-phase}
      - {n: 2, by: P1, at: quick, do: pass}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 4}}}
      - {n: 4, by: P1, at: resolve, of: {decision: 3, occurrence: 1}, do: resolve-choice, choice: decline}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a1: {acted: true}
          P1.field.a2: {acted: false}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 4
          P1.field.a1: {acted: true}
          semantic_state.pending_triggers: []
        events:
          - {kind: プレイ, ability: {source: a1, line: 4}}
          - {kind: 解決, ability: {source: a1, line: 4}}
        forbidden_events:
          - {kind: スタンド}
