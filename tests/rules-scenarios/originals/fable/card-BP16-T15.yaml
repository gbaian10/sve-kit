schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP16-T15
kind: card
must_pass: true
mechanisms: [EX 區打出, 10.3.4, 9.1.4.3, 9.1.4.4, 手牌、墓場中有效的能力, 0 費 token 法術, 費用中的選擇]
cards: [BP16-T15, BP01-173]
why: >-
  輝く金貨（EX 區的 0 費法術 token）「{起動}{コスト1}EXエリアのこれと『輝く金貨』2枚を消滅：自分のリーダーは{体力}+1する。1枚引く」：起動能力在 EX 區有效（10.3.4）；
  費用要消滅自己加另外 2 張，token 進消滅領域立即消去（9.1.4.3／9.1.4.4）。它也可以當 0 費法術打出，沒有本體效果、結算後進墓場並消去（Q1968）。只有 2 張時付不出費用。
discriminates: >-
  把 EX 區的起動能力當無效的引擎 A 會 cannot-activate；把 token 留在消滅領域或墓場的引擎會在 P1.banish／P1.cemetery 出現 token；
  C 中允許用不足的張數起動的引擎會 resolved。
refs:
  rules: [10.3.4, 8.3.1, 10.4.2.2, 9.1.4.3, 9.1.4.4, 8.2.1, 10.6.2.8.3]
  qa: [Q1968]
evidence:
  - ref: Q1968
    quote: はい。プレイすることができます。その場合、スペルとしての能力は持っていないので、特に何も起こらず、『輝く金貨』は墓場に置かれます。（『輝く金貨』はトークンなので、墓場に置かれた直後に消去されます。）
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 用 EX 的 3 張輝く金貨起動：消滅 3 張（消去）、+1、抽 1
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 4, P2: 3}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 1, max: 4}
          zones:
            ex:
              - {id: k1, card: BP16-T15}
              - {id: k2, card: BP16-T15}
              - {id: k3, card: BP16-T15}
            hand:
              - {filler: 2}
            deck:
              - {id: d1, card: BP01-173}
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 0, max: 4}
          zones:
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: activate, ability: {source: k1, line: 1}, costs: {1: [k2, k3]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P1.ex: []
          P1.banish: []
          P1.leader.life: 21
          P1.hand: [filler: 2, d1]
        events:
          - {kind: 消滅, object: k1}
          - {kind: 消去, object: k1}
          - {kind: 消滅, object: k2}
          - {kind: 消去, object: k2}
          - {kind: 体力増加, target: P1.leader, amount: 1}
          - {kind: 引く, player: P1, object: d1}

  - name: B 當 0 費法術打出：沒有效果，進墓場後消去
    inherit: A 用 EX 的 3 張輝く金貨起動：消滅 3 張（消去）、+1、抽 1
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: k1}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 1
          P1.ex: [k2, k3]
          P1.cemetery: []
          P1.leader.life: 20
        events:
          - {kind: プレイ, object: k1}
          - {kind: 消去, object: k1}
        forbidden_events:
          - {kind: 引く}
          - {kind: 体力増加}

  - name: C 只有 2 張 → 費用付不出 → 不能起動
    inherit: A 用 EX 的 3 張輝く金貨起動：消滅 3 張（消去）、+1、抽 1
    setup:
      players:
        P1:
          zones:
            ex:
              - {id: k1, card: BP16-T15}
              - {id: k2, card: BP16-T15}
    decisions:
      - {n: 1, by: P1, at: main, do: activate, ability: {source: k1, line: 1}, costs: {1: [k2]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-activate
        assert:
          P1.ex: [k1, k2]
          P1.pp.current: 1
