schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-EBD02-015
kind: card
must_pass: true
mechanisms: [分配傷害, 10.6.2.4, 10.6.2.4.2, 10.6.2.3.2, Quick 時點]
cards: [EBD02-015, BP01-173, BP01-176, SD02-002]
why: >-
  ファイアーチェイン「相手の場のフォロワー2体まで選ぶ。それに3ダメージを割りふる」：分配在打出時決定（10.6.2.4）；每個選中的目標至少 1（Q79、10.6.2.4.2）；
  「2体まで」可選 0 體 → 對手沒有從者也能打出（Q78、Q279）。B：分配 3+0 是不合法的目標選法 → 回溯（10.6.2.4.2）。
discriminates: >-
  允許 0 分配的引擎 B 會 resolved；不允許 0 目標的引擎 C 會 cannot-play；在結算時才分配（先看傷害結果再決定）的引擎會在 after-decision-1 停下（paused）要求分配，而不是 resolved。
refs:
  rules: [10.6.2.3.2, 10.6.2.4, 10.6.2.4.1, 10.6.2.4.2, 12.3.5, 5.14.1]
  qa: [Q79, Q78, Q279]
evidence:
  - ref: Q79
    quote: いいえ。「割りふる」の場合、選んだフォロワーには少なくとも1以上のダメージを割りふらなければならないため、0ダメージを与えることはできません。
  - ref: Q279
    quote: はい。2体まで選ぶとき、0体を選ぶことができるため、プレイすることができます。
  - ref: cr 10.6.2.4.2
    quote: 値の割り振りを決定する際、そのために 10.6.2.3.1 で割り振る先として目標を選んでいる場合、その各目標に対して 1 単位以上の割り振りを行う義務があります。これが行えない場合、その目標の選び方は不正で、ゲームはこの目標を選ぶ前の状態まで巻き戻されます。
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 選 2 體，分配 2＋1
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 3, P2: 2}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ウィッチ, life: 20}
          pp: {current: 2, max: 3}
          zones:
            hand:
              - {id: a1, card: EBD02-015}         # ファイアーチェイン
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 3}
          zones:
            field:
              - {id: b1, card: BP01-173}          # ファイター 2/3
              - {id: b2, card: BP01-176}          # 天剣の乙女 4/6
              - {id: b3, card: SD02-002}          # ヴァンガード・レイサム 3/3
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      # 9.3：分配在打出時決定（10.6.2.4，費用之前）
      - {n: 1, by: P1, at: main, do: play, card: a1, targets: {1: [b1, b2]}, distribute: {1: {b1: 2, b2: 1}}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b1: {hp: 1}
          P2.field.b2: {hp: 5}
          P2.field.b3: {hp: 3}
          P1.pp.current: 0
        events:
          # 同一次「割りふる」造成的傷害同時發生（互驗第二輪修正，astra）
          - {kind: ダメージ, source: a1, target: b1, amount: 2, group: 1}
          - {kind: ダメージ, source: a1, target: b2, amount: 1, group: 1}

  - name: B 選 2 體但分配 3＋0 → 不合法 → 回溯
    inherit: A 選 2 體，分配 2＋1
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, targets: {1: [b1, b2]}, distribute: {1: {b1: 3, b2: 0}}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-play
        assert:
          P1.pp.current: 2
          P1.hand: [a1]
          P2.field.b1: {hp: 3}
        forbidden_events:
          - {kind: ダメージ}

  - name: C 對手沒有從者：選 0 體也能打出，什麼都不發生
    inherit: A 選 2 體，分配 2＋1
    setup:
      players:
        P2:
          zones:
            field: []
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, targets: {1: []}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P1.cemetery: [a1]
        events:
          - {kind: プレイ, object: a1}
        forbidden_events:
          - {kind: ダメージ}
