schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP18-026
kind: card
must_pass: false
mechanisms: [條件管到段落結尾, 〜なら、A。B。, 給予能力, '12.15', 這是ダメージを受けない, 12.10.2]
cards: [BP18-026, BP01-176, BP01-173]
why: >-
  ダークセイバー・メリッサ「{ファンファーレ}相手の場のフォロワー1体を選ぶ。それのプレイヤーの場のカードが3枚以上なら、それを破壊する。これは【オーラ】とこのターン、「これはダメージを受けない」を持つ。」
  依 Q1373／Q1611 確立的慣例，「なら」管到段落結尾：對手場上不到 3 張時，不只不破壞，連「【オーラ】と「ダメージを受けない」を持つ」也不執行。
  A：對手 3 張 → 破壞 b1，メリッサ 用【突進】打アクト狀態的 b2 → 不受交戰傷害（體力 4）。B：對手 2 張 → 不破壞、沒有保護 → 交戰受 2（體力 2）。
  互驗第二輪修正（astra）：B 原本留著アクト狀態的天剣の乙女【守護】，依 12.8.2 攻擊 b2 會不合法 → B 的對手場改成兩隻ファイター（沒有守護）。
  本卡沒有直接 Q&A，答案由同句型的 Q1373、Q1611 推導；建議先列為非必過。
discriminates: >-
  把「これは【オーラ】と…を持つ」當成無條件的引擎：B 中メリッサ 體力 4 而非 2。
refs:
  rules: [10.6.2.8.2, 12.10.2, 12.15.2, 8.4.9.1, 1.3.2.2, 12.8.2]
  qa: [Q1373, Q1611]
evidence:
  - ref: Q1373
    quote: いいえ。自分の場に他のフォロワーがいる場合、相手の場のフォロワーを選ぶことができたとしても、「自分の場に他のフォロワーがいないなら、」以降の効果は働かず、1枚引くことができません。
    derivation: [同句型：「（条件）なら、A。B。」→ B 也在條件範圍內, メリッサ 的 B 是「これは【オーラ】と…を持つ」→ 條件不成立時不獲得]
  - ref: Q1611
    quote: いいえ。自分のリーダーの体力を+4以上していない場合、それ以降の効果は働かず、1枚引くことができません。
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 對手場上 3 張：破壞目標、獲得保護 → 突進打 b2 不受交戰傷害
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 5, P2: 4}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 5, max: 5}
          zones:
            hand:
              - {id: a1, card: BP18-026}          # ダークセイバー・メリッサ 6/4 突進 指定攻撃
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ビショップ, life: 20}
          pp: {current: 0, max: 4}
          zones:
            field:
              - {id: b1, card: BP01-176, state: {acted: true}}   # 天剣の乙女 4/6
              - {id: b2, card: BP01-173, state: {acted: true}}   # ファイター 2/3
              - {id: b3, card: BP01-173, state: {acted: true}}   # ファイター 2/3
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}, targets: {1: [b1]}}
      - {n: 3, by: P1, at: main, do: attack, attacker: a1, target: b2}
      - {n: 4, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 1
          P2.field: [b2, b3]
        events:
          - {kind: 破壊, object: b1}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a1: {hp: 4, acted: true}
          P2.field: [b3]
        events:
          - {kind: ダメージ, source: a1, target: b2, amount: 6}
          - {kind: 破壊, object: b2}
        forbidden_events:
          - {kind: ダメージ, target: a1}

  - name: B 對手場上 2 張：不破壞、也不獲得保護 → 交戰受 2
    inherit: A 對手場上 3 張：破壞目標、獲得保護 → 突進打 b2 不受交戰傷害
    setup:
      players:
        P2:
          zones:
            field:
              # 兩隻都沒有【守護】：b1 不被破壞後仍留在場上，不會依 12.8.2 強制成為攻擊目標
              - {id: b1, card: BP01-173, state: {acted: true}}   # ファイター 2/3
              - {id: b2, card: BP01-173, state: {acted: true}}   # ファイター 2/3
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}, targets: {1: [b1]}}
      - {n: 3, by: P1, at: main, do: attack, attacker: a1, target: b2}
      - {n: 4, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.field: [b1, b2]
        forbidden_events:
          - {kind: 破壊}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a1: {hp: 2, acted: true}
          P2.field: [b1]
        events:
          - {kind: ダメージ, source: a1, target: b2, amount: 6, group: g1}
          - {kind: ダメージ, source: b2, target: a1, amount: 2, group: g1}
