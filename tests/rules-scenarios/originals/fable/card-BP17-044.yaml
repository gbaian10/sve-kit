schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP17-044
kind: card
must_pass: true
mechanisms: [可選費用與範圍, 10.4.7.2, 4.4.4.2, 場上限, 搜尋有條件, 10.6.2.1.2, 打出條件]
cards: [BP17-044, BP17-T14, BP17-T15, BP17-040, BP01-173, SD02-002]
why: >-
  戦慄の侵略：「これは自分のEXエリアの機械・カードが2枚以下なら、プレイできない」是打出條件；「プレイする際、コストを+2してよい」是可選追加費用（10.4.7.2）；
  效果：搜尋（可以不找到，Q2242）→ 出『遮断の触手』→ 付了 +2 才出『蹂躙の触手』。場上已有 4 張時，遮断出場後達上限 5，蹂躙依 4.4.4.2 不出（Q2243）。
  互驗第二輪修正（astra）：『遮断の触手』有【守護】，放上場時要問 place-acted（12.8.2、契約 9.2）；A 的蹂躙 依 4.4.4.2 要選「5−5＝0」張，
  契約 9.8 規定只剩 select: [] 也是輸入點 → 補上；B 的搜尋結果依 5.8.1.2 向對手出示（契約 10.5 寫成 公開 to: P2）。
discriminates: >-
  沒檢查場上限、把蹂躙硬塞進場（6 張）的引擎 A 會多一個 場に出す；沒付 +2 就出蹂躙的引擎 B 錯；EX 機械卡只有 2 張仍允許打出的引擎 C 錯。
refs:
  rules: [10.4.7.1, 10.4.7.2, 10.6.2.2.2, 4.4.4.1, 4.4.4.2, 5.8.1.2, 5.8.2, 10.6.2.1.2]
  qa: [Q2243, Q2242, Q2389]
evidence:
  - ref: Q2243
    quote: いいえ。この場合、『遮断の触手』1体を場に出すことで自分の場のカードが5枚になるため、『蹂躙の触手』1体を場に出すことができません。
  - ref: Q2242
    quote: はい。『遮断の触手』1体を場に出すことができます。
  - ref: cr 4.4.4.2
    quote: 場にカードを移動または作成する処理において、その結果場のカードの枚数が上限を超える場合、その移動または作成するカードの中から、その場の上限からその場にあるカードの枚数を引いた数のカードを選択し、それらのカードのみを移動または作成します。
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 場上 4 張、付 +2、不找到：遮断出場（5 張）→ 蹂躙不出
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 5, P2: 4}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ウィッチ, life: 20}
          pp: {current: 5, max: 5}
          zones:
            field:
              - {id: a1, card: BP01-173}
              - {id: a2, card: BP01-173}
              - {id: a3, card: SD02-002}
              - {id: a4, card: SD02-002}
            ex:
              - {id: m1, card: BP17-T14}          # 遮断の触手（機械）
              - {id: m2, card: BP17-T14}
              - {id: m3, card: BP17-T15}          # 蹂躙の触手（機械）→ EX 機械 3 張
            hand:
              - {id: s1, card: BP17-044}          # 戦慄の侵略（コスト3、+2 してよい）
            deck:
              - {id: d1, card: BP17-040}          # 極致の創造主・ベルフォメット
              - {id: d2, card: BP01-173}
              - {id: d3, card: BP01-173}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 5}
          zones:
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: s1, optional_costs: {additional: {pp: 2}}}
      - {n: 2, by: P1, at: resolve, of: {decision: 1, occurrence: 1}, do: resolve-choice, select: []}
      - {n: 3, by: P1, at: resolve, of: {decision: 1, occurrence: 2}, do: place-acted, object: new-1, acted: false}
      # 4.4.4.2：場已 5 張 → 從要建立的『蹂躙の触手』中選 0 張；契約 10.4 用卡號選、9.8 只剩 select: [] 也是輸入點
      - {n: 4, by: P1, at: resolve, of: {decision: 1, occurrence: 3}, do: resolve-choice, select: []}
    random:
      shuffles:
        - {player: P1, zone: deck, result: [d3, d1, d2]}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: paused
        awaiting:
          by: P1
          choices:
            - {do: place-acted, object: new-1, acted: false}
            - {do: place-acted, object: new-1, acted: true}
        assert:
          P1.deck: [d3, d1, d2]
        forbidden_events:
          # 只禁止搜尋結果向對手出示（to: P2）；決定 1 從手牌打出 s1 時依 10.6.2.1 的公開（to: all）在同一區間、必然發生（astra 複查 R1）
          - {kind: 公開, to: P2}
      - at: after-decision-3
        view: omniscient
        outcome: paused
        awaiting:
          by: P1
          choices:
            - {do: resolve-choice, select: []}
        assert:
          P1.field: [a1, a2, a3, a4, new-1]
          P1.field.new-1: {acted: false}
        events:
          - {kind: 場に出す, object: new-1, card: BP17-T14, to: P1.field}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P1.hand: []
          P1.deck: [d3, d1, d2]
          P1.cemetery: [s1]
          P1.field: [a1, a2, a3, a4, new-1]
          P1.field_count: 5
        events:
          - {kind: 解決, object: s1}
        forbidden_events:
          # 這段區間（決定 4）什麼都不放上場：蹂躙 依 4.4.4.2 選了 0 張
          - {kind: 場に出す}

  - name: B 場上 3 張：遮断與蹂躙都出場
    inherit: A 場上 4 張、付 +2、不找到：遮断出場（5 張）→ 蹂躙不出
    setup:
      players:
        P1:
          zones:
            field:
              - {id: a1, card: BP01-173}
              - {id: a2, card: BP01-173}
              - {id: a3, card: SD02-002}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: s1, optional_costs: {additional: {pp: 2}}}
      - {n: 2, by: P1, at: resolve, of: {decision: 1, occurrence: 1}, do: resolve-choice, select: [d1]}
      - {n: 3, by: P1, at: resolve, of: {decision: 1, occurrence: 2}, do: place-acted, object: new-1, acted: false}
    random:
      shuffles:
        - {player: P1, zone: deck, result: [d3, d2]}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: paused
        awaiting:
          by: P1
          choices:
            - {do: place-acted, object: new-1, acted: false}
            - {do: place-acted, object: new-1, acted: true}
        assert:
          P1.hand: [d1]
          P1.deck: [d3, d2]
        events:
          - {kind: 公開, object: d1, to: P2, source: s1}     # 5.8.1.2 向對手出示（契約 10.5）
          - {kind: 移動, object: d1, from: P1.deck, to: P1.hand}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.hand: [d1]
          P1.deck: [d3, d2]
          P1.field: [a1, a2, a3, new-1, new-2]
          P1.field_count: 5
          P1.field.new-1: {acted: false}
        events:
          # 「『遮断の触手』1体を場に出す。コストを+2したなら、『蹂躙の触手』1体を場に出す。」是兩句 → 先後而非同時
          - {kind: 場に出す, object: new-1, card: BP17-T14, to: P1.field}
          - {kind: 場に出す, object: new-2, card: BP17-T15, to: P1.field}
        events_exact: [場に出す]

  - name: C EX 機械卡只有 2 張 → 不能打出
    inherit: A 場上 4 張、付 +2、不找到：遮断出場（5 張）→ 蹂躙不出
    setup:
      players:
        P1:
          zones:
            ex:
              - {id: m1, card: BP17-T14}
              - {id: m2, card: BP17-T14}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: s1, optional_costs: {additional: decline}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-play
        assert:
          P1.pp.current: 5
          P1.hand: [s1]
