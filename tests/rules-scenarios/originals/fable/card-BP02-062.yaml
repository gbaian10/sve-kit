schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP02-062
kind: card
must_pass: true
mechanisms: [本回合事件歷史, 本回合棄過牌, 7.4.1, 7.4.7, 10.1.1.2.2, 費用中的捨棄也算捨棄, 回合特定時點, 誘發時條件不成立就不誘發]
cards: [BP02-062, BP02-063, BP01-173, BP01-176]
why: >-
  竜巫女の儀式「自分のエンドフェイズが来たとき、このターン中に自分の手札を捨てていたなら、…選ぶ。それに2ダメージ」與荒牙の竜少女「プレイする際、このターン中に自分の手札を捨てていたなら、コストを-2する」都讀本回合「捨過牌」的歷史。
  A：第二張儀式的ファンファーレ 費用「手札1枚を捨てる：」（10.1.1.2.2）算捨棄 → 竜少女 −2 費、結束階段兩張儀式各 2 傷害。
  B：沒捨過 → 竜少女 3 費；結束階段儀式的「なら」在誘發當下不成立 → **根本不誘發**（沒有待機、沒有 choose-pending）。
  C（Q302）：結束階段手牌超過上限的捨牌（7.4.7）在「エンドフェイズが来たとき」之後才發生 → 誘發當下沒捨過牌 → 不誘發、不造成傷害。
  **官方英文 Q&A：誘發時條件不成立就不誘發**（英文版同一則 Q&A 答 "the ability does not trigger"，見 evidence；使用者定案 2026-09-25）。
  日文 Q302 的「プレイしません」依此讀成「不誘發」，不是「打出但無效果」也不是「待機後取消」；B、C 因此不寫該能力的 choose-pending，並以 forbidden_events 斷言沒有它的 待機。
  互驗第二輪修正（astra）：三個局面都推進到 P2 的回合，P2 牌庫頂改放真實卡（契約 10.10）。
discriminates: >-
  沒記錄「本回合捨過牌」的引擎：A 的竜少女 會扣 3 PP、儀式不造成傷害。把費用的捨棄排除在歷史外的引擎同上。
  把「なら」當成結算時才判定（誘發、待機、打出後無效果或取消）的引擎：B、C 會出現 待機 事件並在 after-decision-2／after-decision-1 停在 P1 的 choose-pending，而不是 P2 的クイック時點。
  把 7.4.7 的捨牌算進去（或把儀式的誘發延到捨牌之後）的引擎：C 會造成 2 傷害。
refs:
  rules: [7.4.1, 7.4.2, 7.4.5, 7.4.7, 10.1.1.2.1, 10.1.1.2.2, 5.12.1, 10.4.4.1, 10.6.2.5.1.3]
  qa: [Q302]
evidence:
  - ref: Q302
    quote: いいえ。手札の上限枚数となるようにカードを捨てる行為は、「自分のエンドフェイズが来たとき～」の誘発のタイミングよりも後に行うため、条件を満たすことはできず、プレイしません。
  - ref: Q302 (EN, BP02-062EN)
    quote: No. The discarding of cards over your hand's limit happens after 'the start of your end phase,' so the ability does not trigger.
    url: https://en.shadowverse-evolve.com/cards/?cardno=BP02-062EN
    derivation:
      - 英文版明寫 does not trigger → 「〜とき、〜なら」的「なら」在誘發當下判定，不成立就不誘發（沒有待機）
      - 日文「プレイしません」與英文一致：不是打出後無效果、也不是待機後取消
  - ref: cr 5.12.1
    quote: カードを‘捨てる’指示がある場合、指定のプレイヤーは指定された枚数の手札を選び、それらを墓場に置きます。
    derivation: [ファンファーレ 費用「手札1枚を捨てる」也是「捨てる」指示 → 本回合捨過牌成立]
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 用第二張儀式的費用捨 1 張 → 竜少女 −2 費 → 結束階段兩張儀式各造成 2 傷害
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 6, P2: 5}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 6, max: 6}
          zones:
            field:
              - {id: m1, card: BP02-062}          # 竜巫女の儀式（場上）
            hand:
              - {id: m2, card: BP02-062}          # 竜巫女の儀式（コスト3）
              - {id: h1, card: BP02-063}          # 荒牙の竜少女（コスト3、捨てていたなら −2）
              - {id: h2, card: BP01-173}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 5}
          zones:
            field:
              - {id: b1, card: BP01-176}          # 天剣の乙女 4/6
            hand:
              # B、C 要完整列出 P2 在クイック時點的合法選項（只有 pass）→ 用真實的非クイック卡，不能用 filler（契約 2.3）
              - {id: q1, card: BP01-173}
              - {id: q2, card: BP01-173}
              - {id: q3, card: BP01-173}
            deck:
              - {id: p1, card: BP01-173}          # P2 下回合開始階段抽到（契約 10.10：跨回合的牌庫頂要是真實卡）
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: m2}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: m2, line: 2}}, costs: {1: [h2]}}
      - {n: 3, by: P1, at: main, do: play, card: h1}
      - {n: 4, by: P1, at: main, do: end-phase}
      - {n: 5, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: m1, line: 1}}, targets: {1: [b1]}}
      - {n: 6, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: m2, line: 1}}, targets: {1: [P2.leader]}}
      - {n: 7, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 3
          P1.leader.life: 21
          P1.hand: [h1]
          P1.cemetery: [h2]
          semantic_state.counters_this_turn: {P1.discarded: 1}
        events:
          - {kind: 捨てる, player: P1, object: h2}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 2
          P1.field: [m1, m2, h1]
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: m1, line: 1}}}
            - {do: choose-pending, pending: {ability: {source: m2, line: 1}}}
      - at: after-decision-7
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b1: {hp: 4}
          P2.leader.life: 18
          turn: {active: P2, phase: main}
        events:
          - {kind: ダメージ, source: m1, target: b1, amount: 2}
          - {kind: ダメージ, source: m2, target: P2.leader, amount: 2}


  - name: B 本回合沒捨過牌 → 竜少女 3 費 → 結束階段儀式不誘發、不造成傷害
    inherit: A 用第二張儀式的費用捨 1 張 → 竜少女 −2 費 → 結束階段兩張儀式各造成 2 傷害
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: h1}
      - {n: 2, by: P1, at: main, do: end-phase}
      # 誘發當下沒捨過牌 → 儀式不誘發（官方英文 Q&A）→ 沒有 P1 的 choose-pending，直接到 P2 的 7.4.5 クイック時點
      - {n: 3, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 3
          P1.field: [m1, h1]
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        awaiting:
          by: P2
          choices:
            - {do: pass}
        assert:
          semantic_state.pending_triggers: []
          P2.leader.life: 20
        forbidden_events:
          - {kind: 待機}
          - {kind: プレイ, ability: {source: m1, line: 1}}
          - {kind: ダメージ}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b1: {hp: 6}
          P2.leader.life: 20
          turn: {active: P2, phase: main}
          P2.hand: [q1, q2, q3, p1]
        forbidden_events:
          - {kind: 待機}
          - {kind: ダメージ}

  - name: C 結束階段手牌上限的捨牌在誘發之後 → 誘發當下不算「捨てていた」→ 不誘發、不造成傷害
    inherit: A 用第二張儀式的費用捨 1 張 → 竜少女 −2 費 → 結束階段兩張儀式各造成 2 傷害
    setup:
      players:
        P1:
          zones:
            hand:
              - {id: h1, card: BP01-173}
              - {id: h2, card: BP01-173}
              - {id: h3, card: BP01-173}
              - {id: h4, card: BP01-173}
              - {id: h5, card: BP01-173}
              - {id: h6, card: BP01-173}
              - {id: h7, card: BP01-173}
              - {id: h8, card: BP01-173}
    decisions:
      - {n: 1, by: P1, at: main, do: end-phase}
      - {n: 2, by: P2, at: quick, do: pass}
      - {n: 3, by: P1, at: end, do: end-discard, select: [h8]}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        awaiting:
          by: P2
          choices:
            - {do: pass}
        assert:
          P1.hand_count: 8
          P1.cemetery: []
          semantic_state.pending_triggers: []
        forbidden_events:
          - {kind: 待機}
          - {kind: プレイ, ability: {source: m1, line: 1}}
          - {kind: ダメージ}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.hand_count: 7
          P1.cemetery: [h8]
          P2.field.b1: {hp: 6}
          P2.leader.life: 20
          turn: {active: P2, phase: main}
        events:
          - {kind: 捨てる, player: P1, object: h8}
        forbidden_events:
          - {kind: 待機}
          - {kind: ダメージ}
