schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: rule-8.3.2-01
kind: rule
must_pass: true
mechanisms: [8.3.2.1, 12.2.5, 10.4.6, 8.1.2, 進化每回合一次, 橫置狀態也能進化, 需要橫置的起動能力在已橫置時不能用, 進化卡自身的能力]
cards: [BP19-050, BP19-051, BP05-108, BP01-173]
why: >-
  進化能力（起動能力）每回合只能打出一次（8.3.2.1）；進化不要求スタンド狀態，アクト狀態的從者也能進化（12.2 沒有此限制）；
  已進化的從者沒有進化能力可用（12.2.5、5.16.4）。「これを{アクト}」費用是「場のスタンド状態のこのカードをアクトする」（10.4.6）→ 已アクト時付不出 → 不能起動（8.1.2）。
discriminates: >-
  不允許アクト狀態進化的引擎 after-decision-1 會 cannot-evolve；允許同回合第二次進化的引擎 after-decision-3 會 resolved；
  允許已アクト的リリエル再付アクト費用的引擎 after-decision-5 會 resolved 並造成 2 傷害。
refs:
  rules: [8.3.2, 8.3.2.1, 12.2.1, 12.2.3, 12.2.5, 5.16.4, 10.4.6, 10.4.2.2, 8.1.2, 10.6.2.1.2]
  qa: [Q1376]
evidence:
  - ref: cr 8.3.2.1
    quote: 起動能力を指定する際、それが進化能力または進化相当能力である場合、このターンにターンプレイヤーがいずれかの進化能力や進化相当能力をすでにプレイ済みである場合、その起動能力は指定できません。
  - ref: cr 10.4.6
    quote: コストのうち、 は‘場のスタンド状態のこのカードをアクトする’を意味します。
  - ref: cr 12.2.5
    quote: 特殊な種類‘エボルヴ’を持つカードが進化能力を持っている場合、その進化能力はプレイできません。
status: draft
author: fable
verified_by: []

scenarios:
  - name: A アクト狀態的從者可以進化；同回合第二隻不能；已アクト的リリエル不能起動
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 5, P2: 4}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ウィッチ, life: 20}
          pp: {current: 4, max: 5}
          ep: 2
          zones:
            field:
              - {id: a1, card: BP19-050, state: {acted: true}}   # ライトニングキャット 2/2 アクト
              - {id: a2, card: BP19-050}                          # ライトニングキャット 2/2
              - {id: a3, card: BP05-108, state: {acted: true}}   # 神弓の座天使・リリエル アクト
            evolve_deck:
              - {id: e1, card: BP19-051}
              - {id: e2, card: BP19-051}
            hand:
              - {filler: 2}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 5}
          zones:
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: evolve, source: a1, ability: {source: a1, line: 1}, evolve_card: e1, pay: {pp: 1, ep: 0, sep: 0}}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, card: BP19-051, line: 1}}, targets: {1: [P2.leader]}}
      - {n: 3, by: P1, at: main, do: evolve, source: a2, ability: {source: a2, line: 1}, evolve_card: e2, pay: {pp: 0, ep: 1, sep: 0}}
      - {n: 4, by: P1, at: main, do: evolve, source: a1, ability: {source: a1, line: 1}, evolve_card: e2, pay: {pp: 0, ep: 1, sep: 0}}
      - {n: 5, by: P1, at: main, do: activate, ability: {source: a3, line: 2}}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a1: {evolved: true, evolved_with: e1, acted: true, power: 3, hp: 3}
          P1.pp.current: 3
          P1.ep: 2
          P2.leader.life: 18
        events:
          - {kind: 進化, object: a1, with: e1}
      - at: after-decision-3
        view: omniscient
        outcome: cannot-evolve
        assert:
          P1.field.a2: {evolved: false}
          P1.ep: 2
          P1.evolve_deck: [e2]
      - at: after-decision-4
        view: omniscient
        outcome: cannot-evolve
        assert:
          P1.field.a1: {evolved: true, evolved_with: e1}
          P1.evolve_deck: [e2]
      - at: after-decision-5
        view: omniscient
        outcome: cannot-activate
        assert:
          P2.leader.life: 18
          P1.field.a3: {acted: true}
        forbidden_events:
          - {kind: ダメージ}
