schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP20-099
kind: card
must_pass: true
mechanisms: [回合特定時點, 7.3.1, 取代效果, 1.3.2.2, 「次のダメージを受けない」只消耗一次, 對手回合的誘發]
cards: [BP20-099, SD02-002, BP01-173, BP12-072]
why: >-
  セイクリッドシープ「相手のメインフェイズが来たとき、このターン、自分のリーダーは次のダメージを受けない」：在對手（P1）的主要階段來臨時誘發（P2 是非回合玩家，10.5.2.3）；
  效果只擋「下一次」傷害。A：第一次攻擊 3 傷害被擋、第二次 2 傷害照受。B（Q2676）：攻擊力 0 的攻擊沒有傷害行動 → 效果不消耗，之後的 3 傷害仍被擋。
discriminates: >-
  沒在對手主要階段誘發的引擎 after-decision-2 不會等 P2 的 choose-pending；把效果做成持續整回合的引擎 A 第二次也擋（P2 體力 20）；
  把 0 傷害當成消耗掉效果的引擎 B 會讓 3 傷害通過。
refs:
  rules: [7.3.1, 7.3.2, 10.5.2.3, 10.2.1.3, 1.3.2.2, 8.4.9, 7.4.8]
  qa: [Q2676, Q2701, Q2677]
evidence:
  - ref: Q2676
    quote: いいえ。攻撃力0以下のフォロワーによるリーダーへの攻撃はダメージを与えないので、『セイクリッドシープ』の能力は適用されません。また、ダメージを受けていないので『セイクリッドシープ』の能力は継続します。
  - ref: Q2701
    quote: 1回目のダメージを受ける際、1回目の『セイクリッドシープ』の効果が適用されダメージを受けない状況となります。
status: draft
author: fable
verified_by: []

scenarios:
  - name: A P1 的主要階段來臨 → P2 的セイクリッドシープ誘發 → 第一次攻擊被擋、第二次照受
    setup:
      turn: {active: P2, first_player: P1, elapsed_turns: {P1: 5, P2: 5}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 5}
          zones:
            field:
              - {id: a1, card: SD02-002}          # ヴァンガード・レイサム 3/3
              - {id: a2, card: BP01-173}          # ファイター 2/3
            hand:
              - {filler: 2}
            deck:
              - {id: d1, card: BP01-173}
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ビショップ, life: 20}
          pp: {current: 0, max: 5}
          zones:
            field:
              - {id: b1, card: BP20-099}          # セイクリッドシープ 2/3
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P2, at: main, do: end-phase}
      - {n: 2, by: P1, at: quick, do: pass}
      - {n: 3, by: P2, at: check-timing, do: choose-pending, pending: {ability: {source: b1, line: 1}}}
      - {n: 4, by: P1, at: main, do: attack, attacker: a1, target: P2.leader}
      - {n: 5, by: P2, at: quick, do: pass}
      - {n: 6, by: P1, at: main, do: attack, attacker: a2, target: P2.leader}
      - {n: 7, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        awaiting:
          by: P2
          choices:
            - {do: choose-pending, pending: {ability: {source: b1, line: 1}}}
        assert:
          turn: {active: P1, phase: main}
          P1.hand: [filler: 2, d1]
      - at: after-decision-5
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 20
          P1.field.a1: {acted: true}
        forbidden_events:
          - {kind: ダメージ, target: P2.leader}
      - at: after-decision-7
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 18
        events:
          - {kind: ダメージ, source: a2, target: P2.leader, amount: 2}

  - name: B 攻擊力 0 的攻擊不消耗效果 → 之後的 3 傷害仍被擋
    inherit: A P1 的主要階段來臨 → P2 的セイクリッドシープ誘發 → 第一次攻擊被擋、第二次照受
    setup:
      players:
        P1:
          zones:
            field:
              - {id: a1, card: SD02-002}
              - {id: a3, card: BP12-072}          # モーターグレイブディガー 0/1
    decisions:
      - {n: 1, by: P2, at: main, do: end-phase}
      - {n: 2, by: P1, at: quick, do: pass}
      - {n: 3, by: P2, at: check-timing, do: choose-pending, pending: {ability: {source: b1, line: 1}}}
      - {n: 4, by: P1, at: main, do: attack, attacker: a3, target: P2.leader}
      - {n: 5, by: P2, at: quick, do: pass}
      - {n: 6, by: P1, at: main, do: attack, attacker: a1, target: P2.leader}
      - {n: 7, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-7
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 20
          P1.field.a1: {acted: true}
          P1.field.a3: {acted: true}
        forbidden_events:
          - {kind: ダメージ, target: P2.leader}
