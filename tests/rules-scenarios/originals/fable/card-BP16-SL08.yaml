schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP16-SL08
kind: card
must_pass: true
mechanisms: [放牌庫頂或底, '5.9', 10.6.2.8.2, 抉擇＋條件改變選擇數, 結算時的選擇（可選剛抽的卡）]
cards: [BP16-SL08, BP01-173, BP01-176]
why: >-
  艶やかなる太夫・ギンネ【2】「1枚引く。自分の手札1枚をデッキの上か下に置く」：抽完才選要放哪張（結算時的選擇，可以是剛抽的那張）與放頂或放底
  （契約 9.12 的 resolve-choice.position；同一句 → 同一個輸入點，9.8）。A 把剛抽的卡放回牌庫頂；B 把原本的手牌放到牌庫底。
discriminates: >-
  在抽牌前就要求選卡的引擎 awaiting 只會列 h1；沒有「頂／底」選項或固定放底的引擎 A 的牌庫順序不同；把「放頂」做成放底的引擎 A 的牌庫尾端多一張。
refs:
  rules: [10.6.2.8.2, 5.9.1, 5.10.2, 4.5.1, 5.18.2.1]
  qa: [Q2087]
evidence:
  - ref: Q2087
    quote: いいえ。できません。カードや能力によって目標を選ぶ場合、そのカードや能力をプレイする際に目標を選びます。…その後、能力に示された効果を、表記の順にしたがって実行します。
    derivation:
      - 「自分の手札1枚をデッキの上か下に置く」不是「選ぶ」目標 → 結算時依表記順序：先抽、再從當時手牌選 → 可以放剛抽的卡
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 抽到 d1 後把 d1 放回牌庫頂
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 3, P2: 2}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 2, max: 3}
          zones:
            hand:
              - {id: g1, card: BP16-SL08}         # 艶やかなる太夫・ギンネ（コスト2）
              - {id: h1, card: BP01-173}
            deck:
              - {id: d1, card: BP01-176}
              - {id: d2, card: BP01-173}
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 0, max: 3}
          zones:
            field:
              - {id: b1, card: BP01-173}
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: g1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: g1, line: 1}}, options: [2]}
      # 9.12：放牌庫頂或底 → resolve-choice.position；與選卡同一句 → 同一個輸入點
      - {n: 3, by: P1, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, select: [d1], position: top}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: paused
        awaiting:
          by: P1
          choices:
            - {do: resolve-choice, select: [h1], position: top}
            - {do: resolve-choice, select: [h1], position: bottom}
            - {do: resolve-choice, select: [d1], position: top}
            - {do: resolve-choice, select: [d1], position: bottom}
        assert:
          P1.hand: [h1, d1]
          P1.deck: [d2, filler: 20]
          P1.pp.current: 0
        events:
          - {kind: 引く, player: P1, object: d1}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.hand: [h1]
          P1.deck: [d1, d2, filler: 20]
          P1.field: [g1]
        events:
          - {kind: 移動, object: d1, from: P1.hand, to: P1.deck, position: top}

  - name: B 把原本的手牌 h1 放到牌庫底
    inherit: A 抽到 d1 後把 d1 放回牌庫頂
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: g1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: g1, line: 1}}, options: [2]}
      - {n: 3, by: P1, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, select: [h1], position: bottom}
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.hand: [d1]
          P1.deck: [d2, filler: 20, h1]
        events:
          - {kind: 移動, object: h1, from: P1.hand, to: P1.deck, position: bottom}
