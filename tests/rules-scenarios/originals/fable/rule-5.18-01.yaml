schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: rule-5.18-01
kind: rule
must_pass: true
mechanisms: ['5.18', 5.18.2.1, 5.18.3, 10.6.2.8.2.2, 1.3.4, 抉擇＋條件改變選擇數, 同時選擇]
cards: [SP01-046, BP01-173, BP01-176]
why: >-
  ダークエンジェル・オリヴィエ「2つまでチョイス」：下限 1（5.18.2.1、Q293）、不可重複（Q294）、在打出時決定（5.18.3），
  合法的選項集合是 4 個單選＋6 個雙選共 10 種；選中的依卡面順序結算（10.6.2.8.2.2）。【4】讓對手捨牌，捨哪張由對手在結算中途決定。
discriminates: >-
  awaiting 若包含 []（0 個）或 [1,1] 之類重複，或缺少任一合法組合，就是抉擇規則實作錯；
  B 中若引擎替 P2 隨機捨牌、或不停下來讓 P2 選，事件與手牌會不同；若 EP+1 因「EP 有上限」而沒有發生也可觀察（Q337）。
refs:
  rules: [5.18.1, 5.18.2.1, 5.18.3, 5.18.4, 10.6.2.2.3, 10.6.2.8.2.2, 5.12.1, 3.2.5.1, 1.3.4]
  qa: [Q293, Q294, Q337, Q336]
evidence:
  - ref: Q293
    quote: いいえ。必ず1つ以上チョイスする必要があります。
  - ref: Q294
    quote: いいえ。1つの選択肢を2回以上チョイスすることはできません。
  - ref: cr 5.18.2.1
    quote: ‘（数値）までチョイスする’指示がある場合、1 以上（数値）までの値を選択し、その個数の選択肢を選択して実行します。
  - ref: Q337
    quote: はい。EPは上限がないため、EPが3ある場合も新たにEPを得ます。
  - ref: cr 10.6.2.8.2.2
    quote: チョイスする（5.18）処理により複数の選択肢を選んだ場合、各選択肢はテキストに表記の順で実行します。
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 選【2】【3】：awaiting 列出全部 10 種合法組合；結算依卡面順序（先 +3 再抽）
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 5, P2: 4}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ビショップ, life: 20}
          pp: {current: 5, max: 5}
          ep: 2
          zones:
            hand:
              - {id: a1, card: SP01-046}          # ダークエンジェル・オリヴィエ
            deck:
              - {id: a2, card: BP01-173}
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 5}
          zones:
            hand:
              - {id: b1, card: BP01-173}
              - {id: b2, card: BP01-176}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 1}}, options: [2, 3]}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, line: 1}}, options: [1]}
            - {do: choose-pending, pending: {ability: {source: a1, line: 1}}, options: [2]}
            - {do: choose-pending, pending: {ability: {source: a1, line: 1}}, options: [3]}
            - {do: choose-pending, pending: {ability: {source: a1, line: 1}}, options: [4]}
            - {do: choose-pending, pending: {ability: {source: a1, line: 1}}, options: [1, 2]}
            - {do: choose-pending, pending: {ability: {source: a1, line: 1}}, options: [1, 3]}
            - {do: choose-pending, pending: {ability: {source: a1, line: 1}}, options: [1, 4]}
            - {do: choose-pending, pending: {ability: {source: a1, line: 1}}, options: [2, 3]}
            - {do: choose-pending, pending: {ability: {source: a1, line: 1}}, options: [2, 4]}
            - {do: choose-pending, pending: {ability: {source: a1, line: 1}}, options: [3, 4]}
        assert:
          P1.pp.current: 0
          P1.field: [a1]
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.leader.life: 23
          P1.hand: [a2]
          P1.ep: 2
          P2.hand: [b1, b2]
        events:
          - {kind: 体力増加, target: P1.leader, amount: 3}
          - {kind: 引く, player: P1, object: a2}
        forbidden_events:
          - {kind: 捨てる}

  - name: B 選【1】【4】：EP +1（EP 無上限）、對手在結算中途選一張捨
    inherit: A 選【2】【3】：awaiting 列出全部 10 種合法組合；結算依卡面順序（先 +3 再抽）
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 1}}, options: [1, 4]}
      - {n: 3, by: P2, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, select: [b2]}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: paused
        awaiting:
          by: P2
          choices:
            - {do: resolve-choice, select: [b1]}
            - {do: resolve-choice, select: [b2]}
        assert:
          P1.ep: 3
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.ep: 3
          P1.leader.life: 20
          P1.hand: []
          P2.hand: [b1]
          P2.cemetery: [b2]
        events:
          - {kind: 捨てる, player: P2, object: b2}
        forbidden_events:
          - {kind: 引く}
          - {kind: 体力増加}
