schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP18-SP01
kind: card
must_pass: true
mechanisms: [封箱、操縱、變成種類, '5.31', 5.31.2, 5.31.3, '12.5', '12.8', 封箱的從者離場時謝幕曲不進入待機]
cards: [BP18-SP01, BP04-092, BP01-180, SD02-002, BP01-173]
why: >-
  ナハト・ナハト「{起動}{コスト0}：相手の場のフォロワー1体を選ぶ。それをアクトする。次のそれのプレイヤーのターン終了時まで、それを【箱詰め】状態にする」：
  箱詰め期間失去所有能力（5.31.2）→ 被破壞時ラストワード不誘發（Q1497）；開始階段不站起（5.31.3）；期限到了能力回來（Q1718）→ 守護重新生效。
discriminates: >-
  箱詰め後仍讓ラストワード待機的引擎 A 會多出待機／P2 體力 21；箱詰め的從者在 P2 開始階段站起的引擎 B 的 after-decision-3 會 acted false；
  期限結束後不還原能力的引擎在 B 的 after-decision-6 會允許攻擊リーダー（守護沒回來）。
refs:
  rules: [5.31.1, 5.31.2, 5.31.3, 5.4.1, 12.5.1, 12.8.2, 7.2.3, 7.4.8]
  qa: [Q1497, Q1718, Q1501, Q1717]
evidence:
  - ref: Q1497
    quote: いいえ。能力を失っているので《ラストワード》能力は誘発しません。
  - ref: cr 5.31.3
    quote: 【箱詰め】状態のカードは、そのプレイヤーのスタートフェイズ中、ルールによるスタンド（7.2.3）を実行しません。
  - ref: Q1717
    quote: 【箱詰め】状態の間は【守護】を失いますが、【箱詰め】状態が解除された場合、持っていた【守護】などの能力は元に戻り有効となります。
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 箱詰め後被破壞 → ラストワード不誘發
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 5, P2: 4}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 1, max: 5}
          zones:
            field:
              - {id: a1, card: BP18-SP01}         # カースドクイーン・ナハト・ナハト 3/5
            hand:
              - {id: a2, card: BP01-180}          # エンジェルバレッジ
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ナイトメア, life: 20}
          pp: {current: 0, max: 5}
          zones:
            field:
              - {id: b1, card: BP04-092}          # デモンビーター 1/1【守護】（ラストワード：+1）
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: activate, ability: {source: a1, line: 2}, targets: {1: [b1]}}
      - {n: 2, by: P1, at: main, do: play, card: a2}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b1: {acted: true}
          P1.pp.current: 1
        events:
          - {kind: アクト, object: b1}
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.field: []
          P2.cemetery: [b1]
          P2.leader.life: 20
          semantic_state.pending_triggers: []
        events:
          - {kind: 破壊, object: b1, by: rule-11.3.1}
        forbidden_events:
          - {kind: 待機}
          - {kind: 体力増加}

  - name: B 箱詰め的從者在自己開始階段不站起；對手回合結束後能力回來（守護重新擋攻擊）
    inherit: A 箱詰め後被破壞 → ラストワード不誘發
    setup:
      players:
        P1:
          zones:
            field:
              - {id: a1, card: BP18-SP01}
              - {id: a3, card: SD02-002}          # ヴァンガード・レイサム 3/3（下回合攻擊用）
            hand:
              - {filler: 2}
            deck:
              - {id: a9, card: BP01-173}          # P1 下回合開始階段抽到
              - {filler: 20}
        P2:
          zones:
            field:
              - {id: b1, card: BP04-092}
            hand:
              - {filler: 3}
            deck:
              - {id: b9, card: BP01-173}          # P2 開始階段抽到
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: activate, ability: {source: a1, line: 2}, targets: {1: [b1]}}
      - {n: 2, by: P1, at: main, do: end-phase}
      - {n: 3, by: P2, at: quick, do: pass}
      - {n: 4, by: P2, at: main, do: end-phase}
      # 7.4.3：P2 的 b1 在箱詰め期間失去【守護】→ 沒有守護アクト的輸入點
      - {n: 5, by: P1, at: quick, do: pass}
      - {n: 6, by: P1, at: main, do: attack, attacker: a3, target: P2.leader}
      - {n: 7, by: P1, at: main, do: attack, attacker: a3, target: b1}
      - {n: 8, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          turn: {active: P2, phase: main}
          P2.field.b1: {acted: true}
          P2.hand: [b9, filler: 3]
        forbidden_events:
          - {kind: スタンド, object: b1}
      - at: after-decision-5
        view: omniscient
        outcome: resolved
        assert:
          turn: {active: P1, phase: main}
          P2.field.b1: {acted: true}
          P1.hand: [a9, filler: 2]
      - at: after-decision-6
        view: omniscient
        outcome: cannot-attack
        assert:
          P1.field.a3: {acted: false}
      - at: after-decision-8
        view: omniscient
        outcome: resolved
        assert:
          P2.field: []
          P1.field.a3: {hp: 2}
        events:
          - {kind: 攻撃, attacker: a3, target: b1}
          - {kind: 待機, ability: {source: b1, line: 3}}
