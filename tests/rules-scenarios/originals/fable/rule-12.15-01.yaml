schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: rule-12.15-01
kind: rule
must_pass: true
mechanisms: [四種保護並列對照, '12.15', 能力によって破壊されない, 能力ダメージを受けない, 墓場に置く, 5.14.3.3, 5.6.1, 5.7.1, 持續效果與禁止, 10.6.2.3.3]
cards: [BP16-109, BP14-090, BP18-075, BP01-173, BP07-P33, BP11-016, BP14-098, EBD04-011, BP06-079]
why: >-
  四種保護各擋不同的事，彼此不能互相推導：
  【オーラ】（潜みしマイニュ）只擋「相手のカードや能力により選ばれない」（12.15.2）：不能當目標（唯一目標時法術不能打出，10.6.2.3.3），但不指定目標的全體破壞照樣破壞它。
  「能力によって破壊されない」（永久の盾・シオン）：可以被選、破壞效果不生效（Q1369 同型），但傷害照受（−1 後）、「墓場に置く」照放（Q1939）、消滅照消滅。
  「能力ダメージを受けない」（エストレアビースト）：可以被選、能力傷害不發生（forbidden ダメージ），但破壞照破壞、交戰傷害照受（5.14.3.3 排除 8.4.9）。
  仁義の悪魔・ユヅキ 的「相手プレイヤーすべては、自身の場のフォロワー1体を墓場に置く」由 P2 在 P1 的結算中選擇。
discriminates: >-
  把オーラ 做成「不受對手效果影響」的引擎：テミス 後 b1 仍在場。把「破壊されない」做成「不能被選」或「不會離場」的引擎：粛清の一刀 對 b2 會 cannot-play、ユヅキ 無法把它放墓場。
  把「能力ダメージを受けない」做成「不受任何傷害」的引擎：交戰後 b3 體力 4 而非 2；做成「不能被選」的引擎：蜂の襲来 對 b3 會 cannot-play。
refs:
  rules: [12.15.1, 12.15.2, 12.15.2.1, 10.6.2.3.3, 5.6.1, 5.7.1, 5.14.3.3, 5.14.2, 8.4.9.1, 1.3.2.2, 1.3.4]
  qa: [Q1369, Q1939, Q1942, Q2357]
evidence:
  - ref: Q1939
    quote: はい。墓場に置きます。「墓場に置く」という処理は能力による破壊ではないので、『永久の盾・シオン』の「これは能力によって破壊されない。」という能力は働きません。
  - ref: Q1369
    quote: はい。「これは能力によって破壊されない。」を持つ『《吊るされた男》・ローフラッド』を破壊することはできませんが、1枚引くことができます。
  - ref: Q2357
    quote: フォロワーへの交戦によるダメージとリーダーへの攻撃によるダメージを除く、その他のあらゆるダメージが能力ダメージです。
  - ref: cr 12.15.2.1
    quote: オーラはカードや能力をプレイする際に選ぶことのみを禁止します。相手はオーラを持つフォロワーを攻撃目標に選択することができます。
    derivation: [テミスの審判「場のフォロワーすべてを破壊する」沒有「選ぶ」→ オーラ 不擋]
status: draft
author: fable
verified_by: []

scenarios:
  - name: 1 オーラ：粛清の一刀 不能選它（唯一目標時不能打出）；テミス 的全體破壞照樣破壞它
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 9, P2: 8}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ビショップ, life: 20}
          pp: {current: 10, max: 10}
          zones:
            field:
              - {id: a1, card: BP01-173}          # ファイター 2/3
            hand:
              - {id: s1, card: BP07-P33}          # 粛清の一刀（コスト3：破壊）
              - {id: s2, card: BP11-016}          # 蜂の襲来（コスト2：3ダメージ）
              - {id: s3, card: BP14-098}          # 信仰の一撃（コスト3：消滅）
              - {id: s4, card: EBD04-011}         # テミスの審判（コスト5：全體破壞）
              - {id: s5, card: BP06-079}          # 仁義の悪魔・ユヅキ（コスト6）
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 8}
          zones:
            field:
              - {id: b1, card: BP16-109, state: {acted: true}}   # 潜みしマイニュ 2/2 オーラ
              - {id: b2, card: BP14-090, state: {acted: true}}   # 永久の盾・シオン 3/7
              - {id: b3, card: BP18-075, state: {acted: true}}   # エストレアビースト 3/4
              - {id: b4, card: BP01-173, state: {acted: true}}   # ファイター 2/3
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: s1, targets: {1: [b1]}}
      - {n: 2, by: P1, at: main, do: play, card: s1, targets: {1: [b4]}}
      - {n: 3, by: P1, at: main, do: play, card: s4}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-play
        assert:
          P1.pp.current: 10
          P1.hand: [s1, s2, s3, s4, s5]
          P2.field: [b1, b2, b3, b4]
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 7
          P2.field: [b1, b2, b3]
        events:
          - {kind: 破壊, object: b4}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 2
          P1.field: []
          P2.field: [b2]
          P2.cemetery: [b4, b1, b3]
        events:
          - {kind: 破壊, object: b1, group: 1}
          - {kind: 破壊, object: b3, group: 1}
          - {kind: 破壊, object: a1, group: 1}
        forbidden_events:
          - {kind: 破壊, object: b2}

  - name: 2a 能力によって破壊されない：粛清の一刀 可以選它但不破壞；ユヅキ 的「墓場に置く」照放（P2 自選）
    inherit: 1 オーラ：粛清の一刀 不能選它（唯一目標時不能打出）；テミス 的全體破壞照樣破壞它
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: s1, targets: {1: [b2]}}
      - {n: 2, by: P1, at: main, do: play, card: s5}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: s5, line: 2}}}
      - {n: 4, by: P2, at: resolve, of: {decision: 3, occurrence: 1}, do: resolve-choice, select: [b2]}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 7
          P1.cemetery: [s1]
          P2.field: [b1, b2, b3, b4]
        events:
          - {kind: プレイ, object: s1}
          - {kind: 解決, object: s1}
        forbidden_events:
          - {kind: 破壊}
      - at: after-decision-3
        view: omniscient
        outcome: paused
        assert:
          P1.pp.current: 1
          P1.field: [a1, s5]
        awaiting:
          by: P2
          choices:
            - {do: resolve-choice, select: [b1]}
            - {do: resolve-choice, select: [b2]}
            - {do: resolve-choice, select: [b3]}
            - {do: resolve-choice, select: [b4]}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P2.field: [b1, b3, b4]
          P2.cemetery: [b2]
        events:
          - {kind: 移動, object: b2, from: P2.field, to: P2.cemetery}
        forbidden_events:
          - {kind: 破壊}

  - name: 2b 能力によって破壊されない：蜂の襲来 3 傷害 −1 → 受 2；信仰の一撃 照樣消滅它
    inherit: 1 オーラ：粛清の一刀 不能選它（唯一目標時不能打出）；テミス 的全體破壞照樣破壞它
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: s2, targets: {1: [b2]}}
      - {n: 2, by: P1, at: main, do: play, card: s3, targets: {1: [b2]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 8
          P2.field.b2: {hp: 5}
        events:
          - {kind: ダメージ, source: s2, target: b2, amount: 2}
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 5
          P2.field: [b1, b3, b4]
          P2.banish: [b2]
        events:
          - {kind: 消滅, object: b2}

  - name: 3 能力ダメージを受けない：蜂の襲来 可以選它但沒有傷害；交戰傷害照受；粛清の一刀 照樣破壞它
    inherit: 1 オーラ：粛清の一刀 不能選它（唯一目標時不能打出）；テミス 的全體破壞照樣破壞它
    setup:
      players:
        P2:
          zones:
            # 互驗第二輪修正（astra）：シオン b2 有【守護】且アクト狀態，留著會讓攻擊 b3 不合法（12.8.2）→ 本局面不放 b2
            field:
              - {id: b1, card: BP16-109, state: {acted: true}}   # 潜みしマイニュ 2/2 オーラ
              - {id: b3, card: BP18-075, state: {acted: true}}   # エストレアビースト 3/4
              - {id: b4, card: BP01-173, state: {acted: true}}   # ファイター 2/3
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: s2, targets: {1: [b3]}}
      - {n: 2, by: P1, at: main, do: attack, attacker: a1, target: b3}
      - {n: 3, by: P2, at: quick, do: pass}
      - {n: 4, by: P1, at: main, do: play, card: s1, targets: {1: [b3]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 8
          P1.cemetery: [s2]
          P2.field.b3: {hp: 4}
        events:
          - {kind: プレイ, object: s2}
          - {kind: 解決, object: s2}
        forbidden_events:
          - {kind: ダメージ}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b3: {hp: 2}
          P1.field: []
          P1.cemetery: [s2, a1]
        events:
          - {kind: ダメージ, source: a1, target: b3, amount: 2, group: g1}
          - {kind: ダメージ, source: b3, target: a1, amount: 3, group: g1}
          - {kind: 破壊, object: a1}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 5
          P2.field: [b1, b4]
          P2.cemetery: [b3]
        events:
          - {kind: 破壊, object: b3}
