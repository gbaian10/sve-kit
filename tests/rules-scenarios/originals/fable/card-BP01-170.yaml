schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP01-170
kind: card
must_pass: true
mechanisms: [手牌、墓場中有效的能力, 10.3.4, 7.4.7, '12.4', 回合特定時點]
cards: [BP01-170, BP01-173, BP01-176, BP01-180]
why: >-
  光の道筋「これを自分の手札から捨てたとき、1枚引く」在手牌有效（10.3.4）。結束階段手牌超過上限捨它 → 誘發 → 抽 1 → 手牌又超過 → 7.4.7 要再捨一次（Q270）。
  打出後進墓場不是「手札から捨てた」→ 不誘發（Q242），只抽法術本體的 1 張。
discriminates: >-
  把手牌能力當成只在場上有效、或把 7.4.7 做成一次性的引擎，A 最後手牌會是 8 張或沒有第二次捨牌；
  把「打出後進墓場」誤判成捨棄的引擎，B 會抽 2 張。
refs:
  rules: [10.3.4, 7.4.7, 5.12.1, 10.6.2.8.3, 4.7.3.1]
  qa: [Q270, Q242]
evidence:
  - ref: Q270
    quote: はい。1枚引きます。その場合、手札の枚数が再び上限を超過するため、改めて手札が7枚になるように捨てる必要があります。
  - ref: Q242
    quote: いいえ。このスペルを手札から捨てていないため、デッキから1枚引くことはできません。
  - ref: cr 7.4.7
    quote: ターンプレイヤーは、自身の手札のカードの枚数が手札の上限を超えている場合、超過分の枚数に等しい枚数のカードを捨てます。これによりカードを捨てた場合、その後にチェックタイミングが発生し、再び 7.4.7 に戻ります。
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 結束階段捨光の道筋 → 抽 1 → 再捨 1
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 4, P2: 3}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ビショップ, life: 20}
          pp: {current: 0, max: 4}
          zones:
            hand:
              - {id: a1, card: BP01-170}          # 光の道筋
              - {id: a2, card: BP01-173}
              - {id: a3, card: BP01-173}
              - {id: a4, card: BP01-173}
              - {id: a5, card: BP01-176}
              - {id: a6, card: BP01-176}
              - {id: a7, card: BP01-176}
              - {id: a8, card: BP01-180}          # 合計 8 張
            deck:
              - {id: d1, card: BP01-173}
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 4}
          zones:
            hand:
              - {filler: 3}
            deck:
              - {id: b1, card: BP01-173}          # P2 下回合開始階段抽到
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: end-phase}
      - {n: 2, by: P2, at: quick, do: pass}
      # 7.4.7 手牌上限捨牌（9.2）；P1 沒有【守護】從者 → 7.4.3 沒有輸入點
      - {n: 3, by: P1, at: end, do: end-discard, select: [a1]}
      - {n: 4, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 1}, event: {discarded: a1}}}
      - {n: 5, by: P1, at: end, do: end-discard, select: [a8]}
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, line: 1}, event: {discarded: a1}}}
        assert:
          P1.cemetery: [a1]
        events:
          - {kind: 捨てる, player: P1, object: a1}
          - {kind: 待機, ability: {source: a1, line: 1}, event: {discarded: a1}}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P1.hand: [a2, a3, a4, a5, a6, a7, a8, d1]
        events:
          - {kind: 引く, player: P1, object: d1}
      - at: after-decision-5
        view: omniscient
        outcome: resolved
        assert:
          turn: {active: P2, phase: main}
          P1.hand: [a2, a3, a4, a5, a6, a7, d1]
          P1.cemetery: [a1, a8]
          P2.hand: [b1, filler: 3]
        events:
          - {kind: 捨てる, player: P1, object: a8}
        forbidden_events:
          - {kind: 待機}

  - name: B 打出光の道筋 → 只抽本體的 1 張；進墓場不算捨棄
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 4, P2: 3}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ビショップ, life: 20}
          pp: {current: 2, max: 4}
          zones:
            hand:
              - {id: a1, card: BP01-170}
            deck:
              - {id: d1, card: BP01-173}
              - {id: d2, card: BP01-173}
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 4}
          zones:
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.hand: [d1]
          P1.deck: [d2, filler: 20]
          P1.cemetery: [a1]
          semantic_state.pending_triggers: []
        events:
          - {kind: 引く, player: P1, object: d1}
        events_exact: [引く]
        forbidden_events:
          - {kind: 待機}
