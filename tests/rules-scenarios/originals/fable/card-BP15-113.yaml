schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP15-113
kind: card
must_pass: true
mechanisms: [體力門檻常駐判定, 條件式永續能力, '12.13', 10.1.1.3, 持續效果與禁止]
cards: [BP15-113, BP19-090, BP01-177, BP01-173]
why: >-
  干絶の飢餓・ギルネリーゼ「自分のリーダーの体力が10以下である限り、これは【ドレイン】を持つ」是永續能力（Q2041）：
  條件隨時重新判定，不是上場時判定一次。A：體力 11 → 攻擊沒有ドレイン。B：體力 10 → 有。
  C：上場時 11，攻擊前先用バイオレントスクリーム【2】自傷到 10 → 攻擊時有ドレイン。D：上場時 10，攻擊前用ヒーリングエンジェル 回到 11 → 攻擊時失去ドレイン。
  ドレイン 的回復量等於 8.4.9 造成的攻擊傷害（12.13.2）。ドレイン 本身是自動能力（12.13.1）：攻擊傷害後先待機，由 P1 在檢查時點以 choose-pending 打出才回復。
  互驗第二輪修正（astra）：原本 P2 場上放了アクト狀態的天剣の乙女【守護】，依 12.8.2 會強制成為攻擊目標 → 已移除；B、C 補上ドレイン 的 choose-pending。
discriminates: >-
  在從者上場（或局面開始）時判定一次的引擎：C 不會回復（體力 10 而非 12）、D 會回復（12 而非 11）。
  在攻擊宣告時判定而非造成傷害時判定的引擎，本題各局面結果相同（判定點都在攻擊前），只由 C／D 區分「一次」與「常駐」。
refs:
  rules: [10.1.1.3, 10.1.1.3.1, 12.13.1, 12.13.2, 12.13.2.1, 8.4.9, 10.7.3.1, 10.4.7.4]
  qa: [Q2041, Q2623]
evidence:
  - ref: Q2041
    quote: はい。永続能力です。自分のリーダーの体力が10以下である限り、『干絶の飢餓・ギルネリーゼ』は【ドレイン】を持ちます。『干絶の飢餓・ギルネリーゼ』を場に出した後に自分のリーダーの体力が11以上から10以下になった場合、【ドレイン】を持ちます。『干絶の飢餓・ギルネリーゼ』を場に出した後に自分のリーダーの体力が10以下から11以上になった場合、【ドレイン】を失います。
  - ref: cr 12.13.2
    quote: ‘【ドレイン】’は‘このフォロワーが攻撃によるダメージを与えたとき、あなたのリーダーの体力をそのダメージ数に等しい値増加する’を意味します。
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 體力 11 → 攻擊リーダー → 沒有ドレイン
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 5, P2: 4}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ナイトメア, life: 11}
          pp: {current: 5, max: 5}
          zones:
            field:
              - {id: a1, card: BP15-113}          # 干絶の飢餓・ギルネリーゼ 2/2
            hand:
              - {id: s1, card: BP19-090}          # バイオレントスクリーム
              - {id: h1, card: BP01-177}          # ヒーリングエンジェル（ファンファーレ 体力+1）
            deck:
              - {id: d1, card: BP01-173}
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 4}
          zones:
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: attack, attacker: a1, target: P2.leader}
      - {n: 2, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 18
          P1.leader.life: 11
        events:
          - {kind: ダメージ, source: a1, target: P2.leader, amount: 2}
        forbidden_events:
          - {kind: 体力増加}
          - {kind: 待機}

  - name: B 體力 10 → 攻擊リーダー → ドレイン 回復 2
    inherit: A 體力 11 → 攻擊リーダー → 沒有ドレイン
    setup:
      players:
        P1:
          leader: {class: ナイトメア, life: 10}
    decisions:
      - {n: 1, by: P1, at: main, do: attack, attacker: a1, target: P2.leader}
      - {n: 2, by: P2, at: quick, do: pass}
      # ドレイン 是被給予的自動能力（12.13.1）：能力指稱依 9.12 寫提供文字的行與關鍵字
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2, keyword: ドレイン, rule: 12.13.2}}}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, line: 2, keyword: ドレイン, rule: 12.13.2}}}
        assert:
          P2.leader.life: 18
          P1.leader.life: 10
        events:
          - {kind: ダメージ, source: a1, target: P2.leader, amount: 2}
          - {kind: 待機, ability: {source: a1, line: 2, keyword: ドレイン, rule: 12.13.2}}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 18
          P1.leader.life: 12
          semantic_state.pending_triggers: []
        events:
          - {kind: プレイ, ability: {source: a1, line: 2, keyword: ドレイン, rule: 12.13.2}}
          - {kind: 体力増加, target: P1.leader, amount: 2}

  - name: C 上場時 11，先自傷到 10 再攻擊 → 攻擊時有ドレイン
    inherit: A 體力 11 → 攻擊リーダー → 沒有ドレイン
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: s1, options: [2]}
      - {n: 2, by: P1, at: resolve, of: {decision: 1, occurrence: 1}, do: resolve-choice, choice: execute}
      - {n: 3, by: P1, at: main, do: attack, attacker: a1, target: P2.leader}
      - {n: 4, by: P2, at: quick, do: pass}
      - {n: 5, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2, keyword: ドレイン, rule: 12.13.2}}}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.leader.life: 10
          P1.pp.current: 4
          P1.hand: [h1, d1]
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, line: 2, keyword: ドレイン, rule: 12.13.2}}}
        assert:
          P2.leader.life: 18
          P1.leader.life: 10
        events:
          - {kind: ダメージ, source: a1, target: P2.leader, amount: 2}
          - {kind: 待機, ability: {source: a1, line: 2, keyword: ドレイン, rule: 12.13.2}}
      - at: after-decision-5
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 18
          P1.leader.life: 12
          semantic_state.pending_triggers: []
        events:
          - {kind: 体力増加, target: P1.leader, amount: 2}

  - name: D 上場時 10，先回復到 11 再攻擊 → 攻擊時已失去ドレイン
    inherit: A 體力 11 → 攻擊リーダー → 沒有ドレイン
    setup:
      players:
        P1:
          leader: {class: ナイトメア, life: 10}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: h1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: h1, line: 2}}}
      - {n: 3, by: P1, at: main, do: attack, attacker: a1, target: P2.leader}
      - {n: 4, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.leader.life: 11
          P1.pp.current: 2
        events:
          - {kind: 体力増加, target: P1.leader, amount: 1}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 18
          P1.leader.life: 11
          semantic_state.pending_triggers: []
        forbidden_events:
          - {kind: 体力増加}
          - {kind: 待機}
