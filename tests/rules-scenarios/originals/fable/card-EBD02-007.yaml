schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-EBD02-007
kind: card
must_pass: true
mechanisms: [追加回合可疊加, '5.28', 5.28.1.1, 3.3.2.2, 額外回合、跳過、勝利, 替代費用, 回合特定時點]
cards: [EBD02-007, BP01-170, BP01-173]
why: >-
  次元の超越「このターンのあと、自分の追加ターンを行う」：在追加回合裡再打一張 → 再一個追加回合（Q193；5.28.1.1 逐一執行）。
  每個追加回合都是完整的回合：開始階段 PP 最大值 +1、PP 回復、抽牌，經過回合數也計入（3.3.2.2）。
  費用用「墓場のスペル10枚を消滅：コストを7にする」的替代費用（Q192：正在打的這張不算）。
discriminates: >-
  只允許一個追加回合、或把第二張的追加回合合併掉的引擎：after-decision-6 會停在 P2 的回合。
  追加回合不做開始階段處理的引擎：after-decision-3 的 PP／手牌／經過回合數不同。
  把「コストを7にする」之後又扣 12 PP 的引擎：after-decision-1 會 cannot-play。
refs:
  rules: [5.28.1, 5.28.1.1, 3.3.2, 3.3.2.2, 7.2.1, 7.2.2, 7.2.4, 7.4.9, 10.6.2.5.1.3, 10.4.4.1]
  qa: [Q193, Q192]
evidence:
  - ref: Q193
    quote: はい。行います。
  - ref: cr 5.28.1.1
    quote: ‘追加ターンを行う’指示が複数ある場合、その中で最も後から適用されたものを 1 つ適用します。これを、すべての‘追加ターンを行う’指示を実行し終えるまで、本来実行するターンの直前で繰り返します。
  - ref: cr 3.3.2.2
    quote: あるプレイヤーが追加ターンを行った（5.28）場合、そのターンは経過ターンに数えます。
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 第 1 張 → 追加回合 → 追加回合裡打第 2 張 → 再一個追加回合 → 之後才輪到 P2
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 8, P2: 7}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ウィッチ, life: 20}
          pp: {current: 8, max: 8}
          zones:
            hand:
              - {id: a1, card: EBD02-007}         # 次元の超越
              - {id: a2, card: EBD02-007}
            cemetery:
              - {id: s1, card: BP01-170}
              - {id: s2, card: BP01-170}
              - {id: s3, card: BP01-170}
              - {id: s4, card: BP01-170}
              - {id: s5, card: BP01-170}
              - {id: s6, card: BP01-170}
              - {id: s7, card: BP01-170}
              - {id: s8, card: BP01-170}
              - {id: s9, card: BP01-170}
              - {id: s10, card: BP01-170}
              - {id: s11, card: BP01-170}
              - {id: s12, card: BP01-170}
              - {id: s13, card: BP01-170}
              - {id: s14, card: BP01-170}
              - {id: s15, card: BP01-170}
              - {id: s16, card: BP01-170}
              - {id: s17, card: BP01-170}
              - {id: s18, card: BP01-170}
              - {id: s19, card: BP01-170}
              - {id: s20, card: BP01-170}
            deck:
              - {id: d1, card: BP01-173}
              - {id: d2, card: BP01-173}
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 7}
          zones:
            hand:
              - {filler: 3}
            deck:
              - {id: p1, card: BP01-173}
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, optional_costs: {additional: {banish: [s1, s2, s3, s4, s5, s6, s7, s8, s9, s10]}}}
      - {n: 2, by: P1, at: main, do: end-phase}
      - {n: 3, by: P2, at: quick, do: pass}
      - {n: 4, by: P1, at: main, do: play, card: a2, optional_costs: {additional: {banish: [s11, s12, s13, s14, s15, s16, s17, s18, s19, s20]}}}
      - {n: 5, by: P1, at: main, do: end-phase}
      - {n: 6, by: P2, at: quick, do: pass}
      - {n: 7, by: P1, at: main, do: end-phase}
      - {n: 8, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 1
          P1.banish_count: 10
          P1.cemetery: [s11, s12, s13, s14, s15, s16, s17, s18, s19, s20, a1]
          P1.hand: [a2]
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          turn: {active: P1, phase: main}
          turn.elapsed_turns.P1: 9
          turn.elapsed_turns.P2: 7
          P1.pp: {current: 9, max: 9}
          P1.hand: [a2, d1]
        events:
          - {kind: 引く, player: P1, object: d1}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 2
          P1.banish_count: 20
          P1.cemetery: [a1, a2]
      - at: after-decision-6
        view: omniscient
        outcome: resolved
        assert:
          turn: {active: P1, phase: main}
          turn.elapsed_turns.P1: 10
          turn.elapsed_turns.P2: 7
          P1.pp: {current: 10, max: 10}
          P1.hand: [d1, d2]
      - at: after-decision-8
        view: omniscient
        outcome: resolved
        assert:
          turn: {active: P2, phase: main}
          turn.elapsed_turns.P1: 10
          turn.elapsed_turns.P2: 8
          P2.pp: {current: 8, max: 8}
          P2.hand_count: 4
          P1.hand: [d1, d2]
