schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: rule-10.5.2-02
kind: rule
must_pass: true
mechanisms: [10.5.2, 10.7.3.1, 10.7.3.2, 11.1.3, 檢查時點迴圈, 全場傷害同時破壞雙方多隻]
cards: [BP01-099, BP14-024, BP11-027, BP08-078, BP04-092, BP01-173, BP01-176]
why: >-
  竜の翼「フォロワーすべてに2ダメージ」同時破壞雙方各兩隻有ラストワード的從者。10.5.2.2：回合玩家 P1 先處理自己的兩個（每結算一個都回到 10.5.2.1 再查回合玩家），
  P2 完全不能插入；P1 都處理完才輪到 P2（10.5.2.3）。P2 的サロメ需要目標，此時 P1 場上已空 → 取消一次（10.7.3.2），
  デモンビーター照常結算。局面 B 給 P1 留一隻存活的從者，サロメ有目標可選。
discriminates: >-
  after-decision-1 的 awaiting 只能列 P1 的兩個待機；「雙方輪流」或「單一 FIFO」的實作會列出 P2 的或讓 P2 先動。
  局面 A 各比對點的 events_exact [プレイ] 合起來必須是 a1、a2、b2（b1 取消、沒有プレイ）；把「選不到目標」實作成跳過其他待機或卡住的引擎，b2 的 +1 不會發生（P2 體力 18 而非 19）。
refs:
  rules: [10.5.2.1, 10.5.2.2, 10.5.2.3, 10.5.2.4, 10.7.2.1, 10.7.3, 10.7.3.1, 10.7.3.2, 10.6.2.3.3, 11.1.3, 11.3.1, 12.5.3, 13.4.1.2]
  qa: [Q109, Q1110]
evidence:
  - ref: Q109
    quote: いいえ。自分の場と相手の場にあるフォロワーすべてがダメージを受けます。
  - ref: cr 10.5.2.2
    quote: ターンプレイヤーがマスターであるいずれかの自動能力が待機状態になっている場合、ターンプレイヤーはそのうち 1 つを選び、プレイと解決を行い、その後 10.5.2.1 に戻ります。
    derivation:
      - 回到 10.5.2.1 後再次先查 10.5.2.2；P1 還有待機就繼續由 P1 選；P1 清空後才到 10.5.2.3
  - ref: cr 10.5.2.3
    quote: 非ターンプレイヤーがマスターであるいずれかの自動能力が待機状態になっている場合、非ターンプレイヤーはそのうち 1 つを選び、プレイと解決を行い、その後 10.5.2.1 に戻ります。
  - ref: Q1110
    quote: 相手の場のフォロワーを選ぶことができないので、このフォロワーの《ファンファーレ》能力や《ラストワード》能力をプレイすることができず、自分のリーダーの体力を+1することができません。
    derivation:
      - 局面 A：P2 打出サロメ的ラストワード時 P1 場上沒有從者 → 不能打出 → 10.7.3.2 取消一次；體力 +1 也不發生
  - ref: cr 13.4.1.2
    quote: ‘【覚醒】状態’とは‘あなたの現在の PP 最大値が 7 以上’を意味します。
    derivation:
      - P1 PP 最大值 6 → 非覚醒 → 竜の翼是 2 傷害
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 雙方各兩個ラストワード；P1 先清完；P2 的サロメ選不到目標取消，デモンビーター照常
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 6, P2: 5}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 6, max: 6}
          ep: 2
          zones:
            field:
              - {id: a1, card: BP14-024}          # 辺境の騎士見習い 1/1（ラストワード：1枚引く）
              - {id: a2, card: BP11-027}          # アウトローガンナー 2/2（ラストワード：相手のリーダーすべてに2ダメージ）
            hand:
              - {id: a3, card: BP01-099}          # 竜の翼
            deck:
              - {id: a4, card: BP01-173}
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ナイトメア, life: 20}
          pp: {current: 0, max: 6}
          ep: 2
          zones:
            field:
              - {id: b1, card: BP08-078}          # サロメ 1/2（ラストワード：相手の場のフォロワー1体に2ダメージ、自分のリーダー+1）
              - {id: b2, card: BP04-092}          # デモンビーター 1/1（ラストワード：自分のリーダー+1）
              - {id: b3, card: BP01-173}          # ファイター 2/3：存活
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a3}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a2, line: 2}}}
      - {n: 4, by: P2, at: check-timing, do: choose-pending, pending: {ability: {source: b1, line: 1, keyword: ラストワード}}}
      - {n: 5, by: P2, at: check-timing, do: choose-pending, pending: {ability: {source: b2, line: 3}}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, line: 2}}}
            - {do: choose-pending, pending: {ability: {source: a2, line: 2}}}
        assert:
          P1.pp.current: 3
          P1.field: []
          P2.field: [b3]
          P2.field.b3: {hp: 1}
          P1.cemetery: [a1, a2, a3]
          P2.cemetery: [b1, b2]
        events:
          - {kind: ダメージ, source: a3, target: a1, amount: 2, group: 1}
          - {kind: ダメージ, source: a3, target: a2, amount: 2, group: 1}
          - {kind: ダメージ, source: a3, target: b1, amount: 2, group: 1}
          - {kind: ダメージ, source: a3, target: b2, amount: 2, group: 1}
          - {kind: ダメージ, source: a3, target: b3, amount: 2, group: 1}
          - {kind: 破壊, object: a1, by: rule-11.3.1, group: 2}
          - {kind: 破壊, object: a2, by: rule-11.3.1, group: 2}
          - {kind: 破壊, object: b1, by: rule-11.3.1, group: 2}
          - {kind: 破壊, object: b2, by: rule-11.3.1, group: 2}
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a2, line: 2}}}
        assert:
          P1.hand: [a4]
        events:
          - {kind: プレイ, ability: {source: a1, line: 2}}
        events_exact: [プレイ]
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        awaiting:
          by: P2
          choices:
            - {do: choose-pending, pending: {ability: {source: b1, line: 1, keyword: ラストワード}}}
            - {do: choose-pending, pending: {ability: {source: b2, line: 3}}}
        assert:
          P2.leader.life: 18
        events:
          - {kind: プレイ, ability: {source: a2, line: 2}}
        events_exact: [プレイ]
      - at: after-decision-4
        view: omniscient
        outcome: pending-cancelled
        awaiting:
          by: P2
          choices:
            - {do: choose-pending, pending: {ability: {source: b2, line: 3}}}
        assert:
          P2.leader.life: 18
        events:
          - {kind: 待機取消, ability: {source: b1, line: 1, keyword: ラストワード}}
        forbidden_events:
          - {kind: プレイ}
          - {kind: 体力増加}
      - at: after-decision-5
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 19
          semantic_state.pending_triggers: []
        events:
          # 比對範圍是 after-decision-4 → after-decision-5：只有 b2（自驗修正；a1、a2 的プレイ分別在決定 2、3 的範圍）
          - {kind: プレイ, ability: {source: b2, line: 3}}
        events_exact: [プレイ]

  - name: B P1 留有存活從者 → サロメ有目標，四個都結算；順序仍是 P1 兩個先
    inherit: A 雙方各兩個ラストワード；P1 先清完；P2 的サロメ選不到目標取消，デモンビーター照常
    setup:
      players:
        P1:
          zones:
            field:
              - {id: a1, card: BP14-024}
              - {id: a2, card: BP11-027}
              - {id: a5, card: BP01-176}          # 天剣の乙女 4/6：竜の翼後體力 4
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a3}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a2, line: 2}}}
      - {n: 4, by: P2, at: check-timing, do: choose-pending, pending: {ability: {source: b1, line: 1, keyword: ラストワード}}, targets: {1: [a5]}}
      - {n: 5, by: P2, at: check-timing, do: choose-pending, pending: {ability: {source: b2, line: 3}}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, line: 2}}}
            - {do: choose-pending, pending: {ability: {source: a2, line: 2}}}
        assert:
          P1.field: [a5]
          P1.field.a5: {hp: 4}
      - at: after-decision-5
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a5: {hp: 2}
          P2.leader.life: 20
          P1.hand: [a4]
          semantic_state.pending_triggers: []
        events:
          - {kind: プレイ, ability: {source: a1, line: 2}}
          - {kind: プレイ, ability: {source: a2, line: 2}}
          - {kind: プレイ, ability: {source: b1, line: 1, keyword: ラストワード}}
          - {kind: プレイ, ability: {source: b2, line: 3}}
        events_exact: [プレイ]
