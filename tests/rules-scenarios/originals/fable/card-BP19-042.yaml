schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP19-042
kind: card
must_pass: true
mechanisms: [融合, '12.18', 12.18.3, 10.6.2.1.3, 10.6.2.8.1.1, 手牌中有效的能力, EX 區打出]
cards: [BP19-042, BP01-173, BP19-T02]
why: >-
  忘我の才媛「{起動}【融合】トークンでないフォロワー1枚：これに融合カウンター1個を置く」在手牌有效（Q2575）；12.18.2 展開為「從手牌捨（或從 EX 放墓場）1 張符合條件的卡，
  再把手牌的這張放到 EX：放融合カウンター」。EX 區的計數器隨打出帶到解決領域與場上（10.6.2.1.3、10.6.2.8.1.1）；ファンファーレ「融合カウンター1個を取る：」付得出才出多頭の実験体。
  手牌與 EX 都沒有可融合的卡 → 不能打出（12.18.3）。
discriminates: >-
  沒把融合當成手牌中的起動能力的引擎 A 會 cannot-activate；計數器沒從 EX 帶到場上的引擎，ファンファーレ付不出 → 取消、沒有 token；
  允許融合 0 張的引擎 B 會 resolved。
refs:
  rules: [12.18.2, 12.18.2.2, 12.18.3, 12.18.4, 10.3.4, 10.6.2.1.3, 10.6.2.8.1.1, 10.1.1.2.2, '15.1']
  qa: [Q2575]
evidence:
  - ref: cr 12.18.2
    quote: ‘《起動》 【融合】 （条件）：（効果）’は‘《起動》 （条件）を満たす他のカードを、手札から捨てるか EX エリアから墓場に置く。手札にあるこのカードを EX エリアに置く。：（効果）’を意味します。
  - ref: cr 12.18.3
    quote: なんらかの理由でコストとして手札から捨てられるカードも EX エリアから墓場に移動するカードも存在しない場合、（効果）は実行されません。
  - ref: cr 10.6.2.8.1.1
    quote: 解決領域のカードになんらかの効果が適用されている、またはそのカードになんらかのカウンターが置かれている場合、場に置かれたカードにも同じ効果やカウンターが適用されます。
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 從手牌融合ファイター → 進 EX 帶 1 個融合カウンター → 從 EX 打出 → ファンファーレ付計數器出 token
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 4, P2: 3}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ウィッチ, life: 20}
          pp: {current: 3, max: 4}
          zones:
            hand:
              - {id: a1, card: BP19-042}          # 忘我の才媛（コスト3）
              - {id: a2, card: BP01-173}          # ファイター（トークンでないフォロワー）
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 4}
          zones:
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: activate, ability: {source: a1, line: 3}, costs: {1: [a2]}}
      - {n: 2, by: P1, at: main, do: play, card: a1}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.hand: []
          P1.cemetery: [a2]
          P1.ex: [a1]
          P1.ex.a1: {counters: {融合カウンター: 1}}
          P1.pp.current: 3
        events:
          - {kind: 捨てる, player: P1, object: a2}
          - {kind: 移動, object: a1, from: P1.hand, to: P1.ex}
          - {kind: カウンター, object: a1, name: 融合カウンター, delta: 1}
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a1, line: 2}}}
        assert:
          P1.pp.current: 0
          P1.field: [a1]
          P1.field.a1: {counters: {融合カウンター: 1}, entered_from: ex, entered_by: play}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a1: {counters: {融合カウンター: 0}}
          P1.field: [a1, new-1]
        events:
          - {kind: 費用成立, ability: {source: a1, line: 2}}
          - {kind: カウンター, object: a1, name: 融合カウンター, delta: -1}
          - {kind: 場に出す, object: new-1, card: BP19-T02, to: P1.field}

  - name: B 手牌與 EX 都沒有可融合的卡 → 不能起動
    inherit: A 從手牌融合ファイター → 進 EX 帶 1 個融合カウンター → 從 EX 打出 → ファンファーレ付計數器出 token
    setup:
      players:
        P1:
          zones:
            hand:
              - {id: a1, card: BP19-042}
    decisions:
      - {n: 1, by: P1, at: main, do: activate, ability: {source: a1, line: 3}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-activate
        assert:
          P1.hand: [a1]
          P1.ex: []
