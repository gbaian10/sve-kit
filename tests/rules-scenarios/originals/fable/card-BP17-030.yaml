schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP17-030
kind: card
must_pass: true
mechanisms: [打出時的選擇, 名稱包含比對, 10.4.4.1, 4.1.4, 區域移動清除修正, 4.8.3.2]
cards: [BP17-030, BP17-022, BP17-019]
why: >-
  隠伏の記憶「これをプレイする際、自分の場の「カード名に『リオード』を含むフォロワー」を選んでいたなら、コストを-2する／自分の場の暗殺者・フォロワー1体を選ぶ。それをEXエリアに置く」：
  費用取決於打出時選的目標（10.6.2.3 在 10.6.2.5 之前）；選『月光の執行者・リオード』→ 費用 0；選其他暗殺者 → 2。移到 EX 的從者是新物件，傷害與效果全部清除（Q2236）。
discriminates: >-
  先算費用再選目標的引擎（或用卡面費用檢查可否打出的引擎）在 A（PP 0）會 cannot-play；沒清除傷害的引擎在 A 之後從 EX 打出時體力不對（本題以 EX 內容為觀察點）；
  B 中 PP 0 選エリカ應該 cannot-play。
refs:
  rules: [10.6.2.3, 10.6.2.5, 10.4.4.1, 10.10.2.4, 2.1.2, 4.1.4, 4.8.3.2]
  qa: [Q2236, Q2235]
evidence:
  - ref: cr 10.6.2.5
    quote: プレイするためのコストがある場合、そのコストを決定し、その後すべてのコストを支払います。
    derivation:
      - 10.6.2.3 選目標在 10.6.2.5 決定費用之前 → 「選んでいたなら」在決定費用時已知
  - ref: Q2236
    quote: はい。失われます。
status: draft
author: fable
verified_by: []

scenarios:
  - name: A PP 0：選リオード → 費用 0 → 打出，リオード進 EX
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 4, P2: 3}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 4}
          zones:
            field:
              - {id: a1, card: BP17-022, state: {hp: 1}}     # 月光の執行者・リオード 1/2（暗殺者），已受傷
              - {id: a2, card: BP17-019}                     # 忠義の剣士・エリカ 1/1（暗殺者，名字不含リオード）
            hand:
              - {id: a3, card: BP17-030}                     # 隠伏の記憶（コスト2）
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 0, max: 4}
          zones:
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a3, targets: {1: [a1]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P1.field: [a2]
          P1.ex: [a1]
          P1.cemetery: [a3]
        events:
          - {kind: 移動, object: a1, from: P1.field, to: P1.ex}

  - name: B PP 0：選エリカ → 費用 2 → 不能打出
    inherit: A PP 0：選リオード → 費用 0 → 打出，リオード進 EX
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a3, targets: {1: [a2]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-play
        assert:
          P1.hand: [a3]
          P1.field: [a1, a2]
          P1.ex: []

  - name: B2 PP 2：選エリカ → 付 2 → エリカ進 EX
    inherit: A PP 0：選リオード → 費用 0 → 打出，リオード進 EX
    setup:
      players:
        P1:
          pp: {current: 2, max: 4}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a3, targets: {1: [a2]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P1.field: [a1]
          P1.ex: [a2]
