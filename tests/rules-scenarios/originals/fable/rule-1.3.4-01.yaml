schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: rule-1.3.4-01
kind: rule
must_pass: true
mechanisms: [1.3.4, '5.12', 1.3.2, 同時選擇：回合玩家先選, 持續效果與禁止]
cards: [BP10-076, BP01-173, BP01-176, BP01-180, BP01-099]
why: >-
  《節制》・ルーゼン「各プレイヤーは、自身の手札が2枚になるように自身の手札を捨てる」：兩位玩家都要選擇捨哪些 → 1.3.4 回合玩家先選並執行，
  非回合玩家看到結果後才選。局面 B：回合玩家手牌已 ≤2 → 依 1.3.2 不做，只有非回合玩家捨。
discriminates: >-
  讓 P2 先選、或兩人同時盲選的引擎，after-decision-2 的 awaiting 不會是 P1；P2 視角在輪到自己時必須已看得到 P1 捨的卡（knowledge）。
  局面 B：要求 P1 也做一次「捨 0 張」決定而停下來的引擎，after-decision-2 會 paused 等 P1 而不是等 P2。
refs:
  rules: [1.3.4, 1.3.4.1, 5.12.1, 1.3.2, 4.9.2, 12.4.3]
  qa: []
evidence:
  - ref: cr 1.3.4
    quote: 複数のプレイヤーが同時になんらかの選択を伴う処理を行うよう求められた場合、…それがゲーム中であればターンプレイヤーから先に処理を行います。非ターンプレイヤーは、ターンプレイヤーの処理の内容を知ってから自分の選択を行います。
    derivation:
      - 「各プレイヤーは…捨てる」是兩位玩家各自伴隨選擇的同一處理 → P1 先選並捨、P2 再選
      - 墓場是公開領域（4.9.2）→ P2 選時能識別 P1 捨了哪張
  - ref: cr 1.3.2
    quote: なんらかの理由によりプレイヤーが実行不可能なことを行うように求められた場合、それは単に行われません。
    derivation:
      - 局面 B：P1 手牌 1 張，「2枚になるように捨てる」＝捨 0 張 → 沒有選擇、什麼都不做
status: draft
author: fable
verified_by: []

scenarios:
  - name: A P1（回合玩家）先選捨 1 張，P2 看到後再選捨 2 張
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 7, P2: 6}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ナイトメア, life: 20}
          pp: {current: 7, max: 7}
          zones:
            hand:
              - {id: a1, card: BP10-076}          # 《節制》・ルーゼン
              - {id: a2, card: BP01-173}
              - {id: a3, card: BP01-176}
              - {id: a4, card: BP01-180}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 0, max: 7}
          zones:
            hand:
              - {id: b1, card: BP01-173}
              - {id: b2, card: BP01-176}
              - {id: b3, card: BP01-099}
              - {id: b4, card: BP01-099}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 3}}}
      - {n: 3, by: P1, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, select: [a4]}
      - {n: 4, by: P2, at: resolve, of: {decision: 2, occurrence: 2}, do: resolve-choice, select: [b3, b4]}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: paused
        awaiting:
          by: P1
          choices:
            - {do: resolve-choice, select: [a2]}
            - {do: resolve-choice, select: [a3]}
            - {do: resolve-choice, select: [a4]}
      - at: after-decision-3
        view: omniscient
        outcome: paused
        awaiting:
          by: P2
          choices:
            - {do: resolve-choice, select: [b1, b2]}
            - {do: resolve-choice, select: [b1, b3]}
            - {do: resolve-choice, select: [b1, b4]}
            - {do: resolve-choice, select: [b2, b3]}
            - {do: resolve-choice, select: [b2, b4]}
            - {do: resolve-choice, select: [b3, b4]}
        assert:
          P1.hand: [a2, a3]
          P1.cemetery: [a4]
        events:
          - {kind: 捨てる, player: P1, object: a4}
      - at: after-decision-3
        view: P2
        outcome: paused
        awaiting:
          by: P2
          choices:
            - {do: resolve-choice, select: [b1, b2]}
            - {do: resolve-choice, select: [b1, b3]}
            - {do: resolve-choice, select: [b1, b4]}
            - {do: resolve-choice, select: [b2, b3]}
            - {do: resolve-choice, select: [b2, b4]}
            - {do: resolve-choice, select: [b3, b4]}
        assert:
          P1.cemetery: [a4]
          P1.hand_count: 2
          knowledge: {knows: [a4], does_not_know: [a2, a3]}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P2.hand: [b1, b2]
          P2.cemetery: [b3, b4]
          P1.field: [a1]
        events:
          # 比對範圍是 after-decision-3 → after-decision-4：a4 的捨棄在前一個範圍（自驗修正）；P2 同一次捨 2 張 → 同時（互驗第二輪修正，astra）
          - {kind: 捨てる, player: P2, object: b3, group: 1}
          - {kind: 捨てる, player: P2, object: b4, group: 1}

  - name: B P1 手牌已 ≤2 → P1 不捨、不停下；只有 P2 選
    inherit: A P1（回合玩家）先選捨 1 張，P2 看到後再選捨 2 張
    setup:
      players:
        P1:
          zones:
            hand:
              - {id: a1, card: BP10-076}
              - {id: a2, card: BP01-173}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 3}}}
      - {n: 3, by: P2, at: resolve, of: {decision: 2, occurrence: 1}, do: resolve-choice, select: [b1, b2]}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: paused
        awaiting:
          by: P2
          choices:
            - {do: resolve-choice, select: [b1, b2]}
            - {do: resolve-choice, select: [b1, b3]}
            - {do: resolve-choice, select: [b1, b4]}
            - {do: resolve-choice, select: [b2, b3]}
            - {do: resolve-choice, select: [b2, b4]}
            - {do: resolve-choice, select: [b3, b4]}
        assert:
          P1.hand: [a2]
          P1.cemetery: []
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.hand: [a2]
          P2.hand: [b3, b4]
          P2.cemetery: [b1, b2]
        forbidden_events:
          - {kind: 捨てる, player: P1}
