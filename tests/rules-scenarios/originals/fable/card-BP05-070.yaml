schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP05-070
kind: card
must_pass: true
mechanisms: [隨機與擲骰, '5.19', 持續效果與禁止, 10.4.4.1, 10.2.1.3.3, 對手回合中的費用增加]
cards: [BP05-070, BP05-071, BP01-173, BP01-176, BP01-180]
why: >-
  沈黙の絶傑・ルルナイ【進化時】「相手プレイヤーすべては、自身の手札をランダムに1枚捨てる」：隨機選取由受控亂數指定（5.19）。
  永續能力「相手がスペルをプレイする際、コストを+1する」是費用取代效果（10.2.1.3.3）：對手 PP 1 打 1 費法術付不出 → 不能打出；PP 2 可以。
discriminates: >-
  隨機捨牌沒有依 random_selections 的引擎會捨到別張；沒把對手回合的費用 +1 套用、或套成永久改變卡片費用的引擎，B 的 PP 1 會允許打出。
refs:
  rules: [5.19.1, 5.12.1, 10.2.1.3.3, 10.4.4.1, 10.6.2.5.4, 12.6.2]
  qa: [Q736, Q735, Q733]
evidence:
  - ref: Q736
    quote: ダイスロールなど、無作為な方法で選択します。
  - ref: cr 10.4.4.1
    quote: カードをプレイする際のコストの数値を変更する効果は、このカードのコストの情報の値を変更するのではなく、そのコストのために減少する PP の点数を変更します。
  - ref: Q733
    quote: はい。コストは+1されます。相手は追加で1PPを支払わなければそのスペルをプレイすることはできません。
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 進化時：對手隨機捨 1 張（受控亂數指定 b2）
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 4, P2: 3}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ナイトメア, life: 20}
          pp: {current: 1, max: 4}
          ep: 2
          zones:
            field:
              - {id: a1, card: BP05-070}          # 沈黙の絶傑・ルルナイ 3/3
            evolve_deck:
              - {id: a2, card: BP05-071}
            hand:
              - {filler: 2}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 4}
          zones:
            hand:
              - {id: b1, card: BP01-173}
              - {id: b2, card: BP01-176}
              - {id: b3, card: BP01-180}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: evolve, source: a1, ability: {source: a1, line: 1}, evolve_card: a2, pay: {pp: 0, ep: 1, sep: 0}}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, card: BP05-071, line: 2}}}
    random:
      random_selections:
        - {n: 1, from: P2.hand, result: [b2]}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.hand: [b1, b3]
          P2.cemetery: [b2]
          P1.field.a1: {evolved: true, power: 4, hp: 4}
        events:
          - {kind: 捨てる, player: P2, object: b2}

  - name: B 對手回合：P2 打 1 費法術要付 2；PP 1 不能打出，PP 2 可以
    setup:
      turn: {active: P2, first_player: P1, elapsed_turns: {P1: 4, P2: 4}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ナイトメア, life: 20}
          pp: {current: 0, max: 4}
          zones:
            field:
              - {id: a1, card: BP05-070}
            hand:
              - {filler: 2}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 1, max: 4}
          zones:
            hand:
              - {id: b3, card: BP01-180}          # エンジェルバレッジ（コスト1 → 実際 2）
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P2, at: main, do: play, card: b3}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-play
        awaiting:
          by: P2
          choices:
            - {do: end-phase}
        assert:
          P2.pp.current: 1
          P2.hand: [b3]
          P1.field.a1: {hp: 3}

  - name: B2 PP 2 → 付 2 打出
    inherit: B 對手回合：P2 打 1 費法術要付 2；PP 1 不能打出，PP 2 可以
    setup:
      players:
        P2:
          pp: {current: 2, max: 4}
    decisions:
      - {n: 1, by: P2, at: main, do: play, card: b3}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P2.pp.current: 0
          P1.field.a1: {hp: 2}
