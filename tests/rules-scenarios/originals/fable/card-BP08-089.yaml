schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP08-089
kind: card
must_pass: true
mechanisms: [進化後變成護符, 5.16.1.2.1, '5.25', 5.14.1.2, 改變卡片類型, 進化費用改為 0, 12.5.3, 進化卡自身的能力]
cards: [BP08-089, BP08-090, BP04-115, EBD04-014, BP19-108, BP16-109, EBD04-011, EBD04-017, BP01-176, BP01-173]
why: >-
  狂信の偶像 的進化卡是「アミュレット・エボルヴ」：進化後依 5.16.1.2.1 種類變成アミュレット（Q1122）。
  之後它不能攻擊（8.4.2 只能選フォロワー）、「場のフォロワーすべてを破壊する」不影響它、也不算「アミュレットが出た」（Q1121 祈りの燭台、Q2144 潜みしマイニュ 都不誘發）。
  【進化時】照常結算（消滅目標）。被ダークオファリング 破壞 → 從場到墓場 → ラストワード 3 傷害（12.5.3）；進化卡回到エボルヴデッキ表向き（Q1122）。
  B：ファンファーレ「自分の場のアミュレットが3つ以上なら、このターン、これの進化コストを0にする」→ 3 個護符時進化不花 PP／EP。
discriminates: >-
  進化後仍當成從者的引擎：after-decision-6 會允許攻擊（不是 cannot-attack）、テミス 會把 a1 一起破壞、祈りの燭台／マイニュ 可能被誘發（a2 攻擊力 3）。
  沒有把進化卡的能力當成 a1 的能力的引擎：不會消滅 b1、破壞時沒有 3 傷害。B：沒套用「進化コストを0にする」的引擎會 cannot-evolve 或扣 PP。
refs:
  rules: [5.16.1.2, 5.16.1.2.1, 5.16.2.2, 5.25.1, 5.25.2.1, 5.25.3, 5.14.1.2, 8.4.2, 12.5.3, 5.16.3, 12.2.3, 10.4.4.1]
  qa: [Q1122, Q1121, Q2144, Q1226]
evidence:
  - ref: Q1122
    quote: 『狂信の偶像（EVOLVE）』はカードの種類がアミュレットのエボルヴカードです。通常のアミュレットと同様に攻撃力や体力の値を持たず、アミュレットを対象とした効果のみを受けます。『狂信の偶像（EVOLVE）』が破壊された場合、『狂信の偶像（EVOLVE）』を墓場に移動します。移動した直後、エボルヴカードである『狂信の偶像（EVOLVE）』はエボルヴデッキの上に表向きで置きます。
  - ref: Q1121
    quote: いいえ。誘発しません。
  - ref: Q2144
    quote: いいえ。誘発しません。
  - ref: cr 5.16.1.2.1
    quote: これにより進化前と進化後でカードの種類が異なる場合、そのカードの種類の記載されている情報（10.9.1.1）が進化後の種類になります。他に種類を変更する効果が適用されていない場合、これによりそのカードの種類を進化後の種類にします（5.25）。
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 2 個護符：進化付 1 PP＋1 EP → 變成護符 → 進化時消滅 b1 → 不能攻擊 → テミス 不破壞它 → ダークオファリング 破壞 → ラストワード 3 傷害
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 9, P2: 8}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ビショップ, life: 20}
          pp: {current: 9, max: 9}
          ep: 2
          zones:
            field:
              - {id: m1, card: BP04-115}          # 祈りの燭台（他のアミュレットが出たとき +1）
              - {id: m2, card: EBD04-014}         # 聖なる願い
              - {id: a2, card: BP16-109}          # 潜みしマイニュ 2/2 オーラ（アミュレットが出たとき 攻撃力+1）
            hand:
              - {id: a1, card: BP08-089}          # 狂信の偶像 0/3
              - {id: s1, card: EBD04-011}         # テミスの審判（コスト5）
              - {id: s2, card: EBD04-017}         # ダークオファリング（コスト1）
            evolve_deck:
              - {id: e1, card: BP08-090}          # 狂信の偶像（アミュレット・エボルヴ）
            deck:
              - {id: d1, card: BP01-173}
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 8}
          zones:
            field:
              - {id: b1, card: BP01-176, state: {acted: true}}   # 天剣の乙女 4/6
              - {id: b2, card: BP01-173, state: {acted: true}}   # ファイター 2/3
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}}
      - {n: 3, by: P1, at: main, do: evolve, source: a1, ability: {source: a1, line: 1}, evolve_card: e1, pay: {pp: 1, ep: 1}}
      - {n: 4, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, card: BP08-090, line: 1}}, targets: {1: [b1]}}
      - {n: 5, by: P1, at: main, do: attack, attacker: a1, target: b2}
      - {n: 6, by: P1, at: main, do: play, card: s1}
      - {n: 7, by: P1, at: main, do: play, card: s2, targets: {1: [a1]}}
      - {n: 8, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, card: BP08-090, line: 2}}}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 7
          P1.field: [m1, m2, a2, a1]
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 6
          P1.ep: 1
          P1.field.a1: {evolved: true, evolved_with: e1}
          P1.field.a2: {power: 2}
          P2.field: [b2]
          P2.banish: [b1]
          semantic_state.pending_triggers: []
        events:
          - {kind: 進化, object: a1, with: e1}
          - {kind: 消滅, object: b1}
        forbidden_events:
          - {kind: プレイ, ability: {source: m1, line: 1}}
          - {kind: プレイ, ability: {source: a2, line: 2}}
          - {kind: 待機, ability: {source: m1, line: 1}}
          - {kind: 待機, ability: {source: a2, line: 2}}
      - at: after-decision-5
        view: omniscient
        outcome: cannot-attack
        assert:
          P1.field.a1: {acted: false}
          P2.field.b2: {hp: 3}
        forbidden_events:
          - {kind: 攻撃}
      - at: after-decision-6
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 1
          P1.field: [m1, m2, a1]
          P1.cemetery: [a2, s1]
          P2.field: []
        events:
          - {kind: 破壊, object: a2, group: 1}
          - {kind: 破壊, object: b2, group: 1}
        forbidden_events:
          - {kind: 破壊, object: a1}
      - at: after-decision-8
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P1.field: [m1, m2]
          P1.cemetery: [a2, s1, a1, s2]
          P1.evolve_deck.e1: {face_up: true}
          P1.leader.life: 23
          P1.hand: [d1]
          P2.leader.life: 17
        events:
          - {kind: 破壊, object: a1}
          - {kind: ダメージ, source: a1, target: P2.leader, amount: 3}

  - name: B 3 個護符：ファンファーレ 把進化費用改成 0 → 不付 PP／EP 就能進化 → 變成護符並消滅 b1
    inherit: A 2 個護符：進化付 1 PP＋1 EP → 變成護符 → 進化時消滅 b1 → 不能攻擊 → テミス 不破壞它 → ダークオファリング 破壞 → ラストワード 3 傷害
    setup:
      players:
        P1:
          zones:
            field:
              - {id: m1, card: BP04-115}
              - {id: m2, card: EBD04-014}
              - {id: m3, card: BP19-108}          # 光輝の宝珠
              - {id: a2, card: BP16-109}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1}
      - {n: 2, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, line: 2}}}
      - {n: 3, by: P1, at: main, do: evolve, source: a1, ability: {source: a1, line: 1}, evolve_card: e1, pay: {pp: 0, ep: 0}}
      - {n: 4, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a1, card: BP08-090, line: 1}}, targets: {1: [b1]}}
    random: {}
    expected:
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 7
          P1.ep: 2
          P1.field.a1: {evolved: true, evolved_with: e1}
          P1.field.a2: {power: 2}
          P2.field: [b2]
          P2.banish: [b1]
        events:
          - {kind: 進化, object: a1, with: e1}
          - {kind: 消滅, object: b1}
        forbidden_events:
          - {kind: プレイ, ability: {source: m1, line: 1}}
          - {kind: プレイ, ability: {source: a2, line: 2}}
