schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP17-T02
kind: card
must_pass: true
mechanisms: [連擊、覺醒、真紅, 13.2.1, 13.2.1.3, EX 區打出, 本回合歷史, 9.1.4.3]
cards: [BP17-T02, BP16-T10, BP01-173]
why: >-
  ゲイルアロー（EX 區的法術 token）「相手の場のフォロワー1体を選ぶ。【コンボ_3】それに2ダメージ」：コンボ數的是本回合**打出**的卡數（含這張自己，13.2.1.2），
  任何領域打出的、token 與否都算（13.2.1.3）。A：先從 EX 打出フェアリー token、再打出ファイター，第 3 張是ゲイルアロー → 成立。B：第 1 張就打 → 不成立，目標仍必選，只是沒有傷害。
  法術 token 結算後進墓場立即消去（9.1.4.3／9.1.4.4）。
discriminates: >-
  不把 EX 區打出的 token 算進打出張數的引擎 A 不會造成傷害；把「不成立」當成不能打出的引擎 B 會 cannot-play；把 token 留在墓場的引擎 P1.cemetery 會多一張。
refs:
  rules: [13.2.1.1, 13.2.1.2, 13.2.1.3, 8.2.1, 9.1.4.3, 9.1.4.4, 10.6.2.3.1]
  qa: [Q451, Q1153]
evidence:
  - ref: cr 13.2.1.3
    quote: このプレイしていた枚数ではあらゆる領域からプレイされていたカードを、カードがトークンであるか否かに関係なく数えます。
  - ref: Q451
    quote: いいえ。能力によって場に出たカードはプレイ枚数に数えません。
  - ref: Q1153
    quote: いいえ。フォロワーの進化はカードのプレイには含まず、このターンにプレイしたカードは『愛の妖精・ポーラ』と『フェアリー』の2枚のみのため、【コンボ_3】の条件を満たしていません。
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 第 3 張打出 → コンボ_3 成立 → 2 傷害
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 4, P2: 3}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: エルフ, life: 20}
          pp: {current: 4, max: 4}
          zones:
            ex:
              - {id: f1, card: BP16-T10}          # フェアリー token（コスト1）
              - {id: g1, card: BP17-T02}          # ゲイルアロー token（コスト1）
            hand:
              - {id: a1, card: BP01-173}          # ファイター（コスト2）
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 4}
          zones:
            field:
              - {id: b1, card: BP01-173}          # ファイター 2/3
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: f1}
      - {n: 2, by: P1, at: main, do: play, card: a1}
      - {n: 3, by: P1, at: main, do: play, card: g1, targets: {1: [b1]}}
    random: {}
    expected:
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 0
          P1.field: [f1, a1]
          P1.ex: []
          P1.cemetery: []
          P2.field.b1: {hp: 1}
        events:
          - {kind: プレイ, object: g1}
          - {kind: ダメージ, source: g1, target: b1, amount: 2}
          - {kind: 消去, object: g1}

  - name: B 第 1 張就打 → コンボ_3 不成立 → 可打出但沒有傷害
    inherit: A 第 3 張打出 → コンボ_3 成立 → 2 傷害
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: g1, targets: {1: [b1]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 3
          P1.ex: [f1]
          P2.field.b1: {hp: 3}
        events:
          - {kind: プレイ, object: g1}
          - {kind: 消去, object: g1}
        forbidden_events:
          - {kind: ダメージ}
