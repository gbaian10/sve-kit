# 試作 p4（固定題）。以 Opus 依兩邊試作改寫的範例為準，填入 sha；規則結論兩邊互驗一致（Q2633、Q2634）。
schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP20-P12
kind: card
must_pass: true
mechanisms: [可選費用與範圍, 10.4.7, 10.6.2.3.3]
cards: [BP20-P12, BP21-016, BP01-176, BP01-173]
why: >-
  追加費用「手札の獣・カード1枚を捨ててよい」在打出時決定（10.6.2.2.2）；「払っていたなら」管轄到段落結尾（10.4.7.1），
  所以沒付時連「1枚引く」也不做。必選 1 個目標，選不到就不能打出、回溯（10.6.2.3.3），追加費用也不會被扣。
discriminates: >-
  把「払っていたなら」只管到「代わりに5ダメージ」的實作，會在局面 B 多抽 1 張；先付費再選目標的實作，會在局面 C 把獣・カード留在墓場。
  目標是體力 6 的天剣の乙女，3 與 5 傷害都不會破壞它，傷害值可以直接看到。
refs:
  rules: [10.4.7.1, 10.4.7.2, 10.6.2.2.2, 10.6.2.3.3, 10.6.2.5]
  qa: [Q2633, Q2634]
evidence:
  - ref: Q2633
    quote: 追加コストを支払っていない場合、「これの追加コストを払っていたなら、」以降の効果は働かず、1枚引くことができません。
  - ref: Q2634
    quote: 相手の場のフォロワーを選ぶことができない場合、このスペルをプレイすることができないため、コストの支払いもできず、1枚引くことができません。
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 付了追加費用
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 4, P2: 3}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: エルフ, life: 20}
          pp: {current: 4, max: 4}
          zones:
            hand:
              - {id: a1, card: BP20-P12}     # 野生の猛襲
              - {id: a2, card: BP21-016}     # 獣・カード
            deck:
              - {id: a3, card: BP01-173}
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 3}
          zones:
            field:
              - {id: b1, card: BP01-176}     # 天剣の乙女 4/6
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, optional_costs: {additional: {discard: [a2]}}, targets: {1: [b1]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 2
          P1.hand: [a3]
          P1.cemetery: [a1, a2]
          P1.deck: [filler: 20]
          P2.field.b1: {hp: 1}
        events:
          - {kind: 捨てる, player: P1, object: a2}
          - {kind: ダメージ, source: a1, target: b1, amount: 5}
          - {kind: 引く, player: P1, object: a3}
        forbidden_events:
          - {kind: ダメージ, source: a1, target: b1, amount: 3}

  - name: B 沒付追加費用
    inherit: A 付了追加費用
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, optional_costs: {additional: decline}, targets: {1: [b1]}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 2
          P1.hand: [a2]
          P1.cemetery: [a1]
          P1.deck: [a3, filler: 20]
          P2.field.b1: {hp: 3}
        events:
          - {kind: ダメージ, source: a1, target: b1, amount: 3}
        forbidden_events:
          - {kind: 引く, player: P1}

  - name: C 對手場上沒有從者
    inherit: A 付了追加費用
    setup:
      players:
        P2:
          zones:
            field: []
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, optional_costs: {additional: {discard: [a2]}}, targets: {1: []}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: cannot-play
        assert:
          P1.pp.current: 4
          P1.hand: [a1, a2]
          P1.cemetery: []
          P1.deck: [a3, filler: 20]
        forbidden_events:
          - {kind: 捨てる}
          - {kind: 引く}
          - {kind: ダメージ}
