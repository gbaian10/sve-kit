schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-ECP01-010
kind: card
must_pass: true
mechanisms: [持續效果與禁止, 1.3.3, 10.7.2, '12.4', '12.6', 賽馬娘, 誘發本身被禁止]
cards: [ECP01-010, BP04-092, BP19-050, BP19-051]
why: >-
  ジェンティルドンナ「これが場にいる限り、相手プレイヤーすべての{ファンファーレ}能力と【進化時】能力は誘発しない」：對手的ファンファーレ／進化時**連待機都不會產生**（Q1824、Q1826），
  不是「待機後不能打出」。A：對手打出デモンビーター → 沒有待機、直接回到主要階段。B：對手進化ライトニングキャット → 進化本身照常，進化時不誘發。
  依契約 10 第 1 點：デモンビーター 有【守護】，打出放上場時仍要問 place-acted（12.8.2、9.2）；之後才是「沒有待機」。
discriminates: >-
  把它做成「待機後取消」的引擎會出現 待機／待機取消 事件並在 after-decision-2 停下等 choose-pending；沒實作的引擎會讓 P2 搜牌／造成 2 傷害。
refs:
  rules: [10.7.2, 10.1.1.2.1.1, 1.3.3, 12.4.1, 12.6.1, 10.3.5]
  qa: [Q1824, Q1826, Q1825]
evidence:
  - ref: Q1824
    quote: いいえ。『ジェンティルドンナ』が場にいる場合、相手の《ファンファーレ》能力や【進化時】能力は、誘発条件を満たしたとしても誘発しないため、プレイすることができません。
  - ref: Q1826
    quote: いいえ。【進化時】能力は誘発条件を満たしたとしても誘発しないため、プレイすることができません。
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 對手打出有ファンファーレ的從者 → 沒有待機
    setup:
      turn: {active: P2, first_player: P1, elapsed_turns: {P1: 7, P2: 7}, phase: main}
      history: none
      players:
        P1:
          construction: title
          title: ウマ娘 プリティーダービー
          leader: {class: ロイヤル, life: 20}
          pp: {current: 0, max: 7}
          zones:
            field:
              - {id: a1, card: ECP01-010}         # ジェンティルドンナ 6/6
            hand:
              - {filler: 2}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ナイトメア, life: 20}
          pp: {current: 3, max: 7}
          ep: 2
          zones:
            field:
              - {id: b2, card: BP19-050}          # ライトニングキャット 2/2（B 用）
            evolve_deck:
              - {id: b3, card: BP19-051}
            hand:
              - {id: b1, card: BP04-092}          # デモンビーター（ファンファーレ{コスト2}：探す）
            deck:
              - {id: b4, card: BP04-092}
              - {filler: 20}
    decisions:
      - {n: 1, by: P2, at: main, do: play, card: b1}
      # 12.8.2：デモンビーター 有【守護】→ 放上場時選直立／アクト（9.2 place-acted，屬決定 1 的結算）
      - {n: 2, by: P2, at: resolve, of: {decision: 1, occurrence: 1}, do: place-acted, object: b1, acted: false}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: paused
        awaiting:
          by: P2
          choices:
            - {do: place-acted, object: b1, acted: false}
            - {do: place-acted, object: b1, acted: true}
        assert:
          P2.pp.current: 2
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.field: [b2, b1]
          P2.field.b1: {acted: false}
          P2.pp.current: 2
          P2.deck: [b4, filler: 20]
          semantic_state.pending_triggers: []
        forbidden_events:
          - {kind: 待機}
          - {kind: 待機取消}
          - {kind: プレイ, ability: {source: b1, line: 2}}

  - name: B 對手進化 → 進化本身照常，進化時不誘發
    inherit: A 對手打出有ファンファーレ的從者 → 沒有待機
    decisions:
      - {n: 1, by: P2, at: main, do: evolve, source: b2, ability: {source: b2, line: 1}, evolve_card: b3, pay: {pp: 0, ep: 1, sep: 0}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b2: {evolved: true, evolved_with: b3, power: 3, hp: 3}
          P2.ep: 1
          P1.leader.life: 20
          P1.field.a1: {hp: 6}
          semantic_state.pending_triggers: []
        events:
          - {kind: 進化, object: b2, with: b3}
        forbidden_events:
          - {kind: 待機}
          - {kind: ダメージ}
