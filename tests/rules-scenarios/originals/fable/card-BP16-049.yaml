schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP16-049
kind: card
must_pass: true
mechanisms: [法術鏈、死靈充能, 13.3.1.2, 13.3.1.3, 10.9.1.2, 持續效果與禁止, 法術鏈計張數不計卡名]
cards: [BP16-049, BP01-170, BP01-180, BP01-099, BP01-131, BP04-092]
why: >-
  スノーアウェイク「それの攻撃力と体力を1にする。【スペルチェイン_10】それは能力すべてを失う」：スペルチェイン數的是墓場**法術張數**（13.3.1.2），同名重複也算
  （sve-client 曾誤用「不同名」計數）；結算中自身還在解決領域不算（13.3.1.3）。失去能力後被破壞，ラストワード不誘發（Q2107）。
discriminates: >-
  用「不同卡名數」計算的引擎在 A 只算到 4 種 → 不失去能力 → デモンビーター的 LW 會待機、P2 回體力；
  把解決中的自身算進去的引擎在 B（9 張＋自身）會誤判成立。
refs:
  rules: [13.3.1.2, 13.3.1.3, 13.3.1.4, 10.9.1.2, 5.31.2, 12.5.1, '12.8']
  qa: [Q2104, Q2107]
evidence:
  - ref: cr 13.3.1.2
    quote: ‘【スペルチェイン （数値）】（テキスト）’または‘【SC （数値）】（テキスト）’は‘あなたの墓場のスペルが（数値）枚以上である場合、（テキスト）’を意味します。
  - ref: cr 13.3.1.3
    quote: このカード自身の解決中はこのカードはまだ解決領域にあるため、このカードは自身の墓場のスペルの枚数に数えません。
  - ref: Q2107
    quote: いいえ。能力を失っているので《ラストワード》能力は誘発しません。
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 墓場 10 張法術（只有 4 種名）→ SC 成立 → 失去能力 → 被破壞時沒有ラストワード
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 6, P2: 5}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ウィッチ, life: 20}
          pp: {current: 3, max: 6}
          zones:
            hand:
              - {id: a1, card: BP16-049}          # スノーアウェイク
              - {id: a2, card: BP01-180}          # エンジェルバレッジ
            cemetery:
              - {id: c1, card: BP01-170}
              - {id: c2, card: BP01-170}
              - {id: c3, card: BP01-170}
              - {id: c4, card: BP01-180}
              - {id: c5, card: BP01-180}
              - {id: c6, card: BP01-180}
              - {id: c7, card: BP01-099}
              - {id: c8, card: BP01-099}
              - {id: c9, card: BP01-099}
              - {id: c10, card: BP01-131}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ナイトメア, life: 20}
          pp: {current: 0, max: 6}
          zones:
            field:
              - {id: b1, card: BP04-092}          # デモンビーター 1/1【守護】（ラストワード：+1）
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, targets: {1: [b1]}}
      - {n: 2, by: P1, at: main, do: play, card: a2}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P2.field.b1: {power: 1, hp: 1}
          P1.pp.current: 1
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.field: []
          P2.leader.life: 20
          semantic_state.pending_triggers: []
        events:
          - {kind: 破壊, object: b1, by: rule-11.3.1}
        forbidden_events:
          - {kind: 待機}
          - {kind: 体力増加}

  - name: B 墓場 9 張法術（自身不算）→ SC 不成立 → 保留能力 → ラストワード誘發
    inherit: A 墓場 10 張法術（只有 4 種名）→ SC 成立 → 失去能力 → 被破壞時沒有ラストワード
    setup:
      players:
        P1:
          zones:
            cemetery:
              - {id: c1, card: BP01-170}
              - {id: c2, card: BP01-170}
              - {id: c3, card: BP01-170}
              - {id: c4, card: BP01-180}
              - {id: c5, card: BP01-180}
              - {id: c6, card: BP01-180}
              - {id: c7, card: BP01-099}
              - {id: c8, card: BP01-099}
              - {id: c9, card: BP01-099}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a1, targets: {1: [b1]}}
      - {n: 2, by: P1, at: main, do: play, card: a2}
      - {n: 3, by: P2, at: check-timing, do: choose-pending, pending: {ability: {source: b1, line: 3}}}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        awaiting:
          by: P2
          choices:
            - {do: choose-pending, pending: {ability: {source: b1, line: 3}}}
        assert:
          P2.field: []
        events:
          - {kind: 待機, ability: {source: b1, line: 3}}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 21
