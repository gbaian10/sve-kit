schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: card-BP19-081
kind: card
must_pass: true
mechanisms: [攻擊力可以是負數, 1.3.2.4, 1.3.2.2, 8.4.9, 動態數值, 持續效果]
cards: [BP19-081, BP04-075, BP01-176, BP06-072, BP01-173]
why: >-
  蛇殿の執行者・ゲノムエル 在對手（P2）的結束階段讓 P1 的從者全部 −3/−3；1/5 的ヒッポカムポス 變成 −2/2（1.3.2.4：數值可以是負數，不截在 0）。
  Q2586：攻擊力負數的從者攻擊或交戰時「ダメージ自体を与えません」（1.3.2.2：0 以下的行動不存在）。
  A：−2 攻擊リーダー → 沒有傷害事件。A2：−2 攻擊アクト狀態的ファイター → 只有ファイター 對它造成 2 傷害。
  B：+2 之後攻擊力是 0（不是 2）→ 仍沒有傷害。C：再 +2 → 2 → 造成 2 傷害。D：4/6 變 1/3 的天剣の乙女攻擊 → 造成 1。
discriminates: >-
  把攻擊力截在 0 的引擎：B 會造成 2 傷害、C 會造成 4；發出 amount 0 或負數ダメージ事件的引擎違反 forbidden_events；
  A2 中讓負攻擊力「造成 0 傷害但仍算給過傷害」的引擎會多出事件。
refs:
  rules: [1.3.2.4, 1.3.2.2, 1.3.2.2.1, 8.4.9, 8.4.9.1, 10.9.1.3, 10.9.2]
  qa: [Q2586]
evidence:
  - ref: Q2586
    quote: はい。何らかの効果によって攻撃力はマイナスの値になることがあります。攻撃力がマイナスの値になったフォロワーによる攻撃や交戦のダメージは、ダメージ自体を与えません。
  - ref: cr 1.3.2.4
    quote: プレイヤーやカードが持つ数値情報は、特に上下限の指定があるものを除き、0 や負の値をとることが可能です。
    derivation: [攻擊力沒有下限指定 → 1 − 3 = −2, 之後的 +2 從 −2 算起 → 0, 再 +2 → 2]
status: draft
author: fable
verified_by: []

scenarios:
  - name: A 攻擊力 −2 的從者攻擊リーダー → 沒有傷害
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 7, P2: 6}, phase: main}
      history: explicit
      semantic_state:
        continuous_effects:
          - {id: e1, source: b1, text: '相手の場のフォロワーすべては{攻撃力}-3/{体力}-3する', applies_to: [a1, a2], until: permanent, order: 1}
      players:
        P1:
          construction: class
          leader: {class: ドラゴン, life: 20}
          pp: {current: 7, max: 7}
          zones:
            field:
              - {id: a1, card: BP04-075, state: {power: -2, hp: 2}}    # ヒッポカムポス 1/5 → −2/2
              - {id: a2, card: BP01-176, state: {power: 1, hp: 3}}     # 天剣の乙女 4/6 → 1/3
            hand:
              - {id: s1, card: BP06-072}          # 武力炎翔（攻撃力+2、コスト1）
              - {id: s2, card: BP06-072}
            deck:
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ナイトメア, life: 20}
          pp: {current: 0, max: 6}
          zones:
            field:
              - {id: b1, card: BP19-081, state: {acted: true}}   # 蛇殿の執行者・ゲノムエル 5/5
              - {id: b2, card: BP01-173, state: {acted: true}}   # ファイター 2/3
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: attack, attacker: a1, target: P2.leader}
      - {n: 2, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 20
          P1.field.a1: {acted: true, power: -2}
        events:
          - {kind: 攻撃, attacker: a1, target: P2.leader}
        forbidden_events:
          - {kind: ダメージ}

  - name: A2 攻擊力 −2 的從者攻擊アクト狀態的ファイター → 只有ファイター 對它造成 2 傷害
    inherit: A 攻擊力 −2 的從者攻擊リーダー → 沒有傷害
    decisions:
      - {n: 1, by: P1, at: main, do: attack, attacker: a1, target: b2}
      - {n: 2, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.field: [a2]
          P1.cemetery: [a1]
          P2.field.b2: {hp: 3}
        events:
          - {kind: ダメージ, source: b2, target: a1, amount: 2}
          - {kind: 破壊, object: a1}
        forbidden_events:
          - {kind: ダメージ, source: a1}

  - name: B +2 之後攻擊力是 0 → 攻擊リーダー 仍沒有傷害
    inherit: A 攻擊力 −2 的從者攻擊リーダー → 沒有傷害
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: s1, targets: {1: [a1]}}
      - {n: 2, by: P1, at: main, do: attack, attacker: a1, target: P2.leader}
      - {n: 3, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 6
          P1.field.a1: {power: 0, hp: 2}
      - at: after-decision-3
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 20
        forbidden_events:
          - {kind: ダメージ}

  - name: C 兩次 +2 之後攻擊力是 2 → 造成 2 傷害
    inherit: A 攻擊力 −2 的從者攻擊リーダー → 沒有傷害
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: s1, targets: {1: [a1]}}
      - {n: 2, by: P1, at: main, do: play, card: s2, targets: {1: [a1]}}
      - {n: 3, by: P1, at: main, do: attack, attacker: a1, target: P2.leader}
      - {n: 4, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.pp.current: 5
          P1.field.a1: {power: 2, hp: 2}
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 18
        events:
          - {kind: ダメージ, source: a1, target: P2.leader, amount: 2}

  - name: D 4/6 → 1/3 的天剣の乙女攻擊ファイター → 互相造成 1 與 2
    inherit: A 攻擊力 −2 的從者攻擊リーダー → 沒有傷害
    decisions:
      - {n: 1, by: P1, at: main, do: attack, attacker: a2, target: b2}
      - {n: 2, by: P2, at: quick, do: pass}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        assert:
          P1.field.a2: {hp: 1}
          P2.field.b2: {hp: 2}
        events:
          - {kind: ダメージ, source: a2, target: b2, amount: 1, group: g1}
          - {kind: ダメージ, source: b2, target: a2, amount: 2, group: g1}
