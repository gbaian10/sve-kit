# 試作 p5 遷移到 v2。修正：中途墓場補上法術 a3；結束改 game-end；處理順序用 events_exact: [プレイ]。
schema: sve-exam/2.1
sources:
  rules: cr-1.27.0
  cards_jsonl_sha256: 4c7b98b77342d2a9
id: rule-10.5.2-01
kind: rule
must_pass: true
mechanisms: [10.5.2, 10.7.3.1, 11.2.1, 檢查時點迴圈, 回合特定時點]
cards: [BP01-180, BP08-078, BP04-092, BP11-027, BP14-024, BP01-173]
why: >-
  回合玩家 P1 用エンジェルバレッジ同時破壞非回合玩家 P2 的サロメ與デモンビーター（兩個ラストワード待機，P2）。
  P2 先結算サロメ（2 傷害給アウトローガンナー）→ 回到 10.5.2.1 → 規則處理破壞アウトローガンナー → 回合玩家 P1 產生新的待機 →
  依 10.5.2.2 下一個先處理 P1 的，不是 P2 剩下的デモンビーター。用 P2 リーダー體力 1 讓順序變成勝負：正確順序下 P1 的 2 傷害先落地 → 11.2.1 敗北，
  デモンビーター的 +1 永遠來不及。局面 B 是 P2 選另一個合法順序（先デモンビーター）→ 存活。
discriminates: >-
  「雙方輪流」或「非回合玩家把自己的待機全部處理完才換人」的實作，局面 A 會讓 P2 以體力 1 存活（+1 先於 −2）、遊戲不結束；
  只比最終體力的話加減法可交換，所以用敗北處理當觀察點。局面 B 驗證 P2 的順序選擇是合法且結果不同。
refs:
  rules: [10.5.2.1, 10.5.2.2, 10.5.2.3, 10.5.2.4, 10.7.2, 10.7.3, 10.7.3.1, 10.6.2.3, 11.1.3, 11.2.1, 11.3.1, 12.5.3, 12.3.5, 5.14.1, 1.2.1, 10.6.2.8.3]
  qa: [Q1110]
evidence:
  - ref: cr 10.5.2.2
    quote: ターンプレイヤーがマスターであるいずれかの自動能力が待機状態になっている場合、ターンプレイヤーはそのうち 1 つを選び、プレイと解決を行い、その後 10.5.2.1 に戻ります。
  - ref: cr 10.5.2.3
    quote: 非ターンプレイヤーがマスターであるいずれかの自動能力が待機状態になっている場合、非ターンプレイヤーはそのうち 1 つを選び、プレイと解決を行い、その後 10.5.2.1 に戻ります。
    derivation:
      - 每結算一個都「10.5.2.1 に戻ります」，回到 10.5.2.1 後下一步一定是 10.5.2.2（先查回合玩家），不是接著 10.5.2.3
      - P2 結算サロメ後：10.5.2.1 破壞 a2 → a2 的ラストワード待機（P1 是 master）→ 10.5.2.2 命中 → P1 先打出
      - P1 結算後回到 10.5.2.1：P2 リーダー體力 0 → 11.2.1 P2 敗北 → 1.2.1 遊戲立即結束；デモンビーター的待機不再被處理
  - ref: cr 10.7.3.1
    quote: 待機状態の自動能力のプレイは強制で、プレイしないことを選択することはできません。ただし、自身がマスターである自動能力が複数待機している場合、そのうちのどれを先にプレイするかを選ぶことは可能です。
  - ref: cr 11.2.1
    quote: 自身のリーダーの体力が 0 以下であるプレイヤーがいる場合、そのプレイヤーはこのゲームに敗北します。
  - ref: cr 1.2.1
    quote: いずれかのプレイヤーが敗北した場合、ゲームはその時点で終了します。
  - ref: Q1110
    quote: 相手の場のフォロワーを選ぶことができないので、このフォロワーの《ファンファーレ》能力や《ラストワード》能力をプレイすることができず、自分のリーダーの体力を+1することができません。
    derivation:
      - 佐證サロメ的ラストワード在打出時必須選到目標；本題 P1 場上有 a1、a2 可選
  - ref: cr 10.6.2.8.3
    quote: この時点で解決領域にカードや能力が残っている場合、それがカードならオーナーの墓場に移動し
    derivation:
      - エンジェルバレッジ結算完就進墓場，after-decision-1 起 P1.cemetery 含 a3
status: draft
author: fable
verified_by: []

scenarios:
  - name: A P2 先結算サロメ → 打死アウトローガンナー → 回合玩家 P1 的新待機先處理 → P2 敗北，デモンビーター來不及
    setup:
      turn: {active: P1, first_player: P1, elapsed_turns: {P1: 6, P2: 5}, phase: main}
      history: none
      players:
        P1:
          construction: class
          leader: {class: ロイヤル, life: 20}
          pp: {current: 6, max: 6}
          ep: 2
          zones:
            field:
              - {id: a1, card: BP14-024}          # 辺境の騎士見習い 1/1（ラストワード：1枚引く）
              - {id: a2, card: BP11-027}          # アウトローガンナー 2/2（ラストワード：相手のリーダーすべてに2ダメージ）
            hand:
              - {id: a3, card: BP01-180}          # エンジェルバレッジ（12.3.5：自己主要階段可打）
            deck:
              - {id: a4, card: BP01-173}
              - {filler: 20}
        P2:
          construction: class
          leader: {class: ナイトメア, life: 1}
          pp: {current: 0, max: 6}
          ep: 2
          zones:
            field:
              - {id: b1, card: BP08-078, state: {hp: 1}}   # サロメ 1/2，再 1 點就死
              - {id: b2, card: BP04-092}                    # デモンビーター 1/1（ラストワード：自分のリーダーは体力+1）
            hand:
              - {filler: 3}
            deck:
              - {filler: 20}
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a3}
      - {n: 2, by: P2, at: check-timing, do: choose-pending, pending: {ability: {source: b1, line: 1, keyword: ラストワード}}, targets: {1: [a2]}}
      - {n: 3, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a2, line: 2, keyword: ラストワード}}}
    random: {}
    expected:
      - at: after-decision-1
        view: omniscient
        outcome: resolved
        awaiting:
          by: P2
          choices:
            - {do: choose-pending, pending: {ability: {source: b1, line: 1, keyword: ラストワード}}}
            - {do: choose-pending, pending: {ability: {source: b2, line: 3, keyword: ラストワード}}}
        assert:
          P1.pp.current: 5
          P1.cemetery: [a3]
          P2.field: []
          P2.cemetery: [b1, b2]
        events:
          - {kind: ダメージ, source: a3, target: b1, amount: 1, group: 1}
          - {kind: ダメージ, source: a3, target: b2, amount: 1, group: 1}
          - {kind: 破壊, object: b1, by: rule-11.3.1, group: 2}
          - {kind: 破壊, object: b2, by: rule-11.3.1, group: 2}
          - {kind: 待機, ability: {source: b1, line: 1, keyword: ラストワード}, group: 3}
          - {kind: 待機, ability: {source: b2, line: 3, keyword: ラストワード}, group: 3}
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        awaiting:
          by: P1
          choices:
            - {do: choose-pending, pending: {ability: {source: a2, line: 2, keyword: ラストワード}}}
        assert:
          P2.leader.life: 2
          P1.field: [a1]
          P1.cemetery: [a3, a2]
        events:
          - {kind: プレイ, ability: {source: b1, line: 1, keyword: ラストワード}}
          - {kind: ダメージ, source: b1, target: a2, amount: 2}
          - {kind: 体力増加, target: P2.leader, amount: 1}
          - {kind: 破壊, object: a2, by: rule-11.3.1}
          - {kind: 待機, ability: {source: a2, line: 2, keyword: ラストワード}}
      - at: after-decision-3
        view: omniscient
        outcome: game-end
        assert:
          P2.leader.life: 0
          P1.hand: []
          P1.deck: [a4, filler: 20]
          game: {ended: true, winner: P1, by: 11.2.1}
        events:
          - {kind: プレイ, ability: {source: a2, line: 2, keyword: ラストワード}}
          - {kind: ダメージ, source: a2, target: P2.leader, amount: 2}
          - {kind: 敗北, player: P2, by: rule-11.2.1}
        events_exact: [プレイ]
        forbidden_events:
          - {kind: プレイ, ability: {source: b2, line: 3, keyword: ラストワード}}
          - {kind: 体力増加}

  - name: B P2 先結算デモンビーター → 再サロメ → P1 的新待機 → P2 以體力 1 存活
    inherit: A P2 先結算サロメ → 打死アウトローガンナー → 回合玩家 P1 的新待機先處理 → P2 敗北，デモンビーター來不及
    decisions:
      - {n: 1, by: P1, at: main, do: play, card: a3}
      - {n: 2, by: P2, at: check-timing, do: choose-pending, pending: {ability: {source: b2, line: 3, keyword: ラストワード}}}
      - {n: 3, by: P2, at: check-timing, do: choose-pending, pending: {ability: {source: b1, line: 1, keyword: ラストワード}}, targets: {1: [a2]}}
      - {n: 4, by: P1, at: check-timing, do: choose-pending, pending: {ability: {source: a2, line: 2, keyword: ラストワード}}}
    random: {}
    expected:
      - at: after-decision-2
        view: omniscient
        outcome: resolved
        awaiting:
          by: P2
          choices:
            - {do: choose-pending, pending: {ability: {source: b1, line: 1, keyword: ラストワード}}}
        assert:
          P2.leader.life: 2
          P1.field: [a1, a2]
      - at: after-decision-4
        view: omniscient
        outcome: resolved
        assert:
          P2.leader.life: 1
          P1.field: [a1]
          P1.cemetery: [a3, a2]
          P2.cemetery: [b1, b2]
          semantic_state.pending_triggers: []
          game: {ended: false}
        events:
          # 比對範圍是 after-decision-2 → after-decision-4：b2 的プレイ在前一個範圍（自驗修正）
          - {kind: プレイ, ability: {source: b1, line: 1, keyword: ラストワード}}
          - {kind: プレイ, ability: {source: a2, line: 2, keyword: ラストワード}}
        events_exact: [プレイ]
