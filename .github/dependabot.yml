# Version updates: weekly, one grouped pull request per ecosystem, only for releases at least 7 days
# old (a freshly published release is the usual window for a hijacked package). Security updates
# skip the cooldown and the groups, as they should. The commit prefix makes the title
# pass the commit-format check (`<gitmoji> <type>(<scope>): …`); Dependabot adds the colon itself.
# Bun (sim/web) is updated by hand: Dependabot's bun reads bun.lock only up to lockfileVersion 1,
# and Bun 1.4 writes version 2.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ⬆️ dep-bump

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      # The workspace's other member, sim/scenario-runner, only runs the rules scenarios and has no
      # version of its own, so every Rust update is filed under sim/engine.
      prefix: ⬆️ dep-bump(sim/engine)

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns: ["*"]
    commit-message:
      prefix: ⬆️ dep-bump

  # scan/ is its own uv project, outside the root workspace. PyTorch and torchvision come from the PyTorch
  # CUDA index and are upgraded by hand together with a training run: Dependabot offered an older build
  # than the index had and left the new lock entries without hashes (#1862).
  - package-ecosystem: uv
    directory: /scan
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: torch
      - dependency-name: torchvision
    groups:
      scan:
        patterns: ["*"]
    commit-message:
      prefix: ⬆️ dep-bump(scan)

  # Updates each hook's `rev:`; local hooks, additional_dependencies and language_version stay manual.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]
    commit-message:
      prefix: ⬆️ dep-bump
