# Version updates: weekly, one grouped pull request per ecosystem, only for releases at least 7 days
# old (a freshly published release is the usual window for a hijacked package). Security updates
# skip the cooldown and the groups, as they should. The commit prefix makes the title
# pass the commit-format check (`<gitmoji> <type>(<scope>): …`); Dependabot adds the colon itself.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ⬆️ dep-bump

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      # The workspace's other member, sim/scenario-runner, only runs the rules scenarios and has no
      # version of its own, so every Rust update is filed under sim/engine.
      prefix: ⬆️ dep-bump(sim/engine)

  - package-ecosystem: bun
    directory: /sim/web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # typescript-eslint does not support TypeScript 7 yet; lift this once it does.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      bun:
        patterns: ["*"]
    commit-message:
      prefix: ⬆️ dep-bump(sim/web)

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns: ["*"]
    commit-message:
      prefix: ⬆️ dep-bump

  # scan/ (own uv project). PyTorch and torchvision are upgraded by hand with a training run: Dependabot
  # offered an older build than the CUDA index had and left the lock entries without hashes (#1862).
  - package-ecosystem: uv
    directory: /scan
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: torch
      - dependency-name: torchvision
    groups:
      scan:
        patterns: ["*"]
    commit-message:
      prefix: ⬆️ dep-bump(scan)

  # Updates each hook's `rev:`; local hooks, additional_dependencies and language_version stay manual.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]
    commit-message:
      prefix: ⬆️ dep-bump
