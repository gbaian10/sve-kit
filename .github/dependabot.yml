# Weekly, one grouped pull request per ecosystem, only for releases at least 7 days old (a freshly
# published release is the usual window for a hijacked package). The commit prefix makes the title
# pass the commit-format check (`<gitmoji> <type>(<scope>): …`); Dependabot adds the colon itself.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ⬆️ dep-bump

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ['*']
    commit-message:
      prefix: ⬆️ dep-bump(sim/engine)

  - package-ecosystem: uv
    directory: /carddb
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns: ['*']
    commit-message:
      prefix: ⬆️ dep-bump(carddb)

  - package-ecosystem: bun
    directory: /sim/web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      bun:
        patterns: ['*']
    commit-message:
      prefix: ⬆️ dep-bump(sim/web)
