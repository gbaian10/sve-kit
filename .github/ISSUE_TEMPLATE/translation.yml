name: Suggest a translation or term
description: Suggest a Traditional Chinese translation or terminology correction.
title: '[Translation]: '
labels: [translation]
body:
  - type: markdown
    attributes:
      value: |
        You can write this issue in any language. Cite the Japanese or English source.
        Do not paste card lists, images, or translations copied from other sites, and do not upload card image files.
        Your own suggestions, including "My own translation", are contributed under CC0-1.0 as described in [LICENSING.md](https://github.com/gbaian10/sve-kit/blob/main/LICENSING.md); rights in the official source text remain unchanged.
  - type: input
    id: current-translation
    attributes:
      label: Current translation or term
      description: Include the original Japanese or English term if there is no translation yet.
    validations:
      required: true
  - type: input
    id: suggested-translation
    attributes:
      label: Suggested translation or term
    validations:
      required: true
  - type: dropdown
    id: translation-source
    attributes:
      label: Source of the suggested translation
      options:
        - My own translation
        - Official Traditional Chinese from a digital Shadowverse game (add a link below)
        - Community term
    validations:
      required: true
  - type: textarea
    id: original-source
    attributes:
      label: Japanese or English original text and source link
      description: Provide the original wording and a link to its Japanese or English source.
      placeholder: |
        Original text:
        Official source URL:
    validations:
      required: true
  - type: input
    id: digital-source-link
    attributes:
      label: Official Traditional Chinese source URL
      description: If you selected the digital game source above, link to its official Traditional Chinese text.
      placeholder: https://...
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain the term or why the proposed translation fits.
    validations:
      required: false
