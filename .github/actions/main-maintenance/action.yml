name: Main cache maintenance
description: Populate existing PR caches without rerunning checks or tests on private main.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true
        save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        cache-suffix: python
        cache-dependency-glob: carddb/uv.lock
    - name: Install Python dependencies (including test dependencies)
      id: python-deps
      shell: bash
      run: uv sync --directory carddb --locked
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true
        restore-cache: false
        save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        cache-suffix: repo
        cache-dependency-glob: carddb/uv.lock
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true
        restore-cache: false
        save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        cache-suffix: rust
        cache-dependency-glob: carddb/uv.lock
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true
        restore-cache: false
        save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        cache-suffix: commit
        cache-dependency-glob: carddb/uv.lock
    - name: Prepare the repo hook cache directory
      shell: bash
      run: rm -rf ~/.cache/pre-commit
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: repo-hook-cache
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-repo-${{ runner.os }}-py3.14-${{ hashFiles('.pre-commit-config.yaml', '.github/ci/hooks.toml') }}
        restore-keys: pre-commit-repo-${{ runner.os }}-py3.14-
    - name: Install repo hook environments without running hooks
      id: repo-hooks
      shell: bash
      run: |
        uv run .github/ci/hooks.py install-config repo > "$RUNNER_TEMP/repo-hooks.yaml"
        uv --directory carddb run --locked pre-commit install-hooks --config "$RUNNER_TEMP/repo-hooks.yaml"
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.repo-hook-cache.outputs.cache-hit != 'true'
      with:
        path: ~/.cache/pre-commit
        key: ${{ steps.repo-hook-cache.outputs.cache-primary-key }}
    - name: Prepare the python hook cache directory
      shell: bash
      run: rm -rf ~/.cache/pre-commit
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: python-hook-cache
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-python-${{ runner.os }}-py3.14-${{ hashFiles('.pre-commit-config.yaml', '.github/ci/hooks.toml') }}
        restore-keys: pre-commit-python-${{ runner.os }}-py3.14-
    - name: Install python hook environments without running hooks
      id: python-hooks
      shell: bash
      run: |
        uv run .github/ci/hooks.py install-config python > "$RUNNER_TEMP/python-hooks.yaml"
        uv --directory carddb run --locked pre-commit install-hooks --config "$RUNNER_TEMP/python-hooks.yaml"
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.python-hook-cache.outputs.cache-hit != 'true'
      with:
        path: ~/.cache/pre-commit
        key: ${{ steps.python-hook-cache.outputs.cache-primary-key }}
    - name: Prepare the rust hook cache directory
      shell: bash
      run: rm -rf ~/.cache/pre-commit
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: rust-hook-cache
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-rust-${{ runner.os }}-py3.14-${{ hashFiles('.pre-commit-config.yaml', '.github/ci/hooks.toml') }}
        restore-keys: pre-commit-rust-${{ runner.os }}-py3.14-
    - name: Install rust hook environments without running hooks
      id: rust-hooks
      shell: bash
      run: |
        uv run .github/ci/hooks.py install-config rust > "$RUNNER_TEMP/rust-hooks.yaml"
        uv --directory carddb run --locked pre-commit install-hooks --config "$RUNNER_TEMP/rust-hooks.yaml"
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust-hook-cache.outputs.cache-hit != 'true'
      with:
        path: ~/.cache/pre-commit
        key: ${{ steps.rust-hook-cache.outputs.cache-primary-key }}
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: mypy-cache
      with:
        path: carddb/.mypy_cache
        key: mypy-${{ runner.os }}-py3.14-${{ hashFiles('carddb/uv.lock', 'carddb/pyproject.toml') }}-${{ github.sha }}
        restore-keys: |
          mypy-${{ runner.os }}-py3.14-${{ hashFiles('carddb/uv.lock', 'carddb/pyproject.toml') }}-
          mypy-${{ runner.os }}-py3.14-
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.mypy-cache.outputs.cache-hit != 'true' && hashFiles('carddb/.mypy_cache/**') != ''
      with:
        path: carddb/.mypy_cache
        key: ${{ steps.mypy-cache.outputs.cache-primary-key }}
    - name: Install the pinned Rust toolchain
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      id: rust-cache
      with:
        # Match the unchanged rust job's automatic prefix, despite this job being ci-ok.
        shared-key: rust
        save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
      if: steps.rust-cache.outputs.cache-hit != 'true'
      with:
        tool: cargo-llvm-cov@0.9.1
    - name: Compile coverage tests for a missing main cache (without running them)
      id: rust-compile
      if: steps.rust-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        # Keep ordinary dependencies warm for PR clippy as well as the coverage target.
        cargo test --locked --workspace -j 4 --no-run
        coverage_env=$(cargo llvm-cov show-env --sh)
        eval "$coverage_env"
        # Match llvm-cov's test directory; show-env defaults to the ordinary target/.
        cargo test --locked --workspace -j 4 --target-dir "${GITHUB_WORKSPACE}/target/llvm-cov-target" --no-run
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        cache: true
        cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: bun-cache
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('sim/web/bun.lock') }}
    - name: Install Web dependencies
      id: web-deps
      shell: bash
      working-directory: sim/web
      run: bun install --frozen-lockfile
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
      with:
        path: ~/.bun/install/cache
        key: ${{ steps.bun-cache.outputs.cache-primary-key }}
    - name: Cache maintenance gate
      if: always()
      shell: bash
      env:
        STEPS: ${{ toJSON(steps) }}
        JOB_STATUS: ${{ job.status }}
      run: |
        [[ "$JOB_STATUS" == success ]] || { echo 'Cache maintenance did not succeed'; exit 1; }
        jq -e '
          ([.[] | .outcome] | all(. != "failure" and . != "cancelled")) and
          ([."python-deps", ."repo-hooks", ."python-hooks", ."rust-hooks", ."mypy-cache", ."rust-cache", ."web-deps"] | all(.outcome == "success")) and
          (if ."rust-cache".outputs["cache-hit"] == "true" then
            ."rust-compile".outcome == "skipped"
          else ."rust-compile".outcome == "success" end)
        ' <<< "$STEPS" >/dev/null || { echo 'Required cache maintenance is incomplete'; exit 1; }
        echo '## Private main cache maintenance passed; checks and tests were not rerun' >> "$GITHUB_STEP_SUMMARY"
