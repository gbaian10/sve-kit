# One workflow for every PR and push to main.
# `ci-ok` is the single required check, so skipping a component never leaves a check pending.
name: ci

on:
  pull_request:
    # ready_for_review runs the full suite once a draft leaves draft.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A unique main group also prevents pending runs from replacing each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: "4"
  PYTEST_WORKERS: ${{ vars.CI_PYTEST_WORKERS || '4' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files through the REST API
    outputs:
      # Drafts cannot merge, so they skip the component test jobs; ci-ok fails until the PR is ready.
      draft: ${{ github.event.pull_request.draft == true }}
      card_data: ${{ github.event.pull_request.draft != true && steps.filter.outputs.card_data == 'true' }}
      author_data: ${{ github.event.pull_request.draft != true && steps.filter.outputs.author_data == 'true' && steps.filter.outputs.python != 'true' && steps.filter.outputs.shared != 'true' }}
      python: ${{ github.event.pull_request.draft != true && (steps.filter.outputs.python == 'true' || steps.filter.outputs.shared == 'true') }}
      python_runtime: ${{ steps.filter.outputs.python_runtime == 'true' || steps.filter.outputs.shared == 'true' }}
      rust: ${{ github.event.pull_request.draft != true && (steps.filter.outputs.rust == 'true' || steps.filter.outputs.shared == 'true') }}
      web: ${{ github.event.pull_request.draft != true && (steps.filter.outputs.web == 'true' || steps.filter.outputs.shared == 'true') }}
      # Rust-only changes still need a WASM build. Web runs already build and measure it.
      engine_wasm: ${{ github.event.pull_request.draft != true && steps.filter.outputs.rust == 'true' && steps.filter.outputs.web != 'true' && steps.filter.outputs.shared != 'true' }}
      scan: ${{ github.event.pull_request.draft != true && (steps.filter.outputs.scan == 'true' || steps.filter.outputs.shared == 'true') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # push events diff against the previous commit with git
          persist-credentials: false
          clean: true
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          # Transitive inputs count: the engine compiles in dsl/ and its tests read tests/ and authored/.
          filters: |
            shared:
              - '.github/**'
              - '.pre-commit-config.yaml'
              - 'mise.toml'
              - 'tests/fixtures/snapshot-contract/**' # shared snapshot contract, read by all three components
            card_data:
              - 'card-data/**'
              - 'carddb/src/**' # includes transitive schema and admission dependencies
              - 'carddb/pyproject.toml'
              - 'publish/pyproject.toml'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
              - '.github/ci/**'
            python_runtime: &python_runtime
              - 'pyproject.toml'
              - 'uv.lock'
              - 'carddb/**' # includes read_api, contracts and lock inputs used by publish
              - 'dsl/**' # schema changes affect Python validation and snapshot contracts
              - 'publish/**'
              - 'tools/schema-er/**'
            python:
              - *python_runtime
              - 'docs/schema/**'
              - 'authored/**' # the registry tests load and validate the real authored data
              - '!authored/rules/author-effects/**'
              - '!authored/rules/effect-bodies/**'
              - '!authored/rules/effects-index/**'
            author_data:
              - 'authored/rules/author-effects/**'
              - 'authored/rules/effect-bodies/**'
              - 'authored/rules/effects-index/**'
            rust:
              - 'card-data/**'
              - 'carddb/src/**' # engine projection and its transitive schema/CLI dependencies
              - 'carddb/pyproject.toml'
              - 'publish/pyproject.toml'
              # The generator hashes support/, and engine tests also call Python fixtures.
              - 'carddb/tests/__init__.py'
              - 'carddb/tests/support/**'
              - 'carddb/tests/domains/__init__.py'
              - 'carddb/tests/domains/effects/__init__.py'
              - 'carddb/tests/domains/registry/__init__.py'
              - 'carddb/tests/domains/registry/test_registry.py'
              - 'carddb/tests/domains/text_observations/__init__.py'
              - 'carddb/tests/domains/text_observations/test_effect_presence.py'
              - 'carddb/tests/ingest/__init__.py'
              - 'carddb/tests/ingest/test_source_archive.py'
              - 'carddb/tests/fixtures/author_entries/golden.yaml'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'sim/battle-contract/**'
              - 'sim/engine/**'
              - 'sim/scenario-runner/**'
              - 'sim/battle-host/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - 'clippy.toml'
              - 'rustfmt.toml'
              - 'dsl/**'
              - 'tests/**'
              - 'authored/**'
            web:
              - 'sim/web/**'
              - 'sim/battle-contract/**' # the web contract types and validator are generated from this crate
              - 'sim/battle-host/**' # the browser loads its WASM bindings
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'bunfig.toml' # bun fmt settings; Tailwind class order is only checked here, with node_modules
              - 'docs/schema/export/public-annotation-cases.json'
              - 'docs/sim/deck-construction-cases.json'
              - 'authored/rules/comprehensive/**'
              - 'authored/translations/comprehensive-rules/**'
              - 'authored/rules/keywords.yaml'
              - 'carddb/src/sve_carddb/contracts/schema/**' # the web reader validates against the published schema
            scan:
              - 'scan/**'
              - 'carddb/src/**' # scan reads exports through sve_carddb.export.read_api
              - 'carddb/pyproject.toml'
              - 'docs/schema/scan/**'

  card-data:
    needs: changes
    if: needs.changes.outputs.card_data == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          path: .card-data-base
          sparse-checkout: card-data
          persist-credentials: false
          clean: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-suffix: ${{ github.job }}
          cache-dependency-glob: uv.lock
      - name: Validate admitted inputs and preserve base history
        run: |
          uv run --directory carddb --locked --no-default-groups sve-carddb parsed-cards validate \
            "$GITHUB_WORKSPACE/card-data" --previous "$GITHUB_WORKSPACE/.card-data-base/card-data"

  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks-range scans the whole pushed commit range
          persist-credentials: false
          clean: true
      # Install prek and Bun for the repository hooks.
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          cache: true
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Hooks pin language_version python3.14 (.pre-commit-config.yaml).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-suffix: ${{ github.job }}
          cache-dependency-glob: uv.lock
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: hook-cache
        with:
          path: ~/.cache/prek
          # Per job, keyed on the hook set it installs: a shared key let the first job to finish save a
          # partial cache that the others hit exactly and then could never update.
          key: prek-${{ github.job }}-${{ runner.os }}-py3.14-${{ hashFiles('.pre-commit-config.yaml', '.github/ci/hooks.toml', 'mise.toml') }}
          restore-keys: prek-${{ github.job }}-${{ runner.os }}-py3.14-
      - name: Every hook has a CI owner and every job reaches ci-ok
        run: |
          uv run .github/ci/hooks.py check
          uv run --project carddb --locked --no-default-groups python -m unittest discover -s .github/ci -p 'test_*.py'
      - name: prek (repo-wide hooks, including the gitleaks commit-range scan)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
        run: |
          SKIP="$(uv run .github/ci/hooks.py skip repo)"
          export SKIP GITLEAKS_RANGE="${BASE}..${HEAD}"
          export SVE_FORMAT_BASE_REF="$BASE"
          # Shared configuration and action metadata can invalidate otherwise unchanged files.
          full_scan_inputs=(
            .pre-commit-config.yaml .github/ci/hooks.toml .github/ci/hooks.py mise.toml
            .github/workflows .github/actionlint.yaml .github/actionlint.yml
            .github/zizmor.yml zizmor.yml
            ':(glob)**/action.yml' ':(glob)**/action.yaml'
            ':(glob)**/.markdownlint*' ':(glob)**/.editorconfig'
            ':(glob)**/.gitattributes' ':(glob)**/.gitleaks*'
            ':(glob)**/ruff.toml' ':(glob)**/.ruff.toml' ':(glob)**/pyproject.toml'
            bunfig.toml taplo.toml .taplo.toml uv.toml carddb/uv.toml
            uv.lock
          )
          scope=(--all-files)
          # Deleted inputs never reach prek's filename filters, but can break the ER build or leave
          # Markdown links to a deleted or renamed file in files the PR did not touch.
          if git diff --quiet "${BASE}...${HEAD}" -- "${full_scan_inputs[@]}" &&
            git diff --quiet --no-renames --diff-filter=D "${BASE}...${HEAD}" -- docs/schema/ ':(glob)**/*.md'; then
            scope=(--from-ref "$BASE" --to-ref "$HEAD")
            if ! git diff --quiet --no-renames "${BASE}...${HEAD}" -- ':(glob)**/*.py'; then
              # Adding or removing a module can change imports in untouched Python files.
              prek run --config .pre-commit-config.yaml ruff-check --all-files --hook-stage manual
              SKIP="$SKIP,ruff-check"
            fi
            if ! git diff --quiet --no-renames --diff-filter=D "${BASE}...${HEAD}"; then
              # Links can also point from untouched Markdown to scripts, images and data.
              prek run --config .pre-commit-config.yaml lychee --all-files --hook-stage manual
              SKIP="$SKIP,lychee"
            fi
          fi
          echo "prek scope: ${scope[*]}"
          prek run --config .pre-commit-config.yaml "${scope[@]}" --hook-stage manual --show-diff-on-failure
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.hook-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/prek
          key: ${{ steps.hook-cache.outputs.cache-primary-key }}

  author-data:
    needs: changes
    if: needs.changes.outputs.author_data == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # identity-only authoring verifies committed transition bases
          persist-credentials: false
          clean: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-suffix: ${{ github.job }}
          cache-dependency-glob: uv.lock
      - name: Validate the authored data
        id: tests
        env:
          TMPDIR: ${{ runner.temp }}
          SVE_DATA_DIR: ${{ runner.temp }}/sve-carddb-test-data
          REPORT_DIR: ${{ runner.temp }}/sve-author-reports
        run: |
          umask 077
          mkdir -p "$REPORT_DIR"
          start=$SECONDS
          [[ "$PYTEST_WORKERS" =~ ^[1-4]$ ]] || { echo 'CI_PYTEST_WORKERS must be 1–4'; exit 1; }
          status=0
          # rust-tests also checks the complete selection while generating its public inputs.
          uv --directory carddb run --locked --python 3.14.10 pytest -n "$PYTEST_WORKERS" --no-cov \
            --shard=1/1 --shard-report="$REPORT_DIR/shard.json" \
            --junitxml="$REPORT_DIR/junit.xml" -o junit_family=xunit1 \
            tests/architecture/test_authored_defaults.py::test_authored_tree_does_not_store_quality_defaults \
            tests/core/test_yaml_reader.py::test_all_production_files_pass_strict_reader \
            tests/domains/rulings/test_authored_hints.py \
            tests/domains/effects/test_author_set.py::test_repository_author_keywords_are_registered \
            tests/workflows/test_authoring.py tests/workflows/test_authoring_cli.py \
            > "$REPORT_DIR/test.log" 2>&1 || status=$?
          echo "$((SECONDS - start))" > "$REPORT_DIR/elapsed.txt"
          echo "pytest exit status: $status (statistics in the next step; raw output stays private)"
          exit "$status"
      - name: Author data test summary
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        env:
          REPORT_DIR: ${{ runner.temp }}/sve-author-reports
        run: python3 .github/ci/test_summary.py python "$REPORT_DIR"
      - name: Remove Python reports and test data
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/sve-author-reports
          SVE_DATA_DIR: ${{ runner.temp }}/sve-carddb-test-data
        run: rm -rf "$REPORT_DIR" "$SVE_DATA_DIR" carddb/htmlcov carddb/.pytest_cache "${RUNNER_TEMP}"/pytest-of-*

  python:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    # Hooks, installed-wheel smokes and the publish tests; the carddb tests run in python-tests.
    timeout-minutes: 20
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # identity-only authoring verifies committed transition bases
          persist-credentials: false
          clean: true
      # Hooks pin language_version python3.14 (.pre-commit-config.yaml).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: prek
          cache: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-suffix: ${{ github.job }}
          cache-dependency-glob: uv.lock
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: hook-cache
        with:
          path: ~/.cache/prek
          # Per job, keyed on the hook set it installs: a shared key let the first job to finish save a
          # partial cache that the others hit exactly and then could never update.
          key: prek-${{ github.job }}-${{ runner.os }}-py3.14-${{ hashFiles('.pre-commit-config.yaml', '.github/ci/hooks.toml', 'mise.toml') }}
          restore-keys: prek-${{ github.job }}-${{ runner.os }}-py3.14-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: mypy-cache
        with:
          path: |
            carddb/.mypy_cache
            publish/.mypy_cache
          key: mypy-${{ runner.os }}-py3.14-${{ hashFiles('uv.lock', 'pyproject.toml', 'carddb/pyproject.toml', 'publish/pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-py3.14-${{ hashFiles('uv.lock', 'pyproject.toml', 'carddb/pyproject.toml', 'publish/pyproject.toml') }}-
            mypy-${{ runner.os }}-py3.14-
      - name: Runner CPU count
        run: nproc
      # Test hooks are owned by this job but run directly below.
      - name: prek (python hooks)
        run: |
          SKIP="$(uv run .github/ci/hooks.py skip python)"
          export SKIP SVE_DATA_DIR="${RUNNER_TEMP}/sve-carddb-test-data"
          for stage in $(uv run .github/ci/hooks.py stages python); do
            echo "::group::stage $stage"
            prek run --config .pre-commit-config.yaml --all-files --hook-stage "$stage" --show-diff-on-failure
            echo "::endgroup::"
          done
      - name: Installed carddb wheel smoke
        run: |
          uv build --wheel carddb --out-dir "${RUNNER_TEMP}/carddb-wheel"
          UV_PROJECT_ENVIRONMENT="${RUNNER_TEMP}/carddb-wheel-env" uv sync --package sve-carddb --locked --no-default-groups --no-install-workspace
          uv pip install --no-deps --python "${RUNNER_TEMP}/carddb-wheel-env/bin/python" "${RUNNER_TEMP}"/carddb-wheel/*.whl
          "${RUNNER_TEMP}/carddb-wheel-env/bin/python" -I -B .github/ci/carddb_wheel_smoke.py "$GITHUB_WORKSPACE/tests/fixtures/snapshot-contract/v3"
          "${RUNNER_TEMP}/carddb-wheel-env/bin/sve-carddb" --help > /dev/null
      - name: Installed publish wheel smoke
        run: |
          uv build --wheel --project ./publish --out-dir "${RUNNER_TEMP}/publish-wheel"
          UV_PROJECT_ENVIRONMENT="${RUNNER_TEMP}/publish-wheel-env" uv sync --package sve-publish --locked --no-default-groups --no-install-workspace
          uv pip install --no-deps --python "${RUNNER_TEMP}/publish-wheel-env/bin/python" "${RUNNER_TEMP}"/carddb-wheel/*.whl "${RUNNER_TEMP}"/publish-wheel/*.whl
          "${RUNNER_TEMP}/publish-wheel-env/bin/sve-publish" --help > /dev/null
          "${RUNNER_TEMP}/publish-wheel-env/bin/sve-publish" images upload --help > /dev/null
          "${RUNNER_TEMP}/publish-wheel-env/bin/sve-publish" images gc --help > /dev/null
          "${RUNNER_TEMP}/publish-wheel-env/bin/sve-publish" snapshot upload --help > /dev/null
          "${RUNNER_TEMP}/publish-wheel-env/bin/sve-publish" snapshot gc --help > /dev/null
      - name: publish pytest (independent synthetic coverage gate)
        id: publish-tests
        if: ${{ !cancelled() }}
        env:
          TMPDIR: ${{ runner.temp }}
          REPORT_DIR: ${{ runner.temp }}/sve-publish-reports
        run: |
          umask 077
          mkdir -p "$REPORT_DIR"
          start=$SECONDS
          [[ "$PYTEST_WORKERS" =~ ^[1-4]$ ]] || { echo 'CI_PYTEST_WORKERS must be 1–4'; exit 1; }
          status=0
          uv --directory ./publish run --locked pytest -n "$PYTEST_WORKERS" --cov --durations=30 \
            --junitxml="$REPORT_DIR/junit.xml" -o junit_family=xunit1 \
            --cov-report="json:$REPORT_DIR/coverage.json" \
            > "$REPORT_DIR/test.log" 2>&1 || status=$?
          echo "$((SECONDS - start))" > "$REPORT_DIR/elapsed.txt"
          echo "publish pytest exit status: $status (statistics in the next step)"
          exit "$status"
      - name: Publish test summary
        if: ${{ !cancelled() && (steps.publish-tests.outcome == 'success' || steps.publish-tests.outcome == 'failure') }}
        env:
          REPORT_DIR: ${{ runner.temp }}/sve-publish-reports
        run: python3 .github/ci/test_summary.py publish "$REPORT_DIR"
      - name: Remove Python reports and test data
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/sve-publish-reports
          SVE_DATA_DIR: ${{ runner.temp }}/sve-carddb-test-data
        run: rm -rf "$REPORT_DIR" "$SVE_DATA_DIR" carddb/htmlcov publish/htmlcov publish/.pytest_cache "${RUNNER_TEMP}"/pytest-of-*
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.mypy-cache.outputs.cache-hit != 'true'
        with:
          path: |
            carddb/.mypy_cache
            publish/.mypy_cache
          key: ${{ steps.mypy-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.hook-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/prek
          key: ${{ steps.hook-cache.outputs.cache-primary-key }}

  python-tests:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    # Exceeding this limit means a test regression: fix the tests, do not raise the timeout.
    timeout-minutes: 15
    strategy:
      # Every shard reports its own failures.
      fail-fast: false
      matrix:
        # Each test runs in exactly one shard; python-coverage checks that and gates the combined coverage.
        shard: [1, 2, 3]
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # identity-only authoring verifies committed transition bases
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: false
          cache: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-suffix: ${{ github.job }}
          cache-dependency-glob: uv.lock
      - name: pytest (one shard; the 90% gate runs on the combined shards)
        id: tests
        env:
          TMPDIR: ${{ runner.temp }}
          SVE_DATA_DIR: ${{ runner.temp }}/sve-carddb-test-data
          REPORT_DIR: ${{ runner.temp }}/sve-python-reports
          COVERAGE_DIR: ${{ runner.temp }}/sve-python-coverage
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          PYTHON_RUNTIME: ${{ needs.changes.outputs.python_runtime }}
        run: |
          umask 077
          rm -rf "$REPORT_DIR" "$SVE_DATA_DIR"
          mkdir -p "$REPORT_DIR"
          start=$SECONDS
          [[ "$PYTEST_WORKERS" =~ ^[1-4]$ ]] || { echo 'CI_PYTEST_WORKERS must be 1–4'; exit 1; }
          status=0
          selection=()
          if [[ "$PYTHON_RUNTIME" == false ]]; then
            selection+=(--deselect=tests/architecture/test_module_imports.py::test_module_first_import_in_fresh_process)
          fi
          # One shard's coverage is partial, so the 90% fail-under applies in python-coverage instead.
          uv --directory carddb run --locked pytest -n "$PYTEST_WORKERS" --cov --durations=30 \
            --cov-fail-under=0 --shard="$SHARD" --shard-report="$REPORT_DIR/shard.json" \
            --junitxml="$REPORT_DIR/junit.xml" -o junit_family=xunit1 "${selection[@]}" \
            > "$REPORT_DIR/test.log" 2>&1 || status=$?
          echo "$((SECONDS - start))" > "$REPORT_DIR/elapsed.txt"
          echo "pytest exit status: $status (statistics in the next step; raw output stays private)"
          if [ "$status" -eq 0 ]; then
            mkdir -p "$COVERAGE_DIR"
            cp carddb/htmlcov/.coverage "$COVERAGE_DIR/shard-${SHARD%/*}.coverage"
            cp "$REPORT_DIR/shard.json" "$COVERAGE_DIR/shard-${SHARD%/*}.json"
          fi
          exit "$status"
      - name: Python test summary
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        env:
          REPORT_DIR: ${{ runner.temp }}/sve-python-reports
        run: python3 .github/ci/test_summary.py python "$REPORT_DIR"
      # Test Analytics gets a copy with parameters hashed and no failure text or output: the raw report can hold
      # card wording. Informational, so a failure or slow upload here never reaches the job result.
      - name: Sanitize carddb test results
        id: public-junit
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          REPORT_DIR: ${{ runner.temp }}/sve-python-reports
        run: python3 .github/ci/junit_public.py "$REPORT_DIR/junit.xml" "$REPORT_DIR/junit-public.xml"
      - name: Upload carddb test results to Codecov
        if: ${{ !cancelled() && steps.public-junit.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: ${{ runner.temp }}/sve-python-reports/junit-public.xml
          disable_search: true
          flags: carddb
          fail_ci_if_error: false
      # Coverage data holds source paths and line/branch hits only: no card text, test names or output.
      - name: Hand the shard's coverage data to python-coverage
        if: ${{ steps.tests.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage-${{ matrix.shard }}
          path: ${{ runner.temp }}/sve-python-coverage/
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Remove Python reports and test data
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/sve-python-reports
          COVERAGE_DIR: ${{ runner.temp }}/sve-python-coverage
          SVE_DATA_DIR: ${{ runner.temp }}/sve-carddb-test-data
        run: rm -rf "$REPORT_DIR" "$COVERAGE_DIR" "$SVE_DATA_DIR" carddb/htmlcov carddb/.pytest_cache "${RUNNER_TEMP}"/pytest-of-*

  python-coverage:
    needs: [changes, python-tests]
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-suffix: ${{ github.job }}
          cache-dependency-glob: uv.lock
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-coverage-*
          merge-multiple: true
          path: ${{ runner.temp }}/sve-python-coverage
      - name: Combined coverage (full 90% gate)
        id: coverage
        env:
          DATA_DIR: ${{ runner.temp }}/sve-python-coverage
        run: |
          mkdir -p carddb/htmlcov
          # Every shard ran in the same checkout path, so the data files combine without remapping.
          uv --directory carddb run --locked coverage combine --keep "$DATA_DIR"/shard-*.coverage
          uv --directory carddb run --locked coverage json -o "$DATA_DIR/coverage.json"
          uv --directory carddb run --locked coverage xml -o "$DATA_DIR/coverage.xml"
          uv --directory carddb run --locked coverage report --format=total --fail-under=90
      - name: Python coverage summary
        if: ${{ !cancelled() && (steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure') }}
        env:
          DATA_DIR: ${{ runner.temp }}/sve-python-coverage
        run: python3 .github/ci/test_summary.py python-coverage "$DATA_DIR"
      # Informational only: the 90% gate stays in the two steps above. continue-on-error keeps a failure of the
      # action's own setup steps (fail_ci_if_error only covers the upload) from failing the job and so ci-ok.
      # The report holds file names and line hits, no card text. Fork PRs have no secret and upload tokenless.
      - name: Upload carddb coverage to Codecov
        if: ${{ !cancelled() && (steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 5
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ runner.temp }}/sve-python-coverage/coverage.xml
          disable_search: true
          flags: carddb
          fail_ci_if_error: false
      - name: Remove Python coverage data
        if: always()
        env:
          DATA_DIR: ${{ runner.temp }}/sve-python-coverage
        run: rm -rf "$DATA_DIR" carddb/htmlcov

  rust:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    # fmt, clippy, deny, machete and doctests; unit/integration tests run in rust-tests.
    timeout-minutes: 30
    env:
      MISE_EXEC_AUTO_INSTALL: "false" # the cargo hooks go through `mise exec`; Rust itself comes from rustup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        id: rust-cache
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@0.19.9,cargo-machete@0.9.2
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: prek
          cache: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-suffix: ${{ github.job }}
          cache-dependency-glob: uv.lock
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: hook-cache
        with:
          path: ~/.cache/prek
          # Per job, keyed on the hook set it installs: a shared key let the first job to finish save a
          # partial cache that the others hit exactly and then could never update.
          key: prek-${{ github.job }}-${{ runner.os }}-py3.14-${{ hashFiles('.pre-commit-config.yaml', '.github/ci/hooks.toml', 'mise.toml') }}
          restore-keys: prek-${{ github.job }}-${{ runner.os }}-py3.14-
      # The coverage test hook runs in rust-tests; the other checks keep their local hooks.
      - name: prek (rust hooks)
        run: |
          SKIP="$(uv run .github/ci/hooks.py skip rust)"
          export SKIP
          for stage in $(uv run .github/ci/hooks.py stages rust); do
            echo "::group::stage $stage"
            prek run --config .pre-commit-config.yaml --all-files --hook-stage "$stage" --show-diff-on-failure
            echo "::endgroup::"
          done
      # llvm-cov covers unit/integration tests, but does not run stable compile-fail doctests.
      - name: Engine public API boundaries (doctests)
        run: cargo test --locked -p sve-engine --doc
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.hook-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/prek
          key: ${{ steps.hook-cache.outputs.cache-primary-key }}

  rust-tests:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    # Exceeding this limit means a test regression: fix the tests, do not raise the timeout.
    timeout-minutes: 25
    strategy:
      # Every shard reports its own failures.
      fail-fast: false
      matrix:
        # Each test runs in exactly one shard; rust-coverage checks that and gates the merged coverage.
        # Every shard builds the same binaries itself: building once would add a sequential job and a large artifact.
        shard: [1, 2, 3]
    env:
      MISE_EXEC_AUTO_INSTALL: "false" # Cargo goes through `mise exec`; Rust itself comes from rustup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the public authoring selection verifies transition bases
          persist-credentials: false
          clean: true
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # Dependencies parse the large public inputs; optimising only them ("*" excludes workspace members) keeps
      # every workspace crate unoptimised and instrumented, and the report already excludes dependency sources.
      - name: Optimise dependencies only
        run: printf '[profile.dev.package."*"]\nopt-level = 2\n' >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: false
          cache: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-suffix: ${{ github.job }}
          cache-dependency-glob: uv.lock
      - name: Rust tests (public inputs, one shard; the 90% gate runs on the merged shards)
        id: tests
        env:
          REPORT_DIR: ${{ runner.temp }}/sve-rust-reports
          COVERAGE_DIR: ${{ runner.temp }}/sve-rust-coverage
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          umask 077
          rm -rf "$REPORT_DIR"
          mkdir -p "$REPORT_DIR"
          start=$SECONDS
          status=0
          python3 .github/ci/rust_tests.py --shard="$SHARD" --shard-report="$REPORT_DIR" \
            > "$REPORT_DIR/test.log" 2>&1 || status=$?
          echo "$((SECONDS - start))" > "$REPORT_DIR/elapsed.txt"
          echo "cargo llvm-cov exit status: $status (statistics in the next step; raw output stays private)"
          if [ "$status" -eq 0 ]; then
            mkdir -p "$COVERAGE_DIR"
            cp -r "$REPORT_DIR/coverage" "$COVERAGE_DIR/shard-${SHARD%/*}"
            cp "$REPORT_DIR/shard.json" "$COVERAGE_DIR/shard-${SHARD%/*}.json"
          fi
          exit "$status"
      - name: Rust test summary
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        env:
          REPORT_DIR: ${{ runner.temp }}/sve-rust-reports
        run: python3 .github/ci/test_summary.py rust "$REPORT_DIR"
      # The profile and the objects' coverage sections hold function names, source paths and counters only:
      # no card text or test output (official test data is read at runtime, never compiled in).
      - name: Hand the shard's coverage to rust-coverage
        if: ${{ steps.tests.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage-${{ matrix.shard }}
          path: ${{ runner.temp }}/sve-rust-coverage/
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Remove Rust reports
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/sve-rust-reports
          COVERAGE_DIR: ${{ runner.temp }}/sve-rust-coverage
        run: rm -rf "$REPORT_DIR" "$COVERAGE_DIR"

  rust-coverage:
    needs: [changes, rust-tests]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      # llvm-profdata and llvm-cov come from the pinned toolchain's llvm-tools component.
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rust-coverage-*
          merge-multiple: true
          path: ${{ runner.temp }}/sve-rust-coverage
      # llvm-cov reports the merged profiles with each shard's exact filter, as a single run would.
      - name: Merged line coverage (full 90% gate)
        id: coverage
        env:
          DATA_DIR: ${{ runner.temp }}/sve-rust-coverage
        run: python3 .github/ci/rust_coverage.py "$DATA_DIR"
      - name: Rust coverage summary
        if: ${{ !cancelled() && (steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure') }}
        env:
          DATA_DIR: ${{ runner.temp }}/sve-rust-coverage
        run: python3 .github/ci/test_summary.py rust-coverage "$DATA_DIR"
      # Informational: the 90% line gate above stays the gate.
      - name: Upload Rust coverage to Codecov
        if: ${{ !cancelled() && (steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 5
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ runner.temp }}/sve-rust-coverage/lcov.info
          disable_search: true
          flags: rust
          fail_ci_if_error: false
      - name: Remove Rust coverage data
        if: always()
        env:
          DATA_DIR: ${{ runner.temp }}/sve-rust-coverage
        run: rm -rf "$DATA_DIR"

  engine-wasm:
    needs: changes
    if: ${{ needs.changes.outputs.engine_wasm == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MISE_EXEC_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      # rust-toolchain.toml lists the wasm32 target, so this installs it too.
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: engine-wasm
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Must equal the wasm-bindgen version in Cargo.lock; build:engine checks it.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: wasm-bindgen@0.2.129
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          cache: true
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # The build and size scripts use only Node built-ins, so no bun install is needed.
      - name: Build the engine to WebAssembly
        working-directory: sim/web
        run: |
          bun run build:engine
          bun run scripts/engine/size.ts >> "$GITHUB_STEP_SUMMARY"

  web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    # The required steps keep 20 minutes; each of the two Codecov upload steps below has its own 5.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sim/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      # Bun and Node versions come from mise.toml.
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          cache: true
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: hook-cache
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('sim/web/bun.lock') }}
      - run: bun install --frozen-lockfile
      # The generated files are never committed: a second generation must reproduce the first byte for
      # byte, and every fixture must survive Rust → JSON → generated validator → Rust unchanged.
      - name: Battle contract generation is reproducible and round-trips
        run: bun run check:contract
      # Types, tests and the bundle also import the engine glue (never committed); Rust is installed above.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: wasm-bindgen@0.2.129
      - name: Build the engine to WebAssembly
        run: |
          bun run build:engine
          bun run scripts/engine/size.ts >> "$GITHUB_STEP_SUMMARY"
      - name: Web formatting, lint, types and both Knip modes
        run: bun run format:check && bun run lint:prepared && bun run typecheck:prepared && bun run knip:prepared
      - name: Vitest
        id: tests
        env:
          REPORT_DIR: ${{ runner.temp }}/sve-web-reports
        run: |
          umask 077
          rm -rf "$REPORT_DIR"
          mkdir -p "$REPORT_DIR"
          status=0
          start=$SECONDS
          export SVE_PUBLIC_JUNIT="$REPORT_DIR/junit-public.xml"
          bun run test:prepared --maxWorkers=4 --reporter=junit --outputFile="$REPORT_DIR/junit.xml" \
            --reporter=./scripts/ci/public-junit-reporter.ts \
            --retry=2 --coverage --coverage.reportsDirectory="$REPORT_DIR/coverage" \
            > "$REPORT_DIR/test.log" 2>&1 || status=$?
          echo "$((SECONDS - start))" > "$REPORT_DIR/elapsed.txt"
          echo "vitest exit status: $status (statistics in the next step; raw output stays private)"
          exit "$status"
      - name: Web test summary
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        env:
          REPORT_DIR: ${{ runner.temp }}/sve-web-reports
        run: python3 ../../.github/ci/test_summary.py web "$REPORT_DIR"
      - name: Web coverage summary
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        env:
          REPORT_DIR: ${{ runner.temp }}/sve-web-reports
        run: |
          # vitest only exports coverage when the tests pass; the 85% branch gate itself is in vite.config.ts.
          if [ -f "$REPORT_DIR/coverage/coverage-summary.json" ]; then
            jq -r '.total | "Web coverage: branches **\(.branches.pct)%** (required **85%**), lines **\(.lines.pct)%**."' \
              "$REPORT_DIR/coverage/coverage-summary.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Web coverage unavailable; branches required **85%**." >> "$GITHUB_STEP_SUMMARY"
          fi
      # Informational: the branch gate stays in vitest. The upload may fail or hang without touching the job result.
      - name: Upload Web coverage to Codecov
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ runner.temp }}/sve-web-reports/coverage/lcov.info
          disable_search: true
          flags: web
          fail_ci_if_error: false
      # Test Analytics: the reporter records each retry as a failed attempt, so a test that passed only on
      # retry shows up as flaky. Names are title hashes and no message leaves the runner.
      - name: Upload Web test results to Codecov
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 5
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: ${{ runner.temp }}/sve-web-reports/junit-public.xml
          disable_search: true
          flags: web
          fail_ci_if_error: false
      - name: Remove private Web reports
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/sve-web-reports
        run: rm -rf "$REPORT_DIR"
      # The token adds the Codecov bundle analysis plugin to this one build; the plugin only logs a failed
      # upload (it never fails the build), so the build stays the gate without a second run.
      - name: Web build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: bun run build:prepared
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.hook-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.hook-cache.outputs.cache-primary-key }}

  scan:
    needs: changes
    if: ${{ needs.changes.outputs.scan == 'true' }}
    runs-on: ubuntu-latest
    # The card scanner's own uv project: light dependencies only (no torch, no GPU, no private data).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-suffix: ${{ github.job }}
          cache-dependency-glob: scan/uv.lock
      - name: scan lint and tests
        run: |
          uv --directory scan sync --locked
          uv --directory scan run --locked ruff check
          uv --directory scan run --locked ruff format --check
          uv --directory scan run --locked pytest -q

  ci-ok:
    if: always()
    needs:
      - changes
      - repo
      - card-data
      - author-data
      - python
      - python-tests
      - python-coverage
      - rust
      - rust-tests
      - rust-coverage
      - engine-wasm
      - web
      - scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that had to run succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # Unmapped jobs are mandatory; only unchanged components may skip.
          component='{"card-data":"card_data","author-data":"author_data","python":"python","python-tests":"python","python-coverage":"python","rust":"rust","rust-tests":"rust","rust-coverage":"rust","engine-wasm":"engine_wasm","web":"web","scan":"scan"}'
          jq -e '.changes.result == "success"' <<<"$NEEDS" >/dev/null || { echo "changes: $(jq -r .changes.result <<<"$NEEDS")"; exit 1; }
          status=0
          for job in $(jq -r 'keys[] | select(. != "changes")' <<<"$NEEDS"); do
            result=$(jq -r --arg j "$job" '.[$j].result' <<<"$NEEDS")
            wanted=$(jq -r --arg j "$job" --argjson c "$component" 'if $c[$j] then (.changes.outputs[$c[$j]] // "true") else "true" end' <<<"$NEEDS")
            if [ "$result" = success ] || { [ "$wanted" = false ] && [ "$result" = skipped ]; }; then
              echo "ok   $job ($result)"
            else
              echo "FAIL $job: $result (required: $wanted)"
              status=1
            fi
          done
          if jq -e '.changes.outputs.draft == "true"' <<<"$NEEDS" >/dev/null; then
            echo "FAIL draft: component tests were not run; mark the PR ready for review to run them"
            echo "Draft PR: component tests were not run. Mark it ready for review to run the full suite." >>"$GITHUB_STEP_SUMMARY"
            status=1
          fi
          exit "$status"
