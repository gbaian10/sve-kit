# One workflow for every PR and push to main. `changes` decides which component jobs run;
# `ci-ok` is the single required check, so skipping a component never leaves a check pending.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files through the REST API
    outputs:
      python: ${{ steps.filter.outputs.python == 'true' || steps.filter.outputs.shared == 'true' }}
      rust: ${{ steps.filter.outputs.rust == 'true' || steps.filter.outputs.shared == 'true' }}
      web: ${{ steps.filter.outputs.web == 'true' || steps.filter.outputs.shared == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # push events diff against the previous commit with git
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Transitive inputs count: the engine compiles in dsl/ and its tests read tests/ and authored/.
          filters: |
            shared:
              - '.github/**'
              - '.pre-commit-config.yaml'
              - 'mise.toml'
              - 'tests/fixtures/snapshot-contract/**' # shared snapshot contract, read by all three components
            python:
              - 'carddb/**'
              - 'docs/schema/**'
              - 'authored/**' # the registry tests load and validate the real authored data
            rust:
              - 'sim/engine/**'
              - 'sim/scenario-runner/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - 'clippy.toml'
              - 'rustfmt.toml'
              - 'dsl/**'
              - 'tests/**'
              - 'authored/**'
              - 'docs/m0/*.yaml'
            web:
              - 'sim/web/**'
              - 'carddb/src/sve_carddb/snapshot/schema/**' # the web reader validates against the published schema

  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks-range scans the whole pushed commit range
          persist-credentials: false
      # Hooks pin language_version python3.14 (.pre-commit-config.yaml).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-suffix: ${{ github.job }}
          cache-dependency-glob: carddb/uv.lock
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: hook-cache
        with:
          path: ~/.cache/pre-commit
          # Per job, keyed on the hook set it installs: a shared key let the first job to finish save a
          # partial cache that the others hit exactly and then could never update.
          key: pre-commit-${{ github.job }}-${{ runner.os }}-py3.14-${{ hashFiles('.pre-commit-config.yaml', '.github/ci/hooks.toml') }}
          restore-keys: pre-commit-${{ github.job }}-${{ runner.os }}-py3.14-
      - name: Every hook has a CI owner and every job reaches ci-ok
        run: |
          uv run .github/ci/hooks.py check
          uv run --project carddb --locked --no-default-groups --group dev python -m unittest discover -s .github/ci -p 'test_hooks.py'
      - name: pre-commit (repo-wide hooks, including the gitleaks commit-range scan)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
        run: |
          SKIP="$(uv run .github/ci/hooks.py skip repo)"
          export SKIP GITLEAKS_RANGE="${BASE}..${HEAD}"
          uv run --project carddb --locked --no-default-groups --group dev pre-commit run --all-files --hook-stage manual --show-diff-on-failure
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.hook-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/pre-commit
          key: ${{ steps.hook-cache.outputs.cache-primary-key }}

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Hooks pin language_version python3.14 (.pre-commit-config.yaml).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-suffix: ${{ github.job }}
          cache-dependency-glob: carddb/uv.lock
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: hook-cache
        with:
          path: ~/.cache/pre-commit
          # Per job, keyed on the hook set it installs: a shared key let the first job to finish save a
          # partial cache that the others hit exactly and then could never update.
          key: pre-commit-${{ github.job }}-${{ runner.os }}-py3.14-${{ hashFiles('.pre-commit-config.yaml', '.github/ci/hooks.toml') }}
          restore-keys: pre-commit-${{ github.job }}-${{ runner.os }}-py3.14-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: mypy-cache
        with:
          path: carddb/.mypy_cache
          key: mypy-${{ runner.os }}-py3.14-${{ hashFiles('carddb/uv.lock', 'carddb/pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-py3.14-${{ hashFiles('carddb/uv.lock', 'carddb/pyproject.toml') }}-
            mypy-${{ runner.os }}-py3.14-
      - name: Runner CPU count
        run: nproc
      # ruff, mypy (carddb and the ER generator) and pytest, through the same hooks as local runs.
      - name: pre-commit (python hooks)
        run: |
          SKIP="$(uv run .github/ci/hooks.py skip python)"
          export SKIP SVE_DATA_DIR="${RUNNER_TEMP}/sve-carddb-test-data"
          for stage in $(uv run .github/ci/hooks.py stages python); do
            echo "::group::stage $stage"
            uv run --project carddb --locked pre-commit run --all-files --hook-stage "$stage" --show-diff-on-failure
            echo "::endgroup::"
          done
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.mypy-cache.outputs.cache-hit != 'true'
        with:
          path: carddb/.mypy_cache
          key: ${{ steps.mypy-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.hook-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/pre-commit
          key: ${{ steps.hook-cache.outputs.cache-primary-key }}

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MISE_EXEC_AUTO_INSTALL: 'false' # the cargo hooks go through `mise exec`; Rust itself comes from rustup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the test data pin
        id: pin
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open(".github/ci/testdata.lock", "rb") as f:
              pin = tomllib.load(f)
          for key in ("repo", "commit", "snapshot_path", "snapshot_sha256"):
              print(f"{key}={pin[key]}")
          PY
      # Private card text for the engine tests; a missing key or hash mismatch fails the job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.commit }}
          ssh-key: ${{ secrets.TESTDATA_DEPLOY_KEY }}
          path: .testdata
          persist-credentials: false
      - name: Verify the test data
        env:
          SNAPSHOT: .testdata/${{ steps.pin.outputs.snapshot_path }}
          EXPECTED: ${{ steps.pin.outputs.snapshot_sha256 }}
          COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          test "$(git -C .testdata rev-parse HEAD)" = "$COMMIT"
          echo "${EXPECTED}  ${SNAPSHOT}" | sha256sum -c -
          echo "SVE_TEST_SNAPSHOT=${GITHUB_WORKSPACE}/${SNAPSHOT}" >> "$GITHUB_ENV"
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-deny@0.19.9,cargo-machete@0.9.2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
          cache: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-suffix: ${{ github.job }}
          cache-dependency-glob: carddb/uv.lock
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: hook-cache
        with:
          path: ~/.cache/pre-commit
          # Per job, keyed on the hook set it installs: a shared key let the first job to finish save a
          # partial cache that the others hit exactly and then could never update.
          key: pre-commit-${{ github.job }}-${{ runner.os }}-py3.14-${{ hashFiles('.pre-commit-config.yaml', '.github/ci/hooks.toml') }}
          restore-keys: pre-commit-${{ github.job }}-${{ runner.os }}-py3.14-
      # fmt, clippy, tests with the 90% line-coverage gate, deny and machete, through the local hooks.
      - name: pre-commit (rust hooks)
        run: |
          SKIP="$(uv run .github/ci/hooks.py skip rust)"
          export SKIP
          for stage in $(uv run .github/ci/hooks.py stages rust); do
            echo "::group::stage $stage"
            uv run --project carddb --locked --no-default-groups --group dev pre-commit run --all-files --hook-stage "$stage" --show-diff-on-failure
            echo "::endgroup::"
          done
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.hook-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/pre-commit
          key: ${{ steps.hook-cache.outputs.cache-primary-key }}

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sim/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Bun and Node versions come from mise.toml.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: hook-cache
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('sim/web/bun.lock') }}
      - run: bun install --frozen-lockfile
      # package.json scripts are the single entry point: Prettier, ESLint, Stylelint, tsc -b, Vitest and the build.
      - run: bun run check
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.hook-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.hook-cache.outputs.cache-primary-key }}

  # Every commit that reaches the base branch must follow the commitizen format (.cz.toml), gitmoji included.
  # Runs on every event regardless of paths; the PR title has its own workflow (pr-title.yml).
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-suffix: ${{ github.job }}
          cache-dependency-glob: carddb/uv.lock
      - name: cz check (pushed commit range)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
        run: |
          git cat-file -e "${BASE}^{commit}"
          git cat-file -e "${HEAD}^{commit}"
          uv run --project carddb --locked --no-default-groups --group dev python .github/ci/commit_msg.py --rev-range "${BASE}..${HEAD}"

  ci-ok:
    if: always()
    needs: [changes, repo, python, rust, web, commit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that had to run succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # Unmapped jobs are mandatory; only unchanged components may skip.
          component='{"python":"python","rust":"rust","web":"web"}'
          jq -e '.changes.result == "success"' <<<"$NEEDS" >/dev/null || { echo "changes: $(jq -r .changes.result <<<"$NEEDS")"; exit 1; }
          status=0
          for job in $(jq -r 'keys[] | select(. != "changes")' <<<"$NEEDS"); do
            result=$(jq -r --arg j "$job" '.[$j].result' <<<"$NEEDS")
            wanted=$(jq -r --arg j "$job" --argjson c "$component" 'if $c[$j] then (.changes.outputs[$c[$j]] // "true") else "true" end' <<<"$NEEDS")
            if [ "$result" = success ] || { [ "$wanted" = false ] && [ "$result" = skipped ]; }; then
              echo "ok   $job ($result)"
            else
              echo "FAIL $job: $result (required: $wanted)"
              status=1
            fi
          done
          exit "$status"
