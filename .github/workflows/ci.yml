# One workflow for every PR and push to main.
# `ci-ok` is the single required check, so skipping a component never leaves a check pending.
name: ci

on:
  pull_request:
    # ready_for_review runs the full suite once a draft leaves draft.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A unique main group also prevents pending runs from replacing each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: "4"
  PYTEST_WORKERS: ${{ vars.CI_PYTEST_WORKERS || '4' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files through the REST API
    outputs:
      # Drafts cannot merge, so they skip the component test jobs; ci-ok fails until the PR is ready.
      draft: ${{ github.event.pull_request.draft == true }}
      card_data: ${{ github.event.pull_request.draft != true && steps.filter.outputs.card_data == 'true' }}
      python: ${{ github.event.pull_request.draft != true && (steps.filter.outputs.python == 'true' || steps.filter.outputs.shared == 'true') }}
      rust: ${{ github.event.pull_request.draft != true && (steps.filter.outputs.rust == 'true' || steps.filter.outputs.shared == 'true') }}
      web: ${{ github.event.pull_request.draft != true && (steps.filter.outputs.web == 'true' || steps.filter.outputs.shared == 'true') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # push events diff against the previous commit with git
          persist-credentials: false
          clean: true
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Transitive inputs count: the engine compiles in dsl/ and its tests read tests/ and authored/.
          filters: |
            shared:
              - '.github/**'
              - '.pre-commit-config.yaml'
              - 'mise.toml'
              - 'tests/fixtures/snapshot-contract/**' # shared snapshot contract, read by all three components
            card_data:
              - 'card-data/**'
              - 'carddb/src/**' # includes transitive schema and admission dependencies
              - 'carddb/pyproject.toml'
              - 'carddb/uv.lock'
              - '.github/workflows/ci.yml'
              - '.github/ci/**'
            python:
              - 'carddb/**' # includes read_api, contracts and lock inputs used by publish
              - 'dsl/**' # schema changes must run the Python type drift checks
              - 'publish/**'
              - 'docs/schema/**'
              - 'tools/schema-er/**'
              - 'authored/**' # the registry tests load and validate the real authored data
            rust:
              - 'card-data/**'
              - 'carddb/src/**' # engine projection and its transitive schema/CLI dependencies
              - 'carddb/pyproject.toml'
              - 'carddb/uv.lock'
              - 'sim/engine/**'
              - 'sim/scenario-runner/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - 'clippy.toml'
              - 'rustfmt.toml'
              - 'dsl/**'
              - 'tests/**'
              - 'authored/**'
              - 'tests/engine/*.yaml'
            web:
              - 'sim/web/**'
              - 'bunfig.toml' # bun fmt settings; Tailwind class order is only checked here, with node_modules
              - 'docs/schema/export/public-annotation-cases.json'
              - 'carddb/src/sve_carddb/contracts/schema/**' # the web reader validates against the published schema

  card-data:
    needs: changes
    if: needs.changes.outputs.card_data == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          path: .card-data-base
          sparse-checkout: card-data
          persist-credentials: false
          clean: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-suffix: ${{ github.job }}
          cache-dependency-glob: |
            carddb/uv.lock
            publish/uv.lock
      - name: Validate admitted inputs and preserve base history
        run: |
          uv run --directory carddb --locked --no-default-groups sve-carddb parsed-cards validate \
            "$GITHUB_WORKSPACE/card-data" --previous "$GITHUB_WORKSPACE/.card-data-base/card-data"

  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks-range scans the whole pushed commit range
          persist-credentials: false
          clean: true
      # The bun-fmt hook runs Bun from mise.toml.
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          cache: true
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Hooks pin language_version python3.14 (.pre-commit-config.yaml).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-suffix: ${{ github.job }}
          cache-dependency-glob: |
            carddb/uv.lock
            publish/uv.lock
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: hook-cache
        with:
          path: ~/.cache/pre-commit
          # Per job, keyed on the hook set it installs: a shared key let the first job to finish save a
          # partial cache that the others hit exactly and then could never update.
          key: pre-commit-${{ github.job }}-${{ runner.os }}-py3.14-${{ hashFiles('.pre-commit-config.yaml', '.github/ci/hooks.toml') }}
          restore-keys: pre-commit-${{ github.job }}-${{ runner.os }}-py3.14-
      - name: Every hook has a CI owner and every job reaches ci-ok
        run: |
          uv run .github/ci/hooks.py check
          uv run --project carddb --locked --no-default-groups --group dev python -m unittest discover -s .github/ci -p 'test_*.py'
      - name: pre-commit (repo-wide hooks, including the gitleaks commit-range scan)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
        run: |
          SKIP="$(uv run .github/ci/hooks.py skip repo)"
          export SKIP GITLEAKS_RANGE="${BASE}..${HEAD}"
          export SVE_FORMAT_BASE_REF="$BASE"
          # Shared configuration and action metadata can invalidate otherwise unchanged files.
          full_scan_inputs=(
            .pre-commit-config.yaml .github/ci/hooks.toml .github/ci/hooks.py
            .github/workflows .github/actionlint.yaml .github/actionlint.yml
            .github/zizmor.yml zizmor.yml
            ':(glob)**/action.yml' ':(glob)**/action.yaml'
            ':(glob)**/.markdownlint*' ':(glob)**/.editorconfig'
            ':(glob)**/.gitattributes' ':(glob)**/.gitleaks*'
            bunfig.toml taplo.toml .taplo.toml uv.toml carddb/uv.toml
            carddb/pyproject.toml carddb/uv.lock publish/pyproject.toml publish/uv.lock
          )
          scope=(--all-files)
          # Deleted inputs never reach pre-commit's filename filters, but can break the ER build or leave
          # Markdown links to a deleted or renamed file in files the PR did not touch.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] &&
            git diff --quiet "${BASE}...${HEAD}" -- "${full_scan_inputs[@]}" &&
            git diff --quiet --no-renames --diff-filter=D "${BASE}...${HEAD}" -- docs/schema/ ':(glob)**/*.md'; then
            scope=(--from-ref "$BASE" --to-ref "$HEAD")
          fi
          echo "pre-commit scope: ${scope[*]}"
          uv run --project carddb --locked --no-default-groups --group dev pre-commit run "${scope[@]}" --hook-stage manual --show-diff-on-failure
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.hook-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/pre-commit
          key: ${{ steps.hook-cache.outputs.cache-primary-key }}

  python:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    # Exceeding this limit means a test regression: fix the tests, do not raise the timeout.
    timeout-minutes: 20
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # identity-only authoring verifies committed transition bases
          persist-credentials: false
          clean: true
      # Hooks pin language_version python3.14 (.pre-commit-config.yaml).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install: false
          cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-suffix: ${{ github.job }}
          cache-dependency-glob: |
            carddb/uv.lock
            publish/uv.lock
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: hook-cache
        with:
          path: ~/.cache/pre-commit
          # Per job, keyed on the hook set it installs: a shared key let the first job to finish save a
          # partial cache that the others hit exactly and then could never update.
          key: pre-commit-${{ github.job }}-${{ runner.os }}-py3.14-${{ hashFiles('.pre-commit-config.yaml', '.github/ci/hooks.toml') }}
          restore-keys: pre-commit-${{ github.job }}-${{ runner.os }}-py3.14-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: mypy-cache
        with:
          path: |
            carddb/.mypy_cache
            publish/.mypy_cache
          key: mypy-${{ runner.os }}-py3.14-${{ hashFiles('carddb/uv.lock', 'carddb/pyproject.toml', 'publish/uv.lock', 'publish/pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-py3.14-${{ hashFiles('carddb/uv.lock', 'carddb/pyproject.toml', 'publish/uv.lock', 'publish/pyproject.toml') }}-
            mypy-${{ runner.os }}-py3.14-
      - name: Runner CPU count
        run: nproc
      # Test hooks are owned by this job but run directly below.
      - name: pre-commit (python hooks)
        run: |
          SKIP="$(uv run .github/ci/hooks.py skip python)"
          export SKIP SVE_DATA_DIR="${RUNNER_TEMP}/sve-carddb-test-data"
          for stage in $(uv run .github/ci/hooks.py stages python); do
            echo "::group::stage $stage"
            uv run --project carddb --locked pre-commit run --all-files --hook-stage "$stage" --show-diff-on-failure
            echo "::endgroup::"
          done
      - name: Installed carddb wheel smoke
        run: |
          uv build --wheel carddb --out-dir "${RUNNER_TEMP}/carddb-wheel"
          UV_PROJECT_ENVIRONMENT="${RUNNER_TEMP}/carddb-wheel-env" uv sync --project carddb --locked --no-default-groups --no-install-project
          uv pip install --no-deps --python "${RUNNER_TEMP}/carddb-wheel-env/bin/python" "${RUNNER_TEMP}"/carddb-wheel/*.whl
          "${RUNNER_TEMP}/carddb-wheel-env/bin/python" -I -B .github/ci/carddb_wheel_smoke.py "$GITHUB_WORKSPACE/tests/fixtures/snapshot-contract/v3"
          "${RUNNER_TEMP}/carddb-wheel-env/bin/sve-carddb" --help > /dev/null
      - name: Installed publish wheel smoke
        run: |
          uv build --wheel --project ./publish --out-dir "${RUNNER_TEMP}/publish-wheel"
          UV_PROJECT_ENVIRONMENT="${RUNNER_TEMP}/publish-wheel-env" uv sync --project ./publish --locked --no-default-groups --no-install-project --no-install-package sve-carddb
          uv pip install --no-deps --python "${RUNNER_TEMP}/publish-wheel-env/bin/python" "${RUNNER_TEMP}"/carddb-wheel/*.whl "${RUNNER_TEMP}"/publish-wheel/*.whl
          "${RUNNER_TEMP}/publish-wheel-env/bin/sve-publish" --help > /dev/null
          "${RUNNER_TEMP}/publish-wheel-env/bin/sve-publish" images upload --help > /dev/null
          "${RUNNER_TEMP}/publish-wheel-env/bin/sve-publish" images gc --help > /dev/null
          "${RUNNER_TEMP}/publish-wheel-env/bin/sve-publish" snapshot upload --help > /dev/null
          "${RUNNER_TEMP}/publish-wheel-env/bin/sve-publish" snapshot gc --help > /dev/null
      - name: pytest (coverage gate for the explicit test scope)
        id: tests
        env:
          TMPDIR: ${{ runner.temp }}
          SVE_DATA_DIR: ${{ runner.temp }}/sve-carddb-test-data
          REPORT_DIR: ${{ runner.temp }}/sve-python-reports
        run: |
          umask 077
          rm -rf "$REPORT_DIR" "$SVE_DATA_DIR"
          mkdir -p "$REPORT_DIR"
          start=$SECONDS
          [[ "$PYTEST_WORKERS" =~ ^[1-4]$ ]] || { echo 'CI_PYTEST_WORKERS must be 1–4'; exit 1; }
          status=0
          uv --directory carddb run --locked pytest -n "$PYTEST_WORKERS" --cov --durations=30 \
            --cov-fail-under=90 \
            --junitxml="$REPORT_DIR/junit.xml" --cov-report="json:$REPORT_DIR/coverage.json" \
            --cov-report="xml:$REPORT_DIR/coverage.xml" \
            > "$REPORT_DIR/test.log" 2>&1 || status=$?
          echo "$((SECONDS - start))" > "$REPORT_DIR/elapsed.txt"
          echo "pytest exit status: $status (statistics in the next step; raw output stays private)"
          exit "$status"
      - name: Python test summary
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        env:
          REPORT_DIR: ${{ runner.temp }}/sve-python-reports
        run: python3 .github/ci/test_summary.py python "$REPORT_DIR"
      # Informational only: the 90% gate stays in pytest. continue-on-error keeps a failure of the action's
      # own setup steps (fail_ci_if_error only covers the upload) from failing the job and so ci-ok.
      # The report holds file names and line hits, no card text. Fork PRs have no secret and upload tokenless.
      - name: Upload carddb coverage to Codecov
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ runner.temp }}/sve-python-reports/coverage.xml
          disable_search: true
          flags: carddb
          fail_ci_if_error: false
      # Test Analytics gets a copy with parameters hashed and no failure text or output: the raw report can hold
      # card wording. Informational, so a failure or slow upload here never reaches the job result.
      - name: Sanitize carddb test results
        id: public-junit
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          REPORT_DIR: ${{ runner.temp }}/sve-python-reports
        run: python3 .github/ci/junit_public.py "$REPORT_DIR/junit.xml" "$REPORT_DIR/junit-public.xml"
      - name: Upload carddb test results to Codecov
        if: ${{ !cancelled() && steps.public-junit.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: ${{ runner.temp }}/sve-python-reports/junit-public.xml
          disable_search: true
          flags: carddb
          fail_ci_if_error: false
      - name: publish pytest (independent synthetic coverage gate)
        id: publish-tests
        if: ${{ !cancelled() }}
        env:
          TMPDIR: ${{ runner.temp }}
          REPORT_DIR: ${{ runner.temp }}/sve-publish-reports
        run: |
          umask 077
          mkdir -p "$REPORT_DIR"
          start=$SECONDS
          [[ "$PYTEST_WORKERS" =~ ^[1-4]$ ]] || { echo 'CI_PYTEST_WORKERS must be 1–4'; exit 1; }
          status=0
          uv --directory ./publish run --locked pytest -n "$PYTEST_WORKERS" --cov --durations=30 \
            --junitxml="$REPORT_DIR/junit.xml" --cov-report="json:$REPORT_DIR/coverage.json" \
            > "$REPORT_DIR/test.log" 2>&1 || status=$?
          echo "$((SECONDS - start))" > "$REPORT_DIR/elapsed.txt"
          echo "publish pytest exit status: $status (statistics in the next step)"
          exit "$status"
      - name: Publish test summary
        if: ${{ !cancelled() && (steps.publish-tests.outcome == 'success' || steps.publish-tests.outcome == 'failure') }}
        env:
          REPORT_DIR: ${{ runner.temp }}/sve-publish-reports
        run: python3 .github/ci/test_summary.py publish "$REPORT_DIR"
      - name: Remove Python reports and test data
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/sve-python-reports
          SVE_DATA_DIR: ${{ runner.temp }}/sve-carddb-test-data
        run: rm -rf "$REPORT_DIR" "$SVE_DATA_DIR" carddb/htmlcov carddb/.pytest_cache publish/htmlcov publish/.pytest_cache "${RUNNER_TEMP}/sve-publish-reports" "${RUNNER_TEMP}"/pytest-of-*
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.mypy-cache.outputs.cache-hit != 'true'
        with:
          path: |
            carddb/.mypy_cache
            publish/.mypy_cache
          key: ${{ steps.mypy-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.hook-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/pre-commit
          key: ${{ steps.hook-cache.outputs.cache-primary-key }}

  rust:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    # The required steps keep 45 minutes; each of the two Codecov steps has its own 5.
    timeout-minutes: 55
    env:
      MISE_EXEC_AUTO_INSTALL: "false" # the cargo hooks go through `mise exec`; Rust itself comes from rustup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the public authoring selection verifies transition bases
          persist-credentials: false
          clean: true
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        id: rust-cache
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-deny@0.19.9,cargo-machete@0.9.2
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install: false
          cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-suffix: ${{ github.job }}
          cache-dependency-glob: |
            carddb/uv.lock
            publish/uv.lock
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: hook-cache
        with:
          path: ~/.cache/pre-commit
          # Per job, keyed on the hook set it installs: a shared key let the first job to finish save a
          # partial cache that the others hit exactly and then could never update.
          key: pre-commit-${{ github.job }}-${{ runner.os }}-py3.14-${{ hashFiles('.pre-commit-config.yaml', '.github/ci/hooks.toml') }}
          restore-keys: pre-commit-${{ github.job }}-${{ runner.os }}-py3.14-
      # The coverage test hook runs directly below; the other checks keep their local hooks.
      - name: pre-commit (rust hooks)
        run: |
          SKIP="$(uv run .github/ci/hooks.py skip rust)"
          export SKIP
          for stage in $(uv run .github/ci/hooks.py stages rust); do
            echo "::group::stage $stage"
            uv run --project carddb --locked --no-default-groups --group dev pre-commit run --all-files --hook-stage "$stage" --show-diff-on-failure
            echo "::endgroup::"
          done
      - name: Rust tests (public inputs, full 90% coverage gate)
        id: tests
        env:
          REPORT_DIR: ${{ runner.temp }}/sve-rust-reports
        run: |
          umask 077
          rm -rf "$REPORT_DIR"
          mkdir -p "$REPORT_DIR"
          start=$SECONDS
          status=0
          python3 .github/ci/rust_tests.py llvm-cov --locked --workspace --summary-only \
            --fail-under-lines 90 --json --output-path "$REPORT_DIR/coverage.json" \
            > "$REPORT_DIR/test.log" 2>&1 || status=$?
          echo "$((SECONDS - start))" > "$REPORT_DIR/elapsed.txt"
          echo "cargo llvm-cov exit status: $status (statistics in the next step; raw output stays private)"
          exit "$status"
      - name: Rust test summary
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        env:
          REPORT_DIR: ${{ runner.temp }}/sve-rust-reports
        run: python3 .github/ci/test_summary.py rust "$REPORT_DIR"
      # Informational: the 90% line gate above stays the gate. The profile data from the run is still
      # in target/, so the lcov export needs no second test run; both steps have their own 5 minutes.
      - name: Export Rust coverage as lcov
        id: lcov
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          REPORT_DIR: ${{ runner.temp }}/sve-rust-reports
        run: mise exec -- cargo llvm-cov report --lcov --output-path "$REPORT_DIR/lcov.info"
      - name: Upload Rust coverage to Codecov
        if: ${{ !cancelled() && steps.lcov.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ runner.temp }}/sve-rust-reports/lcov.info
          disable_search: true
          flags: rust
          fail_ci_if_error: false
      - name: Remove Rust reports
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/sve-rust-reports
        run: rm -rf "$REPORT_DIR"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.hook-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/pre-commit
          key: ${{ steps.hook-cache.outputs.cache-primary-key }}

  web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    # The required steps keep 20 minutes; each of the three Codecov steps below has its own 5.
    timeout-minutes: 35
    defaults:
      run:
        working-directory: sim/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      # Bun and Node versions come from mise.toml.
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          cache: true
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: hook-cache
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('sim/web/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Web formatting, lint, types and unused dependencies
        run: bun run format:check && bun run lint:all && bun run typecheck && bun run knip
      - name: Vitest
        id: tests
        env:
          REPORT_DIR: ${{ runner.temp }}/sve-web-reports
        run: |
          umask 077
          rm -rf "$REPORT_DIR"
          mkdir -p "$REPORT_DIR"
          status=0
          start=$SECONDS
          export SVE_PUBLIC_JUNIT="$REPORT_DIR/junit-public.xml"
          bun run test:all --maxWorkers=4 --reporter=junit --outputFile="$REPORT_DIR/junit.xml" \
            --reporter=./scripts/ci/public-junit-reporter.ts \
            --retry=2 --coverage --coverage.reportsDirectory="$REPORT_DIR/coverage" \
            > "$REPORT_DIR/test.log" 2>&1 || status=$?
          echo "$((SECONDS - start))" > "$REPORT_DIR/elapsed.txt"
          echo "vitest exit status: $status (statistics in the next step; raw output stays private)"
          exit "$status"
      - name: Web test summary
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        env:
          REPORT_DIR: ${{ runner.temp }}/sve-web-reports
        run: python3 ../../.github/ci/test_summary.py web "$REPORT_DIR"
      - name: Web coverage summary
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        env:
          REPORT_DIR: ${{ runner.temp }}/sve-web-reports
        run: |
          # vitest only exports coverage when the tests pass; the 85% branch gate itself is in vite.config.ts.
          if [ -f "$REPORT_DIR/coverage/coverage-summary.json" ]; then
            jq -r '.total | "Web coverage: branches **\(.branches.pct)%** (required **85%**), lines **\(.lines.pct)%**."' \
              "$REPORT_DIR/coverage/coverage-summary.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Web coverage unavailable; branches required **85%**." >> "$GITHUB_STEP_SUMMARY"
          fi
      # Informational: the branch gate stays in vitest. The upload may fail or hang without touching the job result.
      - name: Upload Web coverage to Codecov
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ runner.temp }}/sve-web-reports/coverage/lcov.info
          disable_search: true
          flags: web
          fail_ci_if_error: false
      # Test Analytics: the reporter records each retry as a failed attempt, so a test that passed only on
      # retry shows up as flaky. Names are title hashes and no message leaves the runner.
      - name: Upload Web test results to Codecov
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 5
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: ${{ runner.temp }}/sve-web-reports/junit-public.xml
          disable_search: true
          flags: web
          fail_ci_if_error: false
      - name: Remove private Web reports
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/sve-web-reports
        run: rm -rf "$REPORT_DIR"
      - name: Web build
        run: bun run build:all
      # Informational: the plugin is only added when CODECOV_TOKEN is set, so the build above stays the gate.
      # The upload has no timeout of its own: failure and the 5 minutes here must not reach the job result.
      - name: Web bundle analysis (Codecov)
        continue-on-error: true
        timeout-minutes: 5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: bun run build:all
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.hook-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.hook-cache.outputs.cache-primary-key }}

  # Every commit that reaches the base branch must follow the commitizen format (.cz.toml), gitmoji included.
  # PRs and main run this regardless of paths; the PR title has its own workflow.
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-suffix: ${{ github.job }}
          cache-dependency-glob: |
            carddb/uv.lock
            publish/uv.lock
      - name: cz check (pushed commit range)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
        run: |
          git cat-file -e "${BASE}^{commit}"
          git cat-file -e "${HEAD}^{commit}"
          uv run --project carddb --locked --no-default-groups --group dev python .github/ci/commit_msg.py --rev-range "${BASE}..${HEAD}"

  ci-ok:
    if: always()
    needs: [changes, repo, card-data, python, rust, web, commit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that had to run succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # Unmapped jobs are mandatory; only unchanged components may skip.
          component='{"card-data":"card_data","python":"python","rust":"rust","web":"web"}'
          jq -e '.changes.result == "success"' <<<"$NEEDS" >/dev/null || { echo "changes: $(jq -r .changes.result <<<"$NEEDS")"; exit 1; }
          status=0
          for job in $(jq -r 'keys[] | select(. != "changes")' <<<"$NEEDS"); do
            result=$(jq -r --arg j "$job" '.[$j].result' <<<"$NEEDS")
            wanted=$(jq -r --arg j "$job" --argjson c "$component" 'if $c[$j] then (.changes.outputs[$c[$j]] // "true") else "true" end' <<<"$NEEDS")
            if [ "$result" = success ] || { [ "$wanted" = false ] && [ "$result" = skipped ]; }; then
              echo "ok   $job ($result)"
            else
              echo "FAIL $job: $result (required: $wanted)"
              status=1
            fi
          done
          if jq -e '.changes.outputs.draft == "true"' <<<"$NEEDS" >/dev/null; then
            echo "FAIL draft: component tests were not run; mark the PR ready for review to run them"
            echo "Draft PR: component tests were not run. Mark it ready for review to run the full suite." >>"$GITHUB_STEP_SUMMARY"
            status=1
          fi
          exit "$status"
