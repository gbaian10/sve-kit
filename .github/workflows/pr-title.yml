# The squash-merge commit title defaults to the PR title, so it must pass the same check as commits.
# A separate workflow so that editing the title re-runs only this check, not the whole ci.yml.
name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          save-cache: false # this workflow runs only on PR events
          cache-suffix: ${{ github.job }}
          cache-dependency-glob: carddb/uv.lock
      - name: Commit format (PR title)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: uv run --project carddb --locked --no-default-groups --group dev python .github/ci/commit_msg.py --message "$TITLE"
