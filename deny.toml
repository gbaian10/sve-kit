# cargo-deny: https://embarkstudios.github.io/cargo-deny/
# The pre-push hook runs every check when dependencies change. Advisories are
# time-sensitive, so rerun `cargo deny check` now and then even without changes.

[advisories]
version = 2
yanked = "warn"
# Only our direct dependencies; unmaintained transitive crates are not ours to fix.
unmaintained = "workspace"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
# Keep the list ready for future dependencies without warning about unused entries.
unused-allowed-license = "allow"
# jsonschema's URI parser uses this crate; its LICENSE is the MIT-0 permission text.
exceptions = [{ crate = "borrow-or-share", allow = ["MIT-0"] }]

[licenses.private]
# Internal crates are unpublished; their original software uses Apache-2.0.
ignore = true
