[package]
name = "sve-engine"
version = "0.1.0"
description = "Serializable effect interpreter and information-set search prototype"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["runner"]
runner = ["dep:clap", "dep:sve-scenario-runner"]

[dependencies]
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
], optional = true }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde-saphyr = "1.3"
thiserror = "2"
sha2 = "0.11"
jsonschema = { version = "0.58.1", default-features = false }
rand = { version = "=0.10.3", default-features = false, features = ["unbiased"] }
rand_chacha = { version = "=0.10.0", default-features = false }
sve-scenario-runner = { path = "../scenario-runner", optional = true }

[[bin]]
name = "sve-prototype"
path = "src/main.rs"
required-features = ["runner"]
