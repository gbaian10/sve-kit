<svg xmlns="http://www.w3.org/2000/svg" width="80" height="92" viewBox="0 0 40 46"><title>Attack</title><desc>Blue attack gem with a gold rim and a cross-shaped base, traced from the card face (BP01-003). No number: the page writes the value on top.</desc><defs><linearGradient id="atk-gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1df8e"/><stop offset=".45" stop-color="#b79c3d"/><stop offset="1" stop-color="#6c5a1c"/></linearGradient><linearGradient id="atk-blue" gradientUnits="userSpaceOnUse" x1="12" y1="4" x2="28" y2="40"><stop stop-color="#4aa6ff"/><stop offset=".45" stop-color="#1c71e2"/><stop offset="1" stop-color="#0a3d9c"/></linearGradient><linearGradient id="atk-base" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7fd4ff"/><stop offset=".5" stop-color="#2d8ff0"/><stop offset="1" stop-color="#0d4aa8"/></linearGradient><radialGradient id="atk-glow" cx=".38" cy=".3" r=".6"><stop stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><path d="M5.5 35.5H34.5L32.2 39.6H22.4V45.5H17.6V39.6H7.8Z" fill="url(#atk-base)" stroke="#0a3478" stroke-width=".6" stroke-linejoin="round"/><path d="M7 36.3H33" stroke="#c9f0ff" stroke-opacity=".7" stroke-width=".5"/><path d="M20 .8L38.7 21.5L20 42.2L1.3 21.5Z" fill="url(#atk-gold)" stroke="#4d3f12" stroke-width=".5" stroke-linejoin="round"/><path d="M20 3.6L36.2 21.5L20 39.4L3.8 21.5Z" fill="url(#atk-blue)"/><path d="M20 3.6L36.2 21.5L20 39.4L3.8 21.5Z" fill="url(#atk-glow)"/><path d="M4.6 21.5L20 4.5L35.4 21.5" fill="none" stroke="#9fd8ff" stroke-opacity=".8" stroke-width=".7" stroke-linejoin="round"/><path d="M4.6 21.5L20 38.5L35.4 21.5" fill="none" stroke="#062a6e" stroke-opacity=".7" stroke-width=".7" stroke-linejoin="round"/></svg>
