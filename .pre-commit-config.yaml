# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit, manual]
default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Test fixtures are verbatim copies of real pages; keep them byte-for-byte.
      - id: trailing-whitespace
        exclude: ^carddb/tests/fixtures/
      - id: end-of-file-fixer
        exclude: ^carddb/tests/fixtures/
      - id: check-added-large-files
        args: [--maxkb=1024, --enforce-all]
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml

  - repo: https://gitlab.com/bmares/check-json5
    rev: v1.0.1
    hooks:
      - id: check-json5

  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.16.0
    hooks:
      - id: pretty-format-yaml
        args:
          - --autofix
          - --indent=2
          - --offset=2

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        args: [-o, array_auto_collapse=false, -o, 'indent_string=    '] # 4 spaces

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      # docs/schema/er/ and .github/ci/ have ruff.toml files that extend the carddb settings.
      - id: ruff-format
        args: [--check]
        files: ^(carddb|docs/schema/er|\.github/ci)/
      - id: ruff-check
        files: ^(carddb|docs/schema/er|\.github/ci)/

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2-docker
        args: [--fix]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.17
    hooks:
      # monorepo: the Python project lives in carddb/
      - id: uv-lock
        args: [--project, carddb]
        files: ^carddb/(pyproject\.toml|uv\.lock)$

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
        additional_dependencies: [cz-conventional-gitmoji]

  - repo: https://github.com/ljnsn/cz-conventional-gitmoji
    rev: v0.7.0
    hooks:
      - id: conventional-gitmoji
        stages: [commit-msg]

  - repo: local
    hooks:
      # GitHub does not enforce rulesets on free private repos; until it does, main only changes through PRs.
      - id: no-push-to-main
        name: no direct push to main
        language: system
        entry: bash -c '[ "$PRE_COMMIT_REMOTE_BRANCH" != refs/heads/main ] || { echo "Push a branch and open a pull request instead of pushing to main."; exit 1; }'
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: cargo-fmt
        name: cargo fmt
        language: system
        entry: mise exec -- cargo fmt --all --check
        pass_filenames: false
        files: (\.rs|(^|/)Cargo\.toml|^rustfmt\.toml|^rust-toolchain\.toml)$
      - id: cargo-clippy
        name: cargo clippy
        language: system
        entry: mise exec -- cargo clippy --locked --workspace --all-targets -- -D warnings
        pass_filenames: false
        files: (\.rs|(^|/)Cargo\.toml|^Cargo\.lock|^clippy\.toml|^rust-toolchain\.toml)$
      - id: cargo-test
        name: cargo test (with line coverage >= 90%)
        language: system
        # Runs the whole test suite once, instrumented; raise the bar as the engine grows.
        entry: mise exec -- cargo llvm-cov --locked --workspace --summary-only --fail-under-lines 90
        pass_filenames: false
        # The runner tests read the scenario files too.
        files: (\.rs|(^|/)Cargo\.toml|^Cargo\.lock|^rust-toolchain\.toml|^tests/rules-scenarios/.*\.yaml)$
        stages: [pre-push]
      # Slow (minutes): run by hand with `pre-commit run --hook-stage manual cargo-mutants`.
      - id: cargo-mutants
        name: cargo mutants (tests catch every injected bug)
        language: system
        entry: mise exec -- cargo mutants --workspace -j 4 --timeout 120
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: cargo-machete
        name: cargo machete (unused dependencies)
        language: system
        entry: mise exec -- cargo machete
        pass_filenames: false
        files: (^|/)Cargo\.toml$
        stages: [pre-push]
      - id: cargo-deny
        name: cargo deny
        language: system
        entry: mise exec -- cargo deny check
        pass_filenames: false
        files: ^(Cargo\.lock|(.*/)?Cargo\.toml|deny\.toml)$
        stages: [pre-push]
      # sim/web: `mise exec` pins Bun without relying on the caller's PATH; paths are relative to sim/web.
      - id: web-prettier
        name: prettier (sim/web)
        language: system
        entry: bash -c 'cd sim/web && exec mise exec -- bun x prettier --write --ignore-unknown -- "${@#sim/web/}"' --
        files: ^sim/web/
        stages: [pre-commit, manual]
      - id: web-eslint
        name: eslint (sim/web)
        language: system
        entry: bash -c 'cd sim/web && exec mise exec -- bun x eslint --max-warnings=0 --no-warn-ignored -- "${@#sim/web/}"' --
        files: ^sim/web/.*\.(ts|tsx|js|mjs|cjs)$
        exclude: ^sim/web/tests/lint-fixtures/
        stages: [pre-commit, manual]
      - id: web-stylelint
        name: stylelint (sim/web)
        language: system
        entry: bash -c 'cd sim/web && exec mise exec -- bun x stylelint -- "${@#sim/web/}"' --
        files: ^sim/web/.*\.css$
        stages: [pre-commit, manual]
      - id: web-typecheck
        name: tsc -b (sim/web)
        language: system
        entry: mise exec -- bun run --cwd sim/web typecheck
        pass_filenames: false
        files: ^(sim/web/|mise\.toml$|\.pre-commit-config\.yaml$)
        stages: [pre-push]
      - id: web-test
        name: vitest (sim/web)
        language: system
        entry: mise exec -- bun run --cwd sim/web test
        pass_filenames: false
        files: ^(sim/web/|mise\.toml$|\.pre-commit-config\.yaml$)
        stages: [pre-push]
      - id: mypy
        name: mypy_check
        stages: [pre-push]
        language: system
        entry: uv run --directory carddb mypy
        pass_filenames: false
        types: [python]
        files: ^carddb/
        fail_fast: true
      # The ER generator is a standalone uv script checked with the carddb toolchain and settings.
      - id: mypy-schema-er
        name: mypy (docs/schema/er)
        stages: [pre-push]
        language: system
        entry: uv run --directory carddb mypy ../docs/schema/er
        pass_filenames: false
        files: ^(docs/schema/er/.*\.py|carddb/pyproject\.toml)$
      - id: pyright-schema-er
        name: pyright (docs/schema/er)
        stages: [pre-push]
        language: system
        entry: uv run --directory carddb pyright -p ../docs/schema/er
        pass_filenames: false
        files: ^(docs/schema/er/.*\.(py|json)|carddb/pyproject\.toml)$
      # Fails when the schema documents no longer parse into a complete diagram.
      - id: schema-er-build
        name: schema ER builds from docs/schema
        stages: [pre-commit, manual]
        language: system
        entry: bash -c 'out=$(mktemp -d) && trap "rm -rf \"$out\"" EXIT && uv run docs/schema/er/build_er.py --no-open --out "$out/schema-er.html"'
        pass_filenames: false
        files: ^docs/schema/
