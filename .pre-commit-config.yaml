# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit, manual]
default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Synthetic HTML deliberately preserves parser-significant whitespace; web snapshots
      # are canonical JSON whose sha256 is pinned (no trailing newline).
      - id: trailing-whitespace
        exclude: ^(carddb/tests/fixtures/synthetic_(jp|en)/.*\.html$|sim/web/fixtures/)
      - id: end-of-file-fixer
        exclude: ^(carddb/tests/fixtures/synthetic_(jp|en)/.*\.html$|sim/web/fixtures/)
      - id: check-added-large-files
        args: [--maxkb=1024, --enforce-all]
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      # Registry and id shards are read by carddb's strict loader (safe YAML 1.2, one document,
      # no tags or duplicate keys) and validated in full by the carddb tests; skip only those.
      - id: check-yaml
        exclude: ^authored/(registry|ids)/.*\.yaml$
      - id: check-toml

  - repo: https://gitlab.com/bmares/check-json5
    rev: v1.0.1
    hooks:
      - id: check-json5

  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.16.0
    hooks:
      # Registry and id shards are written by carddb's own encoder; see check-yaml above.
      - id: pretty-format-yaml
        args:
          - --autofix
          - --indent=2
          - --offset=2
        exclude: ^authored/(registry|ids)/.*\.yaml$

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        args: [-o, array_auto_collapse=false, -o, 'indent_string=    '] # 4 spaces

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      # docs/schema/er/ and .github/ci/ have ruff.toml files that extend the carddb settings.
      - id: ruff-format
        args: [--check]
        files: ^(carddb|docs/schema/er|\.github/ci)/
      - id: ruff-check
        files: ^(carddb|docs/schema/er|\.github/ci)/

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      # The Node hook installs the exact version pinned by `rev` (the Docker image tag was mutable);
      # a pinned Node (same as mise.toml) keeps it off whatever `node` happens to be on PATH.
      - id: markdownlint-cli2
        language_version: 24.19.0
        args: [--fix]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Aliases keep SKIP from matching both hooks through their shared id.
      - id: gitleaks
        alias: gitleaks-staged
      # The hook above only sees staged changes, so it scans nothing in a clean CI checkout.
      # This one scans every commit in GITLEAKS_RANGE=<base>..<head>; first-parent diffs also cover
      # what a merge commit itself adds. Missing range ends fail instead of scanning zero commits.
      - id: gitleaks
        alias: gitleaks-range
        name: gitleaks (commit range)
        entry: >-
          bash -c 'range="${GITLEAKS_RANGE:?set GITLEAKS_RANGE=<base>..<head>}";
          git cat-file -e "${range%%..*}^{commit}" && git cat-file -e "${range##*..}^{commit}" &&
          exec gitleaks git --log-opts="--diff-merges=first-parent $range" --redact --verbose --exit-code 1' --
        pass_filenames: false
        always_run: true
        stages: [manual]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.20
    hooks:
      # monorepo: the Python project lives in carddb/
      - id: uv-lock
        args: [--project, carddb]
        files: ^carddb/(pyproject\.toml|uv\.lock)$

  # Workflow checks: actionlint for syntax and expressions, zizmor for security.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
        additional_dependencies: [cz-conventional-gitmoji==0.7.0]

  - repo: https://github.com/ljnsn/cz-conventional-gitmoji
    rev: v0.7.0
    hooks:
      - id: conventional-gitmoji
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        language: system
        entry: mise exec -- cargo fmt --all --check
        pass_filenames: false
        files: (\.rs|(^|/)Cargo\.toml|^rustfmt\.toml|^rust-toolchain\.toml)$
      - id: cargo-clippy
        name: cargo clippy
        language: system
        entry: mise exec -- cargo clippy --locked --workspace --all-targets -- -D warnings
        pass_filenames: false
        files: (\.rs|(^|/)Cargo\.toml|^Cargo\.lock|^clippy\.toml|^rust-toolchain\.toml)$
      - id: cargo-test
        name: cargo test (with line coverage >= 90%)
        language: system
        # Runs the whole test suite once, instrumented; raise the bar as the engine grows.
        entry: mise exec -- cargo llvm-cov --locked --workspace --summary-only --fail-under-lines 90
        pass_filenames: false
        # Manual locally (it needs SVE_TEST_SNAPSHOT and takes minutes); CI runs it on every Rust change:
        # `pre-commit run --hook-stage manual cargo-test`.
        always_run: true
        stages: [manual]
      # Slow (minutes): run by hand with `pre-commit run --hook-stage manual cargo-mutants`.
      - id: cargo-mutants
        name: cargo mutants (tests catch every injected bug)
        language: system
        entry: mise exec -- cargo mutants --workspace -j 4 --timeout 120
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: cargo-machete
        name: cargo machete (unused dependencies)
        language: system
        entry: mise exec -- cargo machete
        pass_filenames: false
        files: (^|/)Cargo\.toml$
        stages: [pre-push]
      - id: cargo-deny
        name: cargo deny
        language: system
        entry: mise exec -- cargo deny check
        pass_filenames: false
        files: ^(Cargo\.lock|(.*/)?Cargo\.toml|deny\.toml)$
        stages: [pre-push]
      # sim/web: `mise exec` pins Bun without relying on the caller's PATH; paths are relative to sim/web.
      - id: web-prettier
        name: prettier (sim/web)
        language: system
        entry: bash -c 'cd sim/web && exec mise exec -- bun x prettier --write --ignore-unknown -- "${@#sim/web/}"' --
        files: ^sim/web/
        stages: [pre-commit, manual]
      - id: web-eslint
        name: eslint (sim/web)
        language: system
        entry: bash -c 'cd sim/web && exec mise exec -- bun x eslint --max-warnings=0 --no-warn-ignored -- "${@#sim/web/}"' --
        files: ^sim/web/.*\.(ts|tsx|js|mjs|cjs)$
        exclude: ^sim/web/tests/lint-fixtures/
        stages: [pre-commit, manual]
      - id: web-stylelint
        name: stylelint (sim/web)
        language: system
        entry: bash -c 'cd sim/web && exec mise exec -- bun x stylelint -- "${@#sim/web/}"' --
        files: ^sim/web/.*\.css$
        stages: [pre-commit, manual]
      - id: web-typecheck
        name: tsc -b (sim/web)
        language: system
        entry: mise exec -- bun run --cwd sim/web typecheck
        pass_filenames: false
        files: ^(sim/web/|mise\.toml$|\.pre-commit-config\.yaml$)
        stages: [pre-push]
      - id: web-knip
        name: knip (sim/web)
        language: system
        entry: mise exec -- bun run --cwd sim/web knip
        pass_filenames: false
        files: ^(sim/web/|mise\.toml$|\.pre-commit-config\.yaml$)
        stages: [pre-push]
      # Manual locally; CI calls the same test script directly on every web change.
      - id: web-test
        name: vitest (sim/web)
        language: system
        entry: mise exec -- bun run --cwd sim/web test
        pass_filenames: false
        always_run: true
        stages: [manual]
      # Manual locally (a full run takes minutes); CI runs it on every PR:
      # `pre-commit run --hook-stage manual pytest`.
      - id: pytest
        name: pytest (carddb)
        language: system
        entry: uv run --directory carddb pytest -n auto --cov
        pass_filenames: false
        always_run: true
        stages: [manual]
      # Optional strict check on all Python, run by hand; not in CI (mypy is the gate):
      # `pre-commit run --hook-stage manual pyright`.
      - id: pyright
        name: pyright (carddb, docs/schema/er)
        language: system
        entry: bash -c 'status=0; uv --directory carddb run --group pyright pyright || status=1; uv --directory carddb run --group pyright pyright -p ../docs/schema/er || status=1; exit $status'
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: mypy
        name: mypy_check
        stages: [pre-push]
        language: system
        entry: uv run --directory carddb mypy
        pass_filenames: false
        types: [python]
        files: ^carddb/
        fail_fast: true
      # The ER generator is a standalone uv script checked with the carddb toolchain and settings.
      - id: mypy-schema-er
        name: mypy (docs/schema/er)
        stages: [pre-push]
        language: system
        entry: uv run --directory carddb mypy ../docs/schema/er
        pass_filenames: false
        files: ^(docs/schema/er/.*\.py|carddb/pyproject\.toml)$
      - id: mypy-ci
        name: mypy (CI helpers)
        stages: [pre-push]
        language: system
        entry: uv --directory carddb run mypy ../.github/ci
        pass_filenames: false
        files: ^(\.github/ci/.*\.py|carddb/pyproject\.toml)$
      # Fails when the schema documents no longer parse into a complete diagram.
      - id: schema-er-build
        name: schema ER builds from docs/schema
        stages: [pre-commit, manual]
        language: system
        entry: bash -c 'out=$(mktemp -d) && trap "rm -rf \"$out\"" EXIT && uv run docs/schema/er/build_er.py --no-open --out "$out/schema-er.html"'
        pass_filenames: false
        files: ^docs/schema/
