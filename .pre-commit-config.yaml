# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit, manual]
default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Test fixtures are verbatim copies of real pages; keep them byte-for-byte.
      - id: trailing-whitespace
        exclude: ^carddb/tests/fixtures/
      - id: end-of-file-fixer
        exclude: ^carddb/tests/fixtures/
      - id: check-added-large-files
        args: [--maxkb=1024, --enforce-all]
      - id: check-ast
      - id: check-case-conflict
      - id: check-yaml
      - id: check-toml

  - repo: https://gitlab.com/bmares/check-json5
    rev: v1.0.1
    hooks:
      - id: check-json5

  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.16.0
    hooks:
      - id: pretty-format-yaml
        args:
          - --autofix
          - --indent=2
          - --offset=2

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        args: [-o, array_auto_collapse=false, -o, 'indent_string=    '] # 4 spaces

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-format
        args: [--check]
        files: ^carddb/
      - id: ruff-check
        files: ^carddb/

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2-docker
        args: [--fix]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.17
    hooks:
      # monorepo: the Python project lives in carddb/
      - id: uv-lock
        args: [--project, carddb]
        files: ^carddb/(pyproject\.toml|uv\.lock)$

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
        additional_dependencies: [cz-conventional-gitmoji]

  - repo: https://github.com/ljnsn/cz-conventional-gitmoji
    rev: v0.7.0
    hooks:
      - id: conventional-gitmoji
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: mypy
        name: mypy_check
        stages: [pre-push]
        language: system
        entry: uv run --directory carddb mypy
        pass_filenames: false
        types: [python]
        files: ^carddb/
        fail_fast: true
