    low_confidence: false
  - source_hash: sha256:5d587ebe1df8f0c81801f13a0dfce609f0b1705ae2eca68931b2d5d44d34f032
    lang: zh-Hant
    text: "卸下了行囊卻卸不下職責，她是在夏日閃耀的聖少女。\n「那麼……就讓我示範一下休假的典範吧」"
    origin: machine
