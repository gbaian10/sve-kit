    low_confidence: false
  - source_hash: sha256:5db2b2bbea591c3c15b3c85447d7c371e28f8bf9dd38376cfda4c7e1286501cf
    lang: zh-Hant
    text: "白色沙灘上晶瑩剔透的肌膚，那是盛夏的水晶。\n「啊哈哈♪海水說不定比冰還冷！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5dc0c9f844f4fff7a0c9698505590c5ab72d4218b96eadabbc99e3385f1b3310
    lang: zh-Hant
    text: "必須收集碎片，讓救世的騎士大人復活。\n如果只有我能做到……為了大家，我也會做給你們看。"
