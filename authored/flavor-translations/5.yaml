    low_confidence: false
  - source_hash: sha256:58f3235f90dfdf5cc2d26d61cd7b54bc3274ca402675e9b46021405dcdcbcff1
    lang: zh-Hant
    text: 給我閉嘴。
    origin: machine
    low_confidence: false
  - source_hash: sha256:592ae39ad034a1b8fd46f7a74b8806f2096a4b792d50d3d217a4f04cf7c26738
    lang: zh-Hant
    text: "當他親手脫下膽小鬼的鎧甲時，他將成為真正的強者。\n——守望著昔日學生的教官"
    origin: machine
    low_confidence: false
  - source_hash: sha256:592edc4b5f5d32ec80606aaab9749ce06586c376ee01c0176e9f039d59f7f51b
    lang: zh-Hant
    text: "就算踏遍億土也要回家。只為了唯一的那條命。\n謝謝你就此潰滅——笑著弔唁吧，波羅土希死。"
