    low_confidence: false
  - source_hash: sha256:5b454019ad5b9910a7ec5ff083cc138acf60632017c95fc77fefe2c09f24f273
    lang: zh-Hant
    text: "被選中之人啊，上天將借力於汝。\n襲向汝的艱難辛苦、一切災禍，皆將知曉天命。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5b8544d284b59faf85bb9af287190217a34e9e6462192d808c97fe8ed814a686
    lang: zh-Hant
    text: "人家能不能變得像天上的公主那樣呢？\n被人疼愛也很好，但人家想散播幸福的雪月花呢。"
