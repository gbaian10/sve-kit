    low_confidence: false
  - source_hash: sha256:5b92c439d12b9430fc7c1d91846c66ac8adf2d16aa75d1ba98104a74a7ae69f0
    lang: zh-Hant
    text: "解開問題吧，速速學習。\n比起漂盪於世界的知識，人的生命太過短暫。"
