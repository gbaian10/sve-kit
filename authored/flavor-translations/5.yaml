    low_confidence: false
  - source_hash: sha256:59c9387d7bd3d80310b1a5847679185b488041bdaaf9874a3c46fb18ed2074fc
    lang: zh-Hant
    text: "否定我的世界，我不需要。我會全部重新塑造，全部。\n所以要讓一切都結束。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:59e3ab237c4f1ad3bcccaadd70078d288be9f86cb5b2ff3bea298233c6d9623d
    lang: zh-Hant
    text: "「強迫動力機關超載運作，突破極限領域。\n呵呵，總覺得湧起了一股親近感呢」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:59f0683c0a7ad538c1d30dce01b2ecdbd25498da867b95feb313a9466f8819d9
    lang: zh-Hant
    text: "為世界的脆弱而悲傷的龍，迎來的是侮蔑的試煉。\n落敗之後——才明白。那份連弱者也促其進化的、手下留情。"
