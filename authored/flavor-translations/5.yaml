  - source_hash: sha256:5ca05121ea913bf57672a0314258ee793f0b6305fa1ea62b58245b3dd138181f
    lang: zh-Hant
    text: "若無阻礙，森林將成為世界本身。\n受強者吸引之人們，將開啟新的世界。"
