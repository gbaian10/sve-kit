    low_confidence: false
  - source_hash: sha256:57b2c9044eee4821b1ad189ba38b03faa12fafbb33955ac8c592a291c8275ca0
    lang: zh-Hant
    text: "變化忍法，入睡之術！\n呵呵呵……這是假裝睡著，再猛地撲上去的術喔！"
