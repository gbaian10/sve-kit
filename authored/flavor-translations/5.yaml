    low_confidence: false
  - source_hash: sha256:5bfabf30480d86cd4dea109cb61f6c16f675ad10a4b19d36334a51febb30d468
    lang: zh-Hant
    text: "那就讓我聽聽看啊！你用來反抗的節奏！\n——邪星遼雅"
