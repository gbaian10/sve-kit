  - source_hash: sha256:57af234701730f7a837cf5bfa83b2388e5fd3563fd4975a3370fbfd2951b8a18
    lang: zh-Hant
    text: "因為我從沒想過能穿上這樣的衣服。\n明明是比平常更柔軟的衣服，卻比平常更難受啊。"
