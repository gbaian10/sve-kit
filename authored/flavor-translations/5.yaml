    low_confidence: false
  - source_hash: sha256:5ad148e23f381abcd8da5a7a664451b8093ba2102b624d978211f97627845293
    lang: zh-Hant
    text: "「能讀心的力量什麼的……我不需要」\n「總有一天想當個普通女孩啊～」"
