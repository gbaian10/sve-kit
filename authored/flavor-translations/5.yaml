    low_confidence: false
  - source_hash: sha256:5beddb6af15fe52aafe1d2676e4ff4665015223da36131dc16846719637e1b9e
    lang: zh-Hant
    text: "完成夙願，勇者迎來了命定之死。\n神祕的傳承寄宿於戒指，期盼著下一位勇者。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5bf35ad73ae9fed9b7c4a470423a06a04ec38a110c2ad02aa5070046584640ad
    lang: zh-Hant
    text: "欺負哥哥的魔物——！\n上吧，噗吉！『包在我身上啦綾音！』"
