  - source_hash: sha256:5c8fff0646e883c23afacc10da4132fd8c31c60c245ed5ad33432fe46d47ffe2
    lang: zh-Hant
    text: "核所造成的變質，催生了各式各樣的尖銳化。\n機械學會了瞬間拉近遙遠距離的方法。"
