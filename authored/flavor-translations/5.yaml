    low_confidence: false
  - source_hash: sha256:593b93b0a817caa36dfb0d10533cd12d6763f95f9f9eae0b5abaf8fe1e7b2e1f
    lang: zh-Hant
    text: "戴著面具的，是思念在荒地瞑目之魂魄的死之術師。\n其本性，依舊藏在面具之下。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:594521a768e15d3c6c2606cce22dd3b5f43a0ab635f72f99bae19c7f3f282c70
    lang: zh-Hant
    text: "正義有千百種。既然如此，我就貫徹自己的正義。\n相信在那盡頭──便有活著的意義。"
