  - source_hash: sha256:5d7781184246ff91e5258c535305b7387f28209d0dcad8c1bf1357a88fb15298
    lang: zh-Hant
    text: "支持賽馬娘、讓她們抓住夢想的，就是＜天狼星＞這支隊伍。\n抓住夢想的她們的心意，將連向下一個夢想——。"
