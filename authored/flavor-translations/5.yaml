    low_confidence: false
  - source_hash: sha256:5a337c958fdfc7978425c7c6a442193c56f2982e7ff93ba0fbd2b8b878f68669
    lang: zh-Hant
    text: "要在闇影詩章獲勝所需要的東西。那就是……才能喔。\n——白銀御門"
