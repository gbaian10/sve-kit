    low_confidence: false
  - source_hash: sha256:5cbccf7f36729004993492d3ffa35cd821f1b94c2aed1a6fe8fa863eb2009060
    lang: zh-Hant
    text: "唯有努力的結晶閃耀之時，神聖之力才會聚於己身。\n故守護神域的野獸，不需要徒有其名的血統。"
