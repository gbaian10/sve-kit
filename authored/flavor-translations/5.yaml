    low_confidence: false
  - source_hash: sha256:57d7b6435318e02f2eb90531107133ed9e0614e66b544d827566f7cb80832779
    lang: zh-Hant
    text: "歡迎來到真步真步王國的茶會。\n真步公主會為了王子殿下，滿懷愛意地款待您唷♪"
    origin: machine
