    low_confidence: false
  - source_hash: sha256:5c9ce7709073ad47103d999cd7b4ec30e4afc34ae55b48c3cb4f62c0310011d0
    lang: zh-Hant
    text: "玩弄者、賣弄者，全都噤聲。寂靜、沉默，即是平穩。\n——是故，賜予世界試煉。"
