    low_confidence: false
  - source_hash: sha256:59f6c5ee0cbd7c81cee4e400ffa24bef970969e71c17e510b60b5f4419d2b1b1
    lang: zh-Hant
    text: "刀刃統合。聚集於才氣的忠誠。缺乏深慮的私慾衝動。\n刀刃揮舞。為了破壞獨善的牢籠。為了實現與不可或缺之物的邂逅。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5a0c7c1183568aa3d7705de4d9fd5f9793b387b7d5c181b6ff76532f967bac33
    lang: zh-Hant
    text: "擔負國家未來的一流人才齊聚的『學園』。\n以自己的意志選擇道路吧——為了學習、成長。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5a0efbabbc3877faf84cb3ee4e867e5e224cf849df41cc4542c70521a975f5ec
    lang: zh-Hant
    text: "哥布林的世界裡只有「EMONO」。\n持有想要之物的獵物，以及搶來穿戴在身上的武器。"
