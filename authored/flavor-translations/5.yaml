  - source_hash: sha256:57d879c647e93057811c1ce7f6d84a2d6fa454e8b7ebe931c58767d5d671f8fd
    lang: zh-Hant
    text: "以注入之力使刃閃耀，劈開混沌催生平穩。\n——歷經歲月的傳承"
    origin: machine
    low_confidence: false
  - source_hash: sha256:57eb50f8c50d69f004ca09b23b9bb1bbc25a7058789764e128387d4025167513
    lang: zh-Hant
    text: "我的力量，並非與生俱來。\n接近死亡，與死亡相觸。死亡化作了指向生的座標。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:57fa430ca2a394173e0a68d2042ef1c8c0e6b4510fff58e65922dc055693a851
    lang: zh-Hant
    text: "那是西方國家的訂單，那邊是東邊村子的反抗軍用。\n然後偷偷包起來的，是不留在帳簿上的零用錢！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:58138b05f8edfbe2ab6f3d1adc364291bbeba7b79ba0968e182c4485a0399a7c
    lang: zh-Hant
    text: "「我不否定你的理想。但是，與我的信仰無法相容」\n「——別無選擇。相約之處，即為裁斷枯榮之場」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:58308a6613929322069e66666b4fb98e57988919b66e9aadd2e87d70dd761888
    lang: zh-Hant
    text: "真是諷刺啊。\n獵的龍越多——我的劍就越像龍的爪牙。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5837088ce0c3f2adc9b2aa5a03d8f2389a6b5063fbb745a249edf8632a28f80e
    lang: zh-Hant
    text: "來喔來喔快來看！\n本大魔術師大人讓人大吃一驚的精彩魔術秀！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:58398c8917eb63cdf7a7a790f74fbb934c5ca0b67d6e15bc811001a8969b607b
    lang: zh-Hant
    text: "要一邊不讓紅茶灑出來一邊正拳突刺和深蹲什麼的……\n那種東西絕對，不是普通的課啦——！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:586c7ff21ab6b4a2d8a5e44546353e9cbe53b5b75a09177d1eeffa97fbb2522b
    lang: zh-Hant
    text: "曾有一頭醜陋的龍，蒙星之女神的慈悲被納入星座。\n據說龍受賜載運女神的職責後，得到了能變成任何想變的野獸的角。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5870fc6943be8b85763671e949133054f500888639a795742419e04871647d50
    lang: zh-Hant
    text: 盜獵者，原來會開出漂亮的花耶！
    origin: machine
    low_confidence: false
  - source_hash: sha256:58af71be374b4d716cac1f607c513b476d0abcee50ce48a5a24813f773bec0c3
    lang: zh-Hant
    text: 阿賴耶，看著，沉下去。你的，真正的。
