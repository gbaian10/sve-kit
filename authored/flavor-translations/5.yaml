    lang: zh-Hant
    text: "身為學長，就稍微示範一下吧。\n別說子彈了，連魔法都能斬斷，這就是所謂英雄的劍術！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5e3952808866e71c2c01b661ab9a9442e7788f262c25e204670a1ee737c999dd
    lang: zh-Hant
    text: "「我想起來了。過去一起在森林裡奔跑的日子。\n拜迪，你還記得嗎。還是說，已經……」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5e9eb74ec6e73cc446870032fad1a0065cbe04e17f12bf82e14bb4f3fe1ecdf0
    lang: zh-Hant
    text: "累積悠久歲月，登上神域的神祕之龍。\n據說以近乎無限的智慧，從遙遠彼方引導著人們。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5eca28753463e4ccb2a2f3916a448fcf90dad7f38aacfc5c0e43ab75472c2e31
    lang: zh-Hant
    text: "你好！你也是來信瑪文大人的嗎？\n這座神殿最近很安靜，所以我好開心！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5ed5db7aed2a2750a872e3b9e5c3075dfe47b707da495b037aa01befdaeebb89
    lang: zh-Hant
    text: "發明不需要客氣！界線就是用來跨越的！\n做過頭也不會有什麼困擾對吧？助手君！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5ef327ab239c4b7865b0f49c6aa72d6e968ba471e0520aca0f1d264fb63381bb
    lang: zh-Hant
    text: "嘿！嘿嘿——，太好了！很厲害吧？剛剛那一球！\n今天贏的會是小颯我們喔！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5f0cbe65f049df912e14f26c5db32034c031b38a91b75541cc8e403346506566
    lang: zh-Hant
    text: "累積的戰功已風化，昔日的榮光已消逝。\n即使如此，為了無法忘懷的大義，王堆起屍骸。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5f118bd21432e0746ca03c1aef32fb0198e3603a1234e68e229365a7aee0e870
    lang: zh-Hant
    text: "人家終於也是見習騎士了，跟狹小的故鄉說再見啦！\n為了接近憧憬的騎士，要狂砍敵人囉——！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5f16a6e5cb74ca88d2229b94adcb56aede1344aa2ca28d8f1f8593a22c8ba3bf
    lang: zh-Hant
    text: "『不能只是接受。也得給神試煉才行』\n『一起變強吧。直到能回報那無數救贖的那一天』"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5f19e25346b3bf3a305d8f9bbb112171359232f6ce0402d84cdffce08cf9f328
    lang: zh-Hant
    text: "我說少年？該工作了喔。到這邊來吧。\n該不會是在緊張吧？哎呀哎呀，真是早熟呢♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5f1f9c17272537c8d8e36c72c4431abdb063556f0ab62f69e1f3e30ca9655b17
    lang: zh-Hant
    text: "冥界第二的魔炎，或者說，冥界首屈一指的笨狗。\n今天也照樣在冥界奔跑——引發（搞笑）騷動。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5f4d6ecb30e99fe07b4606ac89aa0b1bf448d49cc46a0a1645acd7b0e393ffb0
    lang: zh-Hant
    text: 以死與臨終哀號為刃，蠢動吧，闇影侵蝕！
    origin: machine
    low_confidence: false
  - source_hash: sha256:5f66d38254454143259a1f75bca53abc41520537ef186132bc1b15afd250dbd9
    lang: zh-Hant
    text: "那首歌所編織的，是萬夫莫敵的英傑。\n攜尼伯龍根族的聖劍，挑戰巨大的邪龍。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5f6e6b504ba13bab3c4144bc01ee3a6cbd41870973272e7d69bd13588f01913c
    lang: zh-Hant
    text: "有人尊賢者為師，也有人尊龍為師。\n那雙翼與爪牙，正是他們心目中的高處。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5fa7d79e75047c3c529a93daa0edd34406b3a811965b17bfe9148d2b1fb9767e
    lang: zh-Hant
    text: "這種從頭到尾都能吃、美味過頭的東西，\n居然自稱生態系的頂點，真是好笑到不行。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5fb6add6b40af76d40d1a31dc4b7106850394825ee252d45ffa77639c7f70f58
    lang: zh-Hant
    text: "大家——氣氛有嗨起來嗎——！？\n和我一起增加難忘回憶的筆記吧！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5fd51f867ae3c55086426b2ab233bf9fc280e06946bdaa83fe9af730cb2af100
    lang: zh-Hant
    text: "我要成為世界第一的大惡棍！\n這不是希望，是絕對的未來。對吧，奧克托！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5fd5e16768b928ca367f466544ccdd5af1ecdaa5ccd121aecb17049e6e119462
    lang: zh-Hant
    text: "魚盯著搖晃的釣鉤。\n牠們盯著搖晃的船影。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5fd97dd5c343ef14c127bd266a024c8e41d4cef6f6b252f86384c93f11fa619f
    lang: zh-Hant
    text: "人們稱她為，至高的鍊金術士。\n能達到她境界的人，尚未出現。"
    origin: machine
    low_confidence: false
