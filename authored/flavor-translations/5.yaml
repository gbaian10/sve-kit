    low_confidence: false
  - source_hash: sha256:5de6f1b316c91ffbefba8a135dfd6c2f82dddf713e1c7ba6fa6b0bc76464739f
    lang: zh-Hant
    text: "說來慚愧，我很貪心。一滴一口，根本不夠。\n所以這些刺、薔薇之牙……一次流多一點吧。"
