  - source_hash: sha256:5a44cfabb5784901c21f13b9597bd0e4d82d6fb3404d3a0966b70ec26112bc0f
    lang: zh-Hant
    text: "放棄吧，戰場。還有自尊。在被撕裂粉碎之前。\n終焉之獸沒有慈悲。一切皆平等地龜裂。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5a5c0f2e3fb1fc30f8b1c185956eaa84c8102786332b51893c7468ab190969bd
    lang: zh-Hant
    text: "賜善者以神諭之言。迷惘者，速知其使命。\n賜惡者以肅清之箭。失心者，速知其天命。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5a6b7b80b6d15271f1d2c38d9db2a787892e55baa37bbcb8ae05550a17253235
    lang: zh-Hant
    text: "我也就算了，可不能讓連兒子都淪為畜生啊。\n在那凋零之際送上的煙——綻放徒花吧，緋岸橙醉。"
