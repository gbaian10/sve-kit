kind: flavor_translation_shard
entries:
  - source_hash: sha256:5018dff707f4db2c791e2b1060723ce750f41b8d7001553e988281757c4d80b5
    lang: zh-Hant
    text: "「單簧管、小提琴，雖然有各式各樣的樂器……\n但夏天演奏的自然音色，勝過任何樂器呢」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:503f7a0205502b15c52fb3b2a147c9b64d5c29d06329bbc8f62672fdf3a63db3
    lang: zh-Hant
    text: 魔龍光臨！
    origin: machine
    low_confidence: false
  - source_hash: sha256:505defd7fc931768cdb958b4e850cdbb33d95b546d37e03e1ede4954214c6093
    lang: zh-Hant
    text: "你是我罪孽的象徵。所以我，要和你……。\n——人狼女王‧露娜"
    origin: machine
    low_confidence: false
  - source_hash: sha256:505ff4ea8163b6e61019c18816f895ae31d8b5e37550326f78433a6fe7997560
    lang: zh-Hant
    text: 奪走的一切都將奉還。並附上未曾被奪走的恐懼。
    origin: machine
    low_confidence: false
  - source_hash: sha256:5062a2d0f08049e2fb40d58829003d986c62cdf8403aa142be3c21289f344900
    lang: zh-Hant
    text: "那首歌所讚頌的，是屠龍的英雄。\n死鬥之後擊倒邪龍，武功名揚於世。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:50696c15f11cb16f27237eae376a82cae25ec8dec785ff9bd22b1fd716fb97b9
    lang: zh-Hant
    text: "絕不可殺生。有象無象皆是現象。\n存在之物，即應存在之物。讓其生、讓其活、讓其行。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5082a2fdb7b986c4b11e300ab1af9f4b34b44f2696fe2ce85a07d74c1f257a50
    lang: zh-Hant
    text: "只要有妹妹在，哥哥就如虎添翼喔！\n我的活躍表現，要好好看著喔。哥哥♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:50e66140ddae078837dcc202c7b12a1020ef88ba942f0c6b038f4537b1759e21
    lang: zh-Hant
    text: "別露出那種表情。只是住院檢查而已，跟平常一樣喔。\n比起那個你看？大家把這間病房布置得好可愛。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:50f3b65e603e68a2449d31891f181cf49f15ce284dff086007453c2235795021
    lang: zh-Hant
    text: "那位魔女的話語極其難解。\n前來得知未來的人們，全都一臉困惑地踏上歸途。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:50f5f5f7fc4af4d7098fef5d01f14e31c8ab13862f7148aab5c5b51a3184a734
    lang: zh-Hant
    text: "為了討伐龍，馳騁原野，累積戰鬥，獲得了氣運與實力。\n注入萬千感慨揮出的斬擊——嗚呼無情。連鱗片都碰不到。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5119024e4e13d28602a96b5bd0f3a5109134ae720f07a4919962bb91fbfd4ddd
    lang: zh-Hant
    text: "只有強悍不過是塊鐵。若其中融入一顆真誠的心，\n原本的鐵便會化為絕不碎裂的鋼之忠誠。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5147617b51bd6fc3f9e7c0e46266be92eac90bba1400981803d2bfca1576dbc2
    lang: zh-Hant
    text: "殺人劍是不解風情之極。暗殺劍更是可笑至極。\n我的劍技為亂世增色。也為飄散的您一同增色。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:515819d008d883e6193ce52f04877ffa8f0df17247957dd5fe98604bce5294d9
    lang: zh-Hant
    text: "旋轉部位裝上『龍炎螺栓』，用『龍爪工具』把工具合而為一。\n最後用『龍鱗護板』補強——再一下就完成了！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:51ab4e5abc6e5246f530efc0699e89b7d859d524dbd6f1ecb9bbf7b1393dec0d
    lang: zh-Hant
    text: "我是魯道夫象徵。立志成為引導賽馬娘的“皇帝”之人。\n懷抱相同志向的人啊，一同勇往邁進吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:51bb0ac3bad27e4b76c9b271abae2992dcd38ef02c077867aea4c21435ff3bc8
    lang: zh-Hant
    text: "磚塊砸碎玻璃，鋼鐵砸碎磚塊。\n硬者毀壞軟者乃是道理，故只需撞上去便足夠。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:51d88ccaa7943afdd66500a9726d1baa9f7a02df16fedcb0d5640280fd5dba05
    lang: zh-Hant
    text: "別帶著殺意靠近我好嗎？會有一股惡寒爬上我的身體。\n延伸的刀刃就是我的地盤。從這裡開始，不准你踏進一步。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:520ea2195d146039a33a5054aeabec16ba23d44675e1aab0c96c81d6743b7cb5
    lang: zh-Hant
    text: "「我會去想」「想自己是個悲慘的失敗品」「每天每天」\n「想停下來」「停不下來」「好討厭」「好討厭」可是。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:521db624d491960246de43ae4b79886afe23d0af5ab0fc0efb1b95522fc94fb6
    lang: zh-Hant
    text: "太有幹勁了？可是，就算是拍攝也沒差吧★\n因為救生員無論何時，都在守護大家的夏天！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:52bda547053fbdf1126584f302c530202adc7c133404570c9013decc689d5dc7
    lang: zh-Hant
    text: "其實我想傳達的事情還有更多更多。\n但是一看到大家的臉，心裡就滿滿的了……。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:53177ee22939501ce48e67a7f5f543dfd6d4f71dfe823d2ae9527c18d22eb8fb
    lang: zh-Hant
    text: "弄錯了生命價值的將領……所謂可憐，說的就是你。\n現處以滅屍之刑——對虛無之棺降下誅罰。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5323876b00ef3fe3b3bb159da740b6f8ed0d416259ebcf92a83577ebc2045b97
    lang: zh-Hant
    text: "穿上稍微裝成熟的服裝，她向你招手。\n因為連來到海灘，也是她稍微早了一步。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5365218105298def7331a2dcc867eb7c3da4e67ac25b9f1c73e11757fc0753d8
    lang: zh-Hant
    text: "本來我的身旁，應該有卡斯托爾在。\n死亡分隔了我們棲息之處……即使如此我們仍是永遠。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5392bb95ed5da7101d74c6ad972e3fac18bb0e779f3d15282f6f37be1910dfdb
    lang: zh-Hant
    text: "你有使命嗎。有足以取代性命的信念嗎。\n若你擁有，天空的霸者就助你一臂之力。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:53a0b42b95c932a1d883693cbc609e5f44e40bdfa9fa43ce09d3ca49ec23b0fd
    lang: zh-Hant
    text: "受神憐憫，被惡魔感興趣。\n而後吞食了那神與惡魔，冰封了大地的龍。凍土的霸者。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:53a3697cc6f776cad06e3ec8e5f0ae4efb8d77b1aa61f1469d78fae3e07ce8d6
    lang: zh-Hant
    text: "新舞蹈的關鍵是表現力！連感想都能傳達！\nOne、Two！One、Two！Two、Two、One、Two！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:53e03c8164fecc55a82ba59beae1900de0bee93f7620bf76f5945370d8e1b2e4
    lang: zh-Hant
    text: "若坐於天上的是天使，依偎大地的便是蛇。\n長出的翅膀不是為了飛翔，而是為了庇護大地。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:53ead5523b9c5fac36f2f62a85c1c60893895f1ee40daa938e3a3f4ca8dc3533
    lang: zh-Hant
    text: "懦弱脆弱，一律斷罪。正義存在於我等的黑暗之中。\n「將我胸中燃燒的怒火，化為力量！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:53fb019da0ce88ef9f9b624faa9c9ca16bf3dbe50b827063a02380f3e3e40c19
    lang: zh-Hant
    text: "人人都嘲笑那件武器。說它落伍又沒效率。\n他說。在連醫師都不夠的戰爭裡——連石頭都是兵器。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5405f0ba617c2b83d7c4ce053a9750ddf232ee0cf9d2bfa50797db681ad53c31
    lang: zh-Hant
    text: "此刻，攪拌吧。四足之獸、二足之獸、有翼者、無翼者。\n雖有差異，交融無害。厭惡、歧視、區別皆無。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:541ce4934124cd8761f2fffbf90e3deef032a4624a3864d62118bb70f0cfff25
    lang: zh-Hant
    text: "那座墓地每天都熱鬧得很難稱得上靜謐……\n但把這裡當成長眠之所的使用者們，評價卻出乎意料地不差。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:54276758c5c30d227d4599fe4978fdd10192a889356a86a1fe45a47281427b26
    lang: zh-Hant
    text: "我想告訴他們。告訴這個世界裡，現在停止不動的孩子們。\n大家也，不是什麼破銅爛鐵喔……。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5484b9ab32bb227d2e1d0d80e12738fd42a3f7ad817d41c13ade71a0668cbec4
    lang: zh-Hant
    text: 魔術師的興趣，延續了這條性命。
    origin: machine
    low_confidence: false
  - source_hash: sha256:54a90b0d4492c7ca5b15130542b1024b375e99067c8eb965cb05effc5f00213b
    lang: zh-Hant
    text: "那嚴峻的目光，絕不放過擾亂大海之人。\n「漩渦啊纏上去，波浪啊咬碎他。為海之樂園帶來風平浪靜」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5513be83e2f5b74e641e3eb93bdf648ad60b1474c0900c0be5b6518cf810fa92
    lang: zh-Hant
    text: "被你看到了呢，祕密魔法特訓。\n要是敢跟大家說，就宰了你喔♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:553dbef24a7640db4bfb5e1129aa228186873c2ee3ed6c2cdda681ca8b69eb2f
    lang: zh-Hant
    text: "連制服都借給我，真是太榮幸了。\n妝點入學典禮的校歌伴奏，就交給特別來賓我吧！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:553fdbc09b467bcf4a8e6d9d29bb85f539918e24047fbe90035d343011ff5d91
    lang: zh-Hant
    text: "裂空之槍，蔽空之翼。其名法露特，天空的霸者。\n「有本事就擊落吾之暗黑雙翼！」"
    origin: machine
    low_confidence: true
  - source_hash: sha256:555a3271d2371dbfc7a54de863a905e360ddfb7a5b20e8259830f68cb04796db
    lang: zh-Hant
    text: "變不回人類，哭了兩天臥床不起。\n第三天，在太陽底下睡著了。心想，好像也沒差吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5563b9eef6a2567dc367f7f8813013bd289f610d51b00bf3ed570ff6639a2866
    lang: zh-Hant
    text: "依一族的戒律，由我繼承首領，可恨地正是神的規律。\n即使如此，只要那傢伙在身邊就好，我曾這麼想。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:557912487067a9c7a8c707fe9746413cbc04bcdfc0ae757f0a393f113153e99e
    lang: zh-Hant
    text: 不只是可愛。還是位出色的參謀。
    origin: machine
    low_confidence: false
  - source_hash: sha256:55b9411e3dd446d5768077aea7df4288803d0218c64c630bccead46a727705d0
    lang: zh-Hant
    text: 非人之夜即將開始。
    origin: machine
    low_confidence: false
  - source_hash: sha256:55ca1f3c8b5a91ed31588621ee89a020f6d4b08f9712a5a4a4c599e45663fa54
    lang: zh-Hant
    text: 看著我的眼睛。那是你唯一被允許的自由。
    origin: machine
    low_confidence: false
  - source_hash: sha256:55e96b50940f5a1aec3f2bde9f7773de5cdcb8cc5aa4a01a168074d4e822e52d
    lang: zh-Hant
    text: "擁有強大魔力的魔女，煩惱著會被孩子們害怕。\n「妳會用魔法呢！試著做點心看看吧！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:56305197ebf9eb409995a063007c501507bd2edc59bedc31a74d94da4740647d
    lang: zh-Hant
    text: "眉開眼笑的盜獵者，潛入海底撈寶。\n「真安靜啊。這要是叫禁域，那可笑死人了」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5645dfd832b0dc1d06f016cb7478f651cbf8d9a4c7412a18e747fecbf75f3d22
    lang: zh-Hant
    text: "來，閉上眼睛。\n在情感之海墮下種子吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:567c3a0bcc16db94e861298235d25e4ebc2be8b2e425a8da01cb75ce165c4919
    lang: zh-Hant
    text: "這首歌……太抒情了，光靠氣勢唱不了……？\n那就，換個切入方式……欸，拜託再來一次！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:568c5847510a9ae557ff2fd55e463332235fa3738fa9b8f210c4f7e2453adbf6
    lang: zh-Hant
    text: "聽說大家都在找我，我真的好開心。\n這次輪到我用這份力量保護大家了。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:56a9f4df497fd6918e1598b0a768f19ea5413b5c4e53b3c4da22d62f87c80f6f
    lang: zh-Hant
    text: "我的劍技是拋物線。空翻也是拿手好戲。\n高處看得很清楚。配不上那美麗月亮的、野蠻之徒的腦袋啊。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:56aaff5fef8823215bd72fbbc6ec07a2c401388b101eafcfd64edf140d76591c
    lang: zh-Hant
    text: "上百門派的睿智所孕育的愛子。\n互相憎恨已是往事。延續至今的理念，其結晶就是這女孩。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:56b9cde6282bc3bc6645567e21413b4c7419e0afc5a7585863b166cb778334df
    lang: zh-Hant
    text: "呼喔喔——！力量湧上來了！這就是你和我的最強奧義……！\n兩人一體的魔法少女，最強的合體攻擊————！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:56c39b38c14099ab7d7a9a8d6a8e140cc731dac34700688a6cf3a70120f79490
    lang: zh-Hant
    text: "你那得意忘形的鼻梁，就由我來折斷！\n你的柱子和我的柱子，來比比看誰比較強！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:56c8aaa6cdfcc68ef328d5b957babaf6c903daa05dad38e901ec0eb61fa52765
    lang: zh-Hant
    text: "接受吧，毀滅乃是必然。無論如何掙扎撕扯，永恆並不存在。\n──既然如此，就賜予你們下一道試煉吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:56d6177d64a584211f157a7012ea1eb48b2c2e6a238321889756b9f608c87d7b
    lang: zh-Hant
    text: "讓我們永遠讚頌吧，那位清廉的姊姊大人。\n願您悄悄懷抱的憧憬，終能開花結果。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5712080278e675ac137e8071ae6ae863d17168745c07bc0f24ca6e6b4b422c96
    lang: zh-Hant
    text: "你看你看～是和月亮的夜之舞喔～！\n閃閃發亮，很漂亮吧——？……啊哈～看得太入迷了啦～♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:57401a78f25b00157af4a47522461493752b57e5455c0b2ad069c25387582d56
    lang: zh-Hant
    text: "紅寶石越閃耀，熱情就越消退，男人得知了紅寶石的祕密。\n「紅寶石會把人的熱情……不，算了，無所謂……」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5762a385fde825111caee51df0c093fe10989071c7bfcdb3803a65f31c754b3e
    lang: zh-Hant
    text: "神代時期的大洪水，僅由一頭所帶來。\n「創造之前先有破壞」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:576dd33e23013c1777bffd5f7c919411f4087563270587cc7a1a55f597a035df
    lang: zh-Hant
    text: "學習魔術沒有正確答案。\n進一步退一步，一進一退能醞釀時機。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:5780d3d43e87849914d9741d3d2f09f71f75666d1b138951eba7fbc5c8e9307d
    lang: zh-Hant
    text: "久違重逢的血親，躺在瀕死的病床上。\n「是姊姊的話就救救妹妹啊……」原來如此。這是很有人性的事。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:579443679f448b692e465b3b9e46376115adb23ac2309b339640b428f2b85de3
    lang: zh-Hant
    text: "裝幀怪得離譜，內容也是奇怪的文字，寫成了暗號。\n還附了翻譯與解讀用的附錄——彷彿在引誘人去讀懂它。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:579e76a253656010f6d128ea972824a4f1910339391f262de621efc51f1748a3
    lang: zh-Hant
    text: "把漆黑羽翼染成橙色的，是不可或缺的回濺之血——\n並不是，而是安詳到多餘的，夏日夕陽。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:57ab67ecf92936ff25889c13f0ad9fd7f72411af3d88cc7d7faec6bb50074255
    lang: zh-Hant
    text: "永不生鏽，百發百中。帶來貪婪勝利的魔劍！\n這是我從已故的父親大人那裡繼承來的。"
