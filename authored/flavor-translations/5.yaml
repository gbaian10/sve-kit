    low_confidence: false
  - source_hash: sha256:5dec4355bff21f66745c8101921d715033eb1770d96b04821a09893321c4037b
    lang: zh-Hant
    text: "過去，侮蔑的試煉已被跨越。\n世界新被賦予的，是烈絕的試煉。"
