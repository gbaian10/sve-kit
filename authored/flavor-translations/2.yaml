  - source_hash: sha256:2d487736419e020779ab26023b3fc2f0fc219a62d0bacf7cc94b75c282d19c84
    lang: zh-Hant
    text: "學即是仿，也就是模仿的意思。\n藉由接近偉大的存在，人便接近高處。"
