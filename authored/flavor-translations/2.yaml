    low_confidence: false
  - source_hash: sha256:2d9e17ffd681083d14da084f46a690b23106d12536ea17f6e59e3824fc5ece58
    lang: zh-Hant
    text: "那傢伙也和我想的一樣。唯一能信賴的對象。\n「把彼此的人生託付給對方吧」我們這麼約定了。"
