kind: flavor_translation_shard
entries:
  - source_hash: sha256:2007ff74290fd6639fad6f748b222aecf085e043b8dd14d680bb880ff9cd365b
    lang: zh-Hant
    text: "飢則欲，欲則進。故而篡奪，因而掠奪。\n——那麼，我將賜予世界試煉。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:20326cd112c56482746facaccdb3329726a46566127bda17e4e48114b9a5e798
    lang: zh-Hant
    text: "矛依未片刻不離身的胸針。\n與託付此物的搭檔之間的羈絆，賦予她揮舞天樓霸斷劍的力量。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:2056ebf76c413b06840b6c1d16f3112ea00265b5879ee0d175d53aea3c88f2d5
    lang: zh-Hant
    text: "連我自己都覺得很狡猾呢～♪一下子就變時髦了。\n就輕輕鬆鬆地攻陷它吧。攻陷這個世界。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:208d512b407f11d97fc77cf86678c1f7681dbf23d8a2bc0b712824ecbc84d81d
    lang: zh-Hant
    text: "龍低吼之時，天空便風雨大作。\n獵物們因雨勢停下腳步，飢腸轆轆的龍翱翔天際。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:20b6da09634269661aa8e9ed2c43d81bfadab3d71e10dfdd8e5c690374e63cb4
    lang: zh-Hant
    text: "緘默法則是楔子，囚禁的刻印。\n——結盟的罪人‧艾路拉戴"
    origin: machine
    low_confidence: false
  - source_hash: sha256:20c425f86fd6375fff9a3ceb3fa00d26e6642533b0cf6e775ed3ab9e8c670742
    lang: zh-Hant
    text: "看到女性盛裝打扮的時候，我想應該有該說的話吧？\n……呵呵，做得很好。可以再多誇獎一點喔？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:20c85e95086ca5fc459ee74e5fc207a0939afec9eb9897c9adff2f228ce0b0af
    lang: zh-Hant
    text: "「謝謝你見證我們的旅程！」\n「我希望，與你組成隊伍」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:20da08adc64e130688761fe7a14b4550f2ed6bd2fd6131073868b04676bd68f2
    lang: zh-Hant
    text: "我、我的巧克力……可以請你，收下嗎……？\n雖然心跳得好快……但一定要好好傳達。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:21017e5c4c3e30c7d1919e1eb3343e20f5412a83f24eeecdcc45cd3cc86f8f30
    lang: zh-Hant
    text: "壽命確實收割，工作準時做到下班時間。\n不過——聽說偶爾會在下班後陪陪冥府之河的擺渡人。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:212da14c433b2dfc5c6c53ae625ba5a900cb5d01b7c0153caf069bbbc95db3b7
    lang: zh-Hant
    text: "老師沒有放棄。把我的身體和心都重新鍛鍊了一遍。\n讓你們瞧瞧！老娘的鬥志，比火焰還要熱得多！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:213af3ad4f66c6a2ce6253202a546de80f07e4e9bad00c17d5e243466d61f424
    lang: zh-Hant
    text: "「……我。真的來了。來到憧憬的『學園』……！」\n一切都煙消雲散。睡過頭的懊悔、緊張，還有她的命運。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:213ba65a71e7185132cee02c020cd17bbc5db0ae2c26b28e75d583d320c610bd
    lang: zh-Hant
    text: "畢業前夕哥布林流下的眼淚——\n成為了與哥布林之間能建立羈絆的，歷史性證明。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:217c423232d0c8d6c3ac04b179e644ddef78fbe3d3c0d34e888232ec2a379220
    lang: zh-Hant
    text: "魔術的基礎是智慧的鑽研，也就是藉由反覆累積經驗。\n因此魔術師編織、釋放，再編織。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:21c3b51bca7ee584ae8f22275065fe16a931f582432346269241fcd02797e8e8
    lang: zh-Hant
    text: "賜清淨者以困難。提升善的試煉將至。\n賜汙穢者以救濟。消除惡的祝福將至。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:21cb815858860cbb89a846b705b657b99e4b7dd756dd929eab3f89165dc71a7c
    lang: zh-Hant
    text: "過去，飢餓的試煉已被跨越。\n世界新被賦予的，是干絕的試煉。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:22119925392bc5bc8005dacc7e8fee122523ad5d11abe51570380039406a620d
    lang: zh-Hant
    text: "你將前進。累積年月，歷經時日。\n在累積了年月的你的血中，他看見了自己得不到的日子。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:229d7463d89f6a991969304ec91f217f6e66da104357c3879640e2730fb234e2
    lang: zh-Hant
    text: "多虧清純的教誨，我才得以成長。\n連紅茶都不會灑的，淑女正拳突刺喔！喝呀！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:22a884bf2f92c18d6c0e150e98e6b2401161e8b5ead9b46e658cef4b40f532f4
    lang: zh-Hant
    text: "「要上囉～蘭法小姐♪嘟嚕嚕嚕～嗯★」\n「……好的，美空……。嘟、嘟嚕嚕～……？」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:22bedeff622196e67ec2cadecf9947c671b97651c0b0b3a3e141ca0271d9b0ff
    lang: zh-Hant
    text: "我想把土養好，做出新的肥料跟作物。\n我是個笨蛋，沒什麼自信，但總得報答這片土地的恩情啊。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:22c4b4c4fbf5963ae05bbbf11de26a8d8de578cf68628d08cf26fef66ca19b83
    lang: zh-Hant
    text: "既有自屍骸復甦之人，亦有自星辰復甦的獅子。\n為了逃離宇宙的英雄，牠再度降臨人間之地。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:22ff6e27a80e7fa2a650fa4c639bdddcdff4737fd77765f462cc8521fd27c937
    lang: zh-Hant
    text: "災禍粉碎之時，石板也隨之碎裂四散。\n隊伍懷抱規律，誓言不變的崇拜。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:230f04cacfab7c96dc98dcf135e5c15dac1da5ce3a669656376d8a29e92115dc
    lang: zh-Hant
    text: "當世間充滿嘆息，無法只是嘆息的人便挺身而起。\n即使不被眾人理解，也相信著自己心中的祈願。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:231029779249d20e93882b476c04a762c3851865fa3a79d901eb224c2cad58c9
    lang: zh-Hant
    text: "夜晚降臨，羅剎混入暗夜而來。\n無禮之惡，不可饒恕。夜鷹人——那是守護森林之人。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:2330e0aa489b77ad7991a04cfbe0284d300caa71a28770101a85002d40aa1b9e
    lang: zh-Hant
    text: "對傲慢又豪爽的她而言，這個夏天全都是她的。\n「支配大海，你不覺得這也別有一番樂趣嗎？」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:23609309571afdb76f10e577b7835008f9ee7c803ac4de4edf41eabd14d5fb31
    lang: zh-Hant
    text: ———緋炎之鞭就此解放。
    origin: machine
    low_confidence: false
  - source_hash: sha256:239c48c1b1e35dcca805cf875b5836ad318e5153880f9321332e773a56c1a4ba
    lang: zh-Hant
    text: "要去……工作……嗎？……我也會……在學校……加油……。\n……雖然地方不同……但是在一起呢……。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:23b3d3b8207e6f7e21ccd169c05db5e52ac6e875880d39d713946cd0ecebe456
    lang: zh-Hant
    text: "◆死角拗的葉針　症狀：急性發炎\n【合格】十一名　【備註】其中一名撐過了五十針"
    origin: machine
    low_confidence: true
  - source_hash: sha256:23d0247b8c5b2dbc4897334f267311fcf796ffd545fc95744d26c3a2683ccd93
    lang: zh-Hant
    text: "美麗水面的底下，黏稠地擴散著醜陋的汙泥。\n美麗面容的底下，奸笑地藏著醜陋的嘲笑。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:23d12b206d55737cf2f37f2bef447aa4b246291be44ad3937007a0aefb538d6c
    lang: zh-Hant
    text: "很漂亮的盛裝打扮吧？妾身尤其中意這件羽織。\n因為很有支配者的風範嘛♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:2406e905dbe482725f65d55ca023772db0a1345689aaa6039fc2edc06713d434
    lang: zh-Hant
    text: "我身乃統合之絲，是將意圖擴展至三千世界每個角落之物。\n教義很簡單！愛平等的他者，一起織出最棒的巢吧！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:242397f65c71fa66c5f3f1beb0ca88a7328c7fad77c2bb936e36cc171f8e155a
    lang: zh-Hant
    text: "嗚嗚……不要一直盯著我看啦。\n啊，那個……可是，也不是不想被看……。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:24894e6b02f5064df9ef3307345b9b296d8fcba9d7184bf5e27afce168a5cb25
    lang: zh-Hant
    text: "日期時間、路線、目標獵物。毫不隱瞞地預告。\n過頭的誠實，是藏不住的自信之證。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:24a5bb1e5ca334976cd2b9fe05b6281ce11a6abf4ba561c8cbaae449faffded5
    lang: zh-Hant
    text: "請您看著吧，主人。\n我……現在好像什麼都做得到……♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:24e7e514a61fc44c3e5ba7fa1f3e869876e2294fc2085c3bc6932a49091debda
    lang: zh-Hant
    text: "嗚喵喵喵喵——！力量滿溢停不下來！\n這就是我和騎士君的！公主型態的力量——！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:2515ca0f745861bdb2ad3f0cddda13b6c9b23ff51996c67f09c797b6015f2647
    lang: zh-Hant
    text: "沾滿罪惡的耳垂，被絕叫之浪洗滌之時，真正的平等便告成就。\n——是故，繼續世界的試煉。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:253367f72c11dd35ffe044d6bdd1d22d498d5e2809fa6b38aeb77ef3ae97a6fa
    lang: zh-Hant
    text: "遇見妳之後一切都變了。事到如今才不會放手。\n與其放開古蕾婭，不如在那之前先讓妳結束。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:25419a881db8c5270c5eb921e917f7a947bc543fa3f3c43b66dcc84864528e28
    lang: zh-Hant
    text: "已經開始轉動的、對偶像的心意，誰也阻止不了。\n編織向下一個千年的夢，請跟人家一起看吧♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:254d0748ef0c7657ff4f7623b235592c85bd5a8952b9aa47892316121e0e83b6
    lang: zh-Hant
    text: "魔術師們是相連的杯。\n注入的水一旦滿溢，便灑落，流向下一個、再下一個。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:256822837f47d0c1ee63aa5103b7ee0f5eeec006edc6ed3f93639b1257748785
    lang: zh-Hant
    text: "呼呼鳴叫著運送的，是從四面八方得來的魔法知識。\n為了無法收拾的研究，所收集的賢者智慧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:259c08f414ec95d0442d6c07929d2872f2db03b61ad8d6ad66706aca0c2baf29
    lang: zh-Hant
    text: "人有醫生，森林有樹醫！\n我會好好幫這座森林診察的！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:259d6370a54900211dc9279791df9b1a9b2c98c9b0b4f05ea592af92e9c6fb11
    lang: zh-Hant
    text: "緊張讓身軀發熱，汗水在鎧甲下迸流。\n這是年輕氣盛的躁進，還是邁向榮耀的先驅。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:25a20a54c7655c0c469739fc50f813dfe940a01acda91a0e73a90fb293743b69
    lang: zh-Hant
    text: "惹人憐愛的妳。用那木莓般的唇，一直呼喚我的名字吧。\n苦苦等待的寂寞，就讓我用大吉嶺的熱度為妳消除。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:25a5ee3a2af0c58400f83bf270c9fdf427fc166fdc61a42126eb38588f883d21
    lang: zh-Hant
    text: "今天的幸運物是骷髏頭。\n不介意的話要不要把家父借給您？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:25b60a884f58c016097ec1b73d2c9e8f72ce37cea41ddc75faf518212a13d7e1
    lang: zh-Hant
    text: "在好不容易逃進來的森林洞窟裡，我今天也讀著書。\n我想知道。折磨著我的不講理，到底有沒有理由。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:25d16934d8c4cf14e7e740d5fde4b7f747d7e518522928a5e9c261bfd4c53ab7
    lang: zh-Hant
    text: "剛被生下來的，忍者之卵。\n能不能孵化，就看本人的努力了。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:25deb5a05ea386f4ac5075f3483b2b45ec75c84e082b1188d43b91c1a03c4c74
    lang: zh-Hant
    text: "不幸之星被藍天遮蔽。薄命的微笑今天也格外耀眼。\n「與你共度的夏天，我一直期盼著」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:25e83bd1830474291163b47af82c647b4a1fc782d1ab1fe34340267ded8de9ce
    lang: zh-Hant
    text: "龍鱗能賣高價。屍骸的話能蓋一棟房子。\n獵人追逐著夢想，與浪漫一同煙消霧散。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:25f897be536774e7542b5ee68ec9ca15dbd0573afc4b7762becff1a54585f59c
    lang: zh-Hant
    text: "那是名為勇氣的光之劍。\n閃耀吧，爆破劍士！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:2602cc826c8d1c1460110625f1adca4941867367b07753c698747a8931db933c
    lang: zh-Hant
    text: 挺身對抗強者的覺悟之劍，轟鳴吧，爆破者‧黑暗！
    origin: machine
    low_confidence: false
  - source_hash: sha256:260a2c838bb184a595860329d58894323c29b12a6ed2a6251cd4243c2a5f3b82
    lang: zh-Hant
    text: "我呢，是阿瑪麗麗絲。\n——是被詛咒的公主喔。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:260f06c39cb9567e2a6bcd3a1594e7860575a29f92dfe76c0208d19239ee879c
    lang: zh-Hant
    text: "我已經不是只會憧憬的我了！\n我也要試著相信，自己的可愛！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:262506a15d566e0fd9270f648dac250e560a16df5e653bc23101a3c54838efbd
    lang: zh-Hant
    text: "來，把磨練至今的毅力全開撞上去的時候到了——。\n我會成為在舞台上燦爛閃耀的太陽！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:263554fea951a83ccdee78e7b5c3f8e91f2a2868c5e3e3bb596b65855405e4b5
    lang: zh-Hant
    text: "新芽也是有覺悟的啦！\n——新芽組員"
    origin: machine
    low_confidence: false
  - source_hash: sha256:264dce084f637ac67a924ba33f439b7ecf3667d83ebe8b5cd1eea7c0c9a2c262
    lang: zh-Hant
    text: "啊～哈哈哈！\n去死去死～！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:2665b2fb46b719d392ad19ad3593171bcfeba33bf53331cdc6bfba7305cebb83
    lang: zh-Hant
    text: "坐在圍牆上的，光溜溜的頭。得意的臉滔滔不絕地說著。\n「你知道好多挖苦人又艱深的詞呢。明明是顆有臉的蛋！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:26724e0cf255b2846243c728899a96890a713a300b18c63d220dab83720c36e1
    lang: zh-Hant
    text: "坐於天上的並非天使。知曉霸道的只有一人。\n「這一槍……擋給我看！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:27580fe20c481e1814498d18dc3a09e6cdde890e7e847b522064f837afcf908b
    lang: zh-Hant
    text: "這個地方是人們的希望。\n正因如此……絕不讓你們這種人踏進來！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:27692559f217e7d48448e7b3f5d7434cb97bdacc0498177261829c58100b5317
    lang: zh-Hant
    text: "說出口會讓人困擾的心意也是。\n做成禮物的話，就能讓對方開心地品嘗了吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:278b2b884853690c4ebdd91fd217d6c531b91812de6f9f14f5991d32081d8e5b
    lang: zh-Hant
    text: "居然能在最喜歡的橡實堆裡滾來滾去……。\n怎麼回事？這裡是天堂嗎？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:279e905d45a484089671f21d043db2ca8c455c324cf28aac1e0cc76621d09f7e
    lang: zh-Hant
    text: "愚者們焚燒書籍。對操縱未知的賢者施以肅清。\n賢者們燃燒內心。對拘泥已知的愚者施以報復。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:27a1cf46180545903773d8e6d5bb935d451eafcf5abde80f8c068dda498015b9
    lang: zh-Hant
    text: "從肺中吐出的氣息，在粗如大樹的喉嚨中加熱，化為蒼炎。\n它燒灼可憐人們的背脊，將之化為灰燼。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:27b284dcca843042a8e22deffe673b564747d4104b2f6d6aa11e14d9f214be10
    lang: zh-Hant
    text: "欲望才能催生發明。\n——驅動領域‧格蕾緹娜"
    origin: machine
    low_confidence: false
  - source_hash: sha256:27ddcdf2f08aa6b807424ac98a711a049dc3d939b073aeacdbd224aefe1ccb0b
    lang: zh-Hant
    text: "染上惡意的神，隨惡意引導人。\n「我就是你。是你的惡意」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:27e499defe97847fee6d0d68c43792fd41be4e1f03a52af9a0d4b37b3935fbe9
    lang: zh-Hant
    text: "內心軟弱之人稱之為犧牲，懊悔，大為哀嘆。\n內心堅強之人稱之為代價，承認，大為運用。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:2851f27efff09a884162284f57524e47bc04cdb8c8f1b460ec0c016e60b3848c
    lang: zh-Hant
    text: "飽食的野獸，依然飢餓，心繫白晝的暗巷。\n執拗的野獸，依然飢餓，把希望寄託於夜的縫隙。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:286c3a3af99538e8260f4d62f490acb71fead98cd08b1e68bed0248f43107e2a
    lang: zh-Hant
    text: "這是，作為無情制裁的宣告、作為無上詛咒的宣誓。\n方才已先發制人完畢，故你已是無常。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:286cffe2a6011b34669a526fa7bb0fc7e1ee5ce9cee7accfccab5756b4e6f807
    lang: zh-Hant
    text: "只要勝利在手，就給民眾無止境的狂熱與昂揚。\n「開始賭上性命的比賽吧！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:288e563c87da1d3da1905fb32751e3c45a1769768fbfc24fb2e4f2644282bc2c
    lang: zh-Hant
    text: "對信神的人而言，是最棒的信徒。\n對不信神的人而言，是無以復加的狂信者。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:2894d23e8fb355a88b268108a0cbaa8efe6213d13974dad6e37d77bf2ec25f23
    lang: zh-Hant
    text: "戴著面具的，是以龍鬚之弦招來繁榮的神祕龍人。\n其本性，依舊藏在面具之下。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:28985fe5f1e7dc92bd8c7096a0461e97f688a29ee6f2b4e074dbaf250a49127f
    lang: zh-Hant
    text: "對，就是那樣。\n啞口無言——那才是面對強者的正確態度。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:28a22fb292715aa0c96dccc8387b674ab0a1ab4c721dda072bc9e30c4b8bebe8
    lang: zh-Hant
    text: "「奪取自由者之敵。那就是貝爾特佐爾海盜團！」\n我有一天也要成為像爸爸那樣帥氣的海盜！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:28ae397189f582299de0c2220ac6ef2561614ca44ea182f263bff19772861ca8
    lang: zh-Hant
    text: "我要作為苫小牧孕育出的光輝！\n綻放得更高、更耀眼！！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:28de31bc7ce4e4846376885e355d439b578b8317b1501ddecfbf54d14c21508d
    lang: zh-Hant
    text: "要稱為龍，這模樣是稍微可愛了點，\n但碰到的話可不只是燙傷喔？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:28f67caaa91bbe235082c8fbca69a5386f40422b8acc0fcfe6024b1647e144cc
    lang: zh-Hant
    text: "過去，破壞的試煉已被跨越。\n世界新被賦予的，是奏絕的試煉。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:2936043f754605de5a5269a09766d8f986b95753af32e543faded3e2f78261e3
    lang: zh-Hant
    text: "那雙眼中棲宿著瘋狂之色，憎恨上天的憤怒之色。\n嗚呼，世界之所以有海，是因為你落下了淚。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:293cdee218ae8feb5cc756a575bb0e831c6455c34bd375ec3ebedb82e887e1ce
    lang: zh-Hant
    text: "令人目眩的光輝，根本比不上刺痛喉嚨的乾渴。\n在吸血鬼的社交界，比起美，美味才更有格調。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:2941cf942a82c18e185af852add5a0e7d0337448ee4008e9456f7756f76eb6d3
    lang: zh-Hant
    text: "怎、怎麼樣……？是和可可蘿一起挑的……。\n穿法也還不習慣……那個……有沒有奇怪的地方……？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:29773d1ebddd07ae6a1f6e10363b9bde2d4ecdcd8c2b59f6e24171fc4399c5e4
    lang: zh-Hant
    text: "因為英雄先生不肯收下寶石，所以我想了一下……。\n那個！請把我收下吧～！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:29a6adb7465ce2b9ed0cb3827e6ad47aaf0f2235427bc6226af8114143dc294a
    lang: zh-Hant
    text: "驚天動地之中出現的三個國家。龍人對戰，就此開幕！\n三國絕不相容。互為仇敵，不共戴天。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:29b60ad95509dac073b9d7709d9dffcecbfef24e20c086a799ae459841b70ca6
    lang: zh-Hant
    text: "尊崇深眠，並如此祈願。醒來無非是苦難之路。\n我等渴求，那綿延不絕、永不醒來的長眠。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:29b848265ac07194a107f81b96c94bad124c1af1fc8e9a871af9eda656fd28ac
    lang: zh-Hant
    text: "教義是狹義的，只傳得進聽得懂的傢伙耳裡。\n所以我決定宣講對誰都平等傳達的教誨。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:29ebad5d86c1ede7131ed00c2604b53709b715bbcd21ac375f91a22df0ba24d5
    lang: zh-Hant
    text: "小子，要在這裡活下去的話就記好了——\n——不拚命趕著活，就只有死路一條。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:29f363ba4da9935b5da7a533a9e8a031d2eec0e2c02ef9583b2b70e59ff01751
    lang: zh-Hant
    text: "可以叫我小鳳喔！\n——萬花鳳凰"
    origin: machine
    low_confidence: false
  - source_hash: sha256:2a098a4f8efef134bbfb49dafd3a2bafd85188533fcff750fb9ca25bad5daf99
    lang: zh-Hant
    text: "「艾蜜莉亞小姐！這裡就一口氣進攻吧！」\n「好的，莉夏小姐！不會再讓他們為所欲為了！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:2a0fee715ae98cd4ab57174fa1bcd02ff8c4185b6908bae3032188c881d93dbb
    lang: zh-Hant
    text: "救世的騎士大人。請讓我也助您一臂之力。\n為了阻止母親大人……阻止從《星之城》降臨的毀滅。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:2a297f7c051abd6fb99c7c4173010145c90f70cdced73b84ed13df0f33c774e2
    lang: zh-Hant
    text: "「妾身是戰場上的萬綠叢中一點紅！拋媚眼絕不能少！」\n「出現了，一點紅！聽說就算閉著一隻眼也能解決敵人！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:2a371390b298ac18b63a2424e1574466fdae2da43ca39d2d9fea92e443ea8dab
    lang: zh-Hant
    text: "「人會迷惘。正因迷惘，才堅強、可貴、令人憐愛。\n即使無法給予答案，我也願成為通往光明的路標」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:2a4c3289b10523e17fc2038be9f669ab39fe2d8c2dbbef6bc0b9fc83fcfbe3ba
    lang: zh-Hant
    text: "……欸，騎士君。再多說一些給我聽。\n什麼事都可以……好嗎？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:2a563b8e1aed012b73901b22ce7e93ad522e6d939b11922bcc26cdc2dbc06063
    lang: zh-Hant
    text: "「只要大家都變溫柔，世界一定會變好喔！」\n——希彌佳的話語"
    origin: machine
    low_confidence: false
  - source_hash: sha256:2a6743ef294e34d5b25aa2cfa013fe53bf34769ffe18fffccf87eea9393277f4
    lang: zh-Hant
    text: "封閉心靈的魔女……但滿溢著思念森林的心情……。\n森久保也想用自己的方式，試著傳達魔女的魅力……。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:2a69d010034d66b9194d7d2d6afc4488f5bf9e7b0755e3c2e9d65e15a3001f9c
    lang: zh-Hant
    text: "從這裡看出去的庭園非常漂亮喔。呵呵♪\n雖然有點沒規矩，就現在好好享受吧。來，你也是♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:2a705714b2d43ede8926cc6cb1b7a3bc8b1ca0f10768fc188d8af644df4721a2
    lang: zh-Hant
    text: 歷史在此。真理也在此。三十年前的天氣也在此。
    origin: machine
    low_confidence: false
  - source_hash: sha256:2a70df8c224d0f004612e0a22669322a48215e4eb247b10b669599a3f52f8711
    lang: zh-Hant
    text: "戰爭有表面與背面。\n不懂背面的做法，可是會被人絆倒的喔？"
