    low_confidence: false
  - source_hash: sha256:2acbed5d2a2aa8adf88855e17626ee168b9b0f1897169622de753c10c4fd27f4
    lang: zh-Hant
    text: "來，怎麼樣！這就是，次世代載人飛行機器人的設計圖！\n可能有點不切實際……但你願意和我一起作夢嗎？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:2addcf4c62d481fbc3b988ecad2cf255237cd2c8218c6e28c88203c3dfa3d1b9
    lang: zh-Hant
    text: "人們選擇的答案。那是，開啟的絕望。\n所以由我來阻止。直到最初的決心，折斷為止。"
