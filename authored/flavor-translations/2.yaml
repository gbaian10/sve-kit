    low_confidence: false
  - source_hash: sha256:2c0c94eb136daf601f72cbcd9c7d13ab329947a614d4f41f692a8a9119807792
    lang: zh-Hant
    text: "沒有人不為那野性的直覺、敏銳的五感而震撼。\n戰場是原初的弱肉強食。那麼人就沒有能匹敵的道理。"
