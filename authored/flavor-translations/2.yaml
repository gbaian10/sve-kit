    low_confidence: false
  - source_hash: sha256:2e052001408096ccc5595d2d21ae4dc0a9c74fa4ab486c3d00051e832859baee
    lang: zh-Hant
    text: "火焰正是智慧的象徵，人類的文明自火焰興起。\n火焰正是智慧的真髓，火焰自英明的魔女而生。"
