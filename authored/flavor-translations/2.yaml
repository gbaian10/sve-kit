    low_confidence: false
  - source_hash: sha256:2a7cc07099686eb8ac946397b65c8ab05ae118ced609567b5681346a4b13f0a9
    lang: zh-Hant
    text: "呼呼呼，是我贏了的說！\n那麼——要畫什麼好呢。做好覺悟吧的說～♪"
