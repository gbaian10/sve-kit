    low_confidence: false
  - source_hash: sha256:2b7c45ff627b5f5310518b7e375179697f245834955685b7dd2aa8bdf99488a7
    lang: zh-Hant
    text: "歸還而滿足，滿足而飢餓。\n——空絕篡奪‧歐克托莉斯"
