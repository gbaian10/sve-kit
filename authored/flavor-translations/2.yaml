    low_confidence: false
  - source_hash: sha256:2d590c29facab7d60d914b9e36578786191cb8e7224beb45581b20bec32f2645
    lang: zh-Hant
    text: "該奉獻的，不是物品。有形之物，對神無用。\n獻上信仰之心吧。無形之物，對神才有用。"
