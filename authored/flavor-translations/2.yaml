    low_confidence: false
  - source_hash: sha256:2dd28143c92af6cdca0af6751a8fbef24f108d215b997422cb36c5c4ea02224d
    lang: zh-Hant
    text: "外表的喜好、內在的喜好，被嗜好耍得團團轉才會醜陋地爭鬥。\n熔進窯裡就全都等價，比肉塊美多了。"
