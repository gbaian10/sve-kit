    low_confidence: false
  - source_hash: sha256:2bd3f854ad60ed6a6accb841d09a0638498f64e75490f4d065f715e457492e11
    lang: zh-Hant
    text: "不需要。需要。早已決定。\n——敕令的罪人‧夷蘇丹忒"
