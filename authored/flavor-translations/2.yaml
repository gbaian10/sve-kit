    low_confidence: false
  - source_hash: sha256:2c46a36fff54c07788d5666b0ca184a9d5299b532809e16f84a5394188a7608f
    lang: zh-Hant
    text: "過了死期，四季輪轉，曾經珍貴，如今是日常。\n「呵呵呵，今年的夏天也讓我好好享受吧」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:2c522c953b6363ddaa00958513b3b5869480dbc5ec9292df11eef03bc7231346
    lang: zh-Hant
    text: "跟奶奶學的降靈術……能順利成功嗎！？\n好——，要上囉——！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:2c9468f441ca143a2f3ea88791a394f89c6b506524ff7fe8a6fa0552a78cd568
    lang: zh-Hant
    text: "若您聽不進去，我就不客氣了。\n就算是醜陋愚蠢的您，也能當薔薇園的肥料吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:2c979a33daae0035326d272ee52c8bfa2499dab064e8e1169301ca93691227d4
    lang: zh-Hant
    text: "到目前為止，我做了好多過分的事……。\n所以相對地，你想對我做什麼都可以喔？騎士先生♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:2cab178ff22491ab53a92f61c0eb10505631826cad27484ed9fc321143ae3a1e
    lang: zh-Hant
    text: "夜店在開趴，景色又超漂亮。\n世界上有好多Happy的地方呢☆"
    origin: machine
    low_confidence: false
  - source_hash: sha256:2d0b0f5d482194a62a9a36c45407fe23c616797ab2304adfc94cb857a40c1e19
    lang: zh-Hant
    text: "以為你們的籠子養得了我嗎？\n能束縛我的，只有我自己的願望！"
