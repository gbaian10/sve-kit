    low_confidence: false
  - source_hash: sha256:2c1f2bf8fb45d5813d0625e67d506bed412603cccfcc8d0399e2dec971881730
    lang: zh-Hant
    text: 臥龍靜靜地等待著。等待飛舞上天的那一刻。
    origin: machine
    low_confidence: false
  - source_hash: sha256:2c30dfd3300b2d64c33de1e2886f695367828b42a456dd462af2964728481845
    lang: zh-Hant
    text: "帝國名產大賞連續十年金賞，寶石雞的煙燻雞。\n她做出的名產為村子招來人潮，使其發展起來。"
