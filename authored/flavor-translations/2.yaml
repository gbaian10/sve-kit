    low_confidence: false
  - source_hash: sha256:2bea5b1bef336d5c60fabfbdf54ee8b685c8fb07983c53e5a92daf8b234088c9
    lang: zh-Hant
    text: "樹木沙沙作響。野獸鳴叫。蟲子蠢動。\n明明從踏進這座森林的那一刻起，就已經被警告了。"
