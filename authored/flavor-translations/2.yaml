  - source_hash: sha256:2d3c065b4ee8c14aef2c50668532c306610ea2f5a94207ef9ed4369cb3d0c3d2
    lang: zh-Hant
    text: "真是個非常舒服的日子呢——。\n是因為有好多綠意，溫柔地包圍著我們嗎——？"
