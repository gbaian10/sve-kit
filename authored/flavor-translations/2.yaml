    low_confidence: false
  - source_hash: sha256:2b8b7a9380c287f20cd962fbbcf341639794dc2d275dd7ce36ed1df99fe5d132
    lang: zh-Hant
    text: 高潔自豪的白色羽翼。孤高的騎士，在戰場上飛舞。
    origin: machine
    low_confidence: false
  - source_hash: sha256:2b97eca60c02de65eb68b7e7d37cfea9172c570f237b8e26289862e630ce9314
    lang: zh-Hant
    text: "經驗、分析、預測。再加上士兵的信賴，戰略才告完成。\n「相信我的計策」"
