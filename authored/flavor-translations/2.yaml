    low_confidence: false
  - source_hash: sha256:2ddc17e670b3b9cd89b737a7369a79daeb2caab9b0cbf454d9d376d1f68380f4
    lang: zh-Hant
    text: "昨天，我在家裡下廚了。\n就是這個餅乾，想請你吃吃看！"
