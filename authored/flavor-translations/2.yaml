    low_confidence: false
  - source_hash: sha256:2dd9ebbf7a46ee85f10de580623f07fc39c48557e42b1b1e179a68436d68bd63
    lang: zh-Hant
    text: "賜予大地的虹色奇蹟。持有者將得無與倫比的加護。\n——一個衣著體面的男人，在叫賣時這麼說。"
