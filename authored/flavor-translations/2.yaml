    low_confidence: false
  - source_hash: sha256:2aec1edb9340b477430444817985808d564cf004c791f76284b1e009e9890c6f
    lang: zh-Hant
    text: "最近，作惡夢的人類減少太多了！\n現實比較像惡夢，人間界到底是怎麼搞的啊！"
