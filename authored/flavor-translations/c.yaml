kind: flavor_translation_shard
entries:
  - source_hash: sha256:c0185e1c69e0e561ccad2500ce4d920123cbf3ba536b41957e431fac59a7c413
    lang: zh-Hant
    text: "冥錢不過是人的迷信。血液才是惡魔的貨幣。\n若不避諱外法邪法，就獻上汝之血吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c018a846ac01720f4fe01bdc19048b957030f3771ef74e2071dc8152d16fe4ca
    lang: zh-Hant
    text: "……哎呀。那邊的魔物先生，你迷路闖進來了嗎？\n雖然很可憐，但就讓我用手刀懲治——喝！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c06bdac84afb429079cf2c119ce9beac6f73f51fd7c47f2aacb0cde97e88b687
    lang: zh-Hant
    text: "破壞吧，我那永劫無極的歌。\n——破壞的繼承者‧阿克西雅"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c0ef1c39ab872aac21cc9fe2ff2801ecf0736715cb1d6468dd39fcb929b94cfc
    lang: zh-Hant
    text: "由我捕捉祭品，由龍吞食。然後輝石便到手。\n那麼，從今以後……犧牲會增加多少呢。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c1155d439e3e65a10658a2ce8f37c7439d80acdbc5f8d58a4559cdc635a269aa
    lang: zh-Hant
    text: "每射偏一發，就要喝下能讓視力變好的特製飲料，這是規定。\n獸人族的任性王子，不斷把它灌進胃裡。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c15418a16024e542da13593a4b7ce810c5cf8eabbb990c3f7299d4ec69fe4a8b
    lang: zh-Hant
    text: "為什麼我們變成獵物了？「快逃，安媞馬麗亞！」\n分開的話不就缺一塊了。缺一塊——有點討厭呢。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c169ed04e82753501a3346dc961ba61e109e84467cabdcffe892b753b6154929
    lang: zh-Hant
    text: "和魔女一起蓋的糖果屋。兩個人津津有味地吃掉了。\n「糖果屋拿來住，實在有點太好吃了！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c1b3fc1abff753d3d13aa519a2d47bbea983013ab478be3458bb3fc3d663c93f
    lang: zh-Hant
    text: "「Hey，Bad Boys！\n做壞事的孩子，需要處罰Death呢——！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c1dda7f15de08ae520a239535e91f69c5cbb50516c57ced5eb88d9f93a66e9fe
    lang: zh-Hant
    text: "照耀過我的月光已不復存在。\n我是復仇者。擊墜太陽之人。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c1e29b0b51e91102b44b0381284309f925b32d7e441529f3eefbc2663d9ec60c
    lang: zh-Hant
    text: "『能讓任何人乖乖聽話的魔法』……呵呵呵～。\n完美。這下就能逃掉明天倒垃圾的值日啦！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c205c056fad660451a2c2b06e937785ae76c8d7ca6a951344c4078810588c812
    lang: zh-Hant
    text: "戰場這種地方啊，淨是些冰冷又難受的事對吧？\n正因如此，在前線跑來跑去的我才得開朗一點啊！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c2487999011f360fdb2d4860951f759be552a19e3df0fdd7b4aeb9417eab922c
    lang: zh-Hant
    text: "是不是還滿認真在down的？就是在down嘛！\n也就是說輪到人家出場的意思——！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c2c3a389d49e25a407d55a8562401309da4a739a42fa91e5907a44b3e202ccfb
    lang: zh-Hant
    text: "就是想露一手吾輩厲害的地方，讓人尊敬啦！\n懂嗎？所以說，那邊的你！讓吾輩痛痛快快地贏一場吧！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c2f25adb70ed907e890e7d65d353ca3b5dd373f80f356a8dafa710eed96df605
    lang: zh-Hant
    text: "大家，看著我吧。我會在這場對戰中變強！\n——天龍光翔"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c313c8864ff577c52364ace3afdd64c008a8eab71956a91f87fe3dc1592b2586
    lang: zh-Hant
    text: "我的本能覺醒啦。接下來可不會手下留情。\n就用這磨利的爪與牙刻給你看……我的力量！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c32277f73e20b40414c9ffd196a3552d5bdd0ada57088bb1d6a831029a8787f9
    lang: zh-Hant
    text: "好天氣……是絕佳的洗衣日呢……。\n喂，武爾姆！別偷懶了快來晾啦！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c339c5a067032f30c26b55a8409a5443ff83821f0688d1f79028b20e4eac1977
    lang: zh-Hant
    text: "新的試煉，顯現的奏絕之歌。在響徹的歌聲中，她——\n「你已成為永遠」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c33a7495cfdc9e2ddc5a55dc66466d9a794c21a6190d2c3e569e788ae251f862
    lang: zh-Hant
    text: "因為那毛皮實在太柔軟了，\n妖精們安靜下來，一覺睡到太陽升起。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c33e6bc7bc21edc49f2e174a26dfe161daddbf8b1feb89cdf860f1aad8ed1f3c
    lang: zh-Hant
    text: "不聚集，不成群。無所不在的「一」啊，懷抱意志吧。\n——來吧，賜予世界試煉。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c3801e417a71b92623d9171ae7ac3805a1d6654296d6e69a56d5c387af7c84cb
    lang: zh-Hant
    text: "把森林的英氣搧搧搧。\n……幫忙就到這次為止喔。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c390866b01efe2b93749725b344ef60184487eb2097f9d0d4cd82f805a2263e9
    lang: zh-Hant
    text: "相信總有一天這份心意能傳達給你而寫下歌詞——\n並且會一直唱下去，我在此發誓。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c39d8c6fad7b4a84f1ff8cc5e7f6749cb79b35815fd3d5b1c7c0f76c5925b6dc
    lang: zh-Hant
    text: 我說過了吧？『讓一切付諸流水』。
    origin: machine
    low_confidence: false
  - source_hash: sha256:c3f6338f08571359678993cda3a26ee24e32862eb5d489fe8a74a599adfc497e
    lang: zh-Hant
    text: "『天氣真好』『真好吃啊』『我啊，有喜歡的人了』\n『我只想要一點點喔』『欸，可以拜託你嗎？』"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c425cb05b15b1fe9dc2e05aa0cf2b0b58da2f7dd8f10848b97afbbe485dc6478
    lang: zh-Hant
    text: "古今中外，戰爭的理由都是「為了得到什麼」！\n高舉雙手前進吧！勝利與榮耀，一把抓住！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c42eb08a6f65ea308f18cd3599d15243c652e687457f1f3aa18358d35c19d28a
    lang: zh-Hant
    text: "「呼哇啊啊啊啊啊！？糟糕了，危機了！\n明明是新生卻遲到，絕對會被罵的啦！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c442d39a91ce2031bde82305d964c28d858ac7dfabc240b8c372e5c2b1f587b5
    lang: zh-Hant
    text: "王將成長。在她的羽翼之下。羽毛將包覆。未來的王。\n成長後的王的威光，對她而言就是白色的王冠。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c455c206ee7bacf9658cb11e7949cc667abd91a280b4fbd5e2b61bb49c214316
    lang: zh-Hant
    text: "不斷把有化為無，這乍看毫無意義的行為，\n正是通往無中生有的領域……啊啊，已經聽不見了嗎。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c472f370116ffcb7fed5b0a97f7801093d533566b7c1eeb23992952d07d5bb3e
    lang: zh-Hant
    text: "某人的利益，就是另一人的不利益。\n那麼所謂的庇佑，就是另一人的——。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c47fec29c90935017a208cc1ddc48cdbb76f97dadf76387f27a8f6088833f355
    lang: zh-Hant
    text: "拚了命、被追趕、苦惱到扭動身軀。\n一直保持無垢的話，可是會就此結束的喔。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c4891ea070ac8ce9498c8540da455706a4e36c59c3a7d557d6570d6d6f2abba8
    lang: zh-Hant
    text: "鯊魚的一刀、鯛魚的一揮、沙丁魚的一閃是魚刃流的基礎。\n而這就是究極三大技、集其大成的奧義……竹筴魚的斬擊！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c533623a185b0564af12fc712602bc2b2e88bb0544945ff0ee3e309a84901822
    lang: zh-Hant
    text: "莉嘉樂園裡，吉祥物和偶像全～部都是莉嘉！\n會可愛到讓你DOKIDOKI的喔——☆"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c574c2d4a1a0a85abceff6e802d5e5b6204dd987ab238f47ab7979286e99780f
    lang: zh-Hant
    text: "記住吧！傑瑞米亞‧哥德巴爾德！\n這是為你帶來敗北的、值得紀念的男人的名字！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c5859a6ffedbc5deee1d32c19670d2694ff5faba51c82980a967c23716fa114f
    lang: zh-Hant
    text: "只是個普通人類很奇怪嗎？\n就算是活了幾百年的大樹腳邊，也會長出一年生的草啊。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c596d12a5135a7ae3304bc66680c4249c88982aa080c6d648ce449dc57491212
    lang: zh-Hant
    text: "「來，凱留也吃吃看嘛♪」\n「為什麼每次都是魔物料理啦！」「凱留大人。別這麼說」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c59fe7b740f8e9fb8297ab2b1a7241cb356a6e236dfa3ec334f6271f15e6933e
    lang: zh-Hant
    text: "「雖然無視命令老是在睡，但這點很可愛！」\n「雖然慢吞吞魔法也很差，但這點很可愛喵」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c5a42bee7c9d10af0794c3203ca75f0d31af32264dc570373d25cfebce4a882c
    lang: zh-Hant
    text: "在本神殿排隊的各位，都已盡享天命。\n……真是性急的人。你的順序，還在很後面喔。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c5e409e5367983c02fd3ce0606943005e19d2601c76fbc13d9fc1a355d1e51bf
    lang: zh-Hant
    text: "真是好棒的御膳……哎呀，昆布卷……來，歡「昆」喜喜♪\n咳咳，你知道嗎？昆布卷對學業也有好兆頭喔♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c5fe79cef9b15e5b75b5ed830d82358f58d77a2fe9ad132f4f89380396430177
    lang: zh-Hant
    text: "動不動就一副唯我獨尊的樣子。你以為你是誰啊，怪物。\n不管你圖謀什麼不軌，我的銀釘都會把你釘住。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c63cc5af7e00f6c0e05f523478a2139cc12a4a801fcf5bf368a175b926158988
    lang: zh-Hant
    text: "對不可饒恕之人，降下迅疾的懲罰。\n離弦之箭化作光芒，貫穿惡者的胸膛。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c6848999f87df22d19d0dcebdfc4a5e0a2afda4d10dd6b6005eb80fa56aa7c75
    lang: zh-Hant
    text: "讓身體發燙的祭典魔法，大家也一起來品嘗吧♪\n會成為永遠忘不了的時光喔……嗚呼♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c6ecd3c920fb0870b320dbc40ea2983651be9550d857e6d46aaf79423b64e611
    lang: zh-Hant
    text: "「不准殺人。不准搶平民。這就是這艘船的規矩」\n大家都說。爸爸是正義的海盜！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c73cc8d6c7cc4293f28895074c24e9be0f3ed8656e5fe1cdd3dcc770eaedb7bf
    lang: zh-Hant
    text: "如何，這份力量！余也還寶刀未老呢！\n汝也別輸，好好幹活吧？賞賜會準備得滿滿的！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c73f62d22c4cbb25a977fec98855c2403acbe29c73c9709eb21fe938ef26fc7f
    lang: zh-Hant
    text: "——其為《魔術師》，所示為《創造》。\n由意念生出想像，由想像生出構築。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c7c6f2a7f857d1896a4da12dce35bb550bc596d18ed6393f5f6d4fbde28ea8d8
    lang: zh-Hant
    text: "以為綠傘會一帆風順的那些人，才更該慌了手腳吧。\n畢竟是懂江湖道義的瑪伽綺耶，把顧問給割了。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c7fe554a65ece1018ff09218142e0c291aedfd2b6a8da78a7115217977ced7aa
    lang: zh-Hant
    text: "喂！那邊那位，你累癱了不是嗎！\n真沒出息！請給我振作一點！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c8169b95ce74b265490f4883a0a75d0497d9b8bd4442882d80835ba267830c58
    lang: zh-Hant
    text: "據說棲息於森林深處的，白狼。\n背負森林之民的願望，向危害自然之人露出獠牙。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c82754036f3c37bf200aee093089e5be43984913eac39a371dc909dcacb0a7a0
    lang: zh-Hant
    text: "沒問題！因為我們是，一個團體！\n三個人的話，就能跨越！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c85f5311869947197597c44325c72cba9ccf955c027365b99df568f4c1064156
    lang: zh-Hant
    text: "跟世上隨處可見的『邪惡』可不一樣，等級不同。\n讓邪惡進一步『墮落』，才終於能稱為『惡魔』。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c896b491c40a23cf4d67eb2dba9fa0eaabd73c9ec1c4f62c3cb50492e4889e06
    lang: zh-Hant
    text: "「人會迷惘。正因迷惘，而軟弱、虛幻、不可靠。\n為了不讓那微弱的光被抹消，就由我賜予路標」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c89940ad1a44759013e84637c675d47e4934c758d1096196249feb0f94561720
    lang: zh-Hant
    text: "請讓我向大哥哥發誓。為了能正確使用這份力量、\n為了能堂堂正正地向前看，我會變強……！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c8bfd6337b5f64be484fcb4137f67ceb37e37dd5d56488c5b8b2cec7573eab58
    lang: zh-Hant
    text: "太陽屬於樹木，我們只在樹蔭下撿拾落果——\n這就是我所依靠的大樹，綠傘會的仁義。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c8c57aa084ac85405cc3bca19914f9b4652eae4c40224e52c9c9eb18d7df7ad6
    lang: zh-Hant
    text: "謝謝你們等我、相信我，真的很謝謝。\n所以不管幾次我都要說。——我回來了！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c8cce3bedac10a1328d3dccc468ebe6aa05cad7c9ed589a6e7555d2fa8035e78
    lang: zh-Hant
    text: "練到身體記住為止才叫練習，對吧？\n舞鞋響亮的聲音也挺風雅的……開玩笑的。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c8cee68d25cbfe75548f316a2b95f2e449a9cb7c11ce90063a231116a952aec7
    lang: zh-Hant
    text: "上次來的時候還是農村，現在已經變成氣派的城鎮了。\n下次來的時候會變成怎樣呢……會不會已經消失了？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c8ed06ac8cd87012d1e6a7447e9058a2cb87657c0995226b147585163b885919
    lang: zh-Hant
    text: "割下它的，是唾棄歷史、違背仁義的弒親者。\n是被權威沖昏頭的凶行——部下和老百姓都這麼私下議論，據說。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c9007b3a2279336fed59675b3b982ab3314f4350977492cbb9ce82898225eaed
    lang: zh-Hant
    text: "淚雨盈滿夢境。\n——悲嘆的聖騎士‧維爾伯特"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c92f0796a05d751fe421a936cae2e0994cba6417623aa6be7bb7b5485c040df0
    lang: zh-Hant
    text: "「雙打的真髓是比翼！你要封閉內心到什麼時候！」\n——德蘭茲國際學校的熱血教師"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c95e9df20f1fd334c4cde99dbd1fdfbf0eb46ad7bc0a5a9e41ae6f04fbbf7d9c
    lang: zh-Hant
    text: "「光靠我，守不住。所以……」\n「我來補上。你缺少什麼，我很清楚」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c998680cc5d427245d75410cd389677934e8bff449b1cb09a0704dd85169d2ec
    lang: zh-Hant
    text: "呼嘻嘻嘻……夜晚的遊行不管是怎樣的邊緣人都可以參加！\n搭上這股潮流，發出自己喜歡的聲音吧！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:c99a6ecbe7603407285a0ca6a43d630858ec3f9a11d6fa428a8cf51624daf362
    lang: zh-Hant
    text: 為刻下【佰】的生命送終。……我、我會把你碎屍萬段喔。
    origin: machine
    low_confidence: false
  - source_hash: sha256:c9a7d31f7641a9602d0d8326ca7f28560c8a8523cfe478614bed6efa69d27682
    lang: zh-Hant
    text: "信件帶來翅膀，是在讀完、回想起來的時候。\n可以的話，到時候也想起那個帥氣的送信員吧！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ca057e89218f1b26318e3d62987b40321b070499396982f086ed96e1da07bc9c
    lang: zh-Hant
    text: "「該相信的只有一個。不是安息，唯有希彌佳大人」\n信徒們以河川的激流，洗淨了自己染上異教的身軀。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ca08dafcda81fc223a3c4282de552d17c04e04cc0b1788f757b79e26ab90bf77
    lang: zh-Hant
    text: "馬納歷亞魔法學院與露娜爾魔術教會的，聯誼派對。\n有可疑的魔力團塊飛過來，也算是餘興節目。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ca0c456c59362213137721cc5022939ea04966c1a300d9cb0572b42ce03332d3
    lang: zh-Hant
    text: "哈……哈……出汗、體溫上升，確認。\n但是，負荷不足。再來1SET……嘿、嘿、喔——。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ca2b0672f4553172db37e4ba069314edbee3c2ebbf6eea5e835186870303d95d
    lang: zh-Hant
    text: "殺了就能削弱戰力。從平民身上搶，損失就能壓到最低。\n老爸才是掠奪者。因為他束縛著我，奪走了我的自由。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ca44edbd147f5ee5f0bde38006747137dd7d199896b589c5505e2de2f1f52231
    lang: zh-Hant
    text: "若說創造了罪孽深重之人的是神，\n那麼神不也應該受到制裁嗎。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:cab8b0a2d8e75c809658ad7af0ca127602ed6c300542c2fd653eccef519359d3
    lang: zh-Hant
    text: "野外求生的虎之卷——要藏殺氣，就藏在森林裡。\n發現的獵物絕不放過，連夾著尾巴逃跑的空隙都不給。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:caca8f17832f24a9b5b20f109ce73dc70b7d7075c8415766ee1b5930999dec68
    lang: zh-Hant
    text: "不管逃到哪都鎖定！我的雙手可不好惹！\n必殺！雙重火箭拳——！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:caf18ecbec2f3ada35c8b1c61a83eecd2628c6a7fec9ee18af79a61f8addc99e
    lang: zh-Hant
    text: "「找到了……像那些孩子一樣，耀眼的寶物。\n雖然我從沒送過禮物，你願意收下嗎？」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:cbb6a4f9b01c31c379818e254f87509f092c8f2135a93f47804d92b4d41b092f
    lang: zh-Hant
    text: "其為司掌必滅之風的忠義同胞，\n知曉火焰誓約之人啊，向汝致上永劫的感謝……。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:cbcb3c07962c2a726b597fb09c55890223e72fadc40b08422c062fbaaa59dd2f
    lang: zh-Hant
    text: "有想點的歌的話，什麼都可以說說看。\n平常我總是說看著我……但今天希望你聽我唱。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:cbf6a8b3fbe78a9d00888e2ef8481dcb30b47176427f3b0a4e8757905886debe
    lang: zh-Hant
    text: "零事故的應用知識。診察機構也需要精密。\n要防止事故，診察「診察機構的機構」的機構也不可或缺。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:cbf716be260febbe105dab4ede2b8157b05f9a3df36661c9844a298c6596888b
    lang: zh-Hant
    text: "代代相傳的血脈、繪畫、地毯、玻璃工藝，所有一切！\n我一死全都會化為塵土。這種事，我怎麼可能接受！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:cc1d7e8040675b2abd70ed4282733d2861225c0b12ac8452a27f00bd58f0d561
    lang: zh-Hant
    text: "那東西光是吸一口氣，人們就尖叫著逃跑。\n因為他們知道那不是普通的呼吸。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:cc33cd569a9e47cc77046eade0fde245f02e5a69c69a4185942a25d687994b42
    lang: zh-Hant
    text: "拚了啦……爬給你看啦……懸崖……！\n就算是小小的一步……對Sugar明來說也是一大步……！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:cc3c21a845945d25a1126877058e1e79579cf1db664215aade2d8216e50836ab
    lang: zh-Hant
    text: "榮光、榮譽、榮華。天使對有光之人溫柔地微笑。\n「如果你以高處為目標……就把特別的力量給你！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:cc57c906451552361fbcd5eedebfbb1e267f6e8bb35cb675f4a72e4772843ceb
    lang: zh-Hant
    text: "住在某座神殿的信徒，大多已經死絕。\n『雖然身體很脆弱。但如果是希彌佳，就能把安息託付給妳』"
    origin: machine
    low_confidence: false
  - source_hash: sha256:cc75e0474ddb303a91d86ed8979f4f9c4e5dd3e3c4e04526dc5fb6b6535bb596
    lang: zh-Hant
    text: "聽說老爸早逝了。大哥一接手，整座城就搖搖晃晃。\n沒辦法。我潛入地下社會。從反面來統御、支撐它吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:cccbfc5b1fee377ec81c08065960a75a172ff786e820350c2a8e7f0c706b7b1e
    lang: zh-Hant
    text: "閃閃發光又快速的東西。戰場的雷電，對那孩子來說是玩具。\n——雷光射手"
    origin: machine
    low_confidence: false
  - source_hash: sha256:cd212b9508744e04301d4264020b7f4951bcb6f0ffef7f812210f050a738cc46
    lang: zh-Hant
    text: "水晶劍。是我現在的搭檔。我用它開拓了未來。\n沒錯，重要的不是看見。而是行動！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:cd8235895951f21d00041b6cf01f5f274bcada050282f2de7264094fbf023126
    lang: zh-Hant
    text: "站在新世界的，無名戰士。\n為了發揮自己的真正價值，此刻再度執劍。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:cdaefd6f6e92d962041d287dc73bda167dba1937cd0bb7e8c5164f6b5ba93a8c
    lang: zh-Hant
    text: "總是容易被誤解的，疾病之神。\n但在夏日閃耀的美貌，沒有任何人能懷疑。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:cdd90e7cc5b013f979c4440503659c8c85b4f136783b951ae8a40b7324e22e44
    lang: zh-Hant
    text: "要找的是迷途森林的地圖？還是妖精的薄烤餅乾？\n請務必讓我幫忙找到您的幸福♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ce639d15f12c7bb33037045f14e39688a8219a961968a28335ae0326ad6bad91
    lang: zh-Hant
    text: "地位就算升了，在她面前還是抬不起頭。她永遠是我的前輩。\n我要自豪地說。這座館，是我心愛的幽靈宅邸。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ce81eb376298fc260ce5948191e11801008c99b50c1701dc70210598e0b3aab7
    lang: zh-Hant
    text: "那傢伙有缺陷。力量也弱。所以想很多。\n說是能覺得活著也沒關係……只要和我在一起。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ce89fbc1cb2b63ea1eee1471d112d599738f79b92e59fc64857bd58d120a4e3f
    lang: zh-Hant
    text: "對龍來說，那只是單純的威嚇。\n但對人來說，卻是堪比砲彈爆炸的衝擊。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ceaaa4ef5e6e6dfbdc3f1b3986361fc8f9c262e7922acbb00178024d0a71ddde
    lang: zh-Hant
    text: "在你滿足之前，就在我身邊享受新年假期吧☆\n其他的事都不要想……一～直……到永遠……♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ceee1bce7578b95babf947198bce12d29b27dfcf82ff741f7d5df75b84cd258c
    lang: zh-Hant
    text: "明明很弱卻很努力的傢伙，沒有才能也不放棄的傢伙。\n——小鳥遊翼"
    origin: machine
    low_confidence: false
  - source_hash: sha256:cf0d147909295a17327171512a7f48d271c80ae4cb81b71121680581ea17fbac
    lang: zh-Hant
    text: "——其為《教皇》，所示為《慈悲》。\n內心之門的鑰匙，無非就是體貼。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:cf1e6e605e57291b244c10b33a2a09a1c99134a1584513caf8e930c6930cbcd3
    lang: zh-Hant
    text: "可可蘿配戴的花飾。\n寄宿著偉大存在的加護，花朵溫柔的香氣賜予戰鬥的勇氣。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:cf8eefdd65d98035c7c0cc98846df1a8d9d11eab923951bfe79a959bda171558
    lang: zh-Hant
    text: "核所造成的變質，其影響催生了新的發現。\n這具屍骸，為了滿足自己的欲望而拿起了機械。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:cf93ce9a83b1237ab3540a0f8ca762847a01958434808960cf90bfcf76f61304
    lang: zh-Hant
    text: "正如死亡會造訪每個人，不死也同樣會造訪每個人。\n曝露吧，那副白骨。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:cfa5f3430e703c4678c5e328ee61df2dab8718829140e000c10bbe53877c23fa
    lang: zh-Hant
    text: "懷著往日的約定，魔導之華與友人一同綻放。\n「要是敢傷害古蕾婭，我絕不原諒！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:cfb3ff40a24d3e6d6016f458049afad3725dbd1394c00bc0e010ed25995f2cc3
    lang: zh-Hant
    text: "只要多少有點本事的人，就不必害怕。\n話雖如此，對有武裝的傢伙還是要小心。"
    origin: machine
    low_confidence: false
