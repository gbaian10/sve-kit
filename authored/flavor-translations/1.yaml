kind: flavor_translation_shard
entries:
  - source_hash: sha256:10b82c031a6f3c7cf89fcd47813c25fab553719bb63a58065845a64c6485641f
    lang: zh-Hant
    text: "呵呵……那麼，我再唱一次。\n沒錯，這裡是……只屬於我們的夏日演唱會會場♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:10bb4609fac567acd832d5e72066e1ba2bc0089116e94332929d665af9cb2538
    lang: zh-Hant
    text: "以比什麼都美麗、比什麼都高傲的光輝，\n為你的世界增添色彩。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:10bf86a5935b3064300551940cbdeb79c354bac670d466709b6cacae5ebed81d
    lang: zh-Hant
    text: "野丫頭畢業了！用特製手杖做慈善事業啦——！\n哎呀是惡徒？可以唷！就揍到你懂啦——！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:10c92aaea209fdb40fda77024a7da759a897f68f243cc1fddeb1a52f2e81d245
    lang: zh-Hant
    text: "原本，受大地恩惠的森林之民並不需要魔力。\n他們只對玷汙大地之人動用那股力量。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:10d1e3353d1cde523a06e55ef2c2ae6ac9d767932547d4fae53eeb0aec7a0115
    lang: zh-Hant
    text: "來自我介紹吧。我是耶薾。學生會長。\n是很可怕的東西喔。說不定是敵人。因為是龍。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:112afd6ff06a6e2e84d542588ab42526ee92cfc17e6ddd76a30ab9da8da66d29
    lang: zh-Hant
    text: "水晶球。是我以前的搭檔。占卜師我已經不當了。\n因為就算能看穿未來，悲傷的未來依然悲傷……。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:113cbfa8a103939990b38a6218d70bce12578ebe0ed91d5c6f0a0dadc81a106c
    lang: zh-Hant
    text: "我是以聖魔術教育實習生身分前來的帕絲卡爾。\n……我沒有在生氣喔。我，那個，表情比較僵硬……。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:116b28bfc3d96ef1aa7043cd79750e55cec59113518672066fe2be3cac68be9c
    lang: zh-Hant
    text: "『來，一起上學嘛，學長！』開玩笑的啦！\n大家又要被清純系學妹小颯迷倒了吧——！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:118924dbbbe5d64b9e9a026d7c5317ee20f5cb49bc33f5f2eef77f204108a1f3
    lang: zh-Hant
    text: "神的話語催生使命。\n知龍的話語催生力量。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:11a4e4939a8ba6ad0c68b0b9b115e7680f1878efd87165a4ac89dc3447b9d845
    lang: zh-Hant
    text: "大多數昆蟲不過是被捕食者，位於森林食物鏈的最底層。\n但其中一部分，會扯斷那條鏈。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:11c23f333c342d631ddc648c902afcac81642d9e53fc7aa7db796664b6f4b7d9
    lang: zh-Hant
    text: "妾身正是統御黑夜之人……。\n汝也來崇拜妾身、俯首跪拜吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:11c7d98fd7e30d88352598a13d2cf6b9063b550e3c8ef505c583e8c5c68ed211
    lang: zh-Hant
    text: "那廣闊的攻擊距離，有如撲向獵物的雙腿！\n——讚頌戰士的族群"
    origin: machine
    low_confidence: false
  - source_hash: sha256:11e50152283ad35157bf43492cbaa7249710ca31b3c6bfdffdbe217e6386069c
    lang: zh-Hant
    text: "是什麼樣的性格，什麼樣的能力。以及——什麼樣的信仰。\n只要正確理解，自然就能看見該引導的方向。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:11e920568aba681250629dd5666f651874f6b8c61ed40647c040943c371e71f2
    lang: zh-Hant
    text: "「好痛啊」「求求你放過這孩子」「瘋了」「這不是人」\n為什麼？為家人盡心盡力是很有人性的事。對吧？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:11ff642a7270b0ab268b4a8804737d37c03d698bf7e7cf937f1ead9db80d749c
    lang: zh-Hant
    text: "妖精劍，尚無止境！\n——迴天劍‧阿瑪茲"
    origin: machine
    low_confidence: false
  - source_hash: sha256:120c10e8c3786c146b9a961b52e4f7f67191ad288d0ef06ef7cdf8b923cc99db
    lang: zh-Hant
    text: "「來堂堂正正地，一決勝負！」\n所求是此劍的盡頭，所望是此劍的食糧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:122d27b017af2efe21ebf2ac10768d507f5655904356015f97811339a0edd1f2
    lang: zh-Hant
    text: "「我也來幫忙！一起加油吧，莉夏！」\n「是啊！我們要成長，讓莫妮卡提督嚇一跳，奈諾！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:1233b758c101ae05e6f7be6da53784e339e4ff8893dabb63a9cdc013127b9ffb
    lang: zh-Hant
    text: "以同等的視角相望，瞪視這雙眼的並非野獸。\n——啊哈！就繼續世界的試煉吧！"
    origin: machine
    low_confidence: true
  - source_hash: sha256:126c2571da0598598b3084866dec3fd13d7d8ce3a7133b70e95371d700fa0b2a
    lang: zh-Hant
    text: "大同，睿智……。\n——多頭的實驗體"
    origin: machine
    low_confidence: false
  - source_hash: sha256:12883b32c961f368aaec6e3391ee6ccce44350468d0bfdad9a3b32b5b31ee235
    lang: zh-Hant
    text: "摩訶一千萬高校。被移植了龍的爪、翼，那一部分的人們。\n她們的目的只有一個。奪回失去的青春。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:128ad5670e40c9edba6ea7d63530be5a636c366594c77c101cc4a62b7241726f
    lang: zh-Hant
    text: 為了守護人民的微笑，年輕的王率領騎士而戰。
    origin: machine
    low_confidence: false
  - source_hash: sha256:129ac6aa245984d578e213536a7b6831f574bd73eba878c192d821893b21e644
    lang: zh-Hant
    text: "「嗨，公主殿下！來實現那一天的約定吧！」\n「好的！我一直期盼著這一天呢！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:12fd8c55cfca1fb1c06b47e20ad6c52006b3f15aef3486581e24071169efc10c
    lang: zh-Hant
    text: "「能改變的只有自己。這才是安息的理念吧」\n信徒入睡，對粗鄙的話語充耳不聞。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:130cb4ac644e672476affc53a32f3f93e220bdd47bdfa4f5e8d78bd477260e7d
    lang: zh-Hant
    text: "真是的，大哥哥真的是個愛管閒事的人呢……。\n算了，姑且還是跟你道個謝吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:132ef64ed261f146d5c484915c5e57fdf0ed920c9c57078764c2e95469f458eb
    lang: zh-Hant
    text: "孤單一人是Loneliness！但靠太近也Dangerous！\n給這樣的You軟綿綿！軟綿綿的話就Peaceful！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:135f224e53a09fb8d19328db5fd4a3b1a4af9f1dedf1811b390161f697119e2c
    lang: zh-Hant
    text: "嫉妒、憎惡、殺意。\n潛藏的惡意，探出頭來。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:137cb3f88e5ae5aa7da6cc7611abeb6493190a472207053192d189eb923305b5
    lang: zh-Hant
    text: "不會死的累積稱不上人生。\n那只是經驗而已。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:137f30dc87c108884ae68e2a40a40f835b62b74e50a2e38a2550ef3e37c35183
    lang: zh-Hant
    text: "灰燼在龍姬的魔法下，化為妝點派對的夜光華。\n歡樂的交流活動，才剛剛開始。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:138147a8664985e559feef3a5bcb6caa5a3317d8d1d2dd67a93450b812a13c76
    lang: zh-Hant
    text: "——其為《死神》，所示為《轉換》。\n死亡不分任何衣裝，不放過任何生命。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:13aeb69fb29045c3de70a6a3a5b3f488f652abf84c806e0c62af01d1d9c6a3ee
    lang: zh-Hant
    text: "吸……呼……。配合呼吸真是不可思議呢。\n好像和你合而為一了，力量湧上來了！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:13bde6edfb3f24346889a68fbbcc7805c288248209c639f1125e905158dfe08e
    lang: zh-Hant
    text: "恭喜您。\n葛蕾絲檢定一級合格。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:13d9cdc2d3333ded5a14b0dd0ed1c1dd27527efed7b584459ceaa5ff67b3e118
    lang: zh-Hant
    text: "一聲咆哮，一道光輝，從泥中走向世界。\n神諭之龍現身，創造了一切，也抹消了一切。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:13e6af5f1c0710a783e2e76c07c905fe7f504b4b409321421728de2193e0dbed
    lang: zh-Hant
    text: "你被玩弄了呢。被異端迷惑了呢。\n我來把你的身心導正。祈禱吧，來，祈禱吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:13fca53a7f41d1d6136eb7d81859f7ba1e2c81405a75408995c642a3142728b5
    lang: zh-Hant
    text: "所謂相信，就是說謊。並把那個謊，化為真實。\n我——決定相信。【以神之名，透京將得救】。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:1401c0d82689906639a9ea2da265e8e390b4bbc21264030a30cc851607010028
    lang: zh-Hant
    text: "喂喂怎麼了，硬邦邦的？第一次上冰嗎？\n那真遺憾，再見啦。我會酷酷地解決你。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:1439d1d40c077fcdf603fc3b8ce941060245d7b53d1f63a9acc3bfe1ec51fe24
    lang: zh-Hant
    text: "只有我一個的話，只是小小的羽毛。\n但是和不一樣的大家一起飛，就會變成大大的翅膀！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:14413657e70d35e7cbce867d1788966e4f88869fc6750ad21c52928df2e4f9f4
    lang: zh-Hant
    text: "噓～。……呵呵。不知不覺大家好像都睡著了。\n來，你也過來這邊。我會守著你的。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:148c5f902ae64b2f11d8bdd247bb43f04e27b8bd14de3461d9351fbc03daf8e5
    lang: zh-Hant
    text: "請保持安靜。\n述說、欺騙，那皆是虛妄。在寂靜之中，一切皆正確。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:14a03a99457bf03217ca45dda0596e72296bf413ecd22eab5b0811ad1fa7b110
    lang: zh-Hant
    text: "她立刻就感覺到「這項使命會是一趟漫長的旅程」。\n然後發誓「我會帶著和出發時一樣的活力回來」。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:14d4ba8437cd971c97305044d27c7ebb5739e3a3f203fbdfa4b8108623b8850f
    lang: zh-Hant
    text: "拋鉤的地方可不只有海而已！天空也是釣場喔！\n你看，會飛的蜥蜴魚！那就是今天的獵物！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:14d6139850826f6eddafe1d772d6282f9181f8670fea6e19f166934163f50b74
    lang: zh-Hant
    text: "艱難辛苦就是要祓除掉！\n來，久違地稍微露一手給你們瞧瞧吧！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:15078c9cedab505e734e0c5d2ce6eb535b8e4fe0425283e7394af083b5ed3383
    lang: zh-Hant
    text: "我想和大隻的皮喵可拉太拍照……。\n咦，可以嗎！？那我們一起拍吧！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:1523b99e5917ce38cd6425864b883305b9304e4e0a2058a2b7109b93628b846b
    lang: zh-Hant
    text: "根本沒有所謂的極限……是與你的羈絆教會了我。\n所以我會繼續揮劍！為了斬斷所有困難！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:15450fbc05d9e4ad9d7955a5c4a19eb768790c09f3c7b848c59b96aa304c05d7
    lang: zh-Hant
    text: "成群結隊行走的妖怪行列，踩碎無數靈魂。\n悽慘啊，悽慘，不斷累積吧妖怪們，前進吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:154dd148e96a72517cc2e38794faa19da3d9deadce52b3bfc63e760d2b0eb990
    lang: zh-Hant
    text: "過去，篡奪的試煉已被跨越。\n世界新被賦予的，是空絕的試煉。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:155f5bae57ba6891e7ff77bca3f241343aba735fb951d3cf2d1fdc020a653030
    lang: zh-Hant
    text: "沒有思慮的才能比無能還不如。你是損害世間的傷口。\n現處以彈哭之刑——對廢物之渣降下誅罰。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:157fce72f5a93a94741e3f25d8e2d332f32fa229472ccb98f0590970935faf74
    lang: zh-Hant
    text: 燒焦吧處刑之刃，燃燒處決！
    origin: machine
    low_confidence: false
  - source_hash: sha256:163986b1d12e4d446215b15de6bdcf9ae668e530bcde676c5d3133c4848bb976
    lang: zh-Hant
    text: "雲霄飛車！我一直想坐坐看——。\n好好享受吧。小心別玩得太瘋，被發現是偶像。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:165aa924955cb371aa258dc3ee78dab8f17fdb9cec469f1932ec5547da9e68fc
    lang: zh-Hant
    text: "沒想到明明是小學生，卻要穿成幼稚園生的樣子。\n怎麼樣呢？這樣的千枝……可愛，嗎？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:167a0fb48b16630a4751faa28c031e9375768ff963953ef19ede102d80aaecff
    lang: zh-Hant
    text: "「古蕾婭，走吧！」「嗯！到天涯海角！」\n——馬納歷亞的親愛摯友‧安＆古蕾婭"
    origin: machine
    low_confidence: false
  - source_hash: sha256:16ce75d0f63befbbd67653e8b11331fdd438f09286ca345542ae134a3ee4b924
    lang: zh-Hant
    text: "刀斷了，箭也用盡。槍、火藥，連魔法都斷絕了。\n絕望的戰場上——他堅定的意志奔馳而過。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:1700dc103d00a5c50faf98ea2c20cbf813c6712bd84f95cde5e4ddf1cd250708
    lang: zh-Hant
    text: "士兵追隨王的英姿。即使死去，傳說依然不滅。\n若不畏懼那不滅的意志，就來取那顆首級吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:172f9cd756abeb8a87dc4fdd93c6da6b1c1b050e1a335029470f4a4c97b7e5d0
    lang: zh-Hant
    text: "被黑龍粉碎的肢體，人造少女自行再生。\n『真開心。阿克西雅已經是出色的破壞繼承者了』"
    origin: machine
    low_confidence: false
  - source_hash: sha256:179f0fe6405277a63d80bc39c03df43fa27b97f79d7c133d6dc50d5a49150cab
    lang: zh-Hant
    text: "世界是富得流油的盜賊、不合理的富豪。奪到一粒塵埃都不剩。\n——『篡奪之賊』，使徒之言"
    origin: machine
    low_confidence: false
  - source_hash: sha256:17b33c2d251f872d659dbae88de81ffa31f99705ec3f8dad6065ca375cb60c7f
    lang: zh-Hant
    text: 可惜。要讓我暴跌——你那點暴力太廉價了。
    origin: machine
    low_confidence: false
  - source_hash: sha256:17c8dd67e2560c665ed78a8119df399a5898ad5fa5debcdc02ed696de1829148
    lang: zh-Hant
    text: "抱住小喵特的話，毛茸茸的很舒服。\n在你身邊……也很舒服。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:17e470fdc62cd09cc9ac10b34c7f0c74f473700da4ed25fad45938ab215cb428
    lang: zh-Hant
    text: "如果是天上落下的雷，用某個高的東西就能擋過吧。\n如果是魔女落下的雷，把頭壓低或許就能擋過吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:17f5cc398fcdf38ff6f3dc27cee72000b80c1cd92d0f2335d1ae68b698b95769
    lang: zh-Hant
    text: "艾亞隆將會毀滅。但是，因為人與機械攜手——\n才得以存活到，自然的世界伸來那隻手的那一天。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:17f8a377f26c7dc0dd401869e73f030176ae93fb6ad065753690507b56421eba
    lang: zh-Hant
    text: "自由才是最大的寶藏。蹂躪善意。在良知上開個洞。\n踢散正義的波濤，跟我一起墮落吧？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:17faa0a3f41360b3954a469080c1b5d692c1a156d24080b9ee0e64c4353a88c9
    lang: zh-Hant
    text: "選奧德珠寶直營店當搶劫對象，你這傢伙真聰明呢。\n同樣是人生終結，臨終前能看到美麗的東西總是比較好。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:187412ec8248d549090f6d5bbdf46b4969f16958e192b86fb2fc9cdd5d447d02
    lang: zh-Hant
    text: "「說想要閃閃發亮的東西，有人這麼對我說。\n我的同伴回答說好啊。那傢伙已經不在這世上了」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:189ce28788fea56a06489312d391ba936a24f739bd4ca1ba1b72a5d5111c0676
