kind: flavor_translation_shard
entries:
  - source_hash: sha256:802771015df6281fc924851678fc6dedb9d4d6297f7a27b6a508a149167df516
    lang: zh-Hant
    text: "明明決定好……被祝福的話，就要盡情地大鬧一場的。\n嗚……眼淚流出來了，說不出話來……。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:808b7b231b8d387d77b5c3c12c3aed0357746dc5d637e95459acf2c5a4d2a819
    lang: zh-Hant
    text: "為戰鬥到疲憊的戰士們，賜予愛的治癒吧。\n只要委身於這道光……勇氣之火將再度點燃。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:80964122feec7635cde832c58caf2ff9df7dbff11dcfb1700deba2789cb21811
    lang: zh-Hant
    text: "流著神之血與人之血的身軀裡，\n寄宿著既求神之地、也求人之地的野心。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:80bf3fa3baf63f74a58acec25d09da1740c0e0244906d7832c172a6cd8e400c0
    lang: zh-Hant
    text: "就那麼想要天下嗎？老子不管，隨你們便。\n這裡是漆黑的蓋子底下。這樣的天空，什麼都看不見。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:80d580eb7d39a2d5f6ef479913baf5c92b330d2d6675a7e6bfb3349a96c07bec
    lang: zh-Hant
    text: "「言語死去」「憎惡滿溢」\n——絕叫與愛絕的顯現‧魯魯納伊＆瓦娜蕾格"
    origin: machine
    low_confidence: false
  - source_hash: sha256:80db257a36946485a911780ecc6af1869ce0154c5fd9fe0d12167aeb648fda30
    lang: zh-Hant
    text: "我們的努力，神明一定都看在眼裡。\n……所以，今後也要多多鍛鍊喔！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:810f850a75ce09188a8f59bbf8d953e4fdb91895de74e3de3454b13f486e2f50
    lang: zh-Hant
    text: "在少有無法實現之事的世間，無償的愛才是奇蹟。\n是故——相信神的人留了下來。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:811694b45d15ba5130326b941649b84c6d0c9703fc997315a0a3bbbc10faea91
    lang: zh-Hant
    text: "借助大地之母的力量，少女擊碎敵人。\n「鋼之元素啊！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:816563fce7dc27dd1237da9ed8bb822aab51bd962df34646f45e82c8d2c4e4dd
    lang: zh-Hant
    text: "因為你教會了我，挑戰未知的事物是很快樂的。\n這種曲子的學習，我也會加油。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:816e81b3751a768055a2aa4c0dd3393c6fdf3ba86c052b4c2dca397786c996f4
    lang: zh-Hant
    text: "打從心底祈願吧，黑暗即一切，黑暗即力量。\n膽小會被吞噬，驕傲則會沉溺。能得到黑暗的唯有尊崇黑暗之人。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:819f9acf24d4dede79ef427f66ef370407549b8cb1272fb1cdb5ddd7b6c28a0d
    lang: zh-Hant
    text: "當你迷惘的時候，也請讓我助你一臂之力。\n我會為你占卜前進的道路，成為暗夜中的燈火。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:81a109a39e3b87e48b43f70e0310f2174010212349383cc58553d9b409e1861a
    lang: zh-Hant
    text: "季節就是今天的祕密調味！\n——靈鼠族妙廚"
    origin: machine
    low_confidence: false
  - source_hash: sha256:81ec056e9b1fd387e7537f062df1f2eb3176bf009866bc1e6dd7d15e9579fc29
    lang: zh-Hant
    text: "壓到亮晶晶！打掃要強硬且一擊解決！\n要是還給窮鼠咬貓的空隙，就還只是新人！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:823646f2b996f93ba6401fb4e351db9a9f5fd0112e045de8c36df45f92331135
    lang: zh-Hant
    text: "待征服世界之時，就把其中一半分給汝。\n知、知道這是什麼意思吧？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:824320d5ae94e8434781b7eb559460d3a460df510ade1c49ac7fe7f4145a5e47
    lang: zh-Hant
    text: "拚命的側臉。因為我知道我們是同樣的心情。所以，我也——\n「這場比賽……請讓我贏下來！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:825ee7ab2001e4ff216a986934dbc1f3d0f7d36a8e3846198230080480d29d1c
    lang: zh-Hant
    text: "那般接近死亡的存在，為何還能折返。\n很簡單。我在現世有一盞發著光、告訴我歸處的燈火……姊姊。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:8264892c32940dae1ebdffe2e134b71cc2ce609c19dc803573eb68e8001fe8c8
    lang: zh-Hant
    text: "魔法躍動，雪花飛舞，拚命地款待來訪的客人。\n「莉莉會用魔法，好好款待大家喔！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:82813e5b35fc494be3425905dde390135a21d789dcc678f65041bdd8223bcfdf
    lang: zh-Hant
    text: "你說不跟乳臭未乾的小子打交道？……是可以啦，沒差。\n到時候後悔沒趁早下手，我可不管。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:8288544eb8ef89eedcfcfd21b3d0d0a516453afbdae6ec230553f8ff4b737793
    lang: zh-Hant
    text: "我當首領，那傢伙當左右手。期望的未來被上一代的話粉碎了。\n……說組織內有個派系，希望由那傢伙當下一任首領。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:829cadb94c57a322ec3effa4755fade7bee7213926b91e1460c26553c8ce6ee1
    lang: zh-Hant
    text: "是啊，智慧確實不如人。神忘了放進心。\n離譜的失敗作。但力量別說是人，連龍都贏得過。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:82a23fd4f1029bfb5e28979342c2db30a5edd1401e2a5331164eb5ec2fcc078f
    lang: zh-Hant
    text: "世界新蒙受的，是蒼藍石板。其右半。\n賊人高舉新的作風，重返都城，行空絕之事。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:82a87fbf03622299e883114d91b3578433094b84ca8deca1c5d9a49e854eff4c
    lang: zh-Hant
    text: "絕不可殺生。善惡不過是暴威。\n一切之物、所有之物，讓其生、讓其活、讓其行。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:82eef7b4ef78d08785250c64ad30821072310247c5b680377c8ebabd218d7827
    lang: zh-Hant
    text: "不管笑臉、哭臉，還是生氣的臉都可愛到極點的我♪\n欸，你最喜歡哪一個我呢？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:8308bc62ec28debc7aeb7ad46be9ecaec65cd12dbc680dacfb8275b9adc32f19
    lang: zh-Hant
    text: "你說受夠了新進隊員，每天都在生氣？\n那就來根冰柱白蘿蔔！給我好好冷卻腦袋！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:830e748b2c7fe31942377dcdb3ce342cfe146665db280b440f59783ef0284d8c
    lang: zh-Hant
    text: "成田大進。以上。……別管我。\n我只是想讓那些瞧不起我的傢伙明白而已。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:83323d880ed10ec760009c0e1f15bb270658485f681dcc8adbba3dc2354a2d72
    lang: zh-Hant
    text: "那是青年的、少女的、老人的、貓狗的、蟲子的，\n以及你的，最終下場。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:8356a56a76273f318148f73dbda8db13ce7a3402affeeeb1c31f060d4b35417a
    lang: zh-Hant
    text: "少年遭魔物襲擊而墜落，再也無法騎龍。\n天空之旅的夢想遠去，卻遇見了懷抱同樣心願的少女。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:83813569225ee079935ceed834f2d77b64cadaea58cfe44911d9d23579d1ec73
    lang: zh-Hant
    text: "「為了拯救迷途之人，現在我揮舞著這把白刃」\n擁有眾多職業經歷的候鳥。男人被下一個命運引誘。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:8385075f825343e21a792b29577e91f3d7d62a1e62512217eda540bdc9838628
    lang: zh-Hant
    text: "擁有胡狼面孔的，保護與恩惠的半獸神。\n以超乎常人的敏捷，沒有任何人見過那張臉。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:8408475c5fa752b8664af1a2b6c9c58e3ca179c83b40ad04bd1e47beb0e7bc71
    lang: zh-Hant
    text: "因罪孽深重的任務而汙穢的我，沒有資格接近任何人——\n——呀！？那個，距離有點太近了……！？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:84559227e1a0f18b1d6e3eafe4a1c83235b4f2df529cdd5417ec387b2e38de59
    lang: zh-Hant
    text: "表即是裡，裡即是表。無垢與邪惡是二律背反。\n「拜託，拉米……不要再擅自傷害別人了」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:8473c166cbf0ebbba04983a02f95fb828bb6a4ffb0995c780cfd3f11d0118fe9
    lang: zh-Hant
    text: 哼，想抓住我的話，就帶個好女人來吧。
    origin: machine
    low_confidence: false
  - source_hash: sha256:849d1286eaa07665eec8078a48863902af2e0680bbea8208712af2c245f0b92e
    lang: zh-Hant
    text: "寶殿最深處，沉睡著化為黃金的公主。\n在有資格之人來訪之日，公主將再次醒來。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:84d98bef2960e2ef604bc65fae88a0cce5c9e1955c42f82784642973af085b61
    lang: zh-Hant
    text: "沒有意志的使者是無慈悲的利牙。\n純粹地、純樸地，吞噬上天之敵。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:84f317a32af5f7c2bbd231892e095570292d819e2f2583b08d23298ffb6f73e5
    lang: zh-Hant
    text: "森林的鼯鼠乘的，只是風。\n戰場的鼯鼠乘的，是通往勝利的順風。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:84f9a0e510c2b2c624a2e46741e1f17640ab58fc25ddebab91dd77ac050a0809
    lang: zh-Hant
    text: "聽說偵探森羅，意識已經和NET合為一體了。\n在不斷膨脹的情報之海裡，她正溺水著。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:8517ae6eecb2faa0c45dc1b4597cca6851da50ca5491869cfc8fde137d7e1e0c
    lang: zh-Hant
    text: "生命即輪迴，反覆不斷的循環。\n森林孕育的生命，終將變成孕育森林的存在。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:8543c5125469e172483201d8144dfc3fb6daa495b9a20da766f1e3fffe847f31
    lang: zh-Hant
    text: "被囚禁的公主，必須被拯救。\n請務必給我們一個快樂結局……出色的騎士大人。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:85726002886adc0ea6938e15282f7edb6411f72ce6bcafc55c54c431604f52b8
    lang: zh-Hant
    text: "啊，買東西……難道是，為了我？\n嘿嘿……P君果然很溫柔呢……。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:85c316b9db76ccfa8ee088624181493f8bb20d66a2b928d88d5800ed3e55bad9
    lang: zh-Hant
    text: "如果是和那位像砂糖點心般可愛的孩子一起，\n總有一天，一定能使出熾熱的愛之技呢。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:85dea067f948729e4e50f417321cf7d3001c165369e35d18d688c5409b43fb81
    lang: zh-Hant
    text: "唱歌歡笑吧！在某處與某人相遇時就開心地乾杯！\n這就是所謂人生的醍醐味吧？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:86413df9d4dcc36f236cdcd7af0d7ea662a8468a5c0239874da90af909897456
    lang: zh-Hant
    text: "以疾風之速揭穿事件，逮捕犯人有如雷擊！\n就交給名偵探‧香澄吧！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:866cf340fe2e76c5c9581c47958ad65e55ad70749b09692879f3e7ffb671047b
    lang: zh-Hant
    text: "支撐著她這片花瓣的莖，是鋼鐵般的忠誠心。\n「這就叫百花繚亂！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:8683fa2452de69fcd19bea3e5e4dcb03087643ee4a54a7cff49365dd824e701d
    lang: zh-Hant
    text: "不會飛的鳥，夢想著在天空悠游的日子而凝煉魔力。\n即使背上沒有翅膀，手中卻有智慧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:868e7e1562da8ea6377256c7f71f3da6ac21e65f684f9a552bde933675e3e728
    lang: zh-Hant
    text: "尊崇深眠，並如此祈願。不闔眼、亦拒絕安寧之人。\n世界充滿了愚者。愚者就該去愚者長眠之處。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:86f6f6e4289ba1ae9ce171df90d7ed1508190371ec648dab187ae9bee0071e92
    lang: zh-Hant
    text: "因為是隨時都自由自在的看門犬，夏天格外刺激。\n「啊哈♪還完全沒玩夠喔——♪」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:877d74239d230e8b515b60ba3a24419a780c3dd0b1e433449ee19c678d0486d5
    lang: zh-Hant
    text: "國已亡，宮殿已塌，人民全數死絕。\n然而……身為王的我與家臣，依然健在。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:878357145342ef3845e581f0cc6ebf0d9d3312ec33bdf3f4c5d064b49955cf2d
    lang: zh-Hant
    text: "她之所以屈膝，並非因為向暴徒屈服。\n「我是守護主命之人！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:878dcca19af98cc74282815d89fcf9f12addd464689a8fe59fbbd909050e7bb5
    lang: zh-Hant
    text: "一刺是口紅之吻。滿足了嗎？\n……還不夠嗎。那就，變得更紅吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:879c3d21f12faba06ae5472956e19f68729de2d324f7f5031b67ab5c1002a28b
    lang: zh-Hant
    text: "與你心靈的連繫，將化為呼喚新風的力量！\n為了開拓該走的道路……這就是我覺悟的姿態！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:87b525939ee0bf5f3590545b6ede3a86f120dcec399b2b24fe1eb4b73488084e
    lang: zh-Hant
    text: "我是東瀛佐敦。夢想之類嚴肅的話題NG喔請多指教～☆\n總之先看我的指甲？很讚吧？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:87bbdb6fa0aff1c86fb7b1f1940abbbefbc067e707f8c6986c1a6e4b008fd5d9
    lang: zh-Hant
    text: "跳舞、編織，我都不擅長啦——。\n不過，只是砸扁的話可是超拿手的喔——。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:87c5c3d75a4a618ec8b1e6d0b291df48a6ddce39a981ebeafbba26f2f57c2e9e
    lang: zh-Hant
    text: "因為我會跳舞會唱歌，讓人想崇拜想相信想祈禱！\n——那就，賜予世界試煉吧！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:87cf7c853b3c379d435888f98f263bbe194636666fd967e9b0d3ea8ff79ca556
    lang: zh-Hant
    text: "要知道，戒律與訓誡，對世界而言皆不需要。\n——『Team‧破壞』，使徒之言"
    origin: machine
    low_confidence: false
  - source_hash: sha256:87d1360edfb4502d744211213308daa130f92267576c0f5c36111c762ed94685
    lang: zh-Hant
    text: "侵攻催生紛爭，魔物雖散，憎恨卻累積。\n信仰催生平穩，魔物散去，慈愛留存。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:87dc6672685bfd207e46ead8ecc711cc3be53f5534ac8e44d698a95136e729bb
    lang: zh-Hant
    text: "「右邊是哪邊！？」「左邊的相反！」\n「左邊是哪邊！？」「右邊的相反！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:880eb5b3e35ceb0eb70ddbcde5b9e24187e973cf768810e601d4c704dad99ae1
    lang: zh-Hant
    text: "緩緩地轉。循環。銀之輪是定數。\n咚咚地彈。跳動。所謂定數即是心臟。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:880f89fc26e2cef265d6b5996576c58e9c05da104238013fe5b4e99762079fd8
    lang: zh-Hant
    text: "當懷抱相同的理想，尋常的群眾便成為英勇的兵團。\n「為了祖國！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:8825ff5ec1cf3f6404c10264b4ed2f3da889faa475e06ceff29b3df2c635a73b
    lang: zh-Hant
    text: "無論多麼痛苦的道路，神說若是汝便可以。\n無論多麼險峻的道路，聖女說那便去吧，奔馳而出。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:883718b4f8078ff2c4e344bf49a7658de46881475fd9f41a31bcec930ef3bcea
    lang: zh-Hant
    text: "蘿蘿大人培育的世界……美麗的世界……。\n我們能成為在那裡生長的一棵樹喔。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:88435d168d05dce127fd68d2b54c9f79fafb7f9262b2fc5bbc1ab5d111e7c911
    lang: zh-Hant
