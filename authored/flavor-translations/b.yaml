kind: flavor_translation_shard
entries:
  - source_hash: sha256:b04929a810487d5a20f2b23df6ee00d922bb3608ee8c56c0747997427c204efe
    lang: zh-Hant
    text: 勝敗也好，攻守也罷，在戰場上輕易就會逆轉。
    origin: machine
    low_confidence: false
  - source_hash: sha256:b06cd195181732eca6c908ab62681d368ec445614cdd9a19a6c2f64526aaf245
    lang: zh-Hant
    text: "卑賤地乞求，氣質便會墮落。惡魔的榮耀由奉獻來證明。\n一切事業皆誠實且至極。對代價已經沒什麼不滿了吧？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b07da981a6771bb81a3897aa7ce31283ed25a40aeaac9970f47b9cfeca32f077
    lang: zh-Hant
    text: "所以才能用真心話交談……所以闇影詩章，才有趣！\n——天龍光翔"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b0adffc9df41747c43329d32f5ac86c4af38ee0c889361e3800f286086c82b49
    lang: zh-Hant
    text: "可恨的陽光，由黑鐵的機構阻擋。\n如今此身已得自由——來，嘲笑黎明吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b0bf077ea34847411bd485847cf73bb870e38931dd33010b02b0d33857ea7cc1
    lang: zh-Hant
    text: "「就算有一天要展翅離去，我也不會忘記牠們。\n只要看見湛藍清澈的天空，隨時都能想起」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b0c93415b68ff2dadd0d0d4d841bddb4dbb4de9fc2cd978d72b3c6798402b05f
    lang: zh-Hant
    text: "鏡中的我，和外面的我是一樣的嗎？\n如果是對欲望更誠實的我，或許更軟弱、更貪婪……也更危險。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b0f00cec7823ad94d8fb7ce5df8c4458927918e9788912d2ec8634a656346027
    lang: zh-Hant
    text: "以些微之差落敗的記憶——絕對不會再輸了。不想輸。\n「勝負從現在才開始……！這次換我贏了喔！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b10e9cfb69d365508066a7b601c176f50915fe6ccbea47d88c569251348b8e7c
    lang: zh-Hant
    text: "「風聲也加入了……在這種洞窟裡跳薩拉邦德舞曲！」\n旅行的指揮家以指揮棒演奏，連魔物們都跳起舞來。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b11c24bc067903d88c8c76d00d39afe68d754de013c64dd0c78d27df72720617
    lang: zh-Hant
    text: "『因為是老么，就忍不住寵他呢……』\n『就算沒聽到遠吠，也會想衝出去幫忙啊……』"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b14f59b7c3dc63260aa217913968d259322b3cffce98d7696785cda275376ef6
    lang: zh-Hant
    text: "因為有你看著，我才能安心戰鬥，該怎麼說……。\n所以……那個……今、今後也要待在我身邊喔。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b1fa1a95e2329b9ebec8e53901da2b5f849aee905ad67ab340c61989507310bc
    lang: zh-Hant
    text: "恐怕沒有人比我更感謝能夠自由歌頌了吧。\n將這份滿溢的心情，注入歌聲……傳達給你們。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b21dd2ed864249063058ffb65586c07efc102a2fd10a36c1a8eddc4fa7c55ba2
    lang: zh-Hant
    text: "「不會讓你們靠近蛇神大人」\n瞇起的眼如蛇一般，黏膩的舌如蛇一般。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b25eada74018e43dd92ffb63abbee6f172495482f75a9d80914b19295c13efa6
    lang: zh-Hant
    text: "始原與終焉，皆始於海、終於海。\n若目睹水神龍再臨。那唯一的意義，就是終焉。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b2b32a99731d5d13685f7d0e85e4497dd918b1da66afaa233255a79c187807f9
    lang: zh-Hant
    text: "電視機前的大家，也和薰一起做料理吧！\n為了做出好吃的飯，薰，會加油——！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b2b7654adf6a690b0f97a8d43b5d0b5853c01a7f07bbfce93806ac62ea06095e
    lang: zh-Hant
    text: "被手刀貫穿的少女，毫不抵抗地微笑了。\n『原來是疼痛支撐著妳啊。不殺就交給庫璐璐了』"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b2cf56ad55ee351e1dfe90dcdc4b6feb9e790e70342512683a752b8ad4e60b11
    lang: zh-Hant
    text: "這把刀比聲音還快——是勝過傳聞的劍技吧？\n因為受過我一劍的人，都沒辦法多說什麼。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b2de0d5edf5c77f796a489c0af25f28ade7491c89fa69ab709a7bd9248ff1e5c
    lang: zh-Hant
    text: "——其為破壞者，展開龍翼嘲笑之人。\n身懷赤雷，四處散播倒塌與慘劇。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b2e3e99de185c21068af5cbc0cb870b598e6eb71aa220b78d28f6ccad51c4995
    lang: zh-Hant
    text: "所示為《平等》與《不正》，就是會礙到我的傢伙！\n給我行得正啊，要是不想被撕裂的話！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b2f0c790d2bb151029ac054f2d75c0d0997614d20f67b77df4e6c84d9486a4bd
    lang: zh-Hant
    text: "惡行到此為止！\n你的真面目……就讓老夫親眼看穿！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b30f3f45821041bd38df4faa1508a40eb78770b68f9630859d62101b193ff89a
    lang: zh-Hant
    text: "我的弓箭可是百發八中！\n嗯？這樣的話，不就幾乎都沒射中……？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b343797024e2a6cd2503883e6f3df734c3143eaf78fcb19b7382b7dbeca17047
    lang: zh-Hant
    text: "就算死了，你還是你。\n你怕生的地方，我很喜歡喔。會一～直，喜歡下去喔。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b36d59e56cbe67ffa978ff798b7c1730e27f69ee7ade06baaf4b2f5219465dac
    lang: zh-Hant
    text: "是被這裡的水晶引導而來的？我懂，很令人心動對吧。\n逃也逃不掉，讓人想緊緊依靠。對吧？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b39eccc250d8063294d5b5195f6a4438d1c5f4f189e33a97f1c8e34dff248f30
    lang: zh-Hant
    text: "所有世界都面臨滅亡的危機。但一切無須擔憂。\n織吧織吧，織出終極之巢！讓一切都與我混融的巢！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b3ac15d05bb5fd1761957a4ccf82bcb10f5603cccec2b07687d77e61d1244270
    lang: zh-Hant
    text: "殭屍先生，不可以吃人類喔！\n明明那麼可愛為什麼要做壞事呢！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b3d3747903405027134a4613dd4acaeb71ea1aa101077ab0f6d1fe90ab85e10c
    lang: zh-Hant
    text: "「等同作夢的妄言。世界哪有那麼容易改變」\n神經質的信徒，看著新來的信徒啐了一句。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b40ba1bdc73493ec5df0f0914acc3f73586e62065a6b8bb9edae6300cd5369ec
    lang: zh-Hant
    text: "在螯尖裝上催眠海葵的，海中舞者。\n要當心那蠢蠢的外表和歡樂的舞步。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b42b31efe2afbf9629c9aa8868763b875d70e059117a5856a2d460cb250e3f27
    lang: zh-Hant
    text: "那個煩死人的願望，到底跑哪去了啊。\n既然你是那個打算，那就只好由我來當老大了。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b47f74bd33c860fced55f2c5d30f622be9403a4e18e27f9fd2894cf2c66d08b4
    lang: zh-Hant
    text: "蹦蹦蹦，因為不想被砍頭所以到處跳。\n「哎呀不得了！都是任性的女王害你忙成這樣呢！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b484d1b65712b167b9e45833f3d1066e158871f7f3735f3d45ba67862a949c60
    lang: zh-Hant
    text: "正如人一樣，龍也有年幼的時候。\n鱗片柔軟，牙未長齊。在漫長漫長的時光懷抱中搖晃。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b48eb982bc2ce2622f9f8232f6990db8fb21d67d9057eb26efe9ed7db2c189b8
    lang: zh-Hant
    text: "這是獎賞啊，這道束縛。因太過美麗而有的禁錮。\n連滴落的淚都是美酒，嗚呼，你就永遠，保持這樣就好。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b492a455c64016562f21a07e3405bb6320fb6b8a30217ec8021ce2248bbc4e1e
    lang: zh-Hant
    text: "我是高手笹針師（的徒弟），安心澤刺刺美喔。\n交給我的話一針下去就Power Up！哇喔，安～心☆"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b4a3c492aabbe948b5cbe8bf673f9f8762e5c1c6829bedb4276bf05ffd3ebcc3
    lang: zh-Hant
    text: "這份疲憊也是……像泡沫般的我們所懷抱的、連塵埃都不如的……。\n哈、哈……但是，這份真實……所以那個，讓我休息一下……。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b4bfbf90e62e00fed3217c96f307a582b68a3cd4685d91aa0f3b6143b9b44d49
    lang: zh-Hant
    text: "——征戰之際。他總有一段在腦中默唸的話。\n別無他法。沒有退路。唯有交鋒一途——。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b4d06c47ad2672a05a617e51e06ec05ec786626713834571e3b19a96e82db25a
    lang: zh-Hant
    text: "我不想成為住在醜陋都市裡的醜陋人類。\n所以我祈禱，希望能活得美麗。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b50398aafff7fc18ad54a9146c6760774cd726e5a0991e7b46428c0f48ba13b3
    lang: zh-Hant
    text: "雖然還只是見習生，我會全力擔任您的負責人。\n請多多指教！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b51419c132554a92fa0c368a71baab3f65eac879ae732f63c609d5b9fbdf5953
    lang: zh-Hant
    text: "有一隻哥布林成功轉入了世界屈指可數的學舍。\n成為展現學園不拒非凡之人的品格的好例子。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b5746f2e7b6e8713a359221ee9f11f3453ea33b7570ae186ef418204cc75a7d0
    lang: zh-Hant
    text: "正因愚蠢，才活著呢。\n——雙魂的永恆‧關德溫"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b5ce1511c9b2650b99a19e179d15442ca813a51f42c89faa98ac7055ebd8f889
    lang: zh-Hant
    text: "圍裙，適合我嗎？呵呵……真開心。\n那我每天都穿給您看。不管什麼時間、什麼地方……。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b5d349a2d532c4e779d55cdf6afc2509ab88c1e3eda6d5571aab272c75dce71d
    lang: zh-Hant
    text: "吾之封印已完全解開！\n只要與靈魂的盟友同在，疾風的冥姬就無人能擋！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b62232fca64f336035b23dc8bbc74bb011a5ba935841362e03b315a235a5f9de
    lang: zh-Hant
    text: "如林間陽光般柔和的、平常的視線，也帶著熱度。\n「到了晚上還是很熱，只是因為夏天嗎……？」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b640c94982de46af26f7b313c38c3d418e7392d79bc2a17b56b0445f9f506272
    lang: zh-Hant
    text: "我會為你注入好多好多。\n——不弒的繼承者‧庫璐璐"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b64eb1d7732402a788ca03ee785d782bcc2675d05f61052f9312a02c7582954a
    lang: zh-Hant
    text: "此處，乃於森林萌芽的江湖。\n——剪枝的罪人‧瑪伽綺耶"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b650cb1b0f628874b58891c4702f09056a1a618fae6b3c54e08bab448139b0c7
    lang: zh-Hant
    text: "肢體雖只有一副，司掌的卻是至大的三業。\n榮耀、暴威、審判，若皆是龍所帶來的恩賜。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b66cee0d09b42a61c76128b0f3a7bc5bc598d22f0d5a17b01d579c8ea49d0b1a
    lang: zh-Hant
    text: "大義什麼的只會礙事。虧你們還有餘力拿劍以外的東西？\n不堅持己見，只貫穿鎧甲。只要瞄準敵人的命就沒話說了吧？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b694a5a009ccd6aa1dcda3f60be61094cd6c6b1c7d41b18285fcb58a75b81dcf
    lang: zh-Hant
    text: 雷，也會落在高潔之處。
    origin: machine
    low_confidence: false
  - source_hash: sha256:b6bddfbb3e2dc47a2d60ee2c97a8f7772db24e78b5c32865ac986952e5a2c25e
    lang: zh-Hant
    text: "密葬姊妹不會毀滅。不建議調查實例。\n與其最後落得失望，不如有意義地度過剩下的時間。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b6d756228b1d87adcf1264a537efaa15e2ac27fe0d48ae143d41514c3bac9435
    lang: zh-Hant
    text: "我能接受了。不講理是平等的，大家都是同樣的下場。\n可是……或許。讀了這個的我，有那麼一點不同。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b6f0238e81fe147dd89fb3fe7b1dd89b0082454eefc309336ebe25ea5e3ea156
    lang: zh-Hant
    text: "以上也好以下也罷，皆由我弭平。\n——靜寂的弒滅者‧吉露塔利亞"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b73e84ff6ba2437c92d6f796f6af4ea833e7b468cd31302d72953e4bf9357484
    lang: zh-Hant
    text: "人家喜歡在天上飛～。也喜歡惡作劇～。\n不過更～喜歡布丁～！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b74d7ddb8ebc381a9f4e8f6fd8a606ce24a02157c45182f091a728819357a5fc
    lang: zh-Hant
    text: "被揭露出的顏色是阿賴耶。\n——真實的繼承者‧薇赫里雅"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b785fbc541ff3ab159c23ac5a27c37a3c44dd694792e1871ec0375839f6f737f
    lang: zh-Hant
    text: "就算身形變小，龍的威脅依然健在。\n對覬覦遺物寶劍之人，牠以不變的猛烈將其趕回。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b7c7f5f7f1b1e0908c78dd9ce52387211f8ecf5363775ef6c46dffe87dd77987
    lang: zh-Hant
    text: "哭泣吧、懊悔吧、垂首吧、懺悔吧。\n閃耀的救濟將降於汝身——歡喜將滿溢而出。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b7ec31ed79ee978ed94478623014a45ba893c18dc1385dc129cb243ef8e873bc
    lang: zh-Hant
    text: "『讓你知道自己有幾兩重』\n——五行掌握‧久苑"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b862a5495fa4fc7d0115653f0fa94c6c4ab6eaf2dde1cacd93065e79a9e44378
    lang: zh-Hant
    text: "只是，向著彼方前進。因為肚子餓，因為飢餓。\n連根鑿穿的是大棍棒‧特托卡瑪利。眼前的一切都是獵物！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b8661d29362fe3ce7f9051841a38d5f6e37ba0f441f9030f4b854d0b3d30709a
    lang: zh-Hant
    text: "轉學進來的獸人族王子，就算對教官也是旁若無人。\n後來的格鬥術課上，出現了王子受罰劈鐵板的身影。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b87ab52994cfe0b64e4fd422492eded64fcf0ea7c887ad9570e95fdb9a35f072
    lang: zh-Hant
    text: "降臨的災難，是琢磨您的溫柔試煉。\n「艱難辛苦，玉汝於成！沒事的，有老夫在就安泰啦！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b8aab2c0607de79d6d1ccc5b5ce2bab824419a169c97077668b0c409e7b69526
    lang: zh-Hant
    text: "如親吻般甜美地，觸碰你……。\n這是讓空洞眼神恢復生氣的，治癒魔術喔？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b8b1c1a69b5fe2e3f3fa01f1e6896af6925a70cdb8fcdf7e47a3c0ae7c7fad76
    lang: zh-Hant
    text: "若眾人的雙腳因恐懼而發軟，就由我們打頭陣！\n即使在新的土地——魯米那斯騎士團，開始進軍！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b8b75b0502b2bb2b4641538a4c0aa3d51b7ac9fd9793382efaa12094f7d5a1d6
    lang: zh-Hant
    text: "用拳頭來講道，隔閡馬上就能化解。\n現在這些傢伙，也都是我出色的信徒了。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b8cd96a2c8265a8ab4d8a4ae402ff35af9e25b555f5b7716ba4348ff35db78bb
    lang: zh-Hant
    text: "「幸福的……Le、Let's、Fight……Let's、開運！」\n只要努力一定會有回報。因為，幸福意外地就在身邊。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b8fdb135bd49bf83e73f7ff21209c395535bc6e467793540eaabd7b0656ba97d
    lang: zh-Hant
    text: "這份力量是為了大家。\n——清澄的蒼藍‧坦忒菈"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b906f1316de6c66a6bc18830b79058f2be51e1f9758dfd0f9dc99fa32da8c49d
    lang: zh-Hant
    text: "又飛又跳的指揮模樣，離優雅還差得遠。\n但心自然而然地雀躍，連飛翔的天使也翩然降臨。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b90b88c62070e9e6d436ddf92bd9d2d9b8a31edba873f9aa8e0410d24d2bfa65
    lang: zh-Hant
    text: "連林間灑落的陽光都曬得發燙，冒汗的身體總算緩了口氣。\n「夏天，熱得好像要頭暈了……！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b964ffa58fc2ea06bbe219081073219093ded67b79f1a705c39d7fafe86935d0
    lang: zh-Hant
    text: "入金：50萬／出金：49萬／借款餘額：2509萬雷克爾\n——『帳簿』，收支欄（國曆811年，摩羯之月15日）"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b96af1147af55036ac435d49f859c717f395173af161dc969d611ad2494ce7e4
    lang: zh-Hant
    text: "比夏日陽光更明亮的光，天才親手製作的新作煙火。\n「看啊！Memorial Mammoth Shining Flower！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b99678cc277ca3866b7cd921096c7c10799ec6909bd964e5d40171683290446c
    lang: zh-Hant
    text: "極樂啊極樂啊。天地是何等美妙。\n正是桃源。先來一杯————啊啊，妙哉。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b9a659c740239dbac5efc96311e8d868096a13c2158958f34c4956ec1f9264c6
    lang: zh-Hant
    text: "生理上的厭惡、本能的忌避、高聳的倫理之牆。\n死靈術師把這些踩在腳下，在那邊與這邊之間散步。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b9b7248c75669d025f810cadbb174bb7f026c20dc59b2ba1448f27d999304187
    lang: zh-Hant
    text: "其軀體，以機構超越極限，故必中。\n遙遠、遙遠、遙遙遠方的敵人也——破風，貫穿。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b9d5042221cab86b44700254dad663bed9ff76727a0d934d59d5f9d153838ddc
    lang: zh-Hant
    text: "人們追求世間之理、真實之形，於是創造了它。\n「識，看得見。連底層的顏色都是。嗯，希望我那樣做嗎？」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b9ee345843d2bbe3f0ca1e8f9fbbc91d27fb77899cd3c6be9dc96b40a8041e06
    lang: zh-Hant
    text: "可以迷上我的背影喔！可以讚頌我的傳說喔！\n試煉什麼的一躍而過！什麼苦難都打倒給你看！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:b9f4d26cc7ffaf24e8acca4d2209204069e12f8afce5f6aa69a8b02448527de9
    lang: zh-Hant
    text: "原本我啊只是個大姐頭，誰知道老公就這麼死了。\n當個普通老百姓也不壞。但他留下來的東西，偏偏就是有啊。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ba419794bab686a78bf7e824071af801d9a5093e7c1bf2c6da3c0898c6eb36ac
    lang: zh-Hant
    text: 送來永恆安息之人們的，片刻休息。
    origin: machine
    low_confidence: false
  - source_hash: sha256:ba82036e2d10273d0967e1448751022f6981a6b5d2af5fead88f9232e3063793
    lang: zh-Hant
    text: "以後也可以一直拿哥哥來玩對吧！\n……啊，我是想說，可以跟哥哥一起玩喔？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ba839a58756ce3fed5059e4750ae6bd0ca73e7abff4d3e851b06986c9114897f
    lang: zh-Hant
    text: "我已經不是小孩子了，一個人也能戰鬥！\n這次要換我變得能保護你了！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bad5421b17375a3169428ed1e149f500dc496deef90a9f9145fbeea4a80cbaf7
    lang: zh-Hant
    text: "自悲劇而生的英雄傳說。為了不讓悲劇重演，英雄奔馳。\n「只要有相信的夥伴同在！上吧，如迅雷一般！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bb2cf9f4fec64aba2844711c49ffe3700f41c78fe7f2232b574522306088aa93
    lang: zh-Hant
    text: "你有我罩著啦。\n一起跑吧，直到天涯海角。今年也……夜露死苦啦！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bb486d47a995a03260e70c06e03d9f97242f1a003641e05d24d7c81d2acfc7c5
    lang: zh-Hant
    text: "「所欲唯有繁榮。所求唯有榮耀。\n勝利既為我之王道，便只管一路前行！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bb4bbc57c013a698d45dd7fc47401e9b9f00f3f09af052068a0349ae57cd35ae
    lang: zh-Hant
    text: "畏懼吧！偉大的力量，真正的赤紅！寄宿於我手中……\n……咦？你說詠唱太長？笨蛋，這是戰術啦！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bb846f32261399f2d9796d1dd05694e3485a32b17dfc60411b929dfec4c484ae
    lang: zh-Hant
    text: "在華麗都城的深處，悄悄染上色彩的季節……。\n請和人家一起享受吧～。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bba76668e6dbc4903fa05481edecde2c11fc9c1f8ab3ae3856f50ed83dc443f8
    lang: zh-Hant
    text: "內部鬥爭開始了。「那種事我不知道……相信我！」\n啊啊……要是能那樣做，該有多好啊。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bbb1e374217d3dfe82ff7bea5f7cdd283072354989dfdca938f946e08708bf22
    lang: zh-Hant
    text: "虎鯨為了與偉大的存在共生，鍛鍊身體、深化智慧。\n牠們認為提升後的身體與智慧，是來自大海的贈禮——"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bbc9d814d186e7d707aaff7a57fd20fde2faae490f0ac0669b3cdf3661cc2926
    lang: zh-Hant
    text: 有無信仰之心，正是區分善與惡之物。
    origin: machine
    low_confidence: false
  - source_hash: sha256:bbd845164e0d543bd65cd6415cebb1fdff0a301c5a9448e80c5b29c23dd2fece
    lang: zh-Hant
    text: "手持盾與劍，英勇地，他戰鬥著。永無止境。\n這一切的開端是……在哥布林的宴會上表演節目。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bbf5088667e658895aa1cce66c6bd4cb276b5c735e0f8fdbae4a3257c8c277c2
    lang: zh-Hant
    text: "過去，不殺的試煉已被跨越。\n世界新被賦予的，是絕命的試煉。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bbfa6ea2b7de035c1262685af25dddd50a11e15cb291afb31b72a3d4809414d3
    lang: zh-Hant
    text: "那傢伙思考，我來粉碎。兩個人就輕鬆多了。\n回過神來已經聚成了一群有鱗的。名字——就叫百龍。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bc1d6110cef7a8f160e8205cdd62f807806a8f596f022b9e9c84ac7a5165593b
    lang: zh-Hant
    text: "抵達遙遠高處的境界吧。\n——雷維翁超凡者‧尤里烏斯"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bc24d5d8645672b7c701122720df940ee12254dfed53e81d2a222c91eb6927af
    lang: zh-Hant
    text: "沒有不付代價就能得到的價值。無禮之客不是客。\n——『奧德珠寶股份有限公司的理念』"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bc3bd307f3ff3721704c88164c0661e1763036e914bc53f8ef727592f2154ce4
    lang: zh-Hant
    text: "絕不可殺生。有象無象皆因延續而有價值。\n讓其生、讓其活、讓其行，無論成長或腐蝕。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bc5852890a56523d38ef8cd22275668c7b21a027a7e7c168d7a26803ca069597
    lang: zh-Hant
    text: "飽和的地上，只橫躺著令人厭膩的日常。\n若嚮往新天地，就把目光從地面移向天空。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bce7139cc4aa11aa5be4a819baefe0a97c0ba093a6730d7acbe567403a709633
    lang: zh-Hant
    text: "好大的果實……可是，居然到處都沒有被玷汙的精靈。\n姆喵，不對。也得告訴參謀先生才行。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bd05647507ddb3f1a70bc6227cdb8d66fd19a1c4f9b981cf05603d9e7d402903
    lang: zh-Hant
    text: "骸骨公主、鮮血王女、斬首之刃、真紅的斷頭台。\n愛怎麼叫就怎麼叫吧。那將是你最後的話語。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bd1d5494597339e595d76f639dade855aedea3e06d08d56c514a6be5d50cd3cc
    lang: zh-Hant
    text: "破壞的衝動，是黑色的。\n摧毀既有事物之前浮現的笑容，是汙穢的邪惡。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bd353638e506086ceffb9cb20e35a0fd971ba3cfc898c059cd1c703899b1072f
    lang: zh-Hant
    text: "我還沒輸……！家父也曾持這把斧頭，討取敵將！\n給我睜大眼睛看好！這就是我的，壓箱底絕招啊啊啊啊啊啊啊！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bd5e821bb86ddf8873ee64fd1b51b86383d42447f41ec1f423fd6894551e7e15
    lang: zh-Hant
    text: "暗巷、暴徒的巢穴、禁止進入的區域。\n蒐集證據很辛苦……但為了謎團我會加油。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bd928513d657128618d4a5d4f18f3b678b19c203fea89c5c74e09ea37a7a79f2
    lang: zh-Hant
    text: "認識她的人說。\n在黑暗中閃現的那把刀，對邪惡而言是死亡的刻印。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bd961132c76fd41360c47a6528304c8d1af773072981c9e8b4d6e3ab6eb5549a
    lang: zh-Hant
    text: "染遍這片海吧！用我們自己的方式！\n財富、名譽、權力誰管它！只管和夥伴一起前進！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bdd9926e4f7ae571621dc08b0063bcf3795bfe5580e9d2bdb83fe153ac124a4b
    lang: zh-Hant
    text: "這是啊，我和你，用自己的雙腳前進的道路啊。\n一點一點地，有這種實感了。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bde9ed51ea216a843c9ec3319c20be6238d136bc7fcddb0859e18a0444337192
    lang: zh-Hant
    text: "所謂『絕命』，即是不殺。\n在心被畏懼殺死之前，殺死性命以保全其心。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bdfadfff4572f590add339004682095fa88ebc527cdbf2cf240879c29cbdbce1
    lang: zh-Hant
    text: "那位魔女的心地極其善良。\n有些事不知道比較好，魔女對此十分清楚。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:be0e2e761a45c70d04806230b6cc50f19b8b37a7db18884ad8b626658eb50173
    lang: zh-Hant
    text: "奧德珠寶股份有限公司，主力產品，【寶石《Jewel》】。\n那是注入了魔力的服飾，是護身用具——也是兵器。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:be3e547686fa4b6ab11b550eec1a9aa1e7ed8f446247c4bb290ca4d807350b22
    lang: zh-Hant
    text: "華不僅綻放於天地。天之外亦有華綻放。\n我正是天外之華，愛蓮娜‧葛洛莉亞！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:be3eb2a0b231c883b1fb3d371a8d87dacd50623f0af563568e075f1d1c097877
    lang: zh-Hant
    text: "在這個充滿爭鬥的世界，能依靠的只有自己的力量。\n所以我會一直贏下去。絕對。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:be49d56866d8f6e429197cd8efb8bd4f97d2a65b3f5a4d7c956fe32a05332500
    lang: zh-Hant
    text: "「極致尚遠。擋路的枝葉，容我斬斷」\n——妖精劍師‧阿瑪茲"
    origin: machine
    low_confidence: false
  - source_hash: sha256:be9ac840caa48028fa56583e9f369f8c28ed9077c01cae7e573cf9593509ad88
    lang: zh-Hant
    text: "每一個都是，小不拉嘰的靈魂。不要。\n我要獵大的。就這樣。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bec9fe59235e252b711283761c0a356ab73d6dd269b91ee87d4c2ed3f80d8479
    lang: zh-Hant
    text: "變化忍法，如意算盤之術！\n呵呵呵……這是假裝被打中，再輕巧閃開的術喔！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bed0d7b138615482629929ccfb0a90d44add211b7ad3be6a05b605ac49e4c033
    lang: zh-Hant
    text: "你是能消除悲傷的、像太陽一樣的蒲公英。\n希望有一天我也能成為你那樣的存在。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bef4417faa3e7e872c2053bd93ecfcb179d20e922e56f21d988448c063a590eb
    lang: zh-Hant
    text: "教你怎麼數永遠吧。\n挑一具屍體，稍微唸個咒，你看——一個永遠。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bf2c263ec94bad072d572c6081e0c94659812aeb7791b7609adbefd8411e98ed
    lang: zh-Hant
    text: "我要證明自己是特別的。作為姊姊，作為大家的榜樣！\n來吧，可愛的弟弟妹妹們！接下來就交給姊姊大人我吧！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bf3f7250e5b76220b2eef31717920b40609ed217ae6d3f4683516a4f1f683f4c
    lang: zh-Hant
    text: "好耶啊啊啊，看到沒，黃金的右直拳！！\n天下無雙的偶像的臂力，大概就是這樣啦。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bf6019f56c44ea5b3ce8cb9205bc60a9dbcc930191d8f3182e5b68396c858cfb
    lang: zh-Hant
    text: "在發生無數犯罪的透京，\n區公所的業務也無數地發生。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bfae803f08181ecc96e0e87fe8ec166d1d41b191e177fc8e352015cfa64f5ff5
    lang: zh-Hant
    text: "獎賞近在眼前。獵物，此刻正是甕中之鼠。\n悄悄逼近的身軀，睜大的雙眼。這正是貓面前擺柴魚。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bfb801a573ec1e7122d6611dcb6683821abc7865c3570bcf0bb637e1a53691bd
    lang: zh-Hant
    text: "呀齁——我是待兼詩歌劇。\n為了不輸給大家，要卯足勁練習……今天休息！？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:bffe519aef421336f26f250343c92ded40f24dd903a7e7346cc5ce3049d9818c
    lang: zh-Hant
    text: "困難的事很麻煩，沒興趣。原來我也有缺陷啊。\n因為能互相填補缺陷……所以不就無敵了嗎？我們。"
    origin: machine
    low_confidence: false
