kind: flavor_translation_shard
entries:
  - source_hash: sha256:70363fd1ed064ef9813c2cab2326a8f4173bcb7b8318df532c4fa2c64f34f703
    lang: zh-Hant
    text: "有困難的時候就要互相幫忙，對吧！\n希望今後也能一起互相扶持下去！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:70708f8b26acef4ce2dd7772c5696698e6f7f8cf729ed4e5af2110616f1dcfec
    lang: zh-Hant
    text: "勇氣一定會給予力量！這是我喜歡的英雄說的話！\n——風祭蓮"
    origin: machine
    low_confidence: false
  - source_hash: sha256:70791edecc201a38e7fdec8ae80e01eca037cc205df15a27f7aca0eebc170105
    lang: zh-Hant
    text: "「高舉繼承的徵兆。高舉抵抗的瞬間。然後——……」\n——涸絕的顯現‧吉魯涅莉婕"
    origin: machine
    low_confidence: false
  - source_hash: sha256:708a89c572b8edd5a2646298bcfa807471b6d833c931faef4a0675838b1020b3
    lang: zh-Hant
    text: "請不要在太近的地方晃來晃去——\n因為我會反射性地攻擊……這是——忠告。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:70913acd7a7e8b12d5a3c9e1df3626d3b219dddc03070a02803fbc64b64da6d4
    lang: zh-Hant
    text: "奏絕帶來的是黑色的成長。\n心被哀愁摧毀，除了歌聲之外充耳不聞。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:70a5e43b8efc42925d3ff85296f85df9525b81b1b78a197cd74d8fe08f01ce47
    lang: zh-Hant
    text: "僕人們在等……？不對。是我讓他們等。\n來，快點讓我有上舞台的心情。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:70c15bdffe29c2a8eaa58e5cef3823f63fa81b519bd52a82864bf403fe7c97b8
    lang: zh-Hant
    text: "當希望搆不著的時候，努力就會變成致命的毒。\n——白銀御門"
    origin: machine
    low_confidence: false
  - source_hash: sha256:70def71813b855d632d4399d32af91286bca8bb9a2d889bfe343fdb9a7895f42
    lang: zh-Hant
    text: "終於抵達的那個地方，終於找到的那份寶藏。\n成就感、解放感，但還有那麼一點點的——空虛感。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:70e79dc25cf2bc54f50f21b1f16e6574c7f9cc0e55db7a5954382c545a98de66
    lang: zh-Hant
    text: "舉起手就被找到，能說上話，還被稱讚。\n那對她而言，是奇蹟般的時光。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:71a8dce1aa766ac12a6e7a6418688d41159f4fff627e0157b936c1f05d052be6
    lang: zh-Hant
    text: "海中沒有火，但海底下是一片火海。\n海之劍由海底火山的噴發而生，並受其鍛鍊。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:722823a449917b55c8e6d0d69efe0e5ff0e0dd01104da612f9586a519b922772
    lang: zh-Hant
    text: "對總是我行我素的看門犬，你一定神魂顛倒。\n「夏天馬上就結束了！再多玩一點吧♪」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:723d65072415adcb50f0d3c7375f16a0fb7a06eeea15b7dc350146e710bd42a0
    lang: zh-Hant
    text: "忘卻一切，成為凡人吧。\n——查爾斯‧Di‧不列顛尼亞刻下。新的虛假記憶。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:723ff66d5dc32dd635397883468514d883e287cb2653b905ed2dbed80117612e
    lang: zh-Hant
    text: "惡要清到最深處、乾淨處罰！\n容易漏掉的幕後黑手，這支箭也不會放過！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:725b6a133659870163e56d8521959435739b83d67e5da1624ec7c28fbcc91dc4
    lang: zh-Hant
    text: "少女的魔眼看穿內心，把被她放棄的人送往異界。\n『很坦率很了不起喔。真實的代行，就拜託薇赫里雅了』"
    origin: machine
    low_confidence: false
  - source_hash: sha256:726e777d347c6af6b38c4c7923ff153ed03e5b4db84ef888ca2519068b9740d2
    lang: zh-Hant
    text: 純然的信仰，不求意義也不求生命。
    origin: machine
    low_confidence: false
  - source_hash: sha256:7282bfa9e0805dd9e4a43cd17ab69a71715934eee4203ef98e5fc4f29b77cad6
    lang: zh-Hant
    text: "勝過傳聞呢。聖堂真傳的，盧納爾劍術。\n我想會很有效喔，特別是對你這種邪惡之徒。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:72df0a25cdde1e22a3136acc47035132486b3e0c0b0a3428fc28ca84b57a04ae
    lang: zh-Hant
    text: "我也要……把歌聲，傳出去……把舞蹈，傳出去……。\n謝謝也要，傳出去……。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:72fd1f223d659e81e267787e0b8009a0e894268b0c377a4c5c4fbd447c2af43b
    lang: zh-Hant
    text: "夏夜的天空裡，五顏六色綻放的花……悄悄飛舞……。\n請看。啊……那個，不是看森久保……是看煙火……。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:73305c8a2dfd86c49cf6286b1c0df6868e965c11348337c522958820b55db4c1
    lang: zh-Hant
    text: "尖叫雲霄飛車！太棒了♪再去一次吧！\n好嘛，再一次就好。然後，如果還有精神，就再一次♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:736139d405a851eafc61e1c6b0855d59787ae6850b6503d70a204bbccd173e9e
    lang: zh-Hant
    text: "入金：15萬／出金：13萬／借款餘額：2990萬雷克爾\n——『帳簿』，收支欄（國曆805年，金牛之月15日）"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7390772843a61581dca1f04525d8f4ed84e2c1f70f1086886396c7b80bf7c2e4
    lang: zh-Hant
    text: "她決定持續創作歌曲。只要不斷歌唱、不斷破壞。\n就能在腦中永遠相見。她追求與永遠的偶像之間，永遠的幽會。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:73ac56a91aa3b02cae58aa9d466f7b02d2edc8b7d5aaf6c76801bee612391e7b
    lang: zh-Hant
    text: "贏的是主角。配角得不到回報。……真的是，好好笑。\n因為，明明知道還是會去跑啊。夢想著總有一天能發光。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:740feaa570c37f55873a6bf1e89306771282a7b4e2f7f2f7bba962cb923b053c
    lang: zh-Hant
    text: "肚子。Empty。\n肉包。希望。哥哥。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:746fa19a5c83473f68a0bed9e2ddfdc01078b0d2b73cdfd1884590eb39737731
    lang: zh-Hant
    text: 絕望。又名，現實。
    origin: machine
    low_confidence: false
  - source_hash: sha256:74978828da3f944bb7353a26642e760100370ccd32c1ae7d93246b4cc8a0a698
    lang: zh-Hant
    text: "所謂『奏絕』，即是破壞。\n無歌的時間裡衝動不斷累積，被壓抑的衝動終將爆發。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:74d870c1f327896d0e6ad98e108285e5a4e0d21600d66d0e28002fe703d078c3
    lang: zh-Hant
    text: "老師幫我申請到龍育制度的補助金了！\n欸嘿嘿，目標是第一名！浪頭和視線我都要一起奪走！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:74e193df7097aa3e1afbb7d5b7a57ac601aff7e5daa4558978fd3057acd692d6
    lang: zh-Hant
    text: "對準方位，定下時刻，若你想蒙受那恩惠。\n若你想親眼看見，與落日交替升起的那道光。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:75190b7d7bdadb90b084f5ea2ad9a0320d74ce1d89c8130dedf720db2802ab5f
    lang: zh-Hant
    text: "團團轉的轉圈圈圓舞！代代相傳的舞，描繪出魔法陣！\n從師父到我，總有一天傳給下一個，技藝不斷被磨練著！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:755b4fdbd2689ab8ac275cd835876b7de0aa15132ba298a4393b51813cd30544
    lang: zh-Hant
    text: "克服萬病也好，行走於水面也罷，科學技術都能辦到。\n是故人們相信科學更甚於神。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:755f6a6b7991d91b420e145bc7b52199d2fc008acca9bf570ca9dcf017e5e0b2
    lang: zh-Hant
    text: 蒼色騎士們，花費漫長歲月，不斷練兵。
    origin: machine
    low_confidence: false
  - source_hash: sha256:759bff95ac5ff1450b592828be3d44d48b9a744bb35d225df21159b01f9fabf9
    lang: zh-Hant
    text: "「為了吾主，我發誓獻上此身」\n「是、是的！請多多指教，辛西亞小姐！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:75d2c377b43cf5fd88140796a2961e07e6a51cfed8f3222dfe41fabb31e2666a
    lang: zh-Hant
    text: "聖石們在騷動。敵人正在接近呢……\n事到如今就變身吧！稜鏡，Cha——nge！！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:75ff4aa44657a2e222b6213d8e1d47d37b5332da40f05fd596eb19c9e6fa668a
    lang: zh-Hant
    text: "鏡子般的地板，水一般的玻璃。一切都是為了報恩。\n「用最棒的笑容來迎接吧！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:761df75101e035fab09b6e25fd0687e563ccf88fdb3dbfeb324e675b02b85f26
    lang: zh-Hant
    text: "我不能在這種地方輸掉。\n……因為我要超越那個人。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:763186d044f0b8119279af68c2336691946eecc2371b678aec3020c1644828ff
    lang: zh-Hant
    text: "若有無法無天之人，御門系統的制裁便會降下。\n因此人們，不再向神祈禱。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:763c01bcdf79a73727e0642d179f816c5b677315afba93a626b3c139459c8104
    lang: zh-Hant
    text: "——其為《女教皇》，所示為《聰明》。\n依從己之決斷，向迷途之人展示信仰。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:766883a9ed37370e60c0ef009708147d14a0fbcc9c2e14ee91d8812feba08a7e
    lang: zh-Hant
    text: "奏響信仰之歌而後破壞，編織歌詞，歌唱而後破壞，再編織歌詞。\n破壞與創造的圓環，即是永遠。崇拜偶像的、沒有終止記號的歌。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:767fd5bf667ec90b349dcfe88a68368fc1d8a7ea48fb8400a731e1f482d1a1ca
    lang: zh-Hant
    text: "嘛，外表是有點嚇人，裡面倒沒什麼大不了。\n不過，凶暴這點最好還是當心點。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7686097a118c57c0d57c07351a8da19fce71ab6cc44593ffd369e5197236d239
    lang: zh-Hant
    text: "你啊，有好好吃飯嗎？\n啊，不介意的話，要不要姊姊做給你吃？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:76a728811a370801e7b83c50e5902fba93e5d392ad3ac49e6fde4a40f92a90c1
    lang: zh-Hant
    text: "摩訶一千萬高校‧學生會。會長耶薾、副會長天華，\n然後由書記、風紀委員、回家社等成員組成。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:770491d08c345e8021f589b27d85bb2913e40e77886f9b090e02516d54f805d0
    lang: zh-Hant
    text: "哎呀，想被我懲罰嗎？這樣啊……覺醒了呢。\n我會好好疼愛你的♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7704fe2bd6ec31fb0df29a6c2bd92e02d562bc40c08ff0c4f08f5b54a9e741f0
    lang: zh-Hant
    text: "沒錯！這笛聲就是你的支配者！\n從都市到鄉下、到森林、到懸崖，《大遊行》沒有終點！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:770c0d5f7100ad450350df1e0e4b98c1a6be54101e0b64f77de828133fba3831
    lang: zh-Hant
    text: "哼……看我的火焰看得入迷了啾？\n這火焰，跟我一樣啾……靠太近會燙傷啾。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:772698cf33c4a9455905fea419d600d64e46432409b24828806da22044a978b8
    lang: zh-Hant
    text: "那支舞開始，布幕升起。妝點它的是激情的旋律。\n那支舞結束時沒有喝采。留下的是鮮烈的紅。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:773a67114cb4c0aa3e3ba6a23aa6d53fdb80f699bfa9729fc8bdb328d6c6c832
    lang: zh-Hant
    text: "森林與人是二而為一。相互交融的正是我們。\n只要人心繫森林，森林必定會回應。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:774bdf8830f7360a0748052b40539036dff07fe4668e9854c15584a40e2d791e
    lang: zh-Hant
    text: "教皇之所以妝點自身，\n是為了不忘記自己乃是教理的裝飾。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7750be8f5bc4f05ba2ea3abb78122ec1aacdaa0b4b0d8c7be81a3dc143f6e34d
    lang: zh-Hant
    text: "喔——呵呵呵！我是採珠！你知道嗎？\n世界充滿了可能性。我會證明給你看！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7792c064509baa96d357e65e179e42e08b450a74ce800dedf3c8fa137cad0b7a
    lang: zh-Hant
    text: "「給我記好了。海盜是自由的！自由才是最大的寶藏！」\n那是我最初得到的，爸爸的教誨。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:77e1e2ab55a3629de8ff220a4492374ae1d3d46512cb6455757a43b7f802c808
    lang: zh-Hant
    text: "跳梁跋扈的蠢貨。大言壯語，你辦得到嗎。\n現處以蛇殿之刑——對狂愚之童降下誅罰。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:780769711f4a29c7a177ca71d14d0ac29f0da376792e889e9c116f0396166d91
    lang: zh-Hant
    text: "「怎麼了？呵呵，看起來相當痛苦嘛。\n如果要我原諒你的話，這個嘛……跪下來吻我吧」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:781540fe916fd90fe6d6fa5b487acc50aaa3d8994deb47adfb511076ce6f15ec
    lang: zh-Hant
    text: "……要挑戰『帝拳《Emperor Fist》』荷洛穆，是嗎。\n只有氣魄，我認可……除此之外，毫無價值。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:782a20023e54b9581bb16b2f4b06aaa06c4f4e6adbaa1b5468e535b916254eb4
    lang: zh-Hant
    text: "臉頰永遠光滑，眼眸永遠濕潤。\n白皙的容貌，清麗的美貌。永不凋零的理外之華。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7835fc5d93774e2b33a8ec08239bd5855ee1b1ae8690b9a2953223d61c568031
    lang: zh-Hant
    text: "讓整個會場，開出大大的花吧！\n花壇裝不下的滿開華麗……送到大家身邊！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:783a60e35471602dcb6b0f76857f805aec0593ea0869c22965ea608d22fa5fa3
    lang: zh-Hant
    text: "為了不忘記逝者，教會製作了那份名冊。\n隨著姓名與死因不斷羅列，名冊染上了死亡的氣味。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:784265fc3d7064412f4c50b41d33644e891a418b81146c95fab43eff84e6401f
    lang: zh-Hant
    text: "看起來像天使……是嗎。是因為翅膀的關係嗎。\n還是說……有別的理由？呵呵，可以告訴我嗎♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:787251b917c384952b51447be4541db789532ef091a80de862bce118dc1bdd50
    lang: zh-Hant
    text: "「即使在砲聲隆隆的戰地，我的音色也會響徹四方。\n注入旋律的是治癒的祈禱。啊啊，願平穩降臨」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:78763b4b7abb234e29535e0ea7e0d26e171e87e5b6abd77f506055841864316b
    lang: zh-Hant
    text: "愛雖然買不到，但笑臉買得到。我這樣就夠了！\n來，拋下自尊吧！想討我歡心就笑啊！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:788219b95ee9187a62a32e480f37ae75ca5f7217e181c4267042c44ee4f36cd0
    lang: zh-Hant
    text: "嗯～♪果然～正太的叫聲最棒了～♪\n騎士君君也要叫叫看嗎？嗯呵呵♪開玩笑的啦～♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7885c1140a38b9ba152013429c80d1697997dff188f1d0845a47e7c407f6bf12
    lang: zh-Hant
    text: "如果你能跨越那道牆……稍微陪你玩玩或許也不錯。\n——白銀御門"
    origin: machine
    low_confidence: false
  - source_hash: sha256:78a642963cb33bf0a04110acb85b966dc416acd3188711bcdea8865dea5511e7
    lang: zh-Hant
    text: "花朵的香氣包圍著我♪\n和這件禮服相得益彰，心情非常華麗呢！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:78b208bd54ab999520f26a7cf6c61e1033d7b4af5d73d766fce9ed358843fbf9
    lang: zh-Hant
    text: "奔馳吧。\n趁月未落。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:78b50499f91767898b96089db740146bb43a169251f63c332c6fbaa49c50cd3d
    lang: zh-Hant
    text: "黑色的羽毛是汙穢的。奪走幸福的醜陋惡毒。我曾這麼想。\n「你的白，和那孩子的黑！一起跳舞一定很美！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:790668fa72996734a24f1672ed0b55a1428f2cbf024a617e81c2ffb680d96059
    lang: zh-Hant
    text: "神所刻下的是神聖的刻印。祝福被選中的使徒。\n神所刻下的是邪惡的身心。祝福未被選中的惡鬼。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:790c3831dc4bdf1c9840937e085c041102fade5b05fb7253acb99ad468cf9784
    lang: zh-Hant
    text: "我是娛樂大家的漆黑藝人，富士奇石喔！\n我一定會用最棒的“奇蹟”，讓你露出笑容！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:791c8d4aa8cc1a166a96a19f958fced791be8c97f4137f71db10753f9a32294a
    lang: zh-Hant
    text: "這、這種可愛的東西明明是茜里擅長的領域……。\n但是，現在的話我也……給、給我好好看著！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:793521e22088c488c549f56a10ad3369e948954336b9e0f26df3c435edc760d8
    lang: zh-Hant
    text: "身為士兵的他竭盡忠義。\n為了斬斷悲傷這個，自己的正義。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:793cfa17d53f7a2a1c073065e21265d975c3f563056b53dbb5facbf355f6ca29
    lang: zh-Hant
    text: "迎接迷途少年的，是溫柔的人們、愉快的日常。\n被牽著手，被牽動心，宴會不斷的日子，唯有溫暖。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7947215cdb45bdea054a4415cf7b901eb2b4df05793741fe362c6a07d4aa0c46
    lang: zh-Hant
    text: "啊哈，好舒服！騎士君也過來嘛！\n一起化作風吧♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:79559a80ed4444249d0d4b7946989c7bc0b0240cda142ca79dc51ea880591772
    lang: zh-Hant
    text: 海域的天候，由戰鬥海妖支配。
    origin: machine
    low_confidence: false
  - source_hash: sha256:79678566f5804b5fc53fb665af064c39416b4a77fe27fd2441d7c8f7e3ba2425
    lang: zh-Hant
    text: "「聽我說聽我說！我找到一條超棒的路線！」\n「知道了啦安靜點！……真是，得意忘形的傢伙」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:79916a55438b011d3633129f64b35c62ed907809b8282971302bd33cf795b19a
    lang: zh-Hant
    text: "呀呀，吾名為剛培恩！乃繼承神龍之血者！\n若有配得上吾的帥氣社團，吾就讓你們介紹介紹！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:79c228b99a3861ecc373d8ff5c0ccffc6f09067b41c59099aa3c4ee9fddb9113
    lang: zh-Hant
    text: "沒有風格，就是我的風格。\n禁忌、真理，任君挑選。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:79ff1848e7860e8998ee3cd6d657217bac9dcbc9c3befa167f92589e6005f38c
    lang: zh-Hant
    text: "為森羅萬象獻上救贖之翅。\n——自然界的妖精公主‧阿麗雅"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7a1bf1ef6657f5a9b36bc610aae8d21b10811f47a0c3bddb5f393a09e46a0aed
    lang: zh-Hant
    text: "因為和哥哥在一起，現在的我是無敵的喔！\n不管是討厭還是槍砲都儘管來吧！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7a7bf10abedfe3784c1f27cb819e75603defbde23d15ff24f62f8ab517f7263d
    lang: zh-Hant
    text: "若神的全能是真的，為何這世間如此荒廢？\n那光背和後光都是騙人的。就由我來揭穿這欺瞞。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7aa2bd86d9a48c9b936cb0dca9aa1f0e59d4e4f11950c78a7900ca32047e5a7b
    lang: zh-Hant
    text: "欸，你感覺還不錯嘛。\n可以就這樣閉上眼睛嗎？不～可以動喔。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7aa3b2dafe5ae0e8476f87ad6b53bd0e9b6fe75450206aefcec6684e83735c54
    lang: zh-Hant
    text: "你好，我是特雷森學園的理事長祕書，駿川手綱。\n為了讓各位度過更美好的學園生活，我會全力支持♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7ad9d0184322e5a22bf2fd18e23d6ba74ab544c41fa19441289b50cfad106cbf
    lang: zh-Hant
    text: "生命之雫！然而，這正是引導墮天使走向同胞的涓滴！\n（譯：流了好多汗……但這也是為了夥伴！）"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7b0f3fa9dad39d3ffdbec5ad7e17b050bbff3decab41fe9810f637b77aaed729
    lang: zh-Hant
    text: "自悲劇萌芽的野心。為了證明自身的存在而重演悲劇。\n「信賴或羈絆都不需要。就盡量跳給我看吧，團長閣下！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7b2b3bf7666b3db57c9a4bc56fa843b8e335eae805d7f0ebc13a7c96efe5ffa4
    lang: zh-Hant
    text: "咿呀啊啊～！等、轉轉轉、太快了！\n可、可是，和大家在一起，好開心……。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7b34dadc1b80d2f3e479807aa3efbe2c77f4cd9906771afdc9b4a164e3bc8410
    lang: zh-Hant
    text: "迸裂的魔炎，燒灼了愚者們的身軀。\n因無盡的憤怒，戰況惡化。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7b9a395a1b7980bdbdd6719c03f7c66d4df2c81b0ccb4e9d79a5704249d47468
    lang: zh-Hant
    text: "制裁邪惡不需要法庭，落下的不是木槌而是鐵鎚。\n「你的弱點，看得一清二楚！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7bbfd29e95d857ed501bb99eb127757b003033a6f1fef7619daf69611b604377
    lang: zh-Hant
    text: "啊——那個，自然什麼的那種，感覺我不太懂。\n可以啊？又熱又冷的。笑死。我是沒詞彙喔。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7c3c023c72ff78701c98f24245a33ecd1b3e882306ef59e54e2914b9f0e74f09
    lang: zh-Hant
    text: "這個會場裡的所有一切，都在注視著我！\n呵呵，沒錯！我一直在期盼這個瞬間！一直！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7c7236c5f866acf587594dcf2dce63bc6eac2b378377adc2c10b2c27e7c76795
    lang: zh-Hant
    text: "尋求甜食的愚民們啊，崇拜吧。\n我乃塔的妖精……而且！是最高等級的皇家塔！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7c9e57f9d6c76fafe7ff3b2daf0b3680fe34b457f86f0766f25c8700bc08e203
    lang: zh-Hant
    text: "喔喔人啊，無須畏懼。混沌終將散去。\n我也從混沌中找到了答案。名為毀滅的唯一答案。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7cb23d6943d9e36178563298e519b6ccb35d4a959b8e08a1987d9af8893c87d8
    lang: zh-Hant
    text: 也有死後才得到的榮譽。但勝利者，永遠是活下來的人。
    origin: machine
    low_confidence: false
  - source_hash: sha256:7cb42d8b192ae07c463ac8f2bb2379e8cfb460a40e3cd20d783b10c3a426975a
    lang: zh-Hant
    text: "難得來到花田……喜歡、討厭、喜歡、討厭、喜——\n哇啊啊！沒、沒什麼啦！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7cca1fe6ca1eb077cd7b6a769393f992115d1524fd5df8cb7c6e2df415fc19f7
    lang: zh-Hant
    text: "又是女高中生又是社長，身兼數職很不利？正好相反！\n圍繞著我的一切，都會成為讓我發光的養分！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7cd7e0e321e826637e14bc0a4fda171177bed0f61f4779016845a7eb1a2613ee
    lang: zh-Hant
    text: "無法奢望只有兩人的世界。那麼至少，要有只屬於兩人的時光。\n即使所有生命消逝也依然留存的，騎士君與我編織的故事。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7cf66a41c406ea671a12ba5d243217ce1640037dd372cb43f0d37040c0606ee6
    lang: zh-Hant
    text: "厭惡知識是愚鈍，積蓄知識是平凡。\n賢明之人，不畏懼捨棄知識。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7d1295188fa08d267613dd9f03dc093e891fb46e6ce9fcce57a3a040137b3e93
    lang: zh-Hant
    text: "闔上書，面對闖進洞窟的那群人，我唸出最後一句。\n「愛相纏而成子。來吧，偉大的混融」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7d1b8919e4f784d2142b396160fecfb625166c8ed38a5250744ce64950753367
    lang: zh-Hant
    text: "士兵的損耗即是國力的磨耗。輾殺有時會昇華為戰略。\n「全隊注意——踩扁他們」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7d48c212901cd1959bf3cdfadb9d821469a32bd746ffcb3f5354d5f09f11df0a
    lang: zh-Hant
    text: "太弱、太軟、太脆！\n——帝拳‧荷洛穆"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7d4b4b067c597683a3a6a9efd5ddd812b77ecbb7ab8591020ef3cc46f61a511c
    lang: zh-Hant
    text: "毀滅散去的它們，在臨終的瞬間最為閃耀。\n唯有身負使命的長壽種，能夠收集那份光輝。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7d77dfaa5aab00f4f040725d3f21dab2e51ebb292e580dd6bb3070dca555308e
    lang: zh-Hant
    text: 在那面海盜旗面前，白旗不過是塊破布。
    origin: machine
    low_confidence: false
  - source_hash: sha256:7dc96cd104fbbe041b24ea787ba186fb0066b0aebda50d227705d93c2ca006e1
    lang: zh-Hant
    text: "只有現在，千枝是大家憧憬的模特兒……！\n歡迎來到！新作時裝秀！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7dd12f349f4468182f4eb88c0479eab9231d36861e74704824332197042d2586
    lang: zh-Hant
    text: "我、我是櫻花千代王！我會讓這份心意開花。\n為了和憧憬的那個人，一起站上夢想的舞台！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7dd7c01246ad197f435b1e8e7b8ec8e10d58023ada945b151868efa59ede84a0
    lang: zh-Hant
    text: "來自已故令堂的，１６歲賀禮。\n——令堂的友人敬上"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7e1e023996c824288b89fb9177a3e2593d167e6c28f0d09d2df4b357c255fb46
    lang: zh-Hant
    text: "出入金‧借款餘額：0雷克爾／因篡奪的試煉，工作單位與債主破產\n備註：原來如此。比起老實工作，用搶的更有效率。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7e629522e1d3578e3eb381279eb2a53bc5eac2899a00589d4f6d378b66b8bc2f
    lang: zh-Hant
    text: 逐漸交融。敵人、同伴、遙遠的世界皆然。
    origin: machine
    low_confidence: false
  - source_hash: sha256:7ea2e3bdbd6dfddea2bcdcaa7edfd7258c279ad9306ba49f1f34285381c2737d
    lang: zh-Hant
    text: "我一直在等待。\n等待能拯救那孩子的騎士大人出現。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7f50b2afbfe50a8d6cb28f13ba78db7cb7ad05cc62a65303a133f5d1096cf453
    lang: zh-Hant
    text: "「除了教誨什麼都不需要。那些話語，就是安息」\n信徒們不再入睡，全身上下流出了淚水。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7f598b6d1874512fbeecfe04f713bf9dc49fe821f56fbcce55f3ecd4ddb3ff20
    lang: zh-Hant
    text: "「每天每天都在想。自己……是個失敗品」\n庫璐璐大人說了。「弓術很差，腦袋和運氣也不好」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7f76bca3528ed0af3d0b614ed3e3421758571f555a1a9f699bf23b132c967349
    lang: zh-Hant
    text: "「唉～明天開始又要工作了～。\n……正因如此，要好好享受和你的夏天！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7f8650256bd3e507079b7ca83789792719ae0b14b5ac64ec0be84e7de22bff45
    lang: zh-Hant
    text: "與人並肩對抗魔物，龍失去了高聳入天的身軀。\n但唯獨旅途的記憶不曾放手，依偎在友人長眠之處。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7fae081737151538fe59c1b7fae626fd83e2b667a2b3f768005a7d1a673f9bcf
    lang: zh-Hant
    text: "戴著面具的，是理解道理、以光示之的年幼賢人。\n其本性，依舊藏在面具之下。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7fb312953582bd7a64dae6b91e1b2c16f70469598b4fb541df6ca16c12ff090e
    lang: zh-Hant
    text: "此刻正是……捨棄不滅，抵達有限壽命之時。\n熱血、情念、希望……活在虛幻熱度中的光輝。那就是『人』。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7fe95709324641e37a1e85f173de6bb14b3e7ec236bec08c177dbe5e14bc8b71
    lang: zh-Hant
    text: "聽說是想在天上飛。所以才造出那種東西。\n本人玩夠了就死了，收拾善後是我們的工作。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7ff4fba066955dc67900f05990289c9331a85b22b64cdaea7c7ba3ce76508826
    lang: zh-Hant
    text: "當王子與公主齊聚，通往真步真步王國的門扉就會開啟……。\n來吧王子殿下，兩個人一起凱旋回真步真步王國吧～♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:7ff8d7fc3a0e5c82d5c74e466109d78404e78b1769b860966f766da2ed98d29c
    lang: zh-Hant
    text: "真是的……什麼謎之遺跡，真是讓人頭痛很痛的事啊。\n嘛，就讓我為解謎盡力盡一份力吧……。"
    origin: machine
    low_confidence: false
