    raw: 自分のエンドフェイズが来たとき、自分のリーダーは{体力}+3する。自分の場に『不滅の聖剣・デュランダル』があるなら、1枚引く。
  - id: sha256:f95975b5bbcf67fa9727e6fe7e9b62d6d4777c704abf32a078e5ab3e0a6b0cf7
    raw: "{ファンファーレ}下記から1つチョイスする。【1】自分のデッキから『不滅の聖剣・デュランダル』1枚を探し、手札に加える。【2】自分の手札の『不滅の聖剣・デュランダル』1枚を場に出してよい。"
  - id: sha256:fa2a3fbcedac5333010c6a210896f3caec191577254015a972b0e04b4f7d1aff
    raw: "{ファンファーレ}『ミスティックアーティファクト』1体を出す。"
  - id: sha256:fcce69518173fecb65f10b6eb03da63b413e19df0b0e9e46fc9b469a88364f28
    raw: "{進化}{コスト1}：これは進化する。"
  - id: sha256:ff7fff0e3c1812ed3cefb107d7b4b28ae4000033e275ddef8f16ea2a30617fbb
    raw: これがいる限り、自分の場の『操り人形』すべては【指定攻撃】を持つ。
  - id: sha256:fffa2a1212da8bbeec0b5fa2164240453067af0a84c049e54fc3a4491f55a01f
    raw: "{ファンファーレ}相手の場のフォロワー1体を選ぶ。それは{攻撃力}-2する。"
