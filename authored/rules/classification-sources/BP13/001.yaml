  - id: sha256:f76471104df13af33daedde690993896a79569796dae93cd92b39f3a2bf97f86
    raw: 下記から2つまでチョイスする。【1】自分の場の『九火石炎・セッカ』1体を選ぶ。自分の消滅領域が9枚以上なら、それは{攻撃力}+2/{体力}+2して、【疾走】を持つ。【2】自分の場の「カード名に『セッカ』を含むフォロワー」1体と相手の場のフォロワー1体を選ぶ。前者は{攻撃力}+2/{体力}+2する。後者に「前者の攻撃力」と同じダメージ。
