cards:
  BP19-110:
    lint_exceptions:
      - rule: required_choose_use_targets
        line: 2
        path: "/fanfare/do/1/choose"
        reason: "從結算時該次看牌所見的牌中選取。"
    abilities:
      - line: 1
        evolve:
          cost:
            pp: 4
      - line: 2
        fanfare:
          do:
            - look:
                bind: seen
                top: { who: self, n: 8 }
            - choose:
                bind: picked
                from: { in: seen }
                n: 1
            - move:
                ref: picked
                result: taken
                to: hand
            - move:
                ref:
                  in: seen
                  except:
                    in: { objects_of: taken, view: before }
                to: deck
                position: bottom
                order: shuffle
    deck_rule:
      when: self_in_main
      decks: [main, evolve]
      exclude_name_contains: カットスロート
      same_name_max: 1
    admission: light
format: 2
kind: author_effect_set
