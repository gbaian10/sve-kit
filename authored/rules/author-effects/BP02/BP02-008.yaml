            pp: 2
      - line: 2
        fanfare:
          do:
            - look:
                bind: seen
                top:
                  who: self
                  n: 2
            - choose:
                bind: picked
                from:
                  any_of:
                    - { in: seen, kind: follower, trait: クリスタリア }
                    - { in: seen, kind: follower, trait: 妖精 }
                n: 1
                may: true
            - move:
                ref: picked
                to: hand
                result: moved
            - reveal:
                ref: picked
                bind: shown
            - move:
                ref:
                  in: seen
                  except:
                    in: { objects_of: moved, view: before }
                to: deck
                position: bottom
                order: chooser
