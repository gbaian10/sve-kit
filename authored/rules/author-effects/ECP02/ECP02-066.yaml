                cond:
                  cmp:
                    left:
                      dice: die
                    op: eq
                    right: 2
                then:
                  - damage:
                      to:
                        leaders: opponents
                      n: 3
                  - life:
                      who: self
                      delta: 3
            - if:
                cond:
                  cmp:
                    left:
                      dice: die
                    op: eq
                    right: 3
                then:
                  - choose:
                      bind: strongest
                      by: opp
                      from:
                        who: opp
                        zone: field
                        kind: follower
                        where:
                          cmp:
                            left:
                              power_of: item
                            op: eq
                            right:
                              agg:
                                of:
                                  who: opp
                                  zone: field
                                  kind: follower
                                attr: power
                                fn: max
                      n: 1
                  - move:
                      ref: strongest
                      to: cemetery
