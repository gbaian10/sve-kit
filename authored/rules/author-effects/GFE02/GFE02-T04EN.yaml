format: 2
kind: author_effect_set
cards:
  GFE02-T04EN:
    admission: light
    abilities:
      - line: 1
        auto:
          on: { phase: { whose: self, which: end } }
          targets:
            - bind: summoned
              from: { who: self, zone: cemetery, kind: follower }
              n: 1
          do:
            - if:
                cond: { cmp: { left: { orig_cost_of: summoned }, op: le, right: 5 } }
                then:
                  - move: { ref: summoned, to: field, result: entered }
            - if:
                cond: { necro: 20 }
                then:
                  - move: { ref: summoned, to: field, result: charged_entry }
                  - move: { ref: this, to: cemetery }
