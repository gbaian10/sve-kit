format: 2
kind: author_effect_set
cards:
  GFE02-013EN:
    admission: light
    abilities:
      - line: 1
        evolve_time:
          do:
            - look: { top: { who: self, n: 5 }, bind: seen }
            - choose:
                bind: follower
                from: { in: seen, kind: follower }
                upto: 1
            - move: { ref: follower, to: ex, result: stored }
            - move:
                ref: { in: seen, except: { in: { objects_of: stored, view: before } } }
                to: deck
                position: bottom
                order: chooser
            - if:
                cond: { necro: 10 }
                then:
                  - apply:
                      on: { follow: stored }
                      effect: { cost_mod: { when_playing: { in: affected }, delta: -3 } }
                      until: turn
