format: 2
kind: author_effect_set
cards:
  BP12-107:
    admission: light
    meta:
      written_by:
        - actor:
            who: Claude
            model: claude-opus-5-5
          date: "2026-11-02"
    abilities:
      - line: 1
        spell:
          do:
            - look:
                bind: seen
                top:
                  who: self
                  n: 3
            - choose:
                bind: picked
                from:
                  any_of:
                    - { in: seen, trait: 荒野 }
                    - { in: seen, trait: 自然 }
                n: 1
                may: true
            - move:
                ref: picked
                to: hand
                result: moved
            - reveal:
                ref: picked
                bind: shown
            - move:
                ref:
                  in: seen
                  except:
                    in:
                      objects_of: moved
                      view: before
                to: deck
                position: bottom
                order: chooser
            - if:
                cond:
                  any:
                    - exists: { who: self, zone: field, trait: 荒野 }
                    - exists: { who: self, zone: ex, trait: 荒野 }
                then:
                  - life:
                      who: self
                      delta: 1
