cards:
  BP08-SL15:
    abilities:
      - body:
          op: seq
          steps:
            - bind: seen
              count: 7
              op: look
            - bind: chosen
              distinct_by: name
              max: 4
              min: 0
              op: select
              select:
                from: seen
                type: follower
                where:
                  args:
                    - args:
                        - read: item.class
                        - ナイトメア
                      fn: eq
                    - args:
                        - read: item.cost
                        - 6
                      fn: le
                  fn: and
            - bind: entered
              op: move
              subjects: chosen
              to: field
            - op: seq
              steps:
                - bind: ordered
                  max:
                    count:
                      difference:
                        - seen
                        - entered
                  min:
                    count:
                      difference:
                        - seen
                        - entered
                  op: select
                  order: true
                  select:
                    difference:
                      - seen
                      - entered
                - op: move
                  position: bottom
                  subjects: ordered
                  to: deck
            - op: destroy
              subjects: entered
        event: enter
        kind: trigger
        line: 1
        subject: self
    status: complete
format: 1
kind: effect_set
