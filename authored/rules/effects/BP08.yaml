cards:
  BP08-SL15:
    abilities:
      - body:
          op: seq
          steps:
            - bind: seen
              count: 7
              op: look
            - bind: chosen
              distinct_by: name
              max: 4
              min: 0
              op: select
              select:
                from: seen
                type: follower
                where:
                  args:
                    - args:
                        - read: item.class
                        - ナイトメア
                      fn: eq
                    - args:
                        - read: item.cost
                        - 6
                      fn: le
                  fn: and
            - bind: entered
              op: move
              subjects: chosen
              to: field
            - op: seq
              steps:
                - bind: ordered
                  max:
                    count:
                      difference:
                        - seen
                        - entered
                  min:
                    count:
                      difference:
                        - seen
                        - entered
                  op: select
                  order: true
                  select:
                    difference:
                      - seen
                      - entered
                - op: move
                  position: bottom
                  subjects: ordered
                  to: deck
            - op: destroy
              subjects: entered
        event: enter
        kind: trigger
        line: 1
        subject: self
    status: complete
  BP08-SL19:
    abilities:
      - body:
          op: evolve
          subjects: self
        costs:
          - amount: 2
            op: pp
        kind: evolve
        line: 1
      - body:
          op: seq
          steps:
            - bind: declared
              op: declare_number
            - bind: milled
              op: move
              subjects:
                side: self
                top: 5
                zone: deck
              to: cemetery
            - amount:
                count:
                  from: milled
                  where:
                    args:
                      - read: item.cost
                      - read: declared
                    fn: eq
              op: damage
              subjects:
                side: opponent
                type: follower
                zone: field
        event: enter
        kind: trigger
        line: 2
        subject: self
    status: complete
format: 1
kind: effect_set
