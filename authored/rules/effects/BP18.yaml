cards:
  BP18-001:
    abilities:
      - body:
          op: evolve
          subjects: self
        costs:
          - amount: 1
            op: pp
        kind: evolve
        line: 1
      - body:
          op: rule_override
          rule: evolve_per_turn
          side: self
          value: unlimited
        kind: static
        line: 2
      - body:
          op: seq
          steps:
            - op: move
              subjects: target.1
              to: ex
            - amount: -2
              op: adjust_cost
              subjects: target.1
              until: end-of-turn
        event: enter
        kind: trigger
        line: 3
        subject: self
        targets:
          - key: "1"
            max: 1
            min: 1
            select:
              side: self
              trait: 透京
              zone: cemetery
    status: complete
  BP18-007:
    abilities:
      - body:
          condition:
            args:
              - read: self.turn.cards_played
              - 3
            fn: ge
          from:
            - cemetery
          op: play_permission
          subjects: self
        kind: static
        line: 1
      - body:
          amount: 1
          op: damage
          subjects: target.1
        event: leave
        kind: trigger
        line: 2
        subject: self
        targets:
          - key: "1"
            max: 1
            min: 1
            select:
              side: opponent
              type: follower
              zone: field
        trigger_if:
          read: self.is_active
      - body:
          op: seq
          steps:
            - amount: 1
              op: damage
              subjects: target.1
            - condition:
                args:
                  - read: self.entered_from
                  - hand
                fn: ne
              op: if
              then:
                op: move
                position: bottom
                subjects: self
                to: deck
        event: enter
        kind: trigger
        line: 3
        subject: self
        targets:
          - key: "1"
            max: 1
            min: 1
            select:
              side: opponent
              type: follower
              zone: field
    status: complete
  BP18-SL16:
    abilities:
      - body:
          name: guard
          op: macro
        kind: static
        line: 1
      - body:
          from: field
          op: replace_move
          replacement: banish
          subjects:
            side: opponent
            type: follower
            zone: field
          to: cemetery
        kind: static
        line: 2
      - body:
          op: seq
          steps:
            - amount: 8
              op: damage
              subjects:
                side: opponent
                type: follower
                zone: field
            - amount: 4
              op: damage
              subjects: opponent.leader
        event: enter
        kind: trigger
        line: 3
        subject: self
    status: complete
  BP18-SP01:
    abilities:
      - body:
          max: 1
          min: 0
          op: search
          select:
            side: self
            where:
              args:
                - args:
                    - read: item.class
                    - ロイヤル
                  fn: eq
                - args:
                    - read: item.cost
                    - 1
                  fn: eq
              fn: and
            zone: deck
          to: ex
        event: enter
        kind: trigger
        line: 1
        subject: self
      - body:
          op: seq
          steps:
            - op: act
              subjects: target.1
            - op: box
              subjects: target.1
              until: next-controller-end
        costs:
          - amount: 0
            op: pp
        kind: activated
        limit: 1
        line: 2
        targets:
          - key: "1"
            max: 1
            min: 1
            select:
              side: opponent
              type: follower
              zone: field
    status: complete
format: 1
kind: effect_set
