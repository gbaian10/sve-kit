  BP19-P31:
    status: complete
    review: E27 「1枚を場に出してよい」以單次 min:0／max:1 選擇表達；不另插入是否執行的輸入點。
    abilities:
      - line: 1
        kind: trigger
        body:
          op: seq
          steps:
            - op: look
              count: 9
              bind: seen
            - op: reveal
              subjects: seen
              to: all
            - op: shuffle
              subjects: seen
            - op: move
              subjects: seen
              to: deck
              position: bottom
            - op: if
              condition:
                fn: eq
                args:
                  - fn: distinct
                    args:
                      - values: seen
                        field: name
                  - 9
              then:
                op: seq
                steps:
                  - op: move
                    subjects: self
                    to: cemetery
                  - op: seq
                    steps:
                      - op: optional
                        selection:
                          select:
                            side: self
                            zone: evolve_deck
                            name: 流転の統治者・ゼラエル
                          min: 1
                          max: 1
                          bind: chosen
                        then:
                          op: move
                          subjects: chosen
                          to: field
                          bind: placed
        event: enter
        subject: self
