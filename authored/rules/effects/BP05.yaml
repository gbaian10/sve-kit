        event: enter
        kind: trigger
        line: 2
        subject: self
      - body:
          op: seq
          steps:
            - op: move
              subjects: target.1
              to: deck
            - op: shuffle
              subjects:
                side: self
                zone: deck
        event: field_to_cemetery
        kind: trigger
        line: 3
        subject: self
        targets:
          - key: "1"
            max:
              count:
                name: 魔導電磁サイ
                side: self
                zone: cemetery
            min: 0
            select:
              name: 魔導電磁サイ
