                      - op: move
                        subjects: chosen
                        to: hand
                - op: seq
                  steps:
                    - bind: ordered
                      max:
                        count:
                          difference:
                            - seen
                            - chosen
                      min:
                        count:
                          difference:
                            - seen
                            - chosen
                      op: select
                      order: true
                      select:
                        difference:
                          - seen
                          - chosen
