# SD07-010 是 BP07-U02 的同名新印刷，把條件從「選ぶ」前面移到後面。
note: revision 1 於 2026-09-27 決定；revision 2 納入維護者 2026-10-19 的三組版次共用判斷，保留 generalized 與既有證據、applies_to 順序。 尾端四個模板依序對應 BP13-030、SD07-010、BP20-R11、BP20-R01 的相關能力，不含各卡其他能力；三個舊版次模板已在原清單內。 這次僅追加維護者點名的模板；其他同句型的新寫法依文序處理，不需要本裁定，不在此全面補登。 艾茲迪亞（BP20-R01）的條件同時管轄變成護符與後續賦予能力，不成立時兩者皆不處理；段落範圍依 R-0002／R-0007 的既有 official 裁定。 這是裁定紀錄，不表示原 DSL 已遷移或引擎已實作選擇省略；省略玩家輸入的等價條件見 docs/dsl/engine-boundaries.md。 revision 3 只把 applies_to 改成明示舊適用域，裁定內容不變；沒有提升證據強度或授予可執行資格。
