format: 2
kind: ruling
id: R-0004
revision: 2
question: 條件寫在「選ぶ」前面（「〜なら、…選ぶ」）時，打出時條件不成立還要不要選目標？
decision: 目標照選、條件結算時判（選項 B）：依 10.6.2.3.1 能選就得選；條件在結算時判，只管效果、不管選擇。一般條件 capture C.live，SC／NC 門檻 C.at-resolution。選取不能搬入條件分支；條件不成立只略過其管轄的效果，選取仍可能誘發能力。
evidence:
  - {ref: Q885, kind: direct, quote: "いいえ。「1枚引く」や「自分のPPを2回復する」より前に、相手の場のフォロワーを1体まで選ぶ必要があります。（0体を選ぶことはできます。）\n能力によって目標を選ぶ場合、その能力をプレイする際に目標を選びます。その後テキストの効果を表記の順に従って実行します。", question: 自分のエンドフェイズが来たとき、自分の残りPPが4の場合、『アーツマスター・カルラ（EVOLVE）』の能力によってPPを2回復し（この時点で残りPPは6）、その後1枚引いて、その内容を確認してから、相手の場のフォロワーを選ぶことができますか？, date: '2023-07-13'}
  - {ref: Q884, kind: supporting, quote: "いいえ。1枚引く前に、相手の場のフォロワーを1体まで選ぶ必要があります。（0体を選ぶことはできます。）\n能力によって目標を選ぶ場合、その能力をプレイする際に目標を選びます。その後テキストの効果を表記の順に従って実行します。", question: 自分のエンドフェイズが来たとき、自分の残りPPが6の場合、1枚引いて、その内容を確認してから、相手の場のフォロワーを選ぶことができますか？, date: '2023-07-13'}
  - {ref: Q2121, kind: supporting, quote: いいえ。できません。カードや能力によって目標を選ぶ場合、そのカードや能力をプレイする際に目標を選びます。今回の場合はチョイスによる選択肢を決定した後、目標を選びます。その後、能力に示された効果を、表記の順にしたがって実行します。, question: このフォロワーの《ファンファーレ》能力で【1】と【3】をチョイスした場合、【3】の効果を解決して引いたカードの内容を確認してから、【1】の効果を解決し、相手の場のフォロワー1体を選んで破壊することができますか？, date: '2025-07-07'}
  - {ref: Q1373, kind: supporting, quote: いいえ。自分の場に他のフォロワーがいる場合、相手の場のフォロワーを選ぶことができたとしても、「自分の場に他のフォロワーがいないなら、」以降の効果は働かず、1枚引くことができません。, question: 自分の場に他のフォロワーがいる場合でも、「《ファンファーレ》相手の場のフォロワー1体を選ぶ。自分の場に他のフォロワーがいないなら、それを破壊する。1枚引く。」という能力によって、1枚引くことはできますか？, date: '2024-04-26'}
  - {ref: Q1611, kind: supporting, quote: いいえ。自分のリーダーの体力を+4以上していない場合、それ以降の効果は働かず、1枚引くことができません。, question: このターン中に自分のリーダーの体力を+4以上していない場合でも、このフォロワーの《ファンファーレ》能力によって相手の場のフォロワーを選ぶことで、1枚引くことはできますか？, date: '2024-09-20'}
  - {ref: SD07-010, kind: supporting, quote: '{ファンファーレ}相手の場のフォロワー1体を選ぶ。自分の墓場の{ロイヤル}フォロワーが5枚以上なら、それを破壊する。', date: '2025-06-27'}
  - {ref: BP07-U02, kind: supporting, quote: '{ファンファーレ}自分の墓場の{ロイヤル}フォロワーが5枚以上なら、相手の場のフォロワー1体を選ぶ。それを破壊する。', date: '2023-10-27'}
  - {ref: CR 10.6.2.3.1, kind: supporting, quote: "10.6.2.3.1. 選ぶ数が指定されている場合、それ\nが可能な限りその数になるまで目標を選ぶ\n義務があります。選ぶことができる場合に、\n選ばないことを選択することはできません。", version: 1.27.0}
