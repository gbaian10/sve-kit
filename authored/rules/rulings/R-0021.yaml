format: 2
kind: ruling
id: R-0021
revision: 2
question: レリア的交戰體力傷害基準是否也適用於其控制者的從者被攻擊時造成的反擊傷害？
decision: 本專案解讀為雙向適用：受到規則影響的從者，在攻擊或防守的同一次交戰中，都按交戰傷害處理前的目前體力取代攻擊力。能力傷害不受影響。
evidence:
  - ref: BP01-129
    kind: supporting
    url: https://shadowverse-evolve.com/cardlist/?cardno=BP01-129
    note: 日文卡文修改己方從者造成傷害時使用的數值，沒有把適用者限定為攻擊方；BP01-130 有相同常在能力。
  - ref: Q226
    kind: supporting
    url: https://shadowverse-evolve.com/cardlist/?cardno=BP01-129
    note: 日文 Q226 與 Q227 明確排除 Jeanne 的能力傷害，但未直接問答防守方的交戰傷害。
  - ref: Q233
    kind: direct
    url: https://shadowverse-evolve.com/cardlist/?cardno=BP01-137
    question: 自分の場にこのフォロワーと『アークビショップ・レリア』があるとき、このフォロワーが攻撃フォロワーに与えるダメージは、このフォロワーの《体力》の数値に+4された数値ですか？
    quote: はい。その通りです。
    date: "2022-04-26"
  - ref: Q226-EN
    kind: supporting
    url: https://en.shadowverse-evolve.com/cards/?cardno=BP01-129EN
    note: 英文問答以 when attacking 與能力傷害作對比，可能被讀成僅限攻擊方；沒有防守反擊的直接官方確認。
strength: official
decided_on: "2026-11-18"
applies_to: [L.rule-modifier]
hint:
  zh-TW: レリア也讓己方防守從者按交戰前體力反擊（官方 Q233）；能力傷害維持原數值。
  ja: レリアは自分の防御側フォロワーにも適用され、交戦前の体力でダメージを与えます（公式Q233）。能力ダメージは変更しません。
  en: "Lelia also makes your defending followers deal combat damage using their health before combat damage is applied (official Q233); ability damage is unchanged."
note: revision 2 補官方 Q233（BP01-137：防守方對攻擊從者的傷害以體力計），行為不變。
