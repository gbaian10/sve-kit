hint:
  zh-TW: 官方確認：先決定選項、目標、X 與各選項是否付費，在打出時支付卡片費用及所選追加費用，再依卡面順序結算。拒付則該段效果不適用；所選費用付不起時取消打出。
  ja: 公式確認：選択肢・目標・Xと各選択肢の追加コストを支払うかを決め、プレイ時にカードのコストと選んだ追加コストを支払った後、テキスト順に解決します。支払わない場合はその効果を適用せず、選んだコストを支払えない場合はプレイを取り消します。
note: 維護者已於 2026-10-09 向官方確認路線 B；只登錄結論。在クレスト『混融の継承者・シャム＝ナクア』允許チョイス時改為選任意數量的效果有效時，『鋼鉄の希望』同時選【1】【2】，打出時先合計支付卡片費用 1PP 與【2】的選項費用 6PP，共 7PP，之後依【1】【2】順序結算。社群證據僅保留為歷史紀錄，不作為依據；Q2623、Q796、Q551、Q698、Q699 的拒付與追加費用結論仍成立。 revision 2 只把 applies_to 改成明示舊適用域，裁定內容不變；沒有提升證據強度或授予可執行資格。
