hint:
  zh-TW: 本專案解讀（依 CR 10.4.7.4）：スペル本文或チョイス選項裡的「（処理）：（効果）」，結算到那一段時才決定付不付；選項、目標、X 仍在打出時決定。官方沒有直接區分兩種時點的 Q&A。
  ja: 本プロジェクトの解釈（総合ルール10.4.7.4による）：スペルの本文やチョイスの選択肢にある「（処理）：（効果）」は、解決時にその段落に達した時点で支払うかどうかを決めます。選択肢・目標・Xはプレイ時に決定します。2つのタイミングを直接区別する公式Q&Aはありません。
note: '社群：英文社群回覆 A；中文社群一則支持 A、一則以 10.6.2.2 暗示 B；官方給出答案時重審。Q2623、Q796、Q551、Q698、Q699（kind: terminology）稱之為「追加コスト」，用詞偏向打出時，但各題局面在兩路線下結果相同，不能區分。'
route_b_changes: 若改為路線 B（打出時）：決定與付款移到プレイ前提（10.6.2.2）與プレイ費用（10.6.2.5）階段，付款事件移到「プレイされた」事件之前，付不起走プレイ取消（10.6.2.5.4）；標註改 A.optional-cost／A.cost＋D.play-param{OptionalCost}＋K.pay(at=PlayParameter)，tests/rules-scenarios/questions/card-BP19-090.yaml 的決定流程要改。
