format: 1
kind: ruling
id: R-0006
question: スペル本文或チョイス選項裡的「（処理）：（効果）」，是打出時決定付不付（可選追加費用），還是結算處理到該處時才決定並支付？
decision: 路線 A（本專案解讀）：結算處理到該費用時才決定付不付並支付（CR 10.4.7.4），作者 A.pay、IR K.pay(at=ResolutionChoice)＋D.resolve-choice。邊界：(1) 選項本身、目標、X 值仍在打出時決定（CR 5.18.3、10.6.2.2.3、10.6.2.2.4；Q2006 X 在プレイ時指定；Q1715、Q1543 目標先選）；(2) 不適用於卡文明寫「プレイする際」的追加費用（CR 10.4.7.2，例 Q2049 奏絶の独唱）與【土の秘術】（CR 13.3.3.2 展開為プレイ時追加コスト，Q273、Q292），這些是打出時；(3) 付款事件發生在「プレイされた」事件之後；費用引發的能力照檢查時點規則等待，不在選項之間插隊（Q939）。
evidence:
  - {ref: CR 10.4.7.4, kind: direct, quote: "10.4.7.4. 上記以外でカードや能力に‘（処理）：（効\n果）’と書かれている場合、そのカードや能力\nの解決する際にその処理を実行することで、\nその効果を適用することを選択することができ\nます。", version: 1.27.0}
  - {ref: CR 10.4.7.2, kind: supporting, quote: "10.4.7.2. 何らかのカードや能力を‘プレイする際、\n（処理）：（効果）’と書かれている場合、これは\nそのカードや能力をプレイする際にコストとし\nてその処理を実行することでその効果を適用\nすることを選択できる選択肢（10.6.2.2）を意味\nします。", version: 1.27.0}
  - {ref: CR 10.6.2.2.2, kind: supporting, quote: "10.6.2.2.2. これには‘任意である追加コストの支\n払いを行うか否か’が含まれます。", version: 1.27.0}
  - {ref: CR 5.18.3, kind: supporting, quote: "5.18.3. チョイスする行動でどの選択肢を採用するかを決\n定する処理は、プレイのための前提となる選択肢\n（10.6.2.2）です。そのため、チョイスする行動による\n選択はプレイの段階で行う義務があります。", version: 1.27.0}
  - {ref: CR 10.6.2.8.2.2, kind: supporting, quote: "10.6.2.8.2.2. チョイスする（5.18）処理により\n複数の選択肢を選んだ場合、各選択\n肢はテキストに表記の順で実行しま\nす。", version: 1.27.0}
  - {ref: CR 10.6.2.2.3, kind: supporting, quote: "10.6.2.2.3. そのカードや能力内で、チョイスする\n行動の選択肢の数およびどの選択肢を採\n用するかを決定する必要がある場合、その\n数と選択肢を決定します（5.18）。", version: 1.27.0}
  - {ref: CR 10.6.2.2.4, kind: supporting, quote: "10.6.2.2.4. この時点でこれ以降の処理のために\nX で示される数値を決定する必要があり、\nそれがまだ決定していない場合、その数値\nを決定します（5.2）。", version: 1.27.0}
  - {ref: Q2006, kind: supporting, quote: はい。能力テキストの中でXの値について指定されていない場合、この能力をプレイするプレイヤーが任意の値で指定することができます。このXの値はスペルをプレイする時に指定します。またXの値として0を指定することもできます。, question: このスペルのXは、このスペルをプレイするプレイヤーが任意の値を指定することができますか？, date: '2025-04-07'}
  - {ref: Q1715, kind: supporting, quote: いいえ。カードや能力によって目標を選ぶ場合、そのカードや能力をプレイする際に目標を選びます。そのため【1】と【3】をチョイスした場合、相手の場のフォロワー1体を先に選択し、その後カードを2枚引き、選択したフォロワーに3ダメージを与えます。, question: 自分の場に魔法使い・フォロワーが2体いる状況で、【1】と【3】をチョイスして『真実の宣告』をプレイしました。この場合、【1】の効果によって2枚引いて、その内容を確認してから、相手の場のフォロワー1体を選択することができますか？, date: '2024-11-08'}
  - {ref: Q1543, kind: supporting, quote: いいえ。コストを支払う前に目標を選ぶ必要があるため、選ぶことはできません。, question: このフォロワーの【進化時】能力で墓場のカードを選ぶとき、このフォロワーの【進化時】能力のコストで捨てたカードを選ぶことはできますか？, date: '2024-08-20'}
  - {ref: Q2049, kind: supporting, quote: はい。プレイすることができます。その場合、相手の場のフォロワー1体を選び、『奏絶の独唱』は墓場に置かれます。（『奏絶の独唱』はトークンなので、墓場に置かれた直後に消去されます。）, question: 相手の場にフォロワーが1体いる場合、追加コストとして場のアイドル・カードをアクトすることなく、『奏絶の独唱』をプレイすることはできますか？, date: '2025-04-07'}
  - {ref: Q273, kind: supporting, quote: はい。『ゴーレムプロテクション』をプレイする際にPPや【土の秘術】でのコストを支払うため、先にアミュレットが墓場に置かれ、『ゴーレムプロテクション』の効果で『防御型ゴーレム』が2体場に出ます。その後、ゴーレム・フォロワーすべてを《攻撃力》+1/《体力》+1します。, question: 自分の場にカードが4枚あり、そのうちの1枚はスタックカウンター1つが置かれているアミュレットのとき『ゴーレムプロテクション』をプレイしました。その場合『防御型ゴーレム』は2体場に出ますか？, date: '2022-05-19'}
  - {ref: Q292, kind: supporting, quote: はい。能力をプレイするより先にコストが支払われ、かつスタックカウンターが0となったアミュレットが墓場に置かれるため、自分の場は上限ではなくなり『攻撃型ゴーレム』は場に出ます。, question: 【スタック】を持ち、スタックカウンターが1つ置かれたアミュレット1枚を含めたカードが自分の場に5枚あり、このフォロワーの【進化時】能力をプレイしたとき、『攻撃型ゴーレム』は場に出ますか？, date: '2022-06-24'}
  - {ref: Q939, kind: supporting, quote: "『村上巴』が場に出た後に、任意の順番で解決することができます。\n『村上巴』のプレイによりコストを支払い場に出るまでの過程において、『光の道筋』と『村上巴』の能力がそれぞれ誘発し待機状態になります。その後、待機状態になった能力を任意の順番で解決します。", question: プレイする際の追加コストとして『光の道筋』を捨てて『村上巴』をプレイした場合、『光の道筋』の能力と『村上巴』の《ファンファーレ》能力はどのように解決しますか？, date: '2023-08-18'}
  - {ref: Q2623, kind: terminology, quote: はい。コストを支払わないことで、何も起こらないことを選択できます。, question: 【2】をチョイスし、コストを支払わずに何も起こらないことを選択できますか？, date: '2026-04-09'}
  - {ref: Q796, kind: terminology, quote: "はい。相手の場のフォロワーを選ぶことができれば、プレイすることができます。その場合、任意の追加コストである「場の狩人・フォロワー2体を《アクト》」を支払うことなく、効果を適用しません。\nまた、自分の場に狩人・フォロワーが2体以上いる場合でも、相手の場のフォロワーを選ぶことさえできれば、任意の追加コストである「場の狩人・フォロワー2体を《アクト》」を支払うことなく、効果を適用しない選択をし、プレイすることができます。", question: 自分の場に狩人・フォロワーがいない場合、相手の場のフォロワーを選んでこのスペルをプレイすることはできますか？, date: '2023-06-09'}
  - {ref: Q551, kind: terminology, quote: はい。チョイスで選択した能力の追加コストを支払わず、プレイするためのPPのみを支払ってプレイすることができます。その場合、チョイスした能力の効果は処理されません。, question: このスペルはテキストにある追加のコストを支払わない選択をすることによって、実質的に効果を得ることはなく、1コスト支払うのみでプレイすることはできますか？, date: '2022-12-09'}
  - {ref: Q698, kind: terminology, quote: いいえ。追加コストを0にすることはできません。, question: 『マーリン（EVOLVE）』の能力で『破壊の歌声』をプレイし【2】の選択肢をチョイスした場合、その追加コストである《コスト2》も0にしてプレイすることはできますか？, date: '2023-04-21'}
  - {ref: Q699, kind: terminology, quote: "はい。プレイすることができます。詳細は以下をご覧ください。\n\nプレイするための前提の選択肢である「チョイスする」において、【1】と【2】のどちらを選択するかによって結果が異なります。（デッキのシャッフルを行うか否かの選択ができます。）\n「チョイスする」において【1】を選択した場合\n┗自分のデッキから『破壊の絶傑・リーシェナ』1枚を探す際に、見つけず、手札に加えないことを選択します。その後、デッキをシャッフルします。\n「チョイスする」において【2】を選択した場合\n┗「《コスト2》：相手の場のフォロワーすべてに～」の任意のコストである《コスト2》を支払わず、効果を適用しないことを選択します。", question: 実質的に効果を得ることなく『破壊の歌声』をプレイすることができますか？, date: '2023-04-21'}
  - {ref: community-zh-2026-09-27, kind: community, quote: 多選效果是先選定要發哪些效果，然後再依照順序依序發動, date: '2026-09-27'}
  - {ref: community-en-2026-09-27, kind: community, quote: （英文社群回覆路線 A：付款在該選項結算時決定）, date: '2026-09-27'}
  - {ref: community-zh-2026-09-27b, kind: community, quote: 你都翻規則了 那我猜你的問題 10.6.2.2 可以回答, date: '2026-09-27', note: 暗示依 10.6.2.2.2（プレイ前提含是否支付任意追加コスト）走路線 B；本裁定認為 10.6.2.2.2 適用於明寫「プレイする際」的追加費用（10.4.7.2）與土の秘術，一般「（処理）：」屬 10.4.7.4}
