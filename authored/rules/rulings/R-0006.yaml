hint:
  zh-TW: 官方確認：先決定選項、目標、X 與各選項是否付費，在打出時支付卡片費用及所選追加費用，再依卡面順序結算。拒付則該段效果不適用；所選費用付不起時取消打出。
  ja: 公式確認：選択肢・目標・Xと各選択肢の追加コストを支払うかを決め、プレイ時にカードのコストと選んだ追加コストを支払った後、テキスト順に解決します。支払わない場合はその効果を適用せず、選んだコストを支払えない場合はプレイを取り消します。
note: 維護者已於 2026-10-09 向官方確認路線 B；只登錄結論。鋼鉄の希望選【1】【2】時，打出時合計支付 7PP。社群證據僅保留為歷史紀錄，不作為依據；Q2623、Q796、Q551、Q698、Q699 的拒付與追加費用結論仍成立。
