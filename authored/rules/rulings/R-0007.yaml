hint:
  zh-TW: 依 Q1506，「〜なら、代わりに…」的條件管到段落結尾；條件不成立，後面的句子也不做。
  ja: Q1506より、「～なら、代わりに…」の条件は段落の終わりまでかかります。満たさない場合、それ以降の効果は働きません。
