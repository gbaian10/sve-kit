format: 2
kind: ruling
id: R-0007
revision: 2
question: 「…なら、代わりに…。（獨立句）」後面的獨立句受不受條件管？【コンボ】【ネクロチャージ】【スペルチェイン】接「代わりに」時同。
decision: '管到段落結尾（選項 A）：沒達成條件，後句也不做；是已裁定 #4 的延伸，「代わりに」與【コンボ】等關鍵字條件同樣適用。'
evidence:
  - {ref: Q1506, kind: direct, quote: いいえ。自分の場に『ファントムデュオ・バニー＆バロン』と『魔導四輪車・V』がない場合、それ以降の効果は働かず、それのリーダーに2ダメージを与えることができません。, question: 自分の場に『ファントムデュオ・バニー＆バロン』と『魔導四輪車・V』がない場合でも、相手の場のフォロワー1体を目標に選択してこのスペルをプレイすることによって、それのリーダーに2ダメージを与えることはできますか？, date: '2024-08-20'}
  - {ref: Q1373, kind: supporting, quote: いいえ。自分の場に他のフォロワーがいる場合、相手の場のフォロワーを選ぶことができたとしても、「自分の場に他のフォロワーがいないなら、」以降の効果は働かず、1枚引くことができません。, question: 自分の場に他のフォロワーがいる場合でも、「《ファンファーレ》相手の場のフォロワー1体を選ぶ。自分の場に他のフォロワーがいないなら、それを破壊する。1枚引く。」という能力によって、1枚引くことはできますか？, date: '2024-04-26'}
  - {ref: Q1611, kind: supporting, quote: いいえ。自分のリーダーの体力を+4以上していない場合、それ以降の効果は働かず、1枚引くことができません。, question: このターン中に自分のリーダーの体力を+4以上していない場合でも、このフォロワーの《ファンファーレ》能力によって相手の場のフォロワーを選ぶことで、1枚引くことはできますか？, date: '2024-09-20'}
  - {ref: CR 13.2.1.2, kind: supporting, quote: "13.2.1.2. ‘【コンボ （数値）】（テキスト）’は‘このター\nン、あなたがこのカードを含めて（数値）枚以上\nのカードをプレイしていた場合、（テキスト）’を\n意味します。", version: 1.27.0}
  - {ref: CR 10.4.7.1, kind: supporting, quote: "10.4.7.1. このコストを支払った場合にのみ適用され\nる効果は、その文章の段落終わりまでか、チョ\nイスにおける選択肢区切り（5.18.1.1）までで\nす。", version: 1.27.0}
