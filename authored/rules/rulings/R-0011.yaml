format: 2
kind: ruling
id: R-0011
revision: 1
question: 持續效果條件翻轉、期限結束、種類還原或重算造成的攻擊力／體力差，算不算「+した／-した」？
decision: 不算：只有明示的數值處理（指示、進化以外的規則步驟如超進化 +1、領袖的傷害／回復／生命付款）才產生數值增減事件；持續條件翻轉、期限結束、操縦／箱詰め還原及查詢重算都不產生事件。
evidence:
  - {ref: Q2758, kind: supporting, quote: いいえ。進化による攻撃力と体力の増加によっては誘発しません。, question: 『浄火の令嬢』が進化した場合、進化による攻撃力と体力の増加によって、進化前および進化後の『浄火の令嬢』が持つ「これの《体力》を+したとき、相手の場のフォロワーすべてに1ダメージ。」という能力は誘発しますか？, date: '2026-07-27', note: 只直接回答進化；本裁定把「數值處理與派生資訊分離」的原則推到其他情境}
  - {ref: project, kind: project, reason: 明示數值處理與派生資訊分離；除進化外的重算、到期、還原都沒有直接 Q&A。, date: '2026-09-27'}
strength: inferred
decided_on: 2026-09-27
applies_to: [E.stat-change]
hint:
  zh-TW: 本專案解讀：持續效果重算或效果到期造成的數值變化，不算「增加／減少過」，不會誘發「+したとき」「-したとき」。
  ja: 本プロジェクトの解釈：継続効果の再計算や効果の終了による数値の変化は「+した／-した」には含めず、「+したとき」「-したとき」は誘発しません。
# Evolution (official, Q2758) and super evolution +1 (official, Q2759) are covered by ADR-0008, not by this ruling.
