id: R-0015
revision: 3
question: BP20-P65「代わりに好きな数チョイスする」可以選 0 個選項嗎？
decision: 不可以：選項數的範圍改為 1 到可用選項數，至少選 1 個。「好きな数」只放寬上限，「Nつまで」至少選 1 的下限照舊。
evidence:
  - ref: BP20-P65
    kind: supporting
    quote: 自分は1つ以上の選択肢をチョイスする際、代わりに好きな数チョイスする。
    date: "2026-05-22"
  - ref: Q2451-EN
    kind: direct
    url: https://en.shadowverse-evolve.com/cards/?cardno=BP20-P65EN
    question: When choosing "any number instead," can I choose 0?
    quote: No. You must choose at least 1 option.
    date: "2026-09-10"
