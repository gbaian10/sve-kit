format: 2
kind: ruling
id: R-0001
revision: 2
question: 【進化時】【超進化時】【攻撃時】【出走時】【ドライブ獲得時】後面直接接「（コスト）：」時，費用是打出能力時付，還是結算時才決定付不付？
decision: 整族打出時付（選項 A）：跟 {ファンファーレ} 一樣，先選目標再付費；付不起或拒付，這個能力就沒有打出。標註 cost_timing=PlayParameter，作者 A.cost，IR K.pay(at=PlayParameter)，費用材料選擇 D.play-param{CostMaterials}。
evidence:
  - ref: Q1910
    kind: direct
    quote: いいえ。自分の場の『竜山温泉』に神湯カウンターが置かれていない場合、【攻撃時】能力のコストを支払うことができないため、【攻撃時】能力をプレイすることができません。
    question: 自分の場の『竜山温泉』に神湯カウンターが置かれていない場合、『秘湯の山脈竜』の【攻撃時】能力をプレイすることができますか？
    date: "2025-02-10"
  - ref: Q642
    kind: direct
    quote: いいえ。目標を選ぶことができないため能力をプレイすることができず、コストの支払いとして手札を捨てることもできません。
    question: 自分の墓場に竜族・フォロワーがないとき、このフォロワーの【進化時】能力で手札を捨てることはできますか？
    date: "2023-03-08"
  - ref: Q303
    kind: direct
    quote: いいえ。コストを支払う前に目標を選ぶ必要があるため、選ぶことはできません。
    question: このフォロワーの能力で墓場のカードを選ぶとき、このフォロワーの能力のコストで捨てたカードを選ぶことはできますか？
    date: "2022-06-24"
  - ref: Q1543
    kind: direct
    quote: いいえ。コストを支払う前に目標を選ぶ必要があるため、選ぶことはできません。
    question: このフォロワーの【進化時】能力で墓場のカードを選ぶとき、このフォロワーの【進化時】能力のコストで捨てたカードを選ぶことはできますか？
    date: "2024-08-20"
  - ref: Q568
    kind: direct
    quote: はい。能力テキストの中でXの値について指定されていない場合、この能力をプレイするプレイヤーが任意の値で指定することができます。このXの値は、この【進化時】能力をプレイする時に指定します。またXの値として0を指定することもできます。
    question: このフォロワーの【進化時】能力にあるXは、この能力をプレイするプレイヤーが任意の値を指定することができますか？
    date: "2023-02-20"
  - ref: Q570
    kind: direct
    quote: はい。できます。この場合、効果は適用されないので何も起こらず、デッキをシャッフルすることはありません。
    question: このフォロワーの【進化時】能力のコストを支払わない選択をして、効果を適用しないことはできますか？
    date: "2023-02-20"
  - ref: Q1830
    kind: direct
    quote: いいえ。場以外の領域では「自分の墓場にウマ娘・カードが20枚以上ある限り、これは【疾走】と「【攻撃時】これは《攻撃力》+3/《体力》+3する」を持つ。」の効果は有効ではなく『エアシャカール』は【疾走】を持っていないので、『〔桃色のバックショット〕ナリタトップロード』の【攻撃時】能力のコストとして消滅させることができません。
    question: 『〔桃色のバックショット〕ナリタトップロード』の【攻撃時】能力をプレイする際、コストとして墓場の『エアシャカール』を消滅させることができますか？
    date: "2025-01-06"
  - ref: Q2467
    kind: direct
    quote: いいえ。《UB》能力が発動したことを満たしません。
    question: このフォロワーの《UB》【進化時】能力のコストを支払わない選択をした場合や、自分の墓場のフォロワーを選ぶことができずプレイできなかった場合、《UB》能力が発動したことを満たしますか？
    date: "2026-01-26"
  - ref: Q2471
    kind: direct
    quote: いいえ。《UB》能力が発動したことを満たしません。
    question: このフォロワーの《UB》【進化時】能力のコストを支払わない選択をした場合、《UB》能力が発動したことを満たしますか？
    date: "2026-01-26"
  - ref: Q1982
    kind: supporting
    quote: いいえ。《ファンファーレ》能力のコストである「場のトークン・フォロワー1体をEXエリアに置く」が実行できず、コストを支払うことができないので《ファンファーレ》能力をプレイすることができません。
    question: 自分のEXエリアが上限枚数の場合、《ファンファーレ》能力をプレイすることができますか？
    date: "2025-04-07"
  - ref: CR 10.1.1.2.2
    kind: supporting
    quote: "10.1.1.2.2. 自動能力の一部は、「（条件）とき、（コ\nスト）：（効果）」と表記されています。この場\n合、この自動能力をプレイするためには（コ\nスト）で示されたコストの支払いが必要で\nす。"
    version: 1.27.0
  - ref: CR 10.6.2.5.4
    kind: supporting
    quote: "10.6.2.5.4. なんらかの理由でこの時点でこのコス\nトを支払うことができない場合、このカード\nや能力のプレイは取り消され、ゲームはこ\nのカードや能力をプレイすることを選択する\n前まで戻されます。"
    version: 1.27.0
strength: generalized
decided_on: 2026-09-27
