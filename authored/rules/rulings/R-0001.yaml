hint:
  zh-TW: 依 Q1910、Q642，【進化時】【攻撃時】等後面的「（コスト）：」在打出這個能力時支付：先選目標再付費，付不起或不付，這個能力就沒有打出。
  ja: Q1910・Q642より、【進化時】【攻撃時】などの「（コスト）：」は能力をプレイする際に支払います。目標を選んでから支払い、支払えない、または支払わない場合、その能力はプレイされません。
# CR 10.4.7.3（「〜とき、（処理）：（効果）」在解決時選擇）字面指向結算時，本裁定依關鍵字誘發族的 Q&A 採打出時。
# 【超進化時】【出走時】【ドライブ獲得時】帶費用的情形沒有直接 Q&A，由同族類推（strength: generalized）。
# 費用只在チョイス選項內的 T01ac4a25c4、T6df9bfaff4、T23ef9c0ddb 屬第 6 族，不在 applies_to。
