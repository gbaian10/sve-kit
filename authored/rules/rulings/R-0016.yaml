format: 2
kind: ruling
id: R-0016
revision: 1
question: 「先選對象，再看條件」的效果，條件不成立時是否仍先選？舊版次的條件前置寫法與艾茲迪亞的後續賦予能力如何處理？
decision: >-
  DSL 以官方新寫法的順序為準：先選對象，再於結算處理到條件時檢查；條件不成立，不執行該條件管轄的效果，但不能倒推成沒有選過對象。
  適用的新寫法包括 BP13-030、SD07-010、BP20-R11、BP20-R01；選取可能誘發「被能力選擇時」的能力，不能一律把選擇搬入條件分支。
  維護者判定 BP07-021／SD07-010、BP05-070／BP20-R11、BP05-001／BP20-R01 的舊新版次意思相同，舊版次共用新寫法的 DSL，不因舊版次把條件寫在前面就改為條件成立才選。
  艾茲迪亞（BP20-R01）的條件同時管轄「それをアミュレットにする」與後續「それは「{起動}…」を持つ」；條件不成立時兩者皆不處理。
evidence:
  - ref: Q417
    kind: supporting
    quote: はい。スペルやアミュレット、フォロワーが持つ能力によって選ばれたときに誘発します。
    date: '2022-11-11'
    url: https://shadowverse-evolve.com/cardlist/?cardno=BP03-071&faq=
    note: ランスリザード的官方回答確認「被能力選擇」可誘發能力，未直接回答本裁定的條件排序或舊新版次等價問題。
  - ref: project
    kind: project
    reason: 維護者同意以新寫法作為 DSL 順序，列出的舊新版次共用該 DSL；艾茲迪亞的變成護符與賦予能力同屬條件範圍。這是專案判讀，沒有直接回答上述排序問題的官方 Q&A。
    date: '2026-10-19'
