hint:
  zh-TW: 本專案解讀：先選對象，結算時才檢查條件；不成立就不處理條件內效果，但選取仍可能誘發能力。列出的舊版次沿用新寫法；艾茲迪亞的變成護符與賦予能力都受條件限制。
  ja: 本プロジェクトの解釈：先に対象を選び、条件は解決時に確認します。満たさなければ条件内の効果は行いませんが、対象に選ばれたことによる能力は誘発し得ます。記載の旧版も新しい表記に従い、エズディアのアミュレット化と能力付与は両方とも条件に従います。
note: 維護者於 2026-10-19 決定；Q417 僅作選取事件可影響結果的旁證，strength 保持 inferred。applies_to 依序對應 BP13-030、SD07-010、BP20-R11、BP20-R01、BP07-021、BP05-070、BP05-001 的相關效果模板；不含各卡其他能力。這是裁定紀錄，不表示原 DSL 已遷移或引擎已實作選擇略過；略過條件見 docs/dsl/engine-boundaries.md。
