format: 2
kind: ruling
id: R-0005
revision: 1
question: 「【土の秘術】相手の場のフォロワー1体を選ぶ。それに3ダメージ。」沒付【土の秘術】時，還要不要選目標？
decision: '目標照選（選項 B）：目標在打出時照常選（選不到就不能選這一項或不能打出）；付費只決定效果有沒有。撤銷先前補的 targets[].if: {paid} 自指 branch。'
evidence:
  - {ref: Q2108, kind: direct, quote: いいえ。適切な目標を選ぶことができない場合、【2】をチョイスすることができず、【1】をチョイスする必要があります。, question: 相手の場のフォロワーを選ぶことができない場合、このフォロワーの《ファンファーレ》能力で【2】をチョイスし、何も起こらないことを選択できますか？, date: '2025-07-07'}
  - {ref: CR 13.3.3.2, kind: supporting, quote: "13.3.3.2. ‘【土の秘術 （数値）】（テキスト）’は‘この\nカードまたは能力をプレイする際に、追加コス\nトとして、【スタック】を持つあなたのいずれか\nのアミュレットに置かれているスタックカウン\nターを（数値）個取り除いてよい。これによりそ\nのアミュレットにスタックカウンターが置かれて\nいない状態になった場合、そのアミュレットを\n墓場に置く。追加コストとしてスタックカウン\nターを取り除いていたら、（テキスト）’を意味し\nます。", version: 1.27.0}
strength: official
decided_on: 2026-09-27
applies_to: [Tb0dfc669a0, T51b706db8f, T43fa67d13f, Tbf26a2e083, Ta8da8b705f, T12f5d4d6ce, Tf74444ac05]
hint:
  zh-TW: 依 Q2108，不管付不付【土の秘術】都要照常選目標；選不到目標就不能選這一項。付了才有效果。
  ja: Q2108より、【土の秘術】を行うかどうかに関わらず、目標は通常どおり選びます。適切な目標を選べない場合、その選択肢は選べません。
# CR 13.3.3.2 字面的（テキスト）含「選ぶ」，這是舊寫法的依據；Q2108 已處理具體情況。
