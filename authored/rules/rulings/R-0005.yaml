hint:
  zh-TW: 依 Q2108，不管付不付【土の秘術】都要照常選目標；選不到目標就不能選這一項。付了才有效果。
  ja: Q2108より、【土の秘術】を行うかどうかに関わらず、目標は通常どおり選びます。適切な目標を選べない場合、その選択肢は選べません。
