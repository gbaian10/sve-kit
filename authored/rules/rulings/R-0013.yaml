format: 1
kind: ruling
id: R-0013
question: BP08-011「それはそれぞれ『ロイド』と『ヴィクトリア』に変身する」只有一張成功消滅時，要建立哪一種 token？
decision: 依實際消滅數決定建立總量：兩張都成功就各一張（Q1061）；只成功一張時由執行玩家從兩種模板中選一種，每種至多一張；零張則不建立、不詢問。
evidence:
  - {ref: Q1061, kind: supporting, quote: "いいえ。『ロイド』2枚に変身させることはできません。\n選んだ『操り人形』のうち1枚が『ロイド』に変身し、もう1枚が『ヴィクトリア』に変身します。", question: 自分のEXエリアの『操り人形』2枚を目標に選び、『心無き決闘』をプレイした場合、選んだ『操り人形』2枚を『ロイド』2枚に変身させることはできますか？, date: '2023-12-15', note: 只直接回答兩張都成功的情況}
  - {ref: CR 5.17.1, kind: supporting, quote: "5.17.1. あるカードを‘『（トークン名）』に変身する’指示が\nある場合、そのカードを消滅し、新たにその領域に\n（ト―クン名）のトークンを、消滅したカードの枚数と\n同じ数作成します。", version: 1.27.0}
  - {ref: CR 1.3.2, kind: supporting, quote: "1.3.2. なんらかの理由によりプレイヤーが実行不可能なこ\nとを行うように求められた場合、それは単に行われ\nません。同様に、効果により一定の量の行動を行う\nよう求められた場合、その一部のみ実行不可能な\n場合、可能な限りその行動を行います。", version: 1.27.0}
  - {ref: project, kind: project, reason: 以 CR 1.3.2 的「可能な限り」為推論依據決定部分成功的處理；由誰選模板沒有直接 Q&A。, date: '2026-09-27'}
strength: inferred
decided_on: 2026-09-27
applies_to: [Ta1bd9d2ec5]
hint:
  zh-TW: 本專案解讀：兩張都消滅成功時各變成一種（依 Q1061）；只有一張成功時，由執行玩家選要建立哪一種。
  ja: 本プロジェクトの解釈：2枚とも消滅した場合はそれぞれ1枚ずつ変身します（Q1061）。1枚だけ消滅した場合は、プレイヤーがどちらのトークンを作成するか選びます。
