hint:
  zh-TW: 依 Q2531，【攻撃時】後面的條件在結算時判；條件不成立，能力照樣打出（也算《UB》能力發動），只是不做效果。
  ja: Q2531より、【攻撃時】に続く条件は解決時に確認します。満たさなくても能力はプレイされ（《UB》能力の発動も満たします）、効果が適用されないだけです。
# T044753d805（{UB}【進化時】本文中段的歷史條件）依同一原則套用。
