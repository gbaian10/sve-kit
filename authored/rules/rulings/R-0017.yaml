question: ヒシミラクル的入場曲實際只送墓一張或零張時，元のコスト全部相同是否成立？
decision: 本專案解讀為：讀取這次實際成功送墓的成員，至少一張且所有成員的原始印刷費用相同才抽一張。成功兩張同費或成功一張成立；兩張不同費或零張不成立。
