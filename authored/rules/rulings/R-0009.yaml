hint:
  zh-TW: 依 Q940、Q852，「〜とき、…なら」只要事件發生就誘發；條件在結算時才判，不成立就不做，之後才成立也不補做。「那次傷害」等事件資訊取事件當時的值。
  ja: Q940・Q852より、「～とき、…なら」は条件となる事象が起きれば誘発し、条件は解決時に確認します。満たしていなければ効果は適用されず、後から満たしても適用されません。「そのダメージ」などの事象の情報は、その事象が起きた時点の値を参照します。
supersedes: '舊裁定 #1（「〜とき、…なら」在誘發時檢查條件，不成立就不誘發，依 Q302）；以及 R-0002 中「誘發時查」的部分'
note: Q302（BP02-P19）在兩種讀法下結果相同：手牌上限的捨牌發生在結束階段能力處理之後，無論「誘發時查」或「結算時查」，該能力都不會因這次捨牌而生效，所以不構成反證。10.7.6 的狀態誘發（「あなたの手札にカードがないとき、～」等）是另一類，不在本裁定範圍。
# Q940：兩次傷害都誘發，結算時各自判「そのダメージが5以上なら」，事件資訊取事件當時的值。
