format: 2
kind: ruling
id: R-0009
revision: 2
question: 長寫「〜とき、…なら」的條件何時判斷？
decision: 誘發事件發生即誘發（事件本身的限定、有效區域、每回合次數照常），本文條件在結算處理到該處時判斷；不成立則條件管到的效果不做，處理完不因條件之後成立而補做；「那次傷害」等事件資訊仍取事件當時的值。
evidence:
  - ref: Q940
    kind: direct
    quote: "いいえ。自分のPP最大値を+1することができません。\n『簒奪の蛇剣』によって3ダメージと2ダメージを受けており『辻野あかり』の能力は2回誘発しますが、どちらも5以上のダメージを受けていないので、「そのダメージが5以上なら、」以降の効果を適用することができません。"
    question: "自分の墓場が10枚以上で、相手がプレイする『簒奪の蛇剣』が3ダメージ与えた後に追加で2ダメージ与える状況です。\nこの状況で、自分の場の『辻野あかり』に対して『簒奪の蛇剣』を相手がプレイした場合、『辻野あかり』の能力によって自分のPP最大値を+1することができますか？"
    date: "2023-08-18"
  - ref: Q852
    kind: direct
    quote: はい。その順で能力を解決し、それらの効果を適用することができます。
    question: "自分の場に『デウスエクスマキナ』と『アーツマスター・カルラ』がいて、自分のPP最大値が6、自分の残りPPが0の状況です。\nこの状況でエンドフェイズが来たとき、誘発したそれぞれの能力を、『デウスエクスマキナ』の能力から解決して、自分のPPを4回復し、その後『アーツマスター・カルラ』の能力を解決して、相手のリーダーに2ダメージ与え、1枚引くことができますか？"
    date: "2023-06-09"
  - ref: Q2418
    kind: direct
    quote: はい。この場合、相手の場のフォロワーすべてに2ダメージを与えることができます。
    question: 自分の場の元のコスト1のフォロワーの攻撃力の合計が9の状況で、自分のエンドフェイズを迎えました。何らかのエンドフェイズが来たときに誘発する能力によって自分の場の『ラビリスタ』の《攻撃力》が+1された場合、『ラビリスタ』の「自分のエンドフェイズが来たとき、～」という能力をプレイし、相手の場のフォロワーすべてに2ダメージを与えることができますか？
    date: "2026-01-26"
  - ref: Q1867
    kind: direct
    quote: はい。この場合、『ネオユニヴァース』の【進化時】能力で自分のPP最大値を+1した後、『カツラギエース』の「自分のウマ娘・カードの能力によってこれを自分の手札から捨てたとき、～」という能力を解決する際に、コストを支払うことで『カツラギエース』を場に出すことができます。
    question: 自分のPP最大値が6の状況で、『ネオユニヴァース』の【進化時】能力で【1】をチョイスし手札の『カツラギエース』を捨てた場合、『カツラギエース』の「自分のウマ娘・カードの能力によってこれを自分の手札から捨てたとき、～」という能力で『カツラギエース』を場に出すことができますか？
    date: "2025-01-17"
  - ref: Q964
    kind: supporting
    quote: "最終的に、自分のリーダーは体力+5し、1枚引きます。\n処理順は以下になります。\n\n①エンドフェイズが来たとき、それぞれの『高垣楓』の能力が誘発し、待機状態になります。\n②待機状態になったそれぞれの能力を順に解決します。\n③1つ目の『高垣楓』の能力を解決します。自分のリーダーの体力が5なので、自分のリーダーは体力+5し、1枚引きます。\n④2つ目の『高垣楓』の能力を解決します。自分のリーダーの体力が10なので、何も行いません。"
    question: 自分のリーダーの体力が5、自分の場に『高垣楓』が2体いる状況でエンドフェイズを迎えました。誘発したそれぞれの能力を解決する場合、どのようになりますか？
    date: "2023-08-18"
  - ref: Q2702
    kind: supporting
    quote: "いいえ。『至高の凌駕』をEXエリアに置くことはできません。詳細な挙動は以下の通りです。\n『ハンプティダンプティ』の【進化時】能力を解決します。『絶大の顕現・マゼルベイン』に5ダメージ与えられ体力が0以下になります。自分の手札をすべて捨て、『至高の凌駕』の能力が誘発し待機状態になります。その後チェックタイミングにおいて体力が0以下になった『絶大の顕現・マゼルベイン』が墓場に置かれます。次に待機状態となっている『至高の凌駕』の能力を解決します。この時点で自分の場に『絶大の顕現・マゼルベイン』がいないので『至高の凌駕』をEXエリアに置くことができません。"
    question: 自分の場に『絶大の顕現・マゼルベイン』と『ハンプティダンプティ』がいる状況で『ハンプティダンプティ』が進化し、『絶大の顕現・マゼルベイン』に5ダメージ与え体力が0以下になり、手札の『至高の凌駕』を捨てました。この場合『至高の凌駕』の能力によって、捨てた墓場にある『至高の凌駕』をEXエリアに置くことができますか？
    date: "2026-05-29"
  - ref: Q2354
    kind: supporting
    quote: "いいえ。自分のデッキから『ドラゴスネーク』1枚を探し、場に出すことができません。\nこの場合、『ドラゴスネーク』の能力は誘発しますが、『ドラゴスネーク』の能力の解決時にこの『ドラゴスネーク』は自分の場にいないので、「これが自分の場にいるなら、」以降の効果を適用することができません。"
    question: 自分の場の体力が3の『ドラゴスネーク』が3ダメージを受けた場合、『ドラゴスネーク』の能力によって自分のデッキから『ドラゴスネーク』1枚を探し、場に出すことができますか？
    date: "2025-11-17"
  - ref: CR 10.1.1.2.1
    kind: supporting
    quote: "10.1.1.2.1. 自動能力は、カード上では原則として\n「（条件）とき、（効果）」と表記されていま\nす。"
    version: 1.27.0
  - ref: CR 10.7.1
    kind: supporting
    quote: "10.7.1. 自動能力とは、特定の誘発条件が発生したとき\nに、その後に発生したチェックタイミングでプレイされ\nる能力を指します。"
    version: 1.27.0
  - ref: CR 10.7.2
    kind: supporting
    quote: "10.7.2. なんらかの自動能力の誘発条件が満たされた場\n合、その自動能力は待機状態になります。"
    version: 1.27.0
  - ref: CR 10.6.2.8.2
    kind: supporting
    quote: "10.6.2.8.2. プレイしたのがスペルや起動能力や\n自動能力である場合、そのテキストや能力\nに示された効果を、表記の順に従って実行\nします。"
    version: 1.27.0
  - ref: CR 10.7.6
    kind: supporting
    quote: "10.7.6. 自動能力が、特定の事項が発生したことではな\nく、特定の条件が満たされていることを誘発条件とし\nている場合があります（「あなたの手札にカードがな\nいとき、～」等）。これを状態誘発と呼びます。"
    version: 1.27.0
  - ref: Q311 (EN, BP02-062EN)
    kind: counter
    quote: No. The discarding of cards over your hand's limit happens after "the start of your end phase," so the ability does not trigger.
    date: "2023-09-29"
    url: https://en.shadowverse-evolve.com/cards/?cardno=BP02-062EN
    note: 日文 Q302 為「プレイしません」；英文版寫 does not trigger，字面支持舊讀法。兩讀法結果相同（不造成傷害），且 Q940「2回誘発します」、Q852、Q2418 為一律誘發的直接證據，故維持 R-0009；題目 card-BP02-062 B、C 已改為只驗結果（2026-09-27，使用者同意）
