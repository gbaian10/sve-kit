version: astra/1
cards:
  BP13-001:
    status: complete
    abilities:
      - line: 1
        kind: trigger
        body:
          op: seq
          steps:
            - op: seq
              steps:
                - op: look
                  count: 3
                  bind: seen
                - op: optional
                  selection:
                    select:
                      from: seen
                      where:
                        fn: and
                        args:
                          - fn: eq
                            args:
                              - read: item.class
                              - エルフ
                          - fn: le
                            args:
                              - read: item.cost
                              - 2
                    min: 1
                    max: 1
                    bind: chosen
                  then:
                    op: seq
                    steps:
                      - op: reveal
                        subjects: chosen
                        to: all
                      - op: move
                        subjects: chosen
                        to: hand
                - op: seq
                  steps:
                    - op: select
                      select:
                        difference:
                          - seen
                          - chosen
                      min:
                        count:
                          difference:
                            - seen
                            - chosen
                      max:
                        count:
                          difference:
                            - seen
                            - chosen
                      bind: ordered
                      order: true
                    - op: move
                      subjects: ordered
                      to: deck
                      position: bottom
            - op: if
              condition:
                fn: gt
                args:
                  - count: chosen
                  - 0
              then:
                op: seq
                steps:
                  - op: select
                    select:
                      side: self
                      zone: hand
                    by: self
                    min: 1
                    max: 1
                    bind: discarded
                  - op: discard
                    subjects: discarded
        event: enter
        subject: self
      - line: 2
        kind: activated
        body:
          op: optional
          then:
            op: seq
            steps:
              - op: select
                select:
                  side: self
                  zone: evolve_deck
                  name: 九火石炎・セッカ
                min: 1
                max: 1
                bind: chosen
              - op: move
                subjects: chosen
                to: field
                bind: placed
        active_zones:
          - cemetery
        cost_selections:
          - key: '1'
            select:
              side: self
              zone: cemetery
              other: true
            min: 2
            max: 2
        costs:
          - op: pp
            amount: 3
          - op: banish
            subjects:
              union:
                - self
                - cost.1
  BP13-008:
    status: complete
    abilities:
      - line: 1
        kind: spell
        body:
          op: choice
          min: 1
          max: 2
          modes:
            - op: if
              condition:
                fn: ge
                args:
                  - count:
                      side: self
                      zone: banish
                  - 9
              then:
                op: modify
                subjects: target.1
                power: 2
                hp: 2
                keywords:
                  - storm
            - op: seq
              steps:
                - op: modify
                  subjects: target.2
                  power: 2
                  hp: 2
                - op: damage
                  subjects: target.3
                  amount:
                    read: target.2.power
        targets:
          - key: '1'
            select:
              side: self
              zone: field
              name: 九火石炎・セッカ
            min: 1
            max: 1
            modes:
              - 1
          - key: '2'
            select:
              side: self
              zone: field
              type: follower
              name_contains: セッカ
            min: 1
            max: 1
            modes:
              - 2
          - key: '3'
            select:
              side: opponent
              zone: field
              type: follower
            min: 1
            max: 1
            modes:
              - 2
  BP13-043:
    status: complete
    review: 逐項對照日文 text 與全部 sections；括號說明與 token 引文不重複執行。 括號「（場が上限ではない自身以外のプレイヤーの場に移動する）」是卡文先決條件：接收方場已滿時該次移動不開始、不是輸入點（契約 33(c)②）。
    abilities:
      - line: 1
        kind: spell
        body:
          op: if
          condition:
            read: self.is_active
          then:
            op: seq
            steps:
              - op: select
                select:
                  side: self
                  zone: field
                  type: follower
                min: 1
                max: 1
                bind: gift_self
              - op: select
                select:
                  side: opponent
                  zone: field
                  type: follower
                min: 1
                max: 1
                bind: gift_other
                by: opponent
              - op: if
                condition:
                  fn: lt
                  args:
                    - count:
                        side: opponent
                        zone: field
                    - 5
                then:
                  op: control
                  subjects: gift_self
                  side: opponent
              - op: if
                condition:
                  fn: lt
                  args:
                    - count:
                        side: self
                        zone: field
                    - 5
                then:
                  op: control
                  subjects: gift_other
                  side: self
          else:
            op: seq
            steps:
              - op: select
                select:
                  side: opponent
                  zone: field
                  type: follower
                min: 1
                max: 1
                bind: gift_other
                by: opponent
              - op: select
                select:
                  side: self
                  zone: field
                  type: follower
                min: 1
                max: 1
                bind: gift_self
              - op: if
                condition:
                  fn: lt
                  args:
                    - count:
                        side: self
                        zone: field
                    - 5
                then:
                  op: control
                  subjects: gift_other
                  side: self
              - op: if
                condition:
                  fn: lt
                  args:
                    - count:
                        side: opponent
                        zone: field
                    - 5
                then:
                  op: control
                  subjects: gift_self
                  side: opponent
  BP13-060:
    status: complete
    abilities:
      - line: 2
        kind: spell
        body:
          op: seq
          steps:
            - op: damage
              subjects: target.1
              amount: 3
            - op: if
              condition:
                read: paid.boost
              then:
                op: seq
                steps:
                  - op: search
                    select:
                      side: self
                      zone: deck
                      name: 焦熱の竜翼・ドラーク
                    min: 0
                    max: 1
                    to: field
                    bind: entered
                  - op: modify
                    subjects: entered
                    keywords:
                      - assail
        targets:
          - key: '1'
            select:
              side: opponent
              zone: field
              type: follower
            min: 1
            max: 1
        additional_costs:
          - key: boost
            costs:
              - op: pp
                amount: 3
