              zone: field
              type: follower
            min: 1
            max: 1
  BP20-073:
    status: complete
    review: 逐項對照日文 text 與全部 sections；括號說明與 token 引文不重複執行。
    abilities:
      - line: 1
        kind: static
        body:
          op: macro
          name: quick
      - line: 2
        kind: spell
        body:
          op: seq
          steps:
            - op: damage
              subjects: target.1
              amount: 6
            - op: if
              condition:
                fn: le
                args:
                  - read: target.1.original_hp
                  - 3
              then:
                op: damage
                subjects: target.1.leader
                amount: 3
        targets:
          - key: '1'
            select:
              side: opponent
              zone: field
              type: follower
            min: 1
            max: 1
  BP20-099:
    status: complete
    review: 逐項對照日文 text 與全部 sections；括號說明與 token 引文不重複執行。
    abilities:
      - line: 1
        kind: trigger
        body:
          op: replace_damage
          subjects: self.leader
          prevent: true
          kind: any
          uses: 1
          until: end-of-turn
        event: main_start
        side: opponent
  BP20-111:
    status: complete
    review: 逐項對照日文 text 與全部 sections；括號說明與 token 引文不重複執行。
