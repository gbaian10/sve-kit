            max: 2
        costs:
          - op: pp
            amount: 1
          - op: banish
            subjects:
              union:
                - self
                - cost.1
  BP16-T17:
    status: complete
    review: 逐項對照日文 text 與全部 sections；括號說明與 token 引文不重複執行。
    abilities: []
  BP16-T18:
    status: complete
    review: 逐項對照日文 text 與全部 sections；括號說明與 token 引文不重複執行。
    abilities:
      - line: 1
        kind: static
        body:
          op: macro
          name: storm
      - line: 2
        kind: trigger
        body:
          op: banish
          subjects: self
        event: end
