common_boundary:
  comparison: Same registered face and same region; compare the complete wording-face-v1 after verified absent projection, then all applicable active source corrections.
  protected_fields:
    - name
    - class
    - type
    - cost
    - attack
    - defense
    - traits
    - title
  protected_condition: All protected fields must be exact, including traits order. Any protected difference makes the entire pair uncovered.
  missing_text: Either text=null makes the entire pair uncovered; proven absent may use the exact empty string.
  sections: Except exact-concatenation-v1, section count and ordinals are unchanged; every differing text/section field must match the named matcher.
  output: Only classify hashes and Unicode code point half-open ranges; never modify raw or published wording. A diagnostic match is not equivalence or an order answer.
  equivalence: Only an approved equivalent action covering every recomputed diff to the selected observation and nonempty predecessor, without gaps, overlap or conflicts, may support equivalence.
