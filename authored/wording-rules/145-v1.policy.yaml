  - rule_id: wp:eol-v1
    category: whitespace
    regions:
      - jp
      - en
    fields:
      - text
      - sections
    matcher_version: crlf-to-lf-v1
    parameters: {}
    action: equivalent
    match_condition: At least one text or same-ordinal section differs, section count is unchanged, and replacing only U+000D U+000A with U+000A in every text/section field makes both sides exact. No standalone U+000D exists in any text/section field.
    exclusions:
      - Standalone CR, including unchanged context.
      - Added or removed LF, changed spaces or punctuation, moved section boundaries.
      - Null text or any protected-field difference.
    finite_transform: CRLF to LF for comparison only; no other normalization.
