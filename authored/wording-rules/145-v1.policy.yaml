  - rule_id: wp:term-token-v1
    category: terminology
    regions:
      - jp
      - en
    fields:
      - text
    matcher_version: single-finite-term-v1
    parameters:
      pairs: []
    action: classify_only
    match_condition: Ordered sections are exact. For one explicitly supplied same-region finite (old,new) pair in parameters.pairs, old and new are nonempty and different, old occurs exactly once in before text, and replacing that single exact occurrence makes after text exact. Matching is directional, not cross-region translation.
    exclusions:
      - No supplied pair, multiple old occurrences or additional text difference.
      - Changed sections or protected fields; do not infer term boundaries from substring similarity.
    finite_transform: One exact replacement from an explicit finite pair, for classification only; no free paraphrase.
