  - rule_id: wp:repartition-v1
    category: section_layout
    regions:
      - jp
      - en
    fields:
      - text
      - sections
    matcher_version: exact-concatenation-v1
    parameters: {}
    action: classify_only
    match_condition: Both main texts are nonnull, ordered section tuples differ, and text + concat(ordered sections) is exact on both sides. All protected fields remain exact; no interpretation of the moved boundary is inferred.
    exclusions:
      - Any character missing or changed after concatenation.
      - Null text or protected-field difference.
    finite_transform: Concatenate main text and ordered sections for comparison only; retain original boundaries.
    examples:
      positive:
