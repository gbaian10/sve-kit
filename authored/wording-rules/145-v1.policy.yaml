    category: sentence_pattern
    regions:
      - en
    fields:
      - text
    matcher_version: draw-single-digit-v1
    parameters: {}
    action: classify_only
    match_condition: EN only. Both entire main texts fullmatch Draw ([1-9]) cards?\., use the same ASCII single-digit N, and differ in content. Ordered sections and protected fields remain exact.
    exclusions:
      - JP region, changed N, zero, multiple digits or fullwidth digit.
      - Added prefix/suffix conditions, missing period, changed sections or protected fields.
    finite_transform: Only the full named sentence card/cards variation for classification; never generalize the sentence.
