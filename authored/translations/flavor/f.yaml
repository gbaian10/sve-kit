format: 1
kind: flavor_translation_shard
entries:
  - source_hash: sha256:f01b86607fddd74ee34bdbaf7508fe9c647838b2ac93499b2eada8710b684f20
    lang: zh-Hant
    text: "世界所蒙受領賜的，是蒼藍石板。預言之石。\n眾生啊，前進吧——盡頭至今仍在等待世界。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f021610bb40965e04089b9ced051b9d9cd44a41be500fc057bcc95122b4f89dd
    lang: zh-Hant
    text: "弟弟，是姊姊喔☆欸嘿嘿，嚇到了嗎？\n那這次為了不嚇到你，在耳邊溫柔地……是姊姊喔♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f058cc80d9288b1d0ebcda4fc45e0190f3bc2590d293add88b77817dd294db0d
    lang: zh-Hant
    text: "精靈們在祝福我的心意呢。\n這份新的力量……獻給主人。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f078d7b599ece453312ca5c0b7be8d3f243972df3815ce21b13f3a065d906df3
    lang: zh-Hant
    text: "不只靠人，連卡片也要依賴啊？\n——白銀御門"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f08af353478f2957b4e841c3529ebb134d47da3a50b0259cb570bd4c0fb1a787
    lang: zh-Hant
    text: "太過耀眼的燈光，太過巨大的歡呼聲。\n現在的我，能好好接住了。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f10a43bcf55adc66c03bde82c1110fc13c5e2bdd4367c3a55331fe19a8f43735
    lang: zh-Hant
    text: "「根本無法拯救。從那時起就已經結束了。\n記下身為聖騎士團長的結論。——這世間是場悲劇」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f1436db960a55f9d067465eeff18772ebc05ac40742bce9028ab30b900daae80
    lang: zh-Hant
    text: "嘿嘿嘿……別那麼怕嘛，轉學生。\n我們是來跟囂張的新人，打聲招呼的啊。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f15b0f1d9c434fa0d61636ac6a05ccabbaef1d87cd3e04650b6d9d5b3e5c0a9b
    lang: zh-Hant
    text: "啊啊，好想快點證明理論。感覺全身都在發熱。\n……呵呵，彷彿所有細胞都在命令我奔跑。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f1a3821298979815beea227358cbe1f3e66ca8215beb86935bf3b4e9ca164fd2
    lang: zh-Hant
    text: "請看！這正是The學級委員長的便當！\n來！請驀進地享用！！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f240980b9d0e131e1f784294bee8c9117c8130ec1f9884f64797155863a5ea61
    lang: zh-Hant
    text: "放入土塊的靈魂，務必進行篩選。\n否則土塊將狂暴失控，一切都將化為灰燼。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f247a27bf310f9287dcb8d1cc19bb62c39d83dd96f320c4a24434194eedbe1d0
    lang: zh-Hant
    text: "每天都是夜班，靈魂又完～全不聽話！\n啊，笑容一消失，又要被卡蘿姊罵了……！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f25411cb85c82078383ed4410cf44ebe12855c7a268fc53cb938cec9a2a7beb7
    lang: zh-Hant
    text: "越鍛鍊、越琢磨就越閃耀，劍與志向都一樣。\n唯有在困境中，才能造就強韌的劍士。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f256eb95123e728d70c9670aeec0842447769d0c74c67f99914a494a5bf55e65
    lang: zh-Hant
    text: "「小姆，工作囉！來劈一千根柴吧！\n我會一根根全部劈開，儘管拿過來！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f271e2a7fd8aa7d93b4fdbd904dfb2d6616601d4a376e3b5943594a79e33d020
    lang: zh-Hant
    text: 龍是不滅的，吐息是無限的，魔炎不滅火焰！
    origin: machine
    low_confidence: false
  - source_hash: sha256:f275ef9c6c51f36e2e7681cf8dc292b94fd012902f3fbfddb7f802fd7598619b
    lang: zh-Hant
    text: "按這裡的話……這、這個和弦好難喔小夏樹～。\n真是的——，我絕對要變得比大家都更會彈吉他——！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f2802226d0f62cabe93520c3ee3db3489a1a73dbe2782196b5d6eab88cc39b64
    lang: zh-Hant
    text: "貧富貴賤，請節哀順變。\n——篡奪的繼承者‧辛士萊茲"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f29de5c9ed7e3d7acad5271ff46a414416ba23bc5d9bd76a9179d6c96244ad6e
    lang: zh-Hant
    text: "蠢材。自由這種東西，對你這種貨色來說太過奢侈。\n現處以武皇之刑——對無法之惡降下誅罰。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f2acb0aac699f4e5135d704b6c9e31f945fb891910979430f9a4c28056579905
    lang: zh-Hant
    text: "青年從戒指中生出長槍，化解了蹂躪國土的利爪。\n『守得很好呢。繼承篡奪吧，辛士萊茲』"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f2c099c2ad6f03a333eb6d6ff3b8813c4da8b46da20d7bb9df235cf7491399a6
    lang: zh-Hant
    text: "端莊有禮、美麗動人，嗯——不適合我的啦——。\n雖然不擅長當公主——但這方面我幫得上忙喔——。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f2ed9d34a08a5006130b1384bfce58901a227630421d9bb90ed502346f9d3806
    lang: zh-Hant
    text: "「與人魚結為連理」\n——意指「溺死」的船員諺語"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f30ca96874c2fde47deab9abd12bf44f230cdbeaaa7aeaff595fa484b71b9d60
    lang: zh-Hant
    text: "只要馬納歷亞的好深～深地滲透進去……\n應該就會最喜歡上課，成績也會完美提升☆"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f30d99476818a8ce40a1a5c543a360e744b7f81919921b9c626504de8135ed17
    lang: zh-Hant
    text: "要是一直吵吵鬧鬧的，好像會被當成小孩子呢。\n接下來，就讓你們聽點抒情的吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f315311310d6c85b0f1a8c8c4001ae6a0040024e7c69e9a34d30e1fa8823ba20
    lang: zh-Hant
    text: "若求本質，當依機構所命，揮動全身。\n只管看向己之內在。那正中央有新的本質。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f3206a084ddfd990f2d6bd9d94a276a23f87f0c88e7b1a10697ad2f72946aff0
    lang: zh-Hant
    text: "當知距離。當量要素。當相連帶。\n因我等並非盲目的個體，而是作為受統率之軍而戰。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f3389c018c7d995b7fc60571a070d19e1b4f620198318d13291013ca931839c4
    lang: zh-Hant
    text: "匍匐在地渴求著。泥濘也好汙穢也罷，全都不顧。\n——是呢，就繼續世界的試煉吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f35cacf7b5613aa71c54e3342a22d810b0a1ce0b9d13cf5df66d2bb95e5a92f6
    lang: zh-Hant
    text: "「要不要來點用特別的森林素材做的香水呢——？\n花蜜加上矮人的汗，用了一定能變得華麗喔！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f368b5e41668f7b5ab9f27546fc921e03090bf5c71c503c8047df51d9d0db663
    lang: zh-Hant
    text: "「以為逃掉了嗎？不管你去哪裡都一樣。\n你的動作、呼吸、脈動，在我眼裡看來都是靜止的」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f3782dccaa6df43f078cabccef772f29b14023a173d78b94553208ba73360916
    lang: zh-Hant
    text: "若只是被本能操控，離所謂瘋狂還差得遠。\n不可順從，要去支配。把本能，磨利吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f3abdf50845c53fb78d77cce0fc023cc51d36329f492fa1689f3eb62145a2400
    lang: zh-Hant
    text: "畢竟是傳遞心意的工作，企鵝當然也會飛啊！\n嘛，不過確實太亂來了。天氣熱，稍微休息一下吧？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f3d287dd84437f40eacb9a66e6da4f3ba1d8d981e5ff73352aee34a68f54e8bc
    lang: zh-Hant
    text: "創造首先要斷食與祈禱。之後，在土塊上刻下生命。\n當然，不用寫也知道。絕不可刻下死亡。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f3f096b941ea8f1c4c31984d18899bdd6c9b0bd085c628cc1f9bc7f0525313de
    lang: zh-Hant
    text: "「把厚厚的魔物肉，連中心都烤熟的絕妙火候！\n果然，是由很細膩的主廚做的嗎——！？」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f3f158bc9eb990674fa23f16252b8e2aaa89ad63f7b488e370ab7162bbe97dda
    lang: zh-Hant
    text: "比起高僧、比起心地善良的王、比起這世上的神，\n死靈術師遠遠更懂得，什麼叫平等。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f40224f719f10d316c6dbf54fab048fa5431e7033640d93cc1453f5a327acdb4
    lang: zh-Hant
    text: "你曾在慶祝的日子吹熄蠟燭的火嗎？\n我今天要慶祝勝利。所以你是風中殘燭。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f43d6a30dbbcccc0ca5d85dd357666f3ea3b6ded52ed103832dea643826dbd58
    lang: zh-Hant
    text: "好了，走吧。要是累了的話牽個手也不是不……。\n真、真的要牽？是、是沒差啦……。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f43e5236dcbd86525ffb5a16cb84bd50f9c80e697dc20c3904e1e0c9e8b4a86a
    lang: zh-Hant
    text: "被封印在洞窟裡的魔龍。\n即使鐘乳石變成了鐘乳洞，魔龍的鱗片也不會枯萎。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f4539f24c47d432f0d309b59c4d82cd716d05e34f524b1b6abea128ec50046dc
    lang: zh-Hant
    text: "只要願意好好相處，妖精就是人類的夥伴的說！\n你是壞人？還是好人？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f456b4035e18a19444d9e7036beb326efe3e0c49a177de3874560ca325673f9d
    lang: zh-Hant
    text: "如、如果可以的話……希望你能守望著我……。\n因為那一定會成為我的力量！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f45fca1a708c40a923f0242afac3b5836531cfb930f5327d2bbfdedbf2ed667b
    lang: zh-Hant
    text: "絕不可殺生。那麼人啊，生命就該持續存在。\n除此之外的一切，對你都沒有必要吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f48e7129dce58154b5b65fd40df67001e13326198f96041843d2a48305894e22
    lang: zh-Hant
    text: "我能作為偶像保持可愛，都是多虧了大家。\n今天也會送上我的全力，請收下喔！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f4ddfabb106ec3891c1a9f8e6dcc44f76e41be3dace6af167a73343a4625ea7e
    lang: zh-Hant
    text: "閘門練習～？等到信號才能動的練習～～？輕輕鬆鬆的啦！\n……。……。……嗯嘎啊——！為什麼不給信號啦！？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f521e0904db1aea5d050cf3fe53bee907f21df2b20008c58b6141b1f6f64037a
    lang: zh-Hant
    text: "哥布林純粹地、無垢地，追逐著「EMONO」。\n看牠們就知道，純粹與無垢都不是善的同義詞。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f5436f0eba6c0795f4e2a07380c207153cd22555142c54c600ba3e633d461ca8
    lang: zh-Hant
    text: "「不是其他任何人，你願意選擇斐特嗎？\n不需要像詩一樣的話語。只要說喜歡我就好！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f547214e033ac5ea982859665942ef3e5a8f19bae788dec0cda7c56db4b8e50a
    lang: zh-Hant
    text: "果然身為偵探，就得靠雙腳賺取情報呢。\n因為除了自己親身感受到的以外——全都知道了嘛。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f54df6584bdebbe645c881f40ddbdb43cf52d48397000ecd48f125bd631ddc27
    lang: zh-Hant
    text: "飛也很不錯喔！又快，又能看到很多東西！\n為什麼能飛我不知道！靠氣勢！氣勢！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f57e09bb9e95663fa408d316dfdfc7192e3dfb62948d8ec3237c283771f4b433
    lang: zh-Hant
    text: "因為世界笑得如此無垢，讓人想把它貪食殆盡。\n——是呢，就賜予世界試煉吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f58f54c9dd38663186eb839eae7a1b10322e52095ae65e00208d48041f5b4229
    lang: zh-Hant
    text: 約定好了。老夫就實現汝的野心吧。
    origin: machine
    low_confidence: false
  - source_hash: sha256:f5a2a45d2b9276904f74391c48137a870682e8fab1f24ee244ee0b114ffe4fef
    lang: zh-Hant
    text: "我的組織做得太順，財團則太惹人厭。\n暴徒放逐了舊的支配者，大哥他……喂，你在哪啊。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f5ee43d6e40ac7af86e59ac705cdf55fcb36b7a1077b403ca03928447836079d
    lang: zh-Hant
    text: "Howdy！我是大樹快車！\n要用我Powerful的跑法讓大家變Happy唷！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f5fa194c7d72d3e5cd827b3db24e62140591c84edfe04f201099c7d7f3cc15a7
    lang: zh-Hant
    text: "從以前就很喜歡的、令人懷念的海……能讓你看到，我很開心。\n讓一直支持著菜菜的、重要的人看到……。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f60c01fa72b495ed3fe6f090ebdca8fa855ed6d5b0218b3b4d20ccd6607d254c
    lang: zh-Hant
    text: "不是為了傷害人……而是為了守護而歌唱。\n為了不再失去重要的人……。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f61ff3e268aa0f366f316a151f4f3b434808d059050a30dbb55f12ef87fc4dc8
    lang: zh-Hant
    text: "收到了這麼多……。\n萊拉小姐真是幸福的人呢——。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f6339cef03c711d9684823a15c88f9554b1e12b0373bff21600126543659918b
    lang: zh-Hant
    text: "轟鳴吧金色！銘記我的名字！\n——金色威信‧璐米歐兒"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f65cffcf2be1dfe694b93269e8ce0b4fd1e3f05e4ff5b23788f1c4af98ff68b8
    lang: zh-Hant
    text: "只是任憑運送而前進，找不到誕生的意義。\n燃燒生命、凝神細看，才終於找得到命運。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f66207cbd0d9bab31a7e83d3a19fee937665cfec799185a6f5f6dd1bbd4258d8
    lang: zh-Hant
    text: "光是起飛，就會掀起風暴。\n要驅散渺小之輩，根本不需要咆哮。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f696e132e0bae5e26d0633b7879fe5045d5780e88e1f39e4e721ef90ef133eb7
    lang: zh-Hant
    text: "視覺、聽覺、觸覺、味覺、嗅覺，比人更敏銳的野性之證。\n成為這五感核心的，是森林孕育的食物。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f6beadbb9aa383bd6daaae0b4ec43f6abb8e97749e293e8548ef2a82a0c3debe
    lang: zh-Hant
    text: "虛偽的眾神啊，就在那裡看著吧。\n看我的理想淨化世界的模樣。術式流轉——輪迴轉衝。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f6cb11b0b1ed5cf88d148467de8086cd8f9d4bbd986991fd38fdd8a38a04c434
    lang: zh-Hant
    text: "聖即是正，無疑即是義。她對正義毫不迷惘。\n「OK！把正義敲進你的腦門唷！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f6f58da1397121195e58ca6b6b07ea39ac94bb85c094f0896a57e53932512412
    lang: zh-Hant
    text: "為了守護中意的對象、舒適的地方，虎前來坐下。\n啊啊，虎啊。你在神聖之前，就只是可愛的、人類的朋友。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f70a0d07d9830b8e4c3174f2ffb66d5ee7c8a11d22d81b3c0507420736d38443
    lang: zh-Hant
    text: "喂，剛剛說我小不點的是哪個傢伙！\n本大爺的手裏劍要把你……等、不要動啊！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f73bdaceac238fd5ab8b6c9a7c9baf6e4d105981c5d34524fa1708a698a1a6b6
    lang: zh-Hant
    text: "「這些傢伙有力量，而力量傷害著牠們。\n沒有力量的我，才能理解牠們的心情」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:f742c0f53fb9ce1aa66620bb18b0e3c0cb7a6c6e8766f2f388139273265e5354
