  - source_hash: sha256:66c574562bf9afb631a54350ac1f9613ff9689861f1161344c65ae8283532277
    lang: zh-Hant
    text: "若能得到昂貴的肉體，便能過著與衰老無緣的人生。\n是故懼怕死亡之人，崇拜財富更甚於神。"
