    low_confidence: false
  - source_hash: sha256:696795e62cb022d59fa13105d3a190cd353b349a6aa40be0e34153b4e9d502e5
    lang: zh-Hant
    text: "「怒吼‧雷‧神‧老爸。對，就是我把他惹毛了！」\n——飛馳的光明‧阿波羅"
