    low_confidence: false
  - source_hash: sha256:6cf5796f3a3443021c459ded375f027732b913bd2ed6f795e3acb08d59bc5509
    lang: zh-Hant
    text: "在圖上的棋子一死就會通電的測驗中，王子心想。\n假如這顆棋子是同伴，區區電流根本不足以贖罪。"
