  - source_hash: sha256:66bdfbe158fcfe5ce9451111f3dbc8efd95e9c0d682141f0ee769ed3c38bbe00
    lang: zh-Hant
    text: "嗶————！我的美女雷達，有反應！！\n那邊的大姊姊——！跟我一起……咿！忍好可怕！！"
