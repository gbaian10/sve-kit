    low_confidence: false
  - source_hash: sha256:698994628276ae1540c6412f4901e8e23d859345084ef3837a71a96e8ee6fcb7
    lang: zh-Hant
    text: "指向天際的是龍之劍！咆哮吧！滅劍燄龍！\n——天龍光翔"
