  - source_hash: sha256:6d10fc6e09da59031da5f73d90f54217c94fd64edf3fb58d78a1884356e7694c
    lang: zh-Hant
    text: "聖鳥引誘純樸的眼眸，引誘旺盛的食慾。\n「我是映照你們內心的鏡子喔！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:6d21aebea74634801fe24be62bb48cb7623a79f842cf8d14fcae58efd0025749
    lang: zh-Hant
    text: "那是偶然，抑或必然。\n邂逅催生勇氣，勇氣催生明日。"
