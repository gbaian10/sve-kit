  - source_hash: sha256:66c5ce26c69160a8f0009ed91ea8bdcb8e30b2488898c6ecc07262c6215674db
    lang: zh-Hant
    text: 一旦被熊憎恨就是末日，直到獵物被撕裂，連哀嘆的空檔都沒有。
