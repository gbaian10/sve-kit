    low_confidence: false
  - source_hash: sha256:69ea1738c13f6b2f983fb7c93b133dac557ac14be85acd81449a8203975265d1
    lang: zh-Hant
    text: "歡迎來到我自豪的武器庫！從頭到尾全是我的愛槍！\n不攻略這裡，是攻略不了大和亞季的喔！"
