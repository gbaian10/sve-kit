    lang: zh-Hant
    text: "因為感覺到迷途羔羊的氣息，所以我降臨了。\n夢裡的煩惱諮詢，請儘管來找我吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:6af30fa2fe258b95e2640f8ff4ef6b2dc92e1f2689f3e3036b5441773d3506ea
