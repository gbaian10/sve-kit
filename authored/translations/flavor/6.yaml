    low_confidence: false
  - source_hash: sha256:67147023e39875660cb43bde4c5282c28fea573c17bd16630cc03eee4f8b3d30
    lang: zh-Hant
    text: "呵哈哈哈！太猛了……！這就是真正的覺醒嗎！\n爽到最高點！力量沸騰停不下來！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:6740365671a570ee5201df02ff44c35f7ead2fa3f7d4bd6b78fbbb9de08a4a10
    lang: zh-Hant
    text: "（我現在，嗨到最高點……！）\n雨、泥、汗都是飾品。讓我閃耀的伸展台就在這裡！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:678889d61ea23a8afe0ace544d2af0ea9fa31ab398b7f688de040b8d8ca9ea6e
    lang: zh-Hant
    text: "若拒絕邀請，便無法走出森林。永無止境地迷路吧。\n若接受邀請，便無法走出森林。永遠地遊玩吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:6792786b93d0cd8d19b9ca275e4dae441e66672e6d1a6e704ae279644bfb1b6a
    lang: zh-Hant
    text: "把自己的母親燒成了灰燼。為了拯救自己的另一半。\n「誰敢欺負琉璃，就燒光他！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:679559e977940d9fcc223ac6462401a814e8c34f7b2e9dd4dd98ca25171a79a1
    lang: zh-Hant
    text: "過去，唯我的試煉已被跨越。\n世界新被賦予的，是絕大的試煉。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:67a42e2d1113771f4a461d6eaae79148f4b4a0eba4bd31080b554b9ef4d26077
    lang: zh-Hant
    text: "夏夜潮濕、沉滯，吹來的風溫熱如人的肌膚——\n——嗚呼，今年也是我的獨擅場。來吧，妖魔們起舞吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:67b04abb157a0069d998958a4d4c2dfb23554c96838383eb0c069896c045ab94
    lang: zh-Hant
    text: "雖然不用說也知道，艾爾莎大人可是大天才！\n能看到艾爾莎大人的魔法，要覺得很幸運！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:684939a7a1689cf73dacd3ba63b640945f0f53152336df110bdb6068a6a14845
    lang: zh-Hant
    text: "其為森林的太陽。遠觀是林間灑落的陽光，靠近則是灼熱。\n「又玩泥巴弄髒了？我幫你洗，拿過來！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:68d4327e69c8c5b5b0cd0b839d9cee2d6f23bbaa92d45a1146ae6d02409a2bf9
    lang: zh-Hant
    text: 即使影子與他分道揚鑣，他的忠義也不曾動搖。
    origin: machine
    low_confidence: false
  - source_hash: sha256:68d7b2031adb3f18411771fa96370fafefef65dcc2f773cda2a91ce821614d60
    lang: zh-Hant
    text: "此刻，攪拌吧。戀愛命運、對人的感情，那皆是幻象。\n一旦行事理性也會消失。喜好、歧視、區別皆無。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:68e070b3b367061c63acd1bd421ef59c404e29aaf40e5ab543927f6400507215
    lang: zh-Hant
    text: "苦／快樂。悲／開心。\n兩者都體會過的她的夏天，一定，既快樂又開心。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:690c0a1be520ef13f7f717ac0ff058958dbbc3e755162300d76b59ae151aa2f6
    lang: zh-Hant
    text: "哈——哈哈哈！我正是最強最美的“霸王”！\n好歌劇！來，開始傳說吧！"
