    low_confidence: false
  - source_hash: sha256:691ff748cc0665f66ef96d1e255c47b00bf0cf6d7ad0a733e8e70087b11e09cf
    lang: zh-Hant
    text: "嗯，聞起來好香呢～♪接下來是最後收尾的祕密調味。\n要變好吃喔……好，滿滿的愛情放進去了♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:695489ecd337070f2e3a62161edaddd525ef3851d33328cd0f0c6ec975d9e62d
    lang: zh-Hant
