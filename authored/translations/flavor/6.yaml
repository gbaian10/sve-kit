    low_confidence: false
  - source_hash: sha256:66e452359d2bd4ce3bf302d731072d3c236cfb14ed75544d2c5e3a8dde587a4f
    lang: zh-Hant
    text: "真是的——大家都不懂嗎——？真是，拿你們沒辦法耶——♪\n璃亞夢我啊，真的，是個能幹的孩子呢——！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:670abfc8b4412e657e9e0ac902db9bdc255eaaee75facc5f008b6577e5819532
    lang: zh-Hant
    text: "大鵬鳥開始尖聲鳴叫的話就要小心。\n因為那是狩獵的信號。"
