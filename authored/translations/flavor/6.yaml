    low_confidence: false
  - source_hash: sha256:699341e237b62bb22701f5559a08495abab3c2a922285bebffc23f85584009a2
    lang: zh-Hant
    text: "大的吃起來有分量，可以塞滿整張嘴。\n所以我只獵大的靈魂。就這樣。"
