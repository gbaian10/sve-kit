format: 1
kind: flavor_translation_shard
entries:
  - source_hash: sha256:602338ef102ea403151734ecdf4b9d547c2623a50963cd9bbce373e638cb9147
    lang: zh-Hant
    text: "流浪的日子沒有終點，所以也有難受的時候。\n但在思索的盡頭，總有一天辛苦也會煙消霧散吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:6031cf97214f8195b6080701242ed2cd2b57c9da5584683489c611073a647264
    lang: zh-Hant
    text: "世界新蒙受的，是蒼藍石板。其右半。\n協會之徒高舉真理，侵略城鎮與國家，行絕盡之事。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:606c204859a30eedf93c64a3687f2328a44c9ace682584e44995b6d6c4ae56a0
    lang: zh-Hant
    text: "命運是被注定的東西。\n而怎麼注定，由我來決定。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:608e62969edc0506a2e1731e7f5005cee471731352fdd3e9a55325d03e2dc52a
    lang: zh-Hant
    text: "拚了！既然這樣，就把偶像當到底給你看！\n要讓整個場館，都露出笑容！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:609985491bd4c2d9e4f1cce586d63a4e97dfd59a584a5aff8eb7aee313f70540
    lang: zh-Hant
    text: "各位新生，從此時此刻起，你們就是『臭青蛙』。\n我會讓你們全員一起畢業。先從格鬥術訓練開始！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:60a7b12626a175c282dd16b5bbd92cc232751f83d17870527cd76fc223013e0a
    lang: zh-Hant
    text: "不是地點，也不是寶藏，想要的東西只有一個。\n對未知事物的高昂感——她稱之為浪漫。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:60ec8cabf458f0521d0a0ec82e1d4791b471eb1d7cda7c0e33eeecdd3489ddde
    lang: zh-Hant
    text: "欸嘿嘿……多虧哥哥，我的演技變好了……！\n請再陪我練習喔。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:60fcb52c5a1b63e919735398d9ffa63371cb658e655b2892eeadebc6e28fdb82
    lang: zh-Hant
    text: "你可能不知道喵，今年是貓咪年喵！\n那就和貓咪們一起打招呼！預備——，咕嚕喵～♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:6127605712a4690273c05eda372ab34b9e059fa721111f776502bb28000fd120
    lang: zh-Hant
    text: "飯的力量！還有與你的羈絆！\n現在的我可是擋不住的喔♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:613162309c1cfd53c228ba6f0f5c43ae2a64dd4385f60b1f41aca6706870c516
    lang: zh-Hant
    text: "在龍姬的火焰灼燒下，魔導生物化為了灰燼。\n混合了兩校魔力的灰，散發出夢幻的光輝。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:61322258a13a0654d873884ccdf64093874b0be5d4709c5ef6ff8fb6f908f0df
    lang: zh-Hant
    text: "似似花愛用的手杖。\n其幻影魔法能完全欺騙對象，甚至讓人忘了魔法的存在。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:613a65c2ae471c972277daab78eadd26f197e38f1beb892553e8c32a33490d9d
    lang: zh-Hant
    text: 其身即為劇毒。從指尖、血液，乃至思考。
    origin: machine
    low_confidence: false
  - source_hash: sha256:615271bdfe73a751d3212cecea74c0f076a256849dd4172e1ae690a5e7d2aff0
    lang: zh-Hant
    text: "朋友們悽慘的死、崩潰的戰線，玷汙了純白。\n信仰之心能當什麼糧食？神誰也救不了。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:6171fec8b0c598209f5107722d5ddb324c58a9f62646371f31a2ed3aa39830a3
    lang: zh-Hant
    text: "居然被小看，『魔眼太妹』也還不夠顯眼啊。\n……話說，只是其他成員太有特色而已啦！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:617adf157399527832b15d862b85a9b83127a7cccfcce2adfec2ed771ce0f962
    lang: zh-Hant
    text: "這是憤怒？你是敵人？\n……啊啊，一切的一切，都不明白。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:618660c00df18eedfcc1d4d6c37f1104ecd94c6131b82d42d7213764252871b7
    lang: zh-Hant
    text: "有捨棄人的神，就有拾起人的神。\n沒能傳達的祈禱，總有一天也會被神看見。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:61c58e7235914a9b8eea7d9a758ad93dc6836425d5e912bc4368af464dbfcff6
    lang: zh-Hant
    text: "只是盲目地學習，離神髓尚遠。\n知識會聚集到有智慧的人身上。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:61dd6dd19d963ad6c0fc0f38eb7410c023cca7be9e9250d4bd31b033c9450b26
    lang: zh-Hant
    text: "要這樣活啦要那樣做啦，別把沉重的東西套在我身上。\n我要走的路，我會用自己的風格蹦跳過去啦！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:61e09096cd32a8ecac9c87cccc067cc179694316df1a16488c93bd41e7776efa
    lang: zh-Hant
    text: "心情down的時候有人家在啦！\n也就是說要把氣氛嗨起來的意思，請多指教——！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:61f1009436aacc9ccd5090ce0aa3f62376794aee920feb0eaed977ade3869e0c
    lang: zh-Hant
    text: "鋒利的才華，天賦的煥發。\n——機鋒的罪人‧卡托司瑞德"
    origin: machine
    low_confidence: false
  - source_hash: sha256:621f742135f6d0cf06a0142c5f2a6c8d7b2c5f748016db0365c7cdf69aed1066
    lang: zh-Hant
    text: "——其為《聖杯五》，所示為《損失》。\n當障礙阻擋道路，水便乾涸枯竭。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:62367967d283faebdb36050e8cd2b4bef696d600df24a86e0540ea8b253fa2ba
    lang: zh-Hant
    text: "共鳴正是信仰的開端，沒錯，我們懂你的心情。\n令人顫抖的飢餓、膽怯的日子，都結束了。我們是一體的。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:623e84eb05162bcbe06ad4f339adc63ebca9575a9081cbac5696e76592468fd6
    lang: zh-Hant
    text: "來織巢吧！織到三千世界的每個角落！\n——混融的繼承者‧夏姆‧娜可亞"
    origin: machine
    low_confidence: false
  - source_hash: sha256:6245d4c3f271f3ed7b1c9b1e1b4123040118e368d0e24c32e35a478b0c31efd2
    lang: zh-Hant
    text: "講究固然重要，但戰事可不等人！\n沒差啦能砍就行！好耶，完成一把！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:627654c2bec9d52e12199337c1360cc1b9fda6443ce3ec7bc40d7e2c8df5d1bb
    lang: zh-Hant
    text: "戴著面具的，是掛念禁忌之人、將其悄悄藏匿的審問官。\n其本性，依舊藏在面具之下。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:62a674ba263616266f41d5cab42801c1911e88c35a87122602e075469765a241
    lang: zh-Hant
    text: "等等！等一～下！既然來了就說一聲嘛！？\n……欸。我有稍微追上妳一點了嗎，瑪娜？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:62d361b112a0cfee1da5e7c19538458d9aec21ec92f45eba6375eb82e9afc1bf
    lang: zh-Hant
    text: "王子與友人一同蒙召，懷著無上的幸福侍奉神。\n「故事的結尾，果然還是得是快樂結局才行！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:62dfbc7e37e2c23360d8aad79e69d2c883218ed081d5e45c4109983559184697
    lang: zh-Hant
    text: "我到底配不配當女王，到現在偶爾還是會煩惱……\n但我會努力的。因為我不想背叛相信我的大家！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:62e714aa5db62cfed86fcafff7e9d9794d4448c01870238e4dda81827c5097d1
    lang: zh-Hant
    text: "心若遲鈍，劍也會鈍。反之亦然。但是現在——\n澄澈得沒有一絲陰霾。……對你的心意也是。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:62f98a3ae2cdb7a5784aa334520ec277f3988abd0ca1a618465ff6cabce05447
    lang: zh-Hant
    text: "光誕生，暗隨之而成，最初的存在們遭到了驅逐。\n「同胞們啊！把被奪走的一切，用這雙手奪回來！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:63034a1b3217bcfd65125013e9af5302e5137338768bdccc2b3234513e03c9ca
    lang: zh-Hant
    text: "只要你和我湊在一起，不管寶物藏在哪都輕輕鬆鬆喵！\n幻影貓沒有不可能的事喵～♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:631e5ccf54be81ccf51f2de69a6c18e4a4662b72e63c7f2173fa08d010c40086
    lang: zh-Hant
    text: "甜言、甜美的吐息、甜蜜的誘惑。\n幸福美夢與殘酷現實的界線，是她操縱的甜蜜陷阱。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:632386f7087838cf987a7be1db61a1747339c16f2072357d56f14be20b786f0a
    lang: zh-Hant
    text: "那麼！\n就讓我們開始吧，小優妮隊的諸君！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:6324b9fd50f7e20bc87676a9dc83bf00afea3f4c7f1852b8750703e4d7d99197
    lang: zh-Hant
    text: "為何惡會蔓延，她不知道理由。\n甚至從未在意過。只要消滅就一切足矣。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:6334b6402d806b76458ce4720490e5cdee8c0966736bf59168e1f8ea4882171a
    lang: zh-Hant
    text: "姊姊對我非常溫柔。她會看著我。\n我喜歡這樣的姊姊。因為最喜歡了，所以我……。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:6340d4b9bab3d21494cf599b97e5b8d0177fb1004464388187344672ace89d1b
    lang: zh-Hant
    text: "貪欲，渴求著我狼吞虎嚥。\n——涸絕飢餓‧吉魯涅莉婕"
    origin: machine
    low_confidence: false
  - source_hash: sha256:63463cf5e77657cb59c047c4969deb74a648f8e067d7ed941905be0bd5e6ed25
    lang: zh-Hant
    text: "海盜宣誓效忠的，只有自由的大海！\n我已決定，要馳騁在這片蔚藍的戰場上！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:6365f612e4b5b7e68b340dbb61af96c37ea9e8643accd682c8be798b4a8ae594
    lang: zh-Hant
    text: "此刻歌頌我那榮譽崇高的友人，波魯克斯。\n縱使被分隔於此岸與彼岸，即使如此我們仍是永遠。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:6377c903f941bb3e3945600037aca1bc118a224f0b7e067e95a67bd3c56a1d88
    lang: zh-Hant
    text: "「互相爭鬥、戰鬥，這真是太令人難過了……。\n欸，大家好好相處不行嗎？」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:63b64a5626a8f1b483c8f9a5c52b872825f4ff0b1fc23949766370e8a677e05b
    lang: zh-Hant
    text: "那隻靈鳥會辨識人，只在德行高尚之人面前現身。\n因為就算啄了他們的點心，那種人也不會生氣。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:63dd240b76d67ea2d913643c20505bdc95163fd44f724b80ee9b22c2ee5b5ba1
    lang: zh-Hant
    text: "過去，安息的試煉已被跨越。\n世界新被賦予的，是絕望的試煉。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:63e7c1e40b0f68ec9c68a5524043835bfe7bfb98b4abc8345857c8b19a7e6097
    lang: zh-Hant
    text: "切嚕一下　切嚕起來　切嚕正盛！要嗨到翻過去！\n切嚕切嚕☆嘉年華！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:64240e73b6bc92d958cbe4048fb3a1766c97f9b216adb987cb1da28fe0e9b6f8
    lang: zh-Hant
    text: "「嘛，就是別著急啦」\n——老練的魔術師"
    origin: machine
    low_confidence: false
  - source_hash: sha256:642dfacbdaec45836fc5b2064359d5398de7fed5f9fa45d13a01d8cfb262bd63
    lang: zh-Hant
    text: "魔鏡啊魔鏡……世界上最聰明最強的人是誰？\n……嗯，沒錯。當然是我。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:643762c42de9072c84ca1a15ca2304e5d6a14da64eb7dcef930786a8c41760b9
    lang: zh-Hant
    text: "在瓦礫中。在裂縫中。在毀壞的景色中。感受到偶像的存在。\n但破壞完之後，腦中就感覺不到偶像了。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:6456290f36a26f673d82d81b3e5dd76ebebb7c4922c462a2f95dbf6010939ce6
    lang: zh-Hant
    text: "用眼睛捕捉獵物再射，才會變成成敗各半的賭博。\n用皮膚捕捉風再射，就能成為無可動搖的名匠。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:6489f054aa1bc9edd28691594a8ae1b404f6fc14f5034df0d2440c5191b50789
    lang: zh-Hant
    text: "貫穿獵物的第一箭，是捨棄膽怯的戰士之證。\n瞄準致命一擊的第二箭，是捨棄寬容的獵人之證。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:64a5ef0b27a1550efff601772a2f32b7f3e7cec091a4671e83c7b96e2a4d71d7
    lang: zh-Hant
    text: "從『臭青蛙』畢業後，他踏出了成為英雄的第一步。\n寫下英雄傳說、引退之後，他的下一條路早已決定。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:64d3aabc637ff8afbef86b4839e65305673e0e44de730050b9dd5bd82aede341
    lang: zh-Hant
    text: "我知道！闇影詩章的事，還有我自己的事！\n——乙坂紫音"
    origin: machine
    low_confidence: false
  - source_hash: sha256:65341097223d031bf81520423fac401d437ec45c5099f52fa61efb4f7513c17c
    lang: zh-Hant
    text: "「打爛血統主義。然後大家一起愛怎麼跑就怎麼跑！」\n總長那煩死人的願望。……沒辦法，就陪他吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:659bf566124708d7599465de951b2be6204e4ea8da1f869e50feb83e88aba3d4
    lang: zh-Hant
    text: "自己的神唯有自己。\n孤高正是強大的證明。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:65ab1f8c54311b406ac57eafbda9b48c102ca6a247121ecd5a7f07cc02c908e8
    lang: zh-Hant
    text: "Do、Dra、Drago～n♪\nDodora、Dorara、Gongogon♪Come on、Dra～gon♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:65b2be9a77aeb30cdb1709e0ddb720c403f90f368bce7eee6687c1385df3745b
    lang: zh-Hant
    text: "和比賽不一樣的毛毛的感覺……嗚嗚，靜不下來！！\n吸——呼——放輕鬆……神祕一點……。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:65d61cde4f2d04419c8ee794492a860841b58ddf603f62dd42c4cb03153d1385
    lang: zh-Hant
    text: "居然還有以菇為主題的電影，世界真大……呼嘻。\n我也，總有一天要挑戰最佳菇類女主角獎……呼嘻嘻。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:6611ff50c1494654469ff0a8e5178807c16be930bccbff491b2829f8644602ab
    lang: zh-Hant
    text: "搖晃著頭顱內部的聲音。呻吟。又或是歌？\n我的一切，都被她修正。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:66184b18c0633173d0ac2872156cade11f15948dd07d09a15283564f69c8c175
    lang: zh-Hant
    text: "能被高傲的龍認可為搭檔的，\n只有追求強大的人！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:666a11861b9d77460d832848bc463344d49cbd1ae4c3df7f6b3b312369e499e1
    lang: zh-Hant
    text: "企鵝實現了夢想，用魔法的翅膀飛上天空，然而——\n沒有同伴的天空，是個遼闊又寂寞的地方。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:66804a97801ad369c2de75766c084c43f139ded53c7bc51383294fc73cd237fa
    lang: zh-Hant
    text: "即使屍積如山，也沒有其他能指望的活法。\n——為了活下去，非殺不可。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:668d6e56a387c30c466315b9bce07eb8b5cce3f38f880f4bbe11447211a43dad
    lang: zh-Hant
    text: "「不想把會壞掉的東西，給弄壞。\n因為是虛幻？的東西，所以我喜歡夏天！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:669b166270963962880ccd04f1ee5640e668bd7f5067518b43783da1d50cac88
    lang: zh-Hant
    text: "即使沒有心，其中也並非空洞。\n少女的心意，確實灌注在那副身軀之中。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:66a22e7784cf13f46f247702b6d67674f47e17fdbf847b1cb2a11e0a14a0952d
    lang: zh-Hant
    text: "我是Curren，也就是真機伶——！\n要用“可愛”包覆世界☆只看著卡蓮一個人喔♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:66b1b95601c5fc6ccbac3b3a53455a5f68c22aade42b4a0836c9f2798ecc2976
    lang: zh-Hant
    text: "變強的比奈，也很像我啊。\n像遇見大家之後能向前看的、身為偶像的我！"
