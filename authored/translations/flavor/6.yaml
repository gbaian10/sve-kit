  - source_hash: sha256:66c6e60baba98ac09be203dc06bcec2a43313233c20a4399f93d5c6ba8499757
    lang: zh-Hant
    text: "沉溺於惡德，沾滿了背德，所以善惡什麼的早已。\n美德該唾棄。會擁抱這副身軀的，只有邪惡的手臂。"
