  - source_hash: sha256:6f41786ff4e48b90034ec3dbdcf579d60229db90d01b668401fd423473e3042f
    lang: zh-Hant
    text: "遺憾可惜。被我抓到算你倒楣啊。\n真期待囂張的靈魂變成順從寵物的那一天。"
