  - source_hash: sha256:66de18ff055b99680dc1905440be50953cec2ed9dd111a8b5721e5f47ff5eeef
    lang: zh-Hant
    text: "工作時的笑容什麼的，至少示範一下啊……\n咦，卡蘿姊！？哇、哇啊……多棒的笑容！"
