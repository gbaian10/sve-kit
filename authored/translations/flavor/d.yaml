format: 1
kind: flavor_translation_shard
entries:
  - source_hash: sha256:d02ebffdaade0bad0c573cf6e8af936d074bd29e0207bfdea0c6633687ae149a
    lang: zh-Hant
    text: "可有掙脫安息、踩踏之、蹂躪之的覺悟。\n——此刻，賜世界以試煉。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d03fff5fbacb049929e89d126366457f8c25c7c2329962748f7b849eee0e8429
    lang: zh-Hant
    text: "本來應該會聽到開始突擊的信號。\n然而什麼都聽不見。戰場上一個人也沒有。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d07db37dd12fd3b248cdee3fb87fe176fcd79b61a01165239693e32630ae35ed
    lang: zh-Hant
    text: "你認為映在自己眼中的我真的是我嗎……？\n我是變貌大妃。千變萬化的女人喔。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d08c540ed550a88fad313b31ca8c0d970b75a7e5091e0ca04c4b50406530266e
    lang: zh-Hant
    text: "前往生命與羽翅滿溢之地。\n——羽翅女王‧提泰妮婭"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d08edb178b78d2da79ca0b7524defe1071688ae1c320e40f37048b90f4293652
    lang: zh-Hant
    text: "有隻哥布林用那東西擋下了人類的箭。\n結果其他哥布林氣得大罵，壞掉了怎麼辦。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d0b90228b674563dae4034d69927162ea879128bec90a1c3def5e7ac0164965d
    lang: zh-Hant
    text: "所謂『絕盡』，即是真實。\n當一切虛偽耗盡之時，那裡只會留下本質。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d0d604d4c96b1ec0f7297854e46b3afa9f3db464827ac2807285882bd432ce02
    lang: zh-Hant
    text: "喵哈哈～！『一路逃到底然後偷懶』作戰大成功♪\n抓得到的話就來抓抓看呀。不過雲可是沒有形狀的喔——♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d0f76dc4fabcd190994b0a5e0323681356c9458c9f1d1a29051545d149b827ac
    lang: zh-Hant
    text: "貼身採訪什麼的，總覺得有點緊張呢！\n不過貼身是要拍什麼呢……？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d1107da551f707c0089ee64a7c950470e4c205508d901a972389c9ac0e7f5093
    lang: zh-Hant
    text: "犯錯，或許也沒那麼糟。\n因為我看到了你為我擔心的表情。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d1338d84fd60871c1dbdf0933e1f5e0b1c122620efc64f49d9b39d3ea51d6427
    lang: zh-Hant
    text: "您喜歡什麼樣的珠寶呢？\n各式各樣，應有盡有喔！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d143bbd5b20882aa953ff99ce9ac71aa493cc6c4a9f36ddf83341adf204f8661
    lang: zh-Hant
    text: "全都是擁有金剛石般光輝與強韌的賽馬娘……——\n「——正因如此，才有粉碎的價值呢」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d1474c53c3adda720fa4a6fefd5868b53522f18f1eea2c5a330e44aec6593026
    lang: zh-Hant
    text: "光也好，暗也罷。對聖女而言，都不過是救濟的手段。\n「接受吧。絕望的盡頭，有救濟在等待！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d14b0e62e80ba76f17c8c5d77ba92cebe19a658878df2f8f060121f5137ac8ef
    lang: zh-Hant
    text: "啊，學、學長！？我、我不是在跟蹤……。\n這、這個是那個……是在觀察……。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d15a8db5d6826740925bf15d12e11100e3e47a262686e580937ca8a8c8293ed7
    lang: zh-Hant
    text: "原來老子很『遜』啊——『老師』。\n——『雷爾達逢魔學園‧最強不良《超猛壞咖》立志傳』"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d15dfe988cdcbd087dc6b4caf993b40ef4a92dee636e92636271eb5906185a8c
    lang: zh-Hant
    text: "日菜子……一直夢想著。\n穿上漂亮的公主禮服，和王子一起去舞會。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d1a2365b1285cf5e095157c54b221ea55a031aee288e6c988b7affda7986c379
    lang: zh-Hant
    text: "……這裡所有的書，都是人為了人而寫下的。\n察覺到這點時，我覺得圍繞著我的一切，都令人憐愛。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d1dd976b19bbebb4d9c7b90e34d48cb88875928c92e6e101a0c67e69893cd4ab
    lang: zh-Hant
    text: "修女閉上雙眼，以強光引導民眾。\n「民眾不需要能辨明神是否實在的眼睛」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d1fa6e77e4190d8d1a710859d497431b5336ff6b385d3aa5e292029681d96a5d
    lang: zh-Hant
    text: "歡迎回來，主人♪\n開、開玩笑的啦，欸嘿嘿♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d20a551db9c7adf70e6aa39df4f760e6a8da0e85f5f517be2d628f636aa8d9ee
    lang: zh-Hant
    text: "「龍也需要歇歇翅膀。來，放鬆身體隨波漂盪吧！」\n「呀！？真是的，四龍……！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d24c7ed2a02ba88c252614e9ebcdeb919ba3b2e81d204f1ff165edc90d1f587c
    lang: zh-Hant
    text: "守護聖域、協助聖人的神聖野獸們。\n汝之名為，虎——其實意外地，很親人的一群喔。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d2538470165aaf6a00234c95036d3eff13d9d5589d734ea17101496de4b1d0c3
    lang: zh-Hant
    text: "「欸龍先生，再等我一下下喔。\n雖然現在的我還不成熟，但我一定會變得出色的！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d266c5d874613adb6789e6b8ffb9062d270a1fe9fd50a5a7ab100061ac56c9d0
    lang: zh-Hant
    text: "人有時為求戰果而挑戰龍。\n龍於是賜予戰火以教導人。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d2734e84afa20abfa60ea8d8e133f065c8124b422e43ffb0b4941cc39bbf7614
    lang: zh-Hant
    text: "會動的是敵人。不動了的，是曾經的敵人。\n又動起來的是夥伴。直到再次不動為止。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d28d92886c2f75e5cf67c133fb16c2726194f8b2ef0cf1c03c58ac96deef9d5b
    lang: zh-Hant
    text: "帶著初次見面與歡迎之意。她向你伸出手。\n「……因為我，是你的前輩嘛。呵呵呵」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d29d6e0ef567de641b9002a3e3b80fcecf5cce6a0047d126d95a95d7c54e1081
    lang: zh-Hant
    text: "我的行為只是延命。嘛，船到橋頭自然直啦。\n因為出乎意料地，世界對人很溫柔。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d2a1b24eb1ed1a3431152508329ccaf7835f2c699f44cbc4c3a93791f6cbc084
    lang: zh-Hant
    text: "「連骨頭都粉碎的，我的一擊！飛臨你的頭頂！\n激烈的戰場，我無所畏懼！以此剛技改變時代！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d2ac52436e37baf9bdeea419a08e17f146070010e10f50ee4c8a3370a26a30bd
    lang: zh-Hant
    text: "劃破天空的，火焰之爪。\n巨龍的羽翼散播絕望，蹂躪了反抗之人。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d2acc03cb6deb18ae7076c4fd4a5a5f78e44cd5f567b9d133d6e909c335d1bfa
    lang: zh-Hant
    text: 聖獸之所以垂首，是為了傾聽祈禱。
    origin: machine
    low_confidence: false
  - source_hash: sha256:d2b524237b8a3dad0296e5d4424ca9e19e1604af55b43b3b2b7c4c1aae694a46
    lang: zh-Hant
    text: "充滿世界的光之精靈們啊……！請把力量——\n借給我和騎士君！為了照亮未來！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d2c0beafd7df9cfc0d837622965408fce0ddc05757ec007cd11dd77575143473
    lang: zh-Hant
    text: "即使是生於海中的生命，若是踐踏樂園寧靜之人。\n以蒼海之名，一視同仁地降下制裁吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d2d5e454f4ae4705caaabc7e7a5eeebe966b2e1a2e613ddeb1cab8a6fb63300c
    lang: zh-Hant
    text: "暴露出來吧，你的深奧。本質、本能、真實。\n——那麼，就來賜予世界試煉吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d2d654e630f4d281362d6dde069b7ac425eb80917776baa56f6895cbdb8f47f2
    lang: zh-Hant
    text: "破壞的衝動，是白色的。\n摧毀既有事物之後浮現的笑容，是不受玷汙的正義。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d300c6cedaf1831722553af05d98a7f99f3ace90f3ad46d9f86954b82b71874f
    lang: zh-Hant
    text: 因為有相信自己的朋友……少年成為勇者。
    origin: machine
    low_confidence: false
  - source_hash: sha256:d304814e60208443048c7b9bae0e30fb3dda6d185a44fa00fa83b2395fdd9180
    lang: zh-Hant
    text: "一直拿著是很重，但心意要用鐘聲傳達！\n聲音傳不到的份就用敲的！叮噹叮噹——！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d3097cb2b56f12cf46e04def9949b82907fb363a185ec9481071759cdcb0ba62
    lang: zh-Hant
    text: "我一個人就好，別管我……！\n——乙坂紫音"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d3336fbd238e0112c46b84a8e8467926305e55c1d93d6f8c2c33e2ec6d468995
    lang: zh-Hant
    text: "獸人王子決定把身分、權力，全都忘掉。\n在劍術訓練的斬子彈課程中，只以一介『臭青蛙』的身分努力。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d33b3a3ba6f817082bd4fbc9c2680f1b6faffebe770b0926cf3ce5ab2f91b6b0
    lang: zh-Hant
    text: "無心吞食的是喜愛之物。碎裂四散的是礦物。\n吃下便硬化，身軀也下降，往大地之底追尋更多美味。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d366b5dc7d5e10b7ae94de62b5df947e9fed99590132fe12bd4fa3f51bbcac6b
    lang: zh-Hant
    text: "這是第幾個真理、第幾個發現來著？\n——年輕的鍊金術士"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d37c7f0fbacc3369c70c2a6099f1ac28a57463c120045c653d793181f8fc376a
    lang: zh-Hant
    text: "——其為馭龍者，滋潤乾涸大地之人。\n向著枯竭的湖泊，滴落一顆淚珠。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d388aed202420a723546d976bf1471f61719be2ce1ec367ad50ef22e2c05c335
    lang: zh-Hant
    text: "「跨越冰封的日子之後，生命萌芽的春天就會到來。\n雖然對我來說……是個不相稱的季節」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d38a385ff15f6377e663bc3624ce087638b3cfd399239d534f3d48f842c5d1c8
    lang: zh-Hant
    text: "哼……一群慢郎中。就算包圍我也沒用。\n一眨眼就把你們斬開……！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d396b6e5afe8ad8292d40dcd7458e3ba63374adddea195aef8b600cd7d6fe983
    lang: zh-Hant
    text: "怎樣啊！鬆軟又有嚼勁！這就是關西的『魷魚燒』啦！\n……嘻嘻，好吃吧！看你那開心的表情，身為關西人真是太幸福啦！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d3c2240cfd863f7de17147522a3d88885a577b34b007c1437fc684e3ca732c4c
    lang: zh-Hant
    text: "我會接住你全部的心意，化為我的力量！\n所以，請讓我看看你的全力全開！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d3c4acd0b1a7a47c5e130b1efbb3daa879642ea16717738ff671940352ba1f8e
    lang: zh-Hant
    text: "今天就以沉靜優雅的氣氛，享受料理和對話吧。\n乾杯……呵呵，能從中午開始喝的休假日，最棒了～！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d3cca626a29494154bb5547cf25818856e754563475a33c892279ba019401b53
    lang: zh-Hant
    text: "那個啊，未來……只有可愛而已嗎？\n未來有性感的魅力……嗎？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d3ecd176bbeb1a32fa981b1aba91e87de708ad6903b9d546fb202bb3417adf17
    lang: zh-Hant
    text: "為了獵殺可恨的龍，我模仿了龍的爪牙。\n屈辱，但無所謂。只要能把牠們趕盡殺絕。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d41219e075d7037776841152b27cb169fd22a422c890412671e9c1467f8ca83d
    lang: zh-Hant
    text: "魔導姬將自己的魔法陣，混入有缺漏的魔法陣。\n交融的魔法陣，化為鮮豔的魔力極光。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d4363a5a2ec5c2685beafea09a0180bad951cc4fb51c69fababc8cadf31fde34
    lang: zh-Hant
    text: "你啊，居然選了和我並肩作戰這種奇怪的未來呢。\n就算後悔，也已經太遲了喔？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d43a86c691c360d8f1f98c0a602b7b4856e2b6d5a26c7df96409cc3146d95ccd
    lang: zh-Hant
    text: "OK，拍吧☆\n拍下至今為止最閃耀的大人Heart☆"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d4567d8112f815e16b86d283d7a0eccbf3298cf3a2a44aae2eb70645465a2c1d
    lang: zh-Hant
    text: "「喵哈哈！盡量逃吧的說！」\n「喵呼呼！這樣才能玩得更盡興的說！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d4593a0f8958f75d6dd4fbe179df2c8c1d58401c844c7b793af4028d896d74d2
    lang: zh-Hant
    text: "下吧血雨。大小合計，將掀起參拾場戰事。\n各地、各軍的武士各有流派。又各有祕劍。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d486bff564cf4accb574efc729d2af67c683e770edafcb208fc2a1e811caa9cc
    lang: zh-Hant
    text: "因為他求饒才放過他的。……得捨棄天真才行。\n人家……我。是貝爾特佐爾船長的女兒。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d4874651d9478205f2c57fd364b77421e991dde2d00324eb3a761fba5ca36c47
    lang: zh-Hant
    text: 生命自生命中萌芽。
    origin: machine
    low_confidence: false
  - source_hash: sha256:d4c49ce7985bf870b4a5b5c4c71f13dddbae4d9e56be37d76299b0019e1faba3
    lang: zh-Hant
    text: "為求獎賞而馳騁天際，比誰都聰明地做出成果。\n又名，強欲的賢人。對他而言是讚美。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d4fc78f4c2d0c30acfd59bd1bbd1c68b84280d934c9211c3432912d97f3faa52
    lang: zh-Hant
    text: "「嘛，就是為時已晚啦」\n——老練的魔術師"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d50935839adf72548a35e2598f5b7cd88238c621288ab4040fde5f0c86550349
    lang: zh-Hant
    text: "與生俱來的魔力大小，終究只是天賦之才的事。\n積蓄的魔力大小，才是長年鑽研的證明。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d512f5240f9bfa8c049ae23dab34ded46a734102a2b32cac0ef58e83c2a25cf6
    lang: zh-Hant
    text: "徬徨之人啊，若在森林看見光，不可靠近。\n被引誘之人啊，森林的光已經找到了，名為你的獵物。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d51d94897aad4dc007051521ce26832de8dce0e5fafe9c968ca10e48e56afce8
    lang: zh-Hant
    text: "什麼森林啦城鎮啦，分這種無聊的界線要幹嘛啊。\n走吧搭檔，今天也飛一趟，越過森林越過城鎮大賺一筆！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d5afe56fa9df30955a53920a47794e00b4305fc6ec7e33abdf691fdd13a23f55
    lang: zh-Hant
    text: "喲。聽說對我麻吉動歪腦筋的，就是你這傢伙吧？\n老娘叫亞琉嘉。『凶輪手《Bad Spinner》』亞琉嘉。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d5c497a089a740d7018b575f312adc93d501d6a5ad7d0dc55b2ecec0f3f72247
    lang: zh-Hant
    text: "我是來稱讚你，真努力啊。\n——白銀御門"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d609e2a58d709c9c0473e81570dcbbc466d66e1900bcf4665de9e3fb0c93e3fc
    lang: zh-Hant
    text: 要丟的骷髏？你看，不是到處都有嗎！
    origin: machine
    low_confidence: false
  - source_hash: sha256:d66ce8787f75012fb07d895c4b893c7c6a2d1c7c48b0e4d7d978e6fb7f5c8820
    lang: zh-Hant
    text: "只去做存於汝之深奧、應為之事。\n——那麼，就來賜予世界試煉吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d6a8ea58156cdb5aee6ae3fe5bd38877d0ec92b004a24ab9b7470b9a0248738f
    lang: zh-Hant
    text: "粗劣品、廢品、蔓延世界的平庸機構。\n總之通通斬斷。老子可是獨一無二的特製品。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d6b3e47f13a23a8d3899c65709e5e1a4dfe90ae39346b2e2c032b358924a17be
    lang: zh-Hant
    text: "「孤獨也無所謂。愛怎麼罵怎麼叫就怎麼叫。\n我絕對不會輸給那些幸福地笑著的傢伙！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d6c641008415ebff204404c5c6f273755cc4dad8e6edd109fa8c0dc5051b1c07
    lang: zh-Hant
    text: "學習魔術沒有白費。\n退一步進兩步，嘗試錯誤終將結果。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d6d0bf2133ab8aca73e3fe77de68a66f898a2df8ca898c42747a031ea24bac62
    lang: zh-Hant
    text: "——其為《月》，所示為《不安》。\n現身於膽怯之人身旁，以自身作為防備。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d6e04a8426a7a00a79a93f02d9a806c3c57bfb73506fd7ca88d6cf7a309994fc
    lang: zh-Hant
    text: "破壞的歌聲斷絕時，仰望的天空失去了蒼藍。\n進行破壞的時候，開始在腦中感覺到偶像。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d6f628cac456923afd832752e6dd935a4f65a9c193d0ff4b68ec346a1bcfbb70
    lang: zh-Hant
    text: "你命令我活下去的Geass，扭曲了我的信念。\n為什麼要下那種詛咒！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d725ad73b88f2c5fc417b69e8ad07b52782f5d3ff05960ecd6f7fa7992f42848
    lang: zh-Hant
    text: "你現在看到的，不是夢，是真正的我喔。\n好好地膜拜吧♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d727c8ca0e2fb9ed993548d8e1d0bfe557b0e1e1c796cdada96fcd987e0d9aa1
    lang: zh-Hant
    text: "可怕的眼睛，不要啦。鈕扣眼睛比較好喔？\n欸，變成人偶好不好？這樣就不可怕了！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d7316b69fa564215cb4d7879cadccaa7b917f3973024b980af31eff275e4322a
    lang: zh-Hant
    text: "惡是與生俱來的自由。善是奪走心之舵輪的甜美詛咒。\n連同刀刃一起沉沒吧——繞行紺碧吧，阿朱多爾。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d73a58765698854414f5d808c6161d22f8e3e7a8047a11456344ba313857de55
    lang: zh-Hant
    text: "連滾帶爬逃出來的盜獵者，顫抖著對人說。\n「深海裡有馬，牠的嘶鳴就是大海的憤怒」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d76f3fea173f329800400f82fe03481c3cb31fd6535c7452fd522c319ebd3286
    lang: zh-Hant
    text: "啃咬世界，殼很礙事。\n——遊獵的罪人‧安媞馬麗亞"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d788cc5c71901f913737f4d6e8be505a63a4b8c089c5387f91d5ada74815cfbd
    lang: zh-Hant
    text: "向被告人，宣告判決！\n——神魔審判長‧瓦爾娜"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d81d67c6e303629c7bccd2a285c46486523799bfe9dc48bb74fc4c8d7f1481c4
    lang: zh-Hant
    text: "看啊！絕對無敵的大正義！上吧！驍勇劍士！\n——風祭蓮"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d8221158c572dc190e67ca6d9a095685e46cb8b62e9be329e37b79157336625c
    lang: zh-Hant
    text: "因為我要覺醒需要大哥哥的說。\n哼哼——。就算你求我我也不會離開的說！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d84601c8b76a45e592c358fb42ecbdf5a05d52d9387d7efed72f3587ef248957
    lang: zh-Hant
    text: "茫漠的永劫，無盡的虛空……。\n唯有生命之歌，化為燈火，照亮著我……。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d84d5ae8b0fa3cadae266f92524d766e0289c920ec0f48bb36e3826b21f0c095
    lang: zh-Hant
    text: "我的舞台還會繼續下去喔！\n接下來也會好好努力，熱情的應援，拜託囉！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d871b73eb556f08eb5617ccfb4f58852d6275b0a2c41e1476f831beb53e5ebe3
    lang: zh-Hant
    text: "尊崇深眠，並如此祈願。\n在安穩的時光中沉睡。很幸福吧。很溫暖。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d877bc256441a20acbe637c8a9ec6b714d1877787fc83e957ee36e0f23b4e2ef
    lang: zh-Hant
    text: "罪人斬斷鎖鏈。拒絕罪咎，否定理想。\n罪由自己界定。贖罪由自己完成。正因如此相信。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d8b9cebb7124cfa2b7ff41f79348c207d832c5f5593020380c66c971df9cc149
    lang: zh-Hant
    text: "就由我登臨神位，將世界重塑為理想鄉。\n沒有罪人的世界，一定很美。術式啟動——輪迴轉衝。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d8e251ad95e53c068bb3278acd5d6d4e52a85a39c05c47815bf80b844bc7a5da
    lang: zh-Hant
    text: "啊——在這裡練習的事，本來想保密的……。\n被發現了也沒辦法。來看看我的舞蹈吧！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d8fa07f93d540d14eabf9000b5b647547570db85a2c311c5cca9e7104fb2cb16
    lang: zh-Hant
    text: "就算認真起來，也什麼都不會變。改變不了……。\n——小鳥遊翼"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d90faa5b482194531e54f30a2d30cd1d20f2ff5e78a2dd1fda0ded8945a4ed26
    lang: zh-Hant
    text: 聽到女王大人的鞭聲，僕人們便欣然趕來。
    origin: machine
    low_confidence: false
  - source_hash: sha256:d94a93fa25bc361fecf6b6354a8a8cb0f741f8db5822498555d42c4d34a0d0a8
    lang: zh-Hant
    text: "蕾吉小姐的巨大鉗子，把我的心給折彎了。\n已經回不去原本的人生了。我要把一輩子賭在製作工具上！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d957fb888a00dc467c8a403e2eb953c314a8f1a185d4afc8386a6c3e14311003
    lang: zh-Hant
    text: "毀滅性地破壞吧。把我以外的天地萬物一切全部！\n——那就，繼續世界的試煉吧！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d9a2c357d4f65278a88713e639eee24e8c869a4485e3f9205b992f9855d9d79b
    lang: zh-Hant
    text: "縱使終將迎來敗北，直到終結之時都要名譽與鬥爭。\n「我到死都會一直贏下去！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d9daf2bdc1e59825d2b36e9afbaad3b877c3e3de90432e46e1cb6d8d6ff655ce
    lang: zh-Hant
    text: "為何要寬恕我？啊啊，我果然還是無法理解羈絆……\n能做的，頂多就是各自走在自己相信的道路上。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d9ee34e1d5a1a06773f3871ba8e010b62e070259eb6c9995cebad1a6b444ac9b
    lang: zh-Hant
    text: "我的言語即神的宣告。我的手即神的手。\n主之所望既為我之所望，這場制裁便是必然。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:d9f48bc0c26faf70c1f7b6de6bfec55cfa23f21ecb72d46843a9a05f3c133ea6
    lang: zh-Hant
    text: "溺水時連稻草也要抓。受傷時連蟾蜍也要靠。\n「痛痛痛痛，飛走呱！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:da0a62b5f75cb64c6330ab24d6c2e8f0435fac501f5063afe72585b9f842b1ca
    lang: zh-Hant
    text: "過去，想必曾以高貴的美麗為傲吧。\n然而，已經失去了。此刻就只是，緬懷吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:da0ef4d76cca4c3ee05a3aac77d7b0115d7622abdd580213af6c67c7d07881ed
    lang: zh-Hant
    text: "浮在天空的彩虹。忽然浮現心頭的，友人的身影、那個名字。\n「那傢伙也在看嗎～」「……好想見莉柯瑞絲」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:da103265a2e6561ee86532765453e96ba8bba68146dc46ac3279edf31112417e
    lang: zh-Hant
    text: "不磨就虧了，每天的保養是劍不折斷的祕訣。\n不揮就虧了，每天的鍛鍊是心不折斷的祕訣。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:dac7a4a1e649ec565040bd87ea7a2b8f26f7aa43e0a38977b2a4408ec31f1a8c
    lang: zh-Hant
    text: "舞台的布幕一拉開，我就是公主……。\n沒想到能用這種方式當上公主……！好開心♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:dad21c93216892754ce4a409041b8ef9d08cc319bd63bb86d91a94301ef7b4ee
    lang: zh-Hant
    text: "我所剩下的，是拋下一切逃亡途中撿到的一本書。\n是那個害怕異界之敵的大叔，抱著死去的書。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:dadc4fbc28950a8d8af4deff3e276425f2f91c087933de3b1f451f035b1c6b6f
    lang: zh-Hant
    text: 據說在蒼月舉辦公演的國家，會接連發生離奇死亡與事件。
    origin: machine
    low_confidence: false
  - source_hash: sha256:db0a14ed9da905d099e740334a1a3c04d87bf920488d2bf3c91fca060d97d228
    lang: zh-Hant
    text: "偶爾也需要愛的鞭子吧！\n咦？為什麼一臉開心的樣子？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:db2b68f098276c0fbd48784ee5eb519900c3943c5572ddd0fab793236a735a3e
    lang: zh-Hant
    text: "十指交纏，不是為了枕邊細語。\n是為了緊緊、緊緊地握住，等待聖言。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:db4069b068ec02525c31d07bd6afcacb0fb64c1d773354cd97870a26004fb8c9
    lang: zh-Hant
    text: "在無依無靠的戰場上，最可靠的東西是什麼。\n不是朋友，不是武器，而是鼓舞自己的大義名分。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:db513b9699eacc0eafccffaada8695bb34533ed00449ef63278b0cf60e466e53
    lang: zh-Hant
    text: "熱砂之淚我收下了。\n——亞森‧羅蘋"
    origin: machine
    low_confidence: false
  - source_hash: sha256:db5689c1c2efb7fcb91cb8af75dbe6416d5c3b387167790a7fa882e5f11adff3
    lang: zh-Hant
    text: 緋紅馴獸師「來，表演才藝吧！」
    origin: machine
    low_confidence: false
  - source_hash: sha256:db5f40101e7d1a0fc1e6a6646854aa4344ad3f768d0c46c2a15cf792d86cc20a
    lang: zh-Hant
    text: "縱使是被火焰包圍的戰場，只要還有求救的聲音——\n我就會趕赴那片土地。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:db711da8656477ca9810c4d349d3e4defdc583c3b7c8356234c2e1ac4db9cea4
    lang: zh-Hant
    text: "侍奉地底女神之人，唯獨夏天也會在大地上奔跑。\n「我已經不是小孩子了！不需要抱抱也不需要擁抱！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:db8d79f75e446ad72ec69691ed7c05dbb145fbc553ebf7123af4c0752d702404
    lang: zh-Hant
    text: "戴著面具的，是施予薰陶、廣受尊敬、交遊廣闊的森林守衛。\n其本性，依舊藏在面具之下。"
    origin: machine
    low_confidence: true
  - source_hash: sha256:db91ff9c6ab3461cec129a33bdb0390d508da27bddade2ebbab67464574a8b50
    lang: zh-Hant
    text: "在法律之光照不到的地方，在正義之劍搆不著的地方。\n如滲透般靠近，神不知鬼不覺地完成工作。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:dbbbb50f09b045a9567844d8fc91a3f6970cfb235f2f46ec44112481c60c1478
    lang: zh-Hant
    text: "你問拿著那種東西，為什麼還能動得那麼快？\n因為裡面是空的啊。就像你的腦袋一樣。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:dbc77b82a7deb9c1d4cf091b20d53f52ee3c40cf5ba3b9d300c26f0c13b1d07e
    lang: zh-Hant
    text: "喔喔人啊，請前進吧。答案就在秩序之中。\n我也順從神而找到了。名為救濟的唯一答案。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:dbd9ee46f7c02f3cea50decfc30aab41b9ad00a9af713a027007667cc6615627
    lang: zh-Hant
    text: "畢竟她連狂暴的龍都能壓制，\n要壓制士兵的疼痛，根本不算什麼。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:dc3562f66ce089cf12aef4b2d000a47ae41fd8387cd27c37fbc1c2d9ba59daad
    lang: zh-Hant
    text: "剝去常人外皮之人，從魔之領域招手。\n「把你收進魔裝鎧甲裡吧！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:dc3958c12418e237a487cb7984bc6eac17e90d544161c1ff6dcde85f02527d0c
    lang: zh-Hant
    text: "這世上，也有不遜於金銀財寶的閃耀之物呢。\n比方說……對！像是我的忠義之心！！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:dc92b407a4ee5914b0190a9b16d5d4bcdee2f9a01450fee940f284f711fff1b0
    lang: zh-Hant
    text: "怎麼樣！很帥吧！可以靠近一點仔細看喔！\n喔唷危險……！差點不小心把你劈成兩半……！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:dca453b683d5f9da0b1d7c92d41d0604f97adf78a01080b8a350cf0e5842048c
    lang: zh-Hant
    text: "一、二、三……好，就是這樣！\n怎麼樣？我的魔術，看得還開心嗎？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:dca84cebb7637df07fb14e9b8335689ef7659f3c8799e4051c34a66c30bb2518
    lang: zh-Hant
    text: 受過訓練的魔犬，能壓倒受過訓練的戰士。
    origin: machine
    low_confidence: false
  - source_hash: sha256:dceb4ee4c5603b04f397213e4a2ed6f46d9331d70220731787b515aa39dfbdfc
    lang: zh-Hant
    text: "來吧諸位，展開百鬼夜行吧。\n此處是煉獄，『吉歐‧革赫拿』。乃唯有強者能存活的穢土。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:dd280380cb404042e9be5a20e35830ee2fee6e7c5a496fce5164232f85b74533
    lang: zh-Hant
    text: "遠遠超出槍的攻擊距離，貫穿入侵者的森林一擊。\n「手一滑槍就飛出去了！就叫它投槍吧！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:dd6261f906d74397e24e15d5c5c62b4002040677b84f9f566a854c2a28d98e6a
    lang: zh-Hant
    text: "破壞、破壞、破壞。既有之物，全部。\n不破壞就沒有未來。破壞後妝扮，歌唱吧跳舞吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:dd6d905f7fabc675adb39145065875db928ad31ea9e686776c4e488281296890
    lang: zh-Hant
    text: "透京的人們藉由稱為義體手術的人體改造，\n得到了小小的安全與大大的危險。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:dd9eef5044437e7bc7a6a087979ad539c162016758c244240ace89ea0e24a73a
    lang: zh-Hant
    text: "某個鄉下，有個充滿勇氣、信仰虔誠的孩子。\n當她感覺到亂世逼近的氣息時，便悄悄踏上了旅程。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ddbc70e791625d78c152521462d7dceb6c919bf0ed8ec669a8ac1366ef10e68d
    lang: zh-Hant
    text: "人，遭逢多少動搖自身的苦難、遇上多少魔，就成長多少。\n清濁善惡，不分隔閡齊聚切磋琢磨——這才是老夫的學園！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ddd5031597b338138d816f7a8956791d7423a56925947c8fa73344bb986de123
    lang: zh-Hant
    text: "如你所見，我無論何時都忙得不得了！\n不過要是有什麼困難就馬上說，知道嗎？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ddefb22988a8eb593e83cf59bc1b48d2f9bf7238aed806815ad9dd7574d48624
    lang: zh-Hant
    text: "父親大人准許我到城堡外面野餐了！\n呵呵呵。這個便當是諾嘉做給我的喔。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ddf580a71c3dd9803d066cd1a11963ec3a8fa2a46d72774522ccbbdae40892af
    lang: zh-Hant
    text: 獻給不擾亂和諧的善人。
    origin: machine
    low_confidence: false
  - source_hash: sha256:de0126101f890199761cd80a1b6ac4bfa0492b6c6fa5e7d73a45838bcaaf7657
    lang: zh-Hant
    text: "所示為《相愛》與《誘惑》，想要愛的話就交給這傢伙。\n一兩個伴侶，馬上就幫你造出來！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:de1d499f7ecdb6943f6b83530bcf3449a89ff3599c751f4da3df19ee2352a7f1
    lang: zh-Hant
    text: "若能與那高潔的心相通，\n龍將成為人類最好的朋友。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:de2682a6ddbe43ff9a67f338a61d26d888b4fe12678359dfc80d74f8ed7bb139
    lang: zh-Hant
    text: "那個啊，就算用了很多超能力，\n像這樣用大地的力量就充電完成！沒問題喔☆"
    origin: machine
    low_confidence: false
  - source_hash: sha256:de35daceae8dbc06b818fdb6eb35702509251ab4fccab74f8f32f6b1d86edd30
    lang: zh-Hant
    text: "因為你母親沒在你小時候打你的臉頰——\n——害得我的風，得來打愚蠢的你的臉頰。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:de3e8859540c914792c1cbfaff02ab7e6c31aa08adf72aa5cf5ad1dfe0c142f7
    lang: zh-Hant
    text: "「哈！太慢了！」\n兵貴神速，而他在其中又特別飛快。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:de528db4b02b8805660f868a7d32737287aef5343629b35d0f67f277ff4ae4f8
    lang: zh-Hant
    text: "密葬姊妹不會迷惘。眾多僕從為她們探路，鋪好前行的道路。\n要當心，老鼠、烏鴉、蛇、狼。至少讓自己來得及寫遺書。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:dec93a38e0a5aeac147f9b0754c91002db03c2d3eef643aa55c569e6a2b6d1a0
    lang: zh-Hant
    text: "過去少女畏懼惡魔，為了成為神的僕人而費盡心思。\n成為神之僕人的聖女，把惡魔當作不值一提之物加以粉碎。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:decedbdb42fae80b73ef246f7f51c3862e9084beb2de47ff16e72973a4a55e15
    lang: zh-Hant
    text: "「本日亦是滿天！瞧瞧吧，這圓滿充盈的吾輩！\n身在生者必滅之世，唯有吾輩是永恆的光輝！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:decf8df655588e64f5651c77e9fd32d02e6f3057db71ecdffb4013df4f762aea
    lang: zh-Hant
    text: 沒錯，她們毫無疑問是藝術家。
    origin: machine
    low_confidence: false
  - source_hash: sha256:deda7888976942d6e9aeb59e8e49478a1382c12445fff6e9c6819df2acab6763
    lang: zh-Hant
    text: "猛烈的風之精靈啊……！\n為朝向未來邁步的我們，在背後送上祝福的順風！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:df20f4dfad2f7b918f9647cbe94bafb59505bb570afe962a7739ee1b4027ded0
    lang: zh-Hant
    text: "甘於豐饒之人啊，誤把狩獵當遊戲之人啊。\n麻痺吧、痛苦吧、滿地打滾吧。接受神罰吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:df7bead2b2727af3987eb09009b9ebc004a98771f3527ffd8b6e71d4ebc6395d
    lang: zh-Hant
    text: "所謂研究，是為通往真理之路鋪路的可敬之舉。\n實證。實驗。所做的一切都是為了那孩子。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:df81f8a59feef544d0ee55c157ed834332e9a76a00072cd48b9f7beb1858bdf9
    lang: zh-Hant
    text: "因為我活在當下……比幻想更美麗。\n比神話更鮮明……美波，要閃耀了！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:dfcfb7808a94be4fef37da685c4cc428b6182709f2019ef3738cdfe2ba6f1087
    lang: zh-Hant
    text: 虎鯨發出的超音波，彷彿是在向同胞們道別——
    origin: machine
    low_confidence: false
  - source_hash: sha256:dfd1b777545aab60010dcb42d150d3e0430a83f7b4d03bc4de9856ba9293ce97
    lang: zh-Hant
    text: "在他揮舞的槍前一切皆成微塵，終於，連惡龍也貫穿。\n歡喜的人民讚頌他。偉大的屠龍者，聖喬治！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:dfe4421efd0969f50be4846aefb855df2528b40fce748283345785560cb0c3d6
    lang: zh-Hant
    text: "鐵砧與黑鐵都不夠用的戰事、戰事、又是戰事。\n不知何時合而為一的大戰，揮刀的唯有武士。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:dfeca105a4d51609ce9bb7651bf5d4b4a40208048eb1964c1fa1a9f6bce5864e
    lang: zh-Hant
    text: "黃金，將見棄。\n——『被看穿的真實』"
    origin: machine
    low_confidence: false
