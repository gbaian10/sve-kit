format: 1
kind: flavor_translation_shard
entries:
  - source_hash: sha256:9008010470806f2353892f0028edf217ac0e9041d4aa132ff8a113f805cfa6a1
    lang: zh-Hant
    text: "戰場沒有盡頭，戰爭沒有終點。\n那麼我等，唯有戰鬥到這副身軀腐朽為止！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9093606aeada65e60e61f58bdb004f4bbd6b3d0c436172392dc89517ab419ab6
    lang: zh-Hant
    text: "打趴你！\n屠龍終拳！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9095fd6c19c80bad19097e7e7dce602d3d5c0e5f8d436c0fcd382bca0f0fe978
    lang: zh-Hant
    text: "「可以窺見你在留學地累積的、修練的日子啊！」\n——留學感想報告會，歐文"
    origin: machine
    low_confidence: false
  - source_hash: sha256:90aaf38e59d6dd0d05d18c9d906aef5368af973d1ffbbd15fd416e1cada5d6ba
    lang: zh-Hant
    text: "在縫腕飾啦♪想做出Heart的手工感～。\n因為是Heart的大舞台嘛。當然想自己來啊……。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:90d9b48670a97a72cb4b1313ae14162f0429aafd6b744fb9332a8eb73ac4d7e1
    lang: zh-Hant
    text: "說失去敬慕是神的錯？連憐憫都湧不上來啊。\n安於承受而自滿的下等之輩，沒有資格否定人的依靠。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:91454e333d5e94b8c6c36a9d6343359a07cfa1ce236e423ca865012b6664a16e
    lang: zh-Hant
    text: "持續鍛鍊。持續變強。持續戰鬥。\n一切，都是為了讓瘋狂的戰士仍是戰士。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:914e1dcb308d2e68c29c25068cc5b1477637fe6aea63d834a0eb4d582c1ccb5f
    lang: zh-Hant
    text: "插在地上的劍，成為曾共談理想的夥伴的墓碑。\n即將刺出的劍，成為獻給曾共誓理想的夥伴的祭品。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:914f220bdeda91757c191e84a485a3b75889be56cb6183297d3a8d5114715f08
    lang: zh-Hant
    text: "外來者啊。你稱此為詛咒嗎。\n愚者啊。我等稱此為報應。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9150950c93e794acc8d5f79d256d4b7cd0c4d1ad4b917a2d9246788ca419dcc0
    lang: zh-Hant
    text: "你好，我是成田路！\n為了回應大家的期待，我會全力以赴！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:919495d5392d97be576671364f1e36187505f07d987f519f5a06fe0463f0bdab
    lang: zh-Hant
    text: "這個地方，還合你的意嗎？找找看還是有的喔。\n就算在都市裡，也有能打從心底放鬆的地方……呢。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:919702a2b1f234e34efa2d53b2c49192284a0a9c3036bd99a385ef9c7a9027f4
    lang: zh-Hant
    text: "不乖乖待著的話，我就用裝了聖水的子彈射你喔！\n……雖然不知道射不射得中！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:91f68d5850f79a46213999617874f639885ca645112f77617a42ac27b87e4446
    lang: zh-Hant
    text: "聽說在地上，這個叫做「占卜」？\n好像會映出什麼東西……咦，這不是我嗎？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9222dff473c88005a4a5b143f68acbd4501c7131c0c8fd2844fe882311d46a9a
    lang: zh-Hant
    text: "對不可饒恕之徒施以迅速的懲罰。\n射出的箭化為數道光芒，接連貫穿惡人們的胸膛。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:922c0b8a44592f91b97e0a5b851a5c110ba7a0bde5477d6ed2444fb98262278d
    lang: zh-Hant
    text: "鋒利的才華，天賦的煥發。……只會招來一群人渣。\n算了，無所謂。隨你們便。我也會隨自己高興去統治。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:926f5f518d39957d66f1600a905abbb610379e1f11b8451e17bbe6740e82d9e0
    lang: zh-Hant
    text: "乳製品的圓潤，恰到好處地包住了酸味……。\n也就是那個，用一句話來說……好吃。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:928a66893565c1ae3e09714f18b20e767697e3fa82606d6d843aea4e20f33d5c
    lang: zh-Hant
    text: "離開院所找到工作的時候，被血親罵了。「瑟霏太怠惰了」\n研究需要先預測再實證。而我一直在迴避後者。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:929cdba014cedd422c636cb593d11890d3ea9d0331125c90181e4e4bc69b9e9d
    lang: zh-Hant
    text: "為什麼呢。越是溫柔的人，越快死去。\n果然……是因為這個世界太痛苦了嗎？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:92a67b26976ca77586f6bb47e833591b7ea4bd310405daf8f6f5ad4b3a1962ce
    lang: zh-Hant
    text: "白色羽翼搖曳，藍色髮絲飄揚。\n從白色沙灘、藍色大海中走來，她就是夏天的化身。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:92a825b2662b4deebdaf5e71d287d921c2536a9ad9f388d17f86352c9c96f0f2
    lang: zh-Hant
    text: "「我有兩件事想跟你說」\n——老練的魔術師"
    origin: machine
    low_confidence: false
  - source_hash: sha256:92ae99b8d97667d4522c5b4506775573a5723265e29d285ade7127cb26e971a4
    lang: zh-Hant
    text: "來，帶我走吧。\n我會陪在你身邊。這次，一定陪到最後的最後。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:92d5277fd8263db4af8ec7ce26bf9760b4358d67e59fcd29655db34acfddf97c
    lang: zh-Hant
    text: "大部分都被打槍，在這間倉庫裡睡覺。\n不放棄繼續做下去……是因為，這就是我想做的事。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:92e479428afd4364561aa0262f63d5566d152f1f00f4c51dbf025389755ddd2a
    lang: zh-Hant
    text: "獨角少女為了人們的笑容而跳舞。就算被稱作暗黑舞蹈。\n「獨、獨角子也是，只要肯做就做得到！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:92fd2bcab25e871b2d49c1d0a17d53ea8ef0b2a85028f71bc7d02534079b1ef1
    lang: zh-Hant
    text: "這種討伐委託趕快解決掉，要去特賣會了！\n……當然，是和你兩個人去♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:931afc7041036e3577255f3aa9b7ff98d022e0061918c5ec71f520fc336b772d
    lang: zh-Hant
    text: "刀身是欲力的鼓動。今晚吸了不少呢。\n咦……吸的是你？刺的是我？忘記了。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:932ff4b0a91f31c1223cf11ea8a2e1bdaeb27826a027b8d7191c820fd58886e0
    lang: zh-Hant
    text: "不久在水面的底之底，鯛魚和比目魚翩翩起舞。\n喝吧鬧吧，宴會的正中央，海之主就在此。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:933226fafe89e2a2120d79c33cf45e4fca4729401b19ed685d5ca47d98f46c83
    lang: zh-Hant
    text: "Soldier One，起動。敵兵，捕捉。戰力分析，開始。\nTotalize，Start。完成。重力控制，開始。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9341c69eb928d698dfbf666fa16560d42c0d55cbc471f3815d078fcc815b7c77
    lang: zh-Hant
    text: "被神選中、刻下戒律的代行者。……無聊。\n我對一族也好、對成員也好……誰都，完全不曾相信過。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:934d9e0bcd284c911f9db8f4ceda46519b6d479481042b7f4931192a87cacf51
    lang: zh-Hant
    text: 逆理劍將同伴送往死地。背理盾，則是守護同伴的盾。
    origin: machine
    low_confidence: false
  - source_hash: sha256:936f4d62c9ffff70d4a5a54ddb1b70769d64f92190d5bf457d7a4201824b84f7
    lang: zh-Hant
    text: "既然愛上了就要賭上性命。來——\n妨礙我戀愛之路的是哪個傢伙！我把你剁碎！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:937024a9d02b978680bf78a35c94ccfc80490bf73ab347f7e207eabdaff51511
    lang: zh-Hant
    text: "我不會再迷惘，也不會再放棄了！\n用你給我的這份力量，我會一直掙扎到底！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:93ca33b47d646e9527bc22b633a54971dc13f6e21cf9f7dcbe5bfd72048acb60
    lang: zh-Hant
    text: "跺一下腳，大地就震動。\n巨兵每前進一步、再一步，城鎮就吱嘎作響、發出哀號。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9428a4f4c8708c5595c1da1c69826d056bffe7cbb95cb65f1dc3b88612f27aa4
    lang: zh-Hant
    text: "我們前線，正如字面是一條線。\n是劃分應守護之物與應打倒之物的，那一條線。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:942ca285a7d72a3c2f812faf2125f5a1dc3a686f1c2946eb1a570c447bc59845
    lang: zh-Hant
    text: "我們是一對。兩人合一的……貪食世界的巨顎。\n敢礙事就粉碎你——鑿穿爆裂吧，翁基亞。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:94329799138142b4b0ae399f54e44f7a0473b662283ae53818040145e00a4846
    lang: zh-Hant
    text: "雷光，從形體煉起是三流。雷鳴，從聲音煉起仍是二流。\n一流要從一煉起。也就是雷雲，這才是魔法！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9474c211d61b978ebaf4b103ec4c3ef713b1d2ceab6028ff1bfcc8aea8284c2c
    lang: zh-Hant
    text: "那你那邊……啊，抱歉。這不是該問的事。\n你握拳的方式已經說了，你沒有能報上的名號。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:948c3e199c76760adbe32d0136025b5bc31e77ee647430c4e9ac0173540676c6
    lang: zh-Hant
    text: "佩可莉姆使用的『王家裝備』的真正姿態。\n沉睡的力量獲得解放，賦予更進一步的強大。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:94f64ca7aed17a6de952a8fa69406a75952027bd8aefaf846c5bd2d2a2796af9
    lang: zh-Hant
    text: "武士最重要的是怎麼凋零？真無聊啊。\n苟活的恥辱才是我走的路。就算不乾脆，我也死不得。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:94f8215e1bbdf15ddf6c54aebd2c5d2152cb2b64a4af35cbe5396c70ac8f847d
    lang: zh-Hant
    text: "重要的是，一小片小小的勇氣。\n「可以……請你收下嗎？」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:95160c169eeeb2abeca3158c6c050e7fe6fd363a2f91f4b8b43742cff46941d7
    lang: zh-Hant
    text: "這是施予。燃燒的火、照耀的日，就連己之非，皆是神的施予。\n——深思熟慮的使者之福音，第三章十一行"
    origin: machine
    low_confidence: false
  - source_hash: sha256:955fe9c9a3747fbb381f091b061822f2d1021b51a6720863a919733785d258b1
    lang: zh-Hant
    text: "這顆石頭記得故鄉喔，會發出引導你到那裡的光。\n冒險的車票，算你便宜一點。……很可疑？別這麼說嘛！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:95657d9820bb877be0dc7930622b83787a0573a3d7cbca3c7fbb3788e848c407
    lang: zh-Hant
    text: "『恭聽吧。恭聽吧。處以萬雷、萬苦、萬死』\n不是駕馭而是借用——讓龍降臨己身、登上天界的女子。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:95e1368bce97034430badb5aae8af05628b823702ab6590a2781e8d754c8a200
    lang: zh-Hant
    text: "以疼痛強迫他人，若不以神之名進行，就只是拷問。\n——邪教的神父"
    origin: machine
    low_confidence: false
  - source_hash: sha256:95ebb7ea02b30fc764fd08b6e3c327d6307bf75bab2c37364e1c9207603d043f
    lang: zh-Hant
    text: "預言者述說。閃耀的火龍之星流逝的去向。\n「被綁著好可憐。我來救你喔！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:95fa4da948a9beed2d28c6251d15560b00a68954e90b970465525a6ea50e3c7b
    lang: zh-Hant
    text: "騎在自己養大的龍背上，周遊世界的少女。\n至今仍會撿回別的幼龍，一邊抱怨一邊養育。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9622c71020b9e1174ed6d5dc3cdafafd753a8e0cbd44b57d7ddbe7d2493a8455
    lang: zh-Hant
    text: "……比到目前為止。還要更、更——……\n不就會更喜歡上你了嘛！！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:962dd73665703cd339615b5fa03df0ae8ff974dd20147a10abf209c042fce354
    lang: zh-Hant
    text: "數千日的陽光、數萬滴的雨水，\n每一次撫過那鱗片，龍的祕蹟便得以積蓄。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:96447d95b51854305d4fb34e09e3b69f8d2a972fe2be96791791b59db10a5745
    lang: zh-Hant
    text: "侍奉的不是渺小的人之國，而是莊嚴的神之國。\n她們被稱為教會騎士，為不識神之人所畏懼。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:965574b319e7f54eff872d703c0258092332b73530c27a6ee0c30af2e7381597
    lang: zh-Hant
    text: "以血妝點戰場是二流、三流。\n一流就該以智慧用勝利妝點。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:968ce7fd23f4d51f5966e6ad8928160ec0b46db32605f0ea597c689ec87307eb
    lang: zh-Hant
    text: "小小的興奮延燒開來，連冰冷的戰場也能溫暖。\n身體在躁動。等不及了。啊啊，盡情地燃燒吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:96bb179926ca7b43d5dc8c5fea8b93e958fc78448fc9f87c5e3086aac8a25760
    lang: zh-Hant
    text: "「神鐵壓鍊法？你知道好難的詞喔。\n話說小小一隻好可愛。抱一下可以吧？」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:96fdce04b0112dd2292fe419cd77828c0ca158560cf6b5c08c990724c27ed412
    lang: zh-Hant
    text: "人之所以開始睡覺，\n是因為有那個連同黑暗把人吃掉的東西。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:970215732c5b2b2e769df99466ca11481ee3ab3ec0dceb7cfd62d4ddf65f4c3a
    lang: zh-Hant
    text: "人類啊，沒事蓋那麼多城鎮是怎樣？在炫耀嗎？\n唉～要是這片寂寞的海也有城鎮就好了～。……偷瞄？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:97051e1f0dc1fde7ca31e0fddcc862c96ee370a75014554cda4557d4ff3c7611
    lang: zh-Hant
    text: "從指導中就感覺得到。就算是我這種沒才能的傢伙，\n教官們也想把我培育成英雄的那份心意！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:970f0bab39b380c45f60090d1ef6ebe9052fd0a04f2826bd937697773c39e922
    lang: zh-Hant
    text: "浮現於半空的，露娜爾的魔法陣。其中有明顯的缺漏。\n葛芮妮指向佇立於學生們中央的魔導姬。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:971bab22ee4cff199755ce84e05d6f59941c9c8bcafc3742afd23dc52c7cabc7
    lang: zh-Hant
    text: "強大才是絕對的價值。弱者不過是塵芥。\n若想證明自己的價值——來，用力量展現吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:972d20406c777ed9ba5e3ef88d05ff6a1df053ede5536d826a2532925f28cd02
    lang: zh-Hant
    text: "貴安……今天早上，來得真早呢。\n這花是……呵呵。我想說可以讓教室的氣氛明亮一點。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:97702722b59f62c08dadb40bc2343aad5747432359698d41b2abb26933fa3abe
    lang: zh-Hant
    text: 神聖衝鋒咆哮，撼動勇者的靈魂。
    origin: machine
    low_confidence: false
  - source_hash: sha256:98292909b1e60e82d009c987e4592ad3d9961ffbc608de0feaef2d847aaf9baf
    lang: zh-Hant
    text: "小泉、亞子！客人都聚過來了喔～！\n那就，開始吧。New Wave的LIVE♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:986e6bd2e0859a8174e9a7f0a17c95fa01d35c6ac7f83a2873c7039fffc526ad
    lang: zh-Hant
    text: "『雷爾達最強跑腿』瑪蘿可是有自尊的！\n這位韋馱天只為帥氣的大人物奔走啦！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9889d512680446890adca53bc8d08a5d4cdc83af185046db011402eaf819e6cf
    lang: zh-Hant
    text: "雄大與自由相連，但自由與任性應當分開。\n「守護雄大之海的秩序！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:988f9d8f29115b37213864a75d97a494cb007465116b2f895fa8ee07617724c5
    lang: zh-Hant
    text: "牠們以家族組成群體。並且，將群體視為一個個體。\n所以和群體締結契約、成為家族的一員才是最佳做法。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:98eb418ee2d2c7ea885d1ec7cd824ff585803854514f7893e791f2edb25e0aed
    lang: zh-Hant
    text: "對我來說，這個鳥籠的世界，大概很相稱吧。\n光是能飛就很幸福了。所以，這樣一定就好。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:98f2f1e22195ea4b9eabd841006fe813f1a4b8fb1467404f2fb2166166bb5c19
    lang: zh-Hant
    text: "沒有才能的人的心情，真的很難懂呢。\n——白銀御門"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9914c3f6ae0a0d29967c5987e919ba673f02150e95e950219ec4815405a7a335
    lang: zh-Hant
    text: 在犧牲者面前敞開的，最後一扇門。
    origin: machine
    low_confidence: false
  - source_hash: sha256:992b5eefbd20ce16cc329f93fc24150611e9e729e9bb7de92faf7e079864ffaa
    lang: zh-Hant
    text: "獵了龍能得到什麼？名聲、金錢、權威？\n……不。是能捨棄那一天，逃走的自己。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9946ce5e6c5b82140a30dfdaac2536915c574bf285c276227bf2416d73f49fac
    lang: zh-Hant
    text: "哼……這是送給你的光啾。\n這道光跟你很像啾……耀眼得讓人目眩啾。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:997fb9206f992cdef2c6c127b0acb5128776995ec316d4beef75f6b737ad3ac2
    lang: zh-Hant
    text: "上百門派的互相憎恨，至今仍在持續。\n——『被看穿的真實』"
    origin: machine
    low_confidence: false
  - source_hash: sha256:998281039ca22a31a7492294369c3bdec8e8362df11a522bc8ae01c93f3b697b
    lang: zh-Hant
    text: "聚集在這處海灣的釣客，最想避開的厄運，\n可不是什麼「一條都釣不到」。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:99b2ae9e6bc76c76e6fd2e45429aeafbe3315c4aaa2bb926780464935b385d1b
    lang: zh-Hant
    text: "為了瓦雷莉亞的人民，我將執劍……喂，等等！\n不要摸我的頭！我可是飛空艇團的提督耶！？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9a0faa91097538b6363493d764b0c972af139d4f3b848e2ba601933af9890d4f
    lang: zh-Hant
    text: "不管前方有什麼，我都想保護騎士君、保護大家。\n賭上我的全心全靈！這份心意……不會輸給任何人！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9a5ee5f0210ade558e09fd0b464cec44ca6daf50237e1682579c83e9778f2297
    lang: zh-Hant
    text: "沒有流派，就是我的流派。\n禁術、祕術，什麼都儘管來。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9a649db925b964ac1806d5fedbd7f4f94960458b31f86d297314faef4e31802e
    lang: zh-Hant
    text: "超全力全開☆我可不是只會被保護的公主喔？\n為了這個國家……還有你，我要戰鬥！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9a6ebb3f2f3fcba1554f4c1c3bb0bd7c1073a341559567abfede4ceb5f1d7cd2
    lang: zh-Hant
    text: "心、天地、人的自由，一切皆入我懷中。\n——那麼，我將賜予世界試煉。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9ac5f91358c7819489d3c6902df539fbb01f7a460abb392f925b2f87a17c692f
    lang: zh-Hant
    text: "喉嚨呼嚕呼嚕地響……真是的，可愛到讓人發麻！\n——雷光射手"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9b042985af912afb33df1d108aca9b148a17f132ee3844de32f6bf3bc0cb20fa
    lang: zh-Hant
    text: "來——大家……要不要來一個？\n雖然非常酸，但對疲憊的身體很有效喔——。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9b1c10581645d520e51f3f3ef0d5e143afba8f269d1bf6f6adf4d8080e184178
    lang: zh-Hant
    text: "降下船帆，壓低聲音，然後向神祈禱。\n風暴要來了，大風暴要來了，牠要來了。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9b21c885eddb04351295088eef2a0cf445acb6d82d896038b9280d3a7f21341d
    lang: zh-Hant
    text: "生命的核心在於循環。花結成果，芽萌生徵兆。\n——不殺的試煉，於我的路途上並無必要。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9b21f056b9634a4525e5d46647117dc8321d472b94e394a950671a4624cb7b5c
    lang: zh-Hant
    text: "「別撒嬌了！你不是還有一雙好腿嗎！」\n——德蘭茲國際學校的熱血教師"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9b4bc393def36f2023dc64a69504ac87eb14810520a1d975e6ddc62acdfaf5db
    lang: zh-Hant
    text: "飯是生命的能量☆\n一起吃飯，一起冒險吧——！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9b78e1723a7805ae95ec4521d914fbaa8f42a3eb5f4a664bbc4a7a145b5dc4c1
    lang: zh-Hant
    text: "希望你能陪我練習。沒問題沒問題！\n我會好好手下留情的！呵呵，大概啦。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9b851483d700217995eb9e8bd293d35681c4f7fd0e81692aa4346f03a228b7d4
    lang: zh-Hant
    text: "痊癒吧、痊癒吧，試煉的旅途沒有盡頭。\n「讓我緩和你的疼痛吧」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9bb9a6fb12ec055aa92592f83955717683af0456a7e0a0416fa2ae06fad15e09
    lang: zh-Hant
    text: "委身於草木，被森林擁抱。遙遠漫長的旅途，幕間的休息。\n「聽得見森林溫柔的聲音……欸嘿嘿，好溫暖喔」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9bb9d170618653ace7a63538f57b15ac6a5af36d117c1e320afc7ccfa1640c49
    lang: zh-Hant
    text: "向眾多神明、向偉大的意志，展現名為自己的唯一。\n——來吧，繼續世界的試煉。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9bf08fb7299cb59786a607cea112f6e2a5d8bb96dbc76cb7782725ed2fc0c089
    lang: zh-Hant
    text: "別離開我身邊啊！\n不管來的是什麼傢伙，我都會把他砍成兩半！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9bf85bd3340121e1c0fa9085a37844e6c938fbd3730f1c0df2ff8a1337046d90
    lang: zh-Hant
    text: "「我承認。那銀冰，配得上當我的好對手！」\n——烈絕侮蔑‧嘉魯蜜兒"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9bfbe085221f669402bf5ac9595eba14b8907c662040cdcaa23aeef092a632e3
    lang: zh-Hant
    text: "過去，真實的試煉已被跨越。\n世界新被賦予的，是絕盡的試煉。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9c010a4b92f0606c297a77e35c9a4e980bd778436e1a683a5a14eeb24a7f053d
    lang: zh-Hant
    text: "起司要節制，當提味。不是「咚」地放而是要到「嘩啦」！\n提味也好、放進去的心意也好，希望有人能發現！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9c088bff9822776fbf9d448679c1082a23a0dcc0b85e775188cb2e9988da0659
    lang: zh-Hant
    text: "認識她的人說。\n在黑暗中閃現的那把刀，是對抗邪惡的旗幟。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9c096f8cb757a739edf6226076a323feb327392bc83f89638ea2048b1baac93d
    lang: zh-Hant
    text: "現在的暗殺是以ＮＥＴ為主流對吧。\n連上對方的電子腦，讓它短路就完成工作。\n可是，連臉都不讓對方看到不是很失禮嗎？\n果然還是要在現實中讓人觸電才叫暗殺吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9c1ad9e687b9b732e5d4af9487be17364fd2418d3a3111751b9500f049485284
    lang: zh-Hant
    text: "我的魔力和你的力量正合而為一……！\n來，放馬過來吧！今天的我可不一樣喔！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9c20499a8491b158be49155b91e4da73af9b30ebd80d7aebce7b37cc305a5268
    lang: zh-Hant
    text: "學、學生們都為了夢想和目標拚命努力，好、好厲害啊……。\n我、我也要加油……先、先從跟動物說話開始……。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9c33e9a6e118807270d44957865cc367a1fedb9686f9c907bd00133d6487f03b
    lang: zh-Hant
    text: "當時的將軍，臥病在床。志在天下的武士，一字排開。\n無數的刀出鞘，合戰之雨即將落下。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9c34cd8dc51cf27b4a4d0e26df0b98c47b4577d88ec7b352c93c160aa62e08df
    lang: zh-Hant
    text: "財富給了生命，卻沒有給予活著的意義。\n是故——崇拜神的人留了下來。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9c58cb97207970805c0f34b1b35b15c4033298d8c32f7a36f98910d422b93504
    lang: zh-Hant
    text: "喔喔人啊，迷惘吧。答案就在混沌之中。\n我也是在迷惘的盡頭找到了它。那唯一的答案。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9c5bbb77c497e8e67219bf90f77f1c259c0ba620431c4b397c09b8945e8ef1e4
    lang: zh-Hant
    text: "友軍的希望、敵軍的絕望，一切皆在我的指揮之下。\n——勝利已經確定。全員，作戰開始！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9c7061c036d668bbfc148b92f89b3b89241d9e9f2952e47d13ee50ebd864acdd
    lang: zh-Hant
    text: "雖隱忍於外道的世界，卻從不追念所殺的性命。\n斬裂不知悔改之惡逆的，是在黑暗中練就的會心一刀。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9c816c23ee22e560f2dab3c492175982dee975a2ee5e66a0e502596c305f67ff
    lang: zh-Hant
    text: "呵呵……沒問題的。是我們的話，一定沒問題。\n大家同心協力，一起加油吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9c8ab081ed71227ebf4c4427d4a220bbcdca2f1461abb4c9b4f81857918bf925
    lang: zh-Hant
    text: "今年的戀愛運是……「應當抓住對方的胃」……\n……騎士君，肚子餓不餓？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9c966c4407dac2ebeb17e84ce6f8a655818d40be8806325552bcdf798b85487c
    lang: zh-Hant
    text: "幼時，我解剖了院裡的雞和雛雞。是為了實證臟腑的構造。\n步驟明明很完美，院長卻生氣了。「不要偏離人道」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9cc42231ba7ab389b250c9732583f5d5ec268d5a776b822629235369ef53b41a
    lang: zh-Hant
    text: "真實在我手，虛偽在汝。名、位，連志向都捨棄吧。\n若說不捨，我便將之摧毀。如此真實便將開啟。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9ce4464ebdf7e3584bdafa8b02468811cd26f5d5b63a720268f69a9fa758304b
    lang: zh-Hant
    text: "接到報告的指揮官，嘆了口氣抱住頭。\n「侵攻部隊被藤蔓絆倒了？是沒看腳下走路嗎？」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9cf5618df030bef5fc44f75ffdbfd8cc3f286f5ab0a29fd7d51a5fa8695c9c35
    lang: zh-Hant
    text: "聲音、呻吟、歌的含意逐漸滲透進來。\n被她重新塑造，嗚呼，美好的我就此開始。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9cf95b10dbfff4a9fa0afecb8b583096c66e4b720a3b9aa7450fc105b9e657b1
    lang: zh-Hant
    text: "我該擔負的愛的形式……。\n那是奉獻的愛，付出的愛。我會竭盡全力，為您服務。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9d53c68b6b82795eb71a6f4c8a2bdeaa40de7f6e2537f51b5e0326981a951e56
    lang: zh-Hant
    text: "我們該知道的，是魔法的用法——贏的方法。\n要改變這座『學園』所需要的，唯有勝利。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9da8c7de9b97a5b82e1845c0c1fa9e48a51b7c168b7ea51b0a968a77bd91f8e7
    lang: zh-Hant
    text: "可怖者陰陽道。相傳之，不祥之咒。\n作為占術流行之後，用於戰事，誠然可怖。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9e267e2615c601b6e806a44eb30afa11d2f9ddd7a01ae32cbdbfc38b3b97dd62
    lang: zh-Hant
    text: "弱者只會被掠奪、被壓垮。那是命運，那是宿命。\n然而——彷彿要反抗那命運一般，有一群挫敗強者的人。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9e38e6dd1f4add9ff0b7e2a1a8fa3157b08bd597ecee4e3aa706a0c9f2b1c779
    lang: zh-Hant
    text: "大家開心地笑著，比什麼都讓我高興。\n能在這樣的地方和你一起度過，真的很幸福。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9ea71c9ebd095ae7c114c1b1f2cbf79a7a5905ad2c134257e4caeb66867d8745
    lang: zh-Hant
    text: "樹木的憂愁、花朵的憤怒，背負這一切是女王的職責。\n我會前進。不是獨自一人，而是與森林同在！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9ed733dbf78bff21dc82985c793cbcc8f9f9cb8289fa56c3daada2ad623cff72
    lang: zh-Hant
    text: "穿過昏暗的森林，映入眼簾的是一隻鬼。\n守護四季的守衛，抑或是賜予死期的獵人。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9ede0759e0f0c319f716c94d755b65bd748f6bc80da7b98aa43c450011361149
    lang: zh-Hant
    text: "好厲害！有好～多衣服，看得眼花撩亂！\n你看，這套穿搭怎麼樣？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9ee68bd647ba086660ff8e01f4586052cb3616ed78c4c71402314dd202707cc6
    lang: zh-Hant
    text: "捏爛撕碎破壞，不留痕跡化為塵與灰！\n真是難看的模樣啊世界們，在我之下最適合你們！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9f5ea5d68ebb9a39fdde43c973a9f89190ffa3ab7bbb45b342ae1b6b28588563
    lang: zh-Hant
    text: "啊等等等等等！汝等，想對那具木乃伊做什麼！\n年代久遠的珍品繃帶，會受損的啊啊啊啊！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9f8f969cebd3e1ca492c89dbcb423400737f51000f0688f19337283177013227
    lang: zh-Hant
    text: "你知道嗎，吸血鬼。人也同樣活在永遠之中。\n傳承下去的人之意念，總有一天會毀滅你。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9f92d58cb8b22f486ea907ddac95cc7bfe9da10090a1e83ec00debe36dd3081a
    lang: zh-Hant
    text: "聽得見的，只有風聲和心臟的鼓動。\n沒有其他任何人，一片純白的……只屬於我的世界……！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9fbea8fc2a0bda7db6600bd91da42bbb39eed9e7cae6bd05ba88338961ef5700
    lang: zh-Hant
    text: "冒出的芽生出莖，帶來更多恩惠。\n立誓之人，鍛鍊自身成為強者，守護恩惠。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9fcce872c792f7eca50af17a02af0aa2bd9f8ef4ac6e2dccb71a2a343b71720e
    lang: zh-Hant
    text: "不管多熱，都能讓會場擠滿粉絲……。\n派對咖幸子，連大自然都能贏！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9fe43d93e1bd5290eb78f75edf00efa002d13a7e2d7916c76f5f7e757e84339d
    lang: zh-Hant
    text: "儲食行為時，有依品種與品質分類餌食的習性。\n因為在篩選魔石時很好用，在魔法使之間很受歡迎。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9ff06730d58805a25d0b2762710ef7e96453da7ee7222978e780a28355e85bcb
    lang: zh-Hant
    text: "如獸般的剛並非本質，翻騰的流才是本質。\n越是年老，其身越接近應當追求的高度。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9ff2e834c400f50ccfdb151c3de73f4259873bc7fe712e90baf4b2c06485f400
    lang: zh-Hant
    text: "「呵呵。真是的，烏爾潔……睡臉跟人類一樣」\n「唔喵……姊、姊……」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:9ffc4880aa0c24af204f6a3cbd84c83cf119f33768f73fb5cfc07ab02ee42a01
    lang: zh-Hant
    text: "逢魔之時到了。是我們的時間。\n——出航的罪人‧芭芭蘿絲"
    origin: machine
    low_confidence: false
