  - source_hash: sha256:3b2c056b7688de4f0eb51634b1e012d55e8397921d222f64813edfd5ad6c9460
    lang: zh-Hant
    text: "哇～好棒！魚兒們，真的幫我蓋了一座城鎮呢！\n謝謝你們為了我這麼做。不眠不休，眼睛都黑了一圈呢！"
