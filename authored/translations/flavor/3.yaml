    low_confidence: false
  - source_hash: sha256:3b7401017daca075cab050dc37adb699fb44ad40245bdb71007e859939a31b23
    lang: zh-Hant
    text: "與在戰地飛行傳令的近親不同，這是隻懶惰的飛鼠。\n不飛翔的皮膜撿到的，是寄宿著神樹之力的碎片。"
