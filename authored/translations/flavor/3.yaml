    low_confidence: false
  - source_hash: sha256:385acab281d216af284caa1b5749a724b2167430fc98cf4bac2ae9219bf262f6
    lang: zh-Hant
    text: "惹我煩躁的代價——\n這個一定是100000金幣。"
