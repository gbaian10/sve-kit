    low_confidence: false
  - source_hash: sha256:3b4f9d5ac705eef1501eec56b38f3f3ee78702bb03716615564cc341178d7988
    lang: zh-Hant
    text: "您可知道，高貴之人的義務是什麼？\n就是永遠當人民仰慕的憧憬——縱使死去也一樣。"
