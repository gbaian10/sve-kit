    low_confidence: false
  - source_hash: sha256:3e3811cb68dae075096e8d98cad3392f60245f4659ee172e711ddc7ec543c66c
    lang: zh-Hant
    text: "獵人還是被獵，決定的不是我。也不是你。\n由這陣風決定。祈禱吧。祈禱箭射不到你。"
