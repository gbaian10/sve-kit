  - source_hash: sha256:382a03c54f00ca6fa6a37c3fcd19019a80a6e6acfd14f5dce994ed7d72025550
    lang: zh-Hant
    text: "瑪娜的光輝，是生命的光輝。汙穢消散，自然增添色彩。\n向勇敢的人們致謝。母親，此刻回到這裡了——。"
