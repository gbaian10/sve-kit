    lang: zh-Hant
    text: "為了讓無所嚮往的心所憧憬的對象，能由自己來成為。\n——『奧德珠寶股份有限公司的理念』"
    origin: machine
    low_confidence: false
  - source_hash: sha256:3cf593cfc5eb7202426e1547ba2ae3bf2c9ff8433bc40944fce88bd6ed836f21
