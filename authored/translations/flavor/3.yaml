  - source_hash: sha256:3f2fc55de4402923f87ce573e23e69145e0c086e4efc54e0849eab1a73852fba
    lang: zh-Hant
    text: "更大膽一點，同時又要健康！\n打開夏天的門扉，迎接新的挑戰。連那顆太陽也是夥伴！"
