format: 1
kind: flavor_translation_shard
entries:
  - source_hash: sha256:305719c3a5144cb51980b075f0c4875bf4c15ad25a224930d538761c0e4b7396
    lang: zh-Hant
    text: "我有個孩子。這孩子啊，是跟老公一個模子刻出來的獨苗。\n在把該交的東西交給他之前，看來是沒辦法退隱了。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:3089c83bff77c5e342ec46ba4cfab5134a17c590f39bc52ecf71496f5d78d6d9
    lang: zh-Hant
    text: "被大鵬鳥吃掉的人是幸福的。\n因為全身上下都會被仔細地品嘗後吃掉。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:309064e04142337a4ae74d084716b8ad35688b8ae4ddcba0269d914b10f40c1a
    lang: zh-Hant
    text: "討厭春天，討厭夏天，討厭秋天，討厭冬天。\n任性的天使，只對你有一點點喜歡。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:30aa6e4da9f6574a378af3a62a2ba4cf0e58c1aee3c6e81a17994c820bcc0115
    lang: zh-Hant
    text: "今後也想一起跑下去……不，我會跑下去。\n因為只要不停下，就不會停下。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:30b1835ba40bb6892c624fd4bd86de0bef82e248e982f8c18bebf28c59420d98
    lang: zh-Hant
    text: "就算有一天要展翅離去，我也不會忘記這個人。\n只要看見遼闊無垠的大地，隨時都能想起吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:30db95fa50a946ef3f3cb0b7d74a8179faa07fd0cdc4b5e32d721874f0ec8f36
    lang: zh-Hant
    text: "旗魚翱翔於海。\n為了以那銳利的角，貫穿侵犯大海的惡徒。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:30e9c416b3db205ce4812c4f3055f7de0188749520c8b1716640d73931ac95ab
    lang: zh-Hant
    text: "在弱肉強食的森林裡，為何要自己垂下耳朵假裝弱者。\n不去想這點的盜獵者會變成落荒而逃的兔子，也是很自然的事。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:3127432761fcc99b2f0224ad8423d10404d2de2d501e5d708a71b5e93639db80
    lang: zh-Hant
    text: "我想變強，強到不輸給任何人！然後——\n總有一天，要成為日本第一的賽馬娘！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:312bffb2aaf8339e9af917dbc2c8e1a77fa2d17ea619348cd8576070d3774d5f
    lang: zh-Hant
    text: "斬盡之後便是平穩，漫長的戰事如今已成往昔。\n在祈願永久和平的時代，頒下了不戰的戒律。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:318469d83bb22e7435c88a52f526dd341cdb5ede084049b6fe8fb8f8c0f8316c
    lang: zh-Hant
    text: "無須畏懼，毀滅絕不可能。只要忍受永劫即可。\n——既然如此，就賜予世界試煉吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:319c6c335e65d16db9397951f370a26dca157f8753a10e9c8281286cf33ea969
    lang: zh-Hant
    text: "咲戀愛用的髮飾。\n象徵溫柔中的堅強。翅膀一振，身體便忘卻重力。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:31c7d6d70cedf963fcc9b6f0ea7194f316dd8ca42cdf76beb21f8288e7f28262
    lang: zh-Hant
    text: "操縱大氣、棲息於雲上的風之精靈。\n雖如叢雲般飄忽不定，卻以溫柔的風推人一把。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:31ca077c2a655099726585fd498eca24b481a49c46b166e7081437e4d0e348ad
    lang: zh-Hant
    text: "美麗的古代都市遺跡。夢見了父親說他見過的光景——\n少年與結下友誼的虎鯨，踏上尋找浪漫的航海。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:31d12a8d1a3bdde21d4f6d2e648c97048d53a9bfab66ae05fdf1d84e43dcc288
    lang: zh-Hant
    text: "——其為《聖杯八》，所示為《放棄》。\n以柔和的笑容、沉穩的聲音，向渴求之人講述道理。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:320611f098f937d4d53b4c7aa5556c49fe9498fd2bbe77598b6df57cb01dd1ba
    lang: zh-Hant
    text: "只有自責不斷堆積。不知所措，漸漸被掩埋。\n所以啊，一起痛吧——我會為你注入，好多好多。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:320a3317026fefbd811a531fa46fa62e7c26cb41979736bcb0b3cac7f175967a
    lang: zh-Hant
    text: "「用我的知識，活過久遠吧」\n——永劫欲求者‧關德溫"
    origin: machine
    low_confidence: false
  - source_hash: sha256:32262fbc6dfd26efb582a4edfebd8ba7e0f3e038c0adcf75614d7a9f78a4a8e0
    lang: zh-Hant
    text: "那座雕像，是為了看守值錢的寶物而擺放的。\n盜賊大概也想不到，那座雕像才是最值錢的東西吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:3227e531778e116cf811af74e25fef6ead18610c8a56141dcb0cc1f3b7a2d026
    lang: zh-Hant
    text: "邊境出身的王國騎士團長，與你重逢讓我想起來了。\n我曾懷抱什麼樣的夢想，這塊紅布又是什麼……。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:3237c334744d6b1c086805a3babd515f34cbc900fc56454b832fc49f0df198fc
    lang: zh-Hant
    text: "我是八重無敵。期望與強者比賽。\n作為金剛八重垣流的門徒……來，堂堂正正一決勝負！！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:324dfed164ada37482f7ff899a33ea0441a7dcaea1ce93576c907118b5f2d96a
    lang: zh-Hant
    text: "「Goodbye！Bad Boys！\n用我的祈禱Power砰！地退治掉唷！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:326bee1e0f079c032840915f76dc911007ae744e48433796f96e2ac1eaed04f5
    lang: zh-Hant
    text: "與伊莉亞共度漫長歲月的斧頭。\n迸發赤紅魔力的巨刃殲滅敵人，啜飲鮮血化為主人的養分。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:3281fcf35e425ac3d9510ae2dfafa98e920babb0da54ff388660bba454f8e6e7
    lang: zh-Hant
    text: "那傢伙開始跟成員們密會，是什麼時候的事了。\n「全都是為了你」……我可以相信你吧？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:32aed86513704c2015bda34e76bea71870eb31ddb704314e50d3711a567bc965
    lang: zh-Hant
    text: "受教，而後成長。人人都蘊藏著這份可能性。\n聚集年輕的才能並加以琢磨，便能抵達獨自一人無法企及的高度。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:32eaea8e00fd4c9fd35e92262b84f4079bc4229f0b2bf1576820d04ab775f0e3
    lang: zh-Hant
    text: "主之所望，即我之所望。主之所願，即世界之所願。\n不需要慈悲，我將制裁你。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:332416143496e0f191a3b2e3acbc39e5531c53c78dafa1c1cc650db78e1740ac
    lang: zh-Hant
    text: "你或許曾被神所愛，\n但我的神並不愛你。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:335da66d3b48a1c8df8ba7dc3df2b318c34d7f82a2977b589fc64f55261cc1fa
    lang: zh-Hant
    text: 數名聖騎士，在魔龍導師的詛咒面前力竭倒下。
    origin: machine
    low_confidence: false
  - source_hash: sha256:3366205ed1fe52b9ded65fd453744b917c2fbb126b44acbb38c2608300522467
    lang: zh-Hant
    text: "因為群聚而來的敵人實在太小、看起來太弱，\n龍心生憐憫，放棄戰鬥飛走了。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:33666ae2371575aa6fa060bc85da51283f1698946d6a20226fb76187ccb033a6
    lang: zh-Hant
    text: "被壓著吧，武士。壓在老婆的屁股底下。被孩童的歌謠取笑。\n然而他們，持續鍛鍊。等待的只有一件事，為所當為之時。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:338c3ef83add7e14f4274acf2dd578c2d6e7295688e925ad3f44b5c60ec87657
    lang: zh-Hant
    text: "「……因為母親大人為我留下了戰鬥的力量」\n——無謬偶像‧雷琉"
    origin: machine
    low_confidence: false
  - source_hash: sha256:338dea8005e7f6524c1f66718550b863cccb585241391c84fdbc17a15dc37763
    lang: zh-Hant
    text: "我憐憫你們，並且，不會再讓你們繼續受辱。\n侵襲你們所欲守護之物的苦痛，此刻就是斬斷之時。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:33ad0e195100e8095f3c85dee756c634bccf463a1f072a61371c6dbfea245ee2
    lang: zh-Hant
    text: 高等犬的武器，不只有牙。
    origin: machine
    low_confidence: false
  - source_hash: sha256:34108cf96b148003f9d3181d119f43a656973810cb95294fc30298e033b18256
    lang: zh-Hant
    text: "對還不成熟的她們而言，最好的指導方法。\n『管理賽事生活的一切』。那就是……我該做的事。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:3418aa4880325bd69477a35acaedaa0ea69af12c5267ba9f8832ea358a8debec
    lang: zh-Hant
    text: "和騎士先生的羈絆越強，我的力量也會越強！\n……是沒關係啦，但你不覺得有點太近了嗎？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:342cf355046f20181289bda6ad9303d9f53bbe8ce03414aff6d6003141f9dd1c
    lang: zh-Hant
    text: "晚安♪我是這位仙狐大人的隨從。\n要不要摸摸這累積了功德的紺色三尾，沾沾福氣呢？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:34446d55f74d3548d3a9421752dc85bace73dfc7ce762009d5007c7e9575f438
    lang: zh-Hant
    text: "哥布林們把撿到的那東西，各憑喜好地用到爛。\n尤其喜歡拿它來當雪橇。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:3455eee16384cc455234163a9622d018089e1a850af50f9f51807e6b75b7e5de
    lang: zh-Hant
    text: "沒錯。就是這個，這個！努力的時候就該全力誇獎！\n我，好可愛！好了不起！好隨便！……咦？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:345f978b49afa6b0d57e18f026742f5e7b2869992caf34204db3ba08522a2f88
    lang: zh-Hant
    text: "真正的歌聲，不是能傳給所有人的東西。\n真實的歌聲，應該只為了一個人而存在。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:348c198952e343caab17e9b1af1011a7f166040c6b3ad34cfa31516dca454503
    lang: zh-Hant
    text: "公主掏耳朵，還有公主呼呼……。\n啊，不。我是想說以這個姿態的支援要做點不一樣的。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:34cc3873e1ead52c7194e2011daa1f08d2d94533299e8be95d12af0fde408eee
    lang: zh-Hant
    text: "\"戀愛的咒術現在才開始喔！\n——戀咒術師‧莉姿\""
    origin: machine
    low_confidence: false
  - source_hash: sha256:34dc0c5ae4d9123fc5b3f523591300c2051cf28a9fbdc01c10b0eac1b13c776b
    lang: zh-Hant
    text: "不愧是從師父那裡（擅自）借來的笹針師祕傳書！\n夠厚，最適合壓泡麵的蓋子！哇喔，安～心☆"
    origin: machine
    low_confidence: false
  - source_hash: sha256:34dfc60f9f9d4a7d16656306bad8586056550668f452ce29962b74f93e7b9a2c
    lang: zh-Hant
    text: "喵呼呼，你剛剛在看未來對吧。\n夏天的貓咪啊，連海灘上的視線都會獵走喔♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:34e5dcae7ad4e6bc6a03ad55aa607bb224a05c9934937e7635151a354bd5b1da
    lang: zh-Hant
    text: "與人魚似是而非的水棲妖物。長著醜陋蹼的魔物。\n據說會欺騙人、將其拖入水中，吞食人肉。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:34e8df79f3f4da2c3ae40e63d9fc7a7581f66afad032e3f22631610a51c1365a
    lang: zh-Hant
    text: "啊——真是的！不要一直跳，不要靠近我的臉！\n跟教科書講的不一樣！不是給它魔力、帶去散步就好了嗎！？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:3518dfc9eb3a14924a4a40ae2d5611ac60d6ef143431b3835c0b0c0938ae3393
    lang: zh-Hant
    text: "雖說同樣是吸血鬼，被做了奇怪的事還是會很困擾的。\n那麼，馬上來處罰……咦？原來還有氣啊。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:3578a04eb74a944b3285142351d648584def5db28d0577b1f8260d0d2cd10d5d
    lang: zh-Hant
    text: "老爺爺上山獵鬼，老奶奶到河邊洗鬼皮。\n「這就是異國的驅魔？比在繪本裡看到的刺激多了呢！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:35846511021d9ae420bce45f090037af2756261074a8d8144354d332e7270e77
    lang: zh-Hant
    text: "世界脆弱得令人憐憫，一碰觸生命便崩解。\n故黑龍代為執行。那催生強者的，絕傑的試煉。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:35dc366f6a3bdb827b512ab32e028e8595c304df89e1da49e421ba6a6c272ac5
    lang: zh-Hant
    text: "奠定鍊金術基礎的才女。\n近乎貪婪的求知慾，讓她成就了偉業。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:3605f01e2727c03d4b74d4d19e4b237a1f981d7dcd41781f31ed39f5996f45fd
    lang: zh-Hant
    text: "總覺得好像真的進到童話世界裡了呢～♪\n日菜子，好興奮喔～♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:3623c34cc3321ddae616be83885b78036572c15b329a9cb95a165e3638bebe98
    lang: zh-Hant
    text: "請看這穿透力！\n討～厭又頑固的元凶，只要用這支箭就像這樣！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:367e8d9964d848ff742f1a8481a5a87173867173e5816e093c1ad3fc5ae68df0
    lang: zh-Hant
    text: "渴望黃金的，奸邪蛇龍。\n以駭人的鋼鐵之顎，將覬覦寶物者切碎、粉碎。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:369595b7add0e4e8fbe2a5daf7f3634aa15e2307c87d534a60b5a1bea751ff18
    lang: zh-Hant
    text: "能在身旁欣賞妾身豔麗的姿態，可是只屬於汝的特權喔。\n以身為特別的眷屬為榮吧♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:36a0ae6cfbc4c6d9c861c8d0205b13b7ff7516c48729be289b79f19b9389b69c
    lang: zh-Hant
    text: "我埋葬了，過去的自己。新的我不用跳也能飛。\n為了私利而得到的自由。但是，不知為何很空虛。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:36ac79a9b1595a6724ff9f3de3a4accb9bcc90456340abdd5de98e47f0bbf451
    lang: zh-Hant
    text: "尋找夫婿之旅的旅伴，是還需要照顧的龍寶寶。\n結婚之前先來了育兒。少女的旅途與睡眠不足持續著。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:36b3b9cc99a784242d71656551bae6e6b2590fd9f0b0a2886d55e358516b7e9c
    lang: zh-Hant
    text: "「我真的真的，可以相信你嗎？\n如果你允許我信賴你……我就能為了你努力！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:36f674c3124eb09de99a79c682533573c701b010a4ed37dcebd0180152adbc96
    lang: zh-Hant
    text: "毀壞的是，牆、士兵、所有東西。\n早已毀壞的是，心、意志、他自己。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:36f9de6e89a2125f5f38faa868aaf780e0705817c9c3f5943ec8b8498c3ca65d
    lang: zh-Hant
    text: "人類哪顧得了我們家的爐子！沒鱗片就滾回去！\n那種嫩皮，光站著就會被烤得焦香啦。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:370647b00f284f9807ddf34ea0107153bcd48237997ea5951cb4e18705582a39
    lang: zh-Hant
    text: "世界和我，你要選哪個？\n答案當然早就決定了吧！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:370d9227da45c76c5fe78a1c58de3e94ced150c0a3f1f9fdadb0bc5f7896492e
    lang: zh-Hant
    text: "在空中寫文件的訣竅，嗎？\n嗯～……在紙掉下去之前更快地動筆，吧？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:371d466170bbc29947d31570b384f4a4da21947a7e1ba956502d0e7f5acd3828
    lang: zh-Hant
    text: "再度誕生的神聖之獸。現身的是原初的愛蒂倫瓦思。\n當欲望膨脹，黃金也變得強韌，貫穿獵人。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:3722980a1f093bb4b4678df66232824f4aaa600845cf5a5e257a7df3d9f9195f
    lang: zh-Hant
    text: "重要的是，要愛自己。\n如果是為此幫忙，就讓我來吧！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:37546bb88466013a74715a09c89449cf8c6337753f7bf3622ea56bb87ef1c306
    lang: zh-Hant
    text: "身為空挺團之長的姊姊，身為魔導院之長的妹妹。\n讓滿溢的睿智更加順暢的，是多到滿出來的甜點。"
