    low_confidence: false
  - source_hash: sha256:3883fbb57bd339d1099b06c16b9d7e3de65def283566cd9a2811ca3e5c64f0f6
    lang: zh-Hant
    text: "「滾出去。你這一族可恥的傷疤」……嘛，我沒異議。\n離開，然後了結。就這樣，繼承人確定只剩大哥一人。"
