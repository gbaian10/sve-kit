    low_confidence: false
  - source_hash: sha256:3da84ffbc6b01a3b98e81b702f4d52b341d745f137d2607cb59e946c7c24649a
    lang: zh-Hant
    text: "如今冥界在天之上，如今天界在地之盡頭。\n你知道嗎，那個、彼之、那東西，改變了一切。"
