    low_confidence: false
  - source_hash: sha256:384dd44f178ae69ad63889fa69e42960b742f0c07b011fafcdfea704c1d8f447
    lang: zh-Hant
    text: "奏絕帶來的是白色的成長。\n明知會就此毀壞，仍想起遙遠的歌聲。"
