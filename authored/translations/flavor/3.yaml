    low_confidence: false
  - source_hash: sha256:3ad3418cdf964b989be8fb1ffb233f1ad9f434cf4c5ddf6a7cf43a505e49c56d
    lang: zh-Hant
    text: 歷經悠久時光，此刻蒼色騎士復甦。
