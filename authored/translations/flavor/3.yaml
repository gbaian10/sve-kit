  - source_hash: sha256:383375d179bcae6648697e9709f2da29831fad6da276c42298bf1d75c58525b6
    lang: zh-Hant
    text: "若平庸的大龜能活上萬年，\n那麼對身為其首領的主而言，就連悠久也是瑣事吧。"
