  - source_hash: sha256:38e26e98ef75e237b277a03f1dde003e400830f7f92a770d6ef02b2b949bf3f0
    lang: zh-Hant
    text: "「不適可而止的話，會出大事的喔！\n老實說……生氣的姊姊比神還可怕！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:390c73b5e59f6e6c13138186ccfd298900895851c04a7b6766ea7bbdde39dd2b
    lang: zh-Hant
    text: "曾被嘲笑為戰場愚者的戰士，正陷入混亂。\n「嗚喔喔——！跟同伴走散啦！這裡是哪裡啊——！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:3922e01338a34671abd46d1b62e483a91b964335cfa6ae6e0a2fe56e91f86999
    lang: zh-Hant
    text: "守護冥界之門的《看門犬》……的，看門犬——魔犬。\n看管奔放的《看門犬》，就是魔犬的職責。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:39319b89a5e20ce0f85597143aa96e7d5be71617d513869a65f48362900bb1ee
    lang: zh-Hant
    text: "「童話公主的房間裡。果然，還是需要龍呢」\n——龍之魔女‧莉莉尤姆"
