  - source_hash: sha256:3773a0f12f737dbd04b06fb914eb7e70aa56946064a7439ab5f4ce539605c6ea
    lang: zh-Hant
    text: "作業卡住了嗎？老師來仔細教你♪\n首先，這篇文章的意思是……咦？靠太近了？"
