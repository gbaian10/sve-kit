  - source_hash: sha256:3d76fd48976d04e663fa76053d2beb9cf27fb4694df4c3984ca215365b8fe293
    lang: zh-Hant
    text: "『卡爾瑪特』，吉露塔利亞。\n——靜寂的弒滅者‧吉露塔利亞"
