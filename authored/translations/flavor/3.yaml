    low_confidence: false
  - source_hash: sha256:3f0ab186f3987e36d76dcee93b08270799726e9fb86e7f9e9e8a0184fe648204
    lang: zh-Hant
    text: "痛？才沒有。氣到都忘了！\n不先敲破你的腦袋，本大爺的腦袋就冷靜不下來啦。"
