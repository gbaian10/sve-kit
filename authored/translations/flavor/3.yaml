    low_confidence: false
  - source_hash: sha256:39d9bfe67fc89ad6ddb5e117761aaabf38c9f092f25c31843bfa1772ebecca83
    lang: zh-Hant
    text: "吾身啊，化為黑龍吧。\n為玷汙學舍之人……賜予毀滅之暗！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:39fc934368d6abf391a6614a34b9913f3e9cf5ce061837bac536636c4ba02d55
    lang: zh-Hant
    text: "據說驅魔之物是用魔所厭惡的東西製成，\n但魔真正厭惡的，是那顆純淨到會相信驅魔之物的心。"
