    low_confidence: false
  - source_hash: sha256:3848e0d137f553e83feb35395c73416718fb5ca953ab70fed620260db6051c0a
    lang: zh-Hant
    text: 聖域的獨角獸，只向無垢之人獻上忠誠。
    origin: machine
    low_confidence: false
  - source_hash: sha256:384c8dadcf3ff34fd9245d92f5ee151ce64e8e42d874eaeab6f6e26c5bfc5c47
    lang: zh-Hant
    text: "姊姊的特殊力量。驅離死因、延長壽命的驅除死神。\n一生只能使用一次的它，姊姊——用在了瀕死的我身上。"
