format: 1
kind: flavor_translation_shard
entries:
  - source_hash: sha256:000a99619f29b62b7bc56cc2c821bacba4b3217d1be9b170000626b8e57528b9
    lang: zh-Hant
    text: "飲料好了，吃的好了！我一步都不會再動了喔！\n來，你也過來。一起打電動。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:00129a5b7493a07d45cc31ac5903872efc99c81574412335e8216cd9dcdcff6f
    lang: zh-Hant
    text: "華麗、美麗，展現淑女的舉止。\n——華麗淑女‧耶倫畢菈"
    origin: machine
    low_confidence: false
  - source_hash: sha256:001cecfe05a633264b3ef6f26b78bcacbac2e71de4f7ffcf4cfcbb1b12b2bfa9
    lang: zh-Hant
    text: "戰士思考的是，怎樣才能打中。\n魔術師思考的是，怎樣才能讓對方不想閃。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:002783f00645ae9b533d95761cdf96ffb573b31c08b497cba3c520aaa2c735ab
    lang: zh-Hant
    text: "為了讓世界變得豐沃，我會繼續旅行。\n修行雖然沒有盡頭，但我不畏懼未知的霧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:003b65c3359427f7f8b095e4c5131cd09157bc117c9ad2e922271575230f3873
    lang: zh-Hant
    text: "妖精之花的花瓣加上葉人的葉子……醃在甕裡的森林療癒。\n這個甕裡，裝滿了森林住民的溫柔。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:004773a7ad13ebc41c7c20bd8b6b160a6657f73ef655fc137b3d8b70bfa16d0d
    lang: zh-Hant
    text: "讓你見識見識打架專家的真本事！有哥兒們在可不能輸！\n不管是誰都打趴，證明本大爺才是最強的！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:007ac0ef595f8a204ea45a4b18cb275ecbc7e0835bd495c6c0b97f32b209185c
    lang: zh-Hant
    text: "凋零的夜光華的餘韻，由露娜爾之長葛芮妮掬起。\n她以那餘韻為觸媒，展開了自己的魔法陣。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:007eac4574ecdef5ee1b48437889a93d60afe6abcc1a97b93494122f99d6c588
    lang: zh-Hant
    text: "正義的英雄，微光飛駒登場！\n我的跑法能把任何強敵都砰地打倒！很厲害吧！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:0082a4b1a9822d44b85c16370b3accb46cabfd9531c4a9117ef0c06e811a19cc
    lang: zh-Hant
    text: "雖然早已不再無知到把犧牲稱作希望——\n即使身處悲嘆、沉溺於哀傷，他，依然是騎士。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:00b8fc2fc2cc44c693a83f1eeb357fc842f664464a746bfcd36826e6b2574c5f
    lang: zh-Hant
    text: "睡著了夢魔就會來……這種認知，又舊又落伍呢。\n我發現了。就算醒著，把人弄睡不就好了。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:00f1a3c7be149767e6fa25c8bee7ae7714e4b88eb94a63cbabc1cfc44d3fe38c
    lang: zh-Hant
    text: "巨人接觸了各式各樣的生命，喜歡上三千種生物。\n而喜歡的生物越多，就越討厭人類。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:010aea44a394c792b74048e333eca0e26d99c7316e5b4f540f4295e545f5b480
    lang: zh-Hant
    text: "刻於我身的力量，是振翅的羽翼、咬碎的巨顎。\n——來吧世界，畏懼那偉大的咆哮吧！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:0132b7b4a2d665c98e0266f1728912a5ca176b011f31831e65d0744a071dc739
    lang: zh-Hant
    text: "像孩子般天真的人偶我也能演。\n請別忘了紳士淑女的風範，好好地疼愛我。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:0172f2f12d026bef4db0203d856bd40250b7489f4dfbc1ef81ecdad57808d253
    lang: zh-Hant
    text: "侍奉主人，不僅是職責，也是我自己的意志。\n我會全力為您效勞。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:019448d9b56be42da6e4eef594464f952713b49ff5457afec4ccb24a2d98c00c
    lang: zh-Hant
    text: "就是這個！我一直在找的Lovely＆Sexy的布偶。\n我都這麼想要了，你不會說不買吧？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:021c9a1b043d11075380a22d6aecfea363b0d6f00f7f852eab30011314729545
    lang: zh-Hant
    text: "「我們是，密葬姊妹。職為死、役為死、求為死——」\n「——啊、亞、亞特、亞特蘭西亞姊妹一起殺吧姊姊」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:0236b7aa313ea0c9f0e750bd4e5b031d05b5cd05866ade71934ce48581e65a11
    lang: zh-Hant
    text: "人為了討伐龍而磨利刀刃。\n龍以與生俱來的利刃撕裂了人。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:0282ec49982e443388432275ae803cf2f0759718186f99822159bbb8371702af
    lang: zh-Hant
    text: "有終戰紀念日這種東西，已是很久以前的事了。\n自從死靈術蔓延以來，戰爭就沒有了終點。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:02972593adfdf58f9a329d8776cc726f804f694a274b69a280c062e056c5218f
    lang: zh-Hant
    text: "真是服了！你們這些眼睛長洞的！聽好，我的手只有兩隻！\n給我看～清楚，我的臉！這不是手是鬍鬚啦！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:0297b28502d6a0c639f040d4d9d5970036697d0a1a7aa9ebbce4aa2ed08a6931
    lang: zh-Hant
    text: "雖然統稱為龍，其種類卻五花八門。\n也有就算不觸碰逆鱗，也隨時狂暴的傢伙。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:02b940df51e986876cdea1c750270c4ffd29bc278cb9c5d6cad06a81ca16218d
    lang: zh-Hant
    text: "我等無曉，僅為一個意志而集結。\n擊墜虛偽的太陽，讓真實之月重獲榮光。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:033ab25c7a2292c0a7cb7bcf96442299aae4c15b06178cf9d1ddea6bf83bd3e2
    lang: zh-Hant
    text: "「汝，可是罪人？」\n那並非提問。不過是行刑的信號。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:034542b75a3ae1e9a88ed246460dbe9ed81c62fc213184130e01b504dd93ca68
    lang: zh-Hant
    text: "「人尋找著自己誕生的『虛幻意義』而活。\n明明生並沒有意義。因為『神並不存在』啊」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:0345db6afbfcd8202e5f104bf2ebc0f8c3b7898e0e5aad5e07ed4e23c7b40a83
    lang: zh-Hant
    text: "即使罪行受到制裁，受害者也未曾得救。\n是故——向神祈禱的人留了下來。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:037a5a2dbce91a0105326c4c193d25185cfe666e61b08a69d749ec0b7be426c7
    lang: zh-Hant
    text: "世界新蒙受的，是蒼藍石板。其右半。\n城中之人高舉約定，堆起擄來的祭品，行愛絕之事。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:038e54076b39f181fd47b899da3ef416ec641ab4994a75e9a0952d3f6c931f64
    lang: zh-Hant
    text: "別搞錯了，人類。我只是捨不得鐵製裝備的製作者。\n愛用的道具停售，可是超級難過的！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:03a0c269476135d061c4f8ab150323aaed85055ef4d6fbda4cccc0e0747a05c5
    lang: zh-Hant
    text: "喔……喔喔……勾……喔喔喔……？\n（這裡是地底的，墳墓……？總覺得，好擠呢……）"
    origin: machine
    low_confidence: false
  - source_hash: sha256:03dc453dd9db9eac8c253ed4372b43446acf220d380addf1b8a0d196b53165eb
    lang: zh-Hant
    text: "嚮往那如灑落寶石般的光景，乃人之常情。\n唯有成為神話之人，能實現憧憬而登天。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:03e3f6d88010a21c8947a8aabd46c95e0faa51f1ac2b9e5185d7f4ede078a5a9
    lang: zh-Hant
    text: "騎士君溫暖的力量，變得比以前強好多……。\n我的心意也一樣喔。騎士君的心意……是怎樣的呢？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:04189c29a965a67af21793be058e616e5e61eb2bea4d10cfaf68541da404fca4
    lang: zh-Hant
    text: "今天的我，是只屬於你的美里老師喔～。\n要對孩子們保密喔？因為他們會吃醋的♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:0439fcbf5165de991633d36186364aef4fdac56541919ee50ef50377749f88a6
    lang: zh-Hant
    text: "信仰、信賴。越是尊貴之物越是沉重的枷鎖。故不需要，不值得尊敬。\n擰斷翅膀打落地面——刻下約定吧，神紋尤拉提歐。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:0483344f3e0f9dd3020fa83a9d3e7c8b8e6943f44969d61e56700a314cce2435
    lang: zh-Hant
    text: "世界將延續下去。受永劫與永遠所折磨。\n——既然如此，就賜予世界試煉吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:048734cb0777fc2599268d7cd62ca0ab9d4fa1790d707a866a4975a5c017703b
    lang: zh-Hant
    text: "「大家一直吵著要我去放什麼暑假……。\n……算了，和你兩個人的時光，偶爾也不壞」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:048da3216babfea8ba8bb418a88c42947b1a3627e450fb2dcede43e7c3afb7bc
    lang: zh-Hant
    text: "張開雙手，轉圈圈跳個不停轉個不停♪\n把最～喜歡的大家，全部一起，緊緊抱住☆"
    origin: machine
    low_confidence: false
  - source_hash: sha256:0490339280d3e9703c0529413708ba690380d0b86e10adb19108d3899dda0af1
    lang: zh-Hant
    text: "不要以為書裡的東西，就是魔術的全部。\n神髓永遠是，從自己內在湧現的。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:04a092556d2c332bf106b549234e82081a613e0f4f72143a129a498504c7185a
    lang: zh-Hant
    text: "也難怪偵探森羅會以偵探的身分持續追尋謎團。\n對知曉一切的她而言——謎團想必比什麼都珍貴。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:04ab3c30f6c1cfec04f5e325298b439b05d0e7a08f90585c4a13113425126b61
    lang: zh-Hant
    text: "無論何時都要一起對戰多拉喔！\n——熾拳之龍‧多拉格尼爾"
    origin: machine
    low_confidence: false
  - source_hash: sha256:0512254bf0af79ea5889ff9476b7d41f1e195c9a6bac00b43487c9e100cfc619
    lang: zh-Hant
    text: "到了晚上，竟會變成如此撫慰人心的景色。\n花兒彷彿也有心……真可愛呢♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:053b219b7469936899c55a8752d59966503dee5b9a067378b74698232a06419b
    lang: zh-Hant
    text: "黃金時代，近在眼前。\n琉璃洞見真理，將我們從陳舊的俗識中解放。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:053c4f7819d9465727433c8e235967518e9a8b45f3603045c2d961f5cd1d0fff
    lang: zh-Hant
    text: "害怕缺損。害怕出錯。\n一個人什麼都做不到的膽小鬼，少說什麼伴侶了。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:054bb3abb367edcb55c15e16ce196ab00af93b6a175f5a8ad8e6afcea92c6e4c
    lang: zh-Hant
    text: "是化為非，陽化為陰，善化為惡，表化為裡——\n常世宣告終結，常夜的世界就此開始。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:0564ca243e2432a977ba2de330c583e88ce840993336b9ce712f1694d0c929e6
    lang: zh-Hant
    text: "看著這麼骯髒的空花，抖S先生那冰冷的視線……。\n呼嘻、呼嘻嘻！啊啊，又興奮起來了！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:05824da1150c4ca65f7f4cab53a8bd88c0c2323a34db9256304b269cc63bd047
    lang: zh-Hant
    text: "殺人，處刑。強盜，處刑。脅迫，處刑。詐欺，處刑。\n侮辱，處刑。反抗，處刑。慟哭，處刑。死亡，處刑。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:05b50c7a58be6ab75b20b27df943b67a4bcad18d0aeea7f167f3671821471a95
    lang: zh-Hant
    text: "「相信鳥兒會運送生命的，是年幼的孩子。\n挑選應當運送的生命，則是我的職責」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:05caed63c049effaef1d12776ad8cd277aba305b402af33971170e681f40c87d
    lang: zh-Hant
    text: "就算是好喝的靈藥，也不能喝太多喔？\n雖然比什麼藥都有效，但喝太多反而會……所以啦。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:060c20b8a7302886860c6aa90f1bb5f34ec9895465f8841f1840bb9fcd8db78d
    lang: zh-Hant
    text: 就讓我再使用你一次吧。
    origin: machine
    low_confidence: false
  - source_hash: sha256:061dc852b2755628faa5247913f7d3acb8d944d0d3794fbbe4a28f0255fd840a
    lang: zh-Hant
    text: "莉貝爾緹是沒用的孩子。鼻子不行，耳朵也不行。\n可是，才藝……只有才藝做得到！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:06427202a7bf9e0993a638f6a382d2fdbc41c72b757fb96d7b2fa8bcea8646fd
    lang: zh-Hant
    text: "倘若意識與人格都溶解消失在NET之海。\n那麼潛入NET，便與沉浸於思索同義。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:066f998b0e2f121b096dc069c855c9cf25b78697ea146bd3304f803fe6df12b9
    lang: zh-Hant
    text: "——其為防備，將恐懼踩在腳下之人。\n雖年幼卻勇敢，於月光下咆哮。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:068acc7290b2f9a3d299e4bb30edb8174bf52b8878e03ea5ebc8a51432eb2a70
    lang: zh-Hant
    text: "只知綻放便無華可言。不虛幻便稱不上是花。\n讓你美麗地飛舞吧……隨風流逝，是謂風流。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:068e8ee4ba08ac781e8b0b621616316ccd9168f90f6f4fc5dd705b7a7d2f1903
    lang: zh-Hant
    text: "凌駕一切群聚的意志。立於匯聚而成的頂點。\n——來吧，繼續世界的試煉。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:06d202ec79a16ac333047d604d0d5e7b8b4f09f6f382eecd99d5701c3b351455
    lang: zh-Hant
    text: "眼前展開的是獵物所見的景色。嚐嚐被啃食血肉的痛苦吧。\n現處以禁牙之刑——對愚鈍之焰降下誅罰。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:06db7c8f1b65e526bf22c8f3b9af259c8d357fe5673397c4d1a6efd8d26187a6
    lang: zh-Hant
    text: "看著津津有味吃著點心的少女，魔女下定了決心。\n「要開點心店嗎？那真是太棒了！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:072d59c5e9781272c6f351c8edacb2b03f25c771c5571ca6cff10bfbf9be0719
    lang: zh-Hant
    text: "借助樹木與風之力，那正是森林流派的槍術。\n已在這片土地紮根的他，再也沒有人稱他為異邦的野獸。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:07352909c0c113bc79d716e840240473189f65ff8ddf81ab026c0031887e923c
    lang: zh-Hant
    text: 比起堆砌磚塊的城牆，累積功德的教會更勝一籌。
    origin: machine
    low_confidence: false
  - source_hash: sha256:0789948b098ec4e7ebe9411401a5145c063f5510951aaca7b0d36af8a640adf5
    lang: zh-Hant
    text: "如鳥般歌唱，如花般起舞，如女神般微笑。\n妝點舞台的才華令俗世淡去，將人們的心引向故事深處。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:08313d22084f86ef23f2728e816590606594831e1105dd805787aebe14d4d17d
    lang: zh-Hant
    text: "我的力量是該被忌諱的東西。即使如此仍不得不依賴它，\n是因為我還不成熟……所以我一定會變強……！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:08382f38ef657e742c70a25c6626550efdfe9bfc959a115654bdd5b6effdead9
    lang: zh-Hant
    text: "妖精們最喜歡跳舞和唱歌。\n活動身體很開心，而且大意的人類的表情非常有趣。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:0838bb25d96b0b9aef4cd0eead06e73986aeb648f4855c5ad3c173229f491e37
    lang: zh-Hant
    text: "在忌諱它的人看來，那無非是異樣。\n在祝福它的人看來，那無非是威容。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:08414deed3752792a7d41f0d4c831e6910e687561bb654a87610a0099ae9ad50
    lang: zh-Hant
