format: 1
kind: flavor_translation_shard
entries:
  - source_hash: sha256:400e05f13801393c60c35c2e93db52651eb9db0eaa064d50d5e71a539400435e
    lang: zh-Hant
    text: "嗯勾……。已、已經不行了……動不了……。\n課程，有點練過頭了的勾……。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:403fb19df7510727d3078081fb1ae57f1cd21cdd91bc2ec41941537b1a3faa72
    lang: zh-Hant
    text: "「牙雖已老，至少還能當後繼者的榜樣。\n準備好了嗎？來，擺好架勢，小伙子！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:4045f19527dd20475a03d4a0c8199533c2a1a4720a289f6cf68fd462d60ab70c
    lang: zh-Hant
    text: "一根劇痛。兩根狂痛，三、四、五、六根是超越死亡的痛。\n名為「六連的刻印」。絕叫、悲鳴、阿鼻叫喚的演奏者。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:4053cd3a56bffded481041a7f4356fd8e07c067f0d4b212cc14562dfa7d4f751
    lang: zh-Hant
    text: "下一個是那頭獸、這頭獸、哪頭獸。\n每奪取、每穿上，我們就增強。所以盯上，更多毛皮。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:407233b4a021665c9acbc325785767ed16c9567e91aedcbaf5ccc6672608a10c
    lang: zh-Hant
    text: "禊準備惡作劇……哥哥就上鉤……。\n嗯，是最棒的搭檔呢！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:4091e10e4a2c863981937d84928fcd1d91308e3fb792d92c600794f52a20e232
    lang: zh-Hant
    text: "有任何事，請呼喚我。\n我會全心全靈回應主人的要求。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:4093cc57358cf9a948155666ca6c7d7900fe10485537d1eb449d27ae2caffa5c
    lang: zh-Hant
    text: "遠征太多。增加預算。裝備的味道太臭……\n……被部下的抱怨填滿的報告書，是部下生還的證明。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:40a22e08fd520a0fcc385112911b10123f696453a1f39bcd5b1eb4d8976873c9
    lang: zh-Hant
    text: "在暴風般的猛威面前，一切都無能為力。\n轉眼間城鎮毀滅，化為不發一語的瓦礫堆。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:40b541f7c257a5953ef617d4e4f1a1058150ec346b73ca1448d571e0d5b0eb32
    lang: zh-Hant
    text: 「看起來還像活著一樣有精神呢！我開動了♪」
    origin: machine
    low_confidence: false
  - source_hash: sha256:40dd00f157beecf776f53bba7b36830160a4c1993cebe7d340952be31dcef399
    lang: zh-Hant
    text: "那頭熊因三個理由被森林的動物們奉為神明。\n因其對森林的愛。因其強大的力量。因其對人類毫不留情的殘虐。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:40fe1fb2c827b9f0d3e43566432343916b386e0abde71ad14983df105aa6d3ba
    lang: zh-Hant
    text: "窸窸窣窣，變成鬼鬼祟祟，再變成嘈嘈雜雜。\n而最後聽到的，是嘻嘻的天真笑聲。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:414bf86c0471b97e70ceac49baeef4c284bd72bd176ed725c97cf77aff7628bc
    lang: zh-Hant
    text: "她察覺了。只要破壞，就能在腦中見到偶像——。\n「今天也能見到里榭娜」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:4175159bb8db8cffdaf2314d9387a9beb81f541a71475fa3b5991e01276801e5
    lang: zh-Hant
    text: "……這個？是工作啦。移動時間也得有效率地用才行。\n在這種地方會不知不覺拉開差距喔。不，真的。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:419d9733336e723898736d80ef0440a2c8cbb52c9803cc2259ab0b1d425a60c6
    lang: zh-Hant
    text: "欲望的枷鎖脫落之人，甚至踏入了魔之領域。\n「魔裝鎧甲，很棒吧？」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:41a8f819dbb2e6890316f9e8847ddd42d9318fa9bb8fa847136815829e6773bd
    lang: zh-Hant
    text: "龍鱗折箭、折刃，碎裂的鋼堆積如山。\n越過那些鋼之屍骸，稀世的龍劍於此誕生。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:41d7406e086a34889579d02b6424d97d87ff448b641882cc97e53d36b904ea00
    lang: zh-Hant
    text: "我的魔法，還滿厲害的吧？\n哼哼～♪再多誇我一點多誇我一點♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:420549859a608e6f9200c72e641284daec5eb634623dd18e61611a63a7f87219
    lang: zh-Hant
    text: "矛刺不穿的硬度是三流，能彈開魔法的強度是二流。\n真正的鎧甲既硬且強，而且比什麼都美。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:4213cb4d6516fd2085d063965c3adb745e8f6a9d9451bea10aa57e77c328fdf2
    lang: zh-Hant
    text: "貓知道了。蜷成一團，不只能留住熱，也不會放過勝機。\n而且貓也一樣，能夠裝乖賣萌。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:424b4d8ea351cafa8dcc2aa1e9ee570d6e9f471329548beef6fd1455367199c0
    lang: zh-Hant
    text: "外表雖然可愛，但當被捕食者已是前世的事了。\n「蹦蹦跳跳的，很可愛吧！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:424e1bcbd943ae62c3af5f09522e1a820487b63ad6223b47ffe9e3809c782fb5
    lang: zh-Hant
    text: "◆伊波與禽兜的混合粉　症狀：口渴、痙攣、全身劇痛\n【合格】一名　　【備註】祝賀新首領的誕生"
    origin: machine
    low_confidence: true
  - source_hash: sha256:425604ca57d664542b6294a1f0f82266160e8a43c6828495e95bdc41e231cdd1
    lang: zh-Hant
    text: "——其為《隱者》，所示為《深慮》。\n慎重、冷靜、沉著，給予煩惱之人建言。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:4299741c88a7f56e75550aad3a5d910ba24afd8848c73b59d5fd4559aac79664
    lang: zh-Hant
    text: "還有喔，在學校發生的趣事！\n我都有好好記在筆記裡！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:429c015ccc9562be587beccab1ec373c34cafea497c236a09521f4bdf89967cb
    lang: zh-Hant
    text: "迸發的是決意，低吼的是刀刃，祈願的是王的理想鄉。\n「史實必將銘記我等。出發吧，與王同行」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:42b1a7ad33654459733ed4b62441f0e76d0896f2b95ab18c1a22eaa9d85877cd
    lang: zh-Hant
    text: "這世間即是慘劇。\n殺戮的舞蹈上演，理智盡數被奪。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:42bfab6199beabc95b2d1bcd93ab987f4c4511ccedb03ecf15bddbdc793dd903
    lang: zh-Hant
    text: "這支舞是只為主人獻上的。\n雖然惶恐，還請您在一旁守望。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:42c834275ffab8c5d6c6564af8485ab8a05af5f7049d958e67225df2a0d40dd3
    lang: zh-Hant
    text: "這種好天氣的日子就是要悠哉度過啦——。\n騎士先生也要休息一下嗎？點心的話這裡有喔。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:42d210b9a0c892f95e856de6b512dfb24a03d26e7f22cc4563dad1ebca46d0f3
    lang: zh-Hant
    text: "……啊啊，真是的。吵死了，我知道啦。\n妳想把這個送給來找藥的那孩子對吧，塔莉耶。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:42d3f41b778267167c2dc7eade359c266679b67ad38e43bd987da01a5f64cbdb
    lang: zh-Hant
    text: "你說魔族的血統像月輪一樣高貴？令人作嘔。\n既然是強者登頂，那用實力決定才合理吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:42f2849c4b079f401d9726dfb81ace7baebf623478ed7a80a8ce74c7cbc2d132
    lang: zh-Hant
    text: "為何不能尊重。不知敬畏。不懂得謹慎。\n現處以香風之刑——對腐臭之花降下誅罰。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:43133b34a5d3b30e83fa857cd0f38e3ca3d8890afd0d56d07e78f8c45e6610ee
    lang: zh-Hant
    text: "偵探業的必需品是推理力和靈感。還有，一點點心軟。\n「又做白工了嗎。我還真是個濫好人啊」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:4313c4626834a38bcfac90093708c3f0ac0ddaf536a74667acf79b602ac8a44b
    lang: zh-Hant
    text: "你說這首歌把單戀女孩的心情表現得很好？\n……呵呵呵，你真遲鈍♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:436a07dbdd863abc49e8cecf730a0447f103285d045f3c8623d1bceab8dc5c4e
    lang: zh-Hant
    text: "真是的……沒有我在，就完全不行呢。\n沒辦法，我就陪著你吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:436ad0bf07feccc0f985d3421af21b405bb894f0016e98dabc179e730d7a1ad1
    lang: zh-Hant
    text: "在草地上疾馳的“超級跑車”——\n得讓大家看看不負這個外號的跑法才行呢！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:4395c47394f246d087cec7359b9559aeca2cc9c77a0824c5d660986db7396380
    lang: zh-Hant
    text: "熊熊燃燒的，紅色火焰。你知道比那更熱的顏色嗎？\n就是這個，蒼色火焰。然後把兩股力量合在一起的話……！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:439aa24d2d8d7ff511fd1f3b1461c43538659baf1d531c22f335a0715fca4fd5
    lang: zh-Hant
    text: "要是大家也因為娜塔莉亞的舞變Happy就好了呢！\n也可以一起跳喔！來，Let's Dance♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:43a460ebec11c77cc76fd808ad47569c96d90b05494230ca537d5d96adba8ccb
    lang: zh-Hant
    text: "戴著面具的，是以己之劍戰鬥的騎士，亦是果斷的王。\n其本性，依舊藏在面具之下。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:43adcf8a473d0720d3ae4408468505e732ee92c30ef2009398c8005bb7391d2e
    lang: zh-Hant
    text: "和我一起活下去，比想像中更辛苦吧？\n但還不只這樣喔。小子——可別死了☆"
    origin: machine
    low_confidence: false
  - source_hash: sha256:43b095877aec6d9d34a83e9820c987d6ed187863e73fae26d817545ab53f6160
    lang: zh-Hant
    text: "弟弟，最喜歡你了喔♪\n巧克力還有很多，每給你一個就說一次喔♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:43cd7eecb92550418bc69dd78103c31ba3bcf4ddb933569d038713026b95954f
    lang: zh-Hant
    text: "這傢伙給了選擇自盡的弓兵，一個重來的機會。\n我會用弓報恩……你們就用命回歸森林吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:43e176649a7faed54431ccc73dbfc4ef2ea99b98442688355fb96ad56e0127d4
    lang: zh-Hant
    text: "遇難生活第不知道幾天，已經沒辦法挑三揀四了！\n不是My Love Carrot也沒關係，讓——我——吃——！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:4439251da5772d9db36a57f3864c01577c0a7bae7d998528cb7a92c2f3aec1ba
    lang: zh-Hant
    text: "「同胞們快看喵！那傢伙是知道自己武器的貓喵！」\n——俏貓上將"
    origin: machine
    low_confidence: false
  - source_hash: sha256:4445f0035b92f70f2dbda09280ddf5e9dac54b4d839c94e36c48303e6edcbc9a
    lang: zh-Hant
    text: "「啾！」「呃，肚子，餓了？」\n「吼嚕嗚！」「哇！幹嘛低吼啦！很可怕耶」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:44663cc5f870920cf1680faa3f2091cf75aba5bcbd0ac0a4af3324463b5bf013
    lang: zh-Hant
    text: "看那魔瞳的光輝！\n可有聽見完成覺醒的靈魂之昂揚！吾之盟友啊！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:447bc4f33b36f2e6bdf2fe89c550930112b46e0c594c72b203645bd653c0dd3d
    lang: zh-Hant
    text: "迷途之人啊，來幫我一把。我想甩掉隨從。\n咦？明明沒有翅膀卻是個野丫頭？吵、吵死了！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:44bf6316b3b6112ef8f1beab9c5dbce8dd93e4fde838b3e27c9e0434c0372165
    lang: zh-Hant
    text: "用歌改變作物味道的術式？好像很有趣！啦——啦啦——♪\n——『威札爾農業學校的留學體驗』"
    origin: machine
    low_confidence: false
  - source_hash: sha256:4507e8c278891caf8b2fbe20780172c40275a75a1c005a699f42a995bfbfb4c1
    lang: zh-Hant
    text: "請您看看，這孩子多麼惹人憐愛♪\n我已經不想放開這孩子了♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:450dba00232c5045178ba6a37c7995a2d802f0d715317d7e1b0936c453f50993
    lang: zh-Hant
    text: "我只救回了她的命。「是我不好」\n後遺症我也會治好的。「已經夠了瑟霏……」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:4511a29b97acafb30de5a49b6f89b30fc2edc0e4f7d3a4f1509c8194d1f67d92
    lang: zh-Hant
    text: "可以不要讓我說那麼多次嗎……這只是遊戲。\n——白銀御門"
    origin: machine
    low_confidence: false
  - source_hash: sha256:452e9c5f6c4a167311526dd7603efd10457a467742a84121470c375177e0684f
    lang: zh-Hant
    text: "美味的蛋糕和咖啡……也請用手工巧克力。\n為了讓你開心，這是味道和外觀都很講究的一品喔♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:45663eec4f2514a80d2944453ac5ebb0559cde6b2ba4a9b5b6b1a2946b70c47b
    lang: zh-Hant
    text: "「來吧各位！此刻，就在此獻上優雅的勝利！」\n清澈的聲音化為凱歌，連向勝利，完成凱旋。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:456852b4d51a002786206963148d7c52a4461673f74bd08f71ac507ccd033e73
    lang: zh-Hant
    text: "不管什麼事、任何事情，都要跟姊姊說喔！\n再多多依賴我、跟我撒嬌～不用客氣喔☆"
    origin: machine
    low_confidence: false
  - source_hash: sha256:45700fa148c9687896a3c09af5b0f2cb58f30c2b9e79c6168bcfc5c46b2f9ab3
    lang: zh-Hant
    text: "欲速則不達是平時的教誨，有事的時候就趕快敲！\n剛出爐燙到會燙傷！給我使勁地揮吧！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:4574a4762e1bc32f9f7afb397af33973f76dd82846f5edf1deb503e46ec06f05
    lang: zh-Hant
    text: "對峙吧。若不覺醒，便與心一同長眠。\n——此刻，賜世界以試煉。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:45787ce06e9648689cf8d254b1345f0494174c45fbfe89ff27078e3df8fc84f8
    lang: zh-Hant
    text: 有理性。只是敗給了信仰。
    origin: machine
    low_confidence: false
  - source_hash: sha256:4593ea025116f630448567ef4e67a3cdbdd4f5dca8d6e9c04fb74771e66accf3
    lang: zh-Hant
    text: "每一樣看起來都好好吃♪謝謝你帶我來。\n我一直想吃吃看越南料理。會是什麼味道呢♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:45c86ae120fa6b6ce36ef731d04a20a232e99f426b77030aaf8aeff817184178
    lang: zh-Hant
    text: "誤判本質的人，會先在戰場上凋零。\n委身於灼熱的戰火吧。悲哀、情愛，在此並不需要。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:45dd9373c059f31b27a4e74a0bff6cd441c924a077588c94bebd6d4cadf92b89
    lang: zh-Hant
    text: "如果我們受傷，會讓神明傷心的。\n……也就是說，只要多多鍛鍊、變得健康就好了！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:45ef242e770328d385c669dac14330a215c033e7146ac55297f61a58814a2851
    lang: zh-Hant
    text: "米米和小獅鷲，都最～喜歡大哥哥了♪\n能在一起好開心喔～♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:4698762683d9bd2260260455729f7b7c831d14bf55b95d49a46a194b3b8b54eb
    lang: zh-Hant
    text: "希望這樣的日子能一直一直持續下去！\n你、莉莉，還有大家都相親相愛的日子，一～直下去！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:46c74469c03ba079d477238471bd3fe120b738883ae6c0a055a83862f769979c
    lang: zh-Hant
    text: "從此往後，斷絕一切希望。\n——光燦聖騎士‧維爾伯特"
    origin: machine
    low_confidence: false
  - source_hash: sha256:46db8015206d67e52e06714ca3bb081f594cd590d29632352f7dc72bd1194eff
    lang: zh-Hant
    text: "槍是我的王子。我造出來的、只屬於我的王子。\n所以我也要盛裝打扮。穿上配得上王子的、成對的黑。"
    origin: machine
    low_confidence: false
