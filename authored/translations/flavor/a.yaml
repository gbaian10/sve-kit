  - source_hash: sha256:aba422ae0689bb04f592738f0848795580740e309a5d31ebf534ccebc6f9c2ce
    lang: zh-Hant
    text: "我啊很可愛喔～。因為，是貓嘛！\n所以打扮什麼的也不需要，最強了吧～？"
