    text: "行善的理由啊。很簡單。大家都會認定我是個好人吧？\n然後先捧高再摔下去。那落差能催生出很棒的慘叫。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:aa8742de68da0127ac4b019f9260e774e97f0bf83005a05e6719f9d068a366f5
    lang: zh-Hant
    text: "能和你締約的惡魔很少，\n但能把你撕碎的惡魔可多得是。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:aab49dc65667a95eee66c44c1d589ccf3f3707e1ebc39f81303e2ae3a75ee16a
    lang: zh-Hant
    text: "「不可思議的世界，美好的世界！\n欸，再多教我一些關於夏天的事吧！」"
