    low_confidence: false
  - source_hash: sha256:a8bfecc1fc8773aa0af8a758597927eaebcf5c3230206f800145b4ccd81efb51
    lang: zh-Hant
    text: "奪走我一族棲身之所的、卑鄙下賤的人類啊！\n嚐嚐自龍脈沸騰而出的力量吧！"
