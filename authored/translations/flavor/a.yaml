    low_confidence: false
  - source_hash: sha256:a93971477c89a3f01933a3304f7f64d1dff93f3340bbadc63bcd4be19d4ce58f
    lang: zh-Hant
    text: "何時、何地、什麼、如何被拯救。這些都無法決定。\n所以至少被誰拯救，可以自己決定吧。"
