    text: "以行過儀禮的水淨身，將皇銀糖含在口中融化。\n之後直到唾液乾涸，只是一心一意地祈禱。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:afcaa30c2f880643d5a44ad209ff4177e3e8897c86bfc45e23d297ecf6baecf2
