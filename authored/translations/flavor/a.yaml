    low_confidence: false
  - source_hash: sha256:a952c4d46dde075af4a1e2af1732c378bbc8818ee967ba0db313b2ce80a5cf96
    lang: zh-Hant
    text: "就算煩惱、就算迷惘，但只要最喜歡，那一定就夠了！\n——風祭蓮"
