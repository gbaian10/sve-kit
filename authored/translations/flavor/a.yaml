    low_confidence: false
  - source_hash: sha256:ab15a4b3f8df094c4ba4f927ad81b0332a9aec92a72a9474123012985a1aec78
    lang: zh-Hant
    text: "蜘蛛讓孩子們護住自己，以沉默的灰撲滅了火焰。\n『真厲害呢娜可亞。請讓我稱你為混融的繼承者』"
