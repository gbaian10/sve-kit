  - source_hash: sha256:acf743114916c6deefdafa5ad69628b43cc1cfd9b070ecff462f3720cbd740d3
    lang: zh-Hant
    text: "延續、相連，即是世界的樣貌。讓所有世界延續下去。\n——『不殺的守護者』，使徒之言"
