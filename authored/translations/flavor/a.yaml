format: 1
kind: flavor_translation_shard
entries:
  - source_hash: sha256:a00dfa36e70e9e3d13d75fd15b8106eb6955e9e49a88873228b03ebaf534d008
    lang: zh-Hant
    text: "仿照龍所造出的龍。EL-1098是其成功作。\n——File.4096『Flight』，龍的創造"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a04369ab1ad991ec7de0690f2ff4f29fa99c09dafabf15c5367f17b7f2da9015
    lang: zh-Hant
    text: "二分開、五分開、亂時狂開。\n盛開方為森林之花。那麼你，就是徒花。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a043f353df32631050aad37461752518271625250b496180424372d7dbe90806
    lang: zh-Hant
    text: "我一直在想，姿勢和表情要怎樣比較好。\n但是，現在只是……想把菜菜的心情直率地傳達出去。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a06217c2dd9d39efa430e12893860b4677e57503d11f6315d8739c8083b7f83b
    lang: zh-Hant
    text: "魔、魔物什麼的才不可怕！\n不、不過，如果你會怕的話，我可以陪你一起冒險喔。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a087bff9dcbaa2c8c3ad92c58ecb60ed0862a4c8bf0777bb61b661cdf7b7fd84
    lang: zh-Hant
    text: 沒有理性。只是獻給了信仰。
    origin: machine
    low_confidence: false
  - source_hash: sha256:a093b468d34fda85f8e96eebf51d9f0ec18b2f1f51ecd2a026c492437bd7719a
    lang: zh-Hant
    text: "那張疲憊的臉，是在找森林的午睡地點對吧！\n嗯嗯。那我們就一起休息吧！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a0c952351176def02fd3f0ee37aea58777df0db15de3f599f6cee4b81458ccdc
    lang: zh-Hant
    text: "所有目擊者異口同聲說的一件事。\n「要小心妖精的惡作劇」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a18fb2a8ef4c77ba6c7f544b758b272077fba8803f5f643c468b0df628e93908
    lang: zh-Hant
    text: "牛刀割雞，他對這戰場而言是過於強大的存在。\n蝸牛角上，這場爭鬥很快就會結束。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a1e0a3506688c27d73136971a9122a5a7fcb52083d783b8016be316071c7698c
    lang: zh-Hant
    text: "若說因追求而發生的是進化，那麼必然發生的就是進步。\n而如此界定它的不是人，是後世。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a1eb41cb8e00813597d481f9dff7a177e4c95ee90cb5136329d1b53eb743fd3b
    lang: zh-Hant
    text: "愛惡作劇的妖精，花點時間也是能馴服的喔？\n昨天的惡作劇，也只不過是把住處炸得粉碎的程度而已。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a20824e174ef06f9eaca370d0b9829cd9277e551bdb6cacc7364bef04b56d6c2
    lang: zh-Hant
    text: "今天的運勢不太好……。\n我會陪在您身邊一整天，保護您遠離災厄。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a20bd099586a37231fa45b50334cc8bfc549dbf665e047fef0c1531f77cfba2d
    lang: zh-Hant
    text: "仿照龍所造的人偶，或者說仿造品。\n唯有連著四肢的絲線，成為驅動那身軀的意志。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a20d17c79764de3a644915453d1c1867c5cdcafbd1e92cce7ca3fa6ce7bb8889
    lang: zh-Hant
    text: "被帝國支配的村民們看見了。那果敢抵抗的四片羽翼。\n那羽翼向眾人展現一線希望，斬斷了心中的鳥籠。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a2130e8100c42cd2a9f4a874f993aaa748e4e5473f84f9fda3c8f242d42d2d7b
    lang: zh-Hant
    text: "……欸，如果你知道的話，可以告訴我嗎？\n你到底……是什麼味道？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a232079015283dd0a63f2e9d40138c378a5472478977981eff880a9d2cb5d0e4
    lang: zh-Hant
    text: "磨練出的這身劍技……恐怕在戰場上也行得通吧。\n但是，要對人揮劍實在提不起勁。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a248fcb7e5d866338b9702e1bacbc03406efd92e48ca7ae8bb14abff460af893
    lang: zh-Hant
    text: "災禍粉碎之時，石板也隨之碎裂四散。\n守護者們懷抱戒律，在森林深處屏息潛伏。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a25c81cfe3907b13ff395ac02f2f51b6e79ed195ceb200128312c0e3a3c78a34
    lang: zh-Hant
    text: "如果是偶像的工作，連憧憬的店都能開。\n來大家一起抬起單腳，甜甜圈OK，High Ju——mp♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a25e1cd51635740c72a5b0714be63d9a1e4dd0dc3404dbeb2c97e40208983143
    lang: zh-Hant
    text: "既然被秋乃小姐稱作勁敵，\n就不能落於人後！讓妳看看我的全力！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a2603de33c87b332c68bcb839c51b55ac226dc65812b4b0cefc004a294f6b650
    lang: zh-Hant
    text: 神無所不在。正因如此，更當是唯一。
    origin: machine
    low_confidence: false
  - source_hash: sha256:a283946441c839f5e396d56950edb70f80b63ee475b7fc81c839ae80d09e559a
    lang: zh-Hant
    text: "『獨當一面的商人也是獨當一面的武人！』\n此刻正是遵守威斯塔利亞家教誨的時候！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a2c47dfc1da84e54ccdb93f1d406d256d37df62be68cf39310b1dbd9ccf8ffab
    lang: zh-Hant
    text: "只是不斷斬殺眼前之敵，戰士終將化為惡逆。\n相信能開拓未來，戰士終將成為英雄。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a2f9d5497e9796f6b1bf5ec879150e5672bf2341a8c27695c0301832c2999da8
    lang: zh-Hant
    text: "我想用這火焰的力量，溫暖地包覆大家！\n讓你們看看，火焰可不是只有熾熱和猛烈而已喔——！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a321f8ab1884deb752c6ef95ba9907ad9e112523ed1ac250d4d4aafc8c761584
    lang: zh-Hant
    text: "加速的節奏是急板！你這種貨色就丟在後面！\n——邪星遼雅"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a343f4c0da0fb9390e2189808f89e8cf1c2f230c301a2aefc6b5a4da32a23a9f
    lang: zh-Hant
    text: "我明白了。用涅爾娃大人的力量，踐踏世界。\n——把汙穢的東西弄乾淨，很舒服的喔？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a353e09aa2bfcdb6870a895602b8584f9c5dd8b93770f706ae625d0787e0042c
    lang: zh-Hant
    text: "「用我的知識，活在剎那吧」\n——永劫欲求者‧關德溫"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a364c0616d8cf423f8a6a3eb18d8099ad09e192c6e2c8c9da2c69baddf1e2a38
    lang: zh-Hant
    text: "啊啊，我真是太美了♪要表現我的美——\n不，用言語根本無法表現啊！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a395e6089fc853414650bb5710028348880f11ba806f959304bc61a97f4415a5
    lang: zh-Hant
    text: "沒什麼。只是稍微戳一下而……已！！！\n——龍人的莽漢"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a3a53629ba59e521b2a49a71418935a1abb186ed63f3b91b7a0ddf104c8eae1f
    lang: zh-Hant
    text: "「是神、是惡魔，還是人類。不管是什麼都無所謂。\n射穿心臟，僅此而已」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a3e24083e583f1f86da937ae72e3a44d5fd7811c91d56a241b7cbd0789b7bb93
    lang: zh-Hant
    text: "從香味就知道我在嗎？呵呵，答對了！\n我買了好多花來♪要做成漂亮的花束喔！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a3ef270e53d39eb5010e5d988ed85d35729c490fb956f089803a2383b113239c
    lang: zh-Hant
    text: "破綻，隨著時間流逝而出現。聖杯不知不覺成了毒杯。\n化為紫龍的、可憐的牠。已無昔日榮華的面影。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a42292b0bcc2763925f6925ebb58cdbf21d50ba9fa36814d7aa07f484b9c0671
    lang: zh-Hant
    text: "孵化、回歸、孵化、回歸。\n在大地之母上生命循環、循環，而後恩惠循環而來。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a46960b021cc63db3a5ed9fb07ea907577939272f10b1850f6d448e0c029d21f
    lang: zh-Hant
    text: "我曾以為愛根本不存在。\n但是，是你教會了我——愛是存在的。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a48c8e02fd592e653f80fb4902e191349045db70ec9730eb446ea201ed4a2690
    lang: zh-Hant
    text: "『Miracle 真步琳，咕嚕鈴啪☆』\n王子殿下的道路，就由人家來照亮～。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a4d01a400ffc6b15fe7e747981004eba117101a79e2993c93dfc4db58858ab4e
    lang: zh-Hant
    text: 可愛？啊哈！也許吧。如果這孩子只是個『人偶』的話！
    origin: machine
    low_confidence: false
  - source_hash: sha256:a4e2d8910191a6c6d868d9d6c65312cb7f5e3e5883209b5b2d66292206186d53
    lang: zh-Hant
    text: "您喜歡什麼樣的女性呢？開朗的我？酷酷的我？\n……當然，不會是我以外的人吧？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a517ff03a2983b19f6741b97089b84c2a976dae308b5432d2b0ab41345dbb7db
    lang: zh-Hant
    text: "妖精們居住的森林裡有一處聖域。\n據說造訪那裡的人會受到森林的祝福。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a519ddf1d2d5d7d61ce95fe7d6a8e022472a7f363cbcff11341705e4b6bf18af
    lang: zh-Hant
    text: "您的胸中有著呢，某種悶悶的、無聊的種子！\n那麼那麼就由我用這個哏，開出快樂的花吧！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a52b572e9a006b1897c8246e5efbe2baf11d93e05c0272771d0ac54fe8883bfb
    lang: zh-Hant
    text: 兔女郎進到箱子裡了！究竟會怎麼樣！？
    origin: machine
    low_confidence: false
  - source_hash: sha256:a540b6e9b1b6e6969ddfe10a081a7ca30256f83a2f82e44f847a79e23180209f
    lang: zh-Hant
    text: "腦中的偶像，可愛、冷酷、溫柔、甜美、毒舌——\n每次幽會就不斷膨脹的它，已是背離黑與白的彩虹。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a5418249084d71f61ae77aaad7313222c4a560282b361b36a2aec5a45265a103
    lang: zh-Hant
    text: "多管閒事，喔。說什麼裝備太多，看起來很難跳。\n沒有跳的理由，對吧？用兔子的腳力撞上去，很痛喔。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a54205efc96c9f558b1481c71e20a9603ea9ebe75bc55a10c5dff6e433262904
    lang: zh-Hant
    text: "薔薇的刺正是我的牙。我會把您全身啜飲殆盡。\n啊啊，沒有血可以分給花喔。要綻放的是我，對吧？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a5493b9653bf5c983148bee49d32cc41a4aa410c92f0822953a118f93fe15801
    lang: zh-Hant
    text: "喔——呵呵！我是川上公主。氣質高貴的公主中的公主！\n在比賽中也會楚楚可憐地把各位轟飛的！！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a575327aa161f7bb3f54a5e7d2ee5d3c19c38a837a77ca8187c48fe8cf802b28
    lang: zh-Hant
    text: "別踩尾巴。閉上嘴。屏住呼吸。\n那傢伙起床氣很差，但醒來之後更惡劣。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a59b4445d25d25efe6b2c78adffbf17787a9c880a8678bef50cc248d9bd7e6ce
    lang: zh-Hant
    text: "本就是毫無價值之輩，被火焰吞噬也沒有差別。\n「化為灰燼吧！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a5bce4e720911833f21634567d344b8fb2a41478f1eeaec9b85cdd88a0ba5f4d
    lang: zh-Hant
    text: "對人而言的道理，甚至對人而言的道理之外，\n一切都在那寬廣溫暖的手掌之上。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a6404ef40564159395fb80342beff83dfbef11bd645cf66c43c4d829830f11de
    lang: zh-Hant
    text: "自由的意志就是羅盤，忘卻後退只管前進。\n捨棄正統的活法，不要安泰只是邁步。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a64c207bd626964136d67094a7dadb0b6ffc04682bd91e10162a80b218dda1bb
    lang: zh-Hant
    text: "「每一個都有意義。被造的意義、活著的意義。\n這麼說來這東西也有意義。應該不只是個擺飾」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a65aa49b15ce79a26992c6878286fddfdb8b0f7d42699c963ef956c8a23d7c57
    lang: zh-Hant
    text: "不知從何處的荒野漂流而來，被溫柔的果實拯救的獸人。\n他學會了森林的技藝與心，成為這片土地的一員。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a67cd056902c1ddf199e1a45c9e1dc43c25338f8bb3d1133fee2ed40eda5f1d7
    lang: zh-Hant
    text: "今晚要讓你為娜塔莉亞著迷喔……。\n欸嘿嘿，娜塔莉亞的魅力，要向客人們亮相啦！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a6a60375c484ae897d9bb5ae79e886681aaccae6d7f254f0e1114848c3fc4285
    lang: zh-Hant
    text: "有意見的傢伙就放馬過來！\n不管對手是誰，這場架本大爺都接了！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a6c9eda1feb6fadfe681ed9759bf22a8179bb13692ae5c3fccf2bd21ab4bb262
    lang: zh-Hant
    text: "來問問那靈魂吧，絕對無法成為孤獨一人的生命們。\n——嗚呼，我將繼續世界的試煉。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a7361a0e968f0cd06c522a04025624ebddb699885e2a6ba399f2e95da42f185c
    lang: zh-Hant
    text: "啊？這件泳裝？很適……咦，你說什麼？\n抱歉，沒聽到。再說一次看看。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a77545be19abb369a11c1bd56c6ef73f05694dfb315dd95e3a9d0323fd385581
    lang: zh-Hant
    text: "人家的肚子裡裝了滿滿的Happy噗！\n要跟全世界的Unhappy交換噗！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a795e39829573eadb09be5ddb4165b9622ced9c1da571c96a907d82fe6223c54
    lang: zh-Hant
    text: "算是遠親吧，一身全紅看來還很年輕呢。\n——萬花鳳凰"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a7a74b89313d548d8e7e15a9acf09854b5d39d32b242a1eff1fae5847138eecd
    lang: zh-Hant
    text: "真厲害呢。幽靈學校裡累積的，留戀的魔力。\n有這麼多的話，就能對路西烏斯老師下戀愛的詛咒了！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a7ad5225abc15a661457b349fe2d105d737327076e2e5325c362f3e6bc71e74c
    lang: zh-Hant
    text: 【你是應當毀滅的惡】
    origin: machine
    low_confidence: false
  - source_hash: sha256:a7b2803be8d3f842889a25786c0f53df38b041fc8bf7944efe9011eb5ce469c3
    lang: zh-Hant
    text: "此刻，攪拌吧。合而為一，唯一的一。\n無論老少，交融吧。汝即鄰人，鄰人即汝。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a7c86751aed717d9307db8cdfbf0dd08029f8ba416570d74a4d0994cdd1240ed
    lang: zh-Hant
    text: "女僕卯月的冒險，接下來會去哪裡呢？\n要是能像故事一樣，體驗各式各樣的事就好了呢！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a7eaea488e625bee7633c921805b40162aa507a02e776dc8e23d9e7e56905f0c
    lang: zh-Hant
    text: "複雜的討論太麻煩了！事情就簡單解決吧。\n沒錯，用你死我活的認真廝殺☆"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a8181a0749151aa1d33dedc15bd39b4a24fb9b05158c35d0fc0540c74eafd8a5
    lang: zh-Hant
    text: "你好啊！我是青竹回憶！\n賭上魔鬼風紀委員長之名，要嚴格地跑下去囉——！！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a81a4e5b61f25579eba4b47b01ab344032f9b44f7a1c672e1a9cff52a0b66ba8
    lang: zh-Hant
    text: "因為人類祈願。因為人類渴求。\n惡魔吞食那欲望與妄執，蔓延開來。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:a868af4dc738a744e8a6e45ca0b83e1e1ab1bf1c26754dce83b3f8d2a3415a3f
    lang: zh-Hant
    text: "森羅小姐幾乎能閱覽所有的監視影像。\n所以身為助手的我，得去找監視不到的地方。"
