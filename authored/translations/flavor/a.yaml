    low_confidence: false
  - source_hash: sha256:ab9a28112cae4a52dddc6f3139a5b8c8cf4eb244f30c5df3b3bc119e67fd2e82
    lang: zh-Hant
    text: "「哇！右邊有敵人耶！真是的——告訴我一聲啦！」\n「因為，還沒告訴妳，妳就先打倒了吧」"
