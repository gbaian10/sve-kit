  - source_hash: sha256:ad5cd610ebd3cb4f263db38406cbb1f5853595c356ff46bca9735eb260c9782e
    lang: zh-Hant
    text: "「軟萌喵好可愛喔～！……！？咦、等、眼、對上——」\n※請稍候片刻※"
