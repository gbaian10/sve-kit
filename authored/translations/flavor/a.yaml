  - source_hash: sha256:a8bfc0a86bb1c6d2fdbfe444ad9e6155f553f350603d48ce13aa490e76dc9134
    lang: zh-Hant
    text: "若能心意相通，人與獸便能合而為一。\n你就是我，我就是你。奔馳吧，然後飛翔吧！"
