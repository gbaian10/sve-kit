    low_confidence: false
  - source_hash: sha256:a989ad77fc4427ff3f2ca7ead066af853e4375bb59c63d1ae5aa95a2dd6e96a3
    lang: zh-Hant
    text: "就只有現在放棄毀滅世界！但是！\n我絕～～～對不會氣餒的啊啊啊！！"
