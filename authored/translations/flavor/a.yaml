    low_confidence: false
  - source_hash: sha256:aaf3e09bc33015684ba2d62ff798a3cf8f5192887bb7491cc266ff02a20b70f5
    lang: zh-Hant
    text: "目白家之名，可不是浪得虛名！\n用這對翅膀，高高地、高高地……展翅給你們看！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:aafcc03222eb9a49e3ddb83f56832c16386ffd9e0446b0333a27b5b4f1f38ab8
    lang: zh-Hant
    text: "侵略如火Death。來來，將軍請下令！\n在下將展現最棒的戰場功績是也Death！"
