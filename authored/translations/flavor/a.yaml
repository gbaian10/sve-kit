    low_confidence: false
  - source_hash: sha256:af7a83e5f9705227dea7c2b0a503fc759d0d86a2ae7205aa567047073dfe10ad
    lang: zh-Hant
    text: "我被吩咐，不可讓任何人通過這座薔薇庭園。\n能請您離開嗎？我不想動粗。"
