  - source_hash: sha256:ad884a189cd341cab6ddceea5774d2cdc566b384d58841efa84361c839ab1a15
    lang: zh-Hant
    text: "魔術師以魔力操控風。她想，這是為什麼呢。\n因為只要拜託一句，風就會實現願望啊。"
