    low_confidence: false
  - source_hash: sha256:a9baf6e794951bfad55d8a8d36317f58bf4e8c916b03e910a7501b4547ac125b
    lang: zh-Hant
    text: "我才知道，不砍樹有時反而會讓森林變糟。\n所以我想學習。為了真正地守護森林。"
