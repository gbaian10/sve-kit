    low_confidence: false
  - source_hash: sha256:ae402a453d70a950d1a778d59cf9fa63e636cf8f297f467932cae662ccd14ab9
    lang: zh-Hant
    text: "封閉的冰之城。漫長歲月中，公主守望著冰晶的光輝。\n「此領域絕對不可侵犯，離開吧！」"
