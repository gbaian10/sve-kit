  - source_hash: sha256:ac4ba9942ec8ec4278ed4233992d0d1a78c92f0c687751cfdfa988525b38b0c3
    lang: zh-Hant
    text: "今天的萊拉小姐是讓人做一夜之夢的夜之舞者……。\n會讓您看見格外幸福的、閃耀的夢之世界喔——。"
