  - source_hash: sha256:acb654fa90be3bb37ea085ebdedbd6349533e9f5e884ef02566baebf22480a15
    lang: zh-Hant
    text: "仔細聆聽，傾聽森林的細微動靜，就能免於危險。\n仔細聆聽，若沒察覺那尖銳的聲響，就無法全身而退。"
