    low_confidence: false
  - source_hash: sha256:ab68aa4039aea3f69f2b6fa8df4f68aa11b1ba1b95fa865768501f2a19f4112d
    lang: zh-Hant
    text: 來吧。把青春，奪回來吧。
    origin: machine
    low_confidence: false
  - source_hash: sha256:ab87fbfed6b277c899f89ba15711d3eb3800ed38b06a9374722c2ce42bafde88
    lang: zh-Hant
    text: "這片水羽是加護的印記。能提升聖水的力量喔。\n我會不斷準備的，想汲多少就汲多少吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ab903e87e15d584f62009388350ede69f9dc829e081ba90e3740f551576a470f
    lang: zh-Hant
    text: "那是位於森林深處，有如隱居處的旅店。\n提供吃不完的佳餚，與夢一般的時光。"
