    low_confidence: false
  - source_hash: sha256:a940d166e59de0f51d2dfd7e372ef02e97d0126617bfd5c496ec82f454b2c839
    lang: zh-Hant
    text: "嗨呀——！又唱又跳，嗨到最高點吧～！\n對啊對啊，你也一起來跳吧～！"
