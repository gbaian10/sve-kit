  - source_hash: sha256:a8abaaa40efea5e6761ca65bd67cbbd45372e383d04e6ab8acd92b8c1751e590
    lang: zh-Hant
    text: "徬徨的迷路少女面前，一名少年從天而降。\n互相爭吵、互相衝撞，即使如此，嚮往天空之旅的心是一致的。"
