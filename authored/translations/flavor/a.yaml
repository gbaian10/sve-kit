    low_confidence: false
  - source_hash: sha256:af937b1307068da729d5e78b195949d0ecdf12fe5d36129bd3a7271c7a179933
    lang: zh-Hant
    text: "就連很久以前死掉的傢伙的來歷，偵探大人都一清二楚。\n——正因如此，尋找連偵探大人都不知道的情報才令人雀躍！"
