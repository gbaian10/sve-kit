    low_confidence: false
  - source_hash: sha256:ac3df9002b1d13bcb490a1167cf7c3f7b1d27557d16e672a782141a7fb860f64
    lang: zh-Hant
    text: "雙眸映照自由的天空，雙腳行走於天空的霸道。\n魔龍騎持續馳騁天際——熾熱的鬥志，沒有盡頭。"
