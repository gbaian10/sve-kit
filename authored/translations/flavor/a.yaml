    low_confidence: false
  - source_hash: sha256:ad9dd87c347138a556d17f6f492a74548509898dc614cadeeb010a5d9d1c89cb
    lang: zh-Hant
    text: "因痛苦而吱嘎作響，憎恨著悲傷，\n跨越了這兩者的她，夏日的樂趣不會結束。"
