    low_confidence: false
  - source_hash: sha256:a93bbf577b00ce655cb074d4fbb6c22a03a8bbbba9a06c898fc1912dd901f04a
    lang: zh-Hant
    text: "野地之花，在平穩與陽光下綻放。\n戰場之華，在勝利與榮耀之上盛開。"
