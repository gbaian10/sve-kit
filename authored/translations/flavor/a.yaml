    low_confidence: false
  - source_hash: sha256:afa51f829bb5d357df57813b2df3faf9951e88766d1e3b0cec249161f36ccef0
    lang: zh-Hant
    text: "旅行也好，停下也罷，一切都是自由。\n此刻雖憑義心而戰，總有一天，會再踏上無拘無束的冒險。"
