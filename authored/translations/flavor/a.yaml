    low_confidence: false
  - source_hash: sha256:af6e8ddbe1289071044bf55ac00600a56456815182d177b23021abe484821277
    lang: zh-Hant
    text: "「來……沿著那條路，回到原本的地方吧……。\n用地、地盤，這裡是領域。你不可以來……」"
