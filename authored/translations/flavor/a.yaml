    low_confidence: false
  - source_hash: sha256:afb7056dc0ce384c96682be1f514657284104a98423462ba3dbbf1c2becbfcbf
    lang: zh-Hant
    text: "金黃色的湯、整齊的麵條、入口即化的叉燒。\n肚子一餓就會想到拉麵。那是帶給我感動的食物！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:afc0b1b583d1a0e1103f76ab65ed001148d12dbdbf220a5b71acd1ae8f1bc378
