    low_confidence: false
  - source_hash: sha256:ec5ce14216226551c21bd1ea13daf44a87eefdcb7b284d7a184af322d6e193a7
    lang: zh-Hant
    text: "那裡是惡魔經營的，極品飯店。\n通曉欲望的專家，回應沒有上限的欲望。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ec7d75f8fdcb0820d78cf83f441d359ff395b5326edc8cd5dae9176bc4d7d8bc
    lang: zh-Hant
    text: "只要滴下一滴泥，純水就會變成泥水。\n只要滴下一滴惡意，純粹的神就會變成邪神。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ec8cfb3353a1fce7e4b5e1413fe471a7743d2861379e9fbeb19f24986cd8a48b
    lang: zh-Hant
    text: "現在莫名地很想聊聊。聊剛錄完的這首歌。\n至今為止的我。從今以後的我。什麼都回答你。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ed0c15e0c7f3646af2cfc55e8eceebae2e438904b5b26e88f0ee7083bef4ae7a
    lang: zh-Hant
    text: "「火也噴給你看，水也吹給你看。\n招待你吧，前往幻惑的世界。我的真面目，是什麼呢？」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ed75943837849199110035cd59e4736247cb7059ce5a21dd499f0a7dd5782ec6
    lang: zh-Hant
    text: "登峰造極的魔導所喚醒的，不滅的忠義。\n「回應吾之呼喚，再次甦醒吧！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ed81afa7edad1b774dfb473b7be7624b11900120adde11c57c6e35702df2470d
    lang: zh-Hant
    text: "「渺小又沒用的我能做的，頂多就是祈禱。\n即使如此，若能成為小小的希望……願神聖的祝福降臨」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ed94d8152d604d8dd10e643b1d9f8a3657d47bca794218b1be500f2e9d3e2067
    lang: zh-Hant
    text: "我為什麼，會覺得自己「回到了」這座森林？\n——迷途的旅人"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ed9df9465cc14a6babe8f0e176b1be9dfb352a4122368c911830fbf74cd20230
    lang: zh-Hant
    text: "大哥不一樣。是堅持的問題。直系之間照規矩要互相爭鬥。\n輸了就廢嫡。大哥一直很害怕。那，就算了吧，我是這麼想的。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:eda208f9cb6ec05b9e566c0b96f8a7e872c2cab884111f13e9325cf3720407a9
    lang: zh-Hant
    text: "池子裡盛開著許多的，蓮花……。\n我一定會讓您看到，不遜於這份美的我。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:edb2402ca770c40945a7a34dc7baf0e03722a32e3e4cc144f9acadf065f034ee
    lang: zh-Hant
    text: "終於，來到這裡了呢。\n沒問題的。你和我。變成新的回憶吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ee0ba4fd11a7b1e41a8814d2d5a3db181a518983c2ef6e72e2f345aa18611e0c
    lang: zh-Hant
    text: "我的願望只有一個。就是長長久久待在主人身邊。\n無論什麼困難都用這份力量跨越，一定會實現給您看！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ee262bea18f6c8856bdd3bce20cb59c53ab415e007dd3acf9c5cb3bd90f675c4
    lang: zh-Hant
    text: 碧色騎士的羽翼，劃破暴風。
    origin: machine
    low_confidence: false
  - source_hash: sha256:ee437c1e098e890e6a2635a07bf3b103279571aa5c4354185263db18e8709a8b
    lang: zh-Hant
    text: "拉比林斯達解放七冠權能時顯現的光環。\n雖是局部性的，卻能直接干涉世界，是迷宮女王的象徵。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ee96529d2ba14f2de83f75c04c9c0b762f7806830e3a352e7f3cba730a878564
    lang: zh-Hant
    text: "在前線的帥哥團長，只看得到背影。\n進入視野的，淨是蠢獵物的臉……！"
