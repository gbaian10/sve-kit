  - source_hash: sha256:eedecb416209ba51f8ad88a76e9b00949e05129332410d2f6502df25703769aa
    lang: zh-Hant
    text: "枯萎之後花才成為花，而我搬運種子，讓它一再綻放。\n被風吹散、被風吹開……這輪迴正是風流。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:eeeeffcf6f95599f0f2f61b8b6f4041c9573fa2baf4864419e7027d27e39b39b
    lang: zh-Hant
    text: "我是【美食殿堂】的雪菲……現在我能抬頭挺胸這麼說了。\n所以想待在你身邊的這份心情，我也不再隱藏。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:eefd5fdeb25fb241397c43b7e5965312d159bf67f143f0037aa44f6c413a006a
    lang: zh-Hant
    text: "血與痛中滲出的憎恨。我確實收到了。\n此刻，以你的血起誓……委託必定執行。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ef343b4e799d33d67e33831faf75980ed7477f15855fa9d6ea837614066f646f
    lang: zh-Hant
    text: "呵呵呵，我是超級溪流喔～。\n為了大家的笑容，我會加油的。請交給我♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ef4c921f32b841b2ed9add327c46109bb74a9ab4d9302e34c0009210d41bf576
    lang: zh-Hant
    text: "鬆開來了啊，這顆硬腦袋。總之就是想太多了。\n像釋迦一樣平靜呢。心也好身體也好，全都自由了。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ef7a425e512afcdf3aefb4e0eeff2aba89b96ca88627570153112bf0aa17cfc0
    lang: zh-Hant
    text: "「謝謝！那聲援，讓我的肌肉振奮起來了！」\n射中的，是球門網。還是觀眾的心呢。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ef864d9a9e37df2ddca3e610027583f5e1e7beed9be112a228f2761f617c46ce
    lang: zh-Hant
    text: "正面突破……呵，沒想到這招。好，暫停！\n我現在想一下。呃——沒有魔導書的魔法是，啊——……。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:efdcb513f65bed504461cab86abbb3c3b65e4b94d71b5719f7afd1661f26d2e9
    lang: zh-Hant
