    low_confidence: false
  - source_hash: sha256:eadd76fa040fe2e8a4c3c247a44164e046bfa8d6a5eee42594b3b81c4f82a3d1
    lang: zh-Hant
    text: "輕拂的風。清澈的空氣。蘊含神祕的泉水。\n要治療傷口，很難有比拜託精靈更好的方法了。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:eb117aaac28b9d62c498a3bc3995b3cf08e8e39454c176d1d1463b4b6b1a7c99
    lang: zh-Hant
    text: "為了成為父親大人和母親大人所說的、能夠愛所有人的人……。\n為此，對遇見的每個人都得說些甜言蜜語才行！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:eb7dad729f1d831c2ef91417ce1d9f11783b573bae7a0606462da947993f27cf
    lang: zh-Hant
    text: "不管怎麼工作，欠款都沒減少。只有利息不斷膨脹。\n拚命努力也得不到回報……這個社會並不公平。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ebc1469c735213c4a2c012045d3ac3dcf5f255c7bd88ac08dec83e46c0bfc518
    lang: zh-Hant
    text: "斬斷死靈術師詛咒的，是沒有實體的劍。\n落下吧、斬斷吧、使其長眠吧。為了安詳的終結。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ebd289a2160d179a22b16ffd5edcc63ef782550b791c38bd523172a78e43d199
    lang: zh-Hant
    text: "只要你在身邊，就沒有什麼好怕的。\n降臨的不安與恐懼，我會全部斬除。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ec36badd18a4544d069678cb8b2643ce8845e11e93a0d48deaa9d1c1edd1fce3
    lang: zh-Hant
    text: "嗚喔喔喔！燃起來了——！\n以真正的超級英雄為目標突擊啦——！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ec3760b17bc74d761212ce52a252ec9de8da8b29460c59b18c318f2168ac7f6d
    lang: zh-Hant
    text: "欸，你。你對現在的自己滿意嗎？\n我是你的夥伴。站在想成為什麼人的你這一邊。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ec5a44d03cf5e8164a3011cca28793f918cf60a2ee1cf058187ddf4426e3ca90
    lang: zh-Hant
    text: "那胸中的意志，只有一個。\n將血，與死，獻給主。"
