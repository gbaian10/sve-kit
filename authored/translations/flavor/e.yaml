format: 1
kind: flavor_translation_shard
entries:
  - source_hash: sha256:e06356d97f948079541db0496d6ea8e0766ae3c0335d18ab4a79253e0608a8a8
    lang: zh-Hant
    text: "刺骨的寒冷，化為傷痕。\n——不融的銀冰‧菲琳"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e069f7a0731f443455d6b87dba040ff9c259ee70e7ea2bd0494ba89389b4c7e0
    lang: zh-Hant
    text: "違背任俠者是爛掉的花，是吧。\n——剪枝的罪人‧瑪伽綺耶"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e0792543748c9bf9b3f6610e0840f7915a63507712c6c8ca2421b5ea5547693a
    lang: zh-Hant
    text: "魔導通於迷惑。反覆迷惘與解決，知識才會增添深度。\n翻開書頁，來，迷惘吧。徬徨盡頭的翌日，汝即是魔術師。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e0951ed218483f2ad4c06cb4fc3985bd54d90b4c3101e759b61cdd94ad406997
    lang: zh-Hant
    text: "烏合之眾用完就丟。不可或缺的不需要兩個。\n連同擊錘一起斬斷——拔刀吧，白牙燐斂。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e0a5e28785846d9b3d77438c64fdf5e331fc52b2779c2ca072b8665dbeadd3c6
    lang: zh-Hant
    text: "你說的挖到寶，該不會就是這個吧。\n真是打從心底傻眼。一旦惹上龍的怨恨，連村子都會被轟飛。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e0d2d452b94ae55c4d0f01a67f125816b5ffc9c777d6dce5b922270fb0716852
    lang: zh-Hant
    text: "撕裂敵人的那對利爪，今天刺進了夏天。\n「抱歉了，這面旗子，我收下了」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e103fd026cd16ae97a8d8c7d9dd51323858a5cb8f5f5af1bc2be17c120f66d73
    lang: zh-Hant
    text: "「像我這種人，死掉就好了。可是……」\n庫璐璐大人低下頭，輕聲說「……我、好怕」。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e10abe3a7f212dc542ecc5cde603ffd8699e8a7b892636e210b95c7e1d46c458
    lang: zh-Hant
    text: "沒有一絲一毫可恥之處。自己是堂堂正正的人。\n那就讓你曝露出來吧——解剖浸泡吧，烏之涅。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e1180bedd3fba97db03aa0a4b8634c36319c24d611fcd60a9d289eb9a98ccd5c
    lang: zh-Hant
    text: "助手君、助手君！是很厲害的神祕景點喔！\n快點到上面看看吧？預備——，跑♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e1489b38038ef3efb605926418bad52b278b5e9b57f42e994d218379e034f0df
    lang: zh-Hant
    text: "現在最熱門的女國中生偶像的LIVE，居然免費！\n不在這裡看就虧大啦————！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e1815491b7fe9c42a032b619bc1e43bba2fede506ad51dcfaa4b2e487fd97b0e
    lang: zh-Hant
    text: "司掌武力的《巨人》，亦是帶來恐懼的罪人支配者。\n盤踞雷維爾的惡徒、奸賊。全都在她的掌心之上。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e1838d124479e5b89a79eb23a231356d8a95dabee2493750799ccd0758210e5a
    lang: zh-Hant
    text: "雖被說是狐假虎威之輩，實為依神樹之意狩獵的使者。\n看似隨興的舉止，也是團結一致的森林總意。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e19b8ab1e7fdd1698897b632d2c81004755a47f1657c6f2ba0ab17a6d17505bc
    lang: zh-Hant
    text: "磅～♪怎樣怎樣？人家的伸展台！超可愛的吧？\n啊，秀才君臉紅了笑死～♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e1b690d48f6b0b4b0c4d61bd3481bbf3d14ca436699267fbe5cc9902f1dcf8fa
    lang: zh-Hant
    text: "零事故的基礎知識。精密的機構是很纖細的。\n引擎振動數、機體溫度。診察機構的機構不可或缺。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e2118043e6eacdc4e8eba14a055b8cc78b3359d88f5383ffbfdd157cff6c1d0d
    lang: zh-Hant
    text: "若在情感之海投下種子，欲望便再也剝除不了。\n——嗚呼，我將賜予世界試煉。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e2445638efd5aefdca534c2b350ad7e872e41f5b39820331d3d46a893ce8b5b5
    lang: zh-Hant
    text: "很久以前創立綠傘會的始祖，森林的父祖是這麼說的。\n這下能殺更多人了，趕盡殺絕、把傘張開吧，據說是這樣。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e2b1e7bc9a4a2da7be092ed72128a837107f5b983ba4acc4a7581184aad8d9cb
    lang: zh-Hant
    text: "今天就翹掉練習吧？這種東西好無聊！\n所以……好嗎？今天就一起玩吧？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e2ea4ce88a74269c1cfae1f304235f38ef3f671ef53e050d7f7b6cd168563012
    lang: zh-Hant
    text: "破壞到亮晶晶！打掃要大膽且默默進行！\n不叫的貓才抓得到老鼠，閒聊是工作的天敵！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e2f1802f82e41fb0587d4e8658e4f6a914b00ae9f0b9677737e59cd719054b03
    lang: zh-Hant
    text: "閃耀之物。脆弱、虛幻，卻又堅強之物。\n那正是，在森林中生生不息的生命……我所背負的光輝！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e30d4dc4a766bc7a3c176bed3ef231ae1eb370af318a92fd5e9fe7ba56b02ddf
    lang: zh-Hant
    text: "以不可動搖的神之正義為名，聖女的行軍繼續著。\n「我保證絕對的勝利！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e30d8b425d8172ef462b7c8808f62aaac28fda38603d40ab59c2a94286b4d61d
    lang: zh-Hant
    text: "我想，是因為收到了閃耀的鞋子，我才開始奔跑的。\n收到這件閃耀的禮服這件事，我也絕對不會忘記。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e313eea336c2ae8130f837a7ae341605287aa3d7af05dfabf1701a16ae85bfac
    lang: zh-Hant
    text: "哥哥，來，請進。到我和姊姊中間♪\n欸嘿嘿，怎麼樣？這就是姊妹夾擊♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e31bc4ea379ca1017080f66fab72ea53361767473e45fcce47d75975b3d35a14
    lang: zh-Hant
    text: "在充滿爭鬥的世界裡，能依靠的只有自己。\n唯有這份得到的力量，絕不會背叛。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e322877e887053955e614e060b560326b60b10def845092d801ea86b1ce15c60
    lang: zh-Hant
    text: "我在幹嘛啊……我。闇影詩章什麼的，根本不像我……。\n——真壁昴"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e325b32cb8286d11998727bb1cfe134c7d5c89de5cc9b8dc438ff7141b5286ac
    lang: zh-Hant
    text: "與其被討厭，還不如用虛擬化身。\n——乙坂紫音"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e32ca3088a27cb9d64e7342596295750ad2a5eda81c3ab76ed1e401068ecc255
    lang: zh-Hant
    text: "進化後的精靈之力——\n將為無可取代的羈絆而奮起。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e36e0d04779bf9d4fbad32c748a6bafad6f2eaea49d043382a34f42d6918d5be
    lang: zh-Hant
    text: "讓您久等了，這是莓果醬鬆餅♪\n來，看著麻由……愛你愛你，啾——……♪"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e381a83f0502a44bb0fb9e8665fddd745ada8aeceed7cd67e574111888cc0a27
    lang: zh-Hant
    text: "如今兩人，已成為彼此引以為傲、獨一無二的搭檔。\n「只要不是一個人。就覺得哪裡都去得了！」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e3988124e7ea981d03b353505d995f0c4e69efd22d1ac9e341663f35caafde51
    lang: zh-Hant
    text: "雖然我總是送慰勞品的那一方，但收到的時候也會很開心呢！\n明天換我準備帶來！美穗，妳想要什麼呢？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e401609e7fe4529286cec1ed91e6a7c3009716f154e8cf050c6eab20cb5315a2
    lang: zh-Hant
    text: "「從人類先生身上做出來的東西，閃閃發亮的我很喜歡。\n好棒喔，好棒喔。城鎮、金幣，還有靈魂」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e40e490264fb0eaf64499f8a01130ac990b46091c9564beb91e315d50118be36
    lang: zh-Hant
    text: "嗯——早安——……。現在是，早上？中午？晚上？\n算了，什麼時候都好……想睡的時候就睡。就這樣而已。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e41ab45b73afb2734065cfbc3eb0e235facdd14226594e236a88b662083808a8
    lang: zh-Hant
    text: "請人幫我做了像女服務生的可愛服裝。\n嘿嘿，你喜歡就太好了！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e41e11feb6cb64af5f2d694a635e2ad61d6a9d376fd140c735958952b7a34768
    lang: zh-Hant
    text: "「Honky-tonk、隨想曲，我的節奏就是瘋狂本身。\n讓心跳響起、狂亂彈奏吧……你的慘叫就是伴奏」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e4265edebff5028f91c1c5630716eeff6d0cb857a806fc5a58c6a56a84d2b766
    lang: zh-Hant
    text: "吾身啊，化為白龍吧。\n為踏入學舍之人……帶來淨化之光！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e4420ea6db937d2786b2d47cbbfd015bd60b74f40fd594b69623dddcea8ee1c8
    lang: zh-Hant
    text: "聖徒教會傳授的武術，專精於化解與防備。\n在魔手伸來的那一刻，白槍一閃。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e457e56f957ec49dfd12680f18f95b0f0304d94af9cfca16089e29400f0e023a
    lang: zh-Hant
    text: 這是最後的制裁。終末大漩渦！
    origin: machine
    low_confidence: false
  - source_hash: sha256:e488fa56576573382fb07bb8a8704033318d86cc169aaf1e7d23d87dca0be4e6
    lang: zh-Hant
    text: "那就是『忍法‧蹩腳忍具射多了也會中之術』呢！\n——女忍者之卵"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e48e65ea256add82b789761435ab5bf251a4bd4d6a9d34de5ddb986c975b9ae0
    lang: zh-Hant
    text: "俗世浮世，就此別過。\n歡迎來到，笑容的大旅館——天象旅籠，天地。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e49f5ee6b874ae1625283ee0f4fb8788b355e9110860a53eb8ff79902be1f5d0
    lang: zh-Hant
    text: "姊姊她啊，很厲害喔。\n比起我這種人，她能做得好太多了。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e52542886eb045319a6b106e59c664020f6d542e0678a850244f6252a23b5bdf
    lang: zh-Hant
    text: "沒有肉體。沒有命令。再也得不到榮譽。\n即使如此，那顆良善的心，仍不知止息。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e54a141f7c5e85337757c25bfbddd986fea4b4fc5ffab3d01ef68ec9b6abcd77
    lang: zh-Hant
    text: "那些殺上門來的蠢貨，我跟兒子不知道砍了多少。\n讓我想起了和那個人在一起的時候啊。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e553cea698ea8558a4a0ca016b420186b666f74b86a1aa7c6d6de384fc8fbac7
    lang: zh-Hant
    text: "棲息於馬納歷亞學院後院、深綠之森的小小幻獸。\n能把魔力儲存在額頭的寶石裡，轉換為萌芽的養分。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e5717d821e01c02021f3b8a8edb7e3e23668f3f78042a70f8863ff4a70815b10
    lang: zh-Hant
    text: "在安息之中，與自己的心對峙吧。\n我的力量既是試煉亦是慈悲。來，睡吧。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e57c20f3b7af0e86e0e1042ae04b45033f5e3fe3df4621991a60b1de57b12376
    lang: zh-Hant
    text: "失敗、跌倒，都有過很多次。\n可是……在這道牆的另一邊，有大家的笑容……！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e61ed4ebae9aecaf56b74d8a87c94eaae1d63f01d83d04fa6a639493093bbd3f
    lang: zh-Hant
    text: "妳擁有力量又懷抱孤獨，所以我才牽起妳的手！\n背叛者惡龍古蕾婭……不可原諒，唯獨妳！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e64e6560a4845b4816a2c2f76f551168a39b3511c0e9f14b4a0076781db0f721
    lang: zh-Hant
    text: "我會克服所有降臨的不幸，奪回故鄉！\n沒錯，就算現在這裡掉下隕石也……咦？上面？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e67c7761b644dcbf1602d8149915c30993e05779917f68f1bf248bd6fb1b6c26
    lang: zh-Hant
    text: "不一樣啦。背負的東西、懷抱的東西，重量都不一樣。\n——小鳥遊翼"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e682006ae949f383c5419b7e8ff0de128fbbb24f1068819db15ad439c54bf157
    lang: zh-Hant
    text: "在闇影詩章裡就能變得自由！所以非常開心！\n——風祭蓮"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e6a0de590f0a0eda930b17afb73cf2484e11be121fbac143cc55bc3ccf0d9501
    lang: zh-Hant
    text: "偽裝成人魚接近人類的水棲妖物。扮演少女的魔物。\n眼中燃燒的情焰並非戀慕，而是對即將品嘗的美食的興奮。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e70c1490427741f7e102730c78acb0a9c39e9644cad069f45aee85d7c586dabf
    lang: zh-Hant
    text: "翅膀、鱗片、尾巴、臂力。無論如何他們都很顯眼。\n但為了匡正世道，也有人潛入黑暗之中。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e73ba13edb3019af325a350683f96b04fa7c0dfad4446f34fe6501a2a7f849c1
    lang: zh-Hant
    text: "別看我這樣，看到有困難的人就沒辦法不幫忙喵！\n今晚為了正義，要和貓咪一起四處飛奔喵——！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e760067e2a2257904d85702d3c469ab50c980808c52e8b0bf5bc187fb0f64c8a
    lang: zh-Hant
    text: "因為有心才能笑，也才能像這樣愉快地談話。\n……不過嘛，要是沒有心，也就沒有悲傷了。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e7782ccf0d850341cc0a5fe91a5a8b2dd19efc70c491d1b0d4287d96b4c4c974
    lang: zh-Hant
    text: "這個鎮上出現小偷了！？\n這不是對認真工作的人的冒瀆嗎！不、不可原諒！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e778f7cf2bad1800bcd503c3a5eb233934f7814daad29af6ebc9bc280f4b4597
    lang: zh-Hant
    text: "為了得到一族所有人的認可，非贏不可！\n要集中……這樣的話！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e785e4c1f370a3c7805f55dfbfa79b4e694a87b10933976572d2e9994b14d141
    lang: zh-Hant
    text: "誘入深淵吧，凝視黑暗的愚者啊！在黑暗懷抱中沉為海藻碎屑吧！\n……呵。就是這個，這個啦！決定台詞就用這句吧！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e795366c6570036a314d9b4eedef0ec46a8a9cbcdda5f6cd12bd7926bd655abd
    lang: zh-Hant
    text: 守護弱者的勇氣之劍，閃耀吧，爆破劍士！
    origin: machine
    low_confidence: false
  - source_hash: sha256:e7cfd09d6198355ba7d8fca39a60ebce0c979b7bd2d49853410ae9d5d90a4375
    lang: zh-Hant
    text: "在這手中的是真實的光輝。是我一直在追求的東西。\n這次我會好好送上笑容。綺莉……重要的另一個我。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e7d118b7b379184473f0d8a7a2dd8ce3f706a639bedfcc87a9cd1b7933fb076f
    lang: zh-Hant
    text: "「懸疑的話我很拿手喔？犯人就是文化祭」\n「嗯，妳在說什麼真的是個謎。很值得推理呢」"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e805ad8a0da91842f675f668545dd2f4388e8bfb91fed3a01edb323612da09f9
    lang: zh-Hant
    text: "總而言之，魔術的關鍵在於向誰借什麼。\n向師父借書也好。向自然借智慧也好。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e821b6b8fed1b413419138896ca3050464002834a6c8b403faf3495730fde514
    lang: zh-Hant
    text: "我來治癒你♪身心全都交給老師吧。\n只有現在什麼都別想，感受我的溫暖就好喔。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e838566c7743ac94121852d963390bdf4c371735c5635d4943d34a9279744777
    lang: zh-Hant
    text: "就算刀刃缺口、就算折斷，只要有我在就不用怕！\n磨利它，斬斷一切！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e8417c7dc02adc84a86697f675d16d44b17dcf71497874d66c5ec3700ea236ef
    lang: zh-Hant
    text: "是嗎，要抵抗是吧！那就不客氣了！\n在你們想投降之前，見什麼砸什麼！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e8744a2a3cfb675d9fc42efeedfdbc225fd53b107cdd09ca576c23e67092d280
    lang: zh-Hant
    text: "好的終於開始了，世界與世界的碰撞！\n這場令人手心冒汗的戰鬥實況，就交給我恰特吧！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e8a555e6f3c254bb5f132b30c848aba22d80974df5472465bb5b0dd183b80b20
    lang: zh-Hant
    text: "呼……努力跳著舞，整個人都熱起來了。\n不過，非常開心！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e8a5deec24dc1171adc534e9ef96feb3a9b4082823b833ce6f82b6213a2adaad
    lang: zh-Hant
    text: "我一定會保護大家！\n因為，大家的身邊就是『現在的我』的歸屬！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e8c49abcdf63f70c399ea7eaf394a8f57798ac4f26d1b5307faaed0022675bb6
    lang: zh-Hant
    text: "每逢日升長一片鱗，每逢日落長一顆牙。\n幼龍花費漫長漫長的時光，逐漸成長。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e8c8bba776d0e8f8c55ac597434bf31d69ced648ddaff3a21a044d5cf5241cb3
    lang: zh-Hant
    text: "你接納了這麼無可救藥的我。\n所以我也……會接納你的全部！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e90785712456f1dcfbd2212d38a773bfb798203b4e0851e82f92b7e0b77bae9c
    lang: zh-Hant
    text: "反抗吧，用那份熱度！\n——烈絕的顯現‧嘉魯蜜兒"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e92531a78f6428d288749699d854be3c1533ce3d2fb283e6493544c241f9fcba
    lang: zh-Hant
    text: "殘響不減。殘響不止。殘響不消。\n唯有沉默，留存。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e93dc7d66937da792e26dec5d4f670e3b05d03e8ef435c3582188427fa1de14d
    lang: zh-Hant
    text: "甦醒的少年沒有記憶，沒有力量。\n然而無垢之心所連繫的羈絆，將照亮少女的未來。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e96ee70ed887656b79f01867a035215ae3f24c2e8b8ee737b6b9492241da2c16
    lang: zh-Hant
    text: "隨機延燒的是自然之火。\n魔術之火則瞄準目標，一次、兩次地連鎖。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e9860cc07182678ce013bf9b09773edfd079d1c482fb07bd7c4221bc2692cd7e
    lang: zh-Hant
    text: "歷經歲月之物，未必就會蒙上灰塵。\n歷經歲月，確實會有某些東西萌芽。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e98e1c872d956179b9865c82d1bf83ac6bafa4424738843f5b1abfa029c36a51
    lang: zh-Hant
    text: "高度網路化的透京有兩種暗殺者。\n在ＮＥＴ暗中活動的電子暗殺者，以及現實世界的暗殺者。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e9a90ff84b9894fd6529e11e54e0a6bf8268b166b0a8403dc25396b431579241
    lang: zh-Hant
    text: "壞掉了？瑕疵品？淨說些任性的話不可原諒！\n把嘲笑我的一切都撕裂！維多利亞！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e9aa9d35f9adc9e11fbcbcd54ef8a0c8e61e4a585538736d0d5de1e2f57446b1
    lang: zh-Hant
    text: "淪為英雄，無止境地戰鬥。\n三相的加護是恩寵，抑或是——。"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e9cd8f9d405a5a0617d98b6bf67ce7d3c56a648a230e58ea09f3086c27c21615
    lang: zh-Hant
    text: "實現並守護大家的夢想，Twinkle☆Lovely千歌！\n要讓閃耀星星的歌聲，響遍全世界！要上囉——！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:e9d03144e751cf11e4d7283514d69537d0f283a458a2d78ad4f5f6a6b36895e7
    lang: zh-Hant
    text: "嗨嗨——，要把Marvelous的心情送到全世界喔！\n我是奇銳駿！大家也一起Marvelo——us！"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ea30a0f91ecc8a973cb4f307a76b1ea06e81f40fb61e7aa1e8a6da028e227805
    lang: zh-Hant
    text: "對人懷抱的強烈情感，去區分它根本是不解風情。\n怨恨，說穿了你不覺得就是愛嗎？"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ea33e57b2b790f6ce74ca345d8b4f9397f13a6e80160e11de89235ac048bc325
    lang: zh-Hant
    text: "實驗大成功。啊啊，自己的才能真可怕。\n——於崩塌的書房"
    origin: machine
    low_confidence: false
  - source_hash: sha256:ea738ce311a102aab9b1a9e856b3488cfc8860a621b9c12423d57427c2ecd7ac
    lang: zh-Hant
    text: "太久沒做……指尖……感覺回不來？\n不過，在那個舞台上得到的靈感，一定要化為新的形式！"
