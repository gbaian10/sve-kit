    lang: zh-Hant
    text: 這個從者的{入場曲}能力中的「若將原始消費為奇數的卡片放置到墓場，則抽1張卡片。若將原始消費為偶數的卡片放置到墓場，則自己的主戰者{生命值}+2。」，是指以這個從者的{入場曲}能力從牌堆放置到墓場的卡片，其原始消費為奇數或偶數的情況嗎？
    origin: machine
    low_confidence: true
