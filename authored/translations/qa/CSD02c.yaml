    source_hash: sha256:df6b9142001775c0aed019b7024bba0dcb1c50eef54e571975a31b4d31be0441
    lang: zh-Hant
    text: 是的。正是如此。將自己牌堆頂的1張卡片放置到墓場，若放置到墓場的卡片的原始消費為奇數，就抽1張卡片；若放置到墓場的卡片的原始消費為偶數，就使自己主戰者的生命值+2。
    origin: machine
    low_confidence: true
  - qa_id: qa:v1:838cefa7d5798e248f3811fa0d4ffc926d8a22eb9ee1feb012b934f292f35222
