    lang: zh-Hant
    text: "是的。是永續能力。只要墓場中有5張以上的雷維翁・卡片，『雷維翁戰斧‧傑諾』就具有【疾馳】。\n將『雷維翁戰斧‧傑諾』召喚到戰場上後，若自己的墓場中的雷維翁・卡片從4張以下變為5張以上，其就具有【疾馳】。\n將『雷維翁戰斧‧傑諾』召喚到戰場上後，若自己的墓場中的雷維翁・卡片從5張以上變為4張以下，其就失去【疾馳】。"
    origin: machine
    low_confidence: true
  - qa_id: qa:v1:83792a17b02c6cf6709fbf4cc9898a1f9a9b5ae77a9b56e101ab87640bc0c44d
