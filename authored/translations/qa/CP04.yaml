    text: "3點傷害。\n\n有多個增加或減少給予的傷害或受到的傷害的效果適用時，由受到影響的玩家選擇適用順序，再適用效果。\n這次由於是自己的主戰者受到傷害，因此由自己選擇適用順序。\n適用敵方戰場上攻擊力為3的從者所適用的「給予的傷害+2」，以及自己的主戰者的2個「受到的傷害-1」，最終為3點傷害。"
