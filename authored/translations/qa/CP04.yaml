    source_hash: sha256:d1b36fff3868bfb18cef9b27f003364f83f8b5d6863fd4cf02de10286ad4b87e
    lang: zh-Hant
    text: "依自己的選擇，結果會是「不會受到傷害」或「1點傷害」其中之一。\n\n有多個增加或減少給予的傷害或受到的傷害的效果適用時，由受到影響的玩家選擇適用順序，再適用效果。\n這次受到傷害的是自己戰場上的『永久之盾‧席翁』，因此由自己選擇適用順序。\n可以任意決定敵方戰場上的從者所適用的「給予的傷害+1」與『永久之盾‧席翁』的「只要這張卡片在戰場上，這張卡片與自己的主戰者受到的傷害就-1。」的適用順序。\n\n①依「受到的傷害-1」→「給予的傷害+1」的順序適用時\n適用「受到的傷害-1」，敵方戰場上攻擊力為1的從者給予的傷害變為0點傷害。此時，給予0點傷害的行動完全不會執行，因此給予傷害的行動本身不再存在。之後雖然適用「給予的傷害+1」，但由於給予傷害的行動本身已不存在，不會適用任何效果。因此，最終結果為「不會受到傷害」。\n\n②依「給予的傷害+1」→「受到的傷害-1」的順序適用時\n適用「給予的傷害+1」，敵方戰場上攻擊力為1的從者給予的傷害變為2點傷害。之後適用「受到的傷害-1」，敵方戰場上攻擊力為1的從者給予的傷害變為1點傷害。"
    origin: machine
    low_confidence: true
