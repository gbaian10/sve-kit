    lang: zh-Hant
    text: "依照綜合規則中的「若發生多個要求執行某個行動的效果，且無法滿足全部要求，則必須選擇並執行能盡可能滿足最多要求的行動。」規則處理。\n此外，以下舉例說明具有這個能力的卡片位於戰場上時的處理方式。\n將具有「只要這張卡片在戰場上，敵方的全部玩家若可以藉由能力選擇這張卡片，則必須選擇這張卡片。」能力的卡片稱為『X』，未具有該能力的卡片稱為『Y』。\n例1：有1張X、2張Y，處理「選擇至多1張」時\n┗可以選擇『1張X』\n\n例2：有2張X、2張Y，處理「選擇至多1張」時\n┗可以選擇『X中的1張』\n\n例3：有1張X、2張Y，處理「選擇至多2張」時\n┗可以選擇『1張X』或『1張X、Y中的1張』\n\n例4：有2張X、2張Y，處理「選擇至多2張」時\n┗可以選擇『2張X』\n\n例5：有3張X、2張Y，處理「選擇至多2張」時\n┗可以選擇『X中的2張』"
    origin: machine
    low_confidence: true
