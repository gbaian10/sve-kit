    source_hash: sha256:96ea5680e49beedd7a9a96f12ab3592df68e2b84f9c91d106c3f57be9c7a59c2
    lang: zh-Hant
    text: "依敵方玩家的選擇，結果會是「4點傷害」或「5點傷害」其中之一。\n\n有多個增加或減少給予的傷害或受到的傷害的效果適用時，由受到影響的玩家選擇適用順序，再適用效果。\n這次由於是敵方的主戰者受到傷害，因此由敵方選擇適用順序。\n可以任意決定自己戰場上攻擊力為5的從者所適用的「給予的傷害+1」，以及敵方的主戰者所適用的「主戰者受到的5點以上的傷害變為4點」的適用順序。\n\n①依「給予的傷害+1」→「主戰者受到的5點以上的傷害變為4點」的順序適用時\n適用「給予的傷害+1」，自己戰場上攻擊力為5的從者給予的傷害變為6點傷害。之後適用「主戰者受到的5點以上的傷害變為4點」，自己戰場上的從者給予的傷害變為4點傷害。\n\n②依「主戰者受到的5點以上的傷害變為4點」→「給予的傷害+1」的順序適用時\n適用「主戰者受到的5點以上的傷害變為4點」，自己戰場上攻擊力為5的從者給予的傷害變為4點傷害。之後適用「給予的傷害+1」，自己戰場上的從者給予的傷害變為5點傷害。"
    origin: machine
    low_confidence: true
