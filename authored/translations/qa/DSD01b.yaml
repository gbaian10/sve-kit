    lang: zh-Hant
    text: 自己戰場上的卡片為1個『遺留的電擊』與1個『殘影龍人』的情況下，自己戰場上具有【突進】【指定攻擊】的『殘影龍人』攻擊，選擇敵方戰場上重置狀態的從者為攻擊目標。在之後的Quick時點，自己戰場上的『遺留的電擊』被『處決』等破壞，使正在攻擊的『殘影龍人』失去【突進】【指定攻擊】時，該次攻擊仍會進行嗎？
    origin: machine
    low_confidence: true
