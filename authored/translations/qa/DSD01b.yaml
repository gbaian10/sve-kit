    source_hash: sha256:2428fd344b055931973d79f7e465f690732b4699b7eb0688502c57433b3469d7
    lang: zh-Hant
    text: "是的。是永續能力。只要自己戰場上有其他武鬥龍人・卡片，『殘影龍人』就具有【突進】【指定攻擊】。\n召喚『殘影龍人』到戰場上後，若召喚其他武鬥龍人・卡片到自己戰場上，則具有【突進】【指定攻擊】。\n召喚『殘影龍人』到戰場上後，若自己戰場上的其他武鬥龍人・卡片變為0張，則失去【突進】【指定攻擊】。"
    origin: machine
    low_confidence: true
