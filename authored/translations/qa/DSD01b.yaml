    text: 自己戰場上的卡片只有2個『崇高的靂雷‧羅瑪洛尼雅』的情況下，敵方使用『忒彌斯的審判』，將2個『崇高的靂雷‧羅瑪洛尼雅』破壞。此時，可以召喚2個『遺留的電擊』到戰場上嗎？
    origin: machine
    low_confidence: true
