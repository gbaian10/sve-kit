  - qa_id: qa:v1:098a945b71a4acf123304b6f5cd7137ca8f2224279c6b9e8aa441c9fc083b9fc
    field: question
    source_hash: sha256:93df49555ce953e46097f277147adba7d3431550f868ef3eee137648780e6a93
    lang: zh-Hant
    text: 若因某些能力，而在敵方的回合中有武鬥龍人・從者進入自己戰場，『遺留的電擊』的「武鬥龍人・從者進入自己戰場時，在這張卡片上放置1個雷指示物。」能力會觸發嗎？
    origin: machine
    low_confidence: true
  - qa_id: qa:v1:1a1c63c31a35e4955b08152c88e12e01dab68f2353afe7435aad31a017956dcd
    field: answer
    source_hash: sha256:4b2635107fee02c3327f9204aa495d4b843109b45b4ff5b9e7d424f54a68aad8
    lang: zh-Hant
    text: "不行。無法召喚2個『遺留的電擊』到戰場上。\n2個『崇高的靂雷‧羅瑪洛尼雅』因『忒彌斯的審判』被破壞並放置到墓場時，各自的{謝幕曲}能力會同時觸發並進入待機狀態。結算處於待機狀態的第1個『崇高的靂雷‧羅瑪洛尼雅』的{謝幕曲}能力時，由於自己戰場上沒有『遺留的電擊』，因此召喚1個『遺留的電擊』到戰場上。接著，結算第2個『崇高的靂雷‧羅瑪洛尼雅』的{謝幕曲}能力時，由於自己戰場上已有『遺留的電擊』，因此不會召喚『遺留的電擊』，而是在自己戰場上的全部『遺留的電擊』上放置1個雷指示物。"
    origin: machine
    low_confidence: true
  - qa_id: qa:v1:1a1c63c31a35e4955b08152c88e12e01dab68f2353afe7435aad31a017956dcd
