    text: "不會。『安朵美達』不會受到能力傷害，但『蛋蛋先生』會受到能力傷害。\n『安朵美達』的{入場曲}能力，是在使用這個能力時，讓自己戰場上的全部從者具有「不會受到能力傷害」的能力。將『安朵美達』召喚到戰場上後，再將『蛋蛋先生』召喚到戰場上時，該『蛋蛋先生』不具有「不會受到能力傷害」。\n將『蛋蛋先生』召喚到戰場上後，再將『安朵美達』召喚到戰場上並適用入場曲能力的效果時，該『蛋蛋先生』與『安朵美達』都具有「不會受到能力傷害」。"
