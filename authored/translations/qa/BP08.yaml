    text: 敵方戰場上有1個『不死鬥士‧莫迪凱』的情況下，自己使用『奈芙蒂斯』，並以『奈芙蒂斯』的{入場曲}能力召喚『冥守戰士‧卡穆拉』與『仁義惡魔‧夕月』到戰場上，將其破壞。以自己的『冥守戰士‧卡穆拉』的{謝幕曲}能力破壞敵方的『不死鬥士‧莫迪凱』時，可以用『仁義惡魔‧夕月』的{入場曲}能力，將以『不死鬥士‧莫迪凱』的{謝幕曲}能力進入戰場的『不死鬥士‧莫迪凱』放置到墓場嗎？
    origin: machine
    low_confidence: true
