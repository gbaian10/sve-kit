    text: "不會。不會觸發。\n『真實的戒律』的「『真實絕傑‧萊歐』進入自己戰場時，使墓場中的這張卡片消失：自己的EP+1。」能力，是在『真實的戒律』位於墓場的情況下，『真實絕傑‧萊歐』進入自己戰場時觸發的能力。藉由『真實絕傑‧萊歐』的{入場曲}能力，捨棄手牌中的『真實的戒律』時，由於在『真實絕傑‧萊歐』進入自己戰場時，『真實的戒律』仍在手牌中，因此不會觸發。"
    origin: machine
    low_confidence: true
