    field: answer
    source_hash: sha256:ef435ebcde0ebcc04003f769e10203e940c6e377933d164692f1a4d53d1de61b
    lang: zh-Hant
    text: "不行。無法放置到墓場。\n以下詳細說明。\n首先，因『奈芙蒂斯』的{入場曲}能力而觸發並進入待機狀態的能力，可以以任意順序結算。先結算『冥守戰士‧卡穆拉』的{謝幕曲}能力，破壞敵方戰場上的『不死鬥士‧莫迪凱』時，『不死鬥士‧莫迪凱』的{謝幕曲}能力觸發並進入待機狀態。由於處於待機狀態的自動能力由回合玩家先結算，因此自己必須在敵方結算『不死鬥士‧莫迪凱』的{謝幕曲}能力前，結算『仁義惡魔‧夕月』的{入場曲}能力。這個時點，敵方戰場上沒有『不死鬥士‧莫迪凱』，因此無法以『仁義惡魔‧夕月』的{入場曲}能力將其放置到墓場。在『仁義惡魔‧夕月』的{入場曲}能力處理結束後，敵方才結算『不死鬥士‧莫迪凱』的{謝幕曲}能力。"
    origin: machine
    low_confidence: true
  - qa_id: qa:v1:26b58df73a1256e2bff7134ac29367b74ac775ac525727f62dcbf0b07d935027
    field: question
    source_hash: sha256:674ac6557db03fd668753cb45ae09c8e981e97c798bdb7179aa74fd3c2cfbc4a
