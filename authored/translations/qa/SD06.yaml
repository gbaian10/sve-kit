    text: 自己戰場上有這個從者與『夢想的白兔』，使用『夢想的白兔』的「{起動}{消費10}將這張卡片{橫置}並放置到墓場：使全部從者消失。」時，雖然這個從者會消失，但這個從者的「自己的護符離開戰場時，給予敵方的全部主戰者與敵方的全部從者2點傷害。」能力會觸發嗎？
    origin: machine
    low_confidence: true
  - qa_id: qa:v1:6e8e45181b6fc3640850cccc2a9244eeb41218937aaf95bcaaaa098619039275
