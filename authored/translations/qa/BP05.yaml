    text: "不會。敵方不會贏得對戰。\n詳細處理順序如下。\n『森林深處的異種』的攻擊使自己的主戰者的生命值變為0以下時，由於給予了主戰者攻擊傷害，因此『森林深處的異種』的能力會觸發；由於自己的主戰者的生命值變為0以下，因此『古老的守護者』的能力也會觸發。也就是兩者的能力都會觸發。包含自己與敵方的複數能力觸發並處於待機狀態時，會優先結算回合玩家處於待機狀態的能力。也就是說，在『古老的守護者』仍在自己戰場上的狀態下，先結算『森林深處的異種』的能力。\n結算時，敵方的『森林深處的異種』的「自己贏得本場對戰。」效果與自己的『古老的守護者』的「自己不會在對戰中敗北，敵方無法贏得對戰。」效果同時適用，優先適用作為禁止效果的「自己不會在對戰中敗北，敵方無法贏得對戰。」。也就是說，在此處理中，敵方不會贏得對戰，能力的結算隨即結束。\n之後，結算非回合玩家處於待機狀態的『古老的守護者』的能力。自己的主戰者的生命值變為1，『古老的守護者』被放置到墓場。"
