    text: "不會。自己不會在對戰中敗北。\n詳細處理順序如下。\n敵方的結束階段到來時，敵方戰場上的2個『龍女巫的儀式』的能力會分別觸發。\n結算觸發並處於待機狀態的第1個『龍女巫的儀式』的能力。給予自己的主戰者2點傷害，使自己的主戰者的生命值變為0。此時，『古老的守護者』的能力會觸發並處於待機狀態。這時，敵方的第2個『龍女巫的儀式』的能力與自己的『古老的守護者』的能力，共2個能力已觸發並處於待機狀態。\n包含自己與敵方的複數能力觸發並處於待機狀態時，會優先結算回合玩家處於待機狀態的能力，因此先結算敵方的第2個『龍女巫的儀式』的能力。給予自己的主戰者2點傷害，使自己的主戰者的生命值變為-2。\n之後，結算非回合玩家處於待機狀態的『古老的守護者』的能力。自己的主戰者的生命值變為1，『古老的守護者』被放置到墓場。"
