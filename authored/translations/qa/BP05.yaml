    text: "這是因為進行『神弓座天使‧莉莉耶爾』的破壞處理的時點不同。也可以說，是因為『神弓座天使‧莉莉耶爾』的能力有效期間不同。\n以下為詳細說明。\n首先，結算能力時，會依照記載順序執行能力所示的效果。\n以『殞命之舞』為例。首先，生命值變為0以下的從者，其破壞處理會在檢查時點的規則處理中進行。這個檢查時點會在某個能力結算後，也就是『殞命之舞』的能力的全部處理完成後到來。因此，在『殞命之舞』給予主戰者2點傷害的時點，雖然『神弓座天使‧莉莉耶爾』因『殞命之舞』的5點傷害而使生命值為0以下，但仍在戰場上。也就是說，由於『神弓座天使‧莉莉耶爾』的能力有效，因此不會給予主戰者2點傷害。\n再以已滿足【魔力連鎖 10】條件的『火炎粉碎術』為例。由於依照記載順序執行『火炎粉碎術』的能力所示的效果，因此在適用「將其破壞。」的時點就會破壞『神弓座天使‧莉莉耶爾』。也就是說，在『火炎粉碎術』給予主戰者3點傷害的時點，『神弓座天使‧莉莉耶爾』已不在戰場上。也就是說，由於『神弓座天使‧莉莉耶爾』的能力並未生效，因此會給予主戰者3點傷害。"
    origin: machine
    low_confidence: true
