    text: "不會。自己不會在對戰中敗北，遊戲會繼續進行。\n敵方的『森林深處的異種』的「自己贏得本場對戰。」效果，與自己的『古老的守護者』的「自己不會在對戰中敗北，敵方無法贏得對戰。」效果同時適用時，優先適用作為禁止效果的「自己不會在對戰中敗北，敵方無法贏得對戰。」。\n某張卡片的效果指示玩家進行某種動作，而同時有禁止該動作的效果時，一律優先適用禁止的效果。"
    origin: machine
