    field: answer
    source_hash: sha256:c653dd0d4a850c01c530f5842b74009a985a9c58f373244e66cceb830ceb0e6e
    lang: zh-Hant
    text: "可以支付8PP來使用起動能力。選擇敵方的墓場中的1張卡片，由自己將該卡片的消費變為0並使用。\n若選擇並使用從者，則將該從者召喚到自己戰場上。若觸發入場曲能力等能力，則由自己使用。該從者移動到戰場以外的區域時，會移動到持有者的區域。\n選擇並使用護符的情況與選擇並使用從者相同。將該護符召喚到自己戰場上。若觸發入場曲能力等能力，則由自己使用。該護符移動到戰場以外的區域時，會移動到持有者的區域。\n如上所述，自己戰場上由敵方持有的卡片，其處理方式與補充包第3彈「FLAME OF LAEVATEINN / フレイム・オブ・レーヴァテイン」收錄的卡片「BP03-109『混沌天使』」藉由能力奪取的敵方從者相同。詳情請參閱對應的Q&A頁面。\n\n若選擇並使用法術，則由自己使用該法術並結算能力。結算後，將該法術放置到敵方的墓場（持有者的墓場）。"
    origin: machine
    low_confidence: true
