    text: "不會。自己會在對戰中勝利。\n自己的牌堆為0張時，使用『斯巴達克斯』的能力，會因「抽X張卡片。」而抽牌，導致自己在下一個檢查時點對戰敗北，但由於滿足「若自己的牌堆為1張以下，則自己在這場對戰中勝利。」的條件，因此在這個效果的處理中，自己就會在對戰中勝利。（在檢查時點的敗北處理之前就會勝利。）"
