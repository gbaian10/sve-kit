  - qa_id: qa:v1:3a08560836a3ceac2679b1647c829d681bf5979117d8d52d1774ee85d1f368d9
    field: answer
    source_hash: sha256:fc78eac42b58a7ffeb0662c7c520edc64d5aba8172db9396cb72d8c779b9679f
    lang: zh-Hant
    text: "依『滅劍燄龍‧防禦模式』所在戰場的玩家（敵方）的選擇，結果會是「不給予傷害」或「1點傷害」其中之一。\n\n同時適用多個增減給予或受到的傷害的效果時，由受到影響的玩家選擇適用順序，適用效果。\n此時，受到傷害的從者是『滅劍燄龍‧防禦模式』，因此由敵方選擇適用順序。（由『滅劍燄龍‧防禦模式』的主人選擇適用順序。）\n可以以任意順序適用『洋蔥軍團兵』所適用的「給予的傷害+1」與『滅劍燄龍‧防禦模式』的「受到的傷害-1」。\n\n①依「受到的傷害-1」→「給予的傷害+1」順序適用時\n適用「受到的傷害-1」，使『洋蔥軍團兵』給予的傷害變為0點傷害。此時，給予0點傷害的動作完全不會進行，因此給予傷害這個動作本身不再存在。之後雖適用「給予的傷害+1」，但給予傷害這個動作本身已不存在，因此不會適用任何效果。所以最終為「不給予傷害」。\n\n②依「給予的傷害+1」→「受到的傷害-1」順序適用時\n適用「給予的傷害+1」，使『洋蔥軍團兵』給予的傷害變為2點傷害。之後，適用「受到的傷害-1」，使『洋蔥軍團兵』給予的傷害變為1點傷害。"
    origin: machine
    low_confidence: true
  - qa_id: qa:v1:3a08560836a3ceac2679b1647c829d681bf5979117d8d52d1774ee85d1f368d9
