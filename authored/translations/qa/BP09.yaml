    text: "是的。是永續能力。只要『白鬃聖猿（EVOLVE）』的攻擊力為4以上，該『白鬃聖猿（EVOLVE）』就具有【守護】。只要攻擊力為7以上，就另外具有【疾馳】。只要攻擊力為10以上，就另外可以無視【守護】進行攻擊。\n『白鬃聖猿（EVOLVE）』進入戰場後，其攻擊力從3以下變為4以上時，會具有【守護】；從6以下變為7以上時，會具有【疾馳】；從9以下變為10以上時，可以無視【守護】進行攻擊。\n『白鬃聖猿（EVOLVE）』進入戰場後，其攻擊力從10以上變為9以下時，會變得無法無視【守護】進行攻擊；從7以上變為6以下時，會失去【疾馳】；從4以上變為3以下時，會失去【守護】。"
