    source_hash: sha256:765bceb18f0bcb18516a93ea94e622b136184b75b267d8948476ce1d23a213e9
    lang: zh-Hant
    text: "不會。『斯巴達克斯』的能力全部處理後，才在檢查時點結算『光明之路』的能力，因此不會在對戰中勝利。\n\n詳細處理順序如下。\n①自己的結束階段到來時，『斯巴達克斯』的能力觸發並進入待機狀態。\n②在檢查時點結算『斯巴達克斯』的能力。\n③因『斯巴達克斯』的能力，捨棄自己的2張手牌。此時，『光明之路』的能力觸發並進入待機狀態。由於捨棄自己的2張手牌，抽3張卡片。此時自己的牌堆為2張，因此不會在對戰中勝利。\n④在檢查時點結算『光明之路』的能力。\n⑤因『光明之路』的能力，抽1張卡片。\n⑥此時自己的牌堆變為1張，但『斯巴達克斯』的能力處理已經結束，因此不會在對戰中勝利。"
    origin: machine
    low_confidence: true
