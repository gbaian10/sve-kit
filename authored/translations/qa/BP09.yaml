    text: "自己的EX區有4張卡片時，使用這個從者的{入場曲}能力，進行以下處理。\n\n①選擇從自己的牌堆找到2張土之印・護符時\n從找到的2張中，將任意1張放置到EX區。另1張不會從牌堆移動，將牌堆洗牌。\n\n②選擇從自己的牌堆找到1張土之印・護符時\n將找到的1張放置到EX區，將牌堆洗牌。\n\n無論哪種情況，都會因「本回合，使用其時，將消費變為0。」，使放置到EX區的土之印・護符在本回合可以用0消費使用。\n此外，也可以選擇1張都未找到，不將土之印・護符放置到EX區。"
