    source_hash: sha256:874324984b4a0c6354c6eb7909d18159c1cd4f30a828cdcb1410c6238404094b
    lang: zh-Hant
    text: "依自己的選擇，會是「2點傷害」或「1點傷害」其中一種。\n\n同時適用複數個增減給予傷害或受到傷害的效果時，由受影響的玩家選擇適用順序，並適用效果。\n此次受到傷害的是自己的『巨鎧牛頭人』，因此由自己選擇適用順序。\n\n①依「這張卡片受到的交戰傷害-2」→「只要這張卡片在戰場上，自己戰場上的從者受到的4點以上的傷害就變為3點」順序適用時\n適用「這張卡片受到的交戰傷害-2」後，『巨鎧牛頭人』受到的傷害變為2點。此時，由於受到的傷害已變為3點以下，不會適用「只要這張卡片在戰場上，自己戰場上的從者受到的4點以上的傷害就變為3點」。因此，最終受到的傷害為2點。\n\n②依「只要這張卡片在戰場上，自己戰場上的從者受到的4點以上的傷害就變為3點」→「這張卡片受到的交戰傷害-2」順序適用時\n適用「只要這張卡片在戰場上，自己戰場上的從者受到的4點以上的傷害就變為3點」後，『巨鎧牛頭人』受到的傷害變為3點。之後適用「這張卡片受到的交戰傷害-2」，最終受到的傷害變為1點。"
    origin: machine
    low_confidence: true
