    lang: zh-Hant
    text: "【土之秘術 2】是卡片或能力具有的關鍵字能力。\n使用具有【土之秘術 2】的卡片或能力時，可以移除自己戰場上的2個蓄積指示物作為追加消費，藉此發揮追加效果。\n若支付追加消費後，該護符變為沒有蓄積指示物的狀態，則將該護符放置到墓場。\n另外，即使自己戰場上有蓄積指示物，也不一定要支付追加消費。"
