    source_hash: sha256:ce7843e673ecc60777b4d0d2a18268e10f019fbb57e7f1f1481fe6acd61bff2d
    lang: zh-Hant
    text: "依自己的選擇，會是「不受到傷害」或「1點傷害」其中一種。\n\n同時適用複數個增減給予傷害或受到傷害的效果時，由受影響的玩家選擇適用順序，並適用效果。\n此次受到傷害的是自己的主戰者，因此由自己選擇適用順序。\n可以依任意順序，適用『一尾狐』上適用的「給予的傷害+1」與『《節制》‧盧澤』的「只要這張卡片在戰場上，自己的主戰者受到的傷害就-1。」。\n\n①依「受到的傷害-1」→「給予的傷害+1」順序適用時\n適用「受到的傷害-1」後，『一尾狐』給予的傷害變為0點傷害。此時，給予0點傷害的行動完全不會進行，因此給予傷害這項行動本身便不再存在。之後雖然適用「給予的傷害+1」，但由於給予傷害的行動本身已不存在，因此不會適用任何效果。所以，最終結果為「不給予傷害」。\n\n②依「給予的傷害+1」→「受到的傷害-1」順序適用時\n適用「給予的傷害+1」後，『一尾狐』給予的傷害變為2點傷害。之後適用「受到的傷害-1」，『一尾狐』給予的傷害變為1點傷害。"
    origin: machine
    low_confidence: true
