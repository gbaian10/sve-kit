    text: "不行。無法給予『斷罪者‧希爾薇婭』6點傷害。\n『斷罪者‧希爾薇婭』進入敵方的戰場時，『斷罪者‧希爾薇婭』的{入場曲}能力與『神祕的遺物‧絲碧涅與璐契兒』的能力會同時觸發，變為待機狀態。\n待機狀態的自動能力從回合玩家開始結算，因此會先結算『斷罪者‧希爾薇婭』的{入場曲}能力，自己戰場上的『神祕的遺物‧絲碧涅與璐契兒』會被破壞。之後結算『神祕的遺物‧絲碧涅與璐契兒』的能力，但由於『神祕的遺物‧絲碧涅與璐契兒』已被放置到墓場，無法支付「將這張卡片{橫置}」的消費，因此無法給予『斷罪者‧希爾薇婭』6點傷害。"
    origin: machine
    low_confidence: true
