    text: "自己戰場上的『永恆巨鯨』會移動到敵方（所有者）的墓場，給予敵方的全部主戰者2點傷害，再由自己選擇將『永恆巨鯨』放置到敵方（所有者）牌堆從上數來第2張的位置或牌堆底。（移動卡片時請雙方玩家互相協助。）\n\n以下為詳細說明。\n①自己戰場上的（主人為自己的）『永恆巨鯨』被破壞，移動到敵方（所有者）的墓場。\n②{謝幕曲}能力觸發，由自己使用該能力。\n③結算能力並適用效果。給予敵方的全部主戰者2點傷害。\n④由自己選擇「牌堆從上數來第2張的位置」或「牌堆底」，並移動『永恆巨鯨』。此時，作為移動目的地的「牌堆」並未特別指定所屬玩家，因此會移動到所有者的區域。"
    origin: machine
    low_confidence: true
