  - qa_id: qa:v1:2103ff74030ebe622d4325258af76ea94c340dece9911feb527e5d407773b804
    field: answer
    source_hash: sha256:8ee1145c4092a4d92dd7c8ae17dfbc22351d762e6a8cc54abcb763bd1ef320fe
    lang: zh-Hant
    text: "該情況下，後續處理如下。\n可以依任意順序結算已觸發並處於待機狀態的『屍術王‧科里內路司』的【超進化時】能力與『帝拳‧荷洛穆』的{入場曲}能力。\n以下說明先結算『屍術王‧科里內路司』的【超進化時】能力的處理方式。擲骰子3次。假設擲出的點數為「4→1→2」。\n此時，已觸發並處於待機狀態的能力有以下4個。\n・『帝拳‧荷洛穆』的{入場曲}能力\n・對應擲出點數4、給予敵方從者4點傷害的『帝拳‧荷洛穆』的能力\n・對應擲出點數1、給予敵方從者1點傷害的『帝拳‧荷洛穆』的能力\n・對應擲出點數2、給予敵方從者2點傷害的『帝拳‧荷洛穆』的能力\n接著，可以依任意順序結算這4個已觸發並處於待機狀態的能力。\n以下說明先結算『帝拳‧荷洛穆』的{入場曲}能力的處理方式。擲骰子。假設擲出的點數為3。\n此時，已觸發並處於待機狀態的能力有以下4個。\n・對應擲出點數4、給予敵方從者4點傷害的『帝拳‧荷洛穆』的能力\n・對應擲出點數1、給予敵方從者1點傷害的『帝拳‧荷洛穆』的能力\n・對應擲出點數2、給予敵方從者2點傷害的『帝拳‧荷洛穆』的能力\n・對應擲出點數3、給予敵方從者3點傷害的『帝拳‧荷洛穆』的能力\n可以依任意順序結算這些能力。\n\n可以先結算給予『嫩綠的新生‧卡詩黛兒』2點傷害的『帝拳‧荷洛穆』的能力。此時，在下一個檢查時點，生命值變為0以下的『嫩綠的新生‧卡詩黛兒』會被破壞，剩餘已觸發並處於待機狀態的能力可以依任意順序結算。\n先破壞『嫩綠的新生‧卡詩黛兒』後，「只要這張卡片在戰場上，自己戰場上的全部「與這張卡片同名者除外的學院・從者」與野獸・從者就不會受到能力傷害。」效果便不再適用，因此也可以給予此狀態下的『農作精靈（EVOLVE）』4點傷害。"
    origin: machine
    low_confidence: true
  - qa_id: qa:v1:2103ff74030ebe622d4325258af76ea94c340dece9911feb527e5d407773b804
    field: question
    source_hash: sha256:331c5a47ac92e202d74c40fbc5618f99665fe74e9ff4e9db2414dfe2f82c38cf
    lang: zh-Hant
    text: 自己戰場上有『屍術王‧科里內路司』，敵方戰場上有『嫩綠的新生‧卡詩黛兒』與『農作精靈（EVOLVE）』的情況下，『屍術王‧科里內路司』超進化。從觸發的能力中先結算【進化時】能力，將自己的墓場中的『帝拳‧荷洛穆』召喚到戰場上。之後會如何處理？此外，若先結算「【超進化時】重複下列內容3次。擲骰子。」，擲出的點數依序為「4→1→2」，則可以藉由『帝拳‧荷洛穆』的能力，先給予『嫩綠的新生‧卡詩黛兒』2點傷害並將其破壞後，再給予『農作精靈（EVOLVE）』4點傷害嗎？
