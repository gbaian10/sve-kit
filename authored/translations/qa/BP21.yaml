    text: "是指在自己戰場上的1個具有【蓄積】的護符上，放置1個蓄積指示物。\n若自己戰場上沒有具有【蓄積】的卡片，則召喚1個放置有1個蓄積指示物的『大地之魔片』到戰場上。\n※自2026年7月31日起，蓄積相關規則有所變更，戰場上沒有具有【蓄積】能力的卡片時，會將『大地之魔片』召喚到戰場上。"
