    lang: zh-Hant
    text: "是的。會支付+X部分的PP消費。\n同時適用將消費置換為特定數值的效果與增減消費的效果時，會先適用將消費置換為特定數值的能力。\n適用「消費變為0」後，才適用「消費+X」。"
