  - qa_id: qa:v1:15830e934dce9a4c6d2f501992f3f1fdd74c30a6414690420be6f70c4a897167
    field: answer
    source_hash: sha256:66b48bd847e7c6fc84d266adf1ccdd5a6e80fc700f1335be2826fe848e35a236
    lang: zh-Hant
    text: "不是。是指該回合被給予的每次4點以上的傷害，都會變為3點傷害。\n以下為例子。\n・若受到2次4點以上的傷害，則受到2次3點傷害。\n・若分別受到4點傷害與2點傷害，則受到3點傷害與2點傷害。"
    origin: machine
    low_confidence: true
  - qa_id: qa:v1:15830e934dce9a4c6d2f501992f3f1fdd74c30a6414690420be6f70c4a897167
    field: question
    source_hash: sha256:848a7a0f9f4e410b3645b3b7683c6f74988de06b1331f0702cf2a4376118cd16
    lang: zh-Hant
    text: 「這張卡片受到的4點以上的傷害變為3點。」能力，是指該回合不會累計受到4點以上的傷害，而是受到的傷害變為3點嗎？（是指該回合累計不會受到4點以上的傷害嗎？）
    origin: machine
    low_confidence: true
  - qa_id: qa:v1:169ebbc6bc330c1b9d80a6d2cb270cb02cdeb1191f2772b41c2e4f76a89d659e
    field: answer
    source_hash: sha256:36d400a7893b040d4e8eeb7a15ad8c0dd44cbdf2d19fcaba82a13a3188940342
    lang: zh-Hant
    text: 【攻擊時】能力觸發並結算的時點在先。結算完【攻擊時】能力等全部在從者攻擊時觸發的能力後，才會迎來非回合玩家的Quick時點。
    origin: machine
    low_confidence: true
