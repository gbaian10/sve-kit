    lang: zh-Hant
    text: 除了敵方戰場上的從者，也會給予自己戰場上的從者7點傷害嗎？
    origin: machine
    low_confidence: true
  - qa_id: qa:v1:0aac6fcf1a31ba73d3b7e3a1e9fd1875576194e206428cc258ef0616cb5bb0eb
    field: answer
    source_hash: sha256:e582e10406b65115050cb265127389d005db600cad0daf792046ea41a56ad928
    lang: zh-Hant
    text: "不行。無法使自己的PP回復2點。\n『安娜斯塔西婭』的能力參照的是該回合中使用的卡片張數，並非從『安娜斯塔西婭』進入戰場之後開始計算。\n自己的回合中，作為該回合的第3張或之後的卡片使用『安娜斯塔西婭』時，由於該回合已使用3張卡片，即使之後包含『安娜斯塔西婭』本身在內使用了3張卡片，也無法藉由『安娜斯塔西婭』的「自己的回合中，自己使用卡片時，若為本回合中的第3張卡片，則～」能力，使自己的PP回復2點。"
    origin: machine
    low_confidence: true
  - qa_id: qa:v1:0aac6fcf1a31ba73d3b7e3a1e9fd1875576194e206428cc258ef0616cb5bb0eb
    field: question
    source_hash: sha256:5caa144a2987de9c13ff3e0dea9755458d08fe83cacc0eeb0f9f594e7f754554
    lang: zh-Hant
    text: 自己的回合中，作為該回合的第3張或之後的卡片使用『安娜斯塔西婭』，之後包含『安娜斯塔西婭』本身在內使用3張卡片時，可以藉由『安娜斯塔西婭』的「自己的回合中，自己使用卡片時，若為本回合中的第3張卡片，則～」能力，使自己的PP回復2點嗎？
    origin: machine
