    text: 若適用『一之瀨志希（EVOLVE）』或『荒木比奈（EVOLVE）』等卡片具有的「使用時，消費變為0。」或「將消費變為0並使用」效果來使用『沸騰吧感情』，實際支付的消費是+X部分的PP消費嗎？
