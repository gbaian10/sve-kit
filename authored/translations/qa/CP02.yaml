    lang: zh-Hant
    text: 是的。自己的回合中，作為該回合的第5張卡片，以自己戰場上的『安娜斯塔西婭』為目標使用『大自然的導引』，即使使『安娜斯塔西婭』返回手牌，也可以藉由使用『大自然的導引』時觸發的『安娜斯塔西婭』的「自己的回合中，自己使用卡片時，～」能力，使自己戰場上的『妖精』攻擊力與生命值+1。
    origin: machine
    low_confidence: true
