  - qa_id: qa:v1:063a5afdb5aaa907b439a22f371e5e61953ef0c7b02b03f8e21bb2f47fb13771
    field: answer
    source_hash: sha256:4eb2e664024e82d87af8a947fc6343f58edbd255a5e1574fe0c4a754aabbe382
    lang: zh-Hant
    text: "不會。既不滿足【真紅】狀態，也不滿足「本回合中自己的主戰者生命值曾減少」。\n【真紅】狀態是指目前為自己的回合，且在這個自己的回合中，自己的主戰者生命值曾減少的狀態。"
    origin: machine
    low_confidence: true
  - qa_id: qa:v1:063a5afdb5aaa907b439a22f371e5e61953ef0c7b02b03f8e21bb2f47fb13771
