    text: "是的。可以作為法術使用。\n可以支付4PP來使用，使自己的主戰者的{生命值}+1，並抽1張卡片。法術結算後，將這張卡片放置到墓場，但由於其是Token，在放置到墓場後會立即從墓場消除。"
