    source_hash: sha256:16ec86f762ab2cb36313a2380a8d960ec870a7ec0ccd1a9960266eaecad5f846
    lang: zh-Hant
    text: 自己戰場上有這個從者，適用「給予自己的主戰者1點傷害。」這類給予自己的主戰者傷害的效果時，由於這個從者的能力使其不受到能力傷害，自己的主戰者不會受到傷害，此時會滿足【真紅】狀態或「本回合中自己的主戰者生命值曾減少」嗎？
