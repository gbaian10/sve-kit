    text: 是的。自己的回合中，作為該回合的第4張卡片使用『安娜斯塔西婭』，之後使用1張『妖精』時，該『妖精』是該回合的第5張卡片，因此可以藉由『安娜斯塔西婭』的「自己的回合中，自己使用卡片時，～」能力，使自己戰場上的全部從者攻擊力與生命值+1。
