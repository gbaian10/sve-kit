    lang: zh-Hant
    text: 自己戰場上的2張以上『那塔拉的大樹』因某種原因同時離開戰場，因第1張結算的『那塔拉的大樹』的能力而捨棄『光明之路』。此時，第2張以後的『那塔拉的大樹』的能力與被捨棄的『光明之路』的能力，可以以什麼順序結算？
