    source_hash: sha256:4ae1239ec34282fea68e233b94aa42b0189b41ed8dc1f021e98fcbcedd827bd6
    lang: zh-Hant
    text: "不會。不會計入1回合1次的次數。\n進化前的『哥布林』所具有的{進化}能力（可以進化的起動能力・「圓圈E」圖示），在1回合中只能使用1次。因其他能力而進化等情況，則沒有這項限制。"
