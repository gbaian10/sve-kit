  - qa_id: qa:v1:31ffac8c8f472dd05c70451d38e818c6ad5f1cdac571c1285da289f46eda5556
    field: answer
    source_hash: sha256:12525bed5ad5be09cfaeb75463cf15d712330677fac4884470ef06b2236dbec4
    lang: zh-Hant
    text: "將『大地之母』的所有者一方設為玩家A，將『篡奪絕傑‧歐克托莉斯（EVOLVE）』的操控者設為玩家B。\n玩家B支付{謝幕曲}能力的消費時，『大地之母』會進入玩家A的戰場，但無法進化，會消失。\n\n以下為詳細說明。\n①『大地之母』從戰場被放置到墓場時，會被放置到所有者玩家A的墓場。\n②由於『大地之母』從戰場被放置到墓場，因此{謝幕曲}能力觸發，由玩家B使用。\n③玩家B支付{謝幕曲}能力的消費，使玩家B戰場上或EX區中的『那塔拉的大樹』消失。（也可以選擇不支付消費。）\n④因「將這張卡片以橫置狀態召喚到戰場上」，『大地之母』會進入所有者玩家A的戰場。\n⑤處理「這張卡片進化」時，使用{謝幕曲}能力的是玩家B，但進入戰場的『大地之母』的操控者是玩家A，因此玩家B必須從玩家A的進化牌堆選擇『大地之母（EVOLVE）』並公開。然而，由於進化牌堆是非公開區域，玩家B無法確認玩家A的進化牌堆，無法選擇『大地之母（EVOLVE）』並公開，因此無法進化。\n⑥由於沒有進化，進入戰場的『大地之母』會消失。"
