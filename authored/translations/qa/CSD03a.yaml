  - qa_id: qa:v1:39fc59d6b72ae5c1c38b12d8db437c4f41a1bcfa3a5a02178044c04c057b1626
    field: answer
    source_hash: sha256:4ae1239ec34282fea68e233b94aa42b0189b41ed8dc1f021e98fcbcedd827bd6
    lang: zh-Hant
    text: "不會。不會計入1回合中1次的次數。\n如進化前的『哥布林』所具有的{進化}能力（可以進化的起動能力、「圓圈E」圖示），1回合中只能使用1次。因其他能力而進化等情況沒有這項限制。"
