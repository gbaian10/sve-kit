    text: 不會。即使在以【超進化時】能力給予戰場上的全部從者1點傷害的時點，『侮蔑的繼承者‧亞喬拉斐特（EVOLVE）』的生命值變為0，也會因接續的效果使生命值變為7，在之後到來的檢查時點，生命值並非0以下，因此不會進行從者的破壞處理，會留在戰場上。
