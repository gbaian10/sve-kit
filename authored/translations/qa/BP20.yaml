    source_hash: sha256:d1c485245447964f4e981990f5d6f1f6fd8460f9292c06e64bc9be7760d011d8
    lang: zh-Hant
    text: "不行。無法將『至高的凌駕』放置到EX區。詳細處理如下。\n結算『蛋蛋先生』的【進化時】能力。『絕大的顯現‧馬塞班恩』受到5點傷害，生命值變為0以下。捨棄自己的全部手牌，『至高的凌駕』的能力觸發並進入待機狀態。之後在檢查時點，將生命值變為0以下的『絕大的顯現‧馬塞班恩』放置到墓場。接著，結算處於待機狀態的『至高的凌駕』的能力。此時自己戰場上沒有『絕大的顯現‧馬塞班恩』，因此無法將『至高的凌駕』放置到EX區。"
    origin: machine
    low_confidence: true
