    lang: zh-Hant
    text: "依『永久之盾‧席翁』所在戰場的玩家（敵方）的選擇，結果會是「不給予傷害」或「2點傷害」其中之一。\n\n同時適用多個增減給予或受到的傷害的效果時，由受到影響的玩家選擇適用順序，適用效果。\n此時，由敵方的主戰者與敵方戰場上的『永久之盾‧席翁』受到傷害，因此由敵方選擇適用順序。（由『永久之盾‧席翁』的主人選擇適用順序。）\n可以以任意順序適用『篡奪的繼承者‧辛士萊茲』所適用的「這張卡片每有1個融合指示物，這張卡片給予的能力傷害就+2。」與『永久之盾‧席翁』的「只要這張卡片在戰場上，這張卡片與自己的主戰者受到的傷害-1。」。\n\n①依「受到的傷害-1」→「給予的傷害+2」順序適用時\n適用「受到的傷害-1」，使『篡奪的繼承者‧辛士萊茲』給予的傷害變為0點傷害。此時，給予0點傷害的動作完全不會進行，因此給予傷害這個動作本身不再存在。之後雖適用「給予的傷害+2」，但給予傷害這個動作本身已不存在，因此不會適用任何效果。所以最終為「不給予傷害」。\n\n②依「給予的傷害+2」→「受到的傷害-1」順序適用時\n適用「給予的傷害+2」，使『篡奪的繼承者‧辛士萊茲』給予的傷害變為3點傷害。之後，適用「受到的傷害-1」，使『篡奪的繼承者‧辛士萊茲』給予的傷害變為2點傷害。"
    origin: machine
    low_confidence: true
