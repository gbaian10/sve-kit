    lang: zh-Hant
    text: "3點傷害。\n\n同時適用多個增減給予或受到的傷害的效果時，由受到影響的玩家選擇適用順序，適用效果。\n此時，由敵方戰場上裝備『公主之劍』的從者受到傷害，因此由敵方選擇適用順序。\n適用『篡奪的繼承者‧辛士萊茲』所適用的「給予的傷害+2」與敵方戰場上裝備『公主之劍』的從者的「受到的傷害-2」，最終為3點傷害。"
    origin: machine
    low_confidence: true
