    text: "是的。是永續能力。只要自己的墓場中有20張以上的賽馬娘・卡片，『空中神宮』就具有【疾馳】與「【攻擊時】這張卡片{攻擊力}+3/{生命值}+3」。\n召喚『空中神宮』到戰場上後，若自己墓場中的賽馬娘・卡片從19張以下變為20張以上，就會具有【疾馳】與「【攻擊時】這張卡片{攻擊力}+3/{生命值}+3」。\n召喚『空中神宮』到戰場上後，若自己墓場中的賽馬娘・卡片從20張以上變為19張以下，就會失去【疾馳】與「【攻擊時】這張卡片{攻擊力}+3/{生命值}+3」。"
