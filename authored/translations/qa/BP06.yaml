  - qa_id: qa:v1:29351eaa2fb57024ad1bdd9b086d6cfe8ad68b5b917545a58303705ec7480cbb
    field: answer
    source_hash: sha256:180f984d576e669f263a86e5fe882f80868769ee2e74875b1cf7e0eccdc77535
    lang: zh-Hant
    text: "依敵方玩家的選擇，結果會是「4點傷害」或「5點傷害」其中之一。\n\n同時適用多個增減給予或受到的傷害的效果時，由受到影響的玩家選擇適用順序，適用效果。\n此時，由於是敵方的主戰者受到傷害，因此由敵方選擇適用順序。\n可以以任意順序適用攻擊力為6的『巨大妖狐‧吟雪（EVOLVE）』所適用的「給予的傷害+1」與敵方主戰者所適用的「將主戰者受到的5以上的傷害變為4」。\n\n①依「給予的傷害+1」→「將主戰者受到的5以上的傷害變為4」順序適用時\n適用「給予的傷害+1」，使攻擊力為6的『巨大妖狐‧吟雪（EVOLVE）』給予的傷害變為7點傷害。之後，適用「將主戰者受到的5以上的傷害變為4」，使『巨大妖狐‧吟雪（EVOLVE）』給予的傷害變為4點傷害。\n\n②依「將主戰者受到的5以上的傷害變為4」→「給予的傷害+1」順序適用時\n適用「將主戰者受到的5以上的傷害變為4」，使攻擊力為6的『巨大妖狐‧吟雪（EVOLVE）』給予的傷害變為4點傷害。之後，適用「給予的傷害+1」，使『巨大妖狐‧吟雪（EVOLVE）』給予的傷害變為5點傷害。"
    origin: machine
    low_confidence: true
  - qa_id: qa:v1:29351eaa2fb57024ad1bdd9b086d6cfe8ad68b5b917545a58303705ec7480cbb
