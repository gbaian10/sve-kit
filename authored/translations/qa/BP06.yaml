  - qa_id: qa:v1:759058e8de60674548e42c3973ba40bf5a18a45bc1c04c259f331b8850013c84
    field: answer
    source_hash: sha256:da265af34e51536105e7fc89ee36667341bcafb9e22b24d5da6a9c81245ac23a
    lang: zh-Hant
    text: "是只要『巔峰鬥技場』在戰場上，「包含自己與敵方在內的全部戰場上的從者，若可以攻擊從者，則無法攻擊主戰者」的能力。\n此外，可以選擇「不攻擊」。（這並非只要可以攻擊雙方戰場上的從者，就必須攻擊的能力。）\n具體例子如下。\n\n①自己戰場上有1個從者，敵方戰場上有1個橫置狀態的從者\n自己戰場上的從者可以攻擊敵方戰場上的從者，因此無法攻擊敵方的主戰者。\n②自己戰場上有1個從者，敵方戰場上有1個重置狀態的從者\n自己戰場上的從者無法攻擊敵方戰場上的從者，因此可以攻擊敵方的主戰者。\n③自己戰場上有1個具有【指定攻擊】的從者，敵方戰場上有1個重置狀態的從者\n自己戰場上具有【指定攻擊】的從者可以攻擊敵方戰場上的從者，因此無法攻擊敵方的主戰者。\n④自己戰場上有1個具有【指定攻擊】的從者，敵方戰場上有1個橫置狀態且具有【威懾】的從者\n自己戰場上的從者無法攻擊敵方戰場上的從者，因此可以攻擊敵方的主戰者。"
    origin: machine
    low_confidence: true
  - qa_id: qa:v1:759058e8de60674548e42c3973ba40bf5a18a45bc1c04c259f331b8850013c84
    field: question
    source_hash: sha256:3d681beaa7c33fab07184de3a5563c7c440d56e09bdfaebe9a78df11338085d5
    lang: zh-Hant
    text: 『巔峰鬥技場』的「只要這張卡片在戰場上，戰場上的全部從者若可以攻擊從者，則無法攻擊主戰者。」是怎樣的能力？
    origin: machine
    low_confidence: true
  - qa_id: qa:v1:79476c1dff7e8da5b5752e05ff5bff26d54052c577722e27888b9c843d7ff383
    field: answer
    source_hash: sha256:c18c367a39d9a3ae4b1524abe3cd24e255fc2c46780fffd7b6f584f6931016fe
    lang: zh-Hant
    text: "依『滅劍燄龍‧防禦模式』所在戰場的玩家（敵方）的選擇，結果會是「不給予傷害」或「1點傷害」其中之一。\n\n同時適用多個增減給予或受到的傷害的效果時，由受到影響的玩家選擇適用順序，適用效果。\n此時，受到傷害的從者是『滅劍燄龍‧防禦模式』，因此由敵方選擇適用順序。（由『滅劍燄龍‧防禦模式』的主人選擇適用順序。）\n可以以任意順序適用『一尾狐』所適用的「給予的傷害+1」與『滅劍燄龍‧防禦模式』的「受到的傷害-1」。\n\n①依「受到的傷害-1」→「給予的傷害+1」順序適用時\n適用「受到的傷害-1」，使『一尾狐』給予的傷害變為0點傷害。此時，給予0點傷害的動作完全不會進行，因此給予傷害這個動作本身不再存在。之後雖適用「給予的傷害+1」，但給予傷害這個動作本身已不存在，因此不會適用任何效果。所以最終為「不給予傷害」。\n\n②依「給予的傷害+1」→「受到的傷害-1」順序適用時\n適用「給予的傷害+1」，使『一尾狐』給予的傷害變為2點傷害。之後，適用「受到的傷害-1」，使『一尾狐』給予的傷害變為1點傷害。"
    origin: machine
    low_confidence: true
  - qa_id: qa:v1:79476c1dff7e8da5b5752e05ff5bff26d54052c577722e27888b9c843d7ff383
    field: question
