    text: "『巔峰鬥技場』的處理全部結算後，已觸發的各個{入場曲}能力從回合玩家一方開始結算。\n\n例：因『巔峰鬥技場』的{入場曲}能力，回合玩家一方的戰場上出現『巴哈姆特』（稱為「巴哈姆特A」），非回合玩家一方的戰場上出現『巴哈姆特』（稱為「巴哈姆特B」）時\n\n①結算『巔峰鬥技場』的{入場曲}能力。「巴哈姆特A」進入回合玩家一方的戰場。「巴哈姆特A」的{入場曲}能力觸發並進入待機狀態。「巴哈姆特B」進入非回合玩家一方的戰場。「巴哈姆特B」的{入場曲}能力觸發並進入待機狀態。\n②結算回合玩家一方處於待機狀態的「巴哈姆特A」的{入場曲}能力。破壞「巴哈姆特B」。\n③結算非回合玩家一方處於待機狀態的「巴哈姆特B」的{入場曲}能力。破壞「巴哈姆特A」。（此時「巴哈姆特B」在墓場中，但已觸發的{入場曲}能力會正常結算。）"
