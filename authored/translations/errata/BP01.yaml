    before: 選擇1個敵方從者。其玩家將其放置到牌堆頂或牌堆底。【連擊 5】改為全部敵方從者，而非選擇1個。（放置到牌堆的Token移出遊戲）
    after: 選擇1個敵方從者。其玩家將其放置到牌堆頂或牌堆底。【連擊 5】改為由其玩家將全部敵方從者放置到牌堆頂或牌堆底，而非將其放置到牌堆。（每1個分別決定放置到牌堆頂或牌堆底）（放置到牌堆的Token移出遊戲）
