hint:
  zh-TW: 依 Q964，「〜とき、…なら」的條件在結算時查；結算時不成立，這段效果全部不做（連後面的「1枚引く」也不做）。
  ja: Q964より、「～とき、…なら」の条件は解決時に確認します。解決時に満たしていなければ、以降の効果は何も行いません。
note: 誘發時查的部分已由 R-0009（2026-09-27）取代；本裁定現在只表示結算時查、不成立則到段落結尾都不做。
# 2026-09-27 R-0009 取代本裁定中「誘發時查」的部分（依 Q940、Q852、Q2418、Q1867）；本裁定只保留「結算時查、不成立整段不做」。
