id: R-0002
question: 長寫「〜とき、…なら」：誘發時條件成立、到結算時已不成立，要不要照做？
decision: '條件在結算時查（選項 A，經 R-0009 修正）：結算處理到該處時以本文 K.if 判斷，不成立則到段落結尾都不做。原本「誘發時也查一次（已裁定 #1，trigger_if）」的部分已由 R-0009 取代：長寫「〜とき、…なら」一律誘發，條件只在結算時查。'
evidence:
  - {ref: Q964, kind: direct, quote: "最終的に、自分のリーダーは体力+5し、1枚引きます。\n処理順は以下になります。\n\n①エンドフェイズが来たとき、それぞれの『高垣楓』の能力が誘発し、待機状態になります。\n②待機状態になったそれぞれの能力を順に解決します。\n③1つ目の『高垣楓』の能力を解決します。自分のリーダーの体力が5なので、自分のリーダーは体力+5し、1枚引きます。\n④2つ目の『高垣楓』の能力を解決します。自分のリーダーの体力が10なので、何も行いません。", question: 自分のリーダーの体力が5、自分の場に『高垣楓』が2体いる状況でエンドフェイズを迎えました。誘発したそれぞれの能力を解決する場合、どのようになりますか？, date: '2023-08-18'}
  - {ref: Q2354, kind: direct, quote: "いいえ。自分のデッキから『ドラゴスネーク』1枚を探し、場に出すことができません。\nこの場合、『ドラゴスネーク』の能力は誘発しますが、『ドラゴスネーク』の能力の解決時にこの『ドラゴスネーク』は自分の場にいないので、「これが自分の場にいるなら、」以降の効果を適用することができません。", question: 自分の場の体力が3の『ドラゴスネーク』が3ダメージを受けた場合、『ドラゴスネーク』の能力によって自分のデッキから『ドラゴスネーク』1枚を探し、場に出すことができますか？, date: '2025-11-17'}
  - {ref: Q2355, kind: direct, quote: "いいえ。自分のデッキから『ドラゴスネーク』1枚を探し、場に出すことができません。\n『簒奪の蛇剣』によって3ダメージと2ダメージを受けており『ドラゴスネーク』の能力は2回誘発しますが、『ドラゴスネーク』の能力の解決時にこの『ドラゴスネーク』は自分の場にいないので、「これが自分の場にいるなら、」以降の効果を適用することができません。", question: "自分の墓場が10枚以上で、相手がプレイする『簒奪の蛇剣』が3ダメージ与えた後に追加で2ダメージ与える状況です。\nこの状況で、自分の場の体力が5の『ドラゴスネーク』に対して『簒奪の蛇剣』を相手がプレイした場合、『ドラゴスネーク』の能力によって自分のデッキから『ドラゴスネーク』1枚を探し、場に出すことができますか？", date: '2025-11-17'}
  - {ref: Q302, kind: supporting, quote: いいえ。手札の上限枚数となるようにカードを捨てる行為は、「自分のエンドフェイズが来たとき～」の誘発のタイミングよりも後に行うため、条件を満たすことはできず、プレイしません。, question: 自分のエンドフェイズに手札の上限枚数となるようにカードを捨てたとき、このアミュレットの「自分のエンドフェイズが来たとき～」の能力はプレイしますか？, date: '2022-06-24'}
