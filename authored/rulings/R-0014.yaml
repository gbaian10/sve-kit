id: R-0014
question: 依存與 CR 10.9.1.6 都無法決定先後、發生時點（timestamp）又相同的多個持續效果，要照什麼順序套用？
decision: 回合玩家控制的效果先，同一玩家的效果由該玩家自選順序；選定的順序保存下來，之後重算沿用、不再詢問。有效效果集合改變時，只對尚未定序的部分續補，保留既有相對順序。
evidence:
  - {ref: CR 10.9.1.6, kind: supporting, quote: "10.9.1.6. 以上の 10.9.1.2 -10.9.1.5 で適用順の前後\nが決定されない複数の継続効果が存在する\n場合、それらの継続効果は、効果が発生した\n順に従って順番に適用します。", version: 1.27.0, note: 沒有規定發生順序相同時的處理}
  - {ref: CR 1.3.4.1, kind: supporting, quote: "1.3.4.1. ある効果が複数のプレイヤーに適用され、\nその効果が一連の複数の処理の実行を求め\nる場合、その各処理のうち選択を伴わない処\n理は同時に実行し、選択を伴う処理はターン\nプレイヤーから実行します。", version: 1.27.0, note: 只作「回合玩家先」精神的類推依據}
  - {ref: project, kind: project, reason: 同 timestamp 沒有直接條文或 Q&A；以 CR 1.3.4.1 類推並保存順序，避免每次讀值重新詢問。, date: '2026-09-27'}
strength: inferred
decided_by: {who: agents, date: 2026-09-27}
applies_to: [L.continuous, D.rule-choice]
hint:
  zh-TW: 本專案解讀：同時產生的持續效果，先套用回合玩家的效果；同一玩家的效果由該玩家決定順序，之後沿用這個順序。
  ja: 本プロジェクトの解釈：同時に発生した継続効果は、ターンプレイヤーの効果から適用します。同じプレイヤーの効果はそのプレイヤーが順番を決め、以後もその順番を使います。
