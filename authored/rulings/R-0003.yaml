id: R-0003
question: 「【攻撃時】Xなら、Y」的條件是誘發條件（不成立就不誘發），還是本文條件（結算時判）？
decision: '本文條件（選項 A）：攻擊一定誘發、能力一定打出，條件在結算時判，不成立就不做；與 {ファンファーレ}、【進化時】相同。已裁定 #1 只適用於長寫自動能力，不適用於關鍵字誘發。'
evidence:
  - {ref: Q2531, kind: direct, quote: はい。プレイすることができます。また《UB》能力が発動したことを満たします。, question: このフォロワーが相手のリーダーに攻撃した場合、このフォロワーの《UB》【攻撃時】能力をプレイすることができますか？また《UB》能力が発動したことを満たしますか？, date: '2026-01-26'}
  - {ref: Q1101, kind: supporting, quote: "はい。満たします。\nまず、『ネフティス』の《ファンファーレ》能力の解決を行い、その後、誘発して待機状態になった能力を解決します。『沈黙の絶傑・ルルナイ』の《ファンファーレ》能力を解決するタイミングで自分の墓場が10枚以上あるため、【ネクロチャージ_10】の条件を満たすことができます。", question: 自分の墓場が6枚の状況で、『ネフティス』の《ファンファーレ》能力によって、『沈黙の絶傑・ルルナイ』を含む4体を場に出して破壊した場合、『沈黙の絶傑・ルルナイ』の《ファンファーレ》能力にある【ネクロチャージ_10】の条件を満たしますか？, date: '2023-12-15'}
  - {ref: Q1102, kind: supporting, quote: "はい。満たします。\n『ネフティス』の《ファンファーレ》能力によって、誘発して待機状態になった能力は任意の順番で解決することができます。『デュエリスト・モルディカイ』の《ラストワード》能力を先に解決し、自分のリーダーの体力を-3することで、『ハウリングデーモン』の《ファンファーレ》能力を解決するタイミングで【真紅】状態になっているため、「【真紅】状態なら、」の条件を満たすことができます。", question: 『ネフティス』の《ファンファーレ》能力によって、『ハウリングデーモン』と『デュエリスト・モルディカイ』を場に出して破壊しました。『デュエリスト・モルディカイ』の《ラストワード》能力を先に解決し、コストとして自分のリーダーの体力を-3した場合、『ハウリングデーモン』の《ファンファーレ》能力にある「【真紅】状態なら、」の条件を満たしますか？, date: '2023-12-15'}
  - {ref: Q1353, kind: supporting, quote: "いいえ。できません。\n『《世界》・ゼルガネイア』の《ファンファーレ》能力によって、『ラビットネクロマンサー』を破壊した際、『ラビットネクロマンサー』の《ラストワード》能力が誘発し待機状態になりますが、待機状態の自動能力はターンプレイヤーから解決するため、先に「《ファンファーレ》自分のリーダーの体力が10以下なら、自分のリーダーは《体力》+5する。」を解決します。この時点で自分のリーダーの体力は11なので、体力を+5することはできず、この能力の解決後に『ラビットネクロマンサー』の《ラストワード》能力によって自分のリーダーの体力が9になります。\n\nまた、何らかの能力によって相手のターン中に自分の場に『《世界》・ゼルガネイア』が出て《ファンファーレ》能力によって『ラビットネクロマンサー』を破壊した場合、「《ファンファーレ》自分のリーダーの体力が10以下なら、自分のリーダーは《体力》+5する。」より先に『ラビットネクロマンサー』の《ラストワード》能力を解決するため、自分のリーダーの体力を+5することができます。", question: "自分のリーダの体力が11で、自分の場のフォロワーが0体、相手の場のフォロワーが『ラビットネクロマンサー』1体のみの状況です。\n自分のターン中に、『《世界》・ゼルガネイア』をプレイし、「《ファンファーレ》相手の場のフォロワー1体を選ぶ。自分の場に他のフォロワーがいないなら、それを破壊する。1枚引く。」から解決して『ラビットネクロマンサー』を破壊した場合、『ラビットネクロマンサー』の《ラストワード》能力で、自分のリーダーの体力が9になった後に「《ファンファーレ》自分のリーダーの体力が10以下なら、自分のリーダーは《体力》+5する。」によって、自分のリーダーの体力を+5することができますか？", date: '2024-04-15'}
  - {ref: CR 12.7.2, kind: supporting, quote: "12.7.2. ‘【攻撃時】（テキスト）’は、‘このフォロワーが攻撃\nしたとき、（テキスト）’を意味します。", version: 1.27.0}
  - {ref: CR 12.4.3, kind: supporting, quote: "12.4.3. ‘ファンファーレ （テキスト）’は、‘このカードを場\n以外から場に置いたとき、（テキスト）’を意味しま\nす。", version: 1.27.0}
strength: official
decided_by: {who: user, date: 2026-09-27}
applies_to: [T0eda7bbc4c, T8dba09d157, T29a2617cd4, Taec5f7452e, Tf05b906ae3, T50d7e70ddd, T8bf49c125d, T95c472c471, T474d229c66, T044753d805]
hint:
  zh-TW: 依 Q2531，【攻撃時】後面的條件在結算時判；條件不成立，能力照樣打出（也算《UB》能力發動），只是不做效果。
  ja: Q2531より、【攻撃時】に続く条件は解決時に確認します。満たさなくても能力はプレイされ（《UB》能力の発動も満たします）、効果が適用されないだけです。
# T044753d805（{UB}【進化時】本文中段的歷史條件）依同一原則套用。
