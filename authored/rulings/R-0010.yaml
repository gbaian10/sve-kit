id: R-0010
question: BP14-046「このターン、次に自分が「これによってEXエリアに置いたカード」をプレイする際、コストを0にする。」的免費是這批每張各一次，還是玩家共用一次？
decision: 玩家共用一次：安裝時捕捉這次實際放到 EX 的新物件集合，整組共用玩家層一個使用額度；本回合第一張符合的卡打出後即耗盡，之後的卡回到正常費用。
evidence:
  - {ref: BP14-046, kind: supporting, quote: 自分のデッキの上1枚をEXエリアに置く。これをEXエリアが上限になるまでくり返す。このターン、次に自分が「これによってEXエリアに置いたカード」をプレイする際、コストを0にする。, date: '2025-02-14'}
  - {ref: CP04-003, kind: supporting, quote: このターン、次に自分がプリコネ・カードをプレイする際、コストを-2する。, date: '2026-01-30', note: 同句型「次に自分が…をプレイする際」：玩家層的下一次打出，不是逐卡各一次}
  - {ref: project, kind: project, reason: 依日文語法與 CP04-003 同句型推論；沒有直接 Q&A。, date: '2026-09-27'}
strength: inferred
decided_on: 2026-09-27
applies_to: [T7e52650e64]
hint:
  zh-TW: 本專案解讀：這張卡放到 EX 的卡共用一次免費，不是每張各一次；本回合打出第一張後，其餘照原費用。
  ja: 本プロジェクトの解釈：これによってEXエリアに置いたカードは、まとめて1回だけコストが0になります。1枚ずつではありません。このターン最初にプレイした1枚で使い切り、残りは通常のコストです。
