id: R-0015
question: BP20-P65「代わりに好きな数チョイスする」可以選 0 個選項嗎？
decision: 可以：選項數的範圍改為 0 到可用選項數；選 0 時該整段指示不執行。不套用「Nつまで」至少選 1 的下限。
evidence:
  - {ref: BP20-P65, kind: supporting, quote: 自分は1つ以上の選択肢をチョイスする際、代わりに好きな数チョイスする。, date: '2026-05-22'}
  - {ref: CR 1.3.5, kind: supporting, quote: "1.3.5. プレイヤーがカードやルールによりなんらかの数を\n選ぶ場合、特に指定がない限り、0 以上の整数を選\nぶ必要があります。1 未満の端数を含む数や負の\n数は選べません。", version: 1.27.0}
  - {ref: CR 5.18.2.2, kind: supporting, quote: "5.18.2.2. チョイスの個数が 0 である場合、その一連\nの指示はまったく実行しません。", version: 1.27.0}
  - {ref: project, kind: project, reason: 依 CR 1.3.5 與 5.18.2.2 推論；沒有這張卡的直接 Q&A，也查無反證 Q&A。, date: '2026-09-27'}
strength: inferred
decided_by: {who: agents, date: 2026-09-27}
applies_to: [Tf9545f43d1]
hint:
  zh-TW: 本專案解讀：這裡的「好きな数」可以選 0 個；選 0 個時，這段チョイス整段不執行。
  ja: 本プロジェクトの解釈：ここでの「好きな数」は0を選ぶことができます。0を選んだ場合、そのチョイスの指示は何も実行しません。
