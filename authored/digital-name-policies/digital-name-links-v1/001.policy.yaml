      old_text_role: retained_anchor_not_deleted
      new_text_only_added_rule: true
    - path: docs/schema/digital-link-adoption.md
      section: §3
      base_revision: 7c946d1a64d7cade48267bd4c6c39d3f39f6e2f0
      old_text: 同卡判斷不由兩端名稱相等推出，也不要求 SVE 與數位日文名稱一定相等；人工決定須明示為何是同一改編概念。
      new_text: 新增same_name只產card_id/game/ID的卡層連結，face與phase皆null，不推導進化前後。之後真人精確面是不同subject／ID，顯示其真人關係並抑制同組規則重複列。
      operation: append_scoped_rule
