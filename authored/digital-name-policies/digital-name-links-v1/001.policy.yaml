      section: §2.1
      base_revision: 7c946d1a64d7cade48267bd4c6c39d3f39f6e2f0
      old_text: 此門檻沿既有數位政策；不套 glossary 的 delegated_glossary 或模板的 approved_policy 例外。
      new_text: 新增獨立same_name政策入口的限定例外：須驗自己的真實全文核可，application以完整checked_by_rules與sample_ids=[]證明規則全查，不表示真人checked，也不借其他類別的政策授權。
      operation: append_scoped_rule
      status: proposed_not_merged
