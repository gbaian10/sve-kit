projection_recipe: approved-digital-name-document-v1
content:
  policy_id: draft-i51-names-v1
  actual_answers:
    Q1: agree
    Q2: agree
    Q3: agree
    Q4: 乙
    Q5: agree
  normative_rules:
    - id: name-scope
      text: 只處理JP實體面自己的完整日文名稱到繁中名字；不單獨採納卡關係、效果／圖／語音或coverage。same_name連結另依獨立政策，不當真正人工同卡證據；非政策same_card維持真人門檻。
      title: 只採用卡名字串
    - id: exact-owner
      text: 每個face_revision.name／已知printing_face.name驗自己的有效永久卡／面、registry/transition/source_face_map、凍結來源、語言、完整名字hash。hash命中仍比完整字串，不trim/NFKC/casefold/刪字。背面不借正面，印刷名不借current；unknown缺譯，錯證據／閉包停止建置。
      title: 自己的來源，逐字相同
    - id: full-catalogue
      text: A只讀政策釘住的整份凍結數位目錄，查所有同exact日文名ID／實際phase。每項有非null、非空、非純White_Space、無固定假名表的繁中，全體exact目標字串只有一個才合格。多ID／phase同譯可用；任一有名缺譯／異譯使該名該遊戲不合格。JA等於繁中而全漢字仍可用。完整語言、count/offset/ID/phase閉包須驗，WB用card_details；草稿、子集、latest/live不能證明唯一。
      title: 同遊戲完整目錄唯一合格繁中
    - id: game-order
      text: A先sv1；只有一代沒有exact日文名才用svwb。一代有名但A因目錄缺譯／異譯不合格，不直接借二代合格目錄。B只對owner自己合格候選取名，sv1優先，沒有合格sv1才svwb。四份條文依附表替代，same_character/name_only不能靠B供名，另有A可用；效果仍unofficial。
      title: A與B共用一代優先
    - id: human-link-exception
      text: A因合法完整目錄同名異譯／缺譯不合格，owner自己fresh同card/face、合格phase／目標語且該link成員真人確認（confirmed在checked，或sampled在sample_ids）可沿B供名，加必要同字異義指派；日文名不同的既有B仍沿原門檻。無指派拒歧義、第三張無自己B不借名。一代A不合格但有真正確認的二代合格link、無合格一代B可用二代；來源損壞／錯面／壞hash不能用B吞掉。 新same_name卡層連結永遠不能作此真正人工精確面例外。
      title: 真人同卡連結可以解目錄歧義，不繞排除
    - id: display-order
      text: 順位1：有效human/gbaian10 choice，confirmed本筆在checked或sampled本筆在sample_ids。順位2：合格A；順位3：必要時自己的有效B；順位4：其餘合法選詞，含sampled非樣本，保留真實origin；順位5：原文。只差譯文字串取勝出名並報差異，不回原文；真同字異義／壞指派仍消歧或拒絕。機器詞即使本人看過仍machine。
      title: 本人實看選詞先，差異不退原文
    - id: exclusions
      text: 最終排除名單按完整名字hash＋人寫理由排序，空清單也明示。hash在釘目錄／JP都找不到就拒。排除阻止此名任何A/B自動數位官名，不撤B關係／既有卡頁，本人有效選詞仍可用。當場勾選後重新呈現最終全文／清單／hash再核可；以後只改清單需核可完整新清單／差異，規則／目錄不變則不重核全文規則。新版本只增不改，精確前件；撤回不恢復舊版，分叉／缺號拒。 此清單不移除獨立規則連結，規則連結也不能供名繞排除；連結排除只增log不納入本卡名hash。
      title: 逐名勾選排除與有限續版
    - id: new-jp
      text: Q3實際答案agree：新JP凍結批次中的owner符合核可取名規則／釘住目錄即可沿用，不限首批再錄、不逐包重簽。每批相對前批列新增名稱hash／卡號／owner／條件，受控私有頁顯示來源名，供事後看／排除；不冒稱真人看過。共用Q3也適用連結，但本份只授權自己的名字條件；本次答案尚待最終政策核可。
      title: 新實體卡包直接沿用與事後報告
    - id: catalogue-update
      text: Q4實際答案乙（兩份共用）：A只讀有效政策版本釘住的數位批次；較新建置批次只出差異，舊結果不stale、不撤、不auto-upgrade。只有純新增、完整閉包與自己的規則條件全符，舊JA／繁中名稱、資格、所選遊戲及既有連結／對應未變，且無新增兩代異譯、排除或真人決定衝突，才允許機械續版並明示釘住新版目錄。兩代異譯、譯名改變、失去資格、既有對應變動、目標消失仍列出由維護者實看明示同意後才生效。封閉格式／loader未完成不啟用自動新增；不授權新規則／遊戲，亦不代核連結政策。
      title: 數位目錄有限新增沿用，實際Q4乙
    - id: name-versus-concept
      text: A直接name不需先配glossary概念；概念／效果引用仍需自己的有效採納與選面。直接名字與term引用可能暫時不同，差異要處理：精確委託scope內choice只增續版對齊、origin照實project/machine，本人詞／未解語義交維護者，超範圍補授權。A不能當glossary_choice.digital_name官方同概念證據，不擴約960名字的委託。
      title: 名字與效果引用、委託範圍分開
    - id: evidence-and-history
      text: 歷史核對背景從宣告的不可變Git commit驗，不比現在磁碟runtime；本次runtime另釘完整依賴。正式背景用squash後main保留commit。A回傳typed frozen NamePolicyResult，不塞假digital_link；raw/使用進source_record/F1，名字走既有translation/use/FieldTranslation，decision_id可null。完整record.verify complete閉包須完成。純A無獨立數位採納時公開digital_card/art/link空，DB仍有名字證據。
      title: 只釘來源與語意，不因程式改版重簽
    - id: stable-id
      text: A直接名字ID沿render-v1，依game、JAhash、繁中hash、詞彙recipe／context；不加term/concept，後配概念不改它。概念/choice只有實際效果引用時進該效果依賴。owner/ref、政策/收據、整批目錄、資格checker/runtime留完整F1，不造成整批名字換ID；取名recipe真語意變更引起ID更換是預期並需量測。
      title: 名字ID與概念配發分開
    - id: label-and-authority
      text: Q5實際答案agree：標示「數位版官方卡名」，只說官方數位來源字串，不表示SVE官方繁中或已確認同卡。公開origin/authority/status照真實來源與政策檢查，不用reviewed暗示本人逐字看過；本卡名政策不加公開枚舉／欄位。
      title: 畫面數位版官方卡名
    - id: approval-is-future
      text: 卡名Q1/Q2/Q3/Q5實際agree、Q4乙，名字排除空，已記2026-10-02T20:16:13.546Z送出；這只是作答。卡名最終全文／hash與空清單須另行明示同意，不代簽連結政策；兩份hash／核可事件各自有效。policy_approval_event與authorization_basis仍null；背景不是核可或樣本，本次不生成收據。
      title: 實際答案已記，最終全文仍待核可
  plain_language_rules:
    - id: name-scope
      text: 這份只決定怎麼採用卡名，不單獨確認兩張卡相同、不授權數位卡頁連結、效果、圖或語音。連結另用一份規則與核可。
      title: 這份只處理卡名
    - id: exact-owner
      text: 只看這張卡、這個面的自己的已知名字與來源。日文一字不差，不刪空白、不改標點或全半形。背面不借正面，印刷名不借現行名；不知道的就保留缺譯。壞來源不放行。
      title: 名字一字不差，而且是這張、這面的名字
    - id: full-catalogue
      text: 查指定遊戲整份凍結目錄，不只草稿選的卡。同名卡的繁中名字都要有內容、不是純空白或固定假名佔位，而且完整字串只有一種；任一缺譯或異譯就不能自動取。
      title: 查完整目錄，不只看草稿那張卡
    - id: game-order
      text: 先一代，一代完全沒有該日文名才直接用二代；一代有名但缺譯或異譯，不直接借二代目錄。真正人工確認的對應也先取有資格的一代，再二代。效果仍非官方翻譯。
      title: 卡名先用一代
    - id: human-link-exception
      text: 自動取名因同名異譯或缺譯不合格時，你自己真正確認過這張、這面的數位對應，並已把名字相同、意思不同的卡分開記錄，可以照原條件供名；沒確認的第三張卡不能借名。只是名字規則產生的連結不算這種證據。
      title: 自己的真人同卡確認可以解目錄歧義
    - id: display-order
      text: 你本人實際看過並確認的有效選詞最先；接著是合格官方名字，必要時自己真正確認的數位對應；再來其他合法譯名與原文。抽查未抽到的成員不算你親自選過。譯名不同就顯示勝出的詞並報差異，不因此退回日文。
      title: 你本人實際確認的選詞最先
    - id: exclusions
      text: 你勾掉的名字不從任何數位對應自動取名，自己實際採納的選詞仍可用。卡名與連結排除分開；改卡名清單另記明示同意、只增版本與前件，不改舊記錄。
      title: 可以逐名排除，不借連結繞過
    - id: new-jp
      text: 你第三題已選同意：新實體卡包自己的來源可驗、符合這份取名規則與指定目錄，就沿用；逐批列新增名字供事後看或排除，不假稱你看過每張。這項授權仍等你明示同意這份最終政策才生效。
      title: 新實體卡包沿用既有規則
    - id: catalogue-update
      text: 數位目錄更新採你第四題選的乙：單純新增、完整符合各自規則，而且舊名字、原來取名用的一代或二代、舊連結都沒改，也沒有新增兩代譯名衝突、排除或既有人工判斷衝突，就可以沿用。兩代異譯、譯名改變、失去資格、既有對應變動或目標消失，仍先列出，讓你實際看過同意才生效。兩份規則各自使用明確指定的凍結目錄；有較新建置來源只列差異，不偷偷換目錄。符合乙的新增仍要完整檢查並記下新版目錄與來源；工具與紀錄格式完成前不啟用自動新增。這個答案同時套用卡名與連結，但各自只授權自己規則內的條件。
      title: 數位目錄單純新增沿用，其他變動先看
    - id: name-versus-concept
      text: 卡片自己的名字可先譯，效果中引用與同字異義仍驗自己的概念與授權。這份不擴大原本約960名字的委託，不把官方名字當作整段效果的官方翻譯。
      title: 名字可以先顯示，效果引用另驗
    - id: evidence-and-history
      text: 保留真實核可、來源與之後仍能找到的當時程式版本。改程式註解或重構不讓舊採納失效；壞來源仍停止。另一份連結排除變動不要求這份卡名規則重新核可。
      title: 核可有可追溯版本，不因程式重構失效
    - id: stable-id
      text: 未改的名字不因連結或概念補配而整批換編號。取名規則的真正語意或輸出改了，才依既有名字編號辦法與差異報告處理。
      title: 沒改的名字不整批換編號
    - id: label-and-authority
      text: 這類名字標「數位版官方卡名」，表示來源是數位遊戲官方，不表示有官方實體繁中版，也不表示真人確認同卡。
      title: 畫面標『數位版官方卡名』
    - id: approval-is-future
      text: 你五題已作答：官方卡名、先用一代、新卡包沿用與來源標示都同意；第四題選乙。最終卡名排除清單為空。現在請另外看過這份全文、空清單與雜湊值，明示同意這份卡名規則才算核可；不代簽連結規則。本次尚無核可或收據。
      title: 最終全文與清單看過同意，才算核可
